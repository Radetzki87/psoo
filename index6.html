// V9 Saturation function — asymptotic to 150
// 사용자 perception의 magnitude는 ~150에서 saturate
// (시드10 V8=187 vs user_diff=4와 시드9 V8=137 vs user_diff=4는 same)
function saturate_v9(raw) {
  return 150 * (1 - Math.exp(-raw / 80));
}

// ─────────────────────────────────────────────────────────────────────
// V9 — Triple-Axis 통합 함수
// 입력: diagnostics, traceArr, puzzle (puzzle 객체 추가 — grid_n + rules 등)
// 출력: { difficulty, time, quality, structuralArchetype, affectiveArchetype, breakdown }
// ─────────────────────────────────────────────────────────────────────
function computeTraceTripleAxis_v9(diagnostics, traceArr, puzzle) {
  if (!diagnostics || !traceArr || traceArr.length === 0) {
    return {
      difficulty: 0, time: 0, quality: 0,
      structuralArchetype: 'balanced',
      affectiveArchetype: 'frictionless flow',
      breakdown: {
        // Difficulty
        effectiveCost: 0, axiomBonus: 0, advBonus: 0, holdingLoad: 0,
        peakBonus: 0, episodicLoad: 0, distributionPenalty: 0,
        rawDifficulty: 0, learningFactor: 1, velocityFactor: 1,
        translationFactor: 1,
        // Time
        baseTime: 0, sizeMultiplier: 1, holdingTime: 0,
        axiomTime: 0, stuckTimeAdjusted: 0,
        // Quality
        flow: 0, buildupQ: 0, cascadeQ: 0, progressQ: 0, richnessQ: 0,
        onboardingQ: 0, climaxQ: 0, ruleEquityQ: 0,
        placementFreedomQ: 0, sizeAppropriatenessQ: 0,
        // Raw
        avgDomain: 0, maxDomain: 0, reductionVelocity: 0,
        firstDecideAt: 0, maxGap: 0, maxGapPosition: 0,
        lateDecisions: 0, zeroRunMax: 0, entropy: 0,
        axiomBreadth: 0, dominantPct: 0, advancedRatio: 0,
        earlyAvgCost: 0, lateAvgCost: 0,
      },
    };
  }
  const L = traceArr.length;

  // ── Pattern statistics (V8 base) ──
  const counts = {};
  let totalSolverCost = 0, totalPerceivedCost = 0, maxCost = 0;
  let dominantCount = 0;
  for (const s of traceArr) {
    counts[s.type] = (counts[s.type] || 0) + 1;
    if (counts[s.type] > dominantCount) dominantCount = counts[s.type];
    totalSolverCost += getStaticCost_v7(s.type, s.cost);
    totalPerceivedCost += getPerceivedCost_v9(s.type, s.cost);
    if (s.cost > maxCost) maxCost = s.cost;
  }
  const dominantPct = dominantCount / L;
  const translationFactor = totalPerceivedCost / Math.max(1, totalSolverCost);

  let entropy = 0;
  for (const c of Object.values(counts)) {
    const p = c / L;
    if (p > 0) entropy -= p * Math.log2(p);
  }

  // Axiom breadth + diversity
  let axiomBreadth = 0;
  const axiomUses = {};
  if (typeof AXIOM_CATEGORY_MAP !== 'undefined') {
    const used = new Set();
    for (const s of traceArr) {
      const cats = AXIOM_CATEGORY_MAP[s.type] || [];
      for (const c of cats) {
        used.add(c);
        axiomUses[c] = (axiomUses[c] || 0) + 1;
      }
    }
    axiomBreadth = used.size;
  }

  const advancedRatio = traceArr.filter(s => (s.cost || 0) >= 4).length / L;

  // ── Decision timeline ──
  const decideIdxs = [];
  for (let i = 0; i < L; i++) {
    if (traceArr[i].type === 'naked-single') decideIdxs.push(i);
  }
  const firstDecideAt = decideIdxs.length > 0 ? decideIdxs[0] : L;

  let maxGap = 0, maxGapPosition = 0;
  for (let i = 1; i < decideIdxs.length; i++) {
    const gap = decideIdxs[i] - decideIdxs[i - 1];
    if (gap > maxGap) { maxGap = gap; maxGapPosition = decideIdxs[i - 1] / L; }
  }

  const cutoff = Math.floor(L * 0.75);
  const lateDecisions = decideIdxs.filter(i => i >= cutoff).length;

  // Distribution analysis (V9 NEW) — onboarding, middle, climax
  const firstQuarterIdx = Math.floor(L / 4);
  const lastThirdIdx = Math.floor(L * 2 / 3);
  const firstThirdIdx = Math.floor(L / 3);

  let earlyCostSum = 0, earlyCount = 0;
  let lateCostSum = 0, lateCount = 0;
  let firstQuarterCostSum = 0, firstQuarterCount = 0;
  for (let i = 0; i < L; i++) {
    const cost = getPerceivedCost_v9(traceArr[i].type, traceArr[i].cost);
    if (i < firstThirdIdx) { earlyCostSum += cost; earlyCount++; }
    if (i >= lastThirdIdx) { lateCostSum += cost; lateCount++; }
    if (i < firstQuarterIdx) { firstQuarterCostSum += cost; firstQuarterCount++; }
  }
  const earlyAvgCost = earlyCount > 0 ? earlyCostSum / earlyCount : 0;
  const lateAvgCost = lateCount > 0 ? lateCostSum / lateCount : 0;
  const firstQuarterAvgCost = firstQuarterCount > 0 ? firstQuarterCostSum / firstQuarterCount : 0;
  // Late > Early = climax structure (good); Early > Late = front-loaded (bad)
  const distributionDelta = lateAvgCost - earlyAvgCost;

  // ── Domain analysis (V8 base) ──
  let totalDomBefore = 0, totalDomAfter = 0;
  let maxDomain = 0, samples = 0;
  let zeroRunMax = 0, zeroRunCur = 0;
  for (const s of traceArr) {
    if (s.domainBefore !== undefined) {
      totalDomBefore += s.domainBefore;
      totalDomAfter += (s.domainAfter || 0);
      if (s.domainBefore > maxDomain) maxDomain = s.domainBefore;
      samples++;
      if (s.domainBefore > 0 && s.domainBefore === (s.domainAfter || 0)) {
        zeroRunCur++;
        if (zeroRunCur > zeroRunMax) zeroRunMax = zeroRunCur;
      } else {
        zeroRunCur = 0;
      }
    }
  }
  const avgDomain = samples > 0 ? totalDomBefore / samples : 0;
  const totalReduction = totalDomBefore - totalDomAfter;
  const reductionVelocity = totalDomBefore > 0 ? totalReduction / totalDomBefore : 0;

  // Puzzle structural data
  const grid_n = puzzle ? puzzle.n : 6;
  const numPairs = puzzle && puzzle.pairs ? puzzle.pairs.length : Math.floor(L / 4);
  const numLineRules = puzzle && puzzle.lineRules ? puzzle.lineRules.length : 0;
  const numFixedCells = puzzle && puzzle.fixedCells ? puzzle.fixedCells.length : 0;
  const numForbiddenCells = puzzle && puzzle.forbiddenCells ? puzzle.forbiddenCells.length : 0;

  // ═════════════════════════════════════════════════════════════════════
  // ║ AXIS 1: DIFFICULTY (cognitive depth)                              ║
  // ═════════════════════════════════════════════════════════════════════

  // D1: Effective Cost (V9 — perceived cost + learning factor)
  const learningFactor = dominantPct > 0.40 ? 0.55
                       : dominantPct > 0.30 ? 0.70
                       : dominantPct > 0.20 ? 0.85
                       : 1.00;
  const effectiveCost = totalPerceivedCost * learningFactor;

  // D2: Axiom diversity bonus (V9 — weighted by complexity)
  // V8 단순 × 4. V9 — 카테고리별 비대칭 가중치
  const axiomCategoryWeights = {
    'lineCount': 2,        // 빠른 산술 추론
    'lineCategory': 2,     // 패턴 매칭
    'adjacency': 3,        // 공간 추론
    'species': 3,          // 기억 부담
    'gender': 2,           // 이진 분류
    'forbidden': 4,        // 부정 추론 (어려움)
    'lookahead': 6,        // 가설 검증 (가장 어려움)
  };
  let axiomBonus = 0;
  for (const cat of Object.keys(axiomUses)) {
    axiomBonus += axiomCategoryWeights[cat] || 3;
  }

  // D3: Advanced ratio
  const advBonus = advancedRatio * L * 1.5;

  // D4: Holding Load (V9 — multi-component)
  const sqrtDom = Math.sqrt(Math.max(0, avgDomain - 6));
  const velocityFactor = reductionVelocity > 0.30 ? 0.35
                       : reductionVelocity > 0.25 ? 0.65
                       : 1.00;
  const visuoLoad = sqrtDom * L * 0.30 * velocityFactor;
  const episodicLoad = numPairs * 0.3;
  const executiveLoad = axiomBreadth * 1.5;
  const holdingLoad = visuoLoad + episodicLoad + executiveLoad;

  // D5: Peak bonus
  const peakBonus = maxCost >= 9 ? 50 : maxCost >= 5 ? 15 : 0;

  // D6: Distribution penalty (NEW)
  // Front-loaded (early > late) = unpleasant. Back-loaded (late > early) = climax = good
  // earlyAvgCost > lateAvgCost는 사용자에게 부정적 (시드5, 7 case)
  const distributionPenalty = earlyAvgCost > lateAvgCost
    ? Math.min(15, (earlyAvgCost - lateAvgCost) * L * 0.5)
    : 0;

  // V9 raw difficulty
  const rawDifficulty = effectiveCost * 0.4
                      + axiomBonus
                      + advBonus
                      + holdingLoad
                      + peakBonus
                      + distributionPenalty;

  // V9 saturated difficulty (asymptotic 150)
  const difficulty = saturate_v9(rawDifficulty);

  // ═════════════════════════════════════════════════════════════════════
  // ║ AXIS 2: TIME — V11 SOTA (시드13/14 ground truth 통합)             ║
  // ═════════════════════════════════════════════════════════════════════
  // V10 검증 (N=8 시드 시드13/14 추가 후):
  //   • V10 Pearson 0.510 (V9: 0.295)
  //   • 시드13 (V10 100% 정확) — inherent complexity dominant case
  //   • 시드14 (V10 153% over) — anchor accessibility 누락 case
  //
  // 시드14 핵심 발견 — 시드13/14 구조적 동일 (18 constraints 모두) but
  //   사용자 시간 −225s (-32%) 차이. 차이의 원인:
  //   • 시드14 첫 5 솔버 steps: 4× naked-single (즉시 결정 가능)
  //   • 시드13 첫 5 솔버 steps: 0× naked-single (추론 부담)
  //   • 사용자가 초반에 anchor를 즉시 찾으면 holdingTime 폭발 감소
  //
  // V11 새 차원 (3개):
  //   • Anchor accessibility — first-5 steps의 naked-single 비율
  //   • Positional clustering — token row/col cluster (시각적 그룹화)
  //   • Rapid learner archetype — dominantPct + breadth 결합 archetype
  //
  // V11 회귀 결과 (N=8, RMSE 124s, Pearson 0.751):
  //   • 시드13: V11 705s vs user 713s (99% ✓ — V10에서 유지)
  //   • 시드12: V11 578s vs user 582s (99% ✓ — V10 104% → V11 99% 개선)
  //   • 시드14: V11 611s vs user 488s (125% ↑ — V10 153% → V11 125% 개선)
  //   • 시드6:  V11 449s vs user 311s (144% ↑ — V10 199% → V11 144% 개선)

  // 격자 크기별 multiplier (V9 inherit)
  const sizeMultiplier = grid_n <= 4 ? 0.5
                       : grid_n === 5 ? 0.7
                       : grid_n === 6 ? 1.0
                       : grid_n === 7 ? 1.4
                       : 1.6;

  // V11 Time learning factor — RAPID LEARNER archetype 추가
  // 시드6 (dominantPct 37% + breadth 7/7) — rapid learner: aggressive 0.10
  // 시드11 (dominantPct 30% + breadth 6/7) — diverse path: standard 0.55
  // 핵심: dominantPct만으로는 부족, axiomBreadth와 결합해서 archetype 식별
  const timeLearningFactor = (dominantPct > 0.35 && axiomBreadth >= 7) ? 0.10  // V11 NEW: rapid learner
                           : dominantPct > 0.40 ? 0.35
                           : dominantPct > 0.30 ? 0.55
                           : dominantPct > 0.20 ? 0.85
                           : 1.00;

  // V11 Component 1: Observation time (V10 inherit) — 사용자 우선순위 #2
  const observationTime = grid_n * grid_n * 2.0;

  // V11 Component 2 — Anchor accessibility (NEW, 시드14 fix) ★
  // 솔버 trace의 첫 5 steps 중 naked-single 개수. 사용자에게 "즉시 결정 가능" 신호.
  // earlyAnchorRatio ∈ [0, 1]. 0이면 추론 부담, 1이면 모두 anchor.
  // anchorReduction: holdingTime을 최대 95% 감소시킴 (시드14 case)
  let firstFiveNaked = 0;
  const checkSteps = Math.min(5, traceArr.length);
  for (let i = 0; i < checkSteps; i++) {
    if (traceArr[i].type === 'naked-single') firstFiveNaked++;
  }
  const earlyAnchorRatio = checkSteps > 0 ? firstFiveNaked / 5 : 0;
  const anchorReduction = 1.0 - earlyAnchorRatio * 0.95;  // 시드14 (4/5): 1 - 0.76 = 0.24

  // V12.7: Pre-compute uncertainty for holding load (forward declaration)
  // totalPairs/uncertainty also recomputed below for breakdown reporting
  const _totalPairs_early = puzzle && puzzle.tokens ? Math.floor(puzzle.tokens.length / 2) :
                            (grid_n === 4 ? 4 : grid_n === 6 ? 9 : grid_n === 7 ? 11 : 9);
  const _uncertainty_early = Math.max(0, _totalPairs_early - numFixedCells);

  // V12.7: Uncertainty-based holding load (regression on 13 real seeds)
  // V12.9: 만족 시드 9개 calibration → V12.7의 weight 0.3/0.2 → 1.79/2.20
  //   + hold_coef 30 → 22 (만족 시드 holdingLoad가 더 큰 분산)
  // 만족 시드 검증: MAPE 19.4% (cd19d578 outlier 제외 시 13.7%)
  const holdingLoad_v12 = Math.max(0,
    _uncertainty_early * 1.79 + numLineRules * 2.20
  );
  const holdingTime = Math.sqrt(holdingLoad_v12) * 22.23 * timeLearningFactor * anchorReduction;

  // V11 Component 4: Axiom breadth (V10 inherit, linear)
  // V12.7: axiom coef 7 → 15
  // V12.9: 만족 시드 calibration → 25.88 (axiom 부담 reflective)
  const axiomTime = axiomBreadth * 25.88 * timeLearningFactor;

  // ═════════════════════════════════════════════════════════════════════
  // ║ V12 GRAND MASTER UPGRADE (시드15 fix)                              ║
  // ═════════════════════════════════════════════════════════════════════
  // V11 결정적 결함: numConstraints × 27 — 모든 constraint type 동일 가중
  //   • lineRule: 추상 추론 → +27s 정당
  //   • forbidden: 약한 제약 → +27s 과대
  //   • fixedCell: 정보 무료 → 시간 감소해야 하지만 +27s 추가됨
  //
  // 시드15 (12 fixedCells, 7×7) → V11 875s vs user 229s (+282% 폭발)
  //
  // V12 4가지 핵심 개선 (회귀 calibration: 9 시드, MAPE 8.89%, Pearson 0.9591):
  //   1. holdingLoad: uncertain pairs (half + 2·none + rules), NOT raw fixed
  //   2. inherent: drop fixedCells from numConstraints, add rule² nonlinear term
  //   3. NEW per-pair work term: (half + 2·none) × pair_w (anchor breakdown)
  //   4. NEW trivialization gate: continuous decay when fixed_ratio↑ AND rule_density↓
  //
  // 회귀 결과:
  //   • V11 MAPE 47.86% → V12 MAPE 8.89%
  //   • V11 Max err 282% → V12 Max err 22.2%
  //   • V11 Pearson 0.40 → V12 Pearson 0.96
  //   • 시드15 +282% → +0.0% (완벽)

  // V12 Anchor breakdown — 각 pair의 정보량 분류
  // pairs = total animal pairs (e.g., 9 for 6×6, 11 for 7×7)
  // fully_anchored: 양쪽 성별 모두 fixedCell로 노출 → 0 사고
  // half_anchored: 한쪽 성별만 노출 → 적당한 사고
  // no_info: 양쪽 모두 미노출 → 큰 사고 부담
  const totalPairs = puzzle && puzzle.tokens ? Math.floor(puzzle.tokens.length / 2) :
                     (grid_n === 4 ? 4 : grid_n === 6 ? 9 : grid_n === 7 ? 11 : 9);
  const fullyAnchored = Math.max(0, numFixedCells - totalPairs);
  const halfAnchored = Math.min(totalPairs, numFixedCells) - fullyAnchored;
  const noInfoPairs = totalPairs - fullyAnchored - halfAnchored;

  // ═════════════════════════════════════════════════════════════════════
  // ║ V12.5 CONSERVATIVE — Sites 16-19 Calibration Failure Response     ║
  // ═════════════════════════════════════════════════════════════════════
  // 시드16-19 (4 신규 시드) 검증 결과 V12가 +124~+217% 과대예측 폭발.
  // V12가 9 시드에 overfit 되었음을 인정.
  //
  // V12.5 정책: V11 그대로 + 단일 surgical fix만 유지
  //   1. fixedCells 가중 제거 (시드15-style over-anchored puzzle 핵심 fix)
  //   2. holdingLoad는 V11 그대로 (uncertain pair 변경 보류)
  //   3. rule², pair_work, triv factor, strong stuck 모두 보류
  //   4. 시드15 case는 acceptance gate (preRevealRatioMax)에서 처리
  //
  // 13 시드 검증 결과 (V11 vs V12 vs V12.5):
  //   - V11 MAPE 91.8% (시드16-19로 +91% 회귀)
  //   - V12 MAPE 60.6% (개선이지만 새 시드에서 catastrophic)
  //   - V12.5: 단일 fix만 유지하여 시드15 fix 효과 + V11 안정성

  // V11 backward-compat: lineRuleDimDiversity (UI 표시용)
  const lineRuleDimDiversity = puzzle && puzzle.lineRules
    ? new Set(puzzle.lineRules.map(r => r.dim)).size
    : 1;
  const dimDiversityFactor = lineRuleDimDiversity >= 2 ? 1.0 : 0.7;

  // ═════════════════════════════════════════════════════════════════════
  // ║ V12.6 UNCERTAINTY-BASED INHERENT — All-13-Seeds Validation Result ║
  // ═════════════════════════════════════════════════════════════════════
  // 13 시드 진짜 구조 데이터로 검증한 single-feature 회귀 결과:
  //   - uncertainty (pairs-fixed): Pearson 0.60 (가장 강한 단일 driver)
  //   - fixed cells: Pearson −0.35 (음의 상관 — 정보가 시간 감소시킴)
  //   - rules:        Pearson +0.24
  //   - forbid:       Pearson +0.25
  //   - V11 inherent: Pearson +0.38 (count-based의 한계)
  //
  // V12.5의 (rules+forbid)×27만으로는 부족 — uncertainty driver 누락
  // V12.6: uncertainty 중심 + 보조 features
  //
  // 13 시드 검증:
  //   - V11 MAPE 99.5% / Pearson -0.10
  //   - V12 MAPE 82.0% / Pearson +0.47
  //   - V12.5 MAPE 58.3% / Pearson +0.09
  //   - V12.6 (이 코드): uncertainty 기반 — 단일 feature만으로 Pearson 0.60
  //
  // 한계: 같은 puzzle 구조에 user time 1.86× 차이 (시드13 vs 14) — 본질적 ±25% 한계

  const uncertainty = Math.max(0, totalPairs - numFixedCells);

  // V12.7: Uncertainty-driven inherent (regression-tuned on 13 real seeds)
  // 회귀 결과 (DE optimization, 13 시드, MAPE 23.1%):
  //   - α_uncert: 20.85 (uncertainty 주요 driver)
  //   - α_rule_inh: 38.45 (line rule abstract reasoning)
  //   - α_forbid_inh: 0.0 (forbid는 inherent 기여 없음 — 약한 local 효과)
  //   - α_fixed_help: 15.0 (fixed cells provide info gain — 음의 시간)
  //
  // 13 시드 검증:
  //   - V11 MAPE 99.5%, V12 82.0%, V12.5 58.3%, V12.7 23.1%
  //   - V11 Pearson -0.10, V12.7 Pearson +0.62
  //
  // ──────────────────────────────────────────────────────────
  // V12.9 — 사용자 만족 시드 9개 우선 calibration (사용자 명시 요청)
  // ──────────────────────────────────────────────────────────
  // 사용자가 만족한 시드 9개를 critical calibration set으로 사용.
  // 옛 시드(시드6-19)는 "빠른 user 모드" (per-step ~12s)지만
  // 만족 시드는 "천천히 음미하는 user 모드" (per-step ~25s, 2× 차이).
  //
  // 사용자가 원하는 것은 만족 시드 영역에서의 정확한 시간 예측.
  // → 만족 시드만 fit (cd19d578 outlier 제외)
  //
  // V12.9 회귀 결과 (good-only, 8 시드, DE optimization):
  //   - α_uncert       +23.13  (V12.7 20.85 유지)
  //   - α_rule         +13.59  (V12.7 38.45 → 13.6, rules는 hint 효과)
  //   - α_forbid       -30.00  (NEW: forbid는 시간 감소)
  //   - α_fixed_help    +5.00  (V12.7 15 → 5, 작은 info gain)
  //   - α_breadth      +25.88  (V12.7 15 → 25.88)
  //   - α_maxgap_coef  +31.62  (NEW: maxGap이 가장 강한 driver Pearson 0.55)
  //   - hold_coef      +22.23  (V12.7 30 → 22)
  //   - transl         +2.19   (V11 1.0 → V12.9 2.19, 사용자 인지부담 2× 보정)
  //
  // 9 만족 시드 검증:
  //   - MAPE 19.4% (V12.7의 53.4%에서 2.7× 개선)
  //   - mean bias -10.7% (V12.7의 -45%에서 4× 개선)
  //   - cd19d578만 outlier (1050s vs 253s, user variance — 다른 model 불가능)
  //
  // 한계: cd19d578처럼 단순 trace + 매우 긴 user time은 fundamental floor (±25%).
  // 진짜 SOTA는 per-user calibration parameter 필요.
  const inherentComplexityTime = Math.max(0,
    uncertainty * 23.13 +
    numLineRules * 13.59 * dimDiversityFactor +
    numForbiddenCells * (-30.0) -
    Math.max(0, numFixedCells - 2) * 5.0
  );

  // V12.9 stuck penalty — coef 5 → 31.62 (만족 시드 maxGap이 가장 강한 driver)
  // threshold 12 → 5 (만족 시드 maxGap 평균 6.2, range 3-12 — 모두 stuck 경험)
  const stuckPenaltyRaw = maxGap > 5 ? (maxGap - 5) * 31.62 : 0;
  const stuckPositionFactor = 1.5 - maxGapPosition;
  const stuckTimeAdjusted = stuckPenaltyRaw * Math.max(0.5, stuckPositionFactor);

  // V12 NEW: Anchor breakdown vars derived (totalPairs/fullyAnchored/halfAnchored/noInfoPairs already declared above)
  // 시드15 같은 case의 trivialization은 acceptance gate (preRevealRatioMax)에서 처리
  const totalTokens = totalPairs * 2;
  const fixedRatio = totalTokens > 0 ? numFixedCells / totalTokens : 0;
  const ruleDensity = totalPairs > 0 ? numLineRules / totalPairs : 0;

  // V12.5 보류 변수 (breakdown schema stability)
  const pairWorkTime = 0;          // V12 metric retired
  const trivializationFactor = 1;  // V12 metric retired (now in acceptance gate)

  // V12.9 — translation factor 2.19× 적용 (만족 시드 fit 결과)
  // V12.8의 1.4× → V12.9의 2.19× (만족 시드는 사용자가 더 천천히 음미)
  // 모든 components에 곱하여 시간 예측 강화
  const V12_8_TRANSLATION_FACTOR = 2.19;
  const time = (
    observationTime * sizeMultiplier
    + holdingTime
    + axiomTime
    + inherentComplexityTime
    + stuckTimeAdjusted
  ) * V12_8_TRANSLATION_FACTOR;

  // V10/V9 backward-compatible breakdown values (UI fields)
  const baseTime = observationTime * sizeMultiplier;

  // ═════════════════════════════════════════════════════════════════════
  // ║ AXIS 3: QUALITY (experience smoothness — 10 sub-metrics)          ║
  // ═════════════════════════════════════════════════════════════════════

  // Q1: Flow (max-gap inverse)
  const flow = maxGap === 0 ? 1.0
             : maxGap <= 8 ? 1.0
             : maxGap <= 15 ? 1.0 - (maxGap - 8) * 0.05
             : Math.max(0.10, 0.65 - (maxGap - 15) * 0.04);

  // Q2: Buildup quality
  const fd = firstDecideAt;
  const buildupQ = fd === 0 ? 0.50
                 : fd <= 3 ? 0.65
                 : fd <= 7 ? 0.85
                 : fd <= 15 ? 1.00
                 : Math.max(0.50, 1.00 - (fd - 15) * 0.04);

  // Q3: Terminal cascade
  const cascadeQ = lateDecisions >= 4 ? 1.00
                 : lateDecisions === 3 ? 0.85
                 : lateDecisions === 2 ? 0.70
                 : 0.50;

  // Q4: Progress clarity
  const progressQ = zeroRunMax <= 2 ? 1.00
                  : zeroRunMax <= 5 ? 1.00 - (zeroRunMax - 2) * 0.08
                  : Math.max(0.40, 0.76 - (zeroRunMax - 5) * 0.06);

  // Q5: Richness
  const richnessQ = advancedRatio >= 0.20 && advancedRatio <= 0.40 ? 1.00
                  : advancedRatio < 0.20 ? 0.55 + advancedRatio * 2.25
                  : Math.max(0.55, 1.00 - (advancedRatio - 0.40) * 1.5);

  // Q6: Onboarding smoothness (V9 NEW) — 첫 25%의 평균 cost
  // 사용자: "초반에는 스무스하게 전개되는 구조가 괜찮았음"
  const onboardingQ = firstQuarterAvgCost <= 2 ? 1.0
                    : firstQuarterAvgCost <= 3.5 ? 1.0 - (firstQuarterAvgCost - 2) * 0.20
                    : Math.max(0.30, 0.7 - (firstQuarterAvgCost - 3.5) * 0.20);

  // Q7: Climax structure (V9 NEW) — 어려움이 후반 집중
  // 사용자: "복잡한 추론/경우의 수/가설 검증이 최후반에 배치되어 클라이막스 구조"
  const climaxQ = distributionDelta > 1.0 ? 1.0      // 후반 cost가 1+ 더 높음
                : distributionDelta > 0.3 ? 0.85     // 후반 약간 더
                : distributionDelta > -0.3 ? 0.65    // 비슷
                : Math.max(0.30, 0.5 + distributionDelta * 0.2);  // 전반 더 = 페널티

  // Q8: Rule equity (V9 NEW) — line rule의 균등 분포
  // 사용자 시드7: "전체 행/열 전체에 규약이 적용되지가 않아서 불합리"
  // 사용자 시드5: "라인 규약이 행에는 없고 열에만 공통된 규약 3개"
  let ruleEquityQ = 1.0;
  if (puzzle && puzzle.lineRules && puzzle.lineRules.length > 0) {
    const rowRules = puzzle.lineRules.filter(r => r.isRow).length;
    const colRules = puzzle.lineRules.filter(r => !r.isRow).length;
    const total = rowRules + colRules;
    if (total > 0) {
      // 균형 = 1.0 (50:50), 한쪽 100% = 0.5
      const rowRatio = rowRules / total;
      const balance = 1 - 2 * Math.abs(rowRatio - 0.5);
      // Dimension diversity (habitat vs diet)
      const dims = new Set(puzzle.lineRules.map(r => r.dim));
      const dimDiversity = dims.size >= 2 ? 1.0 : 0.6;
      ruleEquityQ = balance * dimDiversity;
    }
  }

  // Q9: Placement freedom (V9 NEW, V12 ENHANCED)
  // 사용자 시드7: "타일 배치 자유도가 제한되어서 불쾌함"
  // V12: trace 기반 trivial ratio도 함께 고려 — naked-single 직후 즉시 결정 비율
  const totalCells = grid_n * grid_n;
  const constrainedCells = numFixedCells + numForbiddenCells;
  const placementFreedomRaw = (totalCells - constrainedCells) / totalCells;
  const placementFreedomCellQ = placementFreedomRaw >= 0.6 ? 1.0
                              : placementFreedomRaw >= 0.5 ? 0.7 + (placementFreedomRaw - 0.5) * 3.0
                              : Math.max(0.20, placementFreedomRaw * 1.4);

  // V12 NEW: trace-based trivial detection
  // naked-single with cost ≤ 1 = "즉시 결정" (사고 없는 자동 결정)
  // 이 비율이 너무 높으면 puzzle가 trivial해서 placement freedom 보정
  let trivialPlacements = 0;
  for (const step of traceArr) {
    if (step.type === 'naked-single' && (step.cost || 0) <= 1) {
      trivialPlacements++;
    }
  }
  const trivialRatio = L > 0 ? trivialPlacements / L : 0;
  // trivialRatio > 0.7 → puzzle가 너무 trivial → freedomQ 감소
  const trivialDamping = trivialRatio > 0.7 ? Math.max(0.50, 1 - (trivialRatio - 0.7) * 1.5)
                       : 1.0;
  const placementFreedomQ = placementFreedomCellQ * trivialDamping;

  // Q10: Size appropriateness (V9 NEW) — grid_n × difficulty 적합성
  // 사용자: "5X5는 쉬운 난이도 전용", "7X7인데 초반부터 막히면 좀 하기 싫을 것 같다"
  let sizeAppropriatenessQ = 1.0;
  if (grid_n <= 4) {
    sizeAppropriatenessQ = difficulty < 30 ? 1.0
                         : difficulty < 50 ? 0.7
                         : Math.max(0.20, 0.5 - (difficulty - 50) * 0.005);
  } else if (grid_n === 5) {
    sizeAppropriatenessQ = difficulty < 60 ? 1.0
                         : difficulty < 90 ? 0.7
                         : Math.max(0.15, 0.4 - (difficulty - 90) * 0.005);
  } else if (grid_n === 6) {
    sizeAppropriatenessQ = 1.0;  // 자유로운 difficulty
  } else if (grid_n === 7) {
    sizeAppropriatenessQ = onboardingQ < 0.6 ? 0.5  // 큰 격자 + 초반 막힘 = 불쾌
                         : 1.0;
  }

  // V9 Quality 종합 — 10 sub-metrics
  const quality = 100 * (
    0.20 * flow +
    0.15 * buildupQ +
    0.15 * cascadeQ +
    0.10 * progressQ +
    0.10 * richnessQ +
    0.10 * onboardingQ +        // NEW
    0.08 * climaxQ +            // NEW
    0.05 * ruleEquityQ +        // NEW
    0.05 * placementFreedomQ +  // NEW
    0.02 * sizeAppropriatenessQ // NEW
  );

  // ═════════════════════════════════════════════════════════════════════
  // ║ Multi-Layer Archetype                                             ║
  // ═════════════════════════════════════════════════════════════════════
  // Layer 1: Structural (V8) — 트레이스 형상
  const structuralArchetype = classifyArchetype_v8({
    firstDecideAt, maxGap, avgDomain, reductionVelocity, dominantPct
  });

  // Layer 2: Affective (V9 NEW, V10 refined) — 정서적 인상
  // V10: choppy unease threshold 완화 (사용자 #4 우선순위)
  // 시드12 (ruleEquityQ 0.40, placementFreedomQ 1.00, flow 0.90)이
  // V9에서 'choppy unease' 잘못 분류됐지만 사용자는 만족 보고. AND 조건으로 변경.
  let affectiveArchetype;
  if (onboardingQ >= 0.85 && climaxQ >= 0.85 && cascadeQ >= 0.85) {
    affectiveArchetype = 'frictionless flow';   // 시드3-style
  } else if (climaxQ >= 0.85 && cascadeQ >= 0.70 && onboardingQ >= 0.6) {
    affectiveArchetype = 'climbing climax';     // 시드F, 시드11-style
  } else if (onboardingQ < 0.4 ||
             (ruleEquityQ < 0.35 && placementFreedomQ < 0.7) ||
             (ruleEquityQ < 0.5 && flow < 0.6)) {
    // V10: stricter — onboarding 매우 낮거나, ruleEquity 매우 낮 + freedom도 낮거나,
    // ruleEquity 낮 + flow도 끊긴 경우만 'choppy unease'.
    // 시드12 (ruleEquityQ 0.40, freedom 1.00, flow 0.90)는 더 이상 unease 아님.
    affectiveArchetype = 'choppy unease';       // 시드7, 시드5-style
  } else if (axiomBreadth >= 5 && Math.abs(distributionDelta) < 0.5) {
    affectiveArchetype = 'puzzling parade';     // 시드10-style
  } else if (avgDomain >= 9 && firstDecideAt <= 3) {
    affectiveArchetype = 'lazy revelation';     // 시드d-style
  } else {
    affectiveArchetype = 'balanced experience';
  }

  // V12 NEW: Sanity check — Difficulty/Time consistency
  // V11 difficulty와 V11 time이 따로 계산되지만 같은 trace에서 나옴
  // 둘 사이의 비율이 비정상이면 puzzle suspicious flag
  // 정상 범위: 1 difficulty ≈ 4-15s of user time
  const v12_difficultyTimeRatio = difficulty > 0 ? time / difficulty : 0;
  const v12_consistencyFlag = (v12_difficultyTimeRatio < 3 || v12_difficultyTimeRatio > 18)
    ? 'inconsistent' : 'normal';

  // V11 backward-compat: visual cluster info (UI display)
  // V12 dropped clusterReduce from inherent formula but UI still shows cluster value
  let maxAxisCluster = 0;
  if (puzzle && puzzle.tokens) {
    const rowCounts_ui = {}, colCounts_ui = {};
    for (const t of puzzle.tokens) {
      rowCounts_ui[t.row] = (rowCounts_ui[t.row] || 0) + 1;
      colCounts_ui[t.col] = (colCounts_ui[t.col] || 0) + 1;
    }
    const maxRow_ui = Object.values(rowCounts_ui).reduce((a, b) => Math.max(a, b), 0);
    const maxCol_ui = Object.values(colCounts_ui).reduce((a, b) => Math.max(a, b), 0);
    maxAxisCluster = Math.max(maxRow_ui, maxCol_ui);
  }
  const clusterReduce = 0;  // V12 deprecated — kept for breakdown schema stability

  // V12 SOTA — type-aware inherent + anchor breakdown + trivialization
  const numConstraints = numLineRules + numFixedCells + numForbiddenCells;

  // V12.9: Pattern category counts (for V6 acceptance gate satisfaction invariants)
  // 만족 시드 invariants 검증용: cat_backtrack ≤ 1, cat_lineAxis ≤ 1
  // V12.11: Backbone 3 pattern counts — 만족 시드 9/9에서 100% 등장한 패턴
  //   (naked-single, total-saturation, total-forcing) 카운트 노출
  let cat_decision = 0, cat_lineCount = 0, cat_gender = 0, cat_multiPair = 0;
  let cat_lineAxis = 0, cat_hypothesis = 0, cat_backtrack = 0;
  let pat_nakedSingle = 0, pat_totalSaturation = 0, pat_totalForcing = 0;
  let pat_impossibilityDetection = 0, pat_genderCountForcing = 0;
  let pat_binPackingForce = 0;
  if (typeof PATTERN_CATEGORY !== 'undefined' && traceArr) {
    for (const step of traceArr) {
      const cat = PATTERN_CATEGORY[step.type] || 'lineCount';
      if (cat === 'decision') cat_decision++;
      else if (cat === 'lineCount') cat_lineCount++;
      else if (cat === 'gender') cat_gender++;
      else if (cat === 'multiPair') cat_multiPair++;
      else if (cat === 'lineAxis') cat_lineAxis++;
      else if (cat === 'hypothesis') cat_hypothesis++;
      else if (cat === 'backtrack') cat_backtrack++;
      // Backbone 3 + frequent secondaries
      if (step.type === 'naked-single') pat_nakedSingle++;
      else if (step.type === 'total-saturation') pat_totalSaturation++;
      else if (step.type === 'total-forcing') pat_totalForcing++;
      else if (step.type === 'impossibility-detection') pat_impossibilityDetection++;
      else if (step.type === 'gender-count-forcing') pat_genderCountForcing++;
      else if (step.type === 'bin-packing-force') pat_binPackingForce++;
    }
  }
  // Derived: lineCount share (만족 시드 평균 44%)
  const lineCountShare = traceArr && traceArr.length > 0 ? (cat_lineCount / traceArr.length) : 0;

  return {
    difficulty, time, quality,
    structuralArchetype, affectiveArchetype,
    breakdown: {
      // Difficulty
      effectiveCost, axiomBonus, advBonus, holdingLoad, peakBonus,
      episodicLoad, executiveLoad, visuoLoad,
      distributionPenalty, distributionDelta,
      rawDifficulty, learningFactor, velocityFactor, translationFactor,
      // Time
      baseTime, sizeMultiplier, holdingTime, axiomTime, stuckTimeAdjusted,
      // V10 SOTA — new time components
      observationTime, inherentComplexityTime, numConstraints, lineRuleDimDiversity,
      // V11 SOTA — anchor accessibility + positional clustering + rapid learner
      firstFiveNaked, earlyAnchorRatio, anchorReduction,
      maxAxisCluster, clusterReduce,
      // V12 SOTA — type-aware inherent + anchor breakdown + trivialization
      pairWorkTime, trivializationFactor, fixedRatio, ruleDensity,
      fullyAnchored, halfAnchored, noInfoPairs,
      holdingLoad_v12, trivialRatio, trivialDamping,
      v12_difficultyTimeRatio, v12_consistencyFlag,
      // Quality
      flow, buildupQ, cascadeQ, progressQ, richnessQ,
      onboardingQ, climaxQ, ruleEquityQ, placementFreedomQ, sizeAppropriatenessQ,
      placementFreedomCellQ,
      // Raw
      avgDomain, maxDomain, reductionVelocity, totalReduction,
      firstDecideAt, maxGap, maxGapPosition, lateDecisions, zeroRunMax,
      entropy, axiomBreadth, dominantPct, advancedRatio,
      earlyAvgCost, lateAvgCost, firstQuarterAvgCost,
      // Structural
      grid_n, numPairs, numLineRules, numFixedCells, numForbiddenCells,
      placementFreedomRaw,
      // V12.9: Pattern category counts (for satisfaction invariant checks)
      cat_decision, cat_lineCount, cat_gender, cat_multiPair,
      cat_lineAxis, cat_hypothesis, cat_backtrack,
      // V12.11: Backbone 3 + frequent secondaries (만족 시드 sig)
      pat_nakedSingle, pat_totalSaturation, pat_totalForcing,
      pat_impossibilityDetection, pat_genderCountForcing, pat_binPackingForce,
      lineCountShare,
    },
  };
}

function computeTraceDifficulty_v5(diagnostics, traceArr) {
  if (!diagnostics || diagnostics.length === 0) return 0;
  const L = diagnostics.length;
  const C = diagnostics.totalCost;
  const D = diagnostics.maxCost;

  // (a) Advanced ratio: fraction of steps with cost ≥ 3
  const advancedSteps = traceArr.filter(s => s.cost >= 3).length;
  const advancedRatio = advancedSteps / Math.max(1, L);

  // (b) Axiom breadth: number of distinct axiom categories invoked
  const usedAxioms = new Set();
  for (const step of traceArr) {
    const cats = AXIOM_CATEGORY_MAP[step.type] || [];
    for (const c of cats) usedAxioms.add(c);
  }
  const axiomBreadth = usedAxioms.size; // 0..7

  // (c) Monotony penalty: longest run of same-cost steps as fraction of L
  let maxStreak = 1, currentStreak = 1;
  for (let i = 1; i < traceArr.length; i++) {
    if (traceArr[i].cost === traceArr[i - 1].cost) {
      currentStreak++;
      if (currentStreak > maxStreak) maxStreak = currentStreak;
    } else {
      currentStreak = 1;
    }
  }
  const monotony = maxStreak / Math.max(1, L);

  // Weights — tuned for backward calibration (Easy ~ 60-110, Medium ~ 90-150)
  const alpha = 0.3;     // length
  const beta  = 0.5;     // total cost
  const gamma = 4.0;     // peak (D²)
  const zeta  = 8.0;     // advancedRatio · L
  const eta   = 1.5;     // axiomBreadth²
  const theta = 2.0;     // monotony penalty (subtracted)

  return alpha * L
       + beta * C
       + gamma * D * D
       + zeta * advancedRatio * L
       + eta * axiomBreadth * axiomBreadth
       - theta * monotony * L;
}

function computeTraceShape(trace) {
  if (!trace || trace.length < 3) return { quality: 0.5, smoothness: 0.5, crescendo: 0.5, richness: 0.5 };
  const costs = trace.map(s => s.cost);
  const diffs = costs.slice(1).map((c, i) => Math.abs(c - costs[i]));
  const meanDiff = diffs.reduce((a, b) => a + b, 0) / diffs.length;
  const smoothness = 1 / (1 + meanDiff);
  // Linear regression slope
  const n = costs.length;
  const sumX = (n * (n - 1)) / 2;
  const sumY = costs.reduce((a, b) => a + b, 0);
  const sumXY = costs.reduce((s, y, x) => s + x * y, 0);
  const sumX2 = costs.reduce((s, _, x) => s + x * x, 0);
  const slope = (n * sumXY - sumX * sumY) / Math.max(1, n * sumX2 - sumX * sumX);
  const crescendo = 1 / (1 + Math.exp(-slope * 2));
  // Variance richness
  const meanC = sumY / n;
  const variance = costs.reduce((s, c) => s + (c - meanC) ** 2, 0) / n;
  const stddev = Math.sqrt(variance);
  const richness = 1 / (1 + Math.exp(-(stddev - 1)));
  return {
    quality: 0.4 * smoothness + 0.3 * crescendo + 0.3 * richness,
    smoothness, crescendo, richness,
  };
}


// Step 4 — Shannon-entropy normalized pattern diversity ∈ [0, 1].
// Returns 0 for empty/single-pattern trace, 1 for uniform pattern distribution.
function cdg_computePatternDiversity(diagnostics) {
  if (!diagnostics || !diagnostics.length || diagnostics.length === 0) return 0;
  const counts = diagnostics.patternCounts || {};
  const types = Object.keys(counts);
  if (types.length <= 1) return 0;

  const total = diagnostics.length;
  let entropy = 0;
  for (const type of types) {
    const p = counts[type] / total;
    if (p > 0) entropy -= p * Math.log2(p);
  }
  const maxEntropy = Math.log2(types.length);
  return maxEntropy > 0 ? entropy / maxEntropy : 0;
}

// ─────────────────────────────────────────────────────────────────────────────
// Assemble a partial puzzle from canonical + current constraints
// ─────────────────────────────────────────────────────────────────────────────
function cdg_assemblePuzzle(canonical, constraints, levelKey) {
  const config = DIFFICULTY_CONFIGS[levelKey];
  const n = config ? config.n : (canonical.tokens.length > 0 ? Math.max(...canonical.tokens.map(t => Math.max(t.row, t.col))) + 1 : 4);
  const lineRules = constraints.filter(c => c.type === 'lineRule').map((c, i) => ({
    id: `r${i}`, isRow: c.isRow, idx: c.idx, dim: c.dim, val: c.val,
  }));
  const countHints = [];
  let cnt = 0;
  for (const c of constraints) {
    if (c.type === 'totalHint') {
      countHints.push({
        id: `h${cnt++}`, type: 'total',
        row: c.isRow ? c.idx : null, col: c.isRow ? null : c.idx,
        value: c.value,
      });
    } else if (c.type === 'genderHint') {
      countHints.push({
        id: `h${cnt++}`, type: c.subtype,
        row: c.isRow ? c.idx : null, col: c.isRow ? null : c.idx,
        value: c.value,
      });
    }
  }
  const fixedCells = [];
  const preMarks = {};
  for (const c of constraints) {
    if (c.type === 'fixedCell') {
      fixedCells.push({ row: c.row, col: c.col, animalId: c.animalId, gender: c.gender });
      const t = canonical.tokens.find(t => t.row === c.row && t.col === c.col);
      if (t) preMarks[t.id] = c.gender;
    }
  }
  const forbiddenCells = constraints
    .filter(c => c.type === 'forbiddenCell')
    .map(c => [c.row, c.col]);
  return {
    n,
    tokens: canonical.tokens,
    pairs: canonical.pairs,
    lineRules, countHints, fixedCells, forbiddenCells, preMarks,
    solution: canonical.solution,
    level: levelKey,
  };
}

// =============================================================================
// SECTION 3.7v4 — SPEC-ALIGNED CDG (v4)
// =============================================================================
// 5-Step upgrade providing 5 simultaneous formal guarantees:
//   1. Soundness          — exactly one solution
//   2. Axiom Preservation — countCoverage 100%, all lines have Total + H1
//   3. Difficulty Bound   — traceDifficulty ∈ [tier.min, tier.max]
//   4. Minimality         — every constraint is essential
//   5. Pattern Diversity  — Shannon entropy ≥ tier.min_diversity
//
// Implementation strategy: reuse classic Stage A-C for axiom layer (Step 1),
// then trace-target adjust (Step 2), type-priority prune (Step 3), pattern
// diversity check (Step 4), all powered by traceSolve_v2 (Step 5).
// =============================================================================

// ──── Step 1: Axiom Instance Builder ────────────────────────────────────────
// Reuses classic Stage A-C unchanged. Tries up to MAX_BUILD_ATTEMPTS times
// internally (matching classic's per-attempt retry pattern) since each
// individual call has 30-70% success rate due to coverage constraints.
function cdg_buildAxiomInstance(level, config) {
  const MAX_BUILD_ATTEMPTS = 50;
  for (let attempt = 0; attempt < MAX_BUILD_ATTEMPTS; attempt++) {
    const inst = cdg_buildAxiomInstanceOnce(level, config);
    if (inst) return inst;
  }
  return null;
}

// V12.22: Async 협력적 버전 — 5회 시도마다 yield해서 메인 스레드 freeze 방지
// 각 호출이 worst case 1-2초까지 갈 수 있으므로 sync loop 동안 progress UI freeze.
// async 버전은 5회마다 yield → React render + onProgress 갱신 가능.
// deadlineMs를 받으면 그 시점에 abort.
async function cdg_buildAxiomInstanceAsync(level, config, deadlineMs) {
  const MAX_BUILD_ATTEMPTS = 50;
  for (let attempt = 0; attempt < MAX_BUILD_ATTEMPTS; attempt++) {
    if (deadlineMs != null && performance.now() > deadlineMs) return null;
    const inst = cdg_buildAxiomInstanceOnce(level, config);
    if (inst) return inst;
    // 5회마다 yield (overhead vs responsiveness 균형)
    if ((attempt + 1) % 5 === 0) {
      await new Promise(r => setTimeout(r, 0));
    }
  }
  return null;
}

function cdg_buildAxiomInstanceOnce(level, config) {
  // Stage A: rule template
  const ruleTemplate = designRuleTemplate(config, ANIMALS);
  if (!ruleTemplate) return null;

  // Forbidden cells
  const forbiddenCount = Array.isArray(config.forbiddenCount)
    ? randInt(config.forbiddenCount[0], config.forbiddenCount[1])
    : (config.forbiddenCount || 0);
  const allCells = [];
  for (let r = 0; r < config.n; r++) {
    for (let c = 0; c < config.n; c++) allCells.push([r, c]);
  }
  const forbiddenCells = shuffle(allCells).slice(0, forbiddenCount);

  // Stage B: placement
  const placement = constrainedAdjacentPlacement(config, ruleTemplate, forbiddenCells, ANIMALS);
  if (!placement) return null;

  // Coverage validation: every rule line has at least one token
  for (const rule of ruleTemplate) {
    const lineTokens = rule.isRow
      ? placement.tokens.filter(t => t.row === rule.idx)
      : placement.tokens.filter(t => t.col === rule.idx);
    if (lineTokens.length === 0) return null;
  }

  // Gender assignment with rule-aware logic
  const solution = assignGendersWithRules(placement.pairs, placement.tokens, ruleTemplate);
  if (!solution) return null;

  // Stage C: AXIOM-PRESERVING auxiliary hints
  const instance = addAuxiliaryHints(placement, config, solution, ruleTemplate, forbiddenCells);

  // Coverage validation: every rule line has at least one non-fixed token
  const fixedTokenIds = new Set(Object.keys(instance.preMarks || {}));
  for (const rule of ruleTemplate) {
    const lineTokens = rule.isRow
      ? placement.tokens.filter(t => t.row === rule.idx)
      : placement.tokens.filter(t => t.col === rule.idx);
    const nonFixed = lineTokens.filter(t => !fixedTokenIds.has(t.id));
    if (nonFixed.length === 0) return null;
  }

  return Object.assign({}, instance, { solution, ruleTemplate });
}

// Convert axiom instance (classic puzzle format) to CDG's internal constraint list.
function cdg_axiomToConstraints(instance) {
  const constraints = [];

  for (const r of instance.lineRules) {
    constraints.push({
      type: 'lineRule', isRow: r.isRow, idx: r.idx, dim: r.dim, val: r.val,
    });
  }

  for (const h of instance.countHints) {
    if (h.type === 'total') {
      constraints.push({
        type: 'totalHint',
        isRow: h.row !== null && h.row !== undefined,
        idx: (h.row !== null && h.row !== undefined) ? h.row : h.col,
        value: h.value,
      });
    } else if (h.type === 'H1' || h.type === 'H2') {
      constraints.push({
        type: 'genderHint', subtype: h.type,
        isRow: h.row !== null && h.row !== undefined,
        idx: (h.row !== null && h.row !== undefined) ? h.row : h.col,
        value: h.value,
      });
    }
  }

  for (const fc of (instance.fixedCells || [])) {
    constraints.push({
      type: 'fixedCell', row: fc.row, col: fc.col,
      animalId: fc.animalId, gender: fc.gender,
    });
  }

  for (const fc of (instance.forbiddenCells || [])) {
    const [row, col] = fc;
    constraints.push({ type: 'forbiddenCell', row, col });
  }

  return constraints;
}

// ──── Step 2: Trace-Targeted FixedCell Adjustment ───────────────────────────
// Adjusts the fixedCell layer so that traceSolve_v2 yields difficulty within
// the tier's [min, max] range. 4-case decision tree:
//   in-range  → done
//   too easy  → remove fixedCell
//   too hard  → add fixedCell to ease
//   stuck     → add fixedCell to break unsolvability
function cdg_adjustFixedCellsForDifficulty(constraints, canonical, level, options) {
  const tier = TRACE_DIFFICULTY_TIERS[level];
  const opts = Object.assign({
    maxIterations: 18,
    perStepTimeMs: 200,
    totalTimeBudget: 6000,
    candidateSampleSize: 8,
    externalDeadlineMs: null,                      // V12.24: 외부 watchdog
  }, options || {});
  const startTime = performance.now();
  let current = [...constraints];

  // V12.24: 시간 한도 = self budget AND external deadline 중 빠른 쪽
  const checkTimeUp = () => {
    if (performance.now() - startTime > opts.totalTimeBudget) return true;
    if (opts.externalDeadlineMs != null && performance.now() > opts.externalDeadlineMs) return true;
    return false;
  };

  let puzzle = cdg_assemblePuzzle(canonical, current, level);
  let trace = traceSolve_v2(puzzle, {
    timeLimitMs: opts.perStepTimeMs * 4,
    maxLookaheadDepth: 1,
  });

  for (let iter = 0; iter < opts.maxIterations; iter++) {
    if (checkTimeUp()) {                          // V12.24: external deadline 통합
      return { constraints: current, trace, action: 'iteration-exhausted', iterations: iter };
    }

    if (trace.status === 'solved') {
      const diff = computeTraceDifficulty(trace.diagnostics);

      if (diff >= tier.min && diff <= tier.max) {
        return { constraints: current, trace, action: 'in-range', iterations: iter };
      }

      if (diff < tier.min) {
        const removed = pickFixedCellToRemove(current, canonical, level, tier, opts);
        if (!removed) {
          return { constraints: current, trace, action: 'too-easy-stuck', iterations: iter };
        }
        current = current.filter(c => c !== removed);
      } else { // diff > tier.max
        const added = pickFixedCellToAdd(current, canonical, level, tier, opts);
        if (!added) {
          return { constraints: current, trace, action: 'too-hard-stuck', iterations: iter };
        }
        current = [...current, added];
      }
    } else if (trace.status === 'requires-search' || trace.status === 'too-many-steps') {
      const added = pickFixedCellToBreakStuck(current, canonical, level, opts);
      if (!added) {
        return { constraints: current, trace, action: 'unsolvable', iterations: iter };
      }
      current = [...current, added];
    } else {
      return { constraints: current, trace, action: 'failed', iterations: iter };
    }

    puzzle = cdg_assemblePuzzle(canonical, current, level);
    trace = traceSolve_v2(puzzle, {
      timeLimitMs: opts.perStepTimeMs * 4,
      maxLookaheadDepth: 1,
    });
  }

  return { constraints: current, trace, action: 'iteration-exhausted', iterations: opts.maxIterations };
}

// REMOVE: keep uniqueness AND difficulty ≤ tier.max, score by ideal proximity
function pickFixedCellToRemove(constraints, canonical, level, tier, opts) {
  const fixedCells = constraints.filter(c => c.type === 'fixedCell');
  if (fixedCells.length === 0) return null;

  let best = null, bestScore = -Infinity;
  for (const fc of fixedCells) {
    const reduced = constraints.filter(c => c !== fc);
    const puzzle = cdg_assemblePuzzle(canonical, reduced, level);

    const verify = enumerateSolutions(puzzle, ANIMALS, 2, opts.perStepTimeMs);
    if (verify.solutions.length !== 1 || verify.timedOut) continue;

    const trace = traceSolve_v2(puzzle, { timeLimitMs: opts.perStepTimeMs * 2, maxLookaheadDepth: 1 });
    if (trace.status !== 'solved') continue;

    const diff = computeTraceDifficulty(trace.diagnostics);
    if (diff > tier.max) continue;

    const score = -Math.abs(diff - tier.ideal);
    if (score > bestScore) { bestScore = score; best = fc; }
  }
  return best;
}

// ADD: keep difficulty ≥ tier.min and bring closer to ideal
function pickFixedCellToAdd(constraints, canonical, level, tier, opts) {
  const fixedSet = new Set(constraints
    .filter(c => c.type === 'fixedCell')
    .map(c => `${c.row},${c.col}`));
  const candidates = canonical.tokens.filter(t => !fixedSet.has(`${t.row},${t.col}`));
  if (candidates.length === 0) return null;

  const K = Math.min(opts.candidateSampleSize, candidates.length);
  const sampled = shuffle([...candidates]).slice(0, K);

  let best = null, bestScore = -Infinity;
  for (const t of sampled) {
    const newFixed = {
      type: 'fixedCell', row: t.row, col: t.col,
      animalId: t.animalId, gender: canonical.solution[t.id],
    };
    const augmented = [...constraints, newFixed];
    const puzzle = cdg_assemblePuzzle(canonical, augmented, level);

    const trace = traceSolve_v2(puzzle, { timeLimitMs: opts.perStepTimeMs * 2, maxLookaheadDepth: 1 });
    if (trace.status !== 'solved') continue;

    const diff = computeTraceDifficulty(trace.diagnostics);
    if (diff < tier.min) continue;

    const score = -Math.abs(diff - tier.ideal);
    if (score > bestScore) { bestScore = score; best = newFixed; }
  }
  return best;
}

// BREAK STUCK: maximize traceSolve progress (decided pair count)
function pickFixedCellToBreakStuck(constraints, canonical, level, opts) {
  const fixedSet = new Set(constraints
    .filter(c => c.type === 'fixedCell')
    .map(c => `${c.row},${c.col}`));
  const candidates = canonical.tokens.filter(t => !fixedSet.has(`${t.row},${t.col}`));
  if (candidates.length === 0) return null;

  const K = Math.min(opts.candidateSampleSize, candidates.length);
  const sampled = shuffle([...candidates]).slice(0, K);

  let best = null, bestProgress = -1;
  for (const t of sampled) {
    const newFixed = {
      type: 'fixedCell', row: t.row, col: t.col,
      animalId: t.animalId, gender: canonical.solution[t.id],
    };
    const augmented = [...constraints, newFixed];
    const puzzle = cdg_assemblePuzzle(canonical, augmented, level);

    const trace = traceSolve_v2(puzzle, { timeLimitMs: opts.perStepTimeMs, maxLookaheadDepth: 1 });
    let progress;
    if (trace.status === 'solved') {
      progress = canonical.pairs.length;
    } else if (trace.finalState && trace.finalState.activePairs) {
      progress = canonical.pairs.length - trace.finalState.activePairs.length;
    } else {
      progress = 0;
    }
    if (progress > bestProgress) {
      bestProgress = progress; best = newFixed;
    }
  }
  return best;
}

// ──── Step 3: Type-Priority Minimality with Trace Bound ─────────────────────
// Two prune-order variants:
//
// LOOSE: minimality maximally aggressive. All constraint types prunable.
//        Hints can be removed if puzzle stays unique + in difficulty range.
//        Result: leanest possible puzzle, but may break "all lines have
//        Total + H1" noogram-paradigm axiom.
//
// STRICT: hint axiom inviolable. Only fixedCell, forbiddenCell, lineRule
//         are prunable. Total/Gender hints always preserved across all
//         lines that addAuxiliaryHints populated. This guarantees the
//         classic-aligned axiom structure visible to the player.
//
// LineRule survives last in both orders (most aesthetic value).
const CDG_PRUNE_ORDER_LOOSE  = ['fixedCell', 'forbiddenCell', 'genderHint', 'totalHint', 'lineRule'];
const CDG_PRUNE_ORDER_STRICT = ['fixedCell', 'forbiddenCell', 'lineRule'];
// Legacy alias — defaults to STRICT (axiom-preserving) behavior
const CDG_PRUNE_ORDER = CDG_PRUNE_ORDER_STRICT;

// ═══════════════════════════════════════════════════════════════════════════
// SOTA CONSTRAINT-DRIVEN UNIQUENESS FORCING v3 (cdg_forceUniqueness)
// ═══════════════════════════════════════════════════════════════════════════
// Algorithm: Iteratively add minimum constraints to kill alternate solutions.
//
// Empirical: 6x6 random axiom puzzle has median 4-11 solutions. Random
// sampling success rate for unique=1: 0%. Adjust/prune phases preserve
// solution count rather than reduce it.
//
// SOTA approach (analogous to MaxSAT min-cost constraint addition):
//   Phase 1: Adaptive enumeration (K starts at 3, grows up to 10)
//   Phase 2: Single-shot kill priority (cell that kills ALL alternates)
//   Phase 3: Greedy kill score selection (max alternates killed per cell)
//   Phase 4: 2-cell set cover fallback (when greedy stalls)
//   Phase 5: Incremental verify (K=2 quick check after each addition)
//
// Key insight: each pair is anchored to a specific animalId. Solutions differ
// in WHERE that animal goes (and gender at each placement). Adding a fixedCell
// (animalId + row + col + gender) kills all alternates where that specific
// animal is somewhere else.
//
// Mathematical guarantee: each iteration kills ≥ 1 alternate (we only add
// cells where canonical and at least one alternate disagree).
//
// Performance (verified):
//   • 6x6 axiom puzzle: 11 solutions → 1, +4.1 cells avg, 109ms avg, 30/30 unique
//   • 7x7 axiom puzzle: 13 solutions → 1, +5-7 cells, 600-1500ms typical
//   • Worst case: 1141ms (rare timeout edge case)
function cdg_forceUniqueness(canonical, constraints, levelKey, options) {
  const opts = Object.assign({
    maxIterations: 8,                // 10 → 8
    maxAlternateSolutions: 6,        // 10 → 6 (axiom puzzle median 4-7 alts)
    perVerifyTimeMs: 600,            // 1500 → 600 (faster cycle)
    quickVerifyTimeMs: 250,          // 600 → 250
    initialK: 2,                     // 3 → 2 (start smaller)
    totalTimeBudget: 8000,           // 12000 → 8000
    fixedCellBudget: 8,
    enableTwoCellLookahead: true,    // try 2-cell combos when greedy stalls
    targetMaxSolutions: 1,           // stop when solutions ≤ this (Custom: maxSol)
    onProgress: null,                // optional sub-progress reporter for UI
  }, options || {});

  const startTime = performance.now();
  let result = [...constraints];
  let cellsAdded = 0;

  const tokensById = new Map();
  for (const t of canonical.tokens) tokensById.set(t.id, t);

  const existingFixedKeys = new Set();
  for (const c of result) {
    if (c.type === 'fixedCell') existingFixedKeys.add(`${c.row},${c.col}`);
  }

  const canonicalPairs = canonical.pairs.map(p => Array.isArray(p) ? p : (p.tokens || p));

  // Build canonical placement (pairIdx → {animalId, cell1, cell2, g1, g2})
  // This is fixed across iterations.
  const canonPlacement = {};
  for (let i = 0; i < canonicalPairs.length; i++) {
    const tids = canonicalPairs[i];
    const t0 = tokensById.get(tids[0]);
    const t1 = tokensById.get(tids[1]);
    if (!t0 || !t1) continue;
    canonPlacement[i] = {
      animalId: t0.animalId,
      cell1: `${t0.row},${t0.col}`,
      cell2: `${t1.row},${t1.col}`,
      g1: canonical.solution[tids[0]],
      g2: canonical.solution[tids[1]],
      c1row: t0.row, c1col: t0.col,
      c2row: t1.row, c2col: t1.col,
    };
  }

  // Helper: convert enumerated sol to per-pair placement
  const solToPlacement = (sol, puzzle, puzzleTokens) => {
    const placement = {};
    for (const [pairIdx, cand] of Object.entries(sol)) {
      const pair = puzzle.pairs[pairIdx];
      const tids = Array.isArray(pair) ? pair : (pair.tokens || pair);
      const t0 = puzzleTokens.get(tids[0]);
      placement[pairIdx] = {
        animalId: t0 ? t0.animalId : null,
        cell1: cand.c1key, cell2: cand.c2key,
        g1: cand.g1, g2: cand.g2,
        c1row: cand.c1row, c1col: cand.c1col,
        c2row: cand.c2row, c2col: cand.c2col,
      };
    }
    return placement;
  };

  // Helper: check if a placement matches canonical exactly
  const isEquivToCanonical = (placement) => {
    for (const pairIdx of Object.keys(canonPlacement)) {
      const c = canonPlacement[pairIdx];
      const s = placement[pairIdx];
      if (!s) return false;
      const sameCells = (s.cell1 === c.cell1 && s.cell2 === c.cell2) ||
                        (s.cell1 === c.cell2 && s.cell2 === c.cell1);
      if (!sameCells) return false;
      if (s.cell1 === c.cell1) {
        if (s.g1 !== c.g1 || s.g2 !== c.g2) return false;
      } else {
        if (s.g1 !== c.g2 || s.g2 !== c.g1) return false;
      }
    }
    return true;
  };

  // Helper: check if cell+gender lock kills given alternate
  const cellKillsAlternate = (cellPick, alt) => {
    for (const pairIdx of Object.keys(canonPlacement)) {
      const altPair = alt[pairIdx];
      if (!altPair) continue;
      // If this pair's animalId matches our cellPick's animal,
      // check if alternate has it at our cell with our gender
      if (altPair.animalId === cellPick.animalId) {
        let hasMatch = false;
        if (altPair.cell1 === cellPick.cellKey && altPair.g1 === cellPick.gender) hasMatch = true;
        if (altPair.cell2 === cellPick.cellKey && altPair.g2 === cellPick.gender) hasMatch = true;
        if (!hasMatch) return true; // alternate doesn't have this animal+cell+gender → killed
        return false; // alternate matches → not killed
      }
    }
    return false;
  };

  // Build candidate cells (cells in canonical placement, not yet fixed)
  const buildCandidateCells = () => {
    const cells = [];
    const seenKeys = new Set();
    for (const pairIdx of Object.keys(canonPlacement)) {
      const c = canonPlacement[pairIdx];
      for (const pick of [
        { row: c.c1row, col: c.c1col, animalId: c.animalId, gender: c.g1, cellKey: c.cell1 },
        { row: c.c2row, col: c.c2col, animalId: c.animalId, gender: c.g2, cellKey: c.cell2 },
      ]) {
        if (existingFixedKeys.has(pick.cellKey)) continue;
        if (seenKeys.has(pick.cellKey)) continue;
        seenKeys.add(pick.cellKey);
        cells.push(pick);
      }
    }
    return cells;
  };

  // Adaptive K — increase if previous iteration showed many alternates
  let currentK = opts.initialK;

  for (let iter = 0; iter < opts.maxIterations; iter++) {
    const elapsed = performance.now() - startTime;
    if (elapsed > opts.totalTimeBudget) {
      return { constraints: result, status: 'time-budget', cellsAdded };
    }
    // V12.24: 외부 watchdog deadline 체크 (없으면 무시)
    if (opts.externalDeadlineMs != null && performance.now() > opts.externalDeadlineMs) {
      return { constraints: result, status: 'external-deadline', cellsAdded };
    }
    if (cellsAdded >= opts.fixedCellBudget) {
      return { constraints: result, status: 'cell-budget', cellsAdded };
    }

    // Phase 1: Adaptive enumeration
    const puzzle = cdg_assemblePuzzle(canonical, result, levelKey);
    const puzzleTokens = new Map();
    for (const t of puzzle.tokens) puzzleTokens.set(t.id, t);

    // Time per enumeration: scale down as we get closer to budget
    // V12.24 SOTA FIX: 사용자 5초 freeze의 진짜 원인
    //   이전: Math.max(300, ...) — 외부에서 perVerifyTimeMs를 50ms로 설정해도
    //         300ms floor가 우선되어 모든 watchdog cap 무용지물.
    //         8 iter × 300ms = 2.4초 단일 forceUniqueness 호출 freeze.
    //   현재: Math.max(50, ...) — minimum 50ms로 단축. 외부 cap 진짜로 작동.
    const remainingTime = opts.totalTimeBudget - elapsed;
    let verifyTime = Math.min(opts.perVerifyTimeMs, Math.max(50, remainingTime / Math.max(1, opts.maxIterations - iter)));
    // V12.24: external watchdog 잔여 시간으로 추가 cap → 단일 enum 호출이 watchdog 넘지 못함
    if (opts.externalDeadlineMs != null) {
      const externalRemain = opts.externalDeadlineMs - performance.now();
      if (externalRemain <= 0) {
        return { constraints: result, status: 'external-deadline', cellsAdded };
      }
      // 단일 호출이 external 잔여의 80% 이상 못 씀
      verifyTime = Math.min(verifyTime, Math.max(20, externalRemain * 0.8));
    }

    const enumResult = enumerateSolutions(puzzle, ANIMALS, currentK, verifyTime);

    if (enumResult.solutions.length <= opts.targetMaxSolutions && !enumResult.timedOut) {
      return { constraints: result, status: 'within-target', cellsAdded, iterations: iter };
    }
    if (enumResult.solutions.length === 0) {
      return { constraints: result, status: enumResult.timedOut ? 'enum-timeout' : 'no-solutions', cellsAdded };
    }

    // Build alternates (filter out canonical-equivalent)
    const solPlacements = enumResult.solutions.map(sol => solToPlacement(sol, puzzle, puzzleTokens));
    const alternates = solPlacements.filter(p => !isEquivToCanonical(p));

    // Within target tolerance — accept (1 canonical + alternates ≤ targetMaxSolutions)
    if (alternates.length <= Math.max(0, opts.targetMaxSolutions - 1)) {
      return { constraints: result, status: 'within-target-equiv', cellsAdded, iterations: iter };
    }

    // Report sub-progress: "iter N/M, alternates=A, cellsAdded=C"
    if (typeof opts.onProgress === 'function') {
      opts.onProgress({
        iter: iter + 1,
        maxIter: opts.maxIterations,
        alternates: alternates.length,
        cellsAdded,
        cellBudget: opts.fixedCellBudget,
      });
    }

    // Phase 2: Single-shot kill priority — cell that kills ALL alternates
    const candidateCells = buildCandidateCells();
    const killScores = candidateCells.map(cell => {
      let kills = 0;
      for (const alt of alternates) {
        if (cellKillsAlternate(cell, alt)) kills++;
      }
      return { cell, kills };
    });

    // Sort by kill count descending
    killScores.sort((a, b) => b.kills - a.kills);

    const topKill = killScores[0];
    if (!topKill || topKill.kills === 0) {
      // Cannot distinguish with single fixed cell — try 2-cell combos
      if (opts.enableTwoCellLookahead && alternates.length >= 2) {
        // Phase 4: 2-cell set cover (limited search to avoid O(n²) blow-up)
        const TOP_CANDIDATES = Math.min(8, candidateCells.length);
        let bestPair = null, bestPairKills = 0;
        for (let i = 0; i < TOP_CANDIDATES; i++) {
          for (let j = i + 1; j < TOP_CANDIDATES; j++) {
            // Combined kill = union of alternate sets killed by either cell
            let combinedKills = 0;
            for (const alt of alternates) {
              if (cellKillsAlternate(candidateCells[i], alt) ||
                  cellKillsAlternate(candidateCells[j], alt)) {
                combinedKills++;
              }
            }
            if (combinedKills > bestPairKills) {
              bestPairKills = combinedKills;
              bestPair = [candidateCells[i], candidateCells[j]];
            }
          }
        }
        if (bestPair && bestPairKills > 0) {
          for (const cell of bestPair) {
            result.push({
              type: 'fixedCell',
              row: cell.row, col: cell.col,
              animalId: cell.animalId, gender: cell.gender,
            });
            existingFixedKeys.add(cell.cellKey);
            cellsAdded++;
          }
          continue;
        }
      }
      return { constraints: result, status: 'cannot-distinguish', cellsAdded };
    }

    // Phase 3: Add the top-killing cell
    result.push({
      type: 'fixedCell',
      row: topKill.cell.row, col: topKill.cell.col,
      animalId: topKill.cell.animalId, gender: topKill.cell.gender,
    });
    existingFixedKeys.add(topKill.cell.cellKey);
    cellsAdded++;

    // Phase 5: Incremental verify if we believe we may have killed everything
    // (single-shot detection: if topKill.kills === alternates.length AND all enumerated)
    if (topKill.kills === alternates.length && !enumResult.timedOut) {
      // Quick check with K=2
      const quickPuzzle = cdg_assemblePuzzle(canonical, result, levelKey);
      const quickEnum = enumerateSolutions(quickPuzzle, ANIMALS, 2, opts.quickVerifyTimeMs);
      if (quickEnum.solutions.length === 1 && !quickEnum.timedOut) {
        return { constraints: result, status: 'unique-fast', cellsAdded, iterations: iter };
      }
      // If still multi, continue (alternate enumeration was incomplete)
    }

    // Adapt K for next iteration
    if (enumResult.timedOut) {
      currentK = Math.max(opts.initialK, Math.min(currentK, 5)); // cap K when timing out
    } else if (alternates.length >= currentK - 1) {
      currentK = Math.min(opts.maxAlternateSolutions, currentK + 2); // grow if hitting cap
    }
  }

  return { constraints: result, status: 'iter-exhausted', cellsAdded };
}

function cdg_pruneRedundantWithTrace(canonical, constraints, levelKey, options) {
  const opts = Object.assign({
    perVerifyTimeMs: 400,
    perTraceTimeMs: 300,
    enforceDiffBound: true,
    totalTimeBudget: 6000,
    pruneOrder: CDG_PRUNE_ORDER_STRICT, // default: axiom-preserving
    externalDeadlineMs: null,           // V12.24: 외부 watchdog deadline (옵셔널)
  }, options || {});
  const tier = TRACE_DIFFICULTY_TIERS[levelKey];
  const startTime = performance.now();
  let result = [...constraints];

  // V12.24: 시간 한도를 external watchdog와 자체 budget의 minimum으로
  const checkTimeUp = () => {
    if (performance.now() - startTime > opts.totalTimeBudget) return true;
    if (opts.externalDeadlineMs != null && performance.now() > opts.externalDeadlineMs) return true;
    return false;
  };

  for (const type of opts.pruneOrder) {
    if (checkTimeUp()) break;
    const ofType = result.filter(c => c.type === type);
    const shuffled = shuffle([...ofType]);

    for (const c of shuffled) {
      if (checkTimeUp()) break;
      const reduced = result.filter(x => x !== c);
      const puzzle = cdg_assemblePuzzle(canonical, reduced, levelKey);

      // Test 1: uniqueness preserved
      const verify = enumerateSolutions(puzzle, ANIMALS, 2, opts.perVerifyTimeMs);
      if (verify.solutions.length !== 1 || verify.timedOut) continue;

      // Test 2: difficulty bound preserved (if tier defined and enforced)
      if (opts.enforceDiffBound && tier) {
        const trace = traceSolve_v2(puzzle, {
          timeLimitMs: opts.perTraceTimeMs,
          maxLookaheadDepth: 1,
        });
        if (trace.status !== 'solved') continue;
        const diff = computeTraceDifficulty(trace.diagnostics);
        if (diff < tier.min || diff > tier.max) continue;
      }

      // Both tests pass — c is redundant
      result = reduced;
    }
  }

  return result;
}

// ──── Step 4 + Integration: Two CDG v4 variants ────────────────────────────
// Both variants share the same Step 1-2-4-5 pipeline and differ only in
// Step 3 (minimality prune order):
//
//   v4-loose:  prunes [fixedCell, forbiddenCell, genderHint, totalHint, lineRule]
//              → leanest puzzle; hint axiom may be violated
//
//   v4-strict: prunes [fixedCell, forbiddenCell, lineRule] only
//              → preserves "every line has Total + H1" axiom
//
// Both still satisfy Soundness, Difficulty Bound, Pattern Diversity. The
// difference is whether minimality may erode the noogram-paradigm axiom.
// ────────────────────────────────────────────────────────────────────────────
async function generatePuzzleCDG_v4_core(level, onProgress, pruneOrder, engineTag) {
  const config = DIFFICULTY_CONFIGS[level];
  if (!config) return null;
  const tier = TRACE_DIFFICULTY_TIERS[level];
  const startTime = performance.now();
  const TOTAL_BUDGET = config.totalBudgetMs || 20000;
  // SOTA: grid-aware MAX_RETRIES — 7x7는 retry당 시간이 길어 5번 다 돌면 budget 초과 가능.
  // 사용자 명시 "20초 이내" 한도를 지키기 위해 7x7에서 retry 수 단축.
  // Empirical: 7x7 Hard7 retry당 4-6s × 3 = 12-18s ≤ 20s budget.
  const MAX_RETRIES = config.n >= 7 ? 3 : 5;

  // Custom-level: preserve the user's exact fixedTileCount and forbiddenCount.
  // The Step 2 (difficulty adjustment) and Step 3 (minimality pruning) both
  // alter these counts to satisfy difficulty/uniqueness goals — for preset
  // tiers that's the right behavior, but for Custom the user explicitly
  // specified the counts and expects them honored.
  const isCustom = !!config.isCustom;
  let bestFallback = null;

  for (let retry = 0; retry < MAX_RETRIES; retry++) {
    if (performance.now() - startTime > TOTAL_BUDGET) break;

    onProgress && onProgress({
      phase: engineTag + '-attempt',
      retry,
      maxRetries: MAX_RETRIES,
      attempts: retry + 1,
      elapsed: performance.now() - startTime,
      budget: TOTAL_BUDGET,
      currentMaxSolutions: config.maxSolutions || 1,
      level,
    });
    await new Promise(r => setTimeout(r, 0));

    // ═══ V12.22 SOTA — Per-retry Watchdog 추가 ═══ (V12.23 tightened)
    // 사용자 보고: "초기화 중 + 5초 freeze" — 진짜 원인은 v4_core 내부 4개 동기 함수
    // (cdg_buildAxiomInstance / cdg_adjustFixedCellsForDifficulty / cdg_forceUniqueness
    //  / cdg_pruneRedundantWithTrace)가 누적되어 한 retry가 10-15초 소모 가능했던 점.
    //
    // V12.23: 단일 retry 한도를 모두 2초 이하로 강제 (이전: 1.5/2.5/4초/6초)
    const retryStartMs = performance.now();
    const retryWatchdogMs = retry === 0 ? (config.n >= 7 ? 1500 : 1200)
                          : retry === 1 ? (config.n >= 7 ? 2000 : 1800)
                          :                (config.n >= 7 ? 2500 : 2000);
    const retryDeadline = retryStartMs + retryWatchdogMs;
    const remainingForRetry = () => Math.max(50, retryDeadline - performance.now());

    // Step 1: Classic-aligned axiom layer (async with deadline → no freeze)
    // V12.22: 동기 50회 loop을 async 버전으로 교체. 5회마다 yield하므로
    // axiom build 단계에서 1-2초 freeze 가능성 제거.
    await new Promise(r => setTimeout(r, 0));
    const instance = await cdg_buildAxiomInstanceAsync(level, config, retryDeadline);
    if (!instance) continue;
    if (performance.now() > retryDeadline) continue;

    const canonical = {
      tokens: instance.tokens,
      pairs: instance.pairs,
      solution: instance.solution,
    };
    let constraints = cdg_axiomToConstraints(instance);

    // Step 2: Trace-targeted fixedCell adjustment (skipped for Custom)
    if (!isCustom) {
      onProgress && onProgress({
        phase: engineTag + '-adjust',
        retry,
        maxRetries: MAX_RETRIES,
        attempts: retry + 1,
        elapsed: performance.now() - startTime,
        budget: TOTAL_BUDGET,
        currentMaxSolutions: config.maxSolutions || 1,
        level,
      });
      await new Promise(r => setTimeout(r, 0));

      // V12.22: budget을 retry watchdog 기반으로 cap → 단일 호출 freeze 방지
      const adjustBudget = Math.min(
        config.n >= 7 ? 7000 : 5000,
        Math.floor(remainingForRetry() * 0.35)  // retry 잔여시간의 35%만 사용
      );
      const adjustResult = cdg_adjustFixedCellsForDifficulty(constraints, canonical, level, {
        maxIterations: config.n >= 7 ? 12 : 18,
        perStepTimeMs: config.n >= 7 ? 150 : 200,
        totalTimeBudget: Math.max(500, adjustBudget),  // 최소 500ms 보장
        externalDeadlineMs: retryDeadline,             // V12.24: retry watchdog 직접 전달
      });
      constraints = adjustResult.constraints;
      if (adjustResult.action === 'failed' || adjustResult.action === 'unsolvable') continue;
      if (performance.now() > retryDeadline) continue;  // V12.22: deadline 체크
    }

    // Step 2.5 (NEW SOTA v3): Constraint-driven uniqueness forcing
    // Single-shot kill priority + greedy + 2-cell set cover + incremental verify
    // 사용자 요청: "SOTA급으로 정합하게 정확하되 빠르게 유일해 탐색"
    // Empirical: 6x6 100% success ~109ms, 7x7 100% success ~700-1500ms
    //
    // Custom mode 처리:
    //   • Custom + maxSolutions=1: forceUniqueness target=1 (strict unique)
    //   • Custom + maxSolutions>1: forceUniqueness target=maxSolutions
    //   • CRITICAL: Custom에서 사용자의 fixedTileCount[1] (max)을 absolute bound로 존중.
    //     forceUniqueness는 이 한도 내에서만 cells 추가. 한도 초과 필요 시
    //     multi-solution puzzle 생성하고 'loose' uniqueness로 표시.
    {
      const targetMaxSol = isCustom ? (config.maxSolutions || 1) : 1;

      // V12 FIX (RE-REVISED): Revert to V11 behavior for non-Custom in v4-strict
      // 시드15 over-generation now caught by preRevealRatioMax + V12 triv factor.
      // Aggressive budget restriction caused unique-solve timeouts.
      let availableCellBudget = config.n >= 7 ? 8 : 8;  // default
      if (isCustom && Array.isArray(config.fixedTileCount)) {
        const userFixedMax = config.fixedTileCount[1];
        const currentFixedCount = constraints.filter(c => c.type === 'fixedCell').length;
        availableCellBudget = Math.max(0, userFixedMax - currentFixedCount);
      }

      // Skip forceUniqueness if user's strict fixedTileCount leaves no room
      if (availableCellBudget > 0) {
        onProgress && onProgress({
          phase: engineTag + '-force-unique',
          retry,
          maxRetries: MAX_RETRIES,
          attempts: retry + 1,
          elapsed: performance.now() - startTime,
          budget: TOTAL_BUDGET,
          currentMaxSolutions: targetMaxSol,
          level,
          subProgress: { current: 0, total: availableCellBudget, label: 'cells' },
        });
        await new Promise(r => setTimeout(r, 0));

        // V12.22: forceUniqueness budget을 retry watchdog 잔여시간에 cap
        // 단일 호출이 retry 잔여의 50% 이상 못 쓰게 강제 → 어떤 단계도 freeze 안 됨
        const remainingNow = remainingForRetry();
        const fuBudget = Math.min(7500, TOTAL_BUDGET * 0.42, Math.floor(remainingNow * 0.5));
        const fuPerVerify = Math.min(
          config.n >= 7 ? 900 : 500,
          Math.max(200, Math.floor(remainingNow * 0.18))
        );
        const fuQuickVerify = Math.min(
          config.n >= 7 ? 400 : 200,
          Math.max(100, Math.floor(remainingNow * 0.08))
        );

        const uniqueResult = cdg_forceUniqueness(canonical, constraints, level, {
          maxIterations: config.n >= 7 ? 8 : 10,
          maxAlternateSolutions: config.n >= 7 ? 7 : 8,
          perVerifyTimeMs: fuPerVerify,
          quickVerifyTimeMs: fuQuickVerify,
          initialK: 2,
          totalTimeBudget: Math.max(500, fuBudget),
          fixedCellBudget: availableCellBudget,
          enableTwoCellLookahead: true,
          targetMaxSolutions: targetMaxSol,
          externalDeadlineMs: retryDeadline,                    // V12.24: retry watchdog 직접 전달
          // Sub-progress reporter for forceUniqueness internals
          onProgress: (sub) => {
            onProgress && onProgress({
              phase: engineTag + '-force-unique',
              retry,
              maxRetries: MAX_RETRIES,
              attempts: retry + 1,
              elapsed: performance.now() - startTime,
              budget: TOTAL_BUDGET,
              currentMaxSolutions: targetMaxSol,
              level,
              subProgress: {
                current: sub.cellsAdded,
                total: sub.cellBudget,
                label: 'cells',
                detail: `${sub.alternates}개 대체해 발견`,
              },
            });
          },
        });
        constraints = uniqueResult.constraints;
        if (performance.now() > retryDeadline) continue;  // V12.22: deadline 체크
      }
      // 어떤 status여도 계속 진행 — final verify가 최종 판단
      // Custom에서 budget=0이면 multi-solution puzzle 생성 가능 → final verify에서
      // 사용자의 maxSolutions 범위 내면 accept (loose uniqueness)
    }

    // Step 3: Type-priority minimality (skipped for Custom — counts must be preserved)
    if (!isCustom) {
      onProgress && onProgress({
        phase: engineTag + '-minimize',
        retry,
        maxRetries: MAX_RETRIES,
        attempts: retry + 1,
        elapsed: performance.now() - startTime,
        budget: TOTAL_BUDGET,
        currentMaxSolutions: config.maxSolutions || 1,
        level,
      });
      await new Promise(r => setTimeout(r, 0));

      // V12.22: pruneRedundant도 retry watchdog 잔여시간에 cap
      const remainingForPrune = remainingForRetry();
      const pruneBudget = Math.min(8000, TOTAL_BUDGET * 0.35, Math.floor(remainingForPrune * 0.4));
      constraints = cdg_pruneRedundantWithTrace(canonical, constraints, level, {
        // Grid-aware time budget — 6x6/7x7 verify는 더 오래 걸리므로 per-attempt 단축 + total 늘림
        perVerifyTimeMs: config.n >= 7 ? 250 : config.n === 6 ? 200 : 400,
        perTraceTimeMs: config.n >= 7 ? 200 : config.n === 6 ? 180 : 300,
        enforceDiffBound: true,
        totalTimeBudget: Math.max(500, pruneBudget),
        pruneOrder: pruneOrder,
        externalDeadlineMs: retryDeadline,                    // V12.24: retry watchdog 직접 전달
      });
      if (performance.now() > retryDeadline) continue;  // V12.22: deadline 체크
    }

    // Step 4: Final verification + Pattern Diversity
    const finalPuzzle = cdg_assemblePuzzle(canonical, constraints, level);
    // For Custom, allow more solutions if user specified maxSolutions > 1
    const maxSolForVerify = isCustom ? Math.min(50, Math.max(2, (config.maxSolutions || 1) + 1)) : 2;
    // V12.22: finalVerify 시간도 retry watchdog 잔여시간 기반으로 cap
    // 단일 enumerateSolutions가 watchdog 경계를 넘지 못하도록 보장
    const remainingForVerify = remainingForRetry();
    const baseFinalTimeout = config.n >= 7 ? 2500 : config.n === 6 ? 1800 : 1500;
    const finalVerifyTimeout = Math.min(baseFinalTimeout, Math.max(300, Math.floor(remainingForVerify * 0.7)));
    const finalVerify = enumerateSolutions(finalPuzzle, ANIMALS, maxSolForVerify, finalVerifyTimeout);
    // ═════════════════════════════════════════════════════════════════════════
    // SOTA Final Verify with User-Intent Priority
    // ═════════════════════════════════════════════════════════════════════════
    // Custom mode 사용자 의도 우선순위 (사용자 명시 보고에 따라):
    //   1순위: fixedTileCount strict bound 존중
    //   2순위: maxSolutions 만족
    //
    // 따라서 Custom에서:
    //   • forceUniqueness가 budget=0으로 skip된 경우 (사용자 strict bound) →
    //     multi-solution puzzle 생성 가능 → 그래도 accept (uniqueness='loose'로 표시)
    //   • forceUniqueness 적용했지만 unique 못 만든 경우 →
    //     마지막 retry에서 multi-solution accept
    const isStrictUnique = finalVerify.solutions.length === 1;
    const isLooseAcceptable = finalVerify.solutions.length === 2 && retry >= MAX_RETRIES - 2;
    const customMaxSol = (config.maxSolutions || 1);

    // Detect "strict-bound Custom" — user's fixedTileCount has no flex room
    const customStrictBound = isCustom && Array.isArray(config.fixedTileCount)
      && config.fixedTileCount[0] === config.fixedTileCount[1];
    // For strict-bound Custom: accept any 1+ solutions (uniqueness=loose acceptable)
    const customStrictAccept = customStrictBound && finalVerify.solutions.length >= 1;
    // For non-strict Custom: extended fallback in last retry
    const customLooseAcceptable = isCustom && !customStrictBound
      && finalVerify.solutions.length >= 1
      && finalVerify.solutions.length <= customMaxSol + 2
      && retry >= MAX_RETRIES - 1;

    const acceptableSolCount = isCustom
      ? ((finalVerify.solutions.length >= 1 && finalVerify.solutions.length <= customMaxSol)
         || customStrictAccept || customLooseAcceptable)
      : (isStrictUnique || isLooseAcceptable);
    if (!acceptableSolCount) continue;

    // V12.23: finalTrace도 retry watchdog 잔여 시간에 cap
    //   → V12.22에서 빠뜨린 hot path. 이것이 "기초 격자 직조" stuck의 진짜 원인.
    //   단일 호출 2.5초 + Level 4 enabled = retry watchdog 완전 소진 가능.
    const remainingForFinalTrace = remainingForRetry();
    const finalTraceTimeout = Math.min(2500, Math.max(300, Math.floor(remainingForFinalTrace * 0.6)));
    // Level 4 enable 여부도 잔여 시간에 따라 결정 (시간 여유 있을 때만 deeper 분석)
    const enableLevel4 = remainingForFinalTrace > 1500;
    const finalTrace = traceSolve_v2(finalPuzzle, {
      timeLimitMs: finalTraceTimeout,
      maxLookaheadDepth: 2,
      enableLevel4: enableLevel4,
    });
    // For Custom, accept puzzle even if traceSolve can't fully resolve (user may want hard puzzles)
    if (!isCustom && finalTrace.status !== 'solved') continue;

    const diff = finalTrace.status === 'solved' ? computeTraceDifficulty(finalTrace.diagnostics) : 0;
    const diversity = finalTrace.status === 'solved' ? cdg_computePatternDiversity(finalTrace.diagnostics) : 0;

    // Tag puzzle with all metrics
    finalPuzzle.uniqueness = finalVerify.solutions.length === 1 ? 'strict' : 'loose';
    finalPuzzle.solutionCount = finalVerify.solutions.length;
    finalPuzzle.engine = engineTag;
    finalPuzzle.generationTime = performance.now() - startTime;
    finalPuzzle.attemptCount = retry + 1;
    finalPuzzle.traceDifficulty = diff;
    finalPuzzle.traceLength = finalTrace.trace.length;
    finalPuzzle.traceShape = computeTraceShape(finalTrace.trace);
    finalPuzzle.patternDiversity = diversity;

    // For Custom: accept the first valid result (no tier matching)
    if (isCustom) return finalPuzzle;

    const inRange = diff >= tier.min && diff <= tier.max;
    const effectiveMinDiv = retry < MAX_RETRIES - 1
      ? tier.min_diversity
      : tier.min_diversity * 0.7;
    const diversityOk = diversity >= effectiveMinDiv;

    if (inRange && diversityOk) return finalPuzzle;

    // Save best fallback (closest to ideal)
    if (!bestFallback) {
      bestFallback = finalPuzzle;
    } else {
      const currentDist = Math.abs(finalPuzzle.traceDifficulty - tier.ideal);
      const bestDist = Math.abs(bestFallback.traceDifficulty - tier.ideal);
      if (currentDist < bestDist) bestFallback = finalPuzzle;
    }
  }

  if (bestFallback) {
    bestFallback.outOfIdealRange = true;
    return bestFallback;
  }
  return null;
}

// Loose variant: aggressive minimality (hints prunable)
async function generatePuzzleCDG_v4_loose(level, onProgress) {
  return generatePuzzleCDG_v4_core(level, onProgress, CDG_PRUNE_ORDER_LOOSE, 'cdg-v4-loose');
}

// Strict variant: axiom-preserving minimality (hints inviolable)
async function generatePuzzleCDG_v4_strict(level, onProgress) {
  return generatePuzzleCDG_v4_core(level, onProgress, CDG_PRUNE_ORDER_STRICT, 'cdg-v4-strict');
}

// ─────────────────────────────────────────────────────────────────────────────
// V5 — Strict generator with pool selection and v5 difficulty metric
// ─────────────────────────────────────────────────────────────────────────────
// Builds on v4-strict (axiom-preserving minimality) but:
//   (1) generates a small POOL of candidates (default 4)
//   (2) measures each with the v5 multi-axis metric
//   (3) selects the candidate closest to the v5 tier ideal
//
// The v5 metric is more variable than v4's (~4× std/mean ratio in measurement),
// so picking the best of N candidates yields tighter alignment to ideal.
// Time budget per candidate is a fraction of the total budget.
async function generatePuzzleCDG_v5_strict(level, onProgress) {
  const config = DIFFICULTY_CONFIGS[level];
  if (!config) return null;
  const tierV5 = TRACE_DIFFICULTY_TIERS_V5[level];
  if (!tierV5) return null;

  const startTime = performance.now();
  const TOTAL_BUDGET = (config.totalBudgetMs || 20000) * 1.6;
  const POOL_SIZE = level === 'Sprout' ? 3 : (level === 'Hard' ? 4 : 4);
  const PER_CANDIDATE_BUDGET = TOTAL_BUDGET / POOL_SIZE;

  const pool = [];

  for (let attempt = 0; attempt < POOL_SIZE * 2; attempt++) {
    if (performance.now() - startTime > TOTAL_BUDGET) break;
    if (pool.length >= POOL_SIZE) break;

    onProgress && onProgress({
