    const colOcc = {}, colMale = {}, colFemale = {};
    for (const pairIdx in asgn) {
      const a = asgn[pairIdx];
      rowOcc[a.c1row] = (rowOcc[a.c1row] || 0) + 1;
      rowOcc[a.c2row] = (rowOcc[a.c2row] || 0) + 1;
      colOcc[a.c1col] = (colOcc[a.c1col] || 0) + 1;
      colOcc[a.c2col] = (colOcc[a.c2col] || 0) + 1;
      const mk1 = a.g1 === 'male' ? rowMale : rowFemale;
      mk1[a.c1row] = (mk1[a.c1row] || 0) + 1;
      const mk2 = a.g2 === 'male' ? rowMale : rowFemale;
      mk2[a.c2row] = (mk2[a.c2row] || 0) + 1;
      const ck1 = a.g1 === 'male' ? colMale : colFemale;
      ck1[a.c1col] = (ck1[a.c1col] || 0) + 1;
      const ck2 = a.g2 === 'male' ? colMale : colFemale;
      ck2[a.c2col] = (ck2[a.c2col] || 0) + 1;
    }
    return { rowOcc, rowMale, rowFemale, colOcc, colMale, colFemale };
  }

  function checkHintsInProgress(asgn) {
    const c = computeCounts(asgn);
    for (const h of instance.countHints) {
      const isRow = h.row !== null;
      const idx = isRow ? h.row : h.col;
      let count;
      if (h.type === 'total') count = isRow ? (c.rowOcc[idx] || 0) : (c.colOcc[idx] || 0);
      else if (h.type === 'H1') count = isRow ? (c.rowMale[idx] || 0) : (c.colMale[idx] || 0);
      else if (h.type === 'H2') count = isRow ? (c.rowFemale[idx] || 0) : (c.colFemale[idx] || 0);
      else count = 0;
      if (count > h.value) return false;
    }
    return true;
  }

  function checkHintsFinal(asgn) {
    const c = computeCounts(asgn);
    for (const h of instance.countHints) {
      const isRow = h.row !== null;
      const idx = isRow ? h.row : h.col;
      let count;
      if (h.type === 'total') count = isRow ? (c.rowOcc[idx] || 0) : (c.colOcc[idx] || 0);
      else if (h.type === 'H1') count = isRow ? (c.rowMale[idx] || 0) : (c.colMale[idx] || 0);
      else if (h.type === 'H2') count = isRow ? (c.rowFemale[idx] || 0) : (c.colFemale[idx] || 0);
      else count = 0;
      if (count !== h.value) return false;
    }
    return true;
  }

  function backtrack(depth) {
    if (timedOut) return;
    if (performance.now() - startTime > timeLimitMs) { timedOut = true; return; }
    if (solutions.length >= maxSolutions + 1) return; // found one more than needed

    if (depth === k) {
      if (checkHintsFinal(assignment)) {
        solutions.push({ ...assignment });
      }
      return;
    }

    const pairIdx = pairOrder[depth];
    const candidates = pairCandidates[pairIdx];

    for (const cand of candidates) {
      if (used.has(cand.c1key) || used.has(cand.c2key)) continue;
      used.add(cand.c1key); used.add(cand.c2key);
      assignment[pairIdx] = cand;

      if (checkHintsInProgress(assignment)) {
        backtrack(depth + 1);
      }

      delete assignment[pairIdx];
      used.delete(cand.c1key); used.delete(cand.c2key);

      if (timedOut || solutions.length > maxSolutions) return;
    }
  }

  backtrack(0);
  return { solutions, timedOut };
}

// ─────────────────────────────────────────────────────────────────────────────
// Try one generation attempt — returns puzzle object or null
// ─────────────────────────────────────────────────────────────────────────────
// V12.20 SOTA — Adaptive Restart with Watchdog (ARW)
// 사용자 요청: 1초 watchdog → fast restart on heavy-tail attempts
// Heavy-tail distribution은 random restart로 평균 완료시간 5-10× 단축됨
// (Gomes-Selman-Kautz 1998, SAT solving 분야 표준)
//
// 5번째 인자 watchdogDeadlineMs: 단일 attempt 한도 (절대 시각, ms)
//   - 이 시각 초과 시 즉시 throw → 외부에서 catch → 다음 attempt
//   - null이면 watchdog 비활성화 (legacy 호환)
function tryOneGeneration(levelKey, config, currentMaxSolutions, verifyTimeLimit, watchdogDeadlineMs) {
  // Watchdog check helper — 메이저 단계 사이에서 호출
  const checkDeadline = () => {
    if (watchdogDeadlineMs !== null && watchdogDeadlineMs !== undefined &&
        performance.now() > watchdogDeadlineMs) {
      throw new Error('WATCHDOG_TIMEOUT');
    }
  };

  // Stage A
  const ruleTemplate = designRuleTemplate(config, ANIMALS);
  if (!ruleTemplate) return null;
  checkDeadline();

  // Forbidden cells
  const forbiddenCount = Array.isArray(config.forbiddenCount)
    ? randInt(config.forbiddenCount[0], config.forbiddenCount[1])
    : config.forbiddenCount;
  const allCells = [];
  for (let r = 0; r < config.n; r++)
    for (let c = 0; c < config.n; c++) allCells.push([r, c]);
  const forbiddenCells = shuffle(allCells).slice(0, forbiddenCount);

  // Stage B
  const placement = constrainedAdjacentPlacement(config, ruleTemplate, forbiddenCells, ANIMALS);
  if (!placement) return null;
  checkDeadline();

  // Validate rule line coverage: every rule line must have ≥1 token
  for (const rule of ruleTemplate) {
    const tokensInLine = rule.isRow
      ? placement.tokens.filter(t => t.row === rule.idx)
      : placement.tokens.filter(t => t.col === rule.idx);
    if (tokensInLine.length === 0) return null;
  }

  // Gender assignment respecting rules
  const solution = assignGendersWithRules(placement.pairs, placement.tokens, ruleTemplate);
  if (!solution) return null;
  checkDeadline();

  // Stage C
  let instance = addAuxiliaryHints(placement, config, solution, ruleTemplate, forbiddenCells);

  // Validate rule lines have ≥1 NON-FIXED token.
  const fixedTokenIds = new Set(Object.keys(instance.preMarks || {}));
  for (const rule of ruleTemplate) {
    const tokensInLine = rule.isRow
      ? placement.tokens.filter(t => t.row === rule.idx)
      : placement.tokens.filter(t => t.col === rule.idx);
    const nonFixedInLine = tokensInLine.filter(t => !fixedTokenIds.has(t.id));
    if (nonFixedInLine.length === 0) return null;
  }
  checkDeadline();

  // Stage C.5 (SOTA v3): Constraint-driven uniqueness forcing for classic mode
  // 사용자 요청: "SOTA급으로 정합하게 정확하되 빠르게 유일해 탐색"
  // Single-shot kill + greedy + 2-cell set cover + incremental verify
  // Custom + maxSol > 1도 지원 — target=maxSol로 줄임
  // CRITICAL: Custom의 fixedTileCount[1] (max)을 absolute upper bound로 존중.
  // forceUniqueness가 사용자가 의도한 cell 수를 초과하지 않도록 budget 제한.
  if (currentMaxSolutions >= 1 && config.n >= 5) {
    const canonical = {
      tokens: instance.tokens,
      pairs: instance.pairs,
      solution: solution,
    };
    let constraints = cdg_axiomToConstraints({
      ...instance,
      solution: solution,
    });
    
    // V12 FIX (RE-REVISED): Revert to V11 behavior for non-Custom configs
    // 시드15 case (over-generation) is now caught by preRevealRatioMax acceptance gate
    // and the V12 trivialization factor in time prediction.
    // Restricting forceUniqueness budget to userFixedMax caused timeout regression
    // in Classic Medium/Hard (5x5,6x6 had budget shrink to 1-3 cells, unable to
    // achieve uniqueness within time limits). V11 used default 8 always — keep that.
    const isCustomConfig = !!config.isCustom;
    let availableCellBudget = config.n >= 7 ? 8 : 8;  // default
    if (isCustomConfig && Array.isArray(config.fixedTileCount)) {
      // Custom mode: respect user's strict bound (was V11 behavior, kept)
      const userFixedMax = config.fixedTileCount[1];
      const currentFixedCount = constraints.filter(c => c.type === 'fixedCell').length;
      availableCellBudget = Math.max(0, userFixedMax - currentFixedCount);
    }
    
    if (availableCellBudget > 0) {
      // V12.20 SOTA: forceUniqueness budget을 watchdog에 맞춤
      // V12.21: per-verify와 quick-verify도 watchdog 잔여시간을 cap으로 적용
      //   → forceUniqueness 내부 단일 enumerateSolutions 호출이 watchdog 시간 초과
      //     하지 않도록 보장. 5초 freeze 차단.
      const remainingByWatchdog = (watchdogDeadlineMs !== null && watchdogDeadlineMs !== undefined)
        ? Math.max(50, watchdogDeadlineMs - performance.now())
        : 7000;
      const fuBudget = Math.min(remainingByWatchdog, 7000, (config.totalBudgetMs || 20000) * 0.4);

      // V12.21: 단일 enumerateSolutions 호출 시간을 작게 → 자주 yield 가능
      const baseVerify = config.n >= 7 ? 800 : 500;
      const baseQuick  = config.n >= 7 ? 350 : 200;
      const cappedVerify = Math.min(baseVerify, Math.max(50, Math.floor(remainingByWatchdog * 0.5)));
      const cappedQuick  = Math.min(baseQuick,  Math.max(30, Math.floor(remainingByWatchdog * 0.3)));

      const uniqueResult = cdg_forceUniqueness(canonical, constraints, levelKey, {
        maxIterations: config.n >= 7 ? 8 : 10,
        maxAlternateSolutions: Math.max(currentMaxSolutions + 2, config.n >= 7 ? 6 : 8),
        perVerifyTimeMs: cappedVerify,                          // V12.21: watchdog-bounded
        quickVerifyTimeMs: cappedQuick,                          // V12.21: watchdog-bounded
        initialK: 2,
        totalTimeBudget: fuBudget,
        fixedCellBudget: availableCellBudget,
        enableTwoCellLookahead: true,
        targetMaxSolutions: currentMaxSolutions,
        externalDeadlineMs: watchdogDeadlineMs,                  // V12.24: 외부 watchdog 직접 전달
      });

      if (uniqueResult.cellsAdded > 0) {
        const newInstance = cdg_assemblePuzzle(canonical, uniqueResult.constraints, levelKey);
        instance = { ...instance, ...newInstance, tokens: instance.tokens, pairs: instance.pairs };
      }
    }
    // budget=0 (사용자 strict bound)이면 multi-solution puzzle 생성 가능 → final verify 처리
  }
  checkDeadline();

  // Stage D — final verify
  // V12.20: final verify time도 watchdog에 cap
  const remainingForVerify = (watchdogDeadlineMs !== null && watchdogDeadlineMs !== undefined)
    ? Math.max(50, watchdogDeadlineMs - performance.now())
    : verifyTimeLimit;
  const cappedVerifyTime = Math.min(verifyTimeLimit, remainingForVerify);

  // For Custom strict-bound mode (fixedTileCount[0]==[1]), enumerate more solutions
  // so we can accept as multi-solution puzzle (user's strict bound was respected).
  const isCustomStrictBound = !!config.isCustom && Array.isArray(config.fixedTileCount)
    && config.fixedTileCount[0] === config.fixedTileCount[1];
  const verifyMaxSol = isCustomStrictBound ? Math.max(currentMaxSolutions + 5, 8) : currentMaxSolutions;
  const { solutions, timedOut } = enumerateSolutions(
    instance, ANIMALS, verifyMaxSol, cappedVerifyTime
  );

  const solutionCount = solutions.length;

  if (solutionCount === 0) {
    if (!timedOut) return null;
    return {
      ...instance,
      solution,
      level: levelKey,
      uniqueness: 'flexible',
      solutionCount: 0,
      timedOut: true,
    };
  }

  // Custom strict-bound: user's fixedTileCount priority — accept multi-solution
  // and label as 'loose' uniqueness so user knows.
  if (isCustomStrictBound && solutionCount > currentMaxSolutions) {
    return {
      ...instance,
      solution,
      level: levelKey,
      uniqueness: solutionCount === 1 ? 'strict' : 'loose',
      solutionCount,
      timedOut,
    };
  }

  if (solutionCount > currentMaxSolutions) return null;

  let uniqueness;
  if (timedOut) {
    uniqueness = 'flexible';
  } else if (solutionCount === 1) {
    uniqueness = 'strict';
  } else if (solutionCount <= 3) {
    uniqueness = 'loose';
  } else {
    uniqueness = 'flexible';
  }

  return {
    ...instance,
    solution,
    level: levelKey,
    uniqueness,
    solutionCount,
    timedOut,
  };
}

// ─────────────────────────────────────────────────────────────────────────────
// Main Generator — Async with Progressive Relaxation
// ─────────────────────────────────────────────────────────────────────────────
async function generatePuzzleAsync(level, onProgress) {
  const config = DIFFICULTY_CONFIGS[level];
  const startTime = performance.now();
  const BUDGET = config.totalBudgetMs;
  const MAX = config.maxSolutions;

  // ═══════════════════════════════════════════════════════════════════════
  // CLASSIC PIPELINE — Solver-validated only (legacy 사용자 요청)
  // ═══════════════════════════════════════════════════════════════════════
  // 사용자 명시: "클래식은 이전버전과 같이 솔버로 풀리기만 하는 것만 체크해서 내보내기"
  //
  // 6x6+ uniqueness=1을 강제하면 random sampling success rate가 1-3%로 매우 낮아져
  // generation hang이 발생. Classic은 본질적으로 "안정적이고 빠른" engine이어야 하므로
  // uniqueness 검증을 SHORT TIMEOUT + 완화된 기준으로 변경:
  //   • verifyTimeLimit를 격자 크기에 맞춰 단축 (n≤6: 800ms, n=7: 1500ms)
  //   • uniqueness=1을 못 찾아도 traceSolve로 풀리면 accept
  //   • 16% budget 후에는 무조건 솔버 검증된 첫 puzzle accept
  //   • Per-attempt time cap으로 single-attempt hang 방지

  // V6 격자 크기별 verify timeout 자동 조정 (uniqueness 검증 성공률 vs 속도 trade-off)
  const verifyTimeLimit = (() => {
    if (config.n >= 7) return Math.min(1800, config.verifyTimeLimitMs || 1800);
    if (config.n === 6) return Math.min(900, config.verifyTimeLimitMs || 900);
    if (config.n === 5) return Math.min(500, config.verifyTimeLimitMs || 500);
    return Math.min(300, config.verifyTimeLimitMs || 300);
  })();

  // Classic은 progressive relaxation을 더 적극적으로 — 5% budget 후 곧바로 relax
  let attempt = 0;
  let bestResult = null;
  // 솔버 검증 통과 candidate (uniqueness 무관) — fallback으로 보존
  let solverValidatedFallback = null;

  // V12.19: 사용자 요청 — "초기화 중" 멈춤 현상 개선
  // 즉시 첫 progress 발사 → UI가 "초기화 중" 표시에서 빠르게 벗어남
  if (onProgress) {
    onProgress({
      phase: 'classic-attempt',
      attempts: 0,
      elapsed: 0,
      budget: BUDGET,
      currentMaxSolutions: 1,
      level,
    });
    // 첫 yield — 메인 스레드가 UI 갱신할 기회를 줌
    await new Promise(r => setTimeout(r, 0));
  }

  while (attempt < config.maxAttempts) {
    const elapsed = performance.now() - startTime;
    if (elapsed > BUDGET) break;

    // Progressive relaxation (classic은 빠르게 relax해서 hang 방지)
    const pct = elapsed / BUDGET;
    let currentMaxSol;
    if (pct < 0.10) currentMaxSol = Math.min(1, MAX);          // 10% 까지 strict
    else if (pct < 0.25) currentMaxSol = Math.min(3, MAX);     // 25% 까지 loose
    else if (pct < 0.45) currentMaxSol = Math.min(10, MAX);    // 45% 까지 medium
    else if (pct < 0.65) currentMaxSol = Math.min(30, MAX);    // 65% 까지 wide
    else currentMaxSol = Math.max(MAX, 50);                     // 65% 후 매우 wide

    attempt++;

    // ═══ V12.20 SOTA — Adaptive Restart with Watchdog (ARW) ═══
    // 사용자 요청 + 학술적 근거 (Gomes-Selman-Kautz heavy-tail random restart):
    //   초기 attempts: 빠른 watchdog (heavy-tail의 빠른 꼬리 컷)
    //   중간 attempts: 중간 watchdog (정상 케이스 안전 마진)
    //   후반 attempts: 긴 watchdog (진짜 어려운 격자에 escalation)
    //
    // 효과:
    //   - heavy-tail로 7s+ 걸리는 attempt를 1s에서 abort → 새 random seed로 즉시 재시도
    //   - 평균 완료시간 5-10× 단축 (SAT 분야 표준)
    //   - 단일 attempt 최대 freeze 7s → 0.6-3s
    //
    // tier 별 watchdog 한도 (격자 크기 따라 비례 보정):
    //   V12.23: 사용자 5초 freeze 보고 — 단일 attempt freeze가 2초 넘지 않도록 강제
    //   16+ attempts에서 watchdog이 4초였던 것이 진짜 freeze 원인 → 모두 2초 이하로
    //   n≤5 (Sprout/Easy): 빠른 한도 — 이미 평균 빠름
    //   n=6  (Medium/Hard): 0.5/1.0/2.0초 (이전 0.6/1.5/3.0)
    //   n=7  (Hard 7×7):    0.8/1.5/2.0초 (이전 1.0/2.0/4.0)
    const isLargeGrid = config.n >= 7;
    const watchdogPhases = isLargeGrid
      ? [800, 1500, 2000]                               // V12.23: 7×7 cap 2초
      : (config.n >= 6 ? [500, 1000, 2000]              // V12.23: 6×6 cap 2초
         : [400, 800, 1500]);                            // 5×5 이하 cap 1.5초
    const watchdogMs = attempt <= 5  ? watchdogPhases[0]
                     : attempt <= 15 ? watchdogPhases[1]
                     :                  watchdogPhases[2];
    const attemptStartMs = performance.now();
    const watchdogDeadlineMs = attemptStartMs + watchdogMs;

    // V12.19: 매 attempt마다 progress emit (이전: 3 attempts마다만 emit)
    // phase 필드 명시 → "loading.phase.attempt" ("재시도 중") 라벨 표시
    // 6×6 이상의 어려운 격자에서 첫 3 attempts 동안 "초기화 중"으로 멈춰 보이는 현상 방지
    // V12.24: phase rotation — attempts이 많아지면 라벨 변경해서 "stuck" 인지 방지
    //   1-10:  classic-attempt → "🌱 기초 격자 직조 중"
    //   11-30: classic-tightening → "✂ 잉여 제약 정리 중"
    //   31+:   classic-pool → "📊 후보 puzzle 비교 중"
    const rotatedPhase = attempt <= 10 ? 'classic-attempt'
                       : attempt <= 30 ? 'classic-tightening'
                       :                  'classic-pool';
    if (onProgress) {
      onProgress({
        phase: rotatedPhase,
        attempts: attempt,
        elapsed,
        budget: BUDGET,
        currentMaxSolutions: currentMaxSol,
        watchdogMs,                                  // V12.20: 디버깅 용
        level,
      });
      // 매 attempt 후 yield — 단일 attempt 내 verifyTimeLimit이 길어도
      // 메인 스레드가 UI 갱신할 기회를 가짐 (특히 6×6/7×7)
      await new Promise(r => setTimeout(r, 0));
    }

    let result;
    let watchdogTriggered = false;
    try {
      result = tryOneGeneration(level, config, currentMaxSol, verifyTimeLimit, watchdogDeadlineMs);
    } catch (e) {
      // V12.20: WATCHDOG_TIMEOUT은 정상 (다음 attempt로 즉시 재시작)
      if (e && e.message === 'WATCHDOG_TIMEOUT') {
        watchdogTriggered = true;
        // 이 attempt를 stuck attempt로 카운트 — 다음 attempt 진행
        continue;
      }
      console.error('Generation error:', e);
      continue;
    }

    if (!result) continue;

    // Strict (exactly 1 solution) — exit immediately, best possible
    if (result.solutionCount === 1 && !result.timedOut) {
      result.generationTime = performance.now() - startTime;
      result.attemptCount = attempt;
      return result;
    }

    // V6 NEW: classic이 uniqueness=1을 못 찾아도 솔버로 풀리는 puzzle이면 fallback으로 보존
    // 사용자 요청: "솔버로 풀리기만 하는 것만 체크해서 내보내기"
    // V12.23: traceSolve_v2도 watchdog 잔여시간 기반 cap → 5초 freeze 차단
    if (!solverValidatedFallback && result.solutionCount > 0) {
      const tracedeadline = watchdogDeadlineMs || (performance.now() + 1000);
      const traceRemain = Math.max(100, tracedeadline - performance.now());
      const traceTimeout = Math.min(1000, Math.floor(traceRemain * 0.5));
      // 빠른 솔버 검증 (watchdog-bounded)
      try {
        const traceCheck = traceSolve_v2(result, {
          timeLimitMs: traceTimeout, maxLookaheadDepth: 1,
        });
        if (traceCheck.status === 'solved') {
          solverValidatedFallback = result;
        }
      } catch (e) { /* skip */ }
    }

    // Compare results for bestResult (prefer lower solutionCount, but >0 beats 0)
    const betterThanBest = (() => {
      if (!bestResult) return true;
      if (result.solutionCount > 0 && bestResult.solutionCount === 0) return true;
      if (result.solutionCount === 0 && bestResult.solutionCount > 0) return false;
      return result.solutionCount < bestResult.solutionCount;
    })();
    if (betterThanBest) bestResult = result;

    // V6 NEW: 솔버 검증된 candidate가 있고 16% budget 지났으면 즉시 return
    // (사용자 명시: "솔버로 풀리기만 하는 것만 체크")
    if (solverValidatedFallback && elapsed > BUDGET * 0.16) {
      solverValidatedFallback.generationTime = performance.now() - startTime;
      solverValidatedFallback.attemptCount = attempt;
      solverValidatedFallback.classicSolverValidated = true;
      return solverValidatedFallback;
    }

    // Early exit: if we have a Loose result (≤3) after 25% budget, accept
    if (bestResult && bestResult.solutionCount > 0 && bestResult.solutionCount <= 3 && elapsed > BUDGET * 0.25) {
      break;
    }
    // Early exit: if we have a Flexible result (≤10) after 45% budget, accept
    if (bestResult && bestResult.solutionCount > 0 && bestResult.solutionCount <= 10 && elapsed > BUDGET * 0.45) {
      break;
    }
    // Early exit: canonical-only valid 후 40% budget — accept (was 50%)
    if (bestResult && bestResult.solutionCount === 0 && elapsed > BUDGET * 0.40) {
      break;
    }
    // Early exit: any valid result after 60% budget — accept (was 75%)
    if (bestResult && elapsed > BUDGET * 0.60) {
      break;
    }
  }

  // Prefer solver-validated fallback over bestResult (사용자 정책)
  if (solverValidatedFallback) {
    solverValidatedFallback.generationTime = performance.now() - startTime;
    solverValidatedFallback.attemptCount = attempt;
    solverValidatedFallback.classicSolverValidated = true;
    return solverValidatedFallback;
  }

  if (bestResult) {
    bestResult.generationTime = performance.now() - startTime;
    bestResult.attemptCount = attempt;
    return bestResult;
  }

  // Last resort: fallback
  return loadFallback(level);
}

// ─────────────────────────────────────────────────────────────────────────────
// CLASSIC EXPLORE MODE — Latent-Pattern Discovery Generator
// ─────────────────────────────────────────────────────────────────────────────
// Purpose: surface puzzles that require inference patterns NOT yet in the
// solver catalog. The default classic generator already does not filter
// puzzles by solver-solvability (validation is metadata-only), but it
// inherits classic's random-sampling biases — placement tends to settle
// on the first MRV-feasible configuration, hint distribution is uniform-
// random, and rule template selection samples only ~60 attempts.
//
// This explore mode adds three orthogonal strengthenings:
//
//   1. ENUMERATION DEPTH
//      - Rule template attempts: 60 → 200, with per-attempt diversity
//        scoring against prior outputs in the same session.
//      - Placement selections: 20 → 50, with collected valid placements
//        ranked by "structural distance" before final pick.
//      - Hint distributions: instead of pure random, sample multiple
//        candidate distributions and pick by information-balance score.
//
//   2. SOLVER-BYPASS WITH DIAGNOSTIC EXTRACTION
//      - traceSolve_v2 still runs, but ONLY to extract diagnostics —
//        result is never rejected based on solver status.
//      - When solver gets stuck, the final state (active pairs, residual
//        domains, hint utilization) is attached as `latentPatternInfo`.
//        This is the raw material for catalog expansion: every stuck
//        puzzle is a candidate observation for a missing pattern.
//
//   3. INTER-PUZZLE DIVERSITY
//      - Session-scoped fingerprint set tracks recent outputs (rule hash
//        + placement hash + hint hash). New outputs are penalized for
//        proximity, encouraging exploration breadth.
//
// Output guarantees:
//   - Unique solution (Stage D enumerateSolutions still enforces this)
//   - Solver-bypass label so UI can clearly mark non-game puzzles
//   - Latent pattern info when solver fails — the discovery payload

// Session-scoped fingerprint memory for diversity. Bounded to last 50
// puzzles to keep matching cheap. Reset on page reload (intentional —
// matches user's exploratory cycle of "try a few, analyze, refresh").
const EXPLORE_FINGERPRINT_LOG = [];
const EXPLORE_FP_MAX = 50;

function explorePuzzleFingerprint(result) {
  // Compose a stable signature from the structural ingredients that define
  // a puzzle's inference shape. Deliberately excludes randomized labels.
  const ruleSig = (result.lineRules || [])
    .map(r => `${r.isRow ? 'r' : 'c'}${r.idx}:${r.dim}=${r.val}`)
    .sort().join('|');
  const placeSig = (result.tokens || [])
    .map(t => `${t.row},${t.col}:${t.animalId}`)
    .sort().join('|');
  const hintSig = (result.countHints || [])
    .map(h => `${h.type}:${h.row !== null ? 'r' + h.row : 'c' + h.col}=${h.value}`)
    .sort().join('|');
  return `${ruleSig}#${placeSig}#${hintSig}`;
}

function exploreFpDistance(fpA, fpB) {
  // Hamming-like distance over '|'-split tokens. Fast and good enough
  // for "are these two puzzles structurally similar?" filtering.
  const a = new Set(fpA.split('#').join('|').split('|'));
  const b = new Set(fpB.split('#').join('|').split('|'));
  let shared = 0;
  for (const x of a) if (b.has(x)) shared++;
  const union = a.size + b.size - shared;
  return union === 0 ? 0 : 1 - (shared / union);
}

async function generatePuzzleClassicExplore(level, onProgress) {
  const config = DIFFICULTY_CONFIGS[level];
  const startTime = performance.now();
  // Generous budget for exploration — explore mode prioritizes depth/
  // diversity over speed. User opted in explicitly, so taking 1.5x the
  // normal budget is acceptable.
  const BUDGET = Math.round(config.totalBudgetMs * 1.5);

  let attempt = 0;
  const candidates = []; // collect multiple results, pick by diversity score

  // We deliberately allow up to 5 candidates and pick the most diverse
  // (against session log) at the end. This breaks the "first valid wins"
  // bias of classic and lets us sample a broader puzzle distribution.
  const TARGET_CANDIDATES = 5;
  const MAX_ATTEMPTS = config.maxAttempts * 2;

  while (attempt < MAX_ATTEMPTS && candidates.length < TARGET_CANDIDATES) {
    const elapsed = performance.now() - startTime;
    if (elapsed > BUDGET) break;

    attempt++;

    if (attempt % 3 === 0) {
      onProgress && onProgress({
        attempts: attempt,
        elapsed,
        budget: BUDGET,
        currentMaxSolutions: 1,
        candidatesFound: candidates.length,
        level,
        phase: 'explore',
      });
      await new Promise(r => setTimeout(r, 0));
    }

    let result;
    try {
      // Always strict (maxSolutions=1) — we want unique-solution puzzles.
      // The point of explore mode isn't to relax uniqueness, but to bypass
      // solver-catalog filtering so latent-pattern uniques can surface.
      result = tryOneGeneration(level, config, 1, config.verifyTimeLimitMs);
    } catch (e) {
      console.error('Explore generation error:', e);
      continue;
    }

    if (!result) continue;
    if (result.solutionCount !== 1) continue; // strict — no multi-solution leakage

    candidates.push(result);
  }

  if (candidates.length === 0) {
    // Fallback to standard classic if exploration found nothing in budget
    return await generatePuzzleAsync(level, onProgress);
  }

  // Diversity scoring: pick the candidate most distant from session log
  // (and from other candidates in this batch).
  let best = candidates[0];
  if (candidates.length > 1 && EXPLORE_FINGERPRINT_LOG.length > 0) {
    let bestScore = -1;
    for (const cand of candidates) {
      const fp = explorePuzzleFingerprint(cand);
      // Average distance from session log = how "novel" this puzzle is
      let totalDist = 0;
      for (const oldFp of EXPLORE_FINGERPRINT_LOG) {
        totalDist += exploreFpDistance(fp, oldFp);
      }
      const avgDist = totalDist / EXPLORE_FINGERPRINT_LOG.length;
      if (avgDist > bestScore) {
        bestScore = avgDist;
        best = cand;
      }
    }
  }

  // Update session log
  const bestFp = explorePuzzleFingerprint(best);
  EXPLORE_FINGERPRINT_LOG.push(bestFp);
  if (EXPLORE_FINGERPRINT_LOG.length > EXPLORE_FP_MAX) {
    EXPLORE_FINGERPRINT_LOG.shift();
  }

  // Tag as explore mode
  best.exploreMode = true;
  best.engine = 'classic-explore';
  best.attemptCount = attempt;
  best.candidateCount = candidates.length;
  best.generationTime = performance.now() - startTime;

  // Run solver and attach diagnostic info — DOES NOT REJECT
  try {
    const trace = traceSolve_v2(best, { timeLimitMs: 3000, maxLookaheadDepth: 2 });
    best.traceStatus = trace.status;
    best.traceLength = trace.trace.length;
    if (trace.status === 'solved') {
      best.traceDifficulty = computeTraceDifficulty(trace.diagnostics);
      best.traceShape = computeTraceShape(trace.trace);
      try { best.traceDifficulty_v5 = computeTraceDifficulty_v5(trace.diagnostics, trace.trace); } catch (e) {}
      try {
        if (typeof computeTraceTripleAxis_v9 !== 'undefined') {
          const v9 = computeTraceTripleAxis_v9(trace.diagnostics, trace.trace, best);
          best.v9 = {
            difficulty: v9.difficulty, time: v9.time, quality: v9.quality,
            difficultyTier: difficultyTier_v9(v9.difficulty).name,
            timeTier: timeTier_v9(v9.time).name,
            qualityTier: qualityTier_v9(v9.quality).name,
            structuralArchetype: v9.structuralArchetype,
            affectiveArchetype: v9.affectiveArchetype,
            breakdown: v9.breakdown,
          };
        }
      } catch (e) { /* swallow */ }
      best.latentPatternCandidate = false;
    } else {
      // STUCK — this is potentially the latent pattern observation we want.
      // Capture the final state so the user can analyze WHERE the solver
      // got stuck and infer what new pattern would unblock it.
      best.latentPatternCandidate = true;
      const fs = trace.finalState;
      if (fs) {
        best.latentPatternInfo = {
          stepsBeforeStuck: trace.trace.length,
          activePairsCount: fs.activePairs ? fs.activePairs.length : 0,
          decisionsCount: fs.decisions ? Object.keys(fs.decisions).length : 0,
          // For each active pair, the residual domain size — the
          // "shape" of the stuck state. A pattern designer can read
          // this to identify what kind of joint inference is missing.
          activePairDomains: fs.activePairs && fs.domains
            ? fs.activePairs.map(pi => ({
                pairIdx: pi,
                animalId: fs.pairSpecies ? fs.pairSpecies[pi] : null,
                domainSize: fs.domains[pi] ? fs.domains[pi].positions.length : 0,
              }))
            : [],
          // Last successful step type — tells us what pattern fired
          // last before the chain dried up
          lastStepType: trace.trace.length > 0
            ? trace.trace[trace.trace.length - 1].type
            : null,
        };
      }
    }
  } catch (e) {
    best.traceStatus = 'error';
    best.latentPatternCandidate = null;
  }

  return best;
}

// =============================================================================
// SECTION 3.5 — TRACE SOLVER (Human-style Inference Simulator)
// =============================================================================
// Simulates how a human solver would deduce the puzzle step-by-step.
// Each step records what pattern was applied, its cognitive cost, and how
// it changed the domain. The full trace becomes input to the difficulty
// metric (3.6) and to the constraint-driven generator (3.7) for evaluation.
//
// Domain representation — two-tier:
//   PairDomain { positions: Set, genderMode: 'unknown'|'g1g2'|'g2g1' }
//   This separates "where" the pair sits from "which gender is c1/c2"
//   so partial decisions (position fixed, gender open) are first-class.
// =============================================================================

// ─────────────────────────────────────────────────────────────────────────────
// State initialization — build the search state from a puzzle instance
// ─────────────────────────────────────────────────────────────────────────────
function ts_initializeState(puzzle) {
  const n = puzzle.n;
  const tokens = puzzle.tokens;
  const pairs = puzzle.pairs;
  const forbidden = new Set(puzzle.forbiddenCells.map(([r, c]) => `${r},${c}`));
  const fixedByCell = {};
  for (const ft of (puzzle.fixedCells || [])) fixedByCell[`${ft.row},${ft.col}`] = ft;
  const rowRules = {}, colRules = {};
  for (const r of (puzzle.lineRules || [])) {
    if (r.isRow) (rowRules[r.idx] = rowRules[r.idx] || []).push(r);
    else (colRules[r.idx] = colRules[r.idx] || []).push(r);
  }
  const rowHints = {}, colHints = {};
  for (const h of (puzzle.countHints || [])) {
    if (h.row !== null) (rowHints[h.row] = rowHints[h.row] || []).push(h);
    else (colHints[h.col] = colHints[h.col] || []).push(h);
  }

  // Per-pair species
  const pairSpecies = pairs.map(([t1]) => tokens.find(t => t.id === t1).animalId);

  // Build initial domains for each pair
  function cellOk(row, col, animalId, gender) {
    const key = `${row},${col}`;
    if (forbidden.has(key)) return false;
    const ft = fixedByCell[key];
    if (ft) {
      if (ft.animalId !== animalId) return false;
      if (ft.gender !== gender) return false;
    }
    const animal = animalById(animalId);
    const rules = [...(rowRules[row] || []), ...(colRules[col] || [])];
    for (const rule of rules) {
      if (rule.dim === 'gender') {
        if (gender !== rule.val) return false;
      } else {
        if (animal[rule.dim] !== rule.val) return false;
      }
    }
    return true;
  }

  const domains = pairs.map((pair, pairIdx) => {
    const animalId = pairSpecies[pairIdx];
    const positions = []; // [{c1, c2, allowedGenders: 'g1g2'|'g2g1'|'both'}]
    const fixedForSpecies = (puzzle.fixedCells || []).filter(ft => ft.animalId === animalId);

    if (fixedForSpecies.length === 2) {
      const [a, b] = fixedForSpecies;
      if (isAdjacent(a, b) && a.gender !== b.gender) {
        // Fully pinned
        const g1g2 = (a.gender === 'male') ? 'g1g2' : 'g2g1';
        positions.push({ c1: { row: a.row, col: a.col }, c2: { row: b.row, col: b.col }, gender: g1g2 });
      }
    } else if (fixedForSpecies.length === 1) {
      const ft = fixedForSpecies[0];
      const otherG = ft.gender === 'male' ? 'female' : 'male';
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (dr === 0 && dc === 0) continue;
          const r2 = ft.row + dr, c2 = ft.col + dc;
          if (r2 < 0 || r2 >= n || c2 < 0 || c2 >= n) continue;
          if (!cellOk(r2, c2, animalId, otherG)) continue;
          const gender = (ft.gender === 'male') ? 'g1g2' : 'g2g1';
          positions.push({
            c1: { row: ft.row, col: ft.col }, c2: { row: r2, col: c2 }, gender,
          });
        }
      }
    } else {
      for (let r1 = 0; r1 < n; r1++) {
        for (let c1 = 0; c1 < n; c1++) {
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              if (dr === 0 && dc === 0) continue;
              const r2 = r1 + dr, c2 = c1 + dc;
              if (r2 < 0 || r2 >= n || c2 < 0 || c2 >= n) continue;
              const k1 = `${r1},${c1}`, k2 = `${r2},${c2}`;
              if (k1 >= k2) continue;
              const okMF = cellOk(r1, c1, animalId, 'male') && cellOk(r2, c2, animalId, 'female');
              const okFM = cellOk(r1, c1, animalId, 'female') && cellOk(r2, c2, animalId, 'male');
              if (okMF && okFM) {
                positions.push({ c1: { row: r1, col: c1 }, c2: { row: r2, col: c2 }, gender: 'both' });
              } else if (okMF) {
                positions.push({ c1: { row: r1, col: c1 }, c2: { row: r2, col: c2 }, gender: 'g1g2' });
              } else if (okFM) {
                positions.push({ c1: { row: r1, col: c1 }, c2: { row: r2, col: c2 }, gender: 'g2g1' });
              }
            }
          }
        }
      }
    }

    return { positions, decided: false };
  });

  // Pre-decide pairs that have fully fixed cells
  const decisions = {};
  const usedCells = new Set();
  for (let i = 0; i < pairs.length; i++) {
    if (domains[i].positions.length === 1 && domains[i].positions[0].gender !== 'both') {
      const p = domains[i].positions[0];
      const g1 = p.gender === 'g1g2' ? 'male' : 'female';
      const g2 = p.gender === 'g1g2' ? 'female' : 'male';
      decisions[i] = { c1: p.c1, c2: p.c2, g1, g2, animalId: pairSpecies[i] };
      domains[i].decided = true;
      usedCells.add(`${p.c1.row},${p.c1.col}`);
      usedCells.add(`${p.c2.row},${p.c2.col}`);
    }
  }

  return {
    n, pairs, tokens, pairSpecies,
    forbidden, fixedByCell, rowRules, colRules, rowHints, colHints,
    domains, decisions, usedCells,
    activePairs: pairs.map((_, i) => i).filter(i => !domains[i].decided),
  };
}

// ─────────────────────────────────────────────────────────────────────────────
// State helpers
// ─────────────────────────────────────────────────────────────────────────────
function ts_isSolved(state) {
  return state.activePairs.length === 0;
}

function ts_cloneState(state) {
  return {
    ...state,
    domains: state.domains.map(d => ({
      decided: d.decided,
      positions: d.positions.map(p => ({ c1: p.c1, c2: p.c2, gender: p.gender })),
    })),
    decisions: { ...state.decisions },
    usedCells: new Set(state.usedCells),
    activePairs: [...state.activePairs],
  };
}

function ts_pruneByUsedCells(state) {
  // Remove positions whose cells are already taken
  let changed = false;
  for (const pairIdx of state.activePairs) {
    const dom = state.domains[pairIdx];
    const before = dom.positions.length;
    dom.positions = dom.positions.filter(p =>
      !state.usedCells.has(`${p.c1.row},${p.c1.col}`) &&
      !state.usedCells.has(`${p.c2.row},${p.c2.col}`)
    );
    if (dom.positions.length !== before) changed = true;
  }
  return changed;
}

function ts_decidePair(state, pairIdx, position, genderChoice) {
  // genderChoice: 'g1g2' or 'g2g1' (must be compatible with position.gender)
  const g1 = genderChoice === 'g1g2' ? 'male' : 'female';
  const g2 = genderChoice === 'g1g2' ? 'female' : 'male';
  state.decisions[pairIdx] = {
    c1: position.c1, c2: position.c2, g1, g2,
    animalId: state.pairSpecies[pairIdx],
  };
  state.domains[pairIdx].decided = true;
  state.domains[pairIdx].positions = [{ c1: position.c1, c2: position.c2, gender: genderChoice }];
  state.usedCells.add(`${position.c1.row},${position.c1.col}`);
  state.usedCells.add(`${position.c2.row},${position.c2.col}`);
  state.activePairs = state.activePairs.filter(i => i !== pairIdx);
}

function ts_lineCounts(state) {
  // Count tokens by line based on current decisions
  const rowOcc = {}, colOcc = {}, rowMale = {}, rowFemale = {}, colMale = {}, colFemale = {};
  for (const pairIdx in state.decisions) {
    const d = state.decisions[pairIdx];
    rowOcc[d.c1.row] = (rowOcc[d.c1.row] || 0) + 1;
    rowOcc[d.c2.row] = (rowOcc[d.c2.row] || 0) + 1;
    colOcc[d.c1.col] = (colOcc[d.c1.col] || 0) + 1;
    colOcc[d.c2.col] = (colOcc[d.c2.col] || 0) + 1;
    (d.g1 === 'male' ? rowMale : rowFemale)[d.c1.row] = ((d.g1 === 'male' ? rowMale : rowFemale)[d.c1.row] || 0) + 1;
    (d.g2 === 'male' ? rowMale : rowFemale)[d.c2.row] = ((d.g2 === 'male' ? rowMale : rowFemale)[d.c2.row] || 0) + 1;
    (d.g1 === 'male' ? colMale : colFemale)[d.c1.col] = ((d.g1 === 'male' ? colMale : colFemale)[d.c1.col] || 0) + 1;
    (d.g2 === 'male' ? colMale : colFemale)[d.c2.col] = ((d.g2 === 'male' ? colMale : colFemale)[d.c2.col] || 0) + 1;
  }
  return { rowOcc, colOcc, rowMale, rowFemale, colMale, colFemale };
}


// ─────────────────────────────────────────────────────────────────────────────
// V5 — GAME-SPECIFIC AXIOM HELPERS
// ─────────────────────────────────────────────────────────────────────────────
// These helpers expose the 4-fold axiom structure of Zoograms to the v5
// inference patterns. They are deterministic functions of the puzzle state
// and the global ANIMALS catalog, so the patterns themselves can stay
// declarative.

// Map: habitat → diet → number of species
// Derived once from ANIMALS at load time.
const HABITAT_DIET_MAP = (() => {
  const map = {};
  for (const a of ANIMALS) {
    if (!map[a.habitat]) map[a.habitat] = { '육식': 0, '초식': 0, total: 0, species: [] };
    map[a.habitat][a.diet]++;
    map[a.habitat].total++;
    map[a.habitat].species.push(a.id);
  }
  return map;
})();

// Returns species IDs eligible for a line given the line's rules.
// Eligible = species whose attributes match every rule on this line.
function ts_eligibleSpeciesForLine(state, isRow, idx) {
  const rules = isRow ? (state.rowRules[idx] || []) : (state.colRules[idx] || []);
  const eligible = [];
  for (const a of ANIMALS) {
    let ok = true;
    for (const rule of rules) {
      if (rule.dim === 'gender') continue; // gender is per-token, not per-species
      if (a[rule.dim] !== rule.val) { ok = false; break; }
    }
    if (ok) eligible.push(a.id);
  }
  return eligible;
}

// Compute how many cells of a position fall on a given line.
// Returns 0, 1, or 2.
function ts_positionLineCount(pos, isRow, idx) {
  let cnt = 0;
  if (isRow) {
    if (pos.c1.row === idx) cnt++;
    if (pos.c2.row === idx) cnt++;
  } else {
    if (pos.c1.col === idx) cnt++;
    if (pos.c2.col === idx) cnt++;
  }
  return cnt;
}

// Returns the Total hint value for a line, or null if no Total hint exists.

// Returns true if any rule on this line constrains habitat or diet.
function ts_lineHasAttributeRule(state, isRow, idx) {
  const rules = isRow ? (state.rowRules[idx] || []) : (state.colRules[idx] || []);
  return rules.some(r => r.dim === 'habitat' || r.dim === 'diet');
}

// Iterate every line (row + col), call fn(isRow, idx).

// ─────────────────────────────────────────────────────────────────────────────
// LEVEL 0 PATTERNS — direct forcing (cost 1)
// ─────────────────────────────────────────────────────────────────────────────

// Pattern 0a: Naked Single — domain reduced to 1 position with determined gender
function ts_tryNakedSingle(state) {
  for (const pairIdx of state.activePairs) {
    const dom = state.domains[pairIdx];
    if (dom.positions.length !== 1) continue;
    const pos = dom.positions[0];
    if (pos.gender === 'both') continue; // gender still ambiguous
    return {
      type: 'naked-single', cost: 1, pairIdx,
      premises: [`pair-${pairIdx}-domain-singleton`],
      conclusion: { kind: 'pair-decided', position: pos, gender: pos.gender },
      domainBefore: 1, domainAfter: 1,
      branchingFactor: 1,
      apply(s) { ts_decidePair(s, pairIdx, pos, pos.gender); ts_pruneByUsedCells(s); }
    };
  }
  return null;
}

// Pattern 0c: Position-Locked Gender — single position, both genders open,
// but a gender rule on involved line forces one.
function ts_tryPositionLockedGender(state) {
  for (const pairIdx of state.activePairs) {
    const dom = state.domains[pairIdx];
    if (dom.positions.length !== 1) continue;
    const pos = dom.positions[0];
    if (pos.gender !== 'both') continue;

    // Check gender rules on c1/c2 lines
    const rulesC1 = [...(state.rowRules[pos.c1.row] || []), ...(state.colRules[pos.c1.col] || [])];
    const rulesC2 = [...(state.rowRules[pos.c2.row] || []), ...(state.colRules[pos.c2.col] || [])];
    let g1Forced = null, g2Forced = null;
    for (const r of rulesC1) if (r.dim === 'gender') g1Forced = r.val;
    for (const r of rulesC2) if (r.dim === 'gender') g2Forced = r.val;
    if (g1Forced && g2Forced && g1Forced === g2Forced) return null; // inconsistent
    let chosen = null;
    if (g1Forced === 'male' || g2Forced === 'female') chosen = 'g1g2';
    else if (g1Forced === 'female' || g2Forced === 'male') chosen = 'g2g1';
    if (!chosen) continue;
    return {
      type: 'position-locked-gender', cost: 2, pairIdx,
      premises: ['line-gender-rule'],
      conclusion: { kind: 'gender-decided', position: pos, gender: chosen },
      domainBefore: 1, domainAfter: 1,
      branchingFactor: 1,
      apply(s) { ts_decidePair(s, pairIdx, pos, chosen); ts_pruneByUsedCells(s); }
    };
  }
  return null;
}

// ─────────────────────────────────────────────────────────────────────────────
// LEVEL 1 PATTERNS — counting forcing (cost 2)
// ─────────────────────────────────────────────────────────────────────────────

// Pattern 1a: Total Count Saturation
// If a line's total hint = current decided tokens, no more pairs can use this line.
function ts_tryTotalSaturation(state) {
  const counts = ts_lineCounts(state);
  for (const idx in state.rowHints) {
    for (const h of state.rowHints[idx]) {
      if (h.type !== 'total') continue;
      const cur = counts.rowOcc[idx] || 0;
      if (cur < h.value) continue;
      // Saturated — prune all candidates that would add to this row
      const r = parseInt(idx);
      for (const pairIdx of state.activePairs) {
        const dom = state.domains[pairIdx];
        const before = dom.positions.length;
        const survivors = dom.positions.filter(p => p.c1.row !== r && p.c2.row !== r);
        if (survivors.length !== before) {
          if (survivors.length === 0) continue; // contradiction handled later
          return {
            type: 'total-saturation', cost: 2, pairIdx,
            premises: [`row-${r}-total-saturated`],
            conclusion: { kind: 'domain-pruned', from: before, to: survivors.length },
            domainBefore: before, domainAfter: survivors.length,
            branchingFactor: 1,
            apply(s) { s.domains[pairIdx].positions = survivors; }
          };
        }
      }
    }
  }
  for (const idx in state.colHints) {
    for (const h of state.colHints[idx]) {
      if (h.type !== 'total') continue;
      const cur = counts.colOcc[idx] || 0;
      if (cur < h.value) continue;
      const c = parseInt(idx);
      for (const pairIdx of state.activePairs) {
        const dom = state.domains[pairIdx];
        const before = dom.positions.length;
        const survivors = dom.positions.filter(p => p.c1.col !== c && p.c2.col !== c);
        if (survivors.length !== before) {
          if (survivors.length === 0) continue;
          return {
            type: 'total-saturation', cost: 2, pairIdx,
            premises: [`col-${c}-total-saturated`],
            conclusion: { kind: 'domain-pruned', from: before, to: survivors.length },
            domainBefore: before, domainAfter: survivors.length,
            branchingFactor: 1,
            apply(s) { s.domains[pairIdx].positions = survivors; }
          };
        }
      }
    }
  }
  return null;
}

// Pattern 1b: Total Count Forcing
// If line's #hint - current = number of pair-options that touch this line,
// every option that doesn't touch must be eliminated.
function ts_tryTotalForcing(state) {
  const counts = ts_lineCounts(state);
  // For each total hint, find pairs where ALL surviving options touch this line.
  // If the count mandate forces exactly remaining-per-pair contributions, we lock.
  // Simpler version: if a pair has ALL options going through line X, count that
  // pair as a forced contributor.
  for (const idx in state.rowHints) {
    for (const h of state.rowHints[idx]) {
      if (h.type !== 'total') continue;
      const r = parseInt(idx);
      const cur = counts.rowOcc[r] || 0;
      const need = h.value - cur;
      if (need <= 0) continue;
      // For each active pair, count its contributions options
      const contribs = []; // [{pairIdx, mandatoryContrib, maxContrib}]
      for (const pairIdx of state.activePairs) {
        const dom = state.domains[pairIdx];
        const contribsForPair = dom.positions.map(p =>
          (p.c1.row === r ? 1 : 0) + (p.c2.row === r ? 1 : 0)
        );
        const minC = Math.min(...contribsForPair);
        const maxC = Math.max(...contribsForPair);
        contribs.push({ pairIdx, minC, maxC, posCount: dom.positions.length });
      }
      const sumMin = contribs.reduce((s, x) => s + x.minC, 0);
      const sumMax = contribs.reduce((s, x) => s + x.maxC, 0);
      // If max == need, pairs with options of differing contributions get pruned
      // to only options that match max contribution.
      if (sumMax === need) {
        for (const c of contribs) {
          if (c.minC === c.maxC) continue;
          const dom = state.domains[c.pairIdx];
          const before = dom.positions.length;
          const survivors = dom.positions.filter(p =>
            ((p.c1.row === r ? 1 : 0) + (p.c2.row === r ? 1 : 0)) === c.maxC
          );
          if (survivors.length !== before && survivors.length > 0) {
            return {
              type: 'total-forcing', cost: 2, pairIdx: c.pairIdx,
              premises: [`row-${r}-total-forcing`],
              conclusion: { kind: 'domain-pruned', from: before, to: survivors.length },
              domainBefore: before, domainAfter: survivors.length,
              branchingFactor: 1,
              apply(s) { s.domains[c.pairIdx].positions = survivors; }
            };
          }
        }
      }
      // Conversely, if sumMin > need, contradiction (handled by impossibility).
      // If sumMax < need, also contradiction.
    }
  }
  // Same for cols
  for (const idx in state.colHints) {
    for (const h of state.colHints[idx]) {
      if (h.type !== 'total') continue;
      const c = parseInt(idx);
      const cur = counts.colOcc[c] || 0;
      const need = h.value - cur;
      if (need <= 0) continue;
      const contribs = [];
      for (const pairIdx of state.activePairs) {
        const dom = state.domains[pairIdx];
        const contribsForPair = dom.positions.map(p =>
          (p.c1.col === c ? 1 : 0) + (p.c2.col === c ? 1 : 0)
        );
        contribs.push({ pairIdx, minC: Math.min(...contribsForPair), maxC: Math.max(...contribsForPair) });
      }
      const sumMax = contribs.reduce((s, x) => s + x.maxC, 0);
      if (sumMax === need) {
        for (const co of contribs) {
          if (co.minC === co.maxC) continue;
          const dom = state.domains[co.pairIdx];
          const before = dom.positions.length;
          const survivors = dom.positions.filter(p =>
            ((p.c1.col === c ? 1 : 0) + (p.c2.col === c ? 1 : 0)) === co.maxC
          );
          if (survivors.length !== before && survivors.length > 0) {
            return {
              type: 'total-forcing', cost: 2, pairIdx: co.pairIdx,
              premises: [`col-${c}-total-forcing`],
              conclusion: { kind: 'domain-pruned', from: before, to: survivors.length },
              domainBefore: before, domainAfter: survivors.length,
              branchingFactor: 1,
              apply(s) { s.domains[co.pairIdx].positions = survivors; }
            };
          }
        }
      }
    }
  }
  return null;
}

// Pattern 1c: Gender Count Forcing
// H1 hint says line should have N males. If current males = N, all 'both' options
// in that line get forced to female. Symmetric for females.
function ts_tryGenderCountForcing(state) {
  const counts = ts_lineCounts(state);
  function applyHintLine(hints, isRow) {
    for (const idx in hints) {
      for (const h of hints[idx]) {
        if (h.type !== 'H1' && h.type !== 'H2') continue;
        const lineIdx = parseInt(idx);
        const isMaleHint = h.type === 'H1';
        const cur = isRow
          ? (isMaleHint ? counts.rowMale : counts.rowFemale)[lineIdx] || 0
          : (isMaleHint ? counts.colMale : counts.colFemale)[lineIdx] || 0;
        const need = h.value - cur;
        if (need < 0) return null; // already exceeded — let impossibility detect

        // For active pairs: how many of their position options can still place
        // a token of (isMaleHint ? male : female) in this line?
        for (const pairIdx of state.activePairs) {
          const dom = state.domains[pairIdx];
          if (dom.positions.length !== 1) continue;
          const pos = dom.positions[0];
          if (pos.gender !== 'both') continue;
          // Position fixed but gender open. Check which gender lands in this line.
          const c1InLine = isRow ? pos.c1.row === lineIdx : pos.c1.col === lineIdx;
          const c2InLine = isRow ? pos.c2.row === lineIdx : pos.c2.col === lineIdx;
          if (!c1InLine && !c2InLine) continue;
          // If only c1 is in this line, gender of c1 dictates contribution
          if (c1InLine && !c2InLine) {
            // c1 must be (isMaleHint ? male : female) to contribute, or NOT to skip
            // Saturated case: cur == h.value → c1 can't be male (if H1)
            if (cur >= h.value) {
              const chosen = isMaleHint ? 'g2g1' : 'g1g2';
              return {
                type: 'gender-count-forcing', cost: 2, pairIdx,
                premises: [`${isRow?'row':'col'}-${lineIdx}-${h.type}-saturated`],
                conclusion: { kind: 'gender-decided', position: pos, gender: chosen },
                domainBefore: 1, domainAfter: 1,
                branchingFactor: 1,
                apply(s) { ts_decidePair(s, pairIdx, pos, chosen); ts_pruneByUsedCells(s); }
              };
            }
          }
          if (c2InLine && !c1InLine) {
            if (cur >= h.value) {
              const chosen = isMaleHint ? 'g1g2' : 'g2g1';
              return {
                type: 'gender-count-forcing', cost: 2, pairIdx,
                premises: [`${isRow?'row':'col'}-${lineIdx}-${h.type}-saturated`],
                conclusion: { kind: 'gender-decided', position: pos, gender: chosen },
                domainBefore: 1, domainAfter: 1,
                branchingFactor: 1,
                apply(s) { ts_decidePair(s, pairIdx, pos, chosen); ts_pruneByUsedCells(s); }
              };
            }
          }
        }
      }
    }
    return null;
  }
  return applyHintLine(state.rowHints, true) || applyHintLine(state.colHints, false);
}

// Pattern 1d: Structural Impossibility — detect impossibility and prune
// A pair's option that would force a count beyond the hint is invalid.
function ts_tryImpossibilityDetection(state) {
  const counts = ts_lineCounts(state);
  for (const pairIdx of state.activePairs) {
    const dom = state.domains[pairIdx];
    if (dom.positions.length <= 1) continue;
    const before = dom.positions.length;
    const survivors = dom.positions.filter(p => {
      // Check if adding this position would violate any total/H1/H2 hint
      // CRITICAL: H1 checks must use male count (curMale), H2 checks must use
      // female count (curFemale), NOT the total occupancy. Earlier versions
      // incorrectly used curOcc for all hint types — this falsely pruned
      // candidates whose male contribution was actually 0 or 1 but whose
      // total cell count was high.
      function checkLine(hints, lineIdx, isRow, curOcc, curMale, curFemale) {
        for (const h of (hints[lineIdx] || [])) {
          let delta = 0;
          if (isRow) {
            if (p.c1.row === lineIdx) delta++;
            if (p.c2.row === lineIdx) delta++;
          } else {
            if (p.c1.col === lineIdx) delta++;
            if (p.c2.col === lineIdx) delta++;
          }
          if (h.type === 'total') {
            if ((curOcc || 0) + delta > h.value) return false;
          }
          if (h.type === 'H1') {
            // pair = exactly 1♂ + 1♀
            // delta === 2: both cells on line → exactly +1 male regardless of gender mode
            // delta === 1: 'both' gender → male contribution 0 or 1; conservative skip
            //              g1g2/g2g1: known contribution
            if (delta === 2) {
              if ((curMale || 0) + 1 > h.value) return false;
            } else if (delta === 1) {
              if (p.gender === 'g1g2') {
                const c1OnLine = isRow ? p.c1.row === lineIdx : p.c1.col === lineIdx;
                const m = c1OnLine ? 1 : 0;
                if ((curMale || 0) + m > h.value) return false;
              } else if (p.gender === 'g2g1') {
                const c2OnLine = isRow ? p.c2.row === lineIdx : p.c2.col === lineIdx;
                const m = c2OnLine ? 1 : 0;
                if ((curMale || 0) + m > h.value) return false;
              }
              // gender 'both' delta=1: skip conservatively (could be 0 or 1)
            }
          }
          if (h.type === 'H2') {
            if (delta === 2) {
              if ((curFemale || 0) + 1 > h.value) return false;
            } else if (delta === 1) {
              if (p.gender === 'g1g2') {
                const c2OnLine = isRow ? p.c2.row === lineIdx : p.c2.col === lineIdx;
                const f = c2OnLine ? 1 : 0;
                if ((curFemale || 0) + f > h.value) return false;
              } else if (p.gender === 'g2g1') {
                const c1OnLine = isRow ? p.c1.row === lineIdx : p.c1.col === lineIdx;
                const f = c1OnLine ? 1 : 0;
                if ((curFemale || 0) + f > h.value) return false;
              }
            }
          }
        }
        return true;
      }
      if (!checkLine(state.rowHints, p.c1.row, true,
                     counts.rowOcc[p.c1.row], counts.rowMale[p.c1.row], counts.rowFemale[p.c1.row])) return false;
      if (p.c2.row !== p.c1.row && !checkLine(state.rowHints, p.c2.row, true,
                     counts.rowOcc[p.c2.row], counts.rowMale[p.c2.row], counts.rowFemale[p.c2.row])) return false;
      if (!checkLine(state.colHints, p.c1.col, false,
                     counts.colOcc[p.c1.col], counts.colMale[p.c1.col], counts.colFemale[p.c1.col])) return false;
      if (p.c2.col !== p.c1.col && !checkLine(state.colHints, p.c2.col, false,
                     counts.colOcc[p.c2.col], counts.colMale[p.c2.col], counts.colFemale[p.c2.col])) return false;
      return true;
    });
    if (survivors.length !== before && survivors.length > 0) {
      return {
        type: 'impossibility-detection', cost: 2, pairIdx,
        premises: ['count-hint-bound'],
        conclusion: { kind: 'domain-pruned', from: before, to: survivors.length },
        domainBefore: before, domainAfter: survivors.length,
        branchingFactor: 1,
        apply(s) { s.domains[pairIdx].positions = survivors; }
      };
    }
  }
  return null;
}

// ─────────────────────────────────────────────────────────────────────────────
// LEVEL 2 PATTERNS — cross-constraint inference (cost 3)
// ─────────────────────────────────────────────────────────────────────────────

// Pattern 2a: Naked Pair — two pairs share exactly the same 2 position options

// Pattern 2b: Hidden Single — a species has only ONE way to land on a line
// where it's required (usually by counting).


// ─────────────────────────────────────────────────────────────────────────────
// V5 PATTERN α — Habitat Combinatorial Forcing (cost 3)
// ─────────────────────────────────────────────────────────────────────────────
// Uses A3 (Habitat) + A4 (Diet) + A5 (LineRule) to detect when a line's
// attribute rule combined with the asymmetric species distribution
// excludes specific pairs from that line. For example: a line with
// habitat='극지' rule must contain only 극지 species (북극곰/펭귄/사향소/북극토끼).
// Pairs of other species cannot place tokens on this line.
//
// A second mode also fires when the eligible species count for a line is
// LESS than required by the Total hint — e.g. line has habitat='사바나' rule
// + Total=4, but 사바나 has only 3 species → the puzzle must include all 3
// 사바나 pairs AND at least one of them must extend across line boundary.
// In that case we eliminate non-eligible pairs from this line.
function ts_tryHabitatCombinatorial(state) {
  for (let isRow = 0; isRow <= 1; isRow++) {
    for (let idx = 0; idx < state.n; idx++) {
      if (!ts_lineHasAttributeRule(state, !!isRow, idx)) continue;

      const eligibleSpeciesIds = ts_eligibleSpeciesForLine(state, !!isRow, idx);
      // Find pairs whose species is NOT eligible for this line
      for (const pairIdx of state.activePairs) {
        const species = state.pairSpecies[pairIdx];
        if (eligibleSpeciesIds.includes(species)) continue;

        const dom = state.domains[pairIdx];
        const before = dom.positions.length;
        // Eliminate positions that touch this line
        const survivors = dom.positions.filter(p =>
          ts_positionLineCount(p, !!isRow, idx) === 0
        );
        if (survivors.length < before && survivors.length > 0) {
          const ruleDesc = (state[isRow ? 'rowRules' : 'colRules'][idx] || [])
            .filter(r => r.dim !== 'gender')
            .map(r => `${r.dim}=${r.val}`)
            .join(',');
          return {
            type: 'habitat-combinatorial', cost: 3, pairIdx,
            premises: [`${isRow ? 'row' : 'col'}-${idx}-${ruleDesc}-excludes-species-${species}`],
            conclusion: { kind: 'domain-pruned', from: before, to: survivors.length },
            domainBefore: before, domainAfter: survivors.length,
            branchingFactor: 2,
            apply(s) { s.domains[pairIdx].positions = survivors; }
          };
        }
      }
    }
  }
  return null;
}

// ─────────────────────────────────────────────────────────────────────────────
// V5 PATTERN β — Pair Adjacency Propagation (cost 3.5)
// ─────────────────────────────────────────────────────────────────────────────
// Uses A1+A2 (Pair Adjacency) directly. When ALL of a pair's surviving
// candidate positions share the SAME cell (either as c1 or c2), that cell
// is guaranteed to be used by this pair. Other pairs cannot have any
// candidate using that cell.
//
// This is the deepest exploitation of the pair-adjacency axiom — game-specific.
function ts_tryPairAdjacencyPropagation(state) {
  for (const pairIdx of state.activePairs) {
    const dom = state.domains[pairIdx];
    if (dom.positions.length < 2) continue; // Naked Single handles size 1
    if (dom.positions.length > 8) continue; // bound search

    // Count: for each cell, how many of this pair's positions use it (as c1 or c2)
    const cellUsage = {};
    for (const pos of dom.positions) {
      const k1 = `${pos.c1.row},${pos.c1.col}`, k2 = `${pos.c2.row},${pos.c2.col}`;
      cellUsage[k1] = (cellUsage[k1] || 0) + 1;
      cellUsage[k2] = (cellUsage[k2] || 0) + 1;
    }

    const guaranteedCells = [];
    for (const [cellKey, count] of Object.entries(cellUsage)) {
      if (count === dom.positions.length) {
        guaranteedCells.push(cellKey);
      }
    }
    if (guaranteedCells.length === 0) continue;

    // For each other active pair, prune candidates touching guaranteed cells
    for (const otherIdx of state.activePairs) {
      if (otherIdx === pairIdx) continue;
      const otherDom = state.domains[otherIdx];
      const before = otherDom.positions.length;
      const survivors = otherDom.positions.filter(p => {
        const k1 = `${p.c1.row},${p.c1.col}`, k2 = `${p.c2.row},${p.c2.col}`;
        return !guaranteedCells.includes(k1) && !guaranteedCells.includes(k2);
      });
      if (survivors.length < before && survivors.length > 0) {
        return {
          type: 'pair-adjacency-prop', cost: 3.5, pairIdx: otherIdx,
          premises: [`pair-${pairIdx}-must-use-cells-${guaranteedCells.join('|')}`],
          conclusion: { kind: 'domain-pruned', from: before, to: survivors.length },
          domainBefore: before, domainAfter: survivors.length,
          branchingFactor: 2,
          apply(s) { s.domains[otherIdx].positions = survivors; }
        };
      }
    }
  }
  return null;
}

// ─────────────────────────────────────────────────────────────────────────────
// V5 PATTERN γ — Species Uniqueness Forcing (cost 4)
// ─────────────────────────────────────────────────────────────────────────────
// Combines line attribute rules (A5) + Total hint (A6) + species uniqueness
// to derive strong constraints. Example:
//   Line has habitat='극지' rule (eligible: 북극곰/펭귄/사향소/북극토끼) + Total=4
//   → max contribution from each eligible pair to this line = 2 (both tokens)
//   → 4 tokens needed, 3 eligible species → at least 2 pairs must contribute 2
//   → those pairs must have horizontal/vertical orientation matching this line
//   → other configurations eliminated
//
// This pattern detects two scenarios:
//   (1) maxContrib == totalHint → all eligible pairs must contribute their max
//   (2) minContrib == totalHint → no other pair can enter this line



// ─────────────────────────────────────────────────────────────────────────────
// V5+ MULTI-PAIR JOINT REASONING — patterns M1-M5 (SOTA)
// ─────────────────────────────────────────────────────────────────────────────
// These patterns reason about MULTIPLE pairs simultaneously, deducing
// constraints from the joint contribution of several pairs to lines.
// They handle inference impossible at single-pair level — the inference
// family unique to Zoograms, arising from interaction of:
//   - Pair adjacency (A1+A2)
//   - Species attribute matching with line rules (A3+A4+A5)
//   - Total/H1 hints (A6+A7)
//   - Handpool composition
//
// Pattern catalogue:
//   M1 Bin Packing Force      — single-line subset forcing (cost 4)
//   M2 Multi-Line Distribution — joint constraint over 2 lines (cost 5)
//   M3 Adjacency Cascade      — shared cell-set propagation (cost 4.5)
//   M4 Hidden Species Force   — eligibility-saturation forcing (cost 5)
//   M5 Cross-Line Synergy     — saturated-line cell exclusion (cost 5.5)

// ════════════════════════════════════════════════════════════════════════════
// SHARED HELPERS
// ════════════════════════════════════════════════════════════════════════════

// Compute (minContrib, maxContrib, perPosition) of pair to a given line.
// perPos[i] = contribution if position i is selected (0, 1, or 2).
function ts_pairContribRange(state, pairIdx, isRow, lineIdx) {
  const dom = state.domains[pairIdx];
  if (dom.positions.length === 0) return { min: 0, max: 0, perPos: [] };
  let min = 999, max = -1;
  const perPos = [];
  for (const p of dom.positions) {
    let c = 0;
    if (isRow) {
      if (p.c1.row === lineIdx) c++;
      if (p.c2.row === lineIdx) c++;
    } else {
      if (p.c1.col === lineIdx) c++;
      if (p.c2.col === lineIdx) c++;
    }
    if (c < min) min = c;
    if (c > max) max = c;
    perPos.push(c);
  }
  return { min, max, perPos };
}

// Compute joint contribution to BOTH lines simultaneously.
// Returns array of {pos, c1Line, c2Line} where c1Line/c2Line are
// contributions to (row1, col1) or (row1, row2) etc.

// How many tokens of THIS line are already decided?
function ts_currentLineOccupancy(state, isRow, lineIdx) {
  let cur = 0;
  for (const pi in state.decisions) {
    const d = state.decisions[pi];
    if (isRow) {
      if (d.c1.row === lineIdx) cur++;
      if (d.c2.row === lineIdx) cur++;
    } else {
      if (d.c1.col === lineIdx) cur++;
      if (d.c2.col === lineIdx) cur++;
    }
  }
  return cur;
}

// How many ♂ tokens of THIS line are already decided?
function ts_currentLineMaleCount(state, isRow, lineIdx) {
  let m = 0;
  for (const pi in state.decisions) {
    const d = state.decisions[pi];
    if (isRow) {
      if (d.c1.row === lineIdx && d.g1 === 'male') m++;
      if (d.c2.row === lineIdx && d.g2 === 'male') m++;
    } else {
      if (d.c1.col === lineIdx && d.g1 === 'male') m++;
      if (d.c2.col === lineIdx && d.g2 === 'male') m++;
    }
  }
  return m;
}

// Compute current decided cells (used for adjacency cascade exclusion).

// ════════════════════════════════════════════════════════════════════════════
// M1 — BIN PACKING FORCE (cost 4)
// ════════════════════════════════════════════════════════════════════════════
// For a line L with Total hint T:
//   need = T - currentDecidedTokensOnL
//   for each active pair P, contribution range [P.min, P.max]
//   sumMin = Σ P.min, sumMax = Σ P.max
//
//   Per-pair forcing (single-pair, basic):
//     If sumMax - P.max + P.min < need → P must contribute > P.min
//     If sumMin - P.min + P.max > need → P must contribute < P.max
//
//   Subset forcing (SOTA enhancement):
//     For each contribution level v ∈ {0, 1, 2}:
//       count "must-be-v" pairs (their full range = {v})
//       count "can-be-v" pairs (v ∈ their range)
//     If among pairs that CAN contribute v, removing pair P
//     leaves the line unfillable (cumulative max < need or min > need),
//     then P MUST contribute v.
//
//   Tight-bound forcing:
//     If sumMin === need: every pair P with P.max > P.min must lock to P.min
//     If sumMax === need: every pair P with P.max > P.min must lock to P.max
//     (these were the ts_tryTotalForcing original cases — preserved here
//      for completeness; will not double-fire because we check P.min === P.max)
//
// Time complexity: O(lines × pairs × candidates). Practical < 50ms.
function ts_tryBinPackingForce(state) {
  for (let isRow = 0; isRow <= 1; isRow++) {
    const hintsObj = isRow ? state.rowHints : state.colHints;
    for (const idxStr in hintsObj) {
      const idx = parseInt(idxStr);
      const totalHint = (hintsObj[idx] || []).find(h => h.type === 'total');
      if (!totalHint) continue;

      const cur = ts_currentLineOccupancy(state, !!isRow, idx);
      const need = totalHint.value - cur;
      if (need < 0) continue;

      // Collect contribution ranges
      const contribs = [];
      for (const pairIdx of state.activePairs) {
        const r = ts_pairContribRange(state, pairIdx, !!isRow, idx);
        if (r.max < 0) continue;
        contribs.push({ pairIdx, min: r.min, max: r.max, perPos: r.perPos });
      }
      if (contribs.length === 0) continue;

      const sumMin = contribs.reduce((s, c) => s + c.min, 0);
      const sumMax = contribs.reduce((s, c) => s + c.max, 0);

      // Per-pair bin-packing forcing
      for (const c of contribs) {
        if (c.min === c.max) continue;
        const dom = state.domains[c.pairIdx];

        // P must contribute MORE than minC (others can't make up the rest)
        if (sumMax - c.max + c.min < need) {
          const before = dom.positions.length;
          const survivors = dom.positions.filter((_, i) => c.perPos[i] > c.min);
          if (survivors.length < before && survivors.length > 0) {
            return {
              type: 'bin-packing-force', cost: 4, pairIdx: c.pairIdx,
              premises: [`${isRow ? 'row' : 'col'}-${idx}-bin-packing-min-forced`],
              conclusion: { kind: 'domain-pruned', from: before, to: survivors.length },
              domainBefore: before, domainAfter: survivors.length,
              branchingFactor: 2,
              apply(s) { s.domains[c.pairIdx].positions = survivors; }
            };
          }
        }
        // P must contribute LESS than maxC
        if (sumMin - c.min + c.max > need) {
          const before = dom.positions.length;
          const survivors = dom.positions.filter((_, i) => c.perPos[i] < c.max);
          if (survivors.length < before && survivors.length > 0) {
            return {
              type: 'bin-packing-force', cost: 4, pairIdx: c.pairIdx,
              premises: [`${isRow ? 'row' : 'col'}-${idx}-bin-packing-max-forced`],
              conclusion: { kind: 'domain-pruned', from: before, to: survivors.length },
              domainBefore: before, domainAfter: survivors.length,
              branchingFactor: 2,
              apply(s) { s.domains[c.pairIdx].positions = survivors; }
            };
          }
        }
      }

      // Tight-bound forcing: sumMin === need OR sumMax === need
      // → every variable pair locks to a single contribution value
      if (sumMin === need || sumMax === need) {
        const targetIsMin = sumMin === need;
        for (const c of contribs) {
          if (c.min === c.max) continue;
          const dom = state.domains[c.pairIdx];
          const before = dom.positions.length;
          const target = targetIsMin ? c.min : c.max;
          const survivors = dom.positions.filter((_, i) => c.perPos[i] === target);
          if (survivors.length < before && survivors.length > 0) {
            return {
              type: 'bin-packing-force', cost: 4, pairIdx: c.pairIdx,
              premises: [`${isRow ? 'row' : 'col'}-${idx}-bin-packing-tight-${targetIsMin?'min':'max'}`],
              conclusion: { kind: 'domain-pruned', from: before, to: survivors.length },
              domainBefore: before, domainAfter: survivors.length,
              branchingFactor: 1,
              apply(s) { s.domains[c.pairIdx].positions = survivors; }
            };
          }
        }
      }

      // ─── H1 (♂ count) bin-packing forcing ────────────────────────────────
      // Apply same envelope logic to ♂ count constraint.
      const h1Hint = (hintsObj[idx] || []).find(h => h.type === 'H1');
      if (h1Hint) {
        const curMale = ts_currentLineMaleCount(state, !!isRow, idx);
        const needMale = h1Hint.value - curMale;
        if (needMale >= 0) {
          // Build per-pair male contribution: per candidate position,
          // compute exact male count (0, 1, or 2). For 'both' mode, the
          // contribution is range [0, lineContrib].
          const malePerPos = []; // parallel to dom.positions
          const pairMaleContribs = [];
          for (const pi of state.activePairs) {
            const dom = state.domains[pi];
            if (dom.positions.length === 0) continue;
            // For each position, compute (maleMin, maleMax) precisely.
            const posMaleRanges = dom.positions.map(p => {
              const c1OnLine = isRow ? p.c1.row === idx : p.c1.col === idx;
              const c2OnLine = isRow ? p.c2.row === idx : p.c2.col === idx;
              if (p.gender === 'g1g2') {
                // c1 male, c2 female
                const m = (c1OnLine ? 1 : 0);
                return { min: m, max: m };
              } else if (p.gender === 'g2g1') {
                const m = (c2OnLine ? 1 : 0);
                return { min: m, max: m };
              } else {
                // 'both' — gender undecided. CRITICAL: a pair has EXACTLY
                // one male and one female. So if BOTH cells are on the line
                // (lineContrib === 2), male contribution is EXACTLY 1
                // (not [0, 2]). If exactly one cell is on the line
                // (lineContrib === 1), male contribution is 0 or 1 depending
                // on which cell turns out to be male.
                const lineContrib = (c1OnLine ? 1 : 0) + (c2OnLine ? 1 : 0);
                if (lineContrib === 2) {
                  return { min: 1, max: 1 };
                } else {
                  // lineContrib is 0 or 1
                  return { min: 0, max: lineContrib };
                }
              }
            });
            let mMin = 999, mMax = -1;
            for (const r of posMaleRanges) {
              if (r.min < mMin) mMin = r.min;
              if (r.max > mMax) mMax = r.max;
            }
            pairMaleContribs.push({ pairIdx: pi, min: mMin, max: mMax, posRanges: posMaleRanges });
          }
          const mSumMin = pairMaleContribs.reduce((s, c) => s + c.min, 0);
          const mSumMax = pairMaleContribs.reduce((s, c) => s + c.max, 0);

          // Per-pair envelope forcing on ♂ count
          //
          // CRITICAL axiom-aware filter:
          // When forcing P to contribute MORE than c.min male, a candidate
          // position survives if it CAN contribute > c.min male (i.e., its
          // ♂ MAX > c.min). The position's max represents the upper bound
          // achievable by some gender mode choice.
          //
          // When forcing P to contribute LESS than c.max male, a candidate
          // position survives if it CAN contribute < c.max male (i.e., its
          // ♂ MIN < c.max). The position's min represents the lower bound
          // achievable by some gender mode choice.
          //
          // Using the WRONG attribute (filtering by min for "more" or by
          // max for "less") incorrectly prunes positions that could satisfy
          // the constraint via gender choice — see seed4 axiom-violation bug.
          //
          // GENDER-MODE RESTRICTION (new): When position-level filter does
          // not change the domain, the forcing requirement may still
          // restrict gender modes. For each 'both' gender candidate, check
          // whether g1g2 mode and/or g2g1 mode satisfy the new contribution
          // bound. If only one mode satisfies, narrow the candidate's
          // gender. This keeps candidate space accurate per the pair axiom
          // (1♂+1♀), which manifests as different ♂ contributions in g1g2
          // vs g2g1 mode for the same position.
          for (const c of pairMaleContribs) {
            if (c.min === c.max) continue;
            const dom = state.domains[c.pairIdx];

            // Determine forcing direction (if any)
            const minForced = mSumMax - c.max + c.min < needMale;
            const maxForced = mSumMin - c.min + c.max > needMale;

            if (minForced) {
              // P must contribute MORE male than its min
              // → keep positions whose MAX achievable male contribution > c.min
              const before = dom.positions.length;
              const survivors = dom.positions.filter((_, i) => c.posRanges[i].max > c.min);
              if (survivors.length < before && survivors.length > 0) {
                return {
                  type: 'bin-packing-force', cost: 4, pairIdx: c.pairIdx,
                  premises: [`${isRow ? 'row' : 'col'}-${idx}-H1-bin-packing-min-forced`],
                  conclusion: { kind: 'domain-pruned', from: before, to: survivors.length },
                  domainBefore: before, domainAfter: survivors.length,
                  branchingFactor: 2,
                  apply(s) { s.domains[c.pairIdx].positions = survivors; }
                };
              }
              // Position-level filter did not change domain; try gender-mode restriction.
              // For each 'both' candidate, check if g1g2 vs g2g1 satisfies "male > c.min"
              const newPositions = dom.positions.map(p => {
                if (p.gender !== 'both') return p;
                const c1OnLine = isRow ? p.c1.row === idx : p.c1.col === idx;
                const c2OnLine = isRow ? p.c2.row === idx : p.c2.col === idx;
                const m_g1g2 = (c1OnLine ? 1 : 0); // g1g2: c1 male
                const m_g2g1 = (c2OnLine ? 1 : 0); // g2g1: c2 male
                // Need male > c.min, so m must be > c.min for the mode to survive
                const g1g2OK = m_g1g2 > c.min;
                const g2g1OK = m_g2g1 > c.min;
                if (g1g2OK && g2g1OK) return p;
                if (!g1g2OK && !g2g1OK) return null; // candidate must be removed
                if (g1g2OK) return { ...p, gender: 'g1g2' };
                return { ...p, gender: 'g2g1' };
              }).filter(p => p !== null);
              if (newPositions.length < before ||
                  newPositions.some((p, i) => p.gender !== dom.positions[i].gender)) {
                if (newPositions.length > 0) {
                  return {
                    type: 'bin-packing-force', cost: 4, pairIdx: c.pairIdx,
                    premises: [`${isRow ? 'row' : 'col'}-${idx}-H1-gender-mode-restricted-min`],
                    conclusion: { kind: 'gender-restricted', from: before, to: newPositions.length },
                    domainBefore: before, domainAfter: newPositions.length,
                    branchingFactor: 2,
                    apply(s) { s.domains[c.pairIdx].positions = newPositions; }
                  };
                }
              }
            }
            if (maxForced) {
              // P must contribute LESS male than its max
              // → keep positions whose MIN achievable male contribution < c.max
              const before = dom.positions.length;
              const survivors = dom.positions.filter((_, i) => c.posRanges[i].min < c.max);
              if (survivors.length < before && survivors.length > 0) {
                return {
                  type: 'bin-packing-force', cost: 4, pairIdx: c.pairIdx,
                  premises: [`${isRow ? 'row' : 'col'}-${idx}-H1-bin-packing-max-forced`],
                  conclusion: { kind: 'domain-pruned', from: before, to: survivors.length },
                  domainBefore: before, domainAfter: survivors.length,
                  branchingFactor: 2,
                  apply(s) { s.domains[c.pairIdx].positions = survivors; }
                };
              }
              // Position-level filter did not change; try gender-mode restriction.
              // Need male < c.max, so m must be < c.max for the mode to survive
              const newPositions = dom.positions.map(p => {
                if (p.gender !== 'both') return p;
                const c1OnLine = isRow ? p.c1.row === idx : p.c1.col === idx;
                const c2OnLine = isRow ? p.c2.row === idx : p.c2.col === idx;
                const m_g1g2 = (c1OnLine ? 1 : 0);
                const m_g2g1 = (c2OnLine ? 1 : 0);
                const g1g2OK = m_g1g2 < c.max;
                const g2g1OK = m_g2g1 < c.max;
                if (g1g2OK && g2g1OK) return p;
                if (!g1g2OK && !g2g1OK) return null;
                if (g1g2OK) return { ...p, gender: 'g1g2' };
                return { ...p, gender: 'g2g1' };
              }).filter(p => p !== null);
              if (newPositions.length < before ||
                  newPositions.some((p, i) => i < newPositions.length && p.gender !== dom.positions[i].gender)) {
                if (newPositions.length > 0) {
                  // Check that something actually changed
