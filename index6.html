// ═══════════════════════════════════════════════════════════════════════
// ║ V9 SOTA — Play Log Modal                                            ║
// ║ 실제 플레이어가 시간 경과에 따라 후보 결정/타일 배치/배제/최종 배치│
// ║ 모든 과정을 timestamp와 함께 표시. Win modal에서 호출.               ║
// ═══════════════════════════════════════════════════════════════════════
function PlayLogModal({ playLog, solveTimeMs, onClose }) {
  const t = useT();
  const [filter, setFilter] = React.useState('all');
  const [copied, setCopied] = React.useState(false);

  // Filter categories — 카테고리별 보기
  const categoryOf = (action) => {
    if (action === 'place' || action === 'remove' || action === 'move') return 'placement';
    if (action === 'gender-mark' || action === 'gender-clear' || action === 'gender-swap') return 'gender';
    if (action === 'forbid' || action === 'unforbid') return 'forbid';
    if (action === 'candidate-mark' || action === 'candidate-clear' || action === 'candidate-enqueue' || action === 'candidate-dequeue' || action === 'cell-mark-change') return 'candidate';
    if (action === 'reset' || action === 'hint-use' || action === 'solution-revealed' || action === 'puzzle-start' || action === 'puzzle-solved' || action === 'timer-pause' || action === 'timer-resume') return 'system';
    return 'other';
  };

  const filtered = filter === 'all' ? playLog : playLog.filter(e => categoryOf(e.action) === filter);

  // Format ms → MM:SS.mmm
  const formatT = (ms) => {
    const totalSec = ms / 1000;
    const m = Math.floor(totalSec / 60);
    const s = totalSec - m * 60;
    return m + ':' + (s < 10 ? '0' : '') + s.toFixed(1);
  };

  // Format entry into human-readable line
  const formatEntry = (e) => {
    const tStr = formatT(e.t).padStart(7);
    const d = e.detail || {};
    const cellTag = (r, c) => `(r${r},c${c})`;
    switch (e.action) {
      case 'puzzle-start':
        return `${tStr} | 🟢 ${t('playlog.start')} (${d.level}, ${d.n}×${d.n}, pairs ${d.pairs})`;
      case 'place':
        return `${tStr} | ▶ ${t('playlog.place')}: ${d.speciesEmoji}${d.speciesName} → ${cellTag(d.row, d.col)}`;
      case 'remove':
        return `${tStr} | ◀ ${t('playlog.remove')}: ${d.speciesEmoji}${d.speciesName} ← ${cellTag(d.fromRow, d.fromCol)}`;
      case 'move':
        return `${tStr} | ↔ ${t('playlog.move')}: ${d.speciesEmoji}${d.speciesName} ${cellTag(d.fromRow, d.fromCol)} → ${cellTag(d.toRow, d.toCol)}`;
      case 'gender-mark':
        return `${tStr} | ♂♀ ${t('playlog.genderMark')}: ${d.speciesEmoji}${d.speciesName} = ${d.gender === 'male' ? '♂' : '♀'}`;
      case 'gender-clear':
        return `${tStr} | ✕ ${t('playlog.genderClear')}: ${d.speciesEmoji}${d.speciesName}`;
      case 'gender-swap':
        return `${tStr} | ⇄ ${t('playlog.genderSwap')}: ${d.speciesEmoji}${d.speciesName} ${d.fromGender === 'male' ? '♂' : '♀'} → ${d.toGender === 'male' ? '♂' : '♀'}`;
      case 'forbid':
        return `${tStr} | ✕ ${t('playlog.forbid')} ${cellTag(d.row, d.col)}`;
      case 'unforbid':
        return `${tStr} | ✓ ${t('playlog.unforbid')} ${cellTag(d.row, d.col)}`;
      case 'candidate-mark':
        return `${tStr} | ? ${t('playlog.candidateMark')} ${cellTag(d.row, d.col)}`;
      case 'candidate-clear':
        return `${tStr} | ✕ ${t('playlog.candidateClear')} ${cellTag(d.row, d.col)}`;
      case 'candidate-enqueue':
        return `${tStr} | + ${t('playlog.candidateEnqueue')}: ${d.speciesEmoji}${d.speciesName} @ ${cellTag(d.row, d.col)}`;
      case 'candidate-dequeue':
        return `${tStr} | − ${t('playlog.candidateDequeue')}: ${d.speciesEmoji}${d.speciesName} @ ${cellTag(d.row, d.col)}`;
      case 'cell-mark-change':
        return `${tStr} | ⟳ ${t('playlog.cellMarkChange')} ${cellTag(d.row, d.col)} ${d.from}→${d.to}`;
      case 'reset':
        return `${tStr} | ⟲ ${t('playlog.reset')}`;
      case 'hint-use':
        return `${tStr} | 💡 ${t('playlog.hintUse')} (${t('playlog.hintRemaining')}: ${d.remaining})`;
      case 'solution-revealed':
        return `${tStr} | 🔓 ${t('playlog.solutionRevealed')}`;
      case 'timer-pause':
        return `${tStr} | ⏸ ${t('playlog.timerPause')}`;
      case 'timer-resume':
        return `${tStr} | ▶ ${t('playlog.timerResume')}`;
      case 'puzzle-solved':
        return `${tStr} | 🏆 ${t('playlog.solved')} (${formatTimerMs(d.finalElapsedMs || 0)})`;
      default:
        return `${tStr} | ${e.action}: ${JSON.stringify(d)}`;
    }
  };

  const buildPlainLog = () => {
    const lines = [];
    lines.push(`=== ${t('playlog.title')} ===`);
    if (typeof solveTimeMs === 'number') {
      lines.push(`${t('playlog.totalTime')}: ${formatTimerMs(solveTimeMs)}`);
    }
    lines.push(`${t('playlog.totalActions')}: ${playLog.length}`);
    // Action category statistics
    const stats = {};
    for (const e of playLog) {
      const cat = categoryOf(e.action);
      stats[cat] = (stats[cat] || 0) + 1;
    }
    const statsLine = Object.entries(stats).map(([k, v]) => `${k}=${v}`).join(', ');
    lines.push(`${t('playlog.byCategory')}: ${statsLine}`);
    lines.push('');
    for (const e of playLog) {
      lines.push(formatEntry(e));
    }
    return lines.join('\n');
  };

  const handleCopy = () => {
    const text = buildPlainLog();
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(() => {
        setCopied(true);
        setTimeout(() => setCopied(false), 1500);
      });
    }
  };

  // Action category counts for filter bar
  const counts = { all: playLog.length };
  for (const e of playLog) {
    const cat = categoryOf(e.action);
    counts[cat] = (counts[cat] || 0) + 1;
  }

  const filterCategories = [
    { id: 'all',       label: t('playlog.filter.all') },
    { id: 'placement', label: t('playlog.filter.placement') },
    { id: 'gender',    label: t('playlog.filter.gender') },
    { id: 'forbid',    label: t('playlog.filter.forbid') },
    { id: 'candidate', label: t('playlog.filter.candidate') },
    { id: 'system',    label: t('playlog.filter.system') },
  ];

  return (
    <div onClick={onClose} style={{
      position: 'fixed', inset: 0, background: 'rgba(28,25,23,0.65)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      zIndex: 80, padding: 16,
    }}>
      <div onClick={e => e.stopPropagation()} style={{
        maxWidth: 720, width: '100%', maxHeight: '85vh',
        background: 'var(--bg-paper)', border: '1px solid var(--border-medium)',
        borderRadius: 4, display: 'flex', flexDirection: 'column',
        boxShadow: '0 24px 60px -20px rgba(0,0,0,0.4)',
      }}>
        {/* Header */}
        <div style={{
          padding: '18px 22px', borderBottom: '1px solid var(--border-soft)',
          display: 'flex', alignItems: 'center', justifyContent: 'space-between',
          flexWrap: 'wrap', gap: 10,
        }}>
          <div>
            <div className="font-display" style={{
              fontSize: 18, fontWeight: 500, color: 'var(--ink-primary)',
            }}>{t('playlog.title')}</div>
            <div className="font-body" style={{
              marginTop: 4, fontSize: 11, color: 'var(--ink-tertiary)',
              letterSpacing: '0.04em',
            }}>
              {t('playlog.totalActions')}: {playLog.length}
              {typeof solveTimeMs === 'number' && solveTimeMs > 0 && (
                <span> · {t('playlog.totalTime')}: <span className="font-mono" style={{ color: 'var(--accent-gold)' }}>{formatTimerMs(solveTimeMs)}</span></span>
              )}
            </div>
          </div>
          <div style={{ display: 'flex', gap: 8 }}>
            <button onClick={handleCopy} className="font-body" style={{
              padding: '6px 14px',
              background: copied ? 'var(--accent-gold)' : 'var(--bg-card)',
              color: copied ? 'var(--bg-paper)' : 'var(--ink-primary)',
              border: '1px solid var(--border-medium)',
              borderRadius: 2, cursor: 'pointer', fontSize: 12,
              transition: 'background 200ms, color 200ms',
            }}>
              {copied ? t('playlog.copied') : t('playlog.copy')}
            </button>
            <button onClick={onClose} className="font-body" style={{
              padding: '6px 14px', background: 'transparent', color: 'var(--ink-secondary)',
              border: '1px solid var(--border-medium)',
              borderRadius: 2, cursor: 'pointer', fontSize: 12,
            }}>{t('playlog.close')}</button>
          </div>
        </div>
        {/* Filter bar */}
        <div style={{
          padding: '10px 22px', borderBottom: '1px solid var(--border-soft)',
          display: 'flex', gap: 6, flexWrap: 'wrap',
          background: 'var(--bg-card)',
        }}>
          {filterCategories.map(cat => {
            const count = counts[cat.id] || 0;
            const active = filter === cat.id;
            const disabled = count === 0;
            return (
              <button
                key={cat.id}
                onClick={() => !disabled && setFilter(cat.id)}
                className="font-body"
                disabled={disabled}
                style={{
                  padding: '5px 11px',
                  background: active ? 'var(--ink-primary)' : 'transparent',
                  color: active ? 'var(--bg-paper)' : (disabled ? 'var(--ink-tertiary)' : 'var(--ink-secondary)'),
                  border: '1px solid ' + (active ? 'var(--ink-primary)' : 'var(--border-soft)'),
                  borderRadius: 2,
                  cursor: disabled ? 'default' : 'pointer',
                  fontSize: 11,
                  opacity: disabled ? 0.4 : 1,
                  transition: 'all 150ms',
                }}>
                {cat.label} <span style={{ opacity: 0.7, marginLeft: 4 }}>({count})</span>
              </button>
            );
          })}
        </div>
        {/* Log timeline */}
        <div style={{
          flex: 1, overflowY: 'auto', padding: '12px 22px',
          fontFamily: 'monospace', fontSize: 12, lineHeight: 1.7,
          color: 'var(--ink-primary)',
          background: 'var(--bg-paper)',
        }}>
          {filtered.length === 0 ? (
            <div className="font-body" style={{
              padding: 30, textAlign: 'center', color: 'var(--ink-tertiary)',
              fontStyle: 'italic',
            }}>{t('playlog.noEntries')}</div>
          ) : (
            filtered.map((e, i) => {
              const cat = categoryOf(e.action);
              const colorMap = {
                placement: 'var(--accent-gold)',
                gender: '#f97316',
                forbid: '#dc2626',
                candidate: '#3498db',
                system: 'var(--ink-tertiary)',
              };
              const color = colorMap[cat] || 'var(--ink-primary)';
              return (
                <div key={i} style={{ color, whiteSpace: 'pre' }}>
                  {formatEntry(e)}
                </div>
              );
            })
          )}
        </div>
      </div>
    </div>
  );
}

// =============================================================================
// SECTION 7 — APP STATE (Reducer)
// =============================================================================

// Wraps the core reducer with cross-cutting "auto-clear hint spotlight"
// post-processing. Whenever a user action touches a spotlighted token
// (toggle gender, place to a different cell, return to hand), THAT token
// is removed from the spotlight set — others remain highlighted until
// the user touches them too. Centralising this here keeps every
// individual case clean and ensures we never miss a path.
function reducerWithHintClear(state, action) {
  const next = reducerCore(state, action);
  if (next === state) return next; // no state change → nothing to clear
  // ═══ V9 SOTA — Play Log diff recording ════════════════════════════
  // Compare state ↔ next to detect player actions. Append to playLog
  // with timer-aligned timestamp (pauses do not advance the log clock).
  // Skip generation/system actions; PUZZLE_READY case records its own
  // start entry.
  let nextWithLog = next;
  if (state.puzzle && next.puzzle && state.puzzle === next.puzzle && next.playLogStartTime) {
    const entries = recordPlayLogDiff(state, next, action);
    if (entries.length > 0) {
      // Timer-aligned t: accumulated + active-run offset (excludes pauses)
      const activeRun = next.timerStartTime ? (Date.now() - next.timerStartTime) : 0;
      const t = (next.timerAccumulatedMs || 0) + activeRun;
      const stamped = entries.map(e => ({ t, ...e }));
      nextWithLog = { ...next, playLog: [...(next.playLog || []), ...stamped] };
    }
  }
  if (!nextWithLog.hintTokenIds || nextWithLog.hintTokenIds.length === 0) return nextWithLog;
  // For each spotlighted token, check whether THIS action touched it
  // (placement or gender mark changed). Surviving tokens stay spotlighted.
  const survivors = nextWithLog.hintTokenIds.filter(tid => {
    const beforeP = state.placements[tid];
    const afterP = nextWithLog.placements[tid];
    const beforeG = state.marks[tid];
    const afterG = nextWithLog.marks[tid];
    const placementChanged =
      (!beforeP && afterP) || (beforeP && !afterP) ||
      (beforeP && afterP && (beforeP.row !== afterP.row || beforeP.col !== afterP.col));
    const genderChanged = beforeG !== afterG;
    return !(placementChanged || genderChanged);
  });
  if (survivors.length !== nextWithLog.hintTokenIds.length) {
    return { ...nextWithLog, hintTokenIds: survivors };
  }
  return nextWithLog;
}

// Detect player actions by diffing state ↔ next. Returns a list of log
// entries (without timestamp — caller adds 't').
function recordPlayLogDiff(state, next, action) {
  const entries = [];

  // 1. Token placement changes (PLACE_TOKEN, RETURN_TO_HAND, RESET, SHOW_SOLUTION)
  const tokens = state.puzzle.tokens || [];
  for (const tk of tokens) {
    const before = state.placements[tk.id];
    const after = next.placements[tk.id];
    const beforeKey = before ? `${before.row},${before.col}` : null;
    const afterKey = after ? `${after.row},${after.col}` : null;
    if (beforeKey !== afterKey) {
      const animal = (typeof animalById !== 'undefined') ? animalById(tk.animalId) : null;
      const speciesName = animal ? animal.name : ('species#' + tk.animalId);
      const speciesEmoji = animal ? animal.emoji : '';
      if (after && !before) {
        entries.push({ action: 'place', detail: { tokenId: tk.id, speciesName, speciesEmoji, row: after.row, col: after.col } });
      } else if (!after && before) {
        entries.push({ action: 'remove', detail: { tokenId: tk.id, speciesName, speciesEmoji, fromRow: before.row, fromCol: before.col } });
      } else if (after && before) {
        entries.push({ action: 'move', detail: { tokenId: tk.id, speciesName, speciesEmoji, fromRow: before.row, fromCol: before.col, toRow: after.row, toCol: after.col } });
      }
    }
  }

  // 2. Gender mark changes (TOGGLE_MARK)
  for (const tk of tokens) {
    const before = state.marks[tk.id];
    const after = next.marks[tk.id];
    if (before !== after) {
      const animal = (typeof animalById !== 'undefined') ? animalById(tk.animalId) : null;
      const speciesName = animal ? animal.name : ('species#' + tk.animalId);
      const speciesEmoji = animal ? animal.emoji : '';
      if (!before && after) {
        entries.push({ action: 'gender-mark', detail: { tokenId: tk.id, speciesName, speciesEmoji, gender: after } });
      } else if (before && !after) {
        entries.push({ action: 'gender-clear', detail: { tokenId: tk.id, speciesName, speciesEmoji, prevGender: before } });
      } else {
        entries.push({ action: 'gender-swap', detail: { tokenId: tk.id, speciesName, speciesEmoji, fromGender: before, toGender: after } });
      }
    }
  }

  // 3. Cell mark changes (CYCLE_CELL_MARK — X for forbidden, Q for candidate)
  const beforeCellMarks = state.cellMarks || {};
  const afterCellMarks = next.cellMarks || {};
  const allKeys = new Set([...Object.keys(beforeCellMarks), ...Object.keys(afterCellMarks)]);
  for (const k of allKeys) {
    const before = beforeCellMarks[k];
    const after = afterCellMarks[k];
    if (before === after) continue;
    const [row, col] = k.split(',').map(Number);
    if (!before && after === 'X') {
      entries.push({ action: 'forbid', detail: { row, col } });
    } else if (before === 'X' && !after) {
      entries.push({ action: 'unforbid', detail: { row, col } });
    } else if (!before && after === 'Q') {
      entries.push({ action: 'candidate-mark', detail: { row, col } });
    } else if (before === 'Q' && !after) {
      entries.push({ action: 'candidate-clear', detail: { row, col } });
    } else if (before && after) {
      entries.push({ action: 'cell-mark-change', detail: { row, col, from: before, to: after } });
    }
  }

  // 4. Q candidate (animal IDs) changes
  const beforeQ = state.qCandidates || {};
  const afterQ = next.qCandidates || {};
  const qKeys = new Set([...Object.keys(beforeQ), ...Object.keys(afterQ)]);
  for (const k of qKeys) {
    const beforeArr = beforeQ[k] || [];
    const afterArr = afterQ[k] || [];
    if (JSON.stringify(beforeArr) === JSON.stringify(afterArr)) continue;
    const [row, col] = k.split(',').map(Number);
    // Detect added animal IDs (most common pattern: ENQUEUE_Q_CANDIDATE adds one)
    const added = afterArr.filter(id => !beforeArr.includes(id));
    const removed = beforeArr.filter(id => !afterArr.includes(id));
    for (const id of added) {
      const animal = (typeof animalById !== 'undefined') ? animalById(id) : null;
      entries.push({ action: 'candidate-enqueue', detail: { row, col, animalId: id, speciesName: animal ? animal.name : '', speciesEmoji: animal ? animal.emoji : '' } });
    }
    for (const id of removed) {
      const animal = (typeof animalById !== 'undefined') ? animalById(id) : null;
      entries.push({ action: 'candidate-dequeue', detail: { row, col, animalId: id, speciesName: animal ? animal.name : '', speciesEmoji: animal ? animal.emoji : '' } });
    }
  }

  // 5. Action-specific events
  if (action.type === 'RESET') {
    entries.push({ action: 'reset', detail: {} });
  } else if (action.type === 'HINT_USE') {
    entries.push({ action: 'hint-use', detail: { remaining: next.hintsRemaining } });
  } else if (action.type === 'SHOW_SOLUTION') {
    entries.push({ action: 'solution-revealed', detail: {} });
  } else if (action.type === 'TIMER_PAUSE') {
    entries.push({ action: 'timer-pause', detail: {} });
  } else if (action.type === 'TIMER_RESUME') {
    entries.push({ action: 'timer-resume', detail: {} });
  } else if (action.type === 'SOLVED' || action.type === 'TIMER_FREEZE') {
    if (next.timerFinalElapsedMs !== null && state.timerFinalElapsedMs === null) {
      entries.push({ action: 'puzzle-solved', detail: { finalElapsedMs: next.timerFinalElapsedMs } });
    }
  }

  return entries;
}

function reducerCore(state, action) {
  switch (action.type) {
    case 'PUZZLE_READY': {
      const placements = {};
      const preMarks = action.puzzle.preMarks || {};
      for (const t of action.puzzle.tokens) {
        if (preMarks[t.id]) placements[t.id] = { row: t.row, col: t.col };
      }
      return {
        ...state, puzzle: action.puzzle, placements, marks: { ...preMarks },
        cellMarks: {}, qCandidates: {},
        isGenerating: false, isSolved: false,
        recentTokenId: null, partnerTokenId: null, showWin: false,
        level: action.level ?? state.level,
        generationProgress: null,
        dragState: { tokenId: null, over: null, overHand: false },
        // Timer: start fresh on each new puzzle. timerStartTime is the
        // reference point for elapsed computation; null means "not running".
        // accumulatedMs is the elapsed time captured at the moment of
        // pause (so pause/resume cycles preserve total play time).
        timerStartTime: Date.now(),
        timerAccumulatedMs: 0,
        timerPaused: false,
        timerFinalElapsedMs: null, // set at win for final display
        // Hints reset to full per puzzle.
        hintsRemaining: 2,
        hintTokenIds: [],
        hintExhaustedShown: false,
        hintAllCorrectShown: false,
        // V9 SOTA — Player action timeline log. Reset on each new puzzle.
        // Each entry: { t: ms_since_start, action: 'place'|'remove'|'mark'|'unmark'|'forbid'|'unforbid'|'candidate-add'|'candidate-clear'|'gender-swap'|'reset'|'hint-use'|'solution-shown', detail: {...} }
        playLog: [{ t: 0, action: 'puzzle-start', detail: { level: action.level ?? state.level, n: action.puzzle.n, pairs: action.puzzle.pairs.length } }],
        playLogStartTime: Date.now(),
        // V12.15: Duel data — set if action carries it (shared puzzle), else clear
        duelEntries: action.duelEntries || null,
      };
    }
    case 'TIMER_PAUSE': {
      if (state.timerPaused || state.timerFinalElapsedMs !== null) return state;
      // Capture elapsed up to now
      const now = Date.now();
      const elapsedThisRun = state.timerStartTime ? now - state.timerStartTime : 0;
      return {
        ...state,
        timerPaused: true,
        timerAccumulatedMs: state.timerAccumulatedMs + elapsedThisRun,
        timerStartTime: null,
      };
    }
    case 'TIMER_RESUME': {
      if (!state.timerPaused || state.timerFinalElapsedMs !== null) return state;
      return {
        ...state,
        timerPaused: false,
        timerStartTime: Date.now(),
      };
    }
    case 'TIMER_FREEZE': {
      // Called when puzzle is solved — capture final elapsed time
      // and stop the timer permanently for this puzzle.
      const now = Date.now();
      const elapsedThisRun = state.timerStartTime ? now - state.timerStartTime : 0;
      const finalMs = state.timerAccumulatedMs + elapsedThisRun;
      return {
        ...state,
        timerFinalElapsedMs: finalMs,
        timerPaused: true,
        timerStartTime: null,
        timerAccumulatedMs: finalMs,
      };
    }
    case 'HINT_USE': {
      // Show ALL wrongly-placed tokens (not just the first one).
      // Charge a hint UNCONDITIONALLY if hints remain — even if nothing is
      // currently wrong, the user spent their attempt to verify.
      // Depleted hints: only signal the exhausted popover (no charge).
      if (state.hintsRemaining <= 0) {
        return { ...state, hintExhaustedShown: true };
      }
      if (!state.puzzle) return state;
      // Build the full wrong-token list:
      //   - placed at a cell that doesn't match its solution position, OR
      //   - placed correctly but with wrong gender mark
      const wrongTokens = [];
      for (const tok of state.puzzle.tokens) {
        const placed = state.placements[tok.id];
        if (!placed) continue; // not placed yet — not "wrong", just incomplete
        const positionWrong = placed.row !== tok.row || placed.col !== tok.col;
        const correctGender = state.puzzle.solution[tok.id];
        const userGender = state.marks[tok.id];
        const genderWrong = userGender && correctGender && userGender !== correctGender;
        if (positionWrong || genderWrong) wrongTokens.push(tok.id);
      }
      // Always charge a hint when the user invokes it with hints remaining.
      // If nothing is wrong, also surface the "all correct" popover so the
      // user understands why no spotlight appeared.
      const next = {
        ...state,
        hintsRemaining: state.hintsRemaining - 1,
        hintTokenIds: wrongTokens, // empty array = nothing to highlight
        hintExhaustedShown: false,
      };
      if (wrongTokens.length === 0) {
        next.hintAllCorrectShown = true;
      }
      return next;
    }
    case 'HINT_CLEAR': {
      // Manual clear (e.g., explicit dismissal). The reducer wrapper also
      // auto-clears individual tokens when the user touches them.
      if (!state.hintTokenIds || state.hintTokenIds.length === 0) return state;
      return { ...state, hintTokenIds: [] };
    }
    case 'HINT_DISMISS_POPOVER': {
      return { ...state, hintExhaustedShown: false, hintAllCorrectShown: false };
    }
    case 'START_GENERATING':
      return { ...state, isGenerating: true, level: action.level ?? state.level, generationProgress: null };
    case 'GENERATION_PROGRESS':
      return { ...state, generationProgress: action.progress };
    case 'CYCLE_CELL_MARK': {
      // 3-state cycle: empty → X → Q → empty
      const key = `${action.row},${action.col}`;
      const cur = state.cellMarks[key]; // undefined | 'X' | 'Q'
      const next = cur === undefined ? 'X' : cur === 'X' ? 'Q' : undefined;
      const newMarks = { ...state.cellMarks };
      if (next === undefined) delete newMarks[key];
      else newMarks[key] = next;
      // Reset Q candidates when entering Q state or leaving Q state
      const newQCandidates = { ...state.qCandidates };
      if (cur === 'Q' || next === 'Q') delete newQCandidates[key];
      return { ...state, cellMarks: newMarks, qCandidates: newQCandidates };
    }
    case 'ENQUEUE_Q_CANDIDATE': {
      // Add a {animalId, gender} pair to Q-mark cell's FIFO candidate list.
      // Male and female of same species are tracked as independent entries
      // (24 distinct candidates: 12 species × 2 genders).
      const key = `${action.row},${action.col}`;
      if (state.cellMarks[key] !== 'Q') return state;
      const cur = state.qCandidates[key] || [];
      const gender = action.gender || 'male';
      // Dedup on (animalId, gender) pair
      if (cur.some(c => c.animalId === action.animalId && c.gender === gender)) return state;
      const QCAP = state.qMarkCapacity || 4;
      const next = [...cur, { animalId: action.animalId, gender }];
      // FIFO: if exceeds cap, drop oldest
      while (next.length > QCAP) next.shift();
      return { ...state, qCandidates: { ...state.qCandidates, [key]: next } };
    }
    case 'TOGGLE_MARK': {
      if (state.isSolved) return state;
      if (!state.placements[action.tokenId]) return state;
      if (state.puzzle.preMarks && state.puzzle.preMarks[action.tokenId]) return state;
      // If partner is a fixed tile with a forced gender, this token's gender is also locked
      const partnerId = getPartnerToken(action.tokenId, state.puzzle.pairs);
      const partnerIsFixed = partnerId && state.puzzle.preMarks && state.puzzle.preMarks[partnerId];
      if (partnerIsFixed) return state; // cannot toggle — gender is determined by fixed partner
      const cur = state.marks[action.tokenId] || null;
      const next = cur === null ? 'male' : cur === 'male' ? 'female' : null;
      const newMarks = { ...state.marks };
      // Update partner gender in sync regardless of whether partner is on board or in hand.
      // This ensures the hand-pool visual gender instantly mirrors the grid tile's toggle.
      const partnerEditable = partnerId && !partnerIsFixed;
      if (next === null) {
        delete newMarks[action.tokenId];
        if (partnerEditable) delete newMarks[partnerId];
      } else {
        newMarks[action.tokenId] = next;
        if (partnerEditable) {
          newMarks[partnerId] = next === 'male' ? 'female' : 'male';
        }
      }
      return {
        ...state, marks: newMarks, recentTokenId: action.tokenId,
        partnerTokenId: (partnerId && state.placements[partnerId]) ? partnerId : null,
      };
    }
    case 'DRAG_START': {
      const newState = { ...state, dragState: { ...state.dragState, tokenId: action.tokenId } };
      // If the drag originated from hand with an explicit gender hint, confirm it on the token
      // AND on the partner (as opposite gender). Do not overwrite existing marks.
      if (action.assignGender && !state.marks[action.tokenId]) {
        const newMarks = { ...state.marks };
        newMarks[action.tokenId] = action.assignGender;
        // Auto-assign opposite gender to partner if partner is placed and has no mark yet
        const partnerId = getPartnerToken(action.tokenId, state.puzzle.pairs);
        const partnerIsFixed = partnerId && state.puzzle.preMarks && state.puzzle.preMarks[partnerId];
        if (partnerId && state.placements[partnerId] && !newMarks[partnerId] && !partnerIsFixed) {
          newMarks[partnerId] = action.assignGender === 'male' ? 'female' : 'male';
        }
        newState.marks = newMarks;
      }
      return newState;
    }
    case 'DRAG_OVER_CELL':
      return { ...state, dragState: { ...state.dragState, over: `${action.row},${action.col}` } };
    case 'DRAG_LEAVE_CELL':
      if (state.dragState.over === `${action.row},${action.col}`) {
        return { ...state, dragState: { ...state.dragState, over: null } };
      }
      return state;
    case 'DRAG_OVER_HAND':
      return { ...state, dragState: { ...state.dragState, overHand: true } };
    case 'DRAG_LEAVE_HAND':
      return { ...state, dragState: { ...state.dragState, overHand: false } };
    case 'DRAG_END':
      return { ...state, dragState: { tokenId: null, over: null, overHand: false } };
    case 'PLACE_TOKEN': {
      const { tokenId, row, col } = action;
      if (!tokenId) return { ...state, dragState: { tokenId: null, over: null, overHand: false } };
      const forbidden = new Set(state.puzzle.forbiddenCells.map(([r, c]) => `${r},${c}`));
      if (forbidden.has(`${row},${col}`)) return { ...state, dragState: { tokenId: null, over: null, overHand: false } };
      // Block drop on X-marked cells
      const destKey = `${row},${col}`;
      if (state.cellMarks[destKey] === 'X') {
        return { ...state, dragState: { tokenId: null, over: null, overHand: false } };
      }
      const occupant = Object.entries(state.placements).find(([, p]) => p && p.row === row && p.col === col);
      if (occupant && state.puzzle.preMarks && state.puzzle.preMarks[occupant[0]]) {
        return { ...state, dragState: { tokenId: null, over: null, overHand: false } };
      }
      const newPlacements = { ...state.placements };
      let displaced = null;
      for (const [tid, cell] of Object.entries(newPlacements)) {
        if (cell && cell.row === row && cell.col === col) { displaced = tid; break; }
      }
      const prev = newPlacements[tokenId];
      newPlacements[tokenId] = { row, col };
      if (displaced) {
        if (prev) newPlacements[displaced] = prev;
        else delete newPlacements[displaced];
      }
      // If partner is a fixed tile, auto-assign opposite gender to this token
      const newMarks = { ...state.marks };
      const partnerId = getPartnerToken(tokenId, state.puzzle.pairs);
      const partnerFixedGender = partnerId && state.puzzle.preMarks && state.puzzle.preMarks[partnerId];
      if (partnerFixedGender && !newMarks[tokenId]) {
        newMarks[tokenId] = partnerFixedGender === 'male' ? 'female' : 'male';
      }

      // Q-mark candidate tracking:
      //  - If destination is Q-marked, enqueue this token's {animalId, gender}
      //  - If displaced to source (swap), enqueue the displaced token's {animalId, gender} at source if source is Q-marked
      //  - Male and female of same species are tracked as independent entries
      //  - Tokens without a confirmed gender ("?" state) are NOT registered
      const newQCandidates = { ...state.qCandidates };
      const QCAP = state.qMarkCapacity || 4;
      const droppedAnimal = state.puzzle.tokens.find(t => t.id === tokenId);
      const droppedGender = newMarks[tokenId]; // only register if gender is confirmed
      if (state.cellMarks[destKey] === 'Q' && droppedAnimal && droppedGender) {
        const curList = newQCandidates[destKey] || [];
        const alreadyExists = curList.some(c => c.animalId === droppedAnimal.animalId && c.gender === droppedGender);
        if (!alreadyExists) {
          const nextList = [...curList, { animalId: droppedAnimal.animalId, gender: droppedGender }];
          while (nextList.length > QCAP) nextList.shift();
          newQCandidates[destKey] = nextList;
        }
      }
      // Swap case: if displaced tile was moved to `prev` cell, and that cell is Q-marked,
      // register displaced animal (with its gender) there — only if gender confirmed
      if (displaced && prev) {
        const prevKey = `${prev.row},${prev.col}`;
        if (state.cellMarks[prevKey] === 'Q') {
          const dispAnimal = state.puzzle.tokens.find(t => t.id === displaced);
          const dispGender = state.marks[displaced]; // only register if confirmed
          if (dispAnimal && dispGender) {
            const curList = newQCandidates[prevKey] || [];
            const alreadyExists = curList.some(c => c.animalId === dispAnimal.animalId && c.gender === dispGender);
            if (!alreadyExists) {
              const nextList = [...curList, { animalId: dispAnimal.animalId, gender: dispGender }];
              while (nextList.length > QCAP) nextList.shift();
              newQCandidates[prevKey] = nextList;
            }
          }
        }
      }

      return {
        ...state, placements: newPlacements, marks: newMarks,
        qCandidates: newQCandidates,
        dragState: { tokenId: null, over: null, overHand: false },
        recentTokenId: tokenId,
      };
    }
    case 'RETURN_TO_HAND': {
      const { tokenId } = action;
      if (!tokenId) return { ...state, dragState: { tokenId: null, over: null, overHand: false } };
      if (state.puzzle.preMarks && state.puzzle.preMarks[tokenId]) {
        return { ...state, dragState: { tokenId: null, over: null, overHand: false } };
      }
      const newPlacements = { ...state.placements };
      const newMarks = { ...state.marks };
      delete newPlacements[tokenId];
      delete newMarks[tokenId];
      return {
        ...state, placements: newPlacements, marks: newMarks,
        dragState: { tokenId: null, over: null, overHand: false },
      };
    }
    case 'RESET': {
      const placements = {};
      const preMarks = state.puzzle.preMarks || {};
      for (const t of state.puzzle.tokens) {
        if (preMarks[t.id]) placements[t.id] = { row: t.row, col: t.col };
      }
      return {
        ...state, placements, marks: { ...preMarks },
        cellMarks: {}, qCandidates: {},
        recentTokenId: null, partnerTokenId: null, isSolved: false, showWin: false,
        dragState: { tokenId: null, over: null, overHand: false },
      };
    }
    case 'SHOW_SOLUTION': {
      const placements = {};
      for (const t of state.puzzle.tokens) placements[t.id] = { row: t.row, col: t.col };
      return { ...state, placements, marks: { ...state.puzzle.solution } };
    }
    case 'SOLVED': {
      // Freeze the timer at the moment of solve (preserves the final
      // elapsed time for the win dialog and for the meta chip's display).
      const now = Date.now();
      const elapsedThisRun = state.timerStartTime ? now - state.timerStartTime : 0;
      const finalMs = state.timerAccumulatedMs + elapsedThisRun;
      return {
        ...state,
        isSolved: true,
        timerFinalElapsedMs: finalMs,
        timerPaused: true,
        timerStartTime: null,
        timerAccumulatedMs: finalMs,
      };
    }
    case 'SHOW_WIN': return { ...state, showWin: true };
    case 'CLOSE_WIN': return { ...state, showWin: false };
    case 'SHOW_RULES': return { ...state, showRules: true };
    case 'CLOSE_RULES': return { ...state, showRules: false };
    case 'TOGGLE_LEGEND': return { ...state, legendCollapsed: !state.legendCollapsed };
    case 'CLEAR_PULSE': return { ...state, partnerTokenId: null, recentTokenId: null };
    case 'CHANGE_ENGINE': {
      // Persist user choice; only takes effect on next generation
      try { localStorage.setItem('zoograms.engine', action.engine); } catch (e) {}
      return { ...state, engine: action.engine };
    }
    case 'TOGGLE_V9_RETRY': {
      // V9 SOTA — toggle grid-aware acceptance retry pipeline
      const newVal = !state.useV9Retry;
      try { localStorage.setItem('zoograms.useV9Retry', String(newVal)); } catch (e) {}
      return { ...state, useV9Retry: newVal };
    }
    case 'TOGGLE_DIFFICULTY_V6': {
      // V12.18: 사용자 요청 — DifficultyModeSelector와 EngineSelector를 독립 동작
      //   - 모드 토글 시 engine을 자동 변경하지 않음 (이전 V12.13 동작 폐기)
      //   - 사용자가 EngineSelector에서 명시적으로 변경할 때만 engine 변경
      //   - 단, level은 V6/Classic 양 시스템 사이 매핑 필요 (호환성)
      const newVal = !state.useDifficultyV6;
      USE_DIFFICULTY_V6 = newVal;
      // Reset level if current level doesn't exist in target system
      let nextLevel = state.level;
      if (newVal) {
        // Switching to V6: map legacy → V6 (8 tiers)
        const legacyToV6 = {
          Sprout: 'Sprout4',
          Easy: 'Easy5',
          Medium: 'Medium6',
          MediumPlus: 'Hard6',
          Hard: 'Hard7',
        };
        if (legacyToV6[nextLevel]) nextLevel = legacyToV6[nextLevel];
      } else {
        // Switching to legacy: map V6 → legacy (5 tiers)
        const v6ToLegacy = {
          Sprout4: 'Sprout',
          Easy5: 'Easy',
          Medium6: 'Medium',
          Hard6: 'MediumPlus',
          Medium7: 'Hard',
          Hard7: 'Hard',
          Medium8: 'Hard',
          Hard8: 'Hard',
        };
        if (v6ToLegacy[nextLevel]) nextLevel = v6ToLegacy[nextLevel];
      }
      // engine은 변경하지 않고 사용자의 현재 선택 유지 (독립 동작)
      return { ...state, useDifficultyV6: newVal, level: nextLevel };
    }
    case 'OPEN_CUSTOM':
      // If caller supplied an initialConfig (typically derived from the
      // current level's DIFFICULTY_CONFIGS), seed customConfig with it so
      // the modal opens with the actual code-level settings of the user's
      // current difficulty as the starting point.
      if (action.initialConfig) {
        return { ...state, showCustom: true, customConfig: action.initialConfig };
      }
      return { ...state, showCustom: true };
    case 'CLOSE_CUSTOM': return { ...state, showCustom: false };
    case 'SET_CUSTOM_CONFIG': {
      // Persist for next session; only triggers regeneration when caller explicitly does so
      try { localStorage.setItem('zoograms.customConfig', JSON.stringify(action.config)); } catch (e) {}
      return { ...state, customConfig: action.config };
    }
    case 'SHOW_SOLVER_LOG': return { ...state, showSolverLog: true, solverResult: action.result, isSolving: false };
    case 'CLOSE_SOLVER_LOG': return { ...state, showSolverLog: false };
    case 'SOLVING_START': return { ...state, isSolving: true };
    case 'SOLVING_END': return { ...state, isSolving: false };
    default: return state;
  }
}

// Read persisted engine preference. Default is 'classic' for safety.
// Valid: 'classic' | 'cdg-v4-loose' | 'cdg-v4-strict' | 'cdg-v5-strict'.
// Legacy migrations:
//   'cdg' or 'cdg-v4'  → 'cdg-v4-strict' (canonical v4)
//   'cdg-v3'           → 'cdg-v4-loose'  (legacy hint-first variant)
function getInitialEngine() {
  // V12.17: 사용자 요청 — 초기 엔진은 항상 'classic' 고정
  // (페이지 로드 시 localStorage 무시하고 무조건 classic으로 시작)
  // 사용자가 명시적으로 V6 토글하면 그때만 v6-sota로 전환됨
  return 'classic';
}

// ─────────────────────────────────────────────────────────────────────────────
// SeedFooter — small footer line showing puzzle's structural identifier and
// engine/level metadata, for user reference and sharing.
// ─────────────────────────────────────────────────────────────────────────────
function SeedFooter({ puzzle, onLoadSeed }) {
  const t = useT();
  const [showFullSeed, setShowFullSeed] = React.useState(false);
  const [copyStatus, setCopyStatus] = React.useState(null);
  const [pastedSeed, setPastedSeed] = React.useState('');
  const [loadError, setLoadError] = React.useState(null);

  if (!puzzle) return null;
  const engineId = puzzle.engine || 'classic';
  const engineLabel = t('engine.short.' + engineId) || engineId;
  const levelLabel = t('level.' + (puzzle.level || 'Easy')) || puzzle.level;
  const idHash = puzzle.puzzleId || '—';
  const reproducibleSeed = puzzle.seed || null;
  const diff = puzzle.traceDifficulty;
  const diffV5 = puzzle.traceDifficulty_v5;
  const div = puzzle.patternDiversity;
  const isCDG = engineId.startsWith('cdg');

  const copyToClipboard = (text, label) => {
    if (!text) return;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          setCopyStatus(label + ' 복사됨!');
          setTimeout(() => setCopyStatus(null), 1800);
        }).catch(() => {
          // Fallback: textarea trick
          const ta = document.createElement('textarea');
          ta.value = text; document.body.appendChild(ta); ta.select();
          try { document.execCommand('copy'); setCopyStatus(label + ' 복사됨!'); } catch (e) {}
          document.body.removeChild(ta);
          setTimeout(() => setCopyStatus(null), 1800);
        });
      }
    } catch (e) {}
  };

  const tryLoadSeed = () => {
    const trimmed = (pastedSeed || '').trim();
    if (!trimmed) { setLoadError('시드를 입력해주세요.'); return; }
    // V12.12: Accept both ZL1 (legacy) and ZL2 (current) formats
    if (!trimmed.startsWith('ZL1') && !trimmed.startsWith('ZL2')) {
      setLoadError('잘못된 시드 형식 (ZL1 또는 ZL2로 시작해야 함)');
      return;
    }
    if (!onLoadSeed) { setLoadError('로드 핸들러 미설정'); return; }
    const decoded = decodePuzzleSeed(trimmed);
    if (!decoded) { setLoadError('시드 디코딩 실패'); return; }
    setLoadError(null);
    setPastedSeed('');
    setShowFullSeed(false);
    onLoadSeed(decoded);
  };

  return (
    <div style={{ padding: '4px 40px 24px', textAlign: 'center' }}>
      {/* Compact summary line */}
      <div style={{
        fontSize: 9.5, color: 'var(--ink-tertiary)',
        letterSpacing: '0.04em', opacity: 0.7,
      }} className="font-mono">
        <span>{engineLabel}</span>
        <span style={{ margin: '0 6px', opacity: 0.5 }}>·</span>
        <span>{levelLabel}</span>
        <span style={{ margin: '0 6px', opacity: 0.5 }}>·</span>
        <span title={`${t('footer.seed')}: ${idHash}`}>#{idHash}</span>
        {isCDG && typeof diff === 'number' && diff > 0 && (
          <>
            <span style={{ margin: '0 6px', opacity: 0.5 }}>·</span>
            <span title="trace difficulty (v4 metric)">◇{Math.round(diff)}</span>
          </>
        )}
        {isCDG && typeof diffV5 === 'number' && diffV5 > 0 && (
          <>
            <span style={{ margin: '0 6px', opacity: 0.5 }}>·</span>
            <span title="multi-axis difficulty (v5 metric)" style={{ color: 'var(--accent-gold)', opacity: 0.8 }}>◆{Math.round(diffV5)}</span>
          </>
        )}
        {isCDG && typeof div === 'number' && div > 0 && (
          <>
            <span style={{ margin: '0 6px', opacity: 0.5 }}>·</span>
            <span title="pattern diversity">◈{Math.round(div * 100)}%</span>
          </>
        )}
        <span style={{ margin: '0 8px', opacity: 0.5 }}>·</span>
        <button onClick={() => setShowFullSeed(s => !s)} style={{
          border: 'none', background: 'transparent', cursor: 'pointer',
          color: 'var(--ink-tertiary)', fontSize: 9.5, padding: '0 2px',
          textDecoration: 'underline', textDecorationStyle: 'dotted',
          letterSpacing: '0.04em',
        }} className="font-mono">
          {showFullSeed ? '시드 닫기' : '시드 공유/불러오기'}
        </button>
      </div>

      {/* Expanded seed panel */}
      {showFullSeed && (
        <div style={{
          marginTop: 10, padding: '10px 12px',
          background: 'var(--bg-card)',
          border: '1px solid var(--border-soft)',
          borderRadius: 4,
          maxWidth: 560, marginLeft: 'auto', marginRight: 'auto',
          textAlign: 'left',
        }} className="font-mono">
          {reproducibleSeed && (
            <div style={{ marginBottom: 10 }}>
              <div style={{ fontSize: 10, color: 'var(--ink-secondary)', marginBottom: 4, letterSpacing: '0.04em' }} className="font-body">
                {reproducibleSeed.startsWith('ZL2')
                  ? <>재현 가능 시드 <span style={{color: 'var(--accent-gold)', fontWeight: 600}}>V2 binary</span> ({reproducibleSeed.length}자) — 이 시드로 동일한 퍼즐을 100% 재현</>
                  : <>재현 가능 시드 V1 레거시 ({reproducibleSeed.length}자) — 이 시드로 동일한 퍼즐을 100% 재현</>
                }
              </div>
              <div style={{
                fontSize: 9, padding: 6, borderRadius: 3,
                background: 'var(--bg-paper)', border: '1px solid var(--border-soft)',
                wordBreak: 'break-all', maxHeight: 80, overflowY: 'auto',
                color: 'var(--ink-secondary)', userSelect: 'all',
              }}>{reproducibleSeed}</div>
              <div style={{ marginTop: 4, display: 'flex', gap: 6, alignItems: 'center' }}>
                <button onClick={() => copyToClipboard(reproducibleSeed, '시드')} style={{
                  fontSize: 10, padding: '4px 10px',
                  border: '1px solid var(--ink-primary)',
                  background: 'var(--ink-primary)', color: 'var(--bg-paper)',
                  borderRadius: 3, cursor: 'pointer',
                }} className="font-body">시드 복사</button>
                {copyStatus && <span style={{ fontSize: 10, color: 'var(--accent-gold)' }} className="font-body">{copyStatus}</span>}
              </div>
            </div>
          )}
          {/* Seed loader input */}
          <div>
            <div style={{ fontSize: 10, color: 'var(--ink-secondary)', marginBottom: 4, letterSpacing: '0.04em' }} className="font-body">
              시드로 퍼즐 불러오기 — ZL2(권장) 또는 ZL1(레거시) 시드 붙여넣기:
            </div>
            <div style={{ display: 'flex', gap: 4 }}>
              <input
                type="text"
                value={pastedSeed}
                onChange={(e) => { setPastedSeed(e.target.value); setLoadError(null); }}
                placeholder="ZL2... (또는 레거시 ZL1...)"
                style={{
                  flex: 1, padding: '4px 6px',
                  border: '1px solid var(--border-medium)', borderRadius: 3,
                  fontSize: 10, fontFamily: 'monospace',
                  background: 'var(--bg-paper)', color: 'var(--ink-primary)',
                }}
              />
              <button onClick={tryLoadSeed} style={{
                fontSize: 10, padding: '4px 10px',
                border: '1px solid var(--accent-gold)',
                background: 'rgba(180,83,9,0.08)', color: 'var(--accent-gold)',
                borderRadius: 3, cursor: 'pointer', whiteSpace: 'nowrap',
              }} className="font-body">불러오기</button>
            </div>
            {loadError && <div style={{ fontSize: 10, color: '#a04020', marginTop: 4 }} className="font-body">⚠ {loadError}</div>}
          </div>
        </div>
      )}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// SOLVER LOG — convert a step from traceSolve_v2 into a human-readable line
// ─────────────────────────────────────────────────────────────────────────────
// Each step has: type, cost, pairIdx, premises, conclusion, domainBefore/After.
// We map it to a Korean sentence the player can follow:
//   "Step 3 [Total Forcing, cost 2]: row 2의 Total=4. 페어 사자(7)가 강제됨 (후보 12→3)"

const KOREAN_HABITAT_LABEL = {
  '사바나': '사바나', '극지': '극지', '해양': '해양', '숲': '숲',
};
const KOREAN_DIET_LABEL = { '육식': '육식', '초식': '초식' };
const KOREAN_GENDER_LABEL = { 'male': '♂', 'female': '♀', 'both': '?', 'g1g2': '?', 'g2g1': '?' };

// Translate animal id → name lookup (uses ANIMALS module)

// Describe a pair (e.g. "🦁 사자 페어")
function describePair(puzzle, pairIdx) {
  if (!puzzle || !puzzle.pairs || pairIdx === undefined || !puzzle.pairs[pairIdx]) {
    return pairIdx !== undefined ? `페어 #${pairIdx}` : '페어';
  }
  const [t1Id] = puzzle.pairs[pairIdx];
  const tok = (puzzle.tokens || []).find(t => t.id === t1Id);
  if (!tok || tok.animalId === undefined) return `페어 #${pairIdx}`;
  const a = ANIMALS.find(a => a.id === tok.animalId);
  if (!a) return `페어 #${pairIdx}`;
  return `${a.emoji || ''} ${a.name} 페어`.trim();
}

// Convert one step into a friendly description object.
// Returns { stepNum, patternKey, patternLabel, cost, summary, detail }
function describeSolverStep(step, idx, puzzle, t) {
  const patternLabel = t('pattern.' + step.type) || step.type;
  const pairLabel = step.pairIdx !== undefined ? describePair(puzzle, step.pairIdx) : '';
  let summary = '';
  let detail = '';

  switch (step.type) {
    case 'naked-single': {
      // domain narrowed to 1 → pair decided
      const pos = step.conclusion?.position;
      const gender = step.conclusion?.gender;
      const cellStr = pos ? `(${pos.c1.row},${pos.c1.col})↔(${pos.c2.row},${pos.c2.col})` : '';
      summary = `${pairLabel}이 한 자리만 남아 결정됨`;
      detail = pos ? `위치 ${cellStr}, 성별 ${KOREAN_GENDER_LABEL[gender] || gender}` : '';
      break;
    }
    case 'total-saturation': {
      // a line is full → other pairs cannot use it
      const beforeAfter = step.domainBefore !== undefined ? `후보 ${step.domainBefore}→${step.domainAfter}` : '';
      // Try to extract line from premises like "row-3-saturated"
      const lineHint = (step.premises || []).find(p => p.includes('row-') || p.includes('col-')) || '';
      summary = `라인이 가득 차서 ${pairLabel}의 후보 정리됨`;
      detail = `${lineHint} ${beforeAfter}`.trim();
      break;
    }
    case 'total-forcing': {
      const beforeAfter = step.domainBefore !== undefined ? `후보 ${step.domainBefore}→${step.domainAfter}` : '';
      const lineHint = (step.premises || []).find(p => p.includes('row-') || p.includes('col-')) || '';
      summary = `${pairLabel}이 특정 라인에 강제됨`;
      detail = `${lineHint} ${beforeAfter}`.trim();
      break;
    }
    case 'gender-count-forcing': {
      const beforeAfter = step.domainBefore !== undefined ? `후보 ${step.domainBefore}→${step.domainAfter}` : '';
      const lineHint = (step.premises || []).find(p => p.includes('row-') || p.includes('col-')) || '';
      summary = `라인의 ♂ 수 제약으로 ${pairLabel} 후보 정리됨`;
      detail = `${lineHint} ${beforeAfter}`.trim();
      break;
    }
    case 'impossibility-detection': {
      // Misnomer: this is actually count-hint-based pruning, NOT a contradiction.
      // It prunes candidates that would violate Total/H1 hints. Domain is still > 0.
      const beforeAfter = step.domainBefore !== undefined ? `후보 ${step.domainBefore}→${step.domainAfter}` : '';
      summary = `${pairLabel}의 일부 후보가 카운트 힌트 위반 → 정리`;
      detail = `${beforeAfter} (premises: ${(step.premises || []).join(', ')})`;
      break;
    }
    case 'naked-pair': {
      const beforeAfter = step.domainBefore !== undefined ? `후보 ${step.domainBefore}→${step.domainAfter}` : '';
      summary = `두 페어가 같은 두 셀에 한정 → 다른 페어 후보 정리`;
      detail = `${pairLabel} ${beforeAfter}`;
      break;
    }
    case 'position-locked-gender': {
      summary = `${pairLabel}의 위치가 결정되었고, 라인의 성별 규약이 성별 강제`;
      detail = (step.premises || []).join(', ');
      break;
    }
    case 'habitat-combinatorial': {
      const beforeAfter = step.domainBefore !== undefined ? `후보 ${step.domainBefore}→${step.domainAfter}` : '';
      summary = `${pairLabel}의 종이 라인 attribute 규약과 부합 안 함 → 후보 제거`;
      detail = `${beforeAfter}`;
      break;
    }
    case 'pair-adjacency-prop': {
      const beforeAfter = step.domainBefore !== undefined ? `후보 ${step.domainBefore}→${step.domainAfter}` : '';
      summary = `다른 페어가 특정 셀을 항상 사용 → ${pairLabel} 후보 정리`;
      detail = `${beforeAfter}`;
      break;
    }
    case 'species-uniqueness': {
      const beforeAfter = step.domainBefore !== undefined ? `후보 ${step.domainBefore}→${step.domainAfter}` : '';
      summary = `라인의 종 분포가 강한 forcing → ${pairLabel} 후보 정리`;
      detail = `${beforeAfter}`;
      break;
    }
    case 'bin-packing-force': {
      // Multi-pair joint reasoning (envelope-based): this pair's contribution
      // is forced by what the OTHER pairs can collectively contribute to the line.
      const beforeAfter = step.domainBefore !== undefined ? `후보 ${step.domainBefore}→${step.domainAfter}` : '';
      const lineHint = (step.premises || []).find(p => p.includes('row-') || p.includes('col-')) || '';
      const isH1 = lineHint.includes('H1');
      const target = isH1 ? '♂ 수' : 'contribution';
      const isGenderRestrict = lineHint.includes('gender-mode-restricted');
      let direction = `특정 ${target} 값으로`;
      if (lineHint.includes('bin-packing-min-forced')) direction = `최소 ${target}보다 더 많이`;
      else if (lineHint.includes('bin-packing-max-forced')) direction = `최대 ${target}보다 더 적게`;
      else if (lineHint.includes('bin-packing-tight-min')) direction = `정확히 최소 ${target}으로 (라인 sumMin = need)`;
      else if (lineHint.includes('bin-packing-tight-max')) direction = `정확히 최대 ${target}으로 (라인 sumMax = need)`;
      else if (lineHint.includes('gender-mode-restricted-min')) direction = `최소 ${target}보다 더 많이 (gender mode 좁힘)`;
      else if (lineHint.includes('gender-mode-restricted-max')) direction = `최대 ${target}보다 더 적게 (gender mode 좁힘)`;
      if (isGenderRestrict) {
        summary = `라인 ♂ 수 envelope이 ${pairLabel}의 gender mode 좁힘 (페어 axiom 1♂+1♀로 candidate position 별 가능 ♂ 수 계산)`;
      } else {
        summary = `다른 페어들의 결합 추론으로 ${pairLabel}이 ${direction} 기여해야 함`;
      }
      detail = `${lineHint} ${beforeAfter}`.trim();
      break;
    }
    case 'cell-hidden-single': {
      // Cell-centric multi-pair reasoning: a saturated line cell has only
      // ONE pair that can use it → that pair forced.
      const beforeAfter = step.domainBefore !== undefined ? `후보 ${step.domainBefore}→${step.domainAfter}` : '';
      const premise = (step.premises || []).find(p => p.includes('cell-')) || '';
      // Extract cell coordinate from premise like "cell-3,0-saturated-only-pair-8"
      const cellMatch = premise.match(/cell-(\d+),(\d+)/);
      const cellStr = cellMatch ? `(${cellMatch[1]},${cellMatch[2]})` : '특정 셀';
      summary = `라인이 가득 차야 하는데 ${cellStr}을 사용 가능한 페어가 ${pairLabel} 단독 → 그 셀 사용 강제`;
      detail = `${beforeAfter}`;
      break;
    }
    case 'multi-line-force': {
      const beforeAfter = step.domainBefore !== undefined ? `후보 ${step.domainBefore}→${step.domainAfter}` : '';
      const premise = (step.premises || [])[0] || '';
      summary = `두 라인의 결합 제약으로 ${pairLabel}의 일부 후보가 다른 페어들에 의해 충족 불가능`;
      detail = `${premise} ${beforeAfter}`.trim();
      break;
    }
    case 'adjacency-cascade': {
      const beforeAfter = step.domainBefore !== undefined ? `후보 ${step.domainBefore}→${step.domainAfter}` : '';
      const premise = (step.premises || [])[0] || '';
      summary = `다른 페어가 특정 셀을 항상 사용 → ${pairLabel} 후보 정리`;
      detail = `${premise} ${beforeAfter}`.trim();
      break;
    }
    case 'hidden-species-force': {
      const beforeAfter = step.domainBefore !== undefined ? `후보 ${step.domainBefore}→${step.domainAfter}` : '';
      const lineHint = (step.premises || []).find(p => p.includes('row-') || p.includes('col-')) || '';
      let mode = '';
      if (lineHint.includes('eligible-max-saturated')) mode = '자격 종 페어가 모두 최대 contribution 강제';
      else if (lineHint.includes('non-eligible-blocked')) mode = '자격 종이 라인을 정확히 채움 → 비자격 페어 진입 차단';
      else if (lineHint.includes('subset-saturation-max')) mode = '부분집합 포화 → 자격 종 페어 최대 강제';
      summary = `라인 attribute 규약 + Total 결합: ${mode}`;
      detail = `${pairLabel} ${beforeAfter}`;
      break;
    }
    case 'cross-line-synergy': {
      const beforeAfter = step.domainBefore !== undefined ? `후보 ${step.domainBefore}→${step.domainAfter}` : '';
      const premise = (step.premises || [])[0] || '';
      const isReq = premise.includes('required');
      summary = isReq
        ? `${pairLabel}이 두 라인 교차 셀을 사용해야 함 (다른 후보 모두 결합 추론으로 불가능)`
        : `${pairLabel}이 두 라인 교차 셀을 사용할 수 없음 (사용 시 결합 추론 불가능)`;
      detail = `${premise} ${beforeAfter}`.trim();
      break;
    }
    case 'lookahead-branch-elim': {
      const beforeAfter = step.domainBefore !== undefined ? `후보 ${step.domainBefore}→${step.domainAfter}` : '';
      const premise = (step.premises || [])[0] || '';
      // Extract pruned count from premise like "branch-contradiction-pruned-1-of-2"
      const m = premise.match(/pruned-(\d+)-of-(\d+)/);
      const pruned = m ? m[1] : '?';
      const total = m ? m[2] : '?';
      summary = `${pairLabel}의 ${pruned}/${total} 후보가 다른 페어 모순 유발 → 제거`;
      detail = `각 후보를 가설로 propagate하여 다른 페어 도메인 0이 되는지 검사. ${beforeAfter}`;
      break;
    }
    case 'gender-resolution': {
      const premise = (step.premises || [])[0] || '';
      let kind = '성별 결정';
      if (premise.includes('g1g2-only-valid')) kind = '한 성별 모드만 valid → 결정';
      else if (premise.includes('g2g1-only-valid')) kind = '한 성별 모드만 valid → 결정';
      else if (premise.includes('multi-solution-arbitrary')) kind = '두 성별 모드 모두 valid (multi-solution) → 임의 결정';
      summary = `${pairLabel} 도메인 1 + 성별 'both' → 가설 검증으로 ${kind}`;
      detail = '두 성별 모드(g1g2, g2g1)를 각각 가설로 propagate하여 모순 발생 여부 확인';
      break;
    }
    case 'single-lookahead':
    case 'multi-step-lookahead': {
      summary = `가설 검증으로 ${pairLabel} 결정`;
      detail = '두 후보 모두에서 같은 결정이 도출됨';
      break;
    }
    case 'backtrack-fallback': {
      const premise = (step.premises || [])[0] || '';
      const isUnique = premise.includes('unique-extension');
      summary = isUnique
        ? `${pairLabel} 결정 — 다른 후보들은 글로벌 모순 (백트랙 검증)`
        : `${pairLabel} 도메인 prune — 일부 후보가 글로벌 모순 (백트랙 검증)`;
      detail = '12 패턴이 모두 진전 못 함 → 백트랙으로 각 후보의 완전 확장 가능성 검사. 패턴 외부 글로벌 추론.';
      break;
    }
    case 'hidden-single': {
      summary = `${pairLabel}이 어떤 라인에서 유일한 후보`;
      detail = '';
      break;
    }
    default: {
      summary = `${step.type} 적용 (${pairLabel})`;
      detail = JSON.stringify(step.conclusion || {});
    }
  }
  return {
    stepNum: idx + 1,
    patternKey: step.type,
    patternLabel,
    cost: step.cost,
    pairIdx: step.pairIdx,
    summary,
    detail,
  };
}

// SolverLogModal — modal showing the trace of solver execution as a list.
// ─────────────────────────────────────────────────────────────────────────────
// SOLVER STATE REPLAY — reconstruct state at any step by replaying trace
// ─────────────────────────────────────────────────────────────────────────────
// Each trace step has an `apply(s)` function that mutates state. By
// initializing fresh state and applying the first N steps, we can reconstruct
// the state AFTER step N. We compute and cache snapshots for each step index.
//
// snapshot structure: { decisions, domains, activePairs, usedCells }
// We extract just enough info for the MiniGrid to render.

function captureGridSnapshot(state, n, puzzle) {
  // For each cell, what's there?
  //   - 'decided': { animalId, gender, pairIdx, isFixed } (token placed)
  //   - 'fixed': { animalId, gender, pairIdx } — preMark/fixedCell from puzzle (visible from start)
  //   - 'candidate': Set of pairIdx (one of these pairs might use this cell)
  //   - 'forbidden': true
  //   - 'empty': default
  //
  // Note: Fixed cells are tokens visible from puzzle start. The solver may
  // have already incorporated them into decisions, but they should be
  // visually distinguished from cells decided by inference.
  const grid = Array(n).fill(null).map(() => Array(n).fill(null).map(() => ({
    state: 'empty', candidates: new Set(),
  })));

  // 1. Forbidden cells first
  for (const fc of (state.forbidden || new Set())) {
    const [r, c] = fc.split(',').map(Number);
    if (r >= 0 && r < n && c >= 0 && c < n) grid[r][c] = { state: 'forbidden', candidates: new Set() };
  }

  // 2. Fixed cells from puzzle (visible from start) — overlay BEFORE decisions
  // so we can distinguish "fixed" vs "decided-by-solver". A fixed cell is
  // always also part of a decision (or constrains its pair) — we mark by source.
  const fixedCellMap = {}; // "r,c" → { animalId, gender, pairIdx }
  if (puzzle && puzzle.fixedCells) {
    for (const fc of puzzle.fixedCells) {
      const cellKey = `${fc.row},${fc.col}`;
      // Find pairIdx for this fixed cell (matches by animalId + position in puzzle.tokens)
      let pairIdx = -1;
      if (puzzle.tokens && puzzle.pairs) {
        const tok = puzzle.tokens.find(t =>
          t.row === fc.row && t.col === fc.col && t.animalId === fc.animalId
        );
        if (tok) {
          pairIdx = puzzle.pairs.findIndex(p => p[0] === tok.id || p[1] === tok.id);
        }
      }
      fixedCellMap[cellKey] = {
        animalId: fc.animalId, gender: fc.gender, pairIdx,
      };
      if (grid[fc.row]?.[fc.col] && grid[fc.row][fc.col].state !== 'forbidden') {
        grid[fc.row][fc.col] = {
          state: 'fixed', animalId: fc.animalId, gender: fc.gender,
          pairIdx, candidates: new Set(),
        };
      }
    }
  }

  // 3. Decided pairs (by solver) — overlay over candidate-only cells, but
  // do NOT replace 'fixed' state (fixed takes precedence visually)
  for (const piStr in state.decisions) {
    const pi = parseInt(piStr);
    const d = state.decisions[pi];
    const animalId = state.pairSpecies[pi];

    const cell1Key = `${d.c1.row},${d.c1.col}`;
    const cell2Key = `${d.c2.row},${d.c2.col}`;
    const isFixed1 = !!fixedCellMap[cell1Key];
    const isFixed2 = !!fixedCellMap[cell2Key];

    if (grid[d.c1.row]?.[d.c1.col] && grid[d.c1.row][d.c1.col].state !== 'fixed') {
      grid[d.c1.row][d.c1.col] = {
        state: 'decided', animalId, gender: d.g1, pairIdx: pi, candidates: new Set(),
      };
    }
    if (grid[d.c2.row]?.[d.c2.col] && grid[d.c2.row][d.c2.col].state !== 'fixed') {
      grid[d.c2.row][d.c2.col] = {
        state: 'decided', animalId, gender: d.g2, pairIdx: pi, candidates: new Set(),
      };
    }
  }

  // 4. Candidate cells: union of all surviving positions of active pairs
  for (const pi of state.activePairs) {
    const dom = state.domains[pi];
    if (!dom || dom.positions.length === 0) continue;
    for (const p of dom.positions) {
      const k1 = grid[p.c1.row]?.[p.c1.col];
      const k2 = grid[p.c2.row]?.[p.c2.col];
      if (k1 && k1.state === 'empty') k1.candidates.add(pi);
      if (k2 && k2.state === 'empty') k2.candidates.add(pi);
    }
  }

  return grid;
}

// Replay trace from initial state up to (and including) step at stepIdx (-1 = initial).
// Returns the captured grid snapshot.
// We DON'T cache here — caller can memoize if needed. Replay from scratch is
// reasonable for up to ~50 steps (trace length bound).
function replayTraceToStep(puzzle, trace, stepIdx) {
  if (typeof ts_initializeState !== 'function') return null;
  try {
    const state = ts_initializeState(puzzle);
    // After initialization, ts_pruneByUsedCells is called once in real solver.
    // Mirror that here.
    if (typeof ts_pruneByUsedCells === 'function') ts_pruneByUsedCells(state);
    // Apply steps 0..stepIdx
    for (let i = 0; i <= stepIdx && i < trace.length; i++) {
      const step = trace[i];
      if (step && typeof step.apply === 'function') {
        try { step.apply(state); } catch (e) { /* skip on error */ }
      }
    }
    return captureGridSnapshot(state, puzzle.n, puzzle);
  } catch (e) {
    return null;
  }
}

// Determine which cells changed between two snapshots — for highlighting
// the effect of a single step.
function diffSnapshots(prev, next, n) {
  const changes = new Set(); // cell keys "r,c" that differ
  if (!prev || !next) return changes;
  for (let r = 0; r < n; r++) {
    for (let c = 0; c < n; c++) {
      const a = prev[r]?.[c], b = next[r]?.[c];
      if (!a || !b) continue;
      // Detect transitions
      if (a.state !== b.state) { changes.add(`${r},${c}`); continue; }
      if (a.state === 'empty') {
        // candidate-set changed?
        if (a.candidates.size !== b.candidates.size) { changes.add(`${r},${c}`); continue; }
        for (const pi of a.candidates) if (!b.candidates.has(pi)) { changes.add(`${r},${c}`); break; }
      }
    }
  }
  return changes;
}

// ─────────────────────────────────────────────────────────────────────────────
// MINI GRID — visualize a snapshot
// ─────────────────────────────────────────────────────────────────────────────
// Compact n×n grid showing:
//   - Decided cells: animal emoji + gender symbol
//   - Candidate cells: dots indicating # of pairs that might use it (or none)
//   - Forbidden cells: hatched ✗
//   - Highlighted cells (changed this step): gold border + accent

// MiniGrid renders a snapshot with:
//   - Decided cells (by solver inference): animal emoji + gender + light bg
//   - Fixed cells (visible from puzzle start): same as decided but with a
//     distinct "lock" indicator (📌) and stronger bg to mark as given
//   - Candidate cells: 3×3 sub-grid showing which of up to 9 pairs are
//     candidates. Each sub-cell is a tiny dot/emoji indicating a specific pair.
//     This lets the user see exactly which pair "could" be here, not just
//     a count.
//   - Forbidden cells: hatched ✗
//   - Changed cells (this step): gold border
//   - Highlighted pair (current step's pair): emphasized in matching sub-cells
function MiniGrid({ snapshot, n, changedCells, highlightedPair, cellSize, puzzle }) {
  if (!snapshot) return null;
  const sz = cellSize || 44; // need at least 42px to fit a readable 3x3 sub-grid

  // Compute pair → 3x3 grid position mapping. We want a stable ordering so
  // that "pair 0 is always top-left, pair 1 is top-mid", etc. This requires
  // sorting the puzzle.pairs by some stable key. The simplest is pair index.
  // For >9 pairs we wrap with overflow, but Zoograms typically has ≤9.
  const numPairs = puzzle && puzzle.pairs ? puzzle.pairs.length : 9;

  // Build pairIdx → { row(0-2), col(0-2), animalId, emoji } map for sub-grid placement
  const pairSubGridPos = {};
  for (let pi = 0; pi < numPairs && pi < 9; pi++) {
    const r = Math.floor(pi / 3);
    const c = pi % 3;
    let animalId = null;
    if (puzzle && puzzle.pairs && puzzle.tokens) {
      const tokId = puzzle.pairs[pi]?.[0];
      const tok = puzzle.tokens.find(tok => tok.id === tokId);
      if (tok) animalId = tok.animalId;
    }
    const animal = ANIMALS.find(a => a.id === animalId);
    pairSubGridPos[pi] = { r, c, animalId, emoji: animal ? animal.emoji : '?' };
  }

  return (
    <div style={{
      display: 'grid',
      gridTemplateColumns: `repeat(${n}, ${sz}px)`,
      gap: 1, background: 'var(--border-soft)',
      border: '1px solid var(--border-medium)',
      borderRadius: 3, padding: 1,
      width: 'fit-content',
    }}>
      {snapshot.flat().map((cell, idx) => {
        const r = Math.floor(idx / n), c = idx % n;
        const cellKey = `${r},${c}`;
        const isChanged = changedCells && changedCells.has(cellKey);

        let bg = 'var(--bg-paper)';
        let border = 'transparent';
        let content = null;

        if (cell.state === 'forbidden') {
          // Forbidden cell — diagonal stripe + ✗
          bg = 'repeating-linear-gradient(45deg, var(--bg-card), var(--bg-card) 2px, var(--border-soft) 2px, var(--border-soft) 4px)';
          content = (
            <span style={{ color: 'var(--ink-tertiary)', fontSize: Math.max(8, sz * 0.32) }}>✗</span>
          );
        } else if (cell.state === 'fixed' || cell.state === 'decided') {
          // Both fixed and decided: show emoji + gender. Distinguish by bg + corner badge.
          const animal = ANIMALS.find(a => a.id === cell.animalId);
          const emoji = animal ? animal.emoji : '?';
          const g = cell.gender === 'male' ? '♂' : '♀';
          const isPairHighlight = highlightedPair !== undefined && cell.pairIdx === highlightedPair;

          if (cell.state === 'fixed') {
            // Fixed cell — distinctive deeper background (slight tint) + lock indicator
            bg = isPairHighlight
              ? 'rgba(180,83,9,0.12)'
              : 'rgba(180,83,9,0.05)'; // accent-gold tint, very subtle
          } else {
            // Decided by solver — neutral bg, no lock indicator
            bg = isPairHighlight ? 'rgba(180,83,9,0.08)' : 'var(--bg-card)';
          }

          content = (
            <div style={{
              display: 'flex', flexDirection: 'column',
              alignItems: 'center', justifyContent: 'center',
              lineHeight: 1, position: 'relative', width: '100%', height: '100%',
            }}>
              <span style={{ fontSize: Math.max(13, sz * 0.5) }}>{emoji}</span>
              <span style={{ fontSize: Math.max(7, sz * 0.22), color: 'var(--ink-tertiary)' }}>{g}</span>
              {cell.state === 'fixed' && (
                <span style={{
                  position: 'absolute', top: 1, right: 2,
                  fontSize: Math.max(7, sz * 0.22),
                  color: 'var(--accent-gold)',
                  lineHeight: 1,
                  filter: 'saturate(1.4)',
                }} title="고정 토큰">📌</span>
              )}
            </div>
          );
        } else if (cell.candidates.size > 0) {
          // Candidate cell — render a 3×3 sub-grid showing each pair's potential
          // presence. Each sub-cell is ~1/3 of the parent cell.
          const subSize = Math.floor((sz - 2) / 3);
          const subCells = [];
          for (let sr = 0; sr < 3; sr++) {
            for (let sc = 0; sc < 3; sc++) {
              const subIdx = sr * 3 + sc;
              // Find which pair maps to this sub-grid position
              const pi = subIdx;
              const info = pairSubGridPos[pi];
              const isPairCandidate = cell.candidates.has(pi);
              const isHighlightedPair = pi === highlightedPair;
              let subContent = null;
              let subBg = 'transparent';
              let subColor = 'var(--ink-tertiary)';

              if (isPairCandidate && info) {
                // This pair has a candidate at this cell
                if (isHighlightedPair) {
                  subBg = 'rgba(180,83,9,0.18)';
                  subColor = 'var(--accent-gold)';
                }
                // Show emoji at small size, or a colored dot for ultra-tiny cells
                if (subSize >= 12) {
                  subContent = (
                    <span style={{
                      fontSize: Math.max(8, subSize * 0.85),
                      lineHeight: 1, opacity: isHighlightedPair ? 1 : 0.8,
                    }}>{info.emoji}</span>
                  );
                } else {
                  // Too small for emoji — use colored dot
                  subContent = (
                    <span style={{
                      display: 'inline-block',
                      width: Math.max(3, subSize * 0.5),
                      height: Math.max(3, subSize * 0.5),
                      borderRadius: '50%',
                      background: isHighlightedPair ? 'var(--accent-gold)' : 'var(--ink-tertiary)',
                    }}></span>
                  );
                }
              }

              subCells.push(
                <div key={subIdx} style={{
                  width: subSize, height: subSize,
                  background: subBg,
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                  borderRadius: 1,
                  overflow: 'hidden',
                }}>
                  {subContent}
                </div>
              );
            }
          }
          content = (
            <div style={{
              display: 'grid',
              gridTemplateColumns: `repeat(3, ${subSize}px)`,
              gridTemplateRows: `repeat(3, ${subSize}px)`,
              gap: 0,
              width: subSize * 3, height: subSize * 3,
            }}>{subCells}</div>
          );
          bg = 'var(--bg-paper)';
        } else {
          // Empty / unreachable cell
          bg = 'var(--bg-paper)';
        }

        if (isChanged) border = 'var(--accent-gold)';

        return (
          <div key={idx} style={{
            width: sz, height: sz,
            background: bg,
            border: `1.5px solid ${border}`,
            borderRadius: 2,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            position: 'relative',
            overflow: 'hidden',
            boxSizing: 'border-box',
          }}>
            {content}
          </div>
        );
      })}
    </div>
  );
}

// Compact metric cell — used in the SOTA solver dashboard.
// Shows label (small caps), large value, optional accent color, optional
// tooltip via `title` attribute (works on both desktop hover and mobile
// long-press in modern browsers).
// ─────────────────────────────────────────────────────────────────────
// PATTERN_CATEGORY — MECE taxonomy mapping each solver pattern type to
// one of 7 cognitive reasoning categories. Used by SolverLogModal to
// group the pattern frequency display so users can see WHICH KINDS of
// reasoning their puzzle exercised. Each pattern belongs to exactly one
// category (MECE) — no overlaps, no gaps.
//
// The 7 categories correspond to the layered architecture of the V5+
// solver: Decision → LineCount → Gender → MultiPair → LineAxis →
// Hypothesis → Backtrack, with cost roughly increasing across categories.
// ─────────────────────────────────────────────────────────────────────
const PATTERN_CATEGORY = {
  // A. Decision — domain narrowed to 1, commit
  'naked-single':            'decision',
  // B. Line Count — total/H1/H2 hint reasoning
  'total-saturation':        'lineCount',
  'total-forcing':           'lineCount',
  'impossibility-detection': 'lineCount',
  // C. Gender — ♂/♀ axiom reasoning
  'position-locked-gender':  'gender',
  'gender-count-forcing':    'gender',
  'gender-resolution':       'gender',
  // D. Multi-Pair — multi-pair joint envelope/cell reasoning
  'bin-packing-force':       'multiPair',
  'cell-hidden-single':      'multiPair',
  // E. Line Axis — habitat/adjacency axis-specific reasoning
  'habitat-combinatorial':   'lineAxis',
  'pair-adjacency-prop':     'lineAxis',
  'naked-pair':              'lineAxis',     // dormant
  'hidden-single':           'lineAxis',     // dormant
  'species-uniqueness':      'lineAxis',     // dormant
  'multi-line-force':        'lineAxis',     // dormant
  'adjacency-cascade':       'lineAxis',     // dormant
  'hidden-species-force':    'lineAxis',     // dormant
  'cross-line-synergy':      'lineAxis',     // dormant
  // F. Hypothesis — branch testing
  'lookahead-branch-elim':   'hypothesis',
  'single-lookahead':        'hypothesis',
  'multi-step-lookahead':    'hypothesis',
  // G. Backtrack — global systematic search
  'backtrack-fallback':      'backtrack',
};

// Display order for the 7 categories — roughly by cost progression.
const CATEGORY_ORDER = [
  'decision', 'lineCount', 'gender', 'multiPair',
  'lineAxis', 'hypothesis', 'backtrack',
];

// Color accent per category — gives users an immediate visual sense of
// reasoning kind. Tuned to be distinct without overwhelming the dashboard.
const CATEGORY_COLOR = {
  decision:   '#10b981', // emerald — "결정/commit" 안정감
  lineCount:  '#3b82f6', // blue — "카운트" 명료
  gender:     '#a855f7', // purple — "성별" 차별
  multiPair:  '#f59e0b', // amber — "다중 페어" warmth
  lineAxis:   '#06b6d4', // cyan — "축" 추가 차원
  hypothesis: '#ef4444', // red — "가설" 위험

};
