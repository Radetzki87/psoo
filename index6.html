// SOTA Generation Progress UI
// ═══════════════════════════════════════════════════════════════════════════
// Phase ID → translation key 매핑.
// Generator의 onProgress({ phase: 'cdg-v4-strict-attempt', ... })을 받아
// 사용자가 이해하기 쉬운 한국어 phase label로 변환.
function mapPhaseToLabel(phaseId) {
  if (!phaseId) return 'loading.phase.init';
  const p = String(phaseId).toLowerCase();
  if (p.includes('attempt')) return 'loading.phase.attempt';
  if (p.includes('adjust')) return 'loading.phase.adjust';
  if (p.includes('force-unique')) return 'loading.phase.forceUnique';
  if (p.includes('minimize') || p.includes('tightening')) return 'loading.phase.minimize';
  if (p.includes('verify') || p.includes('init')) return 'loading.phase.verify';
  if (p.includes('pool')) return 'loading.phase.pool';
  if (p.includes('v9-retry')) return 'loading.phase.v9retry';
  if (p.includes('fallback')) return 'loading.phase.fallback';
  if (p.includes('explore')) return 'loading.phase.exploring';
  return 'loading.phase.init';
}

function LoadingOverlay({ show, level, progress }) {
  const t = useT();
  // V12.19: 1.5초 이내 생성 안 되면 "시간이 걸릴 수 있다" 안내 메시지 노출
  const [showSlowWarning, setShowSlowWarning] = React.useState(false);
  React.useEffect(() => {
    if (!show) {
      setShowSlowWarning(false);
      return;
    }
    setShowSlowWarning(false);  // show 시작 시점 reset
    const timer = setTimeout(() => setShowSlowWarning(true), 1500);
    return () => clearTimeout(timer);
  }, [show]);

  if (!show) return null;
  const cfg = DIFFICULTY_CONFIGS[level] || DIFFICULTY_CONFIGS.Sprout;

  // Defensive defaults — generator의 phase별 payload가 일관되지 않을 수 있으므로
  // UI에서 모든 NaN/undefined 방어. budget이 누락되면 config의 totalBudgetMs 사용.
  const defaultBudget = (cfg && cfg.totalBudgetMs) || 25000;
  const safeProgress = progress ? {
    phase: progress.phase || null,
    elapsed: Number.isFinite(progress.elapsed) ? progress.elapsed : 0,
    budget: Number.isFinite(progress.budget) && progress.budget > 0 ? progress.budget : defaultBudget,
    attempts: Number.isFinite(progress.attempts)
      ? progress.attempts
      : (Number.isFinite(progress.retry) ? progress.retry + 1 : 1),
    maxRetries: Number.isFinite(progress.maxRetries) ? progress.maxRetries : null,
    currentMaxSolutions: Number.isFinite(progress.currentMaxSolutions) ? progress.currentMaxSolutions : 1,
    candidatesFound: Number.isFinite(progress.candidatesFound) ? progress.candidatesFound : null,
    subProgress: progress.subProgress || null,
  } : null;

  const pct = safeProgress
    ? Math.min(100, Math.max(0, Math.round((safeProgress.elapsed / safeProgress.budget) * 100)))
    : 0;
  const sec = safeProgress ? (safeProgress.elapsed / 1000).toFixed(1) : '0.0';
  const budgetSec = safeProgress ? (safeProgress.budget / 1000).toFixed(0) : '—';

  // Phase label
  const phaseKey = mapPhaseToLabel(safeProgress?.phase);
  const phaseLabel = t(phaseKey);

  // Retry indicator
  const retryStr = safeProgress && safeProgress.maxRetries
    ? t('loading.retry', { current: safeProgress.attempts, total: safeProgress.maxRetries })
    : (safeProgress ? t('loading.attempts', { n: safeProgress.attempts }) : '');

  // Uniqueness mode hint (only shown after 2s to avoid early flicker)
  const relaxHint = safeProgress && safeProgress.currentMaxSolutions > 1
    ? t('loading.loose', { n: safeProgress.currentMaxSolutions })
    : t('loading.strict');

  // Sub-progress (e.g., forceUniqueness cells added)
  const sub = safeProgress?.subProgress;
  const subPct = sub && Number.isFinite(sub.current) && Number.isFinite(sub.total) && sub.total > 0
    ? Math.min(100, Math.round((sub.current / sub.total) * 100))
    : null;

  return (
    <div style={{
      position: 'fixed', inset: 0, background: 'rgba(250,247,240,0.92)', backdropFilter: 'blur(3px)',
      display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 40, animation: 'fadeInUp 200ms',
    }}>
      <div style={{ textAlign: 'center', maxWidth: 460, padding: '0 24px' }} className="font-display">
        <div style={{ fontSize: 12, color: 'var(--ink-tertiary)', letterSpacing: '0.14em', textTransform: 'uppercase', marginBottom: 10 }} className="font-body">
          {t('loading.generating')}
        </div>
        <div style={{ fontSize: 32, fontStyle: 'italic', color: 'var(--ink-primary)', fontWeight: 400, marginBottom: 24 }}>
          {cfg?.glyph} {t(`diff.${level}.label`)}
        </div>

        {/* Current phase — large, prominent */}
        <div style={{

          <div style={{
            width: `${pct}%`, height: '100%', background: 'var(--accent-gold)',
            transition: 'width 200ms', position: 'relative',
            backgroundImage: 'linear-gradient(90deg, var(--accent-gold) 0%, var(--accent-gold-soft) 50%, var(--accent-gold) 100%)',

        {/* Time / attempt indicators */}
        <div style={{ marginTop: 14, display: 'flex', justifyContent: 'space-between', width: 360, margin: '14px auto 0' }} className="font-mono">
          <span style={{ fontSize: 11, color: 'var(--ink-tertiary)', letterSpacing: '0.06em' }}>
            {sec}s / {budgetSec}s
          </span>
          <span style={{ fontSize: 11, color: 'var(--ink-tertiary)', letterSpacing: '0.06em' }}>
            {retryStr}
          </span>
        </div>

        {/* V12.19: 1.5초 이내 생성 안 되면 등장하는 "시간이 더 걸릴 수 있다" 안내
            fadeInUp 애니메이션으로 부드럽게 등장 */}
        {showSlowWarning && (
          <div
            className="font-body"
            style={{
              marginTop: 16,
              padding: '8px 14px',
              background: 'rgba(180,83,9,0.06)',
              border: '1px solid rgba(180,83,9,0.18)',
              borderRadius: 4,
              color: 'var(--ink-secondary)',
              fontSize: 12,
              letterSpacing: '0.02em',
              lineHeight: 1.5,
              display: 'inline-flex',
              alignItems: 'center',

              animation: 'fadeInUp 240ms',
              maxWidth: 360,
            }}
          >
            <span aria-hidden style={{ flexShrink: 0 }}>⏳</span>
            <span>{t('loading.slowWarning')}</span>
          </div>
        )}

        {/* Sub-progress: forceUniqueness cells, etc. */}
        {sub && (subPct !== null) && (
          <div style={{ marginTop: 16, width: 360, margin: '16px auto 0' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 6 }} className="font-mono">
              <span style={{ fontSize: 10, color: 'var(--ink-tertiary)', letterSpacing: '0.06em', textTransform: 'uppercase' }}>
                {sub.label === 'cells'
                  ? t('loading.detail.cells', { current: sub.current, total: sub.total })
                  : `${sub.current} / ${sub.total}`}
              </span>
              {sub.detail && (
                <span style={{ fontSize: 10, color: 'var(--ink-tertiary)', letterSpacing: '0.06em', fontStyle: 'italic' }}>
                  {sub.detail}
                </span>
              )}
            </div>
            <div style={{
              width: '100%', height: 2, background: 'var(--border-soft)',
              borderRadius: 1, overflow: 'hidden',
            }}>
              <div style={{
                width: `${subPct}%`, height: '100%',
                background: 'var(--ink-tertiary)',
                transition: 'width 200ms',
              }} />
            </div>
          </div>
        )}

        {/* Uniqueness mode hint (after 2s) */}
        {safeProgress && safeProgress.elapsed > 2000 && (
          <div style={{ marginTop: 18, fontSize: 11, color: 'var(--ink-tertiary)', letterSpacing: '0.06em', textTransform: 'uppercase', fontStyle: 'italic' }} className="font-body">
            {relaxHint}
          </div>
        )}

        {/* Candidates found (Classic explore mode) */}
        {safeProgress && Number.isFinite(safeProgress.candidatesFound) && safeProgress.candidatesFound > 0 && (
          <div style={{ marginTop: 8, fontSize: 11, color: 'var(--ink-tertiary)', letterSpacing: '0.06em' }} className="font-mono">
            후보 {safeProgress.candidatesFound}개 검토됨
          </div>
        )}
      </div>
    </div>
  );
}

// AnimalPicker — 16-grid emoji picker for duel avatar
// V12.16: AnimalPicker — 16 animals × 2 genders = 32 selectable avatars.
// Gender toggle (♂/♀) sits above the 8×2 animal grid. Active gender tints
// each cell subtly (cool/warm) and shows a small ♂/♀ badge on the active animal.
function AnimalPicker({ selectedIdx, gender, onSelect, onGenderChange, disabled }) {
  const isMale = gender !== 'female';   // default male
  const tintBg = isMale ? 'rgba(56, 132, 200, 0.06)' : 'rgba(216, 110, 156, 0.06)';
  const tintAccent = isMale ? '#3884c8' : '#d86e9c';

  return (
    <div>
      {/* Gender toggle row */}
      <div role="radiogroup" aria-label="성별" style={{
        display: 'inline-flex',
        marginBottom: 8,
        border: '1px solid var(--border-medium)',
        borderRadius: 4,
        overflow: 'hidden',
      }}>
        {[
          { key: 'male',   label: '♂',  fullLabel: '수컷', tint: '#3884c8' },
          { key: 'female', label: '♀',  fullLabel: '암컷', tint: '#d86e9c' },
        ].map((opt, i) => {
          const active = (opt.key === 'male') ? isMale : !isMale;
          return (
            <button
              key={opt.key}
              type="button"
              role="radio"
              aria-checked={active}
              disabled={disabled}
              onClick={() => !disabled && onGenderChange && onGenderChange(opt.key)}
              title={opt.fullLabel}
              className="font-body"
              style={{
                padding: '6px 14px',
                border: 'none',
                borderLeft: i > 0 ? '1px solid var(--border-medium)' : 'none',
                background: active ? opt.tint : 'var(--bg-card)',
                color: active ? '#fff' : 'var(--ink-secondary)',
                cursor: disabled ? 'wait' : (active ? 'default' : 'pointer'),
                fontSize: 16,
                fontWeight: active ? 700 : 500,
                lineHeight: 1,
                minWidth: 42,
                display: 'inline-flex',
                alignItems: 'center',
                justifyContent: 'center',
                gap: 4,
                transition: 'background 140ms, color 140ms',
              }}
            >
              <span aria-hidden>{opt.label}</span>
              <span style={{ fontSize: 10, fontWeight: 500, letterSpacing: '0.04em' }}>{opt.fullLabel}</span>
            </button>
          );
        })}
      </div>

      {/* 16-animal grid (gender applied to all cells) */}
      <div style={{
        display: 'grid',
        gridTemplateColumns: 'repeat(8, minmax(0, 1fr))',
        gap: 4,
      }}>
        {ANIMALS.map((animal, idx) => {
          const active = idx === selectedIdx;
          return (
            <button
              key={animal.id}
              onClick={() => !disabled && onSelect(idx)}
              disabled={disabled}
              type="button"
              aria-pressed={active}
              title={`${animal.name} ${isMale ? '♂' : '♀'}`}
              style={{
                position: 'relative',
                aspectRatio: '1 / 1',
                minHeight: 36,
                border: '1.5px solid',
                borderColor: active ? tintAccent : 'var(--border-soft)',
                borderRadius: 6,
                background: active
                  ? (isMale ? 'rgba(56, 132, 200, 0.14)' : 'rgba(216, 110, 156, 0.14)')
                  : tintBg,
                cursor: disabled ? 'wait' : 'pointer',
                fontSize: 18,
                lineHeight: 1,
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'center',
                padding: 0,
                transition: 'background 140ms, border-color 140ms, transform 80ms',
                transform: active ? 'scale(1.05)' : 'scale(1)',
                boxShadow: active
                  ? `0 2px 8px ${isMale ? 'rgba(56, 132, 200, 0.30)' : 'rgba(216, 110, 156, 0.30)'}`
                  : 'none',
              }}
            >
              <span aria-hidden>{animal.emoji}</span>
              {active && (
                <span style={{
                  position: 'absolute',
                  bottom: -2,
                  right: -2,
                  width: 14, height: 14,
                  borderRadius: '50%',
                  background: tintAccent,
                  color: '#fff',
                  fontSize: 9,
                  fontWeight: 700,
                  display: 'flex',
                  alignItems: 'center',
                  justifyContent: 'center',
                  border: '1.5px solid var(--bg-paper)',
                  lineHeight: 1,
                }} aria-hidden>{isMale ? '♂' : '♀'}</span>
              )}
            </button>
          );
        })}
      </div>
    </div>
  );
}

// DuelLeaderboardTable — sorted ascending by time, highlights current user's row
function DuelLeaderboardTable({ entries, highlightIdx, compact }) {
  const t = useT();
  // Sort by time ascending (faster = better rank)
  const sorted = [...entries].map((e, originalIdx) => ({ ...e, _origIdx: originalIdx }))
    .sort((a, b) => {
      if (a.t !== b.t) return a.t - b.t;
      // Tie-break by hint count ascending
      return a.h - b.h;
    });

  return (
    <div style={{
      border: '1px solid var(--border-soft)',
      borderRadius: 6,
      overflow: 'hidden',
      width: '100%',
    }}>
      <table style={{
        width: '100%',
        borderCollapse: 'collapse',
        fontSize: compact ? 12 : 13,
      }} className="font-body">
        <thead>
          <tr style={{
            background: 'var(--bg-soft)',
            color: 'var(--ink-tertiary)',
            fontSize: 10,
            letterSpacing: '0.06em',
            textTransform: 'uppercase',
          }}>
            <th style={{ padding: '8px 6px', textAlign: 'center', width: 36 }}>{t('share.duel.col.rank')}</th>
            <th style={{ padding: '8px 6px', textAlign: 'left' }}>{t('share.duel.col.player')}</th>
            <th style={{ padding: '8px 6px', textAlign: 'right', width: 80 }}>{t('share.duel.col.time')}</th>
            <th style={{ padding: '8px 6px', textAlign: 'right', width: 56 }}>{t('share.duel.col.hints')}</th>
          </tr>
        </thead>
        <tbody>
          {sorted.map((e, rank) => {
            const isYou = e._origIdx === highlightIdx;
            const minutes = Math.floor(e.t / 60);
            const seconds = e.t % 60;
            const timeStr = `${minutes}:${seconds.toString().padStart(2, '0')}`;
            return (
              <tr key={`${rank}-${e._origIdx}`} style={{
                background: isYou ? 'rgba(180,83,9,0.08)' : 'var(--bg-paper)',
                borderTop: '1px solid var(--border-soft)',
              }}>
                <td style={{
                  padding: '8px 6px', textAlign: 'center',
                  fontWeight: rank === 0 ? 700 : 500,
                  color: rank === 0 ? 'var(--accent-gold)' :
                         rank === 1 ? 'var(--ink-secondary)' :
                         rank === 2 ? '#9b6b3f' : 'var(--ink-tertiary)',
                  fontSize: rank < 3 ? 14 : 12,
                }} className="font-mono">
                  {rank === 0 ? '🥇' : rank === 1 ? '🥈' : rank === 2 ? '🥉' : `${rank + 1}`}
                </td>
                <td style={{ padding: '8px 6px', textAlign: 'left' }}>
                  <span style={{ display: 'inline-flex', alignItems: 'center', gap: 8 }}>
                    <AvatarBadge animalIdx={e.a} gender={e.g === 1 ? 'female' : 'male'} size={22} />
                    <span style={{
                      color: isYou ? 'var(--accent-gold)' : 'var(--ink-primary)',
                      fontWeight: isYou ? 600 : 500,
                    }}>
                      {e.n || '—'}
                      {isYou && (
                        <span style={{
                          marginLeft: 5,
                          fontSize: 9,
                          color: 'var(--accent-gold)',
                          fontWeight: 600,
                          letterSpacing: '0.05em',
                          textTransform: 'uppercase',
                        }}>{t('share.duel.you')}</span>
                      )}
                    </span>
                  </span>
                </td>
                <td style={{
                  padding: '8px 6px', textAlign: 'right',
                  color: 'var(--ink-secondary)',
                }} className="font-mono">{timeStr}</td>
                <td style={{
                  padding: '8px 6px', textAlign: 'right',
                  color: e.h === 0 ? 'var(--accent-gold)' : 'var(--ink-secondary)',
                  fontWeight: e.h === 0 ? 600 : 500,
                }} className="font-mono">
                  {e.h === 0 ? '✓' : e.h}
                </td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

// PuzzleShareModal — main share dialog with mode selector
function PuzzleShareModal({
  open, onClose,
  puzzle, level,
  solveTimeMs, hintsUsed, wasRevealed,
  // For "challenge complete" flow, the existing duel leaderboard to extend
  existingDuelEntries,
}) {
  const t = useT();
  const cfg = puzzle ? (DIFFICULTY_CONFIGS[level] || DIFFICULTY_CONFIGS.Sprout) : null;

  // Mode: 'simple' or 'duel'
  // Default to 'duel' if there's an existing leaderboard (continuation), else 'simple'
  const [mode, setMode] = React.useState(() =>
    (existingDuelEntries && existingDuelEntries.length > 0) ? 'duel' : 'simple'
  );

  // Identity (persisted in localStorage) — V12.16: includes gender
  const [identity, setIdentity] = React.useState(() => {
    const stored = loadDuelIdentity();
    return stored || {
      name: '',
      animalIdx: pickRandomAnimalIdx(),
      gender: pickRandomGender(),  // V12.16
    };
  });
  const [includeMetricsInSimple, setIncludeMetricsInSimple] = React.useState(true);
  const [includeScreenshot, setIncludeScreenshot] = React.useState(false);
  const [generatingShare, setGeneratingShare] = React.useState(false);
  const [copied, setCopied] = React.useState(false);

  // V12.16: working leaderboard — starts as existingDuelEntries, mutated by merge
  const [workingDuelEntries, setWorkingDuelEntries] = React.useState(() => existingDuelEntries || null);

  // V12.16: merge UI state
  const [mergeOpen, setMergeOpen] = React.useState(false);
  const [mergeInput, setMergeInput] = React.useState('');
  const [mergeMessage, setMergeMessage] = React.useState(null);  // { ok: bool, text: string }

  // Reset state when modal opens
  React.useEffect(() => {
    if (open) {
      setMode((existingDuelEntries && existingDuelEntries.length > 0) ? 'duel' : 'simple');
      setCopied(false);
      setGeneratingShare(false);
      setMergeOpen(false);
      setMergeInput('');
      setMergeMessage(null);
      setWorkingDuelEntries(existingDuelEntries || null);
      const stored = loadDuelIdentity();
      if (stored) setIdentity(stored);
    }
  }, [open, existingDuelEntries]);

  if (!open || !puzzle) return null;

  const seed = puzzle.seed || encodePuzzleSeed(puzzle);
  if (!seed) {
    return (
      <div onClick={onClose} style={{
        position: 'fixed', inset: 0, background: 'rgba(28,25,23,0.55)',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        zIndex: 70, padding: 20,
      }}>
        <div onClick={e => e.stopPropagation()} style={{
          background: 'var(--bg-paper)', padding: 24, borderRadius: 6,
          maxWidth: 320, color: 'var(--ink-primary)',
        }}>
          시드를 생성할 수 없습니다.
        </div>
      </div>
    );
  }

  const solveSeconds = typeof solveTimeMs === 'number' && solveTimeMs > 0
    ? Math.round(solveTimeMs / 1000)
    : 0;

  // Build current user's entry (for duel preview) — V12.16: includes gender
  const myEntry = {
    n: (identity.name || '').trim() || (t('share.duel.you') + ''),
    a: identity.animalIdx,
    g: identity.gender === 'female' ? 1 : 0,
    t: solveSeconds,
    h: hintsUsed || 0,
  };

  // Combined entries for duel preview = working leaderboard (mergeable) + my record
  // V12.16: workingDuelEntries replaces direct existingDuelEntries — supports merge
  const baseEntries = workingDuelEntries || [];
  const duelPreviewEntries = baseEntries.length > 0
    ? [...baseEntries, myEntry]
    : [myEntry];
  const myEntryIdx = duelPreviewEntries.length - 1;

  // Build share URL based on mode
  const buildUrl = () => {
    if (mode === 'duel') {
      // Save identity (with gender) and add my record to leaderboard
      const trimmedName = (identity.name || '').trim();
      if (trimmedName) saveDuelIdentity(trimmedName, identity.animalIdx, identity.gender);
      const finalEntries = duelPreviewEntries.map(e => ({
        n: e.n,
        a: e.a,
        g: e.g === 1 ? 1 : 0,
        t: e.t,
        h: e.h,
      }));
      return buildShareUrl(seed, { entries: finalEntries });
    } else {
      // Simple mode — seed only
      return buildShareUrl(seed, null);
    }
  };

  // V12.16: Merge handler — paste another duel link, validate, deduplicate
  const handleMergeConfirm = () => {
    setMergeMessage(null);
    const parsed = parseDuelInput(mergeInput);
    if (!parsed || !parsed.duel || !Array.isArray(parsed.duel.entries)) {
      setMergeMessage({ ok: false, text: t('share.duel.merge.error.invalid') });
      return;
    }
    // Verify seed match (if URL had a seed). Raw base64 input has seed=null
    // and is therefore accepted on trust (user explicitly pasted a leaderboard
    // for the current puzzle).
    if (parsed.seed && parsed.seed !== seed) {
      setMergeMessage({ ok: false, text: t('share.duel.merge.error.seedMismatch') });
      return;
    }

    const before = baseEntries.length;
    const merged = mergeDuelEntries(baseEntries, parsed.duel.entries);
    const incoming = parsed.duel.entries.length;
    const added = merged.length - before;
    const dupes = incoming - added;
    setWorkingDuelEntries(merged);
    setMergeMessage({
      ok: true,
      text: t('share.duel.merge.success', { added, total: merged.length, dupes: Math.max(0, dupes) }),
    });
    // Clear the input but keep the dropdown open so user sees the result
    setMergeInput('');
  };

  // Compose share text
  const buildText = () => {
    const time = solveSeconds > 0
      ? `${Math.floor(solveSeconds / 60)}:${(solveSeconds % 60).toString().padStart(2, '0')}`
      : '—';
    const glyph = cfg?.glyph || '';
    const label = t(`diff.${level}.label`) || level;
    if (mode === 'duel') {
      return t('share.duel.shareText', { glyph, label, time, hints: myEntry.h });
    } else {
      return t('share.simple.shareText', {
        glyph, label,
        time: includeMetricsInSimple ? time : '—',
        hints: includeMetricsInSimple && solveSeconds > 0 ? myEntry.h : null,
      });
    }
  };

  const handleShare = async () => {
    const url = buildUrl();
    if (!url) return;
    const text = buildText();
    const fullPayload = `${text}\n${url}`;

    setGeneratingShare(true);
    try {
      // V12.15: Generate puzzle screenshot if requested (simple mode only)
      let imageFile = null;
      if (mode === 'simple' && includeScreenshot && puzzle) {
        try {
          const blob = await renderPuzzleScreenshot(puzzle);
          if (blob) {
            imageFile = new File([blob], `zoograms-${(puzzle.level || 'puzzle').toLowerCase()}.png`, {
              type: 'image/png',
            });
          }
        } catch (e) {
          // screenshot failed — fall through with text only
        }
      }

      // Try Web Share API (with files if screenshot is ready)
      const shareData = { text: fullPayload, url };
      if (imageFile && navigator.canShare && navigator.canShare({ files: [imageFile] })) {
        shareData.files = [imageFile];
      }

      if (navigator.share) {
        try {
          await navigator.share(shareData);
          setGeneratingShare(false);
          return;
        } catch (shareErr) {
          // User canceled — abort silently. Other errors fall through to clipboard.
          if (shareErr && shareErr.name === 'AbortError') {
            setGeneratingShare(false);
            return;
          }
          // fall through to clipboard
        }
      }

      // Fallback — copy text to clipboard
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(fullPayload);
      } else {
        const ta = document.createElement('textarea');
        ta.value = fullPayload;
        ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select(); document.execCommand('copy');
        document.body.removeChild(ta);
      }
      setCopied(true);
      setTimeout(() => setCopied(false), 2200);
    } catch (e) {
      // unknown error — silent
    } finally {
      setGeneratingShare(false);
    }
  };

  const handleCopyLink = async () => {
    const url = buildUrl();
    if (!url) return;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(url);
      } else {
        const ta = document.createElement('textarea');
        ta.value = url;
        ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select(); document.execCommand('copy');
        document.body.removeChild(ta);

  const ModeRadio = ({ value, label, desc }) => {

          background: active ? 'var(--accent-gold)' : 'transparent',

          alignItems: 'center',

              background: 'var(--bg-paper)',

        </div>
        <div style={{ flex: 1, minWidth: 0 }}>

          <div style={{

        </div>
      </button>

  return (
    <div onClick={onClose} style={{

      display: 'flex', alignItems: 'center', justifyContent: 'center',

    }}>
      <div onClick={e => e.stopPropagation()} style={{

        border: '1px solid var(--border-medium)',

        {/* Header */}
        <div style={{

          padding: '18px 22px',
          borderBottom: '1px solid var(--border-soft)',
        }}>
          <h2 className="font-display" style={{
            margin: 0,
            fontSize: 20, fontWeight: 500,
            letterSpacing: '-0.01em',
            color: 'var(--ink-primary)',
          }}>
            ↗ {t('share.modal.title')}
          </h2>
          <button onClick={onClose} aria-label="close" style={{

        {/* Body */}
        <div style={{ padding: '18px 22px' }}>

          {cfg && (

              {solveSeconds > 0 && !wasRevealed && (

          {/* Mode selector */}
          <div role="radiogroup" aria-label="공유 방식" style={{

              {/* Animal picker (V12.16: with gender toggle = 32 options) */}

              <div>

                <DuelLeaderboardTable

              {/* V12.16: Merge leaderboard — small bottom utility */}
              <div style={{
                marginTop: 14,

                      display: 'inline-flex', alignItems: 'center', gap: 5,

                      fontSize: 11, fontWeight: 600,
                      color: 'var(--ink-secondary)',
                      marginBottom: 8,
                      letterSpacing: '0.04em',

                      {t('share.duel.merge.title')}
                    </div>
                    <input
                      type="text"
                      value={mergeInput}
                      onChange={(e) => { setMergeInput(e.target.value); setMergeMessage(null); }}
                      placeholder={t('share.duel.merge.placeholder')}
                      className="font-body"
                      style={{
                        width: '100%',
                        padding: '8px 10px',
                        border: '1px solid var(--border-medium)',
                        borderRadius: 4,
                        fontSize: 12,
                        background: 'var(--bg-paper)',
                        color: 'var(--ink-primary)',
                        boxSizing: 'border-box',

                      }}
                    />
                    {mergeMessage && (
                      <div className="font-body" style={{
                        fontSize: 11,
                        color: mergeMessage.ok ? '#1e7d3a' : '#b91c1c',
                        marginBottom: 8,
                        padding: '6px 8px',

                        borderRadius: 4,
                        lineHeight: 1.4,
                      }}>
                        {mergeMessage.ok ? '✓ ' : '⚠ '}
                        {mergeMessage.text}
                      </div>
                    )}
                    <div style={{ display: 'flex', gap: 6, justifyContent: 'flex-end' }}>
                      <button
                        type="button"
                        onClick={() => { setMergeOpen(false); setMergeInput(''); setMergeMessage(null); }}
                        className="font-body"
                        style={{
                          padding: '6px 12px',
                          background: 'transparent',
                          color: 'var(--ink-tertiary)',
                          border: '1px solid var(--border-medium)',
                          borderRadius: 4,
                          cursor: 'pointer',
                          fontSize: 11,
                        }}
                      >
                        {t('share.duel.merge.cancel')}
                      </button>
                      <button
                        type="button"
                        onClick={handleMergeConfirm}
                        disabled={!mergeInput.trim()}
                        className="font-body"
                        style={{
                          padding: '6px 12px',
                          background: mergeInput.trim() ? 'var(--ink-primary)' : 'var(--ink-tertiary)',
                          color: 'var(--bg-paper)',
                          border: 'none',
                          borderRadius: 4,
                          cursor: mergeInput.trim() ? 'pointer' : 'not-allowed',
                          fontSize: 11,
                          fontWeight: 600,
                          opacity: mergeInput.trim() ? 1 : 0.6,

                      >
                        {t('share.duel.merge.confirm')}
                      </button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>

        {/* Footer — action buttons */}
        <div style={{
          display: 'flex',
          gap: 8,
          justifyContent: 'flex-end',
          padding: '14px 22px 18px',
          borderTop: '1px solid var(--border-soft)',
          flexWrap: 'wrap',
        }}>
          <button onClick={onClose} className="font-body" style={{
            padding: '10px 16px',
            background: 'transparent',
            color: 'var(--ink-secondary)',
            border: '1px solid var(--border-medium)',
            borderRadius: 4,
            cursor: 'pointer',
            fontSize: 13,
          }}>
            {t('share.cancel')}
          </button>
          <button onClick={handleCopyLink} className="font-body" style={{
            padding: '10px 16px',
            background: copied ? 'var(--accent-gold)' : 'var(--bg-card)',
            color: copied ? 'var(--bg-paper)' : 'var(--ink-primary)',
            border: '1px solid',
            borderColor: copied ? 'var(--accent-gold)' : 'var(--border-medium)',
            borderRadius: 4,
            cursor: 'pointer',
            fontSize: 13, fontWeight: 500,
            display: 'inline-flex', alignItems: 'center', gap: 5,
            transition: 'background 200ms, color 200ms',
          }}>
            <span aria-hidden>{copied ? '✓' : '🔗'}</span>
            <span>{copied ? t('share.copied') : t('share.copy')}</span>
          </button>
          <button
            onClick={handleShare}
            disabled={generatingShare}
            className="font-body"
            style={{
              padding: '10px 20px',
              background: generatingShare ? 'var(--ink-tertiary)' : 'var(--ink-primary)',
              color: 'var(--bg-paper)',
              border: 'none',
              borderRadius: 4,
              cursor: generatingShare ? 'wait' : 'pointer',
              fontSize: 13, fontWeight: 600,
              display: 'inline-flex', alignItems: 'center', gap: 6,
              transition: 'background 200ms',
              opacity: generatingShare ? 0.7 : 1,
            }}
          >
            <span aria-hidden>{generatingShare ? '⋯' : '↗'}</span>
            <span>{generatingShare ? '준비 중…' : t('share.button')}</span>
          </button>
        </div>
      </div>
    </div>
  );
}

function WinDialog({ show, level, uniqueness, solutionCount, solveTimeMs, playLog, onNext, onClose, puzzle, duelEntries }) {
  if (!show) return null;
  const t = useT();
  const cfg = DIFFICULTY_CONFIGS[level] || DIFFICULTY_CONFIGS.Sprout;
  const [showPlayLog, setShowPlayLog] = React.useState(false);
  const [shareCopied, setShareCopied] = React.useState(false);
  // V12.15: Puzzle share modal (separate from text-share)
  const [showPuzzleShare, setShowPuzzleShare] = React.useState(false);

  // V12.14: detect whether the user revealed the solution vs solved it themselves
  // — playLog 'solution-revealed' entry indicates reveal action used
  const wasRevealed = React.useMemo(() => {
    if (!Array.isArray(playLog)) return false;
    return playLog.some(e => e && e.action === 'solution-revealed');
  }, [playLog]);

  // V12.14: count hints used during the play (HINT_USE actions)
  const hintsUsed = React.useMemo(() => {
    if (!Array.isArray(playLog)) return 0;
    return playLog.filter(e => e && e.action === 'hint-use').length;
  }, [playLog]);

  // V12.14: differentiated headline/subtitle/tagline by reveal vs solve
  const headline1 = wasRevealed ? t('win.revealedHeadline1') : t('win.headline1');
  const headline2 = wasRevealed ? t('win.revealedHeadline2') : t('win.headline2');
  const subtitle = wasRevealed
    ? t('win.revealedSubtitle', { glyph: cfg?.glyph, label: t(`diff.${level}.label`) })
    : t('win.subtitle', { glyph: cfg?.glyph, label: t(`diff.${level}.label`) });
  const tagline = wasRevealed ? t('win.revealedTagline') : t('win.solvedTagline');

  // V12.14: share handler — uses Web Share API if available, falls back to clipboard
  const handleShare = async () => {
    const time = typeof solveTimeMs === 'number' && solveTimeMs > 0
      ? formatTimerMs(solveTimeMs)
      : '—';
    const text = wasRevealed
      ? t('win.share.text.revealed', { glyph: cfg?.glyph, label: t(`diff.${level}.label`) })
      : t('win.share.text.solved', {
          glyph: cfg?.glyph,
          label: t(`diff.${level}.label`),
          time,
          hints: hintsUsed > 0 ? hintsUsed : null,
        });
    try {
      if (navigator.share) {
        await navigator.share({ text });
      } else if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
        setShareCopied(true);
        setTimeout(() => setShareCopied(false), 2000);
      } else {
        // Fallback for very old browsers
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select(); document.execCommand('copy');
        document.body.removeChild(ta);
        setShareCopied(true);
        setTimeout(() => setShareCopied(false), 2000);
      }
    } catch (e) {
      // User canceled or share failed — silent
    }
  };

  return (
    <div onClick={onClose} style={{
      position: 'fixed', inset: 0, background: 'rgba(28,25,23,0.45)',
      display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 60, padding: 24, animation: 'fadeInUp 320ms',
    }}>
      <div onClick={e => e.stopPropagation()} style={{
        maxWidth: 440, width: '100%', background: 'var(--bg-paper)', padding: 40,
        border: '1px solid var(--border-medium)', borderRadius: 3, textAlign: 'center',
        boxShadow: '0 24px 60px -20px rgba(0,0,0,0.3)',
      }}>
        <div className="font-body" style={{
          fontSize: 11,
          color: wasRevealed ? 'var(--ink-tertiary)' : 'var(--accent-gold)',
          letterSpacing: '0.2em', textTransform: 'uppercase', marginBottom: 14,
        }}>
          {tagline}
        </div>
        <div className="font-display" style={{ fontSize: 40, fontWeight: 500, letterSpacing: '-0.02em', color: 'var(--ink-primary)', lineHeight: 1.1 }}>
          {headline1}<br /><span style={{
            fontStyle: 'italic',
            color: wasRevealed ? 'var(--ink-secondary)' : 'var(--accent-gold)',
          }}>{headline2}</span>
        </div>
        <div className="font-body" style={{ marginTop: 18, color: 'var(--ink-secondary)', fontSize: 14, lineHeight: 1.6 }}>
          {subtitle}
        </div>
        {/* Solve time + hints used metric strip — only shown when timer was running */}
        {typeof solveTimeMs === 'number' && solveTimeMs > 0 && (
          <div style={{
            marginTop: 22, display: 'flex',
            flexWrap: 'wrap', justifyContent: 'center', gap: 10,
          }}>
            <div style={{
              padding: '12px 20px',
              background: 'var(--bg-card)',
              border: '1px solid var(--border-soft)',
              borderRadius: 4,
              display: 'inline-flex', alignItems: 'center', gap: 10,
            }}>
              <span className="font-body" style={{
                fontSize: 11, color: 'var(--ink-tertiary)',
                letterSpacing: '0.08em', textTransform: 'uppercase',
              }}>{t('win.solveTime')}</span>
              <span className="font-mono" style={{
                fontSize: 22,
                color: wasRevealed ? 'var(--ink-secondary)' : 'var(--accent-gold)',
                fontWeight: 500, letterSpacing: '0.02em',
              }}>{formatTimerMs(solveTimeMs)}</span>
            </div>
            {/* V12.14: hint usage chip — always shown (even 0) when not revealed */}

              <div style={{
                padding: '12px 20px',
                background: 'var(--bg-card)',
                border: '1px solid var(--border-soft)',
                borderRadius: 4,
                display: 'inline-flex', alignItems: 'center', gap: 10,
              }}>
                <span className="font-body" style={{
                  fontSize: 11, color: 'var(--ink-tertiary)',
                  letterSpacing: '0.08em', textTransform: 'uppercase',
                }}>{hintsUsed > 0 ? t('win.hintsUsed') : t('win.hintsZero')}</span>
                <span className="font-mono" style={{
                  fontSize: 22,
                  color: hintsUsed === 0 ? 'var(--accent-gold)' : 'var(--ink-secondary)',
                  fontWeight: 500, letterSpacing: '0.02em',
                }}>
                  {hintsUsed === 0 ? '✓' : `${hintsUsed}`}
                </span>
              </div>
            )}
          </div>
        )}
        {uniqueness === 'loose' && (
          <div className="font-body" style={{ marginTop: 10, color: 'var(--ink-tertiary)', fontSize: 12, fontStyle: 'italic' }}>
            {t('win.desc.loose', { n: solutionCount })}
          </div>
        )}
        {uniqueness === 'flexible' && (
          <div className="font-body" style={{ marginTop: 10, color: 'var(--ink-tertiary)', fontSize: 12, fontStyle: 'italic' }}>
            {t('win.desc.flex')}
          </div>
        )}
        {/* V12.15: Duel leaderboard — shown when arrived via duel link AND solved */}
        {duelEntries && duelEntries.length > 0 && !wasRevealed && (
          <div style={{
            marginTop: 22,
            padding: '14px 16px',
            background: 'var(--bg-soft)',
            borderRadius: 6,
            textAlign: 'left',
          }}>
            <div className="font-body" style={{
              fontSize: 11,
              fontWeight: 600,
              letterSpacing: '0.08em',
              textTransform: 'uppercase',
              color: 'var(--accent-gold)',
              marginBottom: 8,
              textAlign: 'center',
            }}>
              🎯 {t('share.duel.tableTitle')}
            </div>
            <DuelLeaderboardTable
              entries={(() => {
                // Build merged entries: existing leaderboard + my just-completed record
                // V12.16: identity now includes gender
                const stored = loadDuelIdentity() || { name: '', animalIdx: 0, gender: 'male' };
                const myEntry = {
                  n: (stored.name || '').trim() || (t('share.duel.you') + ''),
                  a: stored.animalIdx,
                  g: stored.gender === 'female' ? 1 : 0,
                  t: typeof solveTimeMs === 'number' ? Math.round(solveTimeMs / 1000) : 0,
                  h: hintsUsed,
                };
                return [...duelEntries, myEntry];
              })()}
              highlightIdx={duelEntries.length}
              compact
            />
          </div>
        )}

        {/* Event-based ad — only mounted when WinDialog is shown, so a
            fresh ad request fires on each puzzle completion. Visually
            separated from celebration text by a subtle divider above. */}
        <div style={{
          marginTop: 24,
          paddingTop: 20,
          borderTop: '1px solid var(--border-soft)',
        }}>
          <AdSlot slot="win-dialog" />
        </div>
        <div style={{ display: 'flex', gap: 10, justifyContent: 'center', marginTop: 28, flexWrap: 'wrap' }}>
          <button onClick={onNext} className="font-body" style={{
            padding: '12px 22px', background: 'var(--ink-primary)', color: 'var(--bg-paper)',
            border: 'none', borderRadius: 2, cursor: 'pointer', fontSize: 13, fontWeight: 500, letterSpacing: '0.02em',
          }}>{t('win.next')}</button>
          {/* V12.14: Text share button (clipboard text) */}
          <button onClick={handleShare} className="font-body" style={{
            padding: '12px 22px',
            background: shareCopied ? 'var(--accent-gold)' : 'var(--bg-card)',
            color: shareCopied ? 'var(--bg-paper)' : 'var(--ink-primary)',
            border: '1px solid', borderColor: shareCopied ? 'var(--accent-gold)' : 'var(--ink-primary)',
            borderRadius: 2, cursor: 'pointer', fontSize: 13, fontWeight: 500,
            display: 'inline-flex', alignItems: 'center', gap: 6,
            transition: 'background 200ms, color 200ms',
          }}>
            <span aria-hidden>{shareCopied ? '✓' : '↗'}</span>
            <span>{shareCopied ? t('win.share.copied') : t('win.share')}</span>
          </button>
          {/* V12.15: Puzzle share button — opens advanced share modal with seed-link generation */}
          {puzzle && (
            <button onClick={() => setShowPuzzleShare(true)} className="font-body" style={{
              padding: '12px 22px',
              background: 'var(--bg-card)',
              color: 'var(--accent-gold)',
              border: '1px solid var(--accent-gold)',
              borderRadius: 2, cursor: 'pointer', fontSize: 13, fontWeight: 600,
              display: 'inline-flex', alignItems: 'center', gap: 6,
            }}>
              <span aria-hidden>🔗</span>
              <span>{t('win.sharePuzzle')}</span>
            </button>
          )}
          {/* V9 SOTA — Play log button (실제 플레이 timeline 출력) */}
          {playLog && playLog.length > 0 && (
            <button onClick={() => setShowPlayLog(true)} className="font-body" style={{
              padding: '12px 22px', background: 'var(--accent-gold)', color: 'var(--bg-paper)',
              border: 'none', borderRadius: 2, cursor: 'pointer', fontSize: 13, fontWeight: 500, letterSpacing: '0.02em',
            }}>{t('win.playLog')}</button>
          )}
          <button onClick={onClose} className="font-body" style={{
            padding: '12px 22px', background: 'transparent', color: 'var(--ink-secondary)',
            border: '1px solid var(--border-medium)', borderRadius: 2, cursor: 'pointer', fontSize: 13,

        </div>
      </div>
      {showPlayLog && playLog && (
        <PlayLogModal

      <PuzzleShareModal
        open={showPuzzleShare}
        onClose={() => setShowPuzzleShare(false)}
        puzzle={puzzle}
        level={level}
