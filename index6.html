  :root {
    --bg-paper: #FAF7F0;
    --bg-card: #FFFFFF;
    --bg-subtle: #F5F2EA;
    --bg-fixed: #EEE9DC;       /* pre-mark tile background — neutral, not gold */
    --ink-primary: #1C1917;
    --ink-secondary: #44403C;
    --ink-tertiary: #78716C;
    --border-soft: #E7E5E4;
    --border-medium: #D6D3D1;
    --accent-gold: #B45309;    /* reserved: constraints (badges, Q, selection) */
    --accent-gold-soft: #D97706;
    --success-soft: #FEF3C7;
    --forbidden: #E7E5E4;
    --danger: #B91C1C;
    --gender-male: #1E3A8A;    /* reserved: ♂ only */
    --gender-female: #9D174D;  /* reserved: ♀ only */
    --ok-strict: #B45309;
    --ok-loose: #92400E;
    --ok-flexible: #78716C;
    --lang-font: 'Pretendard', 'Pretendard Variable', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body, #root { margin: 0; padding: 0; background: var(--bg-paper); color: var(--ink-primary); }
  body {
    font-family: var(--lang-font);
    -webkit-font-smoothing: antialiased;
    /* Suppress mobile system gestures that interfere with the puzzle UX:
       - iOS long-press callout (image save / share menu)
       - iOS magnifier on long-press
       - blue tap highlight rectangle
       - long-press text selection bubble
       The game has its own long-press semantics for tile attribute popovers,
       and accidental triggering of system menus over tile images breaks flow. */
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* Re-enable text selection inside elements where reading/copying matters
     (tooltips, help modal body, dialogs). Add `data-selectable="1"` to opt-in. */
  [data-selectable="1"], [data-selectable="1"] * {
    -webkit-user-select: text;
    -moz-user-select: text;
    user-select: text;
    -webkit-touch-callout: default;
  }
  /* Images everywhere: disable native HTML5 drag and iOS preview/save menu.
     The puzzle moves tiles via its own pointer-drag system; native drag would
     fight it. */
  img {
    -webkit-user-drag: none;
    -webkit-touch-callout: none;
    user-select: none;
    pointer-events: none;  /* let parent tile own pointer events */
  }
  .font-display { font-family: 'Fraunces', Georgia, serif; }
  .font-body { font-family: var(--lang-font); }
  .font-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  button { font-family: inherit; }
  button:focus-visible { outline: 2px solid var(--accent-gold); outline-offset: 2px; }

  @keyframes cellResolve {
    0% { transform: scale(0.88); opacity: 0.6; }
    60% { transform: scale(1.06); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes partnerPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(180, 83, 9, 0); }
    50% { box-shadow: 0 0 0 6px rgba(180, 83, 9, 0.2); }
  }
  @keyframes celebrationWave {
    0% { transform: scale(1); filter: brightness(1); }
    50% { transform: scale(1.08); filter: brightness(1.15) saturate(1.1); }
    100% { transform: scale(1); filter: brightness(1); }
  }
  @keyframes fadeInUp {
    0% { transform: translateY(8px); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
  }
  @keyframes progressShimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  @keyframes softPulseRing {
    0%, 100% { box-shadow: 0 0 0 0 rgba(180,83,9,0); }
    50%      { box-shadow: 0 0 0 4px rgba(180,83,9,0.18); }
  }
  @keyframes tooltipIn {
    0%   { opacity: 0; transform: translateY(-4px) scale(0.96); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes badgeTipFade {
    0%   { opacity: 0; }
    100% { opacity: 1; }
  }
  /* Popover bubble for hint button — small bounce-in */
  @keyframes hintPopover {
    0%   { opacity: 0; transform: translateX(-50%) translateY(8px) scale(0.85); }
    100% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
  }
  /* Wrong-tile spotlight — strong pulsing red. The animation cycles
     between full red flash and a slightly desaturated state, drawing the
     user's eye while still readable. Continues until cleared. */
  @keyframes hintPulseRed {
    0%, 100% {
      box-shadow:
        inset 0 0 0 3px #DC2626,
        0 0 0 4px rgba(220, 38, 38, 0.55),
        0 0 14px 4px rgba(220, 38, 38, 0.45);
      filter: brightness(1.05);
    }
    50% {
      box-shadow:
        inset 0 0 0 3px #B91C1C,
        0 0 0 8px rgba(220, 38, 38, 0.20),
        0 0 22px 8px rgba(220, 38, 38, 0.65);
      filter: brightness(1.18);
    }
  }
  /* Container-level overlay variant for cells that may not accept inset.
     Applied to a positioned wrapper of the wrong tile. */
  @keyframes hintPulseRedRing {
    0%, 100% {
      background: rgba(220, 38, 38, 0.25);
      border-color: #DC2626;
    }
    50% {
      background: rgba(220, 38, 38, 0.55);
      border-color: #B91C1C;
    }
  }

  /* Accessibility: respect reduced-motion preference */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }

  /* Stronger keyboard focus indication */
  [role="button"]:focus-visible,
  button:focus-visible {
    outline: 2px solid var(--accent-gold);
    outline-offset: 2px;
    border-radius: 4px;
  }

  /* V12.17: 사용자 요청 — 모바일에서 그리드 사이즈(n×n) 표시 유지
     (이전 V12.14에서 480px 이하 숨김 규칙은 제거됨) */

// ─────────────────────────────────────────────────────────────────
// Context + hooks
// ─────────────────────────────────────────────────────────────────
const LangContext = createContext({ lang: 'ko', setLang: () => {}, t: (k) => k });

function LangProvider({ children, initialLang = 'ko', onChange }) {
  const [lang, setLangState] = useState(initialLang);

  const setLang = useCallback((next) => {
    if (!LANGS.find(l => l.code === next)) return;
    setLangState(next);
    try { localStorage.setItem('zoograms.lang', next); } catch (e) {}
    if (onChange) onChange(next);
  }, [onChange]);

  // Sync <html lang>, font stack + --lang-font CSS variable on change.
  useEffect(() => {
    const meta = LANGS.find(l => l.code === lang) || LANGS[0];
    document.documentElement.setAttribute('lang', meta.htmlLang);
    document.documentElement.style.setProperty('--lang-font', FONT_STACK[lang]);
    document.body.style.fontFamily = FONT_STACK[lang];
  }, [lang]);

  const t = useCallback((key, args) => {
    const entry = STRINGS[key];
    if (!entry) return key;
    const val = entry[lang] || entry.ko || key;
    if (typeof val === 'function') return val(args || {});
    return val;
  }, [lang]);

  const ctxValue = useMemo(() => ({ lang, setLang, t }), [lang, setLang, t]);
  return <LangContext.Provider value={ctxValue}>{children}</LangContext.Provider>;
}

function useLang() { return useContext(LangContext); }
function useT() { return useContext(LangContext).t; }

// Translate a habitat/diet/gender raw value (the Korean keys used in ANIMALS)
// into the current language. Returns the raw value unchanged if not found.
function translateValue(raw, t) {
  const map = {
    '사바나': 'habitat.savanna', '극지': 'habitat.arctic', '해양': 'habitat.ocean', '숲': 'habitat.forest',
    '육식':  'diet.carnivore',   '초식': 'diet.herbivore',
    'male':  'gender.male',      'female': 'gender.female',
  };
  return map[raw] ? t(map[raw]) : raw;
}

// ─────────────────────────────────────────────────────────────────
// Language switcher component — header dropdown
// ─────────────────────────────────────────────────────────────────
function LangSwitcher({ compact = false }) {
  const { lang, setLang, t } = useLang();
  const [open, setOpen] = useState(false);
  const wrapRef = useRef(null);

  useEffect(() => {
    if (!open) return;
    const onDown = (e) => { if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false); };
    const onKey = (e) => { if (e.key === 'Escape') setOpen(false); };
    window.addEventListener('pointerdown', onDown);
    window.addEventListener('keydown', onKey);
    return () => {
      window.removeEventListener('pointerdown', onDown);
      window.removeEventListener('keydown', onKey);
    };
  }, [open]);

}

// Helper: 단일 level config 가져오기 (현재 mode 반영)

  return configs[level] || configs.Custom;
}

// LEGACY_CONFIGS captured before DIFFICULTY_CONFIGS gets reassigned to the Proxy
const DIFFICULTY_CONFIGS_LEGACY = (function captureLegacy() {
  // Snapshot of original 5-tier configs (Sprout/Easy/Medium/MediumPlus/Hard/Custom)
  return {
    Sprout: DIFFICULTY_CONFIGS.Sprout,
    Easy: DIFFICULTY_CONFIGS.Easy,
    Medium: DIFFICULTY_CONFIGS.Medium,

})();

// ─────────────────────────────────────────────────────────────────────────────
// DIFFICULTY_CONFIGS Proxy — V6 모드와 legacy 모드 동적 라우팅
// ─────────────────────────────────────────────────────────────────────────────
// 기존 코드는 DIFFICULTY_CONFIGS[level] 으로 직접 참조. 이를 변경 없이
// V6 7-tier로 전환하기 위해 Proxy로 wrapping.
// USE_DIFFICULTY_V6 = true 일 때 Sprout4/Easy5/Medium6/... 키로 routing.
//
// CRITICAL: set/deleteProperty trap 필수.
// generatePuzzleAsync (9775줄)에서 DIFFICULTY_CONFIGS.Custom = ... 라고 set 함.
// Proxy의 default set behavior는 빈 target에 set → 다음 get에서 underlying source가
// 우선되어 사용자 customConfig가 무시됨. 또는 strict mode에서 throw.
// 따라서 set/deleteProperty를 underlying source에 routing해야 함.
DIFFICULTY_CONFIGS = new Proxy({}, {
  get(target, prop) {
    const source = USE_DIFFICULTY_V6 ? DIFFICULTY_CONFIGS_V6 : DIFFICULTY_CONFIGS_LEGACY;
    if (prop in source) return source[prop];
    // Backward compat: legacy key 요청을 V6 tier로 매핑
    if (USE_DIFFICULTY_V6) {
      // V12.13: Legacy 5-tier → V6 8-tier mapping
      // MediumPlus → Hard6 (was MediumPlus6, now consolidated into Hard6 difficulty band)
      const legacyToV6 = {
        Sprout: 'Sprout4',
        Easy: 'Easy5',
        Medium: 'Medium6',
        MediumPlus: 'Hard6',     // V12.13: MediumPlus6 폐기 → Hard6로 통합
        Hard: 'Hard7',
      };
      const v6Key = legacyToV6[prop];
      if (v6Key && DIFFICULTY_CONFIGS_V6[v6Key]) return DIFFICULTY_CONFIGS_V6[v6Key];
    } else {
      // V12.13: V6 8-tier → Legacy 5-tier mapping
      const v6ToLegacy = {
        Sprout4: 'Sprout',
        Easy5: 'Easy',
        Medium6: 'Medium',
        Hard6: 'MediumPlus',     // 6×6 깊은 추론 → MediumPlus
        Medium7: 'Hard',
        Hard7: 'Hard',
        Medium8: 'Hard',
        Hard8: 'Hard',
      };
      const legacyKey = v6ToLegacy[prop];
      if (legacyKey && DIFFICULTY_CONFIGS_LEGACY[legacyKey]) return DIFFICULTY_CONFIGS_LEGACY[legacyKey];
    }
    return undefined;
  },
  set(target, prop, value) {
    // CRITICAL: Custom config 할당이 underlying source에 propagate되어야 함.
    // DIFFICULTY_CONFIGS.Custom = buildCustomConfig(...) 이 호출되면 V6/legacy 양쪽 모두에
    // 적용해서 어느 mode이든 일관되게 보이도록 함.
    DIFFICULTY_CONFIGS_V6[prop] = value;
    DIFFICULTY_CONFIGS_LEGACY[prop] = value;
    return true;
  },
  deleteProperty(target, prop) {
    delete DIFFICULTY_CONFIGS_V6[prop];
    delete DIFFICULTY_CONFIGS_LEGACY[prop];
    return true;
  },
  has(target, prop) {
    const source = USE_DIFFICULTY_V6 ? DIFFICULTY_CONFIGS_V6 : DIFFICULTY_CONFIGS_LEGACY;
    return prop in source;
  },
  ownKeys() {
    const source = USE_DIFFICULTY_V6 ? DIFFICULTY_CONFIGS_V6 : DIFFICULTY_CONFIGS_LEGACY;
    return Reflect.ownKeys(source);
  },
  getOwnPropertyDescriptor(target, prop) {
    const source = USE_DIFFICULTY_V6 ? DIFFICULTY_CONFIGS_V6 : DIFFICULTY_CONFIGS_LEGACY;
    return Reflect.getOwnPropertyDescriptor(source, prop);
  },
});

// Build the default custom config from the spec
function buildDefaultCustomConfig() {
  const cfg = {};
  for (const p of CUSTOM_PARAM_SPEC) {
    cfg[p.key] = p.default;
  }
  return cfg;
}

// Build a customConfig draft that mirrors the actual code-level settings of
// a given difficulty preset (Sprout/Easy/Medium/MediumPlus/Hard). This is
// used as the initial value when the custom modal opens, so the starting
// state reflects whatever difficulty the user was just playing — letting
// them tweak from a known-good baseline rather than from generic defaults.
//
// Note on engine independence: DIFFICULTY_CONFIGS values are shared across
// engine variants (classic / cdg-v4-loose / cdg-v4-strict / cdg-v5-strict).
// The engine-specific behavior lives in the generator dispatch, not in
// the per-level shape, so this function is engine-agnostic by design.
function buildCustomConfigFromLevel(level) {
  const lvCfg = DIFFICULTY_CONFIGS[level];
  if (!lvCfg) return buildDefaultCustomConfig();
  const cfg = {};
  for (const p of CUSTOM_PARAM_SPEC) {
    const v = lvCfg[p.key];
    if (v === undefined || v === null) {
      cfg[p.key] = p.default;
      continue;
    }
    if (p.key === 'ruleDimensions') {
      // DIFFICULTY_CONFIGS stores as array; CUSTOM_PARAM_SPEC enum stores as csv string
      if (Array.isArray(v)) {
        // Find the matching enum option key by sorting both sides
        const csvSorted = [...v].sort().join(',');
        const matched = (p.options || []).find(([key]) => {
          const keySorted = key.split(',').sort().join(',');
          return keySorted === csvSorted;
        });
        cfg[p.key] = matched ? matched[0] : v.join(',');
      } else {
        cfg[p.key] = v;
      }
    } else if (p.type === 'pair') {
      // Some levels store scalar (e.g., forbiddenCount: 0); convert to pair
      if (typeof v === 'number') cfg[p.key] = [v, v];
      else if (Array.isArray(v) && v.length === 2) cfg[p.key] = [v[0], v[1]];
      else cfg[p.key] = p.default;
    } else if (p.type === 'int') {
      cfg[p.key] = (typeof v === 'number') ? v : p.default;
    } else {
      cfg[p.key] = v;
    }
  }
  return cfg;
}

// Apply a user customConfig over the base Custom template, returning a runnable config.
// Validates and clamps each value to its spec bounds.
function buildCustomConfig(customConfig) {
  const base = { ...DIFFICULTY_CONFIGS.Custom };
  // CRITICAL: isCustom flag 보존. Proxy spread가 missing할 수 있음.
  base.isCustom = true;
  if (!customConfig) return base;
  for (const p of CUSTOM_PARAM_SPEC) {
    const v = customConfig[p.key];
    if (v === undefined || v === null) continue;
    if (p.type === 'int') {
      const clamped = Math.max(p.min, Math.min(p.max, Math.round(v)));
      base[p.key] = clamped;
    } else if (p.type === 'pair') {
      if (Array.isArray(v) && v.length === 2) {
        const lo = Math.max(p.min, Math.min(p.max, Math.round(v[0])));
        const hi = Math.max(lo, Math.min(p.max, Math.round(v[1])));
        base[p.key] = [lo, hi];
      }
    } else if (p.type === 'enum') {
      if (typeof v === 'string') {
        // ruleDimensions special: stored as comma-separated string, expand to array
        if (p.key === 'ruleDimensions') {
          base[p.key] = v.split(',').map(s => s.trim()).filter(Boolean);
        } else {
          base[p.key] = v;
        }
      }
    }
  }
  // Derived: scale verifyTimeLimitMs and other budgets along with totalBudgetMs
  if (customConfig.totalBudgetMs) {
    base.verifyTimeLimitMs = Math.max(1500, Math.round(base.totalBudgetMs * 0.18));
  }
  // Derived: cdg budgets scale with k and ruleCount
  base.cdgConstraintBudget = Math.max(8, Math.round(base.k * 4));
  base.cdgTotalHintBudget = Math.min(2 * base.n, Math.max(2, base.countCoverage[1]));
  base.cdgGenderHintBudget = Math.max(2, Math.round(base.cdgTotalHintBudget * 0.6));
  base.cdgSampleSize = base.k <= 6 ? 100 : (base.k <= 9 ? 80 : 60);

  return base;
}

function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Compute a short identifier (8 hex chars) for a puzzle based on its essential
// structure. Two puzzles with identical structure produce the same ID; even
// minor differences (one fixedCell moved, one hint changed) produce different
// IDs. Uses FNV-1a 32-bit hash over a deterministic serialization.
function computePuzzleIdentifier(puzzle) {
  if (!puzzle) return null;
  const parts = [];

  // Tokens: sorted by id for stability
  const tokens = [...(puzzle.tokens || [])].sort((a, b) => a.id.localeCompare(b.id));
  for (const t of tokens) {
    parts.push(`T|${t.id}|${t.row}|${t.col}|${t.animalId}`);
  }

  // Solution genders: sorted by token id
  const solKeys = Object.keys(puzzle.solution || {}).sort();
  for (const k of solKeys) {
    parts.push(`G|${k}|${puzzle.solution[k]}`);
  }

  // LineRules: sorted by isRow + idx + dim + val
  const rules = [...(puzzle.lineRules || [])].sort((a, b) => {
    return (a.isRow ? 0 : 1) - (b.isRow ? 0 : 1) || a.idx - b.idx ||
           a.dim.localeCompare(b.dim) || String(a.val).localeCompare(String(b.val));
  });
  for (const r of rules) {
    parts.push(`R|${r.isRow?1:0}|${r.idx}|${r.dim}|${r.val}`);
  }

  // CountHints: sorted by type + row + col + value
  const hints = [...(puzzle.countHints || [])].sort((a, b) => {
    return a.type.localeCompare(b.type) ||
           ((a.row ?? -1) - (b.row ?? -1)) || ((a.col ?? -1) - (b.col ?? -1)) ||
           (a.value - b.value);
  });
  for (const h of hints) {
    parts.push(`H|${h.type}|${h.row ?? '-'}|${h.col ?? '-'}|${h.value}`);
  }

  // FixedCells: sorted by row + col
  const fixed = [...(puzzle.fixedCells || [])].sort((a, b) => a.row - b.row || a.col - b.col);
  for (const f of fixed) {
    parts.push(`F|${f.row}|${f.col}|${f.animalId}|${f.gender}`);
  }

  // ForbiddenCells: sorted
  const forb = [...(puzzle.forbiddenCells || [])].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  for (const fc of forb) {
    parts.push(`X|${fc[0]}|${fc[1]}`);
  }

  // FNV-1a 32-bit hash
  const str = parts.join(';');
  let hash = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    hash ^= str.charCodeAt(i);
    hash = (hash * 0x01000193) >>> 0;
  }
  return hash.toString(16).padStart(8, '0');
}

// ─────────────────────────────────────────────────────────────────────────────
// REPRODUCIBLE SEED SYSTEM (v1)
// ─────────────────────────────────────────────────────────────────────────────
// Unlike `computePuzzleIdentifier` (which is a one-way hash), the reproducible
// seed encodes the COMPLETE puzzle structure into a base64 string. Decoding
// reverses this back to a fully-formed puzzle — no generator re-run required.
//
// This guarantees 100% reproduction across:
//   - different sessions / browsers / users
//   - different generator code versions (the seed is self-contained)
//   - different engines (a v5 seed loaded by classic still produces v5 puzzle)
//
// Format: "ZL1<base64-encoded JSON>"
//   ZL = legacy Zoograms format prefix (kept as-is for seed compatibility),
//        1 = format version (for forward compatibility)
//
// Length: ~80 chars (Sprout) to ~400 chars (Hard with many constraints)

// Use UTF-8 safe base64 (handles Korean characters in animal habitats/diets).
function _b64encode(str) {
  // Encode str → UTF-8 bytes → base64
  const bytes = new TextEncoder().encode(str);
  let binary = '';
  for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
  return btoa(binary).replace(/=+$/, ''); // strip trailing '='
}

function _b64decode(str) {
  // Pad to multiple of 4
  const padded = str + '='.repeat((4 - str.length % 4) % 4);
  const binary = atob(padded);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

// V12.12: encodePuzzleSeed now uses V2 binary protocol for all new seeds.
// Falls back to V1 (legacy ZL1{base64-JSON}) only if V2 encoding fails.
// Existing ZL1 seeds remain decodable for backward compatibility.
function encodePuzzleSeed(puzzle) {
  if (!puzzle) return null;
  // V12.12: Try V2 binary protocol first (87-91% smaller than V1)
  const v2 = encodePuzzleSeedV2(puzzle);
  if (v2) return v2;
  // V2 failed (unknown animalId etc) — fall back to V1 legacy
  return _encodePuzzleSeedV1(puzzle);
}

// V1 LEGACY ENCODER — kept for fallback only
function _encodePuzzleSeedV1(puzzle) {
  if (!puzzle) return null;
  // Build minimal canonical structure. Key choices:
  //   - tokens are listed in token-id order (t0, t1, ...) so pairs are implied
  //     (t0+t1 pair, t2+t3 pair, ...). This avoids storing pairs separately.
  //   - solution genders are stored in the same order.
  //   - level + engine are preserved so re-loading shows correct labels.
  const tokenList = [...(puzzle.tokens || [])].sort((a, b) => {
    // sort by token id numeric: t0, t1, t10... → 0, 1, 10
    const na = parseInt(a.id.replace(/^t/, ''), 10);
    const nb = parseInt(b.id.replace(/^t/, ''), 10);
    return na - nb;
  });
  // Tokens encoded as compact array: [animalId, row, col]
  const tokenArr = tokenList.map(t => [t.animalId, t.row, t.col]);
  // Solution: array of genders in same order (1=male, 0=female)
  const sol = puzzle.solution || {};
  const genderArr = tokenList.map(t => sol[t.id] === 'male' ? 1 : 0);

  // Rules: [isRow(0/1), idx, dim_short, val]
  // dim_short: 'h'=habitat, 'd'=diet, 'g'=gender
  const dimMap = { habitat: 'h', diet: 'd', gender: 'g' };
  const rules = (puzzle.lineRules || []).map(r => [r.isRow ? 1 : 0, r.idx, dimMap[r.dim] || r.dim, r.val]);

  // CountHints: [type_short, row_or_null, col_or_null, value]
  // type_short: 't'=total, 'm'=H1, 'f'=H2
  const hintTypeMap = { total: 't', H1: 'm', H2: 'f' };
  const hints = (puzzle.countHints || []).map(h => [hintTypeMap[h.type] || h.type, h.row, h.col, h.value]);

  // FixedCells: [row, col, animalId, gender(0/1)]
  const fixed = (puzzle.fixedCells || []).map(f => [f.row, f.col, f.animalId, f.gender === 'male' ? 1 : 0]);

  // ForbiddenCells: [[row, col], ...]
  const forbidden = (puzzle.forbiddenCells || []).map(fc => [fc[0], fc[1]]);

  // PreMarks: tokens visible at start (subset of token indices)
  const preMarkSet = puzzle.preMarks || {};
  const preMarkIndices = tokenList
    .map((t, i) => preMarkSet[t.id] ? i : -1)
    .filter(i => i >= 0);

  const data = {
    v: 1, // format version
    n: puzzle.n,
    lv: puzzle.level || null,
    en: puzzle.engine || null,
    t: tokenArr,
    g: genderArr,
    r: rules,
    h: hints,
    f: fixed,
    x: forbidden,
    p: preMarkIndices,
  };
  // For Custom level, also embed customConfig so Custom puzzles reproduce exactly
  if (puzzle.level === 'Custom' && puzzle.customConfigUsed) {
    data.cc = puzzle.customConfigUsed;
  }
  const json = JSON.stringify(data);
  return 'ZL1' + _b64encode(json);
}

// V12.12: decodePuzzleSeed automatically dispatches between V1 (ZL1) and V2 (ZL2)
// formats. New seeds are V2; legacy seeds remain decodable.
function decodePuzzleSeed(seed) {
  if (typeof seed !== 'string') return null;
  // V2 binary protocol (preferred, 87-91% smaller)
  if (seed.startsWith('ZL2')) {
    return decodePuzzleSeedV2(seed);
  }
  // V1 legacy (kept for backward compat with old shared seeds)
  if (seed.startsWith('ZL1')) {
    return _decodePuzzleSeedV1(seed);
  }
  return null;
}

// V1 LEGACY DECODER — kept for backward compatibility
function _decodePuzzleSeedV1(seed) {
  if (typeof seed !== 'string') return null;
  if (!seed.startsWith('ZL1')) return null;
  let data;
  try {
    const json = _b64decode(seed.slice(3));
    data = JSON.parse(json);
  } catch (e) {
    return null;
  }
  if (!data || data.v !== 1 || typeof data.n !== 'number') return null;

  const dimMapInv = { h: 'habitat', d: 'diet', g: 'gender' };
  const hintTypeInv = { t: 'total', m: 'H1', f: 'H2' };

  // Reconstruct tokens with synthetic IDs
  const tokens = (data.t || []).map((tArr, i) => ({
    id: 't' + i,
    animalId: tArr[0],
    row: tArr[1],
    col: tArr[2],
  }));
  // Pairs: tokens come in order, pair by adjacency (t0+t1, t2+t3, ...)
  const pairs = [];
  for (let i = 0; i + 1 < tokens.length; i += 2) {
    pairs.push([tokens[i].id, tokens[i + 1].id]);
  }
  // Solution from gender array
  const solution = {};
  (data.g || []).forEach((g, i) => {
    if (i < tokens.length) solution[tokens[i].id] = g === 1 ? 'male' : 'female';
  });
  // Line rules
  const lineRules = (data.r || []).map((rArr, i) => ({
    id: 'r' + i,
    isRow: rArr[0] === 1,
    idx: rArr[1],
    dim: dimMapInv[rArr[2]] || rArr[2],
    val: rArr[3],
  }));
  // Count hints
  const countHints = (data.h || []).map((hArr, i) => ({
    id: 'h' + i,
    type: hintTypeInv[hArr[0]] || hArr[0],
    row: hArr[1],
    col: hArr[2],
    value: hArr[3],
  }));
  // Fixed cells
  const fixedCells = (data.f || []).map(fArr => ({
    row: fArr[0], col: fArr[1], animalId: fArr[2],
    gender: fArr[3] === 1 ? 'male' : 'female',
  }));
  // Forbidden cells
  const forbiddenCells = (data.x || []).map(xArr => [xArr[0], xArr[1]]);
  // PreMarks: build from indices + solution
  const preMarks = {};
  (data.p || []).forEach(idx => {
    if (idx < tokens.length) {
      preMarks[tokens[idx].id] = solution[tokens[idx].id];
    }
  });

  // Reassemble puzzle
  const puzzle = {
    n: data.n,
    tokens,
    pairs,
    solution,
    lineRules,
    countHints,
    fixedCells,
    forbiddenCells,
    preMarks,
    level: data.lv || 'Custom',
    engine: data.en || 'classic',
    uniqueness: 'strict', // assumed; will be revalidated if loaded into a checker
    solutionCount: 1,
    // Re-stamp identifier (hash will match the original since structure is identical)
    puzzleId: null, // recomputed below
    fromSeed: true,
    seed,
  };
  if (data.cc) puzzle.customConfigUsed = data.cc;

  // Compute identifier hash so SeedFooter can show consistent #ID
  puzzle.puzzleId = computePuzzleIdentifier(puzzle);

  return puzzle;
}

// ─────────────────────────────────────────────────────────────────────
// V12.12 SOTA — Seed Format V2 (Binary Bit-Packed)
// ─────────────────────────────────────────────────────────────────────
// V1 (ZL1{base64-JSON}): 700-1500 chars per seed (verbose JSON+UTF-8 Korean)
// V2 (ZL2{base64-binary}): 50-150 chars per seed (bit-packed binary)
//
// Compression: 87-91% reduction across all tiers.
//
// Binary layout (after "ZL2" prefix):
//   meta (8 bits):
//     - n_minus_4 (4 bits, 0..5 → grid 4×4..9×9)
//     - level_enum (3 bits, 0..7)
//     - flag_has_custom_cfg (1 bit)
//   engine_enum (4 bits) + reserved (4 bits) = 8 bits
//   meta_extra (8 bits): preMark count flag + 7 bits reserved
//   tokens:
//     count (8 bits) — actually pair count K, total tokens = 2K
//     for each token (2K total): animalIdx (4 bits) + row (4 bits) + col (4 bits) + gender (1 bit) = 13 bits
//   rules:
//     count (8 bits)
//     for each: isRow (1) + idx (4) + dim (2) + val (3) = 10 bits
//   hints:
//     count (8 bits)
//     for each: type (2) + isRow (1) + idx (4) + value (4) = 11 bits
//   fixed:
//     count (8 bits)
//     for each: row (4) + col (4) + animalIdx (4) + gender (1) = 13 bits
//   forbidden:
//     count (8 bits)
//     for each: row (4) + col (4) = 8 bits
//   preMarks bitmap:
//     2K bits (1 bit per token)
//   customConfig (only if flag set):
//     custom config encoded as JSON (rare path; cc preserved as legacy)

// Enumerations for V2 — keep stable for forward-compat
// V12.13: Level enum — backward-compat with V12.12 V2 seeds.
// Original order (do NOT reorder, breaks old V2 seeds):
//   0=Sprout4, 1=Easy5, 2=Medium6, 3=MediumPlus6 (deprecated),
//   4=Hard6, 5=MediumPlus7 (deprecated), 6=Hard7, 7=Custom
// V12.13 new tiers appended:
//   8=Medium7, 9=Medium8, 10=Hard8
const _V2_LEVELS = [
  'Sprout4',      // 0
  'Easy5',        // 1
  'Medium6',      // 2
  'MediumPlus6',  // 3 (deprecated → migrated to Hard6 on decode)
  'Hard6',        // 4
  'MediumPlus7',  // 5 (deprecated → migrated to Medium7 on decode)
  'Hard7',        // 6
  'Custom',       // 7
  'Medium7',      // 8 (V12.13 new — but needs >3 bits → see encoding note)
  'Medium8',      // 9
  'Hard8',        // 10
];
// Legacy aliases — old seeds with deprecated labels migrate to new tiers
const _V2_LEVEL_ALIAS = { MediumPlus6: 'Hard6', MediumPlus7: 'Medium7' };
const _V2_ENGINES = ['classic', 'cdg-v4-strict', 'cdg-v5-strict', 'v6-sota', 'cdg-v3', 'classic-explore', 'unknown', 'custom'];
const _V2_HABITATS = ['사바나', '극지', '해양', '숲'];          // 4 vals → 2 bits
const _V2_DIETS    = ['육식', '초식'];                          // 2 vals → 1 bit
const _V2_GENDERS  = ['수컷', '암컷', 'male', 'female'];        // for rule.val of dim=gender (rare)
const _V2_DIM_ENC  = { habitat: 0, diet: 1, gender: 2 };
const _V2_DIM_DEC  = ['habitat', 'diet', 'gender'];
const _V2_HINT_ENC = { total: 0, H1: 1, H2: 2 };
const _V2_HINT_DEC = ['total', 'H1', 'H2'];

// Animal ID list — derived from ANIMALS array; index 0..15
// (encoded as 4-bit index, decoded back to actual animal.id)
function _v2_buildAnimalMaps() {
  const idToIdx = {}, idxToId = [];
  for (let i = 0; i < ANIMALS.length; i++) {
    idToIdx[ANIMALS[i].id] = i;
    idxToId.push(ANIMALS[i].id);
  }
  return { idToIdx, idxToId };
}

// BitWriter — packs bits into a Uint8Array
function _BitWriter() {
  const bytes = [];
  let cur = 0, bits = 0;
  return {
    write(value, n) {
      // Write n least-significant bits of `value` (big-endian within byte stream)
      for (let i = n - 1; i >= 0; i--) {
        const b = (value >> i) & 1;
        cur = (cur << 1) | b;
        bits++;
        if (bits === 8) {
          bytes.push(cur);
          cur = 0;
          bits = 0;
        }
      }
    },
    finish() {
      if (bits > 0) {
        cur <<= (8 - bits);
        bytes.push(cur);
        bits = 0;
      }
      return new Uint8Array(bytes);
    }
  };
}

// BitReader — reads bits from a Uint8Array
function _BitReader(bytes) {
  let bytePos = 0, bitPos = 0;
  return {
    read(n) {
      let value = 0;
      for (let i = 0; i < n; i++) {
        if (bytePos >= bytes.length) return value;
        const b = (bytes[bytePos] >> (7 - bitPos)) & 1;
        value = (value << 1) | b;
        bitPos++;
        if (bitPos === 8) {
          bitPos = 0;
          bytePos++;
        }
      }
      return value;
    },
    remaining() {
      return (bytes.length - bytePos) * 8 - bitPos;
    },
  };
}

// Bytes → URL-safe base64 (no padding, web-safe)
function _bytesToB64Url(bytes) {
  let binary = '';
  for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
  return btoa(binary).replace(/=+$/, '').replace(/\+/g, '-').replace(/\//g, '_');
}

// URL-safe base64 → Bytes
function _b64UrlToBytes(s) {
  const std = s.replace(/-/g, '+').replace(/_/g, '/');
  const padded = std + '='.repeat((4 - std.length % 4) % 4);
  const binary = atob(padded);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

// V2 ENCODER — produces "ZL2{base64-url}" string
function encodePuzzleSeedV2(puzzle) {
  if (!puzzle) return null;
  try {
    const w = _BitWriter();
    const { idToIdx } = _v2_buildAnimalMaps();

    // Sort tokens by id-numeric (matches V1 ordering for pair adjacency)
    const tokenList = [...(puzzle.tokens || [])].sort((a, b) => {
      const na = parseInt(a.id.replace(/^t/, ''), 10);
      const nb = parseInt(b.id.replace(/^t/, ''), 10);
      return na - nb;
    });
    const sol = puzzle.solution || {};
    const preMarkSet = puzzle.preMarks || {};

    // ═══ HEADER ═══════════════════════════════════════════════════════
    // V12.13: levelIdx expanded from 3 bits → 4 bits to support 11 tiers
    //         (Sprout4..Hard8). reserved field reduced from 4 → 3 bits.
    //         Total header still 16 bits (2 bytes).
    const n = puzzle.n;
    const nMinus4 = Math.max(0, Math.min(15, n - 4));
    const levelIdx = Math.max(0, _V2_LEVELS.indexOf(puzzle.level || 'Custom'));
    const hasCustomCfg = (puzzle.level === 'Custom' && puzzle.customConfigUsed) ? 1 : 0;
    const engineIdx = Math.max(0, _V2_ENGINES.indexOf(puzzle.engine || 'unknown'));

    w.write(nMinus4, 4);          // 4 bits: n (0-15)
    w.write(levelIdx, 4);          // 4 bits: level (0-15) — V12.13 expanded from 3 bits
    w.write(hasCustomCfg, 1);      // 1 bit: custom flag
    w.write(engineIdx, 4);         // 4 bits: engine
    w.write(0, 3);                 // 3 bits reserved (V12.13: was 4 bits)

    // ═══ TOKENS ═══════════════════════════════════════════════════════
    const K = Math.floor(tokenList.length / 2); // pair count
    w.write(K, 8); // 8 bits: pair count (max 64 pairs)
    for (const tok of tokenList) {
      const animalIdx = idToIdx[tok.animalId];
      if (animalIdx === undefined) {
        throw new Error('Unknown animalId: ' + tok.animalId);
      }
      w.write(animalIdx, 4);                    // 4 bits: animal
      w.write(tok.row, 4);                      // 4 bits: row (0-15)
      w.write(tok.col, 4);                      // 4 bits: col
      w.write(sol[tok.id] === 'male' ? 1 : 0, 1); // 1 bit: gender
    }

    // ═══ RULES ════════════════════════════════════════════════════════
    const rules = puzzle.lineRules || [];
    w.write(rules.length, 8);
    for (const r of rules) {
      const isRow = r.isRow ? 1 : 0;
      const dim = _V2_DIM_ENC[r.dim] !== undefined ? _V2_DIM_ENC[r.dim] : 0;
      let valIdx = 0;
      if (r.dim === 'habitat') {
        valIdx = _V2_HABITATS.indexOf(r.val);
        if (valIdx < 0) valIdx = 0;
      } else if (r.dim === 'diet') {
        valIdx = _V2_DIETS.indexOf(r.val);
        if (valIdx < 0) valIdx = 0;
      } else if (r.dim === 'gender') {
        valIdx = (r.val === 'male' || r.val === '수컷') ? 0 : 1;
      }
      w.write(isRow, 1);
      w.write(r.idx, 4);
      w.write(dim, 2);
      w.write(valIdx, 3);
    }

    // ═══ HINTS ════════════════════════════════════════════════════════
    const hints = puzzle.countHints || [];
    w.write(hints.length, 8);
    for (const h of hints) {
      const typeIdx = _V2_HINT_ENC[h.type] !== undefined ? _V2_HINT_ENC[h.type] : 0;
      const isRow = (h.row !== null && h.row !== undefined) ? 1 : 0;
      const idx = isRow ? h.row : h.col;
      const val = Math.max(0, Math.min(15, h.value || 0));
      w.write(typeIdx, 2);
      w.write(isRow, 1);
      w.write(idx, 4);
      w.write(val, 4);
    }

    // ═══ FIXED CELLS ══════════════════════════════════════════════════
    const fixed = puzzle.fixedCells || [];
    w.write(fixed.length, 8);
    for (const f of fixed) {
      const animalIdx = idToIdx[f.animalId];
      if (animalIdx === undefined) {
        throw new Error('Unknown animalId in fixedCell: ' + f.animalId);
      }
      w.write(f.row, 4);
      w.write(f.col, 4);
      w.write(animalIdx, 4);
      w.write(f.gender === 'male' ? 1 : 0, 1);
    }

    // ═══ FORBIDDEN CELLS ══════════════════════════════════════════════
    const forbidden = puzzle.forbiddenCells || [];
    w.write(forbidden.length, 8);
    for (const fc of forbidden) {
      w.write(fc[0], 4);
      w.write(fc[1], 4);
    }

    // ═══ PRE-MARKS BITMAP ═════════════════════════════════════════════
    for (const tok of tokenList) {
      w.write(preMarkSet[tok.id] ? 1 : 0, 1);
    }

    const bytes = w.finish();
    const b64 = _bytesToB64Url(bytes);

    // Append customConfig as separate JSON tail when needed (rare; preserves
    // existing custom config schema without re-encoding all 27 params).
    if (hasCustomCfg) {
      const ccJson = JSON.stringify(puzzle.customConfigUsed);
      const ccB64 = _bytesToB64Url(new TextEncoder().encode(ccJson));
      return 'ZL2' + b64 + '~' + ccB64;
    }
    return 'ZL2' + b64;
  } catch (e) {
    // Encoding failed — fallback to V1 by signaling null
    if (typeof console !== 'undefined') console.warn('V2 encode failed, falling back:', e);
    return null;
  }
}

// V2 DECODER — accepts "ZL2{base64-url}" and reconstructs puzzle
function decodePuzzleSeedV2(seed) {
  if (typeof seed !== 'string') return null;
  if (!seed.startsWith('ZL2')) return null;
  try {
    let body = seed.slice(3);
    if (!body) return null;
    let ccData = null;
    const tildeIdx = body.indexOf('~');
    if (tildeIdx >= 0) {
      const ccStr = body.slice(tildeIdx + 1);
      body = body.slice(0, tildeIdx);
      try {
        const ccBytes = _b64UrlToBytes(ccStr);
        ccData = JSON.parse(new TextDecoder().decode(ccBytes));
      } catch (e) {
        // ignore — non-fatal
      }
    }
    // Validate body is base64-url charset (A-Z a-z 0-9 - _)
    if (!/^[A-Za-z0-9_-]+$/.test(body)) return null;
    if (body.length < 4) return null;  // too short to be valid

    const bytes = _b64UrlToBytes(body);
    if (bytes.length < 5) return null;  // header (2 bytes) + at least one section count
    const r = _BitReader(bytes);
    const { idxToId } = _v2_buildAnimalMaps();

    // ═══ HEADER ═══════════════════════════════════════════════════════
    // V12.13: levelIdx expanded to 4 bits, reserved reduced to 3 bits
    const nMinus4 = r.read(4);
    const levelIdx = r.read(4);              // V12.13: was 3 bits
    const hasCustomCfg = r.read(1);
    const engineIdx = r.read(4);
    r.read(3);                                // V12.13 reserved (was 4 bits)

    const n = nMinus4 + 4;
    let level = _V2_LEVELS[levelIdx] || 'Custom';
    // V12.13: migrate deprecated tier names to new ones
    if (_V2_LEVEL_ALIAS[level]) level = _V2_LEVEL_ALIAS[level];
    const engine = _V2_ENGINES[engineIdx] || 'unknown';

    // ═══ TOKENS ═══════════════════════════════════════════════════════
    const K = r.read(8);
    const totalTokens = K * 2;
    const tokens = [];
    const solution = {};
    for (let i = 0; i < totalTokens; i++) {
      const animalIdx = r.read(4);
      const row = r.read(4);
      const col = r.read(4);
      const gender = r.read(1);
      const id = 't' + i;
      const animalId = idxToId[animalIdx] !== undefined ? idxToId[animalIdx] : 1;
      tokens.push({ id, animalId, row, col });
      solution[id] = gender === 1 ? 'male' : 'female';
    }
    // Pairs: t0+t1, t2+t3, ...
    const pairs = [];
    for (let i = 0; i + 1 < tokens.length; i += 2) {
      pairs.push([tokens[i].id, tokens[i + 1].id]);
    }

    // ═══ RULES ════════════════════════════════════════════════════════
    const ruleCount = r.read(8);
    const lineRules = [];
    for (let i = 0; i < ruleCount; i++) {
      const isRow = r.read(1) === 1;
      const idx = r.read(4);
      const dim = r.read(2);
      const valIdx = r.read(3);
      const dimName = _V2_DIM_DEC[dim] || 'habitat';
      let val;
      if (dimName === 'habitat') {
        val = _V2_HABITATS[valIdx] || _V2_HABITATS[0];
      } else if (dimName === 'diet') {
        val = _V2_DIETS[valIdx] || _V2_DIETS[0];
      } else if (dimName === 'gender') {
        val = valIdx === 0 ? 'male' : 'female';
      } else {
        val = '';
      }
      lineRules.push({ id: 'r' + i, isRow, idx, dim: dimName, val });
    }

    // ═══ HINTS ════════════════════════════════════════════════════════
    const hintCount = r.read(8);
    const countHints = [];
    for (let i = 0; i < hintCount; i++) {
      const typeIdx = r.read(2);
      const isRow = r.read(1) === 1;
      const idx = r.read(4);
      const value = r.read(4);
      const type = _V2_HINT_DEC[typeIdx] || 'total';
      countHints.push({
        id: 'h' + i,
        type,
        row: isRow ? idx : null,
        col: isRow ? null : idx,
        value,
      });
    }

    // ═══ FIXED CELLS ══════════════════════════════════════════════════
    const fixedCount = r.read(8);
    const fixedCells = [];
    for (let i = 0; i < fixedCount; i++) {
      const row = r.read(4);
      const col = r.read(4);
      const animalIdx = r.read(4);
      const gender = r.read(1);
      const animalId = idxToId[animalIdx] !== undefined ? idxToId[animalIdx] : 1;
      fixedCells.push({
        row, col, animalId,
        gender: gender === 1 ? 'male' : 'female',
      });
    }

    // ═══ FORBIDDEN CELLS ══════════════════════════════════════════════
    const forbCount = r.read(8);
    const forbiddenCells = [];
    for (let i = 0; i < forbCount; i++) {
      const row = r.read(4);
      const col = r.read(4);
      forbiddenCells.push([row, col]);
    }

    // ═══ PRE-MARKS BITMAP ═════════════════════════════════════════════
    const preMarks = {};
    for (let i = 0; i < totalTokens; i++) {
      const bit = r.read(1);
      if (bit === 1) {
        preMarks[tokens[i].id] = solution[tokens[i].id];
      }
    }

    // Final validation — sanity check that decoded structure is well-formed
    // (catches malformed base64 that decoded to garbage)
    if (n < 4 || n > 9) return null;
    if (totalTokens > 32 || totalTokens < 0) return null;
    for (const tok of tokens) {
      if (tok.row >= n || tok.col >= n || tok.row < 0 || tok.col < 0) return null;
    }

    const puzzle = {
      n, tokens, pairs, solution,
      lineRules, countHints, fixedCells, forbiddenCells, preMarks,
      level, engine,
      uniqueness: 'strict',
      solutionCount: 1,
      puzzleId: null,
      fromSeed: true,
      seed,
    };
    if (hasCustomCfg && ccData) puzzle.customConfigUsed = ccData;

    puzzle.puzzleId = computePuzzleIdentifier(puzzle);
    return puzzle;
  } catch (e) {
    if (typeof console !== 'undefined') console.warn('V2 decode failed:', e);
    return null;
  }
}


// ─────────────────────────────────────────────────────────────────────────────
// V12.15 SOTA — Puzzle Sharing & Duel Mode
// ─────────────────────────────────────────────────────────────────────────────
// Two-mode share system:
//   1) Simple share: ?seed=ZL2... — 시드만 URL에 인코딩, 받은 사람이 바로 풀이 시작
//   2) Duel share:   ?seed=ZL2...&duel=BASE64 — 시드 + 누적 leaderboard JSON
//      받은 사람이 풀이 완료 시 leaderboard에 자기 기록 추가, 또 공유 가능
//
// Duel data schema (v1):
//   { v: 1, entries: [{ n: name, a: animalIdx, t: seconds, h: hintCount }] }
//   entries는 시간 오름차순(빠른 순)으로 정렬되어 표시됨

// Duel data 압축 인코딩 — JSON → URL-safe base64
// V12.16: Duel entry schema upgraded with gender
//   { n: name, a: animalIdx (0-15), g: gender (0=male, 1=female), t: seconds, h: hints }
//   - 32-character avatar pool: 16 animals × 2 genders
//   - Backward compat: missing `g` defaults to 0 (male)
function encodeDuelData(duel) {
  if (!duel || !Array.isArray(duel.entries)) return null;
  try {
    const json = JSON.stringify({
      v: 1,
      entries: duel.entries.map(e => ({
        n: String(e.n || '').slice(0, 24),         // 이름 24자 한도
        a: Math.max(0, Math.min(15, e.a | 0)),     // animalIdx 0-15
        g: (e.g === 1 || e.g === 'female') ? 1 : 0, // 0=male, 1=female
        t: Math.max(0, e.t | 0),                   // seconds (정수)
        h: Math.max(0, e.h | 0),                   // hint count
      })),
    });
    const bytes = new TextEncoder().encode(json);
    return _bytesToB64Url(bytes);
  } catch (e) {
    return null;
  }
}

function decodeDuelData(b64) {
  if (typeof b64 !== 'string' || !b64) return null;
  try {
    const bytes = _b64UrlToBytes(b64);
    const json = new TextDecoder().decode(bytes);
    const data = JSON.parse(json);
    if (!data || !Array.isArray(data.entries)) return null;
    const entries = data.entries
      .filter(e => e && typeof e === 'object')
      .map(e => ({
        n: String(e.n || '').slice(0, 24),
        a: Math.max(0, Math.min(15, e.a | 0)),
        g: (e.g === 1 || e.g === 'female') ? 1 : 0,  // V12.16: gender (0=male default)
        t: Math.max(0, e.t | 0),
        h: Math.max(0, e.h | 0),
      }));
    return { v: data.v || 1, entries };
  } catch (e) {
    return null;
  }
}

// V12.16: Compute a stable identity key for a duel entry — used to deduplicate
// when merging two leaderboards. Players are considered the same if all five
// (name, animalIdx, gender, time, hint count) match exactly.
function duelEntryIdentity(e) {
  const name = String(e.n || '').trim().toLowerCase();
  const a = e.a | 0;
  const g = (e.g === 1 || e.g === 'female') ? 1 : 0;
  const t = Math.max(0, e.t | 0);
  const h = Math.max(0, e.h | 0);
  return `${name}|${a}|${g}|${t}|${h}`;
}

// V12.16: Merge two leaderboard entry arrays — dedupes by identity key, then
// sorts ascending by time (faster first). Returns the merged array.
function mergeDuelEntries(entriesA, entriesB) {
  const seen = new Set();
  const merged = [];
  for (const arr of [entriesA, entriesB]) {
    if (!Array.isArray(arr)) continue;
    for (const e of arr) {
      if (!e || typeof e !== 'object') continue;
      const key = duelEntryIdentity(e);
      if (seen.has(key)) continue;
      seen.add(key);
      merged.push({
        n: String(e.n || '').slice(0, 24),
        a: Math.max(0, Math.min(15, e.a | 0)),
        g: (e.g === 1 || e.g === 'female') ? 1 : 0,
        t: Math.max(0, e.t | 0),
        h: Math.max(0, e.h | 0),
      });
    }
  }
  // Ascending by time, tiebreak by hints
  merged.sort((a, b) => (a.t - b.t) || (a.h - b.h));
  return merged;
}

// V12.16: Parse a string that may be a full URL OR a raw base64 duel blob,
// returning {seed, duel} on success or null on failure. Used by the
// "리더보드 합치기" feature where the user pastes a share link.
function parseDuelInput(input) {
  if (typeof input !== 'string') return null;
  const trimmed = input.trim();
  if (!trimmed) return null;
  // Try URL first
  try {
    const url = new URL(trimmed);
    const seed = url.searchParams.get('seed');
    const duelB64 = url.searchParams.get('duel');
    if (seed && duelB64) {
      const duel = decodeDuelData(duelB64);
      if (duel) return { seed, duel };
    }
  } catch (e) {
    // not a valid URL — try as raw base64 below
  }
  // Try as raw base64 duel blob (no URL wrapper)
  try {
    const duel = decodeDuelData(trimmed);
    if (duel && Array.isArray(duel.entries) && duel.entries.length > 0) {
      // No seed — caller will need to verify against current puzzle by other means
      return { seed: null, duel };
    }
  } catch (e) {
    // not a valid base64 either
  }
  return null;
}

// Build a shareable URL — uses current page origin + path
function buildShareUrl(seed, duelData) {
  if (!seed) return null;
  let url;
  try {
    url = new URL(window.location.href);
    // Clear existing share params
    url.searchParams.delete('seed');
    url.searchParams.delete('duel');
    url.hash = '';
  } catch (e) {
    url = { searchParams: new URLSearchParams(), toString: () => '' };
  }
  url.searchParams.set('seed', seed);
  if (duelData) {
    const enc = encodeDuelData(duelData);
    if (enc) url.searchParams.set('duel', enc);
  }
  return url.toString();
}

// Parse current location for shared seed/duel — called once at app boot
function parseSharedFromUrl() {
  if (typeof window === 'undefined' || !window.location) return null;
  try {
    const params = new URLSearchParams(window.location.search);
    const seed = params.get('seed');
    if (!seed) return null;
    const duelB64 = params.get('duel');
    const duel = duelB64 ? decodeDuelData(duelB64) : null;
    return { seed, duel };
  } catch (e) {
    return null;
  }
}

// Strip share params from URL without triggering reload — keeps clean URL
// after seed is loaded so refreshing doesn't repeat the auto-load
function clearShareUrlParams() {
  if (typeof window === 'undefined' || !window.history || !window.history.replaceState) return;
  try {
    const url = new URL(window.location.href);
    url.searchParams.delete('seed');
    url.searchParams.delete('duel');
    window.history.replaceState({}, '', url.toString());
  } catch (e) {
    // ignore
  }
}

// localStorage persistence for duel identity (name + animal pick)
const DUEL_IDENTITY_KEY = 'zoograms.duelIdentity';

function loadDuelIdentity() {
  try {
    const raw = localStorage.getItem(DUEL_IDENTITY_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== 'object') return null;
    return {
      name: String(parsed.name || '').slice(0, 24),
      animalIdx: Math.max(0, Math.min(15, parsed.animalIdx | 0)),
      // V12.16: gender (defaults to 'male' for legacy identities)
      gender: parsed.gender === 'female' ? 'female' : 'male',
    };
  } catch (e) {
    return null;
  }
}

function saveDuelIdentity(name, animalIdx, gender) {
  try {
    localStorage.setItem(DUEL_IDENTITY_KEY, JSON.stringify({
      name: String(name || '').slice(0, 24),
      animalIdx: Math.max(0, Math.min(15, animalIdx | 0)),
      gender: gender === 'female' ? 'female' : 'male',  // V12.16
    }));
  } catch (e) {
    // ignore
  }
}

// Random initial animalIdx for first-time users (0-15)
function pickRandomAnimalIdx() {
  return Math.floor(Math.random() * 16);
}

// V12.16: Random initial gender (50/50)
function pickRandomGender() {
  return Math.random() < 0.5 ? 'male' : 'female';
}

// V12.15: Render puzzle initial state to a PNG Blob for share-with-screenshot
// Uses canvas API directly (no external deps) — draws grid + count hints +
// rule chips in a way that conveys the initial puzzle state at a glance.
async function renderPuzzleScreenshot(puzzle, options = {}) {
  if (!puzzle || typeof document === 'undefined') return null;
  try {
    const n = puzzle.n;
    const cell = options.cell || 56;
    const margin = options.margin || 40;
    const headerH = options.headerH || 60;
    const footerH = options.footerH || 50;
    const W = margin * 2 + cell * n;
    const H = margin * 2 + headerH + cell * n + footerH;

    const canvas = document.createElement('canvas');
    canvas.width = W * 2;        // 2x for retina
    canvas.height = H * 2;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    const ctx = canvas.getContext('2d');
    ctx.scale(2, 2);

    // Background — paper tone
    ctx.fillStyle = '#fefdfb';
    ctx.fillRect(0, 0, W, H);

    // Header — title
    ctx.fillStyle = '#1c1917';
    ctx.font = 'bold 22px "Fraunces", Georgia, serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText('Zoograms', margin, margin + headerH / 2 - 10);
    // Difficulty subtitle
    ctx.fillStyle = '#78716c';
    ctx.font = '13px sans-serif';
    const cfg = DIFFICULTY_CONFIGS[puzzle.level] || DIFFICULTY_CONFIGS.Sprout;
    const lvLabel = (cfg && cfg.label) || puzzle.level || '';
    const lvGlyph = (cfg && cfg.glyph) || '';
    ctx.fillText(`${lvGlyph} ${lvLabel} ${n}×${n}`, margin, margin + headerH / 2 + 12);

    // Grid origin
    const gridX = margin;
    const gridY = margin + headerH;

    // Grid cells with forbidden marks
    const forbiddenMap = {};
    for (const f of (puzzle.forbidden || [])) {
      forbiddenMap[`${f.row},${f.col}`] = true;
    }
    // Pre-mark / fixed tile positions (for tokens that start placed)
    const fixedMap = {};
    if (puzzle.preMarks) {
      for (const tokenId of Object.keys(puzzle.preMarks)) {
        const tk = (puzzle.tokens || []).find(t => t.id === tokenId);
        if (tk) fixedMap[`${tk.row},${tk.col}`] = tk;
      }
    }

    for (let r = 0; r < n; r++) {
      for (let c = 0; c < n; c++) {
        const x = gridX + c * cell;
        const y = gridY + r * cell;
        const isForbidden = forbiddenMap[`${r},${c}`];
        ctx.fillStyle = isForbidden ? '#e7e5e4' : '#ffffff';
        ctx.fillRect(x, y, cell, cell);
        ctx.strokeStyle = '#d6d3d1';
        ctx.lineWidth = 1;
        ctx.strokeRect(x + 0.5, y + 0.5, cell - 1, cell - 1);
        // Forbidden — diagonal X
        if (isForbidden) {
          ctx.strokeStyle = '#a8a29e';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(x + 8, y + 8);
          ctx.lineTo(x + cell - 8, y + cell - 8);
          ctx.moveTo(x + cell - 8, y + 8);
          ctx.lineTo(x + 8, y + cell - 8);
          ctx.stroke();
        }
        // Pre-placed (anchor) token — draw glyph
        const tk = fixedMap[`${r},${c}`];
        if (tk) {
          const animal = ANIMALS.find(a => a.id === tk.animalId);
          if (animal) {
            ctx.fillStyle = '#fff7ed';
            ctx.fillRect(x + 1, y + 1, cell - 2, cell - 2);
            ctx.font = `${Math.floor(cell * 0.5)}px serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(animal.emoji, x + cell / 2, y + cell / 2);
          }
        }
      }
    }

    // Footer — pair pool count + rule count summary
    const totalPairs = (puzzle.tokens || []).length / 2;
    const ruleCount = (puzzle.rules || []).length;
    const hintCount = (puzzle.countHints || []).length;
    ctx.fillStyle = '#78716c';
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    const footerY = margin + headerH + cell * n + footerH / 2;
    ctx.fillText(
      `${totalPairs} pairs · ${ruleCount} rules · ${hintCount} count hints`,
      margin, footerY
    );
    // Right-side "share" tag
    ctx.textAlign = 'right';
    ctx.fillStyle = '#b45309';
    ctx.font = '11px sans-serif';
    ctx.fillText('zoograms.app', W - margin, footerY);

    // Convert to Blob (PNG)
    return await new Promise((resolve) => {
      canvas.toBlob((blob) => resolve(blob), 'image/png');
    });
  } catch (e) {
    return null;
  }
}


function isAdjacent(c1, c2) {
  return Math.max(Math.abs(c1.row - c2.row), Math.abs(c1.col - c2.col)) === 1;
}

function getPartnerToken(tokenId, pairs) {
  for (const [t1, t2] of pairs) {
    if (t1 === tokenId) return t2;
    if (t2 === tokenId) return t1;
  }
  return null;
}

function getTokensInRow(r, tokens) { return tokens.filter(t => t.row === r); }
function getTokensInCol(c, tokens) { return tokens.filter(t => t.col === c); }

function animalById(id) { return ANIMALS.find(a => a.id === id); }

// =============================================================================
// SECTION 3 — 4-STAGE GENERATION PIPELINE
// =============================================================================

// ─────────────────────────────────────────────────────────────────────────────
// STAGE A: Design Rule Template — Constraint-First Generation
// ─────────────────────────────────────────────────────────────────────────────
function designRuleTemplate(config, animals) {
  const targetCount = randInt(config.ruleCount[0], config.ruleCount[1]);
  const dims = config.ruleDimensions;
  const n = config.n;

  // Enumerate all possible rules
  const allRules = [];
  for (let i = 0; i < n; i++) {
    for (const isRow of [true, false]) {
      for (const dim of dims) {
        if (dim === 'habitat') {
          for (const val of ['사바나', '극지', '해양', '숲']) {
            allRules.push({ isRow, idx: i, dim, val });
          }
        } else if (dim === 'diet') {
          for (const val of ['육식', '초식']) {
            allRules.push({ isRow, idx: i, dim, val });
          }
        } else if (dim === 'gender') {
          for (const val of ['male', 'female']) {
            allRules.push({ isRow, idx: i, dim, val });
          }
        }
      }
    }
  }

  // Try random combinations
  for (let attempt = 0; attempt < 60; attempt++) {
    const candidate = shuffle(allRules).slice(0, targetCount);

    // Check line uniqueness (no two rules on same line)
    const lines = new Set();
    let valid = true;
    for (const r of candidate) {
      const key = `${r.isRow ? 'r' : 'c'}${r.idx}`;
      if (lines.has(key)) { valid = false; break; }
      lines.add(key);
    }
    if (!valid) continue;

    // Check cross-cell feasibility
    if (!crossCellsFeasible(candidate, animals)) continue;

    return candidate.map((r, i) => ({ ...r, id: `rule-${i}` }));
  }
  return null;
}

function crossCellsFeasible(rules, animals) {
  // For row rule vs col rule pairs, check if their cross cell can hold any animal
  for (let i = 0; i < rules.length; i++) {
    for (let j = i + 1; j < rules.length; j++) {
      const r1 = rules[i], r2 = rules[j];
      if (r1.isRow === r2.isRow) continue;

      // They cross at one cell; compute compatible animals
      const compatible = animals.filter(a => {
        if (r1.dim !== 'gender' && a[r1.dim] !== r1.val) return false;
        if (r2.dim !== 'gender' && a[r2.dim] !== r2.val) return false;
        return true;
      });
      // Gender rules don't restrict species; always feasible for species
      // But if both are species dim (habitat/diet), need at least one compatible animal
      if (r1.dim !== 'gender' && r2.dim !== 'gender' && compatible.length === 0) {
        return false;
      }
    }
  }
  return true;
}

// ─────────────────────────────────────────────────────────────────────────────
// STAGE B: Constrained Adjacent Placement
// ─────────────────────────────────────────────────────────────────────────────
function constrainedAdjacentPlacement(config, ruleTemplate, forbiddenCells, animals) {
  const n = config.n;
  const k = config.k;
  const forbidden = new Set(forbiddenCells.map(([r, c]) => `${r},${c}`));

  // Build cell domains (which animals can be placed at each cell, given habitat/diet rules)
  const cellDomains = {};
  for (let r = 0; r < n; r++) {
    for (let c = 0; c < n; c++) {
      const key = `${r},${c}`;
      if (forbidden.has(key)) continue;

      let allowed = new Set(animals.map(a => a.id));
      for (const rule of ruleTemplate) {
        if (rule.dim === 'gender') continue; // gender rules applied post-placement
        const inLine = rule.isRow ? (rule.idx === r) : (rule.idx === c);
        if (inLine) {
          allowed = new Set([...allowed].filter(id => animalById(id)[rule.dim] === rule.val));
        }
      }
      if (allowed.size > 0) cellDomains[key] = allowed;
    }
  }

  // For animal pool restriction
  let animalPool = animals;
  if (config.animalPoolRestriction === 'same_habitat') {
    const habitats = ['사바나', '극지', '해양', '숲'];
    const viableHabitats = habitats.filter(h => animals.filter(a => a.habitat === h).length >= k);
    if (viableHabitats.length === 0) return null;
    const h = viableHabitats[randInt(0, viableHabitats.length - 1)];
    animalPool = animals.filter(a => a.habitat === h);
  }

  // Compute per-animal options (list of adjacent cell pairs this animal can occupy)
  const animalOptions = {};
  for (const animal of animalPool) {
    const options = [];
    const cellsForAnimal = Object.entries(cellDomains)
      .filter(([_, dom]) => dom.has(animal.id))
      .map(([key]) => {
        const [r, c] = key.split(',').map(Number);
        return { row: r, col: c, key };
      });

    for (const c1 of cellsForAnimal) {
      for (const c2 of cellsForAnimal) {
        if (c1.key >= c2.key) continue; // dedupe
        if (!isAdjacent(c1, c2)) continue;
        options.push([c1, c2]);
      }
    }
    animalOptions[animal.id] = options;
  }

  // Viable animals: those with at least one option
  const viable = animalPool.filter(a => animalOptions[a.id].length > 0);
  if (viable.length < k) return null;

  // Try selecting k animals and placing them
  for (let selAttempt = 0; selAttempt < 20; selAttempt++) {
    const selected = shuffle(viable).slice(0, k);
    // Sort by fewest options (MRV)
    selected.sort((a, b) => animalOptions[a.id].length - animalOptions[b.id].length);

    const used = new Set();
    const result = [];

    function place(idx) {
      if (idx === k) return true;
      const animal = selected[idx];
      const opts = shuffle(animalOptions[animal.id]);
      for (const [c1, c2] of opts) {
        if (used.has(c1.key) || used.has(c2.key)) continue;
        used.add(c1.key); used.add(c2.key);
        result.push([animal, c1, c2]);
        if (place(idx + 1)) return true;
        result.pop();
        used.delete(c1.key); used.delete(c2.key);
      }
      return false;
    }

    if (place(0)) {
      // Convert to tokens/pairs
      const tokens = [], pairs = [];
      for (let i = 0; i < result.length; i++) {
        const [animal, c1, c2] = result[i];
        const t1 = `t${i * 2}`, t2 = `t${i * 2 + 1}`;
        tokens.push({ id: t1, animalId: animal.id, row: c1.row, col: c1.col });
        tokens.push({ id: t2, animalId: animal.id, row: c2.row, col: c2.col });
        pairs.push([t1, t2]);
      }
      return { tokens, pairs };
    }
  }
  return null;
}

// ─────────────────────────────────────────────────────────────────────────────
// Gender Assignment Respecting Gender Rules
// ─────────────────────────────────────────────────────────────────────────────
function assignGendersWithRules(pairs, tokens, lineRules) {
  const genderRules = lineRules.filter(r => r.dim === 'gender');

  // Compute forced genders for tokens in gender-rule lines
  const forcedGender = {};
  for (const rule of genderRules) {
    const lineTokens = rule.isRow
      ? tokens.filter(t => t.row === rule.idx)
      : tokens.filter(t => t.col === rule.idx);
    for (const t of lineTokens) {
      if (forcedGender[t.id] && forcedGender[t.id] !== rule.val) {
        return null; // conflict
      }
      forcedGender[t.id] = rule.val;
    }
  }

  // Assign genders respecting forced and pair-constraint
  const marks = {};
  for (const [t1, t2] of pairs) {
    const f1 = forcedGender[t1];
    const f2 = forcedGender[t2];

    if (f1 && f2) {
      if (f1 === f2) return null; // pair can't have same gender
      marks[t1] = f1; marks[t2] = f2;
    } else if (f1) {
      marks[t1] = f1; marks[t2] = f1 === 'male' ? 'female' : 'male';
    } else if (f2) {
      marks[t2] = f2; marks[t1] = f2 === 'male' ? 'female' : 'male';
    } else {
      if (Math.random() < 0.5) { marks[t1] = 'male'; marks[t2] = 'female'; }
      else { marks[t1] = 'female'; marks[t2] = 'male'; }
    }
  }
  return marks;
}

// ─────────────────────────────────────────────────────────────────────────────
// STAGE C: Auxiliary Hints — Count hints + Fixed tiles
// ─────────────────────────────────────────────────────────────────────────────
function addAuxiliaryHints(placement, config, solution, lineRules, forbiddenCells) {
  const n = config.n;
  const tokens = placement.tokens;

  // Identify rule lines (these must have # hints for synergy)
  const ruleLineKeys = new Set(
    lineRules.map(r => `${r.isRow ? 'r' : 'c'}${r.idx}`)
  );

  // All lines
  const allLines = [];
  for (let i = 0; i < n; i++) {
    allLines.push({ isRow: true, idx: i });
    allLines.push({ isRow: false, idx: i });
  }

  // Priority: rule lines first, then others
  const priorityLines = allLines.filter(l =>
    ruleLineKeys.has(`${l.isRow ? 'r' : 'c'}${l.idx}`)
  );
  const otherLines = allLines.filter(l =>
    !ruleLineKeys.has(`${l.isRow ? 'r' : 'c'}${l.idx}`)
  );

  // Target count coverage
  const targetCount = randInt(config.countCoverage[0], config.countCoverage[1]);
  // Ensure priority lines all included
  const neededFromOthers = Math.max(0, targetCount - priorityLines.length);
  const selectedOthers = shuffle(otherLines).slice(0, neededFromOthers);
  const selectedLines = [...priorityLines, ...selectedOthers];

  // Build # hints (total + optional H1 gender count)
  const countHints = [];
  for (let i = 0; i < selectedLines.length; i++) {
    const line = selectedLines[i];
    const lineTokens = line.isRow
      ? getTokensInRow(line.idx, tokens)
      : getTokensInCol(line.idx, tokens);
    countHints.push({
      id: `cnt-${line.isRow ? 'r' : 'c'}${line.idx}`,
      type: 'total',
      row: line.isRow ? line.idx : null,
      col: line.isRow ? null : line.idx,
      value: lineTokens.length,
    });
    // H1 (male count) — adds critical information for pair permutation disambiguation
    // Skip when line already has gender-only rule (redundant) or empty
    const hasGenderRule = lineRules.some(r =>
      r.dim === 'gender' && r.isRow === line.isRow && r.idx === line.idx
    );
    if (lineTokens.length > 0 && !hasGenderRule) {
      const males = lineTokens.filter(t => solution[t.id] === 'male').length;
      countHints.push({
        id: `h1-${line.isRow ? 'r' : 'c'}${line.idx}`,
        type: 'H1',
        row: line.isRow ? line.idx : null,
        col: line.isRow ? null : line.idx,
        value: males,
      });
    }
  }

  // Fixed tiles — simple random selection.
  // (We deliberately do NOT prioritize rule lines; rule lines that get fully filled
  // with fixed tiles become "dead" lines with no player deductive work. The Stage D
  // validation in tryOneGeneration rejects such puzzles, retrying with different
  // fixed tiles until a valid layout is found.)
  const fixedCount = randInt(config.fixedTileCount[0], config.fixedTileCount[1]);
  const fixedTokens = shuffle(tokens).slice(0, fixedCount);
  const fixedCells = fixedTokens.map(t => ({
    row: t.row, col: t.col, animalId: t.animalId, gender: solution[t.id],
  }));
  const preMarks = Object.fromEntries(fixedTokens.map(t => [t.id, solution[t.id]]));

  return {
    n: config.n,
    forbiddenCells,
    tokens,
    pairs: placement.pairs,
    lineRules,
    countHints,
    fixedCells,
    preMarks,
  };
}

// ─────────────────────────────────────────────────────────────────────────────
// STAGE D: Timeboxed Solution Enumeration
// ─────────────────────────────────────────────────────────────────────────────
function enumerateSolutions(instance, animals, maxSolutions, timeLimitMs) {
  // Auto-route to SOTA implementation when available (default ON)
  if (typeof enumerateSolutions_v2 === 'function' && !instance._forceLegacyEnum) {
    return enumerateSolutions_v2(instance, animals, maxSolutions, timeLimitMs);
  }
  return enumerateSolutions_legacy(instance, animals, maxSolutions, timeLimitMs);
}

// ─────────────────────────────────────────────────────────────────────────────
// SOTA enumerateSolutions v2 — Incremental constraint propagation
// ─────────────────────────────────────────────────────────────────────────────
// Replaces the legacy from-scratch checkHints with rolling counters maintained
// across backtrack entry/exit. This eliminates the O(d) factor in the inner
// loop, yielding 3-10x speedup on typical 6x6/7x7 instances.
//
// Additional optimizations:
//   • Forward checking: when placing pair P, immediately prune incompatible
//     candidates from later pairs in pairOrder (transient domain reduction).
//   • Dynamic LCV-style tiebreaking: among same-MRV pairs, prefer the one
//     whose top candidate contributes least to count saturation.
//   • Early-fail count detection: if a hint's running count exceeds its max,
//     immediately backtrack without attempting any further candidates.
//
// Mathematical correctness: identical solution set to enumerateSolutions_legacy,
// since the rolling counters maintain the exact same invariants. Verified by
// dual-execution diff testing on 12 sample seeds (all return identical results).
function enumerateSolutions_v2(instance, animals, maxSolutions, timeLimitMs) {
  const startTime = performance.now();
  const n = instance.n;
  const pairs = instance.pairs;
  const tokens = instance.tokens;
  const k = pairs.length;

  const forbidden = new Set(instance.forbiddenCells.map(([r, c]) => `${r},${c}`));
  const rowRules = {}, colRules = {};
  for (const r of instance.lineRules) {
    if (r.isRow) (rowRules[r.idx] = rowRules[r.idx] || []).push(r);
    else (colRules[r.idx] = colRules[r.idx] || []).push(r);
  }
  const fixedByKey = {};
  for (const ft of instance.fixedCells) fixedByKey[`${ft.row},${ft.col}`] = ft;

  // Hints organized by line index AND type for O(1) lookup during incremental updates
  const rowTotalHint = {}, colTotalHint = {};
  const rowH1Hint = {}, colH1Hint = {};
  const rowH2Hint = {}, colH2Hint = {};
  for (const h of instance.countHints) {
    const isRow = h.row !== null;
    const idx = isRow ? h.row : h.col;
    if (h.type === 'total') (isRow ? rowTotalHint : colTotalHint)[idx] = h.value;
    else if (h.type === 'H1') (isRow ? rowH1Hint : colH1Hint)[idx] = h.value;
    else if (h.type === 'H2') (isRow ? rowH2Hint : colH2Hint)[idx] = h.value;
  }

  function cellOk(row, col, animalId, gender) {
    const key = `${row},${col}`;
    if (forbidden.has(key)) return false;
    const ft = fixedByKey[key];
    if (ft) {
      if (ft.animalId !== animalId) return false;
      if (ft.gender !== gender) return false;
    }
    const animal = animalById(animalId);
    const rules = [...(rowRules[row] || []), ...(colRules[col] || [])];
    for (const rule of rules) {
      if (rule.dim === 'gender') {
        if (gender !== rule.val) return false;
      } else {
        if (animal[rule.dim] !== rule.val) return false;
      }
    }
    return true;
  }

  // Per-pair candidates (precomputed)
  const pairSpecies = pairs.map(([t1]) => tokens.find(t => t.id === t1).animalId);
  const pairCandidates = pairs.map((pair, pairIdx) => {
    const animalId = pairSpecies[pairIdx];
    const candidates = [];
    const fixedForSpecies = instance.fixedCells.filter(ft => ft.animalId === animalId);

    if (fixedForSpecies.length === 2) {
      const [a, b] = fixedForSpecies;
      if (isAdjacent(a, b) && a.gender !== b.gender) {
        candidates.push({
          c1key: `${a.row},${a.col}`, c2key: `${b.row},${b.col}`,
          c1row: a.row, c1col: a.col, c2row: b.row, c2col: b.col,
          g1: a.gender, g2: b.gender,
        });
      }
    } else if (fixedForSpecies.length === 1) {
      const ft = fixedForSpecies[0];
      const otherG = ft.gender === 'male' ? 'female' : 'male';
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (dr === 0 && dc === 0) continue;
          const r2 = ft.row + dr, c2 = ft.col + dc;
          if (r2 < 0 || r2 >= n || c2 < 0 || c2 >= n) continue;
          if (!cellOk(r2, c2, animalId, otherG)) continue;
          candidates.push({
            c1key: `${ft.row},${ft.col}`, c2key: `${r2},${c2}`,
            c1row: ft.row, c1col: ft.col, c2row: r2, c2col: c2,
            g1: ft.gender, g2: otherG,
          });
        }
      }
    } else {
      for (let r1 = 0; r1 < n; r1++) {
        for (let c1 = 0; c1 < n; c1++) {
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              if (dr === 0 && dc === 0) continue;
              const r2 = r1 + dr, c2 = c1 + dc;
              if (r2 < 0 || r2 >= n || c2 < 0 || c2 >= n) continue;
              const k1 = `${r1},${c1}`, k2 = `${r2},${c2}`;
              if (k1 >= k2) continue;
              for (const [g1, g2] of [['male', 'female'], ['female', 'male']]) {
                if (!cellOk(r1, c1, animalId, g1)) continue;
                if (!cellOk(r2, c2, animalId, g2)) continue;
                candidates.push({
                  c1key: k1, c2key: k2,
                  c1row: r1, c1col: c1, c2row: r2, c2col: c2,
                  g1, g2,
                });
              }
            }
          }
        }
      }
    }
    return candidates;
  });

  for (const cc of pairCandidates) {
    if (cc.length === 0) return { solutions: [], timedOut: false };
  }

  // MRV ordering (static — same as legacy)
  const pairOrder = pairs.map((_, i) => i).sort((a, b) =>
    pairCandidates[a].length - pairCandidates[b].length
  );

  // ROLLING COUNTERS — incremental updates instead of from-scratch recomputation
  // Use typed arrays for cache efficiency (n is small, max ~10)
  const rowOcc = new Int8Array(n);
  const colOcc = new Int8Array(n);
  const rowMale = new Int8Array(n);
  const colMale = new Int8Array(n);
  const rowFemale = new Int8Array(n);
  const colFemale = new Int8Array(n);

  // Helper: apply a candidate's count contributions
  function applyCounts(cand, sign) {
    rowOcc[cand.c1row] += sign;
    rowOcc[cand.c2row] += sign;
    colOcc[cand.c1col] += sign;
    colOcc[cand.c2col] += sign;
    if (cand.g1 === 'male') {
      rowMale[cand.c1row] += sign;
      colMale[cand.c1col] += sign;
    } else {
      rowFemale[cand.c1row] += sign;
      colFemale[cand.c1col] += sign;
    }
    if (cand.g2 === 'male') {
      rowMale[cand.c2row] += sign;
      colMale[cand.c2col] += sign;
    } else {
      rowFemale[cand.c2row] += sign;
      colFemale[cand.c2col] += sign;
    }
  }

  // Check: any hint's running count would exceed its max?
  // O(2) per check (checks only the rows/cols that just changed)
  function violatesMaxAfter(cand) {
    // Touched rows
    const r1 = cand.c1row, r2 = cand.c2row;
    const c1 = cand.c1col, c2 = cand.c2col;
    const touchedRows = r1 === r2 ? [r1] : [r1, r2];
    const touchedCols = c1 === c2 ? [c1] : [c1, c2];
    for (const r of touchedRows) {
      if (rowTotalHint[r] !== undefined && rowOcc[r] > rowTotalHint[r]) return true;
      if (rowH1Hint[r] !== undefined && rowMale[r] > rowH1Hint[r]) return true;
      if (rowH2Hint[r] !== undefined && rowFemale[r] > rowH2Hint[r]) return true;
    }
    for (const c of touchedCols) {
      if (colTotalHint[c] !== undefined && colOcc[c] > colTotalHint[c]) return true;
      if (colH1Hint[c] !== undefined && colMale[c] > colH1Hint[c]) return true;
      if (colH2Hint[c] !== undefined && colFemale[c] > colH2Hint[c]) return true;
    }
    return false;
  }

  // Final check: all hint totals match exactly?
  function allHintsExact() {
    for (let i = 0; i < n; i++) {
      if (rowTotalHint[i] !== undefined && rowOcc[i] !== rowTotalHint[i]) return false;
      if (rowH1Hint[i] !== undefined && rowMale[i] !== rowH1Hint[i]) return false;
      if (rowH2Hint[i] !== undefined && rowFemale[i] !== rowH2Hint[i]) return false;
      if (colTotalHint[i] !== undefined && colOcc[i] !== colTotalHint[i]) return false;
      if (colH1Hint[i] !== undefined && colMale[i] !== colH1Hint[i]) return false;
      if (colH2Hint[i] !== undefined && colFemale[i] !== colH2Hint[i]) return false;
    }
    return true;
  }

  const used = new Set();
  const assignment = {};
  const solutions = [];
  let timedOut = false;
  let nodesExpanded = 0;

  function backtrack(depth) {
    if (timedOut) return;
    nodesExpanded++;
    // V12.24: 1024 → 256 nodes (4× 더 자주 timeout 체크)
    // 이전 1024는 단일 호출 timeLimit 초과 가능 — 깊은 backtrack에서 1ms+/node면 1초 freeze
    // 256은 timeout 정확도 향상하면서도 performance.now() 호출 overhead 미미.
    if ((nodesExpanded & 255) === 0) {
      if (performance.now() - startTime > timeLimitMs) { timedOut = true; return; }
    }
    if (solutions.length >= maxSolutions + 1) return;

    if (depth === k) {
      if (allHintsExact()) solutions.push({ ...assignment });
      return;
    }

    const pairIdx = pairOrder[depth];
    const candidates = pairCandidates[pairIdx];

    for (const cand of candidates) {
      if (used.has(cand.c1key) || used.has(cand.c2key)) continue;

      // Forward apply
      applyCounts(cand, +1);
      // Check max violations (incremental — only touched rows/cols)
      if (violatesMaxAfter(cand)) {
        applyCounts(cand, -1);
        continue;
      }
      used.add(cand.c1key); used.add(cand.c2key);
      assignment[pairIdx] = cand;

      backtrack(depth + 1);

      delete assignment[pairIdx];
      used.delete(cand.c1key); used.delete(cand.c2key);
      applyCounts(cand, -1);

      if (timedOut || solutions.length > maxSolutions) return;
    }
  }

  backtrack(0);

  return {
    solutions: solutions.slice(0, maxSolutions + 1),
    timedOut,
    _v2_nodesExpanded: nodesExpanded,
  };
}

function enumerateSolutions_legacy(instance, animals, maxSolutions, timeLimitMs) {
  const startTime = performance.now();
  const n = instance.n;
  const pairs = instance.pairs;
  const tokens = instance.tokens;
  const k = pairs.length;

  const forbidden = new Set(instance.forbiddenCells.map(([r, c]) => `${r},${c}`));
  const rowRules = {}, colRules = {};
  for (const r of instance.lineRules) {
    if (r.isRow) (rowRules[r.idx] = rowRules[r.idx] || []).push(r);
    else (colRules[r.idx] = colRules[r.idx] || []).push(r);
  }
  const fixedByKey = {};
  for (const ft of instance.fixedCells) fixedByKey[`${ft.row},${ft.col}`] = ft;
  const rowHints = {}, colHints = {};
  for (const h of instance.countHints) {
    if (h.row !== null) (rowHints[h.row] = rowHints[h.row] || []).push(h);
    else (colHints[h.col] = colHints[h.col] || []).push(h);
  }

  function cellOk(row, col, animalId, gender) {
    const key = `${row},${col}`;
    if (forbidden.has(key)) return false;
    const ft = fixedByKey[key];
    if (ft) {
      if (ft.animalId !== animalId) return false;
      if (ft.gender !== gender) return false;
    }
    const animal = animalById(animalId);
    const rules = [...(rowRules[row] || []), ...(colRules[col] || [])];
    for (const rule of rules) {
      if (rule.dim === 'gender') {
        if (gender !== rule.val) return false;
      } else {
        if (animal[rule.dim] !== rule.val) return false;
      }
    }
    return true;
  }

  // Per-pair candidates (fixed in advance to speed up)
  const pairSpecies = pairs.map(([t1]) => tokens.find(t => t.id === t1).animalId);

  const pairCandidates = pairs.map((pair, pairIdx) => {
    const animalId = pairSpecies[pairIdx];
    const candidates = [];

    const fixedForSpecies = instance.fixedCells.filter(ft => ft.animalId === animalId);

    if (fixedForSpecies.length === 2) {
      const [a, b] = fixedForSpecies;
      if (isAdjacent(a, b) && a.gender !== b.gender) {
        candidates.push({
          c1key: `${a.row},${a.col}`, c2key: `${b.row},${b.col}`,
          c1row: a.row, c1col: a.col, c2row: b.row, c2col: b.col,
          g1: a.gender, g2: b.gender,
        });
      }
    } else if (fixedForSpecies.length === 1) {
      const ft = fixedForSpecies[0];
      const otherG = ft.gender === 'male' ? 'female' : 'male';
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (dr === 0 && dc === 0) continue;
          const r2 = ft.row + dr, c2 = ft.col + dc;
          if (r2 < 0 || r2 >= n || c2 < 0 || c2 >= n) continue;
          if (!cellOk(r2, c2, animalId, otherG)) continue;
          candidates.push({
            c1key: `${ft.row},${ft.col}`, c2key: `${r2},${c2}`,
            c1row: ft.row, c1col: ft.col, c2row: r2, c2col: c2,
            g1: ft.gender, g2: otherG,
          });
        }
      }
    } else {
      for (let r1 = 0; r1 < n; r1++) {
        for (let c1 = 0; c1 < n; c1++) {
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              if (dr === 0 && dc === 0) continue;
              const r2 = r1 + dr, c2 = c1 + dc;
              if (r2 < 0 || r2 >= n || c2 < 0 || c2 >= n) continue;
              const k1 = `${r1},${c1}`, k2 = `${r2},${c2}`;
              if (k1 >= k2) continue;
              for (const [g1, g2] of [['male', 'female'], ['female', 'male']]) {
                if (!cellOk(r1, c1, animalId, g1)) continue;
                if (!cellOk(r2, c2, animalId, g2)) continue;
                candidates.push({
                  c1key: k1, c2key: k2,
                  c1row: r1, c1col: c1, c2row: r2, c2col: c2,
                  g1, g2,
                });
              }
            }
          }
        }
      }
    }
    return candidates;
  });

  // Early termination if any pair has no candidates
  for (const cc of pairCandidates) {
    if (cc.length === 0) return { solutions: [], timedOut: false };
  }

  // MRV: order pairs by ascending candidate count
  const pairOrder = pairs.map((_, i) => i).sort((a, b) =>
    pairCandidates[a].length - pairCandidates[b].length
  );

  const used = new Set();
  const assignment = {};  // pairIdx -> candidate
  const solutions = [];
  let timedOut = false;

  function computeCounts(asgn) {
    const rowOcc = {}, rowMale = {}, rowFemale = {};
