function BadgeTooltip({ show, text, anchorRef }) {
  // Portal-rendered tooltip anchored via getBoundingClientRect — escapes any
  // overflow clipping from parent containers and auto-flips when too close
  // to the viewport top.
  const [pos, setPos] = useState(null);
  const tipBoxRef = useRef(null);
  const [measuredW, setMeasuredW] = useState(0);
  const [measuredH, setMeasuredH] = useState(0);
  useEffect(() => {
    if (!show || !anchorRef || !anchorRef.current) { setPos(null); return; }
    const update = () => {
      const el = anchorRef.current;
      if (!el) return;
      const r = el.getBoundingClientRect();
      // If element is detached or zero-sized (just unmounted/remounted),
      // skip — prevents pinning to (0,0) corner.
      if (r.width === 0 && r.height === 0) return;
      const vw = window.innerWidth;
      const cx = r.left + r.width / 2;
      const cy = r.top + r.height / 2;
      const preferredTop = r.top - 8;
      const flipBelow = preferredTop < 40; // flip to below if too close to top
      setPos({
        cx, cy,
        top: flipBelow ? r.bottom + 8 : r.top - 8,
        flip: flipBelow,
        anchorLeft: r.left,
        anchorRight: r.right,
        vw,
      });
    };
    update();
    // Also re-run on next frame in case anchor was just remounted —
    // getBoundingClientRect can return stale values immediately after re-show.
    const raf = requestAnimationFrame(update);
    window.addEventListener('resize', update);
    window.addEventListener('scroll', update, true);
    return () => {
      cancelAnimationFrame(raf);
      window.removeEventListener('resize', update);
      window.removeEventListener('scroll', update, true);
    };
  }, [show, anchorRef, text]);

  // Measure actual rendered tooltip box AFTER mount so position is based on
  // real dimensions, not the conservative max width.
  useEffect(() => {
    if (!show || !pos || !tipBoxRef.current) return;
    const r = tipBoxRef.current.getBoundingClientRect();
    if (r.width > 0 && Math.abs(r.width - measuredW) > 0.5) setMeasuredW(r.width);
    if (r.height > 0 && Math.abs(r.height - measuredH) > 0.5) setMeasuredH(r.height);
  }, [show, pos, text, measuredW, measuredH]);

  if (!show || !pos) return null;
  const EDGE = 8;
  const MAX_TIP_W = Math.min(260, pos.vw - EDGE * 2);
  const effectiveW = measuredW > 0 ? Math.min(measuredW, MAX_TIP_W) : MAX_TIP_W;
  const halfW = effectiveW / 2;

  // Decide placement based on the anchor's position in the viewport.
  // If the anchor sits in the right 25% of the viewport, prefer 'left'
  // placement (box extends leftward). Likewise for the left 25%.
  // This produces predictable side-placement behavior independent of the
  // tooltip text length, fixing the "tall narrow column" symptom that
  // happened when the centered placement got squashed near the edge.
  // The geometric overflow check is a fallback for extreme cases.
  const SIDE_THRESHOLD = 0.25;
  const anchorRatio = pos.cx / pos.vw;
  const wouldOverflowRight = pos.cx + halfW > pos.vw - EDGE;
  const wouldOverflowLeft = pos.cx - halfW < EDGE;
  let placement;
  if (anchorRatio > 1 - SIDE_THRESHOLD || wouldOverflowRight) {
    // Right edge zone — prefer 'left' (box extends leftward from anchor)
    if (wouldOverflowLeft && !wouldOverflowRight) {
      // Edge case: box can't fit either side — fall back to top/bottom
      placement = pos.flip ? 'bottom' : 'top';
    } else {
      placement = 'left';
    }
  } else if (anchorRatio < SIDE_THRESHOLD || wouldOverflowLeft) {
    if (wouldOverflowRight && !wouldOverflowLeft) {
      placement = pos.flip ? 'bottom' : 'top';
    } else {
      placement = 'right';
    }
  } else {
    placement = pos.flip ? 'bottom' : 'top';
  }

  // Style by placement
  let boxStyle = {};
  let arrowStyle = {};
  const halfH = (measuredH > 0 ? measuredH : 24) / 2;
  if (placement === 'top' || placement === 'bottom') {
    // Vertical placement (default)
    const clampedCx = Math.max(EDGE + halfW, Math.min(pos.vw - EDGE - halfW, pos.cx));
    const rawOffset = pos.cx - clampedCx;
    const ARROW_PAD = 6;
    const maxArrowOffset = Math.max(0, halfW - ARROW_PAD);
    const arrowOffset = Math.max(-maxArrowOffset, Math.min(maxArrowOffset, rawOffset));
    boxStyle = {
      left: clampedCx,
      top: pos.top,
      transform: placement === 'bottom' ? 'translate(-50%, 0)' : 'translate(-50%, -100%)',
    };
    arrowStyle = {
      [placement === 'bottom' ? 'bottom' : 'top']: '100%',
      left: `calc(50% + ${arrowOffset}px)`,
      transform: 'translateX(-50%)',
      borderLeft: '5px solid transparent',
      borderRight: '5px solid transparent',
      ...(placement === 'bottom'
        ? { borderBottom: '5px solid var(--ink-primary)' }
        : { borderTop: '5px solid var(--ink-primary)' }),
    };
  } else {
    // Side placement — box extends sideways from anchor
    // Vertical center alignment with anchor; clamp inside viewport.
    const vh = window.innerHeight;
    const clampedCy = Math.max(EDGE + halfH, Math.min(vh - EDGE - halfH, pos.cy));
    // Available horizontal space on the side we're rendering on, minus EDGE margin
    if (placement === 'left') {
      const sideMaxW = Math.max(60, pos.anchorLeft - 8 - EDGE);
      // box is to the LEFT of anchor; right edge of box ~ 8px before anchor's left
      boxStyle = {
        left: pos.anchorLeft - 8,
        top: clampedCy,
        transform: 'translate(-100%, -50%)',
        maxWidth: Math.min(MAX_TIP_W, sideMaxW),
      };
      arrowStyle = {
        left: '100%',
        top: `calc(50% + ${pos.cy - clampedCy}px)`,
        transform: 'translateY(-50%)',
        borderTop: '5px solid transparent',
        borderBottom: '5px solid transparent',
        borderLeft: '5px solid var(--ink-primary)',
      };
    } else { // 'right'
      const sideMaxW = Math.max(60, pos.vw - pos.anchorRight - 8 - EDGE);
      boxStyle = {
        left: pos.anchorRight + 8,
        top: clampedCy,
        transform: 'translate(0, -50%)',
        maxWidth: Math.min(MAX_TIP_W, sideMaxW),
      };
      arrowStyle = {
        right: '100%',
        top: `calc(50% + ${pos.cy - clampedCy}px)`,
        transform: 'translateY(-50%)',
        borderTop: '5px solid transparent',
        borderBottom: '5px solid transparent',
        borderRight: '5px solid var(--ink-primary)',
      };
    }
  }

  return ReactDOM.createPortal(
    <div ref={tipBoxRef} role="tooltip" style={{
      position: 'fixed',
      zIndex: 1000,
      background: 'var(--ink-primary)', color: 'var(--bg-paper)',
      padding: '6px 10px', borderRadius: 4,
      fontSize: 12, fontWeight: 500, lineHeight: 1.35,
      letterSpacing: '0.01em',
      maxWidth: MAX_TIP_W,
      whiteSpace: 'normal', textAlign: 'center',
      boxShadow: '0 4px 14px -4px rgba(0,0,0,0.25)',
      animation: 'badgeTipFade 120ms cubic-bezier(0.4,0,0.2,1)',
      pointerEvents: 'none',
      // Hide until we've measured the box at least once — prevents the
      // first-frame flash where the tooltip snaps from MAX_TIP_W-based
      // position to its real position.
      visibility: (measuredW > 0 && measuredH > 0) ? 'visible' : 'hidden',
      // Box style overrides (placement-specific position + side maxWidth)
      // applied LAST so they override the defaults above.
      ...boxStyle,
    }} className="font-body">
      {text}
      <span aria-hidden style={{
        position: 'absolute',
        width: 0, height: 0,
        ...arrowStyle,
      }} />
    </div>,
    document.body
  );
}

// ─────────────────────────────────────────────────────────────────
// Global Tooltip Singleton — only ONE badge tooltip is open at a time.
// Prevents stale/stacked tooltips when user rapidly taps multiple badges.
// ─────────────────────────────────────────────────────────────────
const __tooltipBus = (() => {
  const listeners = new Set();
  let activeId = null;
  let nextId = 1;
  let version = 0;  // monotonically increases on every state change
  return {
    register(fn) { listeners.add(fn); return () => listeners.delete(fn); },
    claim() { return nextId++; },
    open(id) {
      version++;
      activeId = id;
      const v = version;
      listeners.forEach(fn => fn(activeId, v));
    },
    close(id) {
      if (activeId === id || id == null) {
        version++;
        activeId = null;
        const v = version;
        listeners.forEach(fn => fn(activeId, v));
      }
    },
    getActive() { return activeId; },
    getVersion() { return version; },
  };
})();

// Global outside-tap listener — closes any open tooltip when user taps
// something that isn't a badge. Installed once.
if (typeof window !== 'undefined' && !window.__badgeTooltipGlobalInstalled) {
  window.__badgeTooltipGlobalInstalled = true;
  window.addEventListener('pointerdown', (ev) => {
    // If the pointer lands on a badge element, that badge's own handler
    // will claim the tip. Otherwise close whatever is open.
    if (!(ev.target && ev.target.closest && ev.target.closest('[data-badge-tip="1"]'))) {
      __tooltipBus.close(null);
    }
  }, { capture: true, passive: true });
}

// Global system-gesture suppression — installed once.
// Prevents the platform's default reactions to long-press / right-click /
// native drag (image save menu, context menu, drag-out-of-window). These
// fight with the puzzle's own pointer-drag and long-press semantics.
// Elements that should opt out (e.g. selectable text in a help dialog)
// can carry data-selectable="1" — handled inline below.
if (typeof window !== 'undefined' && !window.__zoogramsGestureSuppressionInstalled) {
  window.__zoogramsGestureSuppressionInstalled = true;
  // Right-click / long-press context menu
  window.addEventListener('contextmenu', (ev) => {
    const t = ev.target;
    if (t && t.closest && t.closest('[data-selectable="1"]')) return; // allow on opted-in regions
    ev.preventDefault();
  }, { capture: true });
  // Native HTML5 drag — we use pointer events for our own drag, so block
  // browsers from initiating native drag (which would let users drag images
  // out of the page).
  window.addEventListener('dragstart', (ev) => {
    ev.preventDefault();
  }, { capture: true });
  // Selection — suppress accidental text selection on long-press (especially
  // affects element labels). Opt-in regions still allow selection via CSS.
  window.addEventListener('selectstart', (ev) => {
    const t = ev.target;
    if (t && t.closest && t.closest('[data-selectable="1"]')) return;
    ev.preventDefault();
  }, { capture: true });
}

function useBadgeTooltip() {
  const [open, setOpen] = useState(false);
  const idRef = useRef(null);
  const timerRef = useRef(null);
  const activePointerRef = useRef(null);
  const anchorRef = useRef(null);
  // Replaces the 400ms touchFlowRef dwell. Stamps each touch flow with the
  // bus version at the moment beginTouch was called. Subsequent showTimed
  // calls compare against this stamp — if version has advanced (i.e. the
  // touch flow has fully ended via hide()), showTimed proceeds normally.
  const touchVersionRef = useRef(-1);

  if (idRef.current == null) idRef.current = __tooltipBus.claim();

  // Subscribe to bus — close this tip whenever another badge claims the bus.
  // We also compare versions to ignore stale callbacks: only the latest event
  // should drive state.
  const lastSeenVersionRef = useRef(0);
  useEffect(() => {
    return __tooltipBus.register((activeId, version) => {
      if (version < lastSeenVersionRef.current) return; // stale event
      lastSeenVersionRef.current = version;
      if (activeId !== idRef.current) {
        if (timerRef.current) { clearTimeout(timerRef.current); timerRef.current = null; }
        setOpen(false);
        activePointerRef.current = null;
      }
    });
  }, []);

  const clearTimer = () => {
    if (timerRef.current) { clearTimeout(timerRef.current); timerRef.current = null; }
  };

  const hide = useCallback(() => {
    clearTimer();
    setOpen(false);
    activePointerRef.current = null;
    __tooltipBus.close(idRef.current);
    // Mark touch flow as ended; any subsequent showTimed will be allowed
    // since the version is now stale relative to the latest bus state.
    touchVersionRef.current = -1;
  }, []);

  // Mouse hover path
  const show = useCallback(() => {
    clearTimer();
    __tooltipBus.open(idRef.current);
    setOpen(true);
  }, []);

  // Click / keyboard path — auto-dismiss. Bail only if a CURRENT touch flow
  // (one whose version is still the latest) is in progress for this hook.
  const showTimed = useCallback(() => {
    const inActiveTouch = touchVersionRef.current > 0
      && touchVersionRef.current === __tooltipBus.getVersion()
      && __tooltipBus.getActive() === idRef.current;
    if (inActiveTouch) return; // touch flow already showing this tip — don't restart
    clearTimer();
    __tooltipBus.open(idRef.current);
    setOpen(true);
    timerRef.current = setTimeout(() => {
      setOpen(false);
      __tooltipBus.close(idRef.current);
      timerRef.current = null;
    }, 2500);
  }, []);

  // Touch path — opens on pointerdown, closes on up/cancel OR when finger
  // moves outside the anchor's bounding rect.
  const beginTouch = useCallback((e, el) => {
    anchorRef.current = el;
    activePointerRef.current = e.pointerId;
    try { el.releasePointerCapture(e.pointerId); } catch (err) {}
    clearTimer();
    __tooltipBus.open(idRef.current);
    // Stamp this touch flow with the version we just incremented to.
    touchVersionRef.current = __tooltipBus.getVersion();
    setOpen(true);
  }, []);

  useEffect(() => {
    if (!open || activePointerRef.current == null) return;

    const onMove = (ev) => {
      if (ev.pointerId !== activePointerRef.current) return;
      const el = anchorRef.current;
      if (!el) return;
      const r = el.getBoundingClientRect();
      const inside = ev.clientX >= r.left && ev.clientX <= r.right
                   && ev.clientY >= r.top  && ev.clientY <= r.bottom;
      if (!inside) hide();
    };
    const onEnd = (ev) => {
      if (ev.pointerId !== activePointerRef.current) return;
      hide();
    };

    window.addEventListener('pointermove', onMove, { passive: true });
    window.addEventListener('pointerup', onEnd, { passive: true });
    window.addEventListener('pointercancel', onEnd, { passive: true });
    return () => {
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onEnd);
      window.removeEventListener('pointercancel', onEnd);
    };
  }, [open, hide]);

  useEffect(() => () => clearTimer(), []);
  return { open, show, hide, showTimed, beginTouch };
}

function LineRuleBadge({ rule, ok, status, compact, iconOnly, slotW, slotH }) {
  const t = useT();
  let icon, label;
  if (rule.dim === 'gender') {
    icon = rule.val === 'male' ? '♂' : '♀';
    label = t(rule.val === 'male' ? 'gender.male' : 'gender.female');
  } else {
    icon = ATTR_ICON[rule.val] || '•';
    label = translateValue(rule.val, t);
  }
  const tip = useBadgeTooltip();
  const anchorRef = useRef(null);
  const tipText = t('linerule.tip', { label });
  // Label visibility:
  //   - Tiny phone (iconOnly): NEVER show label (emoji-only).
  //   - Otherwise: show label for habitat AND diet (gender stays as ♂/♀ glyph).
  // Adaptive sizing below will auto-fall-back to icon-only if text doesn't fit.
  const showLabel = !iconOnly && (rule.dim === 'habitat' || rule.dim === 'diet');
  // Slot footprint
  const fallback = iconOnly ? 26 : (compact ? 28 : 32);
  const W = slotW || fallback;
  const H = slotH || fallback;
  // Resolve effective state: prefer `status` (4-state) over legacy `ok` boolean
  const effState = status || (ok ? 'satisfied' : 'empty');
  // Style by effective state — green for satisfied, red for bad, neutral otherwise
  const styleMap = (() => {
    if (effState === 'satisfied') {
      return { bg: 'rgba(22, 163, 74, 0.14)', border: '1px solid rgba(22, 163, 74, 0.65)', color: '#15803D', iconColor: '#15803D', weight: 600, shadow: '0 0 0 2px rgba(22, 163, 74, 0.08)' };
    }
    if (effState === 'bad') {
      return { bg: 'rgba(220, 38, 38, 0.14)', border: '1px solid rgba(220, 38, 38, 0.65)', color: 'var(--danger)', iconColor: 'var(--danger)', weight: 600, shadow: '0 0 0 2px rgba(220, 38, 38, 0.08)' };
    }
    // empty / partial → idle neutral
    return { bg: 'var(--bg-card)', border: '1px solid var(--border-medium)', color: 'var(--ink-secondary)', iconColor: 'var(--ink-primary)', weight: 500, shadow: 'none' };
  })();
  // Adaptive text sizing: shrink label font when slot width is tight.
  const textBudget = Math.max(0, W - 14 - 4 - 8);
  const labelFontSize = showLabel
    ? Math.max(9, Math.min(12, Math.floor(textBudget / Math.max(2, label.length) * 1.6)))
    : 0;
  const labelFits = !showLabel || (labelFontSize * label.length * 0.62 <= textBudget);
  const showLabelFinal = showLabel && labelFits;
  return (
    <div
      ref={anchorRef}
      data-badge-tip="1"
      role="button" tabIndex={0}
      aria-label={t('linerule.aria', { tip: tipText, ok: effState === 'satisfied' })}
      onPointerEnter={(e) => { if (e.pointerType === 'mouse') tip.show(); }}
      onPointerLeave={(e) => { if (e.pointerType === 'mouse') tip.hide(); }}
      onPointerDown={(e) => { if (e.pointerType !== 'mouse') tip.beginTouch(e, e.currentTarget); }}
      onClick={(e) => { if (!e.pointerType || e.pointerType === 'mouse') tip.showTimed(); }}
      onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tip.showTimed(); } }}
      style={{
        width: W,
        height: H,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        gap: showLabelFinal ? 3 : 0,
        padding: showLabelFinal ? '0 4px' : 0,
        background: styleMap.bg, border: styleMap.border, borderRadius: 4,
        color: styleMap.color,
        transition: 'all 220ms cubic-bezier(0.4,0,0.2,1)',
        position: 'relative', flexShrink: 0,
        boxShadow: styleMap.shadow,
        cursor: 'help',
        whiteSpace: 'nowrap',
        overflow: 'hidden',
      }}>
      <span style={{
        fontSize: showLabelFinal
          ? Math.max(12, Math.round(H * 0.5))
          : Math.max(15, Math.round(H * 0.62)),
        fontFamily: rule.dim === 'gender' ? "'Fraunces', serif" : 'inherit',
        fontWeight: styleMap.weight,
        color: styleMap.iconColor,
        lineHeight: 1,
        display: 'block',
        flexShrink: 0,
      }} aria-hidden>{icon}</span>
      {showLabelFinal && (
        <span className="font-display" style={{
          fontSize: labelFontSize,
          fontWeight: styleMap.weight,
          color: styleMap.color,
          lineHeight: 1,
          letterSpacing: '-0.02em',
          minWidth: 0,
          overflow: 'hidden',
          textOverflow: 'ellipsis',
          whiteSpace: 'nowrap',
        }}>{label}</span>
      )}
      <BadgeTooltip show={tip.open} text={tipText} anchorRef={anchorRef} />
    </div>
  );
}

// Generic "one specimen" glyph used as the universal animal-count unit.
// Replaces the localized "마리 / 只 / 匹 / ct" word AND the species-biased
// pawprint. Drawn as an abstract head-on-body silhouette — neutral across
// mammal / bird / reptile / fish / insect — to read as "one organism" without
// implying any particular taxonomic class. `currentColor` so it inherits the
// badge's state color (idle ink, gold for met, red for over).
function CreatureIcon({ size = 12, style }) {
  // viewBox tightened horizontally (4 → 20 instead of 0 → 24) so the glyph
  // sits flush within its box, letting it align on the same optical rhythm
  // as the ♂/♀ characters next to the count number.
  return (
    <svg
      viewBox="4 0 16 24"
      width={(size * 16) / 24}
      height={size}
      aria-hidden="true"
      focusable="false"
      style={{ display: 'block', flexShrink: 0, ...style }}
    >
      {/* head — small circle, sits above-left for a hint of profile */}
      <circle cx="12" cy="6.5" r="3.2" fill="currentColor" />
      {/* body — rounded trapezoid / dome, anchors as a single being.
          Wider at the bottom, narrows where it meets the head. */}
      <path
        d="M5.2 20.5
           C 5.2 16.8, 7.8 11.5, 12 11.5
           C 16.2 11.5, 18.8 16.8, 18.8 20.5
           C 18.8 21.0, 18.4 21.3, 17.9 21.3
           L 6.1 21.3
           C 5.6 21.3, 5.2 21.0, 5.2 20.5 Z"
        fill="currentColor"
      />
    </svg>
  );
}

function CountHintBadge({ hint, currentValue, ok, over, compact, iconOnly, paired, pairedSize }) {
  const t = useT();
  const isTotal = hint.type === 'total';
  const kind = isTotal ? null : (hint.type === 'H1' ? '♂' : '♀');
  // Size strategy — RIGID across solo and paired states:
  //   Whether one count badge is shown alone or two are paired side-by-side,
  //   each individual badge uses the SAME compact dimensions and font sizes.
  //   This keeps both rows (rule row + count row) aligned cell-for-cell.
  //   `paired` arg is kept for backwards compat but no longer changes geometry.
  const size = pairedSize
    ? pairedSize
    : (iconOnly ? 26 : (compact ? 28 : 32));
  const widthPx = size;
  const kindLabel = t(hint.type === 'total' ? 'count.kind.total' : hint.type === 'H1' ? 'count.kind.male' : 'count.kind.female');
  const tip = useBadgeTooltip();
  const anchorRef = useRef(null);
  const tipText = t('count.tip', { kind: kindLabel, n: hint.value, over, ok });
  const state = over ? 'over' : (ok ? 'ok' : 'idle');
  const styleMap = {
    over: { bg: 'rgba(220, 38, 38, 0.14)', border: '1px solid rgba(220, 38, 38, 0.65)', color: 'var(--danger)', weight: 700, shadow: '0 0 0 2px rgba(220, 38, 38, 0.08)' },
    ok:   { bg: 'rgba(22, 163, 74, 0.14)', border: '1px solid rgba(22, 163, 74, 0.65)', color: '#15803D', weight: 700, shadow: '0 0 0 2px rgba(22, 163, 74, 0.08)' },
    idle: { bg: 'var(--bg-card)', border: '1px solid var(--border-medium)', color: 'var(--ink-primary)', weight: 600, shadow: 'none' },
  }[state];
  return (
    <div
      ref={anchorRef}
      data-badge-tip="1"
      role="button" tabIndex={0}
      aria-label={t('count.aria', { kind: kindLabel, n: hint.value, ok, over })}
      onPointerEnter={(e) => { if (e.pointerType === 'mouse') tip.show(); }}
      onPointerLeave={(e) => { if (e.pointerType === 'mouse') tip.hide(); }}
      onPointerDown={(e) => { if (e.pointerType !== 'mouse') tip.beginTouch(e, e.currentTarget); }}
      onClick={(e) => { if (!e.pointerType || e.pointerType === 'mouse') tip.showTimed(); }}
      onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tip.showTimed(); } }}
      style={{
        minWidth: size, width: widthPx, height: size,
        display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 1,
        background: styleMap.bg, border: styleMap.border, borderRadius: 4,
        color: styleMap.color,
        padding: '0 2px',
        transition: 'all 220ms', position: 'relative', flexShrink: 0,
        boxShadow: styleMap.shadow,
        lineHeight: 1,
        cursor: 'help',
      }}>
        <span className="font-mono" style={{
          fontSize: iconOnly ? 13 : (compact ? 14 : 15),
          fontWeight: styleMap.weight, lineHeight: 1,
          fontVariantNumeric: 'tabular-nums',
          display: 'block',
        }}>{hint.value}</span>
        {isTotal ? (
          <CreatureIcon
            size={iconOnly ? 14 : (compact ? 15 : 17)}
            style={{ opacity: 0.82 }}
          />
        ) : kind && (
          <span style={{
            fontFamily: "'Fraunces', serif",
            fontSize: iconOnly ? 11 : (compact ? 12 : 13),
            fontWeight: styleMap.weight,
            lineHeight: 1,
            opacity: 0.9,
            display: 'block',
            position: 'relative',
            top: -1,
          }} aria-hidden>{kind}</span>
        )}
      <BadgeTooltip show={tip.open} text={tipText} anchorRef={anchorRef} />
    </div>
  );
}

function animalImgSrc(animalId, gender) {
  const g = gender || 'male';
  const num = (animalId - 1) * 2 + (g === 'male' ? 1 : 2);
  return `${IMAGE_BASE_URL}/${num}.webp`;
}

function AttributeOverlay({ animal, cellSize, anchorRef }) {
  // On very narrow mobile viewports (< 420px), render as a portal-based
  // floating popover above/below the tile — the cell is too small to fit
  // the full name without clipping. On wider viewports, fall back to the
  // original inset overlay which sits inside the cell.
  const [isNarrow, setIsNarrow] = useState(() =>
    typeof window !== 'undefined' && window.innerWidth < 420
  );
  useEffect(() => {
    const onResize = () => setIsNarrow(window.innerWidth < 420);
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);

  if (isNarrow) return <AttributeOverlayFloating animal={animal} anchorRef={anchorRef} />;
  return <AttributeOverlayInset animal={animal} cellSize={cellSize} />;
}

function AttributeOverlayFloating({ animal, anchorRef }) {
  // Portal-rendered floating popover — positioned above the tile with
  // automatic flip to below when near the top edge. Escapes cell overflow
  // clipping so the animal name never gets cut off on narrow mobile.
  const t = useT();
  const { lang } = useLang();
  const animalName = getAnimalName(animal.id, lang) || animal.name;
  const [pos, setPos] = useState(null);
  useEffect(() => {
    if (!anchorRef || !anchorRef.current) { setPos(null); return; }
    const update = () => {
      const el = anchorRef.current;
      if (!el) return;
      const r = el.getBoundingClientRect();
      // Skip detached anchors (zero-sized) — happens during fast remount/cleanup
      if (r.width === 0 && r.height === 0) return;
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const cx = r.left + r.width / 2;
      const spaceAbove = r.top;
      const spaceBelow = vh - r.bottom;
      const flipBelow = spaceAbove < 90 && spaceBelow > spaceAbove;
      setPos({ cx, top: flipBelow ? r.bottom + 6 : r.top - 6, flip: flipBelow, vw });
    };
    update();
    const raf = requestAnimationFrame(update);
    window.addEventListener('resize', update);
    window.addEventListener('scroll', update, true);
    return () => {
      cancelAnimationFrame(raf);
      window.removeEventListener('resize', update);
      window.removeEventListener('scroll', update, true);
    };
  }, [anchorRef, animal.id]);  // include animal.id so the position recomputes when the underlying tile changes

  if (!pos) return null;
  const EDGE = 8;
  const MAX_W = Math.min(200, pos.vw - EDGE * 2);
  const halfW = MAX_W / 2;
  const clampedCx = Math.max(EDGE + halfW, Math.min(pos.vw - EDGE - halfW, pos.cx));
  const arrowOffset = pos.cx - clampedCx;

  return ReactDOM.createPortal(
    <div style={{
      position: 'fixed',
      left: clampedCx, top: pos.top,
      transform: pos.flip ? 'translate(-50%, 0)' : 'translate(-50%, -100%)',
      zIndex: 1000, pointerEvents: 'none',
      minWidth: 120, maxWidth: MAX_W,
      display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
      background: 'var(--bg-paper)',
      border: '1px solid var(--border-medium)',
      borderRadius: 6, padding: '8px 10px',
      boxShadow: '0 8px 24px -6px rgba(0,0,0,0.25)',
      animation: 'badgeTipFade 160ms cubic-bezier(0.4,0,0.2,1)',
    }} className="font-body">
      <div className="font-display" style={{
        fontSize: 14, fontWeight: 600, color: 'var(--ink-primary)',
        marginBottom: 6, letterSpacing: '-0.01em',
        textAlign: 'center', lineHeight: 1.2,
        maxWidth: '100%',
      }}>{animalName}</div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 4, alignItems: 'stretch', width: '100%' }}>
        <div style={{
          display: 'flex', alignItems: 'center', gap: 5,
          padding: '3px 6px', borderRadius: 3,
          background: HABITAT_TINT[animal.habitat],
          border: '1px solid var(--border-soft)',
          fontSize: 11, color: 'var(--ink-primary)', fontWeight: 500, lineHeight: 1.2,
          justifyContent: 'center',
        }}>
          <span style={{ fontSize: 13 }}>{ATTR_ICON[animal.habitat]}</span>
          <span>{translateValue(animal.habitat, t)}</span>
        </div>
        <div style={{
          display: 'flex', alignItems: 'center', gap: 5,
          padding: '3px 6px', borderRadius: 3,
          background: 'var(--bg-subtle)',
          border: '1px solid var(--border-soft)',
          fontSize: 11, color: 'var(--ink-primary)', fontWeight: 500, lineHeight: 1.2,
          justifyContent: 'center',
        }}>
          <span style={{ fontSize: 13 }}>{ATTR_ICON[animal.diet]}</span>
          <span>{translateValue(animal.diet, t)}</span>
        </div>
      </div>
      <span aria-hidden style={{
        position: 'absolute',
        [pos.flip ? 'bottom' : 'top']: '100%',
        left: `calc(50% + ${arrowOffset}px)`,
        transform: 'translateX(-50%)',
        width: 0, height: 0,
        borderLeft: '6px solid transparent', borderRight: '6px solid transparent',
        ...(pos.flip
          ? { borderBottom: '6px solid var(--border-medium)' }
          : { borderTop: '6px solid var(--border-medium)' }),
      }} />
    </div>,
    document.body
  );
}

function PlacedTile({ token, animal, gender, onClick, onDragStart, isRecent, isPartnerPulse, isFixed, cellSize, isAdjacentToPartner, onImgError, isSelected, isDraggingThis }) {
  const t = useT();
  const { lang } = useLang();
  const animalName = getAnimalName(animal.id, lang) || animal.name;
  const sym = gender === 'male' ? '♂' : gender === 'female' ? '♀' : '?';
  const symColor = gender === 'male' ? '#1E3A8A' : gender === 'female' ? '#9D174D' : 'var(--ink-tertiary)';
  const undecided = !gender;
  const tint = HABITAT_TINT[animal.habitat];
  const adjacencyBorder = isAdjacentToPartner === false ? '1.5px solid var(--danger)' : undefined;

  // Hover + long-press state for attribute overlay.
  // Each interaction (pointerdown / mouseenter) bumps the session counter;
  // pending timers stamp the session they were created in and bail out if
  // a newer session has started. This prevents stale timers from re-opening
  // the overlay after a different interaction has cleaned up.
  const [hoverActive, setHoverActive] = useState(false);   // only true after delay
  const [longPressed, setLongPressed] = useState(false);
  const hoverTimerRef = useRef(null);
  const pressTimerRef = useRef(null);
  const pressStartRef = useRef(null);
  const overlayMaxTimerRef = useRef(null);
  const sessionRef = useRef(0);
  const LONG_PRESS_MS = 350;
  const HOVER_DELAY_MS = 500;
  const OVERLAY_MAX_MS = 4000; // hard ceiling — overlay can never persist longer than this

  // Begin a new interaction; invalidates pending timers from previous sessions.
  const bumpSession = useCallback(() => {
    sessionRef.current++;
    return sessionRef.current;
  }, []);

  const startHover = useCallback(() => {
    if (hoverTimerRef.current) clearTimeout(hoverTimerRef.current);
    const mySession = bumpSession();
    hoverTimerRef.current = setTimeout(() => {
      hoverTimerRef.current = null;
      // Bail if a newer session has started since this timer was scheduled
      if (sessionRef.current !== mySession) return;
      setHoverActive(true);
    }, HOVER_DELAY_MS);
  }, [bumpSession]);

  const cancelHover = useCallback(() => {
    if (hoverTimerRef.current) {
      clearTimeout(hoverTimerRef.current);
      hoverTimerRef.current = null;
    }
    setHoverActive(false);
  }, []);

  const startPress = useCallback(() => {
    pressStartRef.current = Date.now();
    if (pressTimerRef.current) clearTimeout(pressTimerRef.current);
    const mySession = sessionRef.current; // session was just bumped by pointerdown
    pressTimerRef.current = setTimeout(() => {
      pressTimerRef.current = null;
      if (sessionRef.current !== mySession) return; // stale
      setLongPressed(true);
    }, LONG_PRESS_MS);
  }, []);

  const cancelPress = useCallback(() => {
    if (pressTimerRef.current) {
      clearTimeout(pressTimerRef.current);
      pressTimerRef.current = null;
    }
  }, []);

  const endPress = useCallback((e) => {
    cancelPress();
    const duration = pressStartRef.current ? Date.now() - pressStartRef.current : 0;
    pressStartRef.current = null;
    // Only trigger click if press was short (normal click, not long-press) AND no drag occurred
    if (duration < LONG_PRESS_MS && !longPressed && !draggedRef.current) {
      if (onClick) onClick(e);
    }
    draggedRef.current = false;
    setLongPressed(false);
  }, [onClick, longPressed, cancelPress]);

  // Track whether pointer movement since pointerdown exceeded drag threshold
  const draggedRef = useRef(false);
  const pressStartXY = useRef({ x: 0, y: 0 });
  const DRAG_SUPPRESS_PX = 6;

  useEffect(() => {
    return () => {
      if (pressTimerRef.current) clearTimeout(pressTimerRef.current);
      if (hoverTimerRef.current) clearTimeout(hoverTimerRef.current);
      if (overlayMaxTimerRef.current) clearTimeout(overlayMaxTimerRef.current);
    };
  }, []);

  const showOverlay = hoverActive || longPressed;
  const tileRef = useRef(null);

  // SAFETY NET — global pointerup/cancel always clears the popup, even when
  // the element's own handlers were missed (iOS mouse-emulation, drag commit,
  // pointer capture transfer, etc).
  useEffect(() => {
    if (!showOverlay) return;
    // Hard ceiling — auto-dismiss after OVERLAY_MAX_MS no matter what
    if (overlayMaxTimerRef.current) clearTimeout(overlayMaxTimerRef.current);
    overlayMaxTimerRef.current = setTimeout(() => {
      sessionRef.current++;  // invalidate any timer that survived
      setHoverActive(false);
      setLongPressed(false);
    }, OVERLAY_MAX_MS);
    const cleanup = () => {
      sessionRef.current++;  // invalidate any timer that survived
      setHoverActive(false);
      setLongPressed(false);
      if (hoverTimerRef.current) { clearTimeout(hoverTimerRef.current); hoverTimerRef.current = null; }
      if (pressTimerRef.current) { clearTimeout(pressTimerRef.current); pressTimerRef.current = null; }
    };
    const onWinUp = () => cleanup();
    const onWinCancel = () => cleanup();
    // If user taps anywhere else, dismiss
    const onWinDown = (ev) => {
      const el = tileRef.current;
      if (!el) { cleanup(); return; }
      if (ev.target && el.contains(ev.target)) return; // tap on this tile — keep
      cleanup();
    };
    window.addEventListener('pointerup', onWinUp, true);
    window.addEventListener('pointercancel', onWinCancel, true);
    window.addEventListener('pointerdown', onWinDown, true);
    return () => {
      window.removeEventListener('pointerup', onWinUp, true);
      window.removeEventListener('pointercancel', onWinCancel, true);
      window.removeEventListener('pointerdown', onWinDown, true);
      if (overlayMaxTimerRef.current) { clearTimeout(overlayMaxTimerRef.current); overlayMaxTimerRef.current = null; }
    };
  }, [showOverlay]);

  return (
    <div
      ref={tileRef}
      onPointerDown={(e) => {
        // Bump session FIRST so any pending timers from previous interactions
        // (including hover from earlier mouseenter) are invalidated.
        bumpSession();
        // Also clear any orphan state from previous session immediately.
        if (hoverTimerRef.current) { clearTimeout(hoverTimerRef.current); hoverTimerRef.current = null; }
        setHoverActive(false);
        setLongPressed(false);
        draggedRef.current = false;
        pressStartXY.current = { x: e.clientX, y: e.clientY };
        if (onDragStart) onDragStart(e); // parent begins pointer drag
        startPress();
      }}
      onPointerMove={(e) => {
        if (draggedRef.current) return;
        const dx = e.clientX - pressStartXY.current.x;
        const dy = e.clientY - pressStartXY.current.y;
        if (Math.hypot(dx, dy) > DRAG_SUPPRESS_PX) {
          draggedRef.current = true;
          cancelPress();
          setLongPressed(false);
        }
      }}
      onMouseEnter={startHover}
      onMouseLeave={() => { cancelHover(); cancelPress(); setLongPressed(false); }}
      onPointerUp={endPress}
      onPointerCancel={() => { cancelPress(); setLongPressed(false); draggedRef.current = false; }}
      onKeyDown={(e) => {
        if ((e.key === 'Enter' || e.key === ' ') && onClick) {
          e.preventDefault();
          onClick(e);
        }
      }}
      role="button"
      tabIndex={0}
      aria-label={t('tile.aria', {
        name: animalName,
        gender: gender ? t(gender === 'male' ? 'gender.male' : 'gender.female') : '',
        fixed: isFixed,
        bad: isAdjacentToPartner === false,
      })}
      style={{
        width: cellSize, height: cellSize, borderRadius: 4,
        background: isFixed ? 'var(--bg-fixed)' : 'var(--bg-card)',
        border: isSelected
          ? '2px solid var(--accent-gold)'
          : (isAdjacentToPartner === false ? '1.5px dashed var(--danger)' : (isRecent ? '1.5px solid var(--ink-primary)' : '1px solid var(--border-soft)')),
        boxShadow: isSelected ? '0 0 0 3px rgba(180,83,9,0.25)' : (isPartnerPulse ? '0 0 0 4px rgba(180,83,9,0.22)' : '0 1px 2px rgba(0,0,0,0.04)'),
        cursor: isFixed ? 'default' : 'grab',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        position: 'relative', overflow: 'hidden', userSelect: 'none',
        transition: 'box-shadow 300ms, border 180ms',
        animation: isRecent ? 'cellResolve 320ms cubic-bezier(0.4,0,0.2,1)' : 'none',
        opacity: isDraggingThis ? 0.35 : 1,
        touchAction: 'none',
      }}
    >
      <div style={{ position: 'absolute', inset: 0, background: tint, opacity: 0.22, pointerEvents: 'none' }} />
      <div style={{ position: 'relative', width: '82%', height: '82%', opacity: undecided ? 0.5 : 1, filter: undecided ? 'grayscale(0.7)' : 'none', transition: 'opacity 220ms, filter 220ms', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        <img
          src={animalImgSrc(animal.id, gender)}
          alt={animalName}
          draggable={false}
          onError={(e) => { e.target.style.display = 'none'; e.target.nextElementSibling.style.display = 'flex'; }}
          style={{ width: '100%', height: '100%', objectFit: 'contain', pointerEvents: 'none' }}
        />
        <div style={{ display: 'none', width: '100%', height: '100%', alignItems: 'center', justifyContent: 'center', fontSize: cellSize * 0.48 }}>
          {animal.emoji}
        </div>
      </div>
      {undecided && !showOverlay && (
        <div className="font-display" style={{ position: 'absolute', fontSize: cellSize * 0.38, color: 'var(--accent-gold)', fontWeight: 500, fontStyle: 'italic', textShadow: '0 1px 2px rgba(255,255,255,0.8)' }}>?</div>
      )}
      {gender && !showOverlay && (
        <div className="font-display" style={{
          position: 'absolute', bottom: 3, right: 4, fontSize: cellSize * 0.22, color: symColor,
          background: 'var(--bg-card)', borderRadius: 2,
          width: cellSize * 0.26, height: cellSize * 0.26, display: 'flex', alignItems: 'center', justifyContent: 'center',
          border: '1px solid var(--border-soft)', lineHeight: 1, fontWeight: 500,
        }}>{sym}</div>
      )}
      {isFixed && !showOverlay && (
        <>
          {/* Subtle hatch — even fainter so the fixed tile reads as "natural", not striped */}
          <svg aria-hidden width="100%" height="100%" style={{ position: 'absolute', inset: 0, pointerEvents: 'none', opacity: 0.035 }}>
            <defs>
              <pattern id={`fixedHatch-${token.id}`} width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
                <line x1="0" y1="0" x2="0" y2="6" stroke="#78716C" strokeWidth="1.2" />
              </pattern>
            </defs>
            <rect width="100%" height="100%" fill={`url(#fixedHatch-${token.id})`} />
          </svg>
          {/* Top-left red dot — subtle "locked" indicator */}
          <div title={t('tile.fixed')} aria-hidden style={{
            position: 'absolute', top: 4, left: 4,
            width: 6, height: 6, borderRadius: 999,
            background: '#DC2626',
            boxShadow: '0 0 0 1.5px rgba(255,255,255,0.85)',
          }} />
        </>
      )}
      {showOverlay && <AttributeOverlay animal={animal} cellSize={cellSize} anchorRef={tileRef} />}
    </div>
  );
}

function QCandidateGrid({ candidates, capacity, cellSize, opacity }) {
  const { lang } = useLang();
  // Determine grid dimensions from capacity (4 = 2x2, 9 = 3x3)
  const dim = Math.ceil(Math.sqrt(capacity));
  // Mini-cell size: fit within parent cell with padding
  const padding = Math.max(6, cellSize * 0.10);
  const gap = 2;
  const innerSize = cellSize - padding * 2;
  const miniCellSize = (innerSize - gap * (dim - 1)) / dim;
  // Build cells array of length `capacity`, filled with {animalId, gender} or null
  const slots = new Array(capacity).fill(null);
  for (let i = 0; i < candidates.length && i < capacity; i++) slots[i] = candidates[i];
  return (
    <div style={{
      position: 'absolute', inset: padding, zIndex: 4,
      display: 'grid',
      gridTemplateColumns: `repeat(${dim}, 1fr)`,
      gridTemplateRows: `repeat(${dim}, 1fr)`,
      gap: `${gap}px`,
      pointerEvents: 'none',
      opacity: opacity !== undefined ? opacity : 0.6,
    }}>
      {slots.map((slot, i) => {
        if (!slot) {
          return (
            <div key={i} style={{
              background: 'rgba(255,255,255,0.4)',
              border: '1px dashed rgba(120,113,108,0.45)',
              borderRadius: 2,
            }} />
          );
        }
        const animal = animalById(slot.animalId);
        const gender = slot.gender || 'male';
        const genderSym = gender === 'male' ? '♂' : '♀';
        const genderColor = gender === 'male' ? '#1E3A8A' : '#9D174D';
        return (
          <div key={i} style={{
            background: 'rgba(255,255,255,0.75)',
            border: '1px solid rgba(120,113,108,0.5)',
            borderRadius: 2,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            overflow: 'hidden', position: 'relative',
          }}>
            <img
              src={animalImgSrc(animal.id, gender)}
              alt={getAnimalName(animal.id, lang) || animal.name}
              draggable={false}
              onError={(e) => { e.target.style.display = 'none'; e.target.nextElementSibling.style.display = 'flex'; }}
              style={{ width: '86%', height: '86%', objectFit: 'contain', pointerEvents: 'none' }}
            />
            <div style={{
              display: 'none', width: '100%', height: '100%',
              alignItems: 'center', justifyContent: 'center',
              fontSize: miniCellSize * 0.55,
            }}>{animal.emoji}</div>
            <div className="font-display" style={{
              position: 'absolute', bottom: 0, right: 1,
              fontSize: Math.max(8, miniCellSize * 0.24),
              color: genderColor, fontWeight: 600, lineHeight: 1,
              textShadow: '0 0 2px rgba(255,255,255,0.9)',
            }}>{genderSym}</div>
          </div>
        );
      })}
    </div>
  );
}

function QMarkOverlay({ candidates, capacity, cellSize, hasPlacedTile }) {
  // Unified overlay: renders over either empty Q-cell or Q-cell with placed tile.
  // Opacity values (higher = more opaque/visible):
  //   - empty Q-cell: candidates 0.8 (prominent, full note-card feel), "?" 0.3 (visible but secondary)
  //   - tile-occupied Q-cell: candidates 0.3 (faint, so real tile remains primary),
  //                           "?" 0.2 (subtle watermark), actual tile image stays at full opacity.
  // Layer order (low → high):
  //   1. (parent background or placed tile, outside this component)
  //   2. candidate mini-grid (zIndex 4)
  //   3. big "?" symbol (zIndex 5, topmost)
  const candidatesOpacity = hasPlacedTile ? 0.3 : 0.8;
  const questionOpacity = hasPlacedTile ? 0.2 : 0.3;
  return (
    <>
      <QCandidateGrid candidates={candidates || []} capacity={capacity || 4} cellSize={cellSize} opacity={candidatesOpacity} />
      <div className="font-display" style={{
        position: 'absolute', inset: 0, zIndex: 5,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        fontSize: cellSize * 0.72, fontStyle: 'italic', fontWeight: 600,
        color: 'var(--accent-gold)', opacity: questionOpacity,
        pointerEvents: 'none', userSelect: 'none', lineHeight: 1,
        textShadow: '0 0 8px rgba(255, 253, 247, 0.8)',
      }}>?</div>
    </>
  );
}

function DropCell({ size, row, col, isDropTarget, markState, qCandidates, qCapacity, onClick }) {
  const isX = markState === 'X';
  const isQ = markState === 'Q';

  let bg, border;
  if (isX) {
    bg = isDropTarget ? 'rgba(185,28,28,0.1)' : 'rgba(120,113,108,0.12)';
    border = isDropTarget ? '1.5px dashed var(--danger)' : '1px solid var(--border-medium)';
  } else if (isQ) {
    bg = isDropTarget ? 'rgba(180,83,9,0.08)' : 'rgba(180,83,9,0.04)';
    border = isDropTarget ? '1.5px dashed var(--accent-gold)' : '1px solid rgba(180,83,9,0.35)';
  } else {
    bg = isDropTarget ? 'rgba(180,83,9,0.08)' : 'var(--bg-subtle)';
    border = isDropTarget ? '1.5px dashed var(--accent-gold)' : '1px dashed var(--border-medium)';
  }

  return (
    <div
      data-drop-cell={`${row},${col}`}
      onClick={onClick}
      role="button"
      style={{
        width: size, height: size, background: bg, borderRadius: 4, border,
        transition: 'all 140ms', display: 'flex', alignItems: 'center', justifyContent: 'center',
        cursor: 'pointer', position: 'relative', overflow: 'hidden',
      }}
    >
      {isX && (
        <svg width={size * 0.44} height={size * 0.44} viewBox="0 0 24 24" style={{ opacity: 0.55 }}>
          <line x1="5" y1="5" x2="19" y2="19" stroke="#78716C" strokeWidth="2.2" strokeLinecap="round" />
          <line x1="19" y1="5" x2="5" y2="19" stroke="#78716C" strokeWidth="2.2" strokeLinecap="round" />
        </svg>
      )}
      {isQ && (
        <QMarkOverlay candidates={qCandidates} capacity={qCapacity} cellSize={size} hasPlacedTile={false} />
      )}
      {!isX && !isQ && (
        <div style={{ width: 4, height: 4, borderRadius: 999, background: 'var(--border-medium)' }} />
      )}
    </div>
  );
}

function PairAdjacencyLine({ from, to, cellSize, gap, valid }) {
  const cx = (c) => c * (cellSize + gap) + cellSize / 2;
  const cy = (r) => r * (cellSize + gap) + cellSize / 2;
  const x1 = cx(from.col), y1 = cy(from.row);
  const x2 = cx(to.col), y2 = cy(to.row);
  return (
    <line x1={x1} y1={y1} x2={x2} y2={y2}
      stroke={valid ? '#16A34A' : 'var(--danger)'}
      strokeWidth="2" strokeDasharray="3 3" opacity="0.7" strokeLinecap="round" />
  );
}

// (useViewportWidth is defined in SECTION 6.0 — ADSENSE FRAMEWORK)

// ============================================================================
// UNIFIED POINTER DRAG SYSTEM (mouse + touch + pen)
// Replaces HTML5 Drag & Drop API, which does not work on mobile touch.
//
// Model:
//   - Any tile (hand or placed) becomes a drag source via onPointerDown on it.
//   - A drag doesn't "commit" until pointer moves more than DRAG_THRESHOLD px.
//     Before threshold, releasing counts as a TAP (selects the tile).
//   - Drop targets are identified by data-drop-cell="r,c" or data-drop-hand="1".
//     On pointermove we use elementFromPoint to find them.
//   - Selected tile (via tap) can be placed by tapping a valid target.
//
// Exposes: DragProvider (wraps app), useDrag() -> { startPointerDrag,
//   selectedTokenId, selectTile, clearSelection, draggingTokenId,
//   ghostStyle, overTarget }
// ============================================================================

const DragContext = React.createContext(null);

function DragProvider({ children, onPlace, onReturnToHand, onTapTile, onSelectionChange, deselectRef }) {
  const [draggingTokenId, setDraggingTokenId] = useState(null);
  const [selectedTokenId, setSelectedTokenIdRaw] = useState(null);
  const selectedRef = useRef(null);
  const setSelectedTokenId = useCallback((id) => {
    selectedRef.current = id;
    setSelectedTokenIdRaw(id);
    if (onSelectionChange) onSelectionChange(id);
  }, [onSelectionChange]);

  // Expose a deselect handle for external callers (e.g., after tap-place)
  // so the calling component can clear selection without context access.
  useEffect(() => {
    if (deselectRef) {
      deselectRef.current = () => setSelectedTokenId(null);
    }
  }, [deselectRef, setSelectedTokenId]);
  const [overTarget, setOverTarget] = useState(null);
  const [ghostPos, setGhostPos] = useState({ x: 0, y: 0 });
  const [ghostVisible, setGhostVisible] = useState(false);
  const [ghostToken, setGhostToken] = useState(null); // { animalId, gender }

  // refs carry live state inside move/up handlers
  const stateRef = useRef({
    pointerId: null,
    tokenId: null,
    gender: null,
    startX: 0, startY: 0,
    moved: false,
    source: null, // 'hand' | 'board'
  });
  const DRAG_THRESHOLD = 6; // px

  const clearGhost = useCallback(() => {
    setGhostVisible(false);
    setGhostToken(null);
    setDraggingTokenId(null);
    setOverTarget(null);
  }, []);

  // Begin a pointer interaction on a tile. Does NOT start a drag yet — waits for threshold.
  const beginPointerPress = useCallback((e, { tokenId, gender, source, animalId }) => {
    // Ignore non-primary pointer buttons for mouse
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const s = stateRef.current;
    s.pointerId = e.pointerId;
    s.tokenId = tokenId;
    s.gender = gender;
    s.animalId = animalId;
    s.startX = e.clientX;
    s.startY = e.clientY;
    s.moved = false;
    s.source = source;
    // Capture pointer so moves keep coming even if finger leaves element
    try { e.currentTarget.setPointerCapture && e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
    // Don't preventDefault yet — preserve taps / scrolls until threshold
  }, []);

  // Global pointermove + pointerup listeners
  useEffect(() => {
    function findDropTarget(x, y) {
      const el = document.elementFromPoint(x, y);
      if (!el) return null;
      const cell = el.closest && el.closest('[data-drop-cell]');
      if (cell) {
        const [r, c] = cell.getAttribute('data-drop-cell').split(',').map(Number);
        return { kind: 'cell', row: r, col: c, key: `cell:${r},${c}` };
      }
      const hand = el.closest && el.closest('[data-drop-hand]');
      if (hand) return { kind: 'hand', key: 'hand' };
      return null;
    }

    function onMove(e) {
      const s = stateRef.current;
      if (s.pointerId == null || e.pointerId !== s.pointerId) return;
      const dx = e.clientX - s.startX;
      const dy = e.clientY - s.startY;
      if (!s.moved) {
        if (Math.hypot(dx, dy) < DRAG_THRESHOLD) return;
        // Threshold crossed — start drag
        s.moved = true;
        setDraggingTokenId(s.tokenId);
        setSelectedTokenId(null); // dragging supersedes tap-selection
        setGhostToken({ animalId: s.animalId, gender: s.gender });
        setGhostVisible(true);
      }
      setGhostPos({ x: e.clientX, y: e.clientY });
      const tgt = findDropTarget(e.clientX, e.clientY);
      setOverTarget(tgt);
      // Prevent page scroll while dragging on touch
      if (e.cancelable) e.preventDefault();
    }

    function onUp(e) {
      const s = stateRef.current;
      if (s.pointerId == null || e.pointerId !== s.pointerId) return;
      const { tokenId, moved, source } = s;
      s.pointerId = null;

      if (!moved) {
        // TAP — decide: select, deselect, toggle, or place/return-to-hand.
        // If another tile was already selected AND this tap is on a different
        // tile, treat it as "switch selection" (don't trigger place).
        const prevSelected = selectedRef.current;
        if (source === 'hand') {
          // Hand tap → select / deselect
          if (prevSelected === tokenId) setSelectedTokenId(null);
          else setSelectedTokenId(tokenId);
        } else {
          // Board tap
          if (prevSelected && prevSelected !== tokenId) {
            // Switch selection to this tile
            setSelectedTokenId(tokenId);
          } else if (prevSelected === tokenId) {
            // Tap same selected tile → DESELECT ONLY (no gender toggle).
            // Rationale: when a hand tile is tap-selected and then placed via
            // cell click, the selection persists on the now-on-board tile.
            // Tapping it again to clear the highlight should NOT inadvertently
            // toggle the gender mark — the user's intent is unambiguously
            // "remove the highlight", not "swap gender".
            setSelectedTokenId(null);
          } else {
            // Nothing selected → toggle gender mark
            if (onTapTile) onTapTile({ tokenId, source });
          }
        }
        return;
      }

      // Drag ended — resolve drop. Clear any tap-selection.
      setSelectedTokenId(null);
      const tgt = findDropTarget(e.clientX, e.clientY);
      clearGhost();
      if (!tgt) return; // dropped on nothing — cancel
      if (tgt.kind === 'cell') {
        if (onPlace) onPlace({ tokenId, row: tgt.row, col: tgt.col });
      } else if (tgt.kind === 'hand') {
        if (source === 'board' && onReturnToHand) onReturnToHand({ tokenId });
      }
    }

    function onCancel(e) {
      const s = stateRef.current;
      if (s.pointerId == null || e.pointerId !== s.pointerId) return;
      s.pointerId = null;
      clearGhost();
    }

    window.addEventListener('pointermove', onMove, { passive: false });
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onCancel);
    return () => {
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      window.removeEventListener('pointercancel', onCancel);
    };
  }, [onPlace, onReturnToHand, onTapTile, clearGhost]);

  const ctx = useMemo(() => ({
    beginPointerPress,
    selectedTokenId, setSelectedTokenId,
    draggingTokenId, overTarget,
    ghostVisible, ghostPos, ghostToken,
  }), [beginPointerPress, selectedTokenId, draggingTokenId, overTarget, ghostVisible, ghostPos, ghostToken]);

  return (
    <DragContext.Provider value={ctx}>
      {children}
      {ghostVisible && ghostToken && (
        <div style={{
          position: 'fixed', left: 0, top: 0,
          transform: `translate(${ghostPos.x - 30}px, ${ghostPos.y - 30}px) scale(1.05)`,
          width: 60, height: 60, pointerEvents: 'none', zIndex: 9999,
          background: 'var(--bg-card)', border: '1.5px solid var(--accent-gold)', borderRadius: 4,
          boxShadow: '0 8px 24px -6px rgba(0,0,0,0.25)',
          display: 'flex', alignItems: 'center', justifyContent: 'center', overflow: 'hidden',
          transition: 'transform 60ms linear',
        }}>
          <img src={animalImgSrc(ghostToken.animalId, ghostToken.gender)}
               alt="" draggable={false}
               style={{ width: '82%', height: '82%', objectFit: 'contain' }} />
        </div>
      )}
    </DragContext.Provider>
  );
}

function useDrag() {
  const ctx = React.useContext(DragContext);
  if (!ctx) throw new Error('useDrag must be used within DragProvider');
  return ctx;
}

function Grid({ puzzle, placements, marks, cellMarks, qCandidates, qMarkCapacity, onCellClick, onEmptyCellClick, onCellDrop, onTokenDragStart, recentTokenId, partnerTokenId, winAnimating, dragState, hintTokenIds }) {
  const drag = useDrag();
  const n = puzzle.n;
  const vw = useViewportWidth();
  const isPortrait = useIsPortrait();
  const isMobile = vw < 640;
  const isTiny = vw < 400;
  // V12.17: 사용자 요청 — 새싹 난이도 + 모바일 세로모드일 때 그리드 90% 축소
  // (Sprout/Sprout4 양쪽 다 적용 — Classic/V6 모드 무관)
  const isSproutLevel = puzzle.level === 'Sprout' || puzzle.level === 'Sprout4';
  const sproutMobilePortrait = isSproutLevel && isMobile && isPortrait;
  const sproutScale = sproutMobilePortrait ? 0.9 : 1.0;
  // Aggressive padding reduction on mobile so the board grabs every available pixel.
  const pagePad = isMobile ? (isTiny ? 4 : 8) : 40;
  // boardPad — extra thick for Sprout (small board, padding visible);
  // compact for other levels so cells get max area.
  const boardPad = puzzle.level === 'Sprout'
    ? (isMobile ? (isTiny ? 8 : 12) : 20)
    : (isMobile ? (isTiny ? 4 : 8) : 20);
  const gap = isMobile ? 3 : 6;

  const forbiddenSet = new Set(puzzle.forbiddenCells.map(([r, c]) => `${r},${c}`));
  const placedMap = {};
  for (const [tokenId, cell] of Object.entries(placements)) {
    if (cell) placedMap[`${cell.row},${cell.col}`] = tokenId;
  }

  const rowRules = {}, colRules = {};
  for (const r of (puzzle.lineRules || [])) {
    if (r.isRow) (rowRules[r.idx] = rowRules[r.idx] || []).push(r);
    else (colRules[r.idx] = colRules[r.idx] || []).push(r);
  }
  const rowCountHints = {}, colCountHints = {};
  for (const h of (puzzle.countHints || [])) {
    if (h.row !== null) (rowCountHints[h.row] = rowCountHints[h.row] || []).push(h);
    else (colCountHints[h.col] = colCountHints[h.col] || []).push(h);
  }

  // Compute max badge slot rows/columns. Each line rule + the count-hint group
  // (paired side-by-side) each occupy ONE slot row (in column header) or
  // ONE slot row stacked vertically (in row header).
  let maxRowSlots = 0, maxColSlots = 0;
  for (let i = 0; i < n; i++) {
    const rRules = (rowRules[i] || []).length;
    const rCounts = (rowCountHints[i] || []).length > 0 ? 1 : 0;
    const cRules = (colRules[i] || []).length;
    const cCounts = (colCountHints[i] || []).length > 0 ? 1 : 0;
    if (rRules + rCounts > maxRowSlots) maxRowSlots = rRules + rCounts;
    if (cRules + cCounts > maxColSlots) maxColSlots = cRules + cCounts;
  }
  if (maxRowSlots === 0) maxRowSlots = 1;
  if (maxColSlots === 0) maxColSlots = 1;

  // Responsive badge sizing
  const compact = isMobile;
  const iconOnly = isTiny;
  const hintGap = isMobile ? 2 : 4;

  // ────────────────────────────────────────────────────────────────────
  // Cell-first sizing: on mobile, the grid cells claim the most space.
  // The badge slot width/height are then DERIVED from the cell size so
  // every column header slot is as wide as the cell beneath it, and every
  // row header is exactly one cell-tall (stacked vertically inside).
  // ────────────────────────────────────────────────────────────────────
  // Step 1: pick a target row-header gutter width.
  //   - On mobile: compact gutter — just enough for one count-pair badge,
  //     since multiple badges can stack vertically inside.
  //   - On desktop: vertical stacking too (one slot wide), so gutter is compact.
  //     Multiple rules + count hints stack vertically inside the cell-tall row.
  let rowHintWidth;
  if (isMobile) {
    // Smallest reasonable gutter: width of one paired-count group (two small badges).
    rowHintWidth = isTiny ? 56 : 64;
  } else {
    // Desktop: same vertical-stack philosophy. One paired-count slot wide
    // (~80px) is enough for two count badges side-by-side or for a single
    // habitat label badge. Multiple rules stack vertically inside.
    rowHintWidth = 84;
  }

  // Step 2: derive cellSize from available width.
  const availableW = vw - pagePad * 2 - boardPad * 2 - rowHintWidth - gap;
  // Sprout (n=4) is small enough that hitting the default maxCell pushes the
  // board against the viewport edges. Cap it lower so left/right margins
  // stay visually relaxed. Other levels keep the larger cap since they pack
  // edge-to-edge anyway.
  // V12.17: 새싹 모바일 세로모드에서는 90% 추가 축소
  const baseMaxCell = isSproutLevel
    ? (isMobile ? 60 : 76)
    : (isMobile ? 72 : 86);
  const maxCell = Math.round(baseMaxCell * sproutScale);
  const cellSize = Math.max(32, Math.floor(Math.min((availableW - (n - 1) * gap) / n, maxCell)));

  // Step 3: now derive badge slot dimensions from cellSize.
  // Column header slot width = cellSize (matches cell beneath, edge-to-edge).
  // Row header slot height = cellSize (matches cell beside).
  // Slot height for column header rule: a fraction of cellSize, capped.
  const slotH = Math.max(22, Math.min(36, Math.round(cellSize * 0.46)));
  // Column header total height = N slot rows + gaps between them
  const colHintHeight = slotH * maxColSlots + hintGap * Math.max(0, maxColSlots - 1) + 8;
  // Slot width for column header: full cell width
  const slotW = cellSize;
  // Paired count badge size (used inside a single slot — two side by side)
  const pairedCountH = slotH;
  const pairedCountW = Math.max(20, Math.floor((cellSize - 2) / 2)); // half of cell, minus 2px gap

  // Evaluate rules & counts runtime
  const ruleOk = {};
  for (const r of (puzzle.lineRules || [])) {
    ruleOk[r.id] = evaluateLineRuleRuntime(r, placements, puzzle.tokens, marks);
  }
  // Compute count-hint state — both immediate (current vs target) and structural
  // (can future placements / gender toggles ever satisfy this?). A count badge
  // is highlighted red if it's already over OR if it's now physically
  // impossible to satisfy given the current line state.
  const countOk = {}, countOver = {};
  // Group hints by line for cross-checking gender vs total
  const hintsByLine = {};
  for (const h of (puzzle.countHints || [])) {
    const key = h.row !== null ? `r${h.row}` : `c${h.col}`;
    (hintsByLine[key] = hintsByLine[key] || []).push(h);
  }
  for (const h of (puzzle.countHints || [])) {
    const lineEntries = Object.entries(placements).filter(([_, cell]) =>
      h.row !== null ? cell.row === h.row : cell.col === h.col
    );
    const T_now = lineEntries.length;
    const M_now = lineEntries.filter(([tid]) => marks[tid] === 'male').length;
    const F_now = lineEntries.filter(([tid]) => marks[tid] === 'female').length;
    const Q_now = T_now - M_now - F_now; // unmarked

    // Find sibling total hint on same line (if any)
    const lineKey = h.row !== null ? `r${h.row}` : `c${h.col}`;
    const totalHint = (hintsByLine[lineKey] || []).find(x => x.type === 'total');
    const T_target = totalHint ? totalHint.value : null;
    // Capacity = how many tokens this line can ULTIMATELY contain.
    // - With Total hint: capacity = T_target (exact)
    // - Without Total hint: capacity = T_now + count(empty non-forbidden cells in line)
    //   This is the upper bound — line could hold all empty non-forbidden cells.
    let capacity;
    if (T_target !== null) {
      capacity = T_target;
    } else {
      const n = puzzle.n;
      const forbiddenSet = new Set((puzzle.forbiddenCells || []).map(([r, c]) => `${r},${c}`));
      const occupiedSet = new Set();
      for (const [, cell] of Object.entries(placements)) {
        occupiedSet.add(`${cell.row},${cell.col}`);
      }
      let emptyNonForbiddenInLine = 0;
      for (let i = 0; i < n; i++) {
        const cellKey = h.row !== null ? `${h.row},${i}` : `${i},${h.col}`;
        if (forbiddenSet.has(cellKey)) continue;
        if (occupiedSet.has(cellKey)) continue;
        emptyNonForbiddenInLine++;
      }
      capacity = T_now + emptyNonForbiddenInLine;
    }
    const remaining = Math.max(0, capacity - T_now); // tokens still to be placed in this line

    let current, target = h.value;
    let isImpossible = false;
    if (h.type === 'total') {
      current = T_now;
    } else if (h.type === 'H1') {
      current = M_now;
      // Reachable max = current ♂ + (Q's that could be flipped to ♂) + (future tokens that could be ♂)
      const M_max = M_now + Q_now + remaining;
      if (target > M_max) isImpossible = true;
    } else if (h.type === 'H2') {
      current = F_now;
      const F_max = F_now + Q_now + remaining;
      if (target > F_max) isImpossible = true;
    }
    countOk[h.id] = current === target;
    // Red highlight when: already over, OR impossible to ever reach target.
    countOver[h.id] = current > target || isImpossible;
  }

  // Compute final ruleStatus: 'empty' | 'partial' | 'bad' | 'satisfied'
  // 'satisfied' (green) requires BOTH (a) every placed token in line matches the rule
  // AND (b) every count hint on that same line is also ok.
  const ruleStatus = {};
  for (const r of (puzzle.lineRules || [])) {
    const baseStatus = evaluateLineRuleStatus(r, placements, puzzle.tokens, marks);
    if (baseStatus !== 'satisfied-rule-only') {
      ruleStatus[r.id] = baseStatus; // empty / partial / bad
      continue;
    }
    // Rule itself is satisfied — now check count hints on same line
    const lineCountHints = (puzzle.countHints || []).filter(h =>
      r.isRow ? h.row === r.idx : h.col === r.idx
    );
    const allCountOk = lineCountHints.length === 0
      ? true   // no count hints on this line — rule alone counts as satisfied
      : lineCountHints.every(h => countOk[h.id]);
    ruleStatus[r.id] = allCountOk ? 'satisfied' : 'partial';
  }

  const pairAdj = {};
  for (const [t1, t2] of puzzle.pairs) {
    const p1 = placements[t1], p2 = placements[t2];
    if (p1 && p2) pairAdj[t1] = pairAdj[t2] = isAdjacent(p1, p2);
  }

  const cellContent = (r, c, idx) => {
    const key = `${r},${c}`;
    if (forbiddenSet.has(key)) return <ForbiddenCell size={cellSize} />;
    const tid = placedMap[key];
    const isDropTarget = drag.overTarget && drag.overTarget.kind === 'cell' && drag.overTarget.row === r && drag.overTarget.col === c;
    if (tid) {
      const tok = puzzle.tokens.find(t => t.id === tid);
      const animal = animalById(tok.animalId);
      const isRecent = recentTokenId === tok.id;
      const isPartnerPulse = partnerTokenId === tok.id;
      const isHinted = hintTokenIds && hintTokenIds.indexOf(tok.id) !== -1;
      const isFixed = !!(puzzle.preMarks && puzzle.preMarks[tok.id]);
      const adj = pairAdj[tok.id];
      const cellIsQ = cellMarks && cellMarks[key] === 'Q';
      const cellQCands = cellIsQ && qCandidates ? qCandidates[key] : undefined;
      const isSelected = drag.selectedTokenId === tok.id;
      const isDraggingThis = drag.draggingTokenId === tok.id;
      return (
        <div
          data-drop-cell={`${r},${c}`}
          style={{
            animation: winAnimating ? `celebrationWave 700ms cubic-bezier(0.4,0,0.2,1) ${idx * 55}ms both` : 'none',
            position: 'relative',
            boxShadow: isDropTarget ? '0 0 0 2px var(--accent-gold)' : 'none',
            borderRadius: 4,
            transition: 'box-shadow 140ms',
          }}
        >
          <PlacedTile
            token={tok} animal={animal} gender={marks[tok.id] || null}
            onClick={() => onCellClick(tok.id)}
            onDragStart={(e) => {
              if (isFixed) return;
              drag.beginPointerPress(e, {
                tokenId: tok.id,
                gender: marks[tok.id] || 'male',
                animalId: tok.animalId,
                source: 'board',
              });
            }}
            isRecent={isRecent} isPartnerPulse={isPartnerPulse}
            isFixed={isFixed} cellSize={cellSize}
            isAdjacentToPartner={adj}
            isSelected={isSelected}
            isDraggingThis={isDraggingThis}
          />
          {cellIsQ && (
            <QMarkOverlay candidates={cellQCands} capacity={qMarkCapacity} cellSize={cellSize} hasPlacedTile={true} />
          )}
          {isHinted && (
            <span
              aria-label="hint-spotlight"
              style={{
                position: 'absolute',
                inset: -2,
                borderRadius: 6,
                border: '3px solid #DC2626',
                animation: 'hintPulseRedRing 700ms ease-in-out infinite',
                pointerEvents: 'none',
                zIndex: 5,
                boxSizing: 'border-box',
              }}
            />
          )}
        </div>
      );
    }
    const markState = cellMarks ? cellMarks[key] : undefined;
    const qCands = qCandidates ? qCandidates[key] : undefined;
    return (
      <DropCell
        size={cellSize} row={r} col={c}
        isDropTarget={isDropTarget}
        markState={markState}
        qCandidates={qCands}
        qCapacity={qMarkCapacity}
        onClick={() => onEmptyCellClick && onEmptyCellClick(r, c)}
      />
    );
  };

  const rowsArr = Array.from({ length: n }, (_, i) => i);
  const colsArr = Array.from({ length: n }, (_, i) => i);

  // Sprout (n=4) renders smaller than viewport on phones, leaving the leftmost
  // badge visually kissing the white edge. Apply extra outer padding only to
  // Sprout — other levels already pack the board edge-to-edge so additional
  // padding would just shrink cellSize.
  const isSprout = puzzle.level === 'Sprout';
  const outerPadX = isSprout ? 'clamp(12px, 3vw, 40px)' : 'clamp(2px, 1vw, 40px)';

  return (
    <div style={{ padding: `4px ${outerPadX} 20px`, display: 'flex', justifyContent: 'center', overflowX: 'auto' }}>
      <div style={{
        position: 'relative', display: 'inline-block', padding: boardPad, background: 'var(--bg-card)',
        border: '1px solid var(--border-soft)', borderRadius: 3,
        boxShadow: '0 1px 0 rgba(0,0,0,0.02), 0 12px 32px -16px rgba(60, 50, 30, 0.15)',
      }}>
        {/* Column headers */}
        <div style={{ display: 'flex', gap, marginBottom: gap, paddingLeft: rowHintWidth + gap, minHeight: colHintHeight }}>
          {colsArr.map(c => {
            const ch = colCountHints[c] || [];
            return (
              <div key={c} style={{ width: cellSize, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'flex-end', gap: hintGap, flexWrap: 'nowrap' }}>
                {(colRules[c] || []).map(r => (
                  <LineRuleBadge key={r.id} rule={r} ok={ruleOk[r.id]} status={ruleStatus[r.id]} compact={compact} iconOnly={iconOnly} slotW={slotW} slotH={slotH} />
                ))}
                {ch.length > 0 && (
                  <div style={{ display: 'flex', flexDirection: 'row', gap: 2, justifyContent: 'center', alignItems: 'center', maxWidth: '100%' }}>
                    {ch.map(h => (
                      <CountHintBadge key={h.id} hint={h} ok={countOk[h.id]} over={countOver[h.id]} compact={compact} iconOnly={iconOnly} paired={true} pairedSize={pairedCountW} />
                    ))}
                  </div>
                )}
              </div>
            );
          })}
        </div>
        {rowsArr.map(r => {
          const rh = rowCountHints[r] || [];
          const rRules = rowRules[r] || [];
          // Row header inner stacks vertically: each rule on its own line,
          // count hints on their own line. This lets the row gutter stay
          // narrow (one slot wide) while still showing every badge.
          // Total stacked items = rule count + (1 if count hints exist)
          const stackedItems = rRules.length + (rh.length > 0 ? 1 : 0);
          // Each stacked item gets ~equal share of cellSize, capped at slotH
          const rowSlotH = Math.max(20, Math.min(slotH, Math.floor((cellSize - hintGap * Math.max(0, stackedItems - 1)) / Math.max(1, stackedItems))));
          // Width matching: a paired count-hint group is (2 × rowSlotH + 2) wide.
          // Make line-rule badges the SAME width so both badge types
          // align flush at their left edge under right-justify.
          const rowRuleBadgeW = rh.length >= 2
            ? rowSlotH * 2 + 2
            : Math.min(rowHintWidth - 8, rowSlotH * 2 + 2);
          return (
          <div key={r} style={{ display: 'flex', gap, marginBottom: gap }}>
            <div style={{ width: rowHintWidth, height: cellSize, display: 'flex', flexDirection: 'column', alignItems: 'flex-end', justifyContent: 'center', gap: hintGap, paddingLeft: isSprout ? 8 : (isMobile ? 2 : 6), paddingRight: 4, overflow: 'visible' }}>
              {rRules.length > 0 && (
                <div style={{ display: 'flex', flexDirection: 'column', gap: hintGap, alignItems: 'flex-end', justifyContent: 'flex-end' }}>
                  {rRules.map(rr => (
                    <LineRuleBadge key={rr.id} rule={rr} ok={ruleOk[rr.id]} status={ruleStatus[rr.id]} compact={compact} iconOnly={iconOnly} slotW={rowRuleBadgeW} slotH={rowSlotH} />
                  ))}
                </div>
              )}
              {rh.length > 0 && (
                <div style={{ display: 'flex', flexDirection: 'row', gap: 2, alignItems: 'center', justifyContent: 'flex-end' }}>
                  {rh.map(h => (
                    <CountHintBadge key={h.id} hint={h} ok={countOk[h.id]} over={countOver[h.id]} compact={compact} iconOnly={iconOnly} paired={true} pairedSize={rowSlotH} />
                  ))}
                </div>
              )}
            </div>
            {colsArr.map(c => (<div key={c}>{cellContent(r, c, r * n + c)}</div>))}
          </div>
          );
        })}
        {/* Adjacency SVG overlay */}
        <svg style={{
          position: 'absolute',
          left: boardPad + rowHintWidth + gap,
          top: boardPad + colHintHeight + gap,
          width: n * cellSize + (n - 1) * gap,
          height: n * cellSize + (n - 1) * gap,
          pointerEvents: 'none',
          overflow: 'visible',
        }}>
          {puzzle.pairs.map(([t1, t2]) => {
            const p1 = placements[t1], p2 = placements[t2];
            if (!p1 || !p2) return null;
            const valid = isAdjacent(p1, p2);
            return (
              <PairAdjacencyLine key={t1} from={p1} to={p2} cellSize={cellSize} gap={gap} valid={valid} />
            );
          })}
        </svg>
      </div>
    </div>
  );
}

function HandPool({ puzzle, placements, marks, onTokenDragStart, onDropToHand, dragState, onHandTapReturn }) {

  // V12.25: 사용자 요청 — 데스크탑은 원래 크기, 모바일은 더 작게
  // V12.26: 모바일 추가 10% 축소 — 0.72 × 0.9 = 0.648
  const vw = useViewportWidth();
  const isMobile = vw < 640;
  const handZoom = isMobile ? 0.648 : 1.0;
  if (!puzzle) return null;
  const unplaced = puzzle.tokens.filter(t => !placements[t.id]);

  for (const t of unplaced) { (groups[t.animalId] = groups[t.animalId] || []).push(t); }

  return (

// Dedicated hint button with x-counter badge and exhausted/all-correct
// popover bubble. Animates with a small bounce when popover appears so
// users notice it. Auto-dismisses on 2.5s timer (cleanup if unmounted).
function HintButton({ onClick, disabled, hintsRemaining, exhaustedShown,
                     allCorrectShown, onDismissPopover }) {
  const t = useT();
  const showAny = exhaustedShown || allCorrectShown;
  // Auto-dismiss popover after a short delay so it doesn't linger.
  React.useEffect(() => {
    if (!showAny) return;
    const id = setTimeout(() => { onDismissPopover && onDismissPopover(); }, 2500);
    return () => clearTimeout(id);
  }, [showAny, onDismissPopover]);
  const popoverMessage = exhaustedShown
    ? t('hint.exhausted')
    : (allCorrectShown ? t('hint.allCorrect') : null);
  const looksDepleted = hintsRemaining <= 0;
  return (
    <span style={{ position: 'relative', display: 'inline-flex' }}>
      <button
        onClick={onClick}
        disabled={disabled}
        className="font-body"
        style={{
          padding: 'clamp(8px, 2vw, 10px) clamp(12px, 3vw, 16px)',
          background: 'var(--bg-card)',
          color: looksDepleted ? 'var(--ink-tertiary)' : 'var(--ink-secondary)',
          border: '1px solid var(--border-medium)',
          borderRadius: 2, cursor: disabled ? 'wait' : 'pointer',
          fontSize: 13, fontWeight: 500,
          display: 'flex', alignItems: 'center', gap: 8, letterSpacing: '0.02em',
          opacity: disabled ? 0.5 : (looksDepleted ? 0.75 : 1),
          transition: 'all 160ms',
        }}
      >
        <span style={{ fontSize: 14 }}>💡</span>{t('btn.hint')}
        <span className="font-mono" style={{
          fontSize: 11, fontWeight: 600,
          color: looksDepleted ? 'var(--danger)' : 'var(--accent-gold)',
          padding: '1px 5px', borderRadius: 2,
          background: looksDepleted ? 'rgba(220,38,38,0.08)' : 'rgba(180,83,9,0.10)',
          minWidth: 22, textAlign: 'center',
        }}>×{hintsRemaining}</span>
      </button>

        <span role="status" aria-live="polite" style={{
          position: 'absolute',

          transform: 'translateX(-50%)',
          background: 'var(--ink-primary)',
          color: 'var(--bg-paper)',

          borderRadius: 4,

            borderTop: '6px solid var(--ink-primary)',

  );
