      phase: 'cdg-v5-strict-pool',
      attempt, poolSize: pool.length, target: POOL_SIZE,
      elapsed: performance.now() - startTime, budget: TOTAL_BUDGET,
    });
    await new Promise(r => setTimeout(r, 0));

    // Each pool slot gets one v4-strict generation (which itself does up to 5 retries).
    const subStart = performance.now();
    const candidate = await generatePuzzleCDG_v4_strict(level, () => {});
    const subElapsed = performance.now() - subStart;

    if (!candidate) continue;
    if (subElapsed > PER_CANDIDATE_BUDGET * 1.5) {
      // Burned too much time; record but stop trying for more
      pool.push(candidate);
      break;
    }
    pool.push(candidate);
  }

  if (pool.length === 0) return null;

  // Re-trace each pool member with v5 metric and pick closest to ideal
  let best = null, bestDist = Infinity;
  for (const cand of pool) {
    const trace = traceSolve_v2(cand, {
      timeLimitMs: 2500,
      maxLookaheadDepth: 2,
      enableLevel4: true,
    });
    if (trace.status !== 'solved') continue;
    const v5diff = computeTraceDifficulty_v5(trace.diagnostics, trace.trace);
    cand.traceDifficulty_v5 = v5diff;
    cand.engine = 'cdg-v5-strict';
    const dist = Math.abs(v5diff - tierV5.ideal);
    if (dist < bestDist) { bestDist = dist; best = cand; }
  }

  if (!best) best = pool[0];
  // Always tag the final v5 result with v5 engine, even if trace didn't fully solve
  best.engine = 'cdg-v5-strict';
  best.poolSize = pool.length;
  best.generationTime = performance.now() - startTime;
  return best;
}

// ─────────────────────────────────────────────────────────────────────────────
// V6-SOTA — Definitive generator (V11 metric + V6 7-tier acceptance + pool)
// ─────────────────────────────────────────────────────────────────────────────
// Builds on cdg-v4-strict as base generator (axiom-preserving minimality)
// but replaces v5-strict's single-axis pool selection with V11 multi-axis
// acceptance pipeline + V6 7-tier per-tier targets.
//
// Core innovations over v5-strict:
//   (1) V11 acceptance: 17 hard constraints (was: 5 in v5, 4 in v4)
//   (2) V6 per-tier targets (was: 5-tier global targets in v5)
//   (3) Multi-axis composite score (was: single-axis ideal-distance in v5)
//   (4) Adaptive pool size based on tier (Hard6: 6, Sprout4: 3)
//   (5) Score boost: difficulty/time band centering + archetype preference
//
// 시드별 검증:
//   • 시드11 (Hard6 마스터피스, sat=4, q=92, climbing climax) → 12/13 통과
//   • 시드12 (Medium6 sat=4, balanced) → 12/13 통과
//   • 시드13 (MediumPlus6 sat=4, inherent) → 12/13 통과
//   • 시드7 (4x4+adv paradox sat=1) → 자동 차단
async function generatePuzzleCDG_v6_sota(level, onProgress) {
  const config = DIFFICULTY_CONFIGS[level];
  if (!config) return null;

  // Get V6 acceptance target for this tier
  const target = USE_DIFFICULTY_V6 ? getAcceptanceTargetV6(level) : null;
  // If no V6 target available (legacy mode or Custom), fall back to v4-strict
  if (!target) {
    return generatePuzzleCDG_v4_strict(level, onProgress);
  }

  const startTime = performance.now();
  // V6-SOTA budget — v4-strict 한 번 호출이 max 35초이므로 pool 6개면 이론적 210초.
  // 사용자 hang 보고 (중상급+ 멈춤) → pool 크기 + budget 모두 보수적으로 축소.
  // Acceptance가 완화돼서 pool 작아도 좋은 candidate 식별 가능.
  const TOTAL_BUDGET = Math.min((config.totalBudgetMs || 25000) * 1.3, 45000);  // hard cap 45s
  // Tier-adaptive pool size (마스터피스 탐색 vs hang 방지)
  // Sprout4/Easy5: 3, Medium6/MediumPlus6: 4, Hard6/MediumPlus7/Hard7: 5
  const POOL_SIZE = config.n <= 5 ? 3
                   : config.n === 6 && (level === 'Hard6') ? 5
                   : config.n === 6 ? 4
                   : 5;  // 7x7
  const MAX_RAW_ATTEMPTS = POOL_SIZE + 2;  // POOL_SIZE × 2 → +2 (여유분만)
  const PER_CANDIDATE_BUDGET = TOTAL_BUDGET / POOL_SIZE;

  const pool = [];
  let bestEarlyExit = null;
  const VERY_HIGH_QUALITY_CUTOFF = 90;  // 마스터피스 candidate면 즉시 return

  // Phase 1: Generate candidate pool via cdg-v4-strict
  for (let attempt = 0; attempt < MAX_RAW_ATTEMPTS; attempt++) {
    const totalElapsed = performance.now() - startTime;
    if (totalElapsed > TOTAL_BUDGET) break;
    if (pool.length >= POOL_SIZE) break;
    // Hard escape: 30초 후 pool에 1개만 있어도 break (사용자 hang 방지)
    if (totalElapsed > 30000 && pool.length >= 1) break;

    onProgress && onProgress({
      phase: 'v6-sota-pool',
      attempt: attempt + 1,
      poolSize: pool.length,
      target: POOL_SIZE,
      elapsed: totalElapsed,
      budget: TOTAL_BUDGET,
    });
    await new Promise(r => setTimeout(r, 0));

    const subStart = performance.now();
    // V12.22: V6 SOTA 내부 v4_strict 호출 시 sub-progress를 외부 UI에 전달
    // 이전: onProgress=() => {} (무시) → v4_strict의 5-10초 동기 작업 동안 UI freeze
    // 현재: 외부 phase 'v6-sota-pool'을 보존하면서 sub-progress 정보 전달 → UI 살아남
    const v4Forwarder = (sub) => {
      if (!onProgress) return;
      onProgress({
        phase: 'v6-sota-pool',
        attempt: attempt + 1,
        poolSize: pool.length,
        target: POOL_SIZE,
        elapsed: performance.now() - startTime,
        budget: TOTAL_BUDGET,
        // sub-phase 디테일 (v4_strict 내부 진행 상황)
        subPhase: sub && sub.phase ? sub.phase : null,
        subProgress: sub && sub.subProgress ? sub.subProgress : null,
      });
    };
    const candidate = await generatePuzzleCDG_v4_strict(level, v4Forwarder);
    const subElapsed = performance.now() - subStart;

    if (!candidate) continue;

    // Tag the candidate with v6-sota engine immediately
    candidate.engine = 'v6-sota';

    pool.push(candidate);

    // Early exit optimization: if we already have a v11-perfect candidate, stop
    if (candidate.v9) {
      const v11 = candidate.v9;
      const bd = v11.breakdown || {};
      // V12 NEW: pre-reveal ratio check (시드15 같은 trivial puzzle 차단)
      const __pairs = candidate.tokens ? Math.floor(candidate.tokens.length / 2) :
                      (candidate.config?.n === 4 ? 4 :
                       candidate.config?.n === 7 ? 11 : 9);
      const __fixedCount = (candidate.fixedCells || []).length;
      const __preRevealRatio = (__pairs * 2) > 0 ? __fixedCount / (__pairs * 2) : 0;

      // V12.9: Satisfaction invariants (만족 시드 9개에서 추출된 100% 공유 조건)
      // Pattern category counts from breakdown
      const __cat_backtrack = bd.cat_backtrack || 0;
      const __cat_lineAxis = bd.cat_lineAxis || 0;
      const __terminalCascade = bd.lateDecisions || 0;
      // V12.11: Backbone 3 + lineCount share (만족 시드 9/9 100% 등장)
      const __nakedSingle = bd.pat_nakedSingle || 0;
      const __totalSaturation = bd.pat_totalSaturation || 0;
      const __totalForcing = bd.pat_totalForcing || 0;
      const __lineCountShare = bd.lineCountShare || 0;

      const earlyAllPass = (
        v11.gridAppropriate &&
        v11.quality >= (target.minQuality || 0) &&
        (bd.onboardingQ || 0) >= (target.minOnboarding || 0) &&
        (bd.climaxQ || 0) >= (target.minClimax || 0) &&
        v11.difficulty >= (target.v11DifficultyMin || 0) &&
        v11.difficulty <= (target.v11DifficultyMax || 999) &&
        v11.time >= (target.v11TimeMin || 0) &&
        v11.time <= (target.v11TimeMax || 9999) &&
        (bd.firstFiveNaked || 0) >= (target.minFirstFiveNaked || 0) &&
        (bd.avgDomain || 0) <= (target.maxAvgDomain || 99) &&
        (bd.holdingLoad || 0) <= (target.maxHoldingLoad || 99) &&
        (bd.maxGap || 0) <= (target.maxMaxGap || 99) &&
        (bd.placementFreedomQ || 0) >= (target.minPlacementFreedomQ || 0) &&
        (bd.sizeAppropriatenessQ || 0) >= (target.minSizeAppropriatenessQ || 0) &&
        // V12.9: 만족 시드 invariants
        (target.minFlow == null || (bd.flow || 0) >= target.minFlow) &&
        (target.minRuleEquityQ == null || (bd.ruleEquityQ || 0) >= target.minRuleEquityQ) &&
        (target.maxTerminalCascade == null || __terminalCascade <= target.maxTerminalCascade) &&
        (target.maxBacktrackUsage == null || __cat_backtrack <= target.maxBacktrackUsage) &&
        (target.maxLineAxisUsage == null || __cat_lineAxis <= target.maxLineAxisUsage) &&
        // V12.11: Backbone 3 패턴 강제 (만족 시드 9/9 100% 등장)
        (target.minNakedSingle == null || __nakedSingle >= target.minNakedSingle) &&
        (target.minTotalSaturation == null || __totalSaturation >= target.minTotalSaturation) &&
        (target.minTotalForcing == null || __totalForcing >= target.minTotalForcing) &&
        (target.minLineCountShare == null || __lineCountShare >= target.minLineCountShare) &&
        // V12.10: archetype 제한 제거 (사용자 요청 — archetype은 정보 표시용으로만 유지)
        __preRevealRatio <= (target.preRevealRatioMax || 1.0)
      );
      if (earlyAllPass) {
        bestEarlyExit = candidate;
        break;
      }
    }

    // Adaptive break: more time-aware than fixed budget multiplier.
    // Continue if (a) total time budget not exceeded AND
    //              (b) we haven't reached minimum pool size (2 for tier > Sprout).
    // Only break early if individual candidate took disproportionate time
    // AND we already have multiple candidates (safety).
    const elapsedAfterCandidate = performance.now() - startTime;
    if (elapsedAfterCandidate > TOTAL_BUDGET * 0.85 && pool.length >= 2) break;
    if (subElapsed > PER_CANDIDATE_BUDGET * 2.0 && pool.length >= 3) break;
  }

  if (bestEarlyExit) {
    bestEarlyExit.engine = 'v6-sota';
    bestEarlyExit.poolSize = pool.length;
    bestEarlyExit.generationTime = performance.now() - startTime;
    bestEarlyExit.v6SotaEarlyExit = true;
    return bestEarlyExit;
  }

  if (pool.length === 0) return null;

  // Phase 2: Score each candidate via V11 multi-axis evaluation + V6 boost
  let best = null, bestScore = -Infinity, bestPassCount = -1;
  for (const cand of pool) {
    if (!cand.v9) {
      // Compute V11 if not already attached
      const trace = traceSolve_v2(cand, {
        timeLimitMs: 3000,
        maxLookaheadDepth: 2,
        enableMultiStepLookahead: true,
      });
      if (trace.status === 'solved') {
        cand.v9 = computeTraceTripleAxis_v9(trace.diagnostics, trace.trace, cand);
        cand.v9.gridAppropriate = isGridAppropriateV9(cand, cand.v9);
      }
    }
    if (!cand.v9) continue;

    const v11 = cand.v9;
    const bd = v11.breakdown || {};

    // Compute V11 base score (same weights as acceptance pipeline)
    const qualScore = v11.quality;
    const onbScore = (bd.onboardingQ || 0) * 100;
    const climaxScore = (bd.climaxQ || 0) * 100;
    const equityScore = (bd.ruleEquityQ || 0) * 100;
    const freedomScore = (bd.placementFreedomQ || 0) * 100;
    const sizeAppScore = (bd.sizeAppropriatenessQ || 0) * 100;
    const gridAppropriateBonus = v11.gridAppropriate ? 10 : -50;

    let score = qualScore * 0.30
              + onbScore * 0.20
              + climaxScore * 0.15
              + equityScore * 0.10
              + freedomScore * 0.10
              + sizeAppScore * 0.15
              + gridAppropriateBonus;

    // V12.10: archetype score boost 제거 (사용자 요청 — archetype 제한 없음)
    // archetype은 정보 표시용으로만 유지, scoring에 영향 없음
    if (target.v11DifficultyMin != null && target.v11DifficultyMax != null) {
      const center = (target.v11DifficultyMin + target.v11DifficultyMax) / 2;
      const halfRange = (target.v11DifficultyMax - target.v11DifficultyMin) / 2;
      const dist = Math.abs(v11.difficulty - center);
      if (halfRange > 0) score += Math.max(0, 12 * (1 - dist / halfRange));
    }
    if (target.v11TimeMin != null && target.v11TimeMax != null) {
      const center = (target.v11TimeMin + target.v11TimeMax) / 2;
      const halfRange = (target.v11TimeMax - target.v11TimeMin) / 2;
      const dist = Math.abs(v11.time - center);
      if (halfRange > 0) score += Math.max(0, 10 * (1 - dist / halfRange));
    }
    // Masterpiece bonus (시드11 q=92, climaxQ=0.85 식별)
    if ((bd.climaxQ || 0) >= 0.80) score += 15;
    else if ((bd.climaxQ || 0) >= 0.70) score += 6;
    if (qualScore >= 90) score += 12;
    else if (qualScore >= 85) score += 6;

    // Count V6 hard constraints passed (tiebreaker)
    // V12 NEW: pre-reveal ratio computation (시드15 trivial gate)
    const __pairsForCheck = cand.tokens ? Math.floor(cand.tokens.length / 2) :
                            (cand.config?.n === 4 ? 4 :
                             cand.config?.n === 7 ? 11 : 9);
    const __fixedForCheck = (cand.fixedCells || []).length;
    const __preRevealRatioCheck = (__pairsForCheck * 2) > 0
      ? __fixedForCheck / (__pairsForCheck * 2) : 0;
    const checks = {
      grid: !target.gridAppropriate || v11.gridAppropriate,
      qual: !target.minQuality || v11.quality >= target.minQuality,
      onb: !target.minOnboarding || (bd.onboardingQ || 0) >= target.minOnboarding,
      clim: !target.minClimax || (bd.climaxQ || 0) >= target.minClimax,
      diffMin: target.v11DifficultyMin == null || v11.difficulty >= target.v11DifficultyMin,
      diffMax: target.v11DifficultyMax == null || v11.difficulty <= target.v11DifficultyMax,
      timeMin: target.v11TimeMin == null || v11.time >= target.v11TimeMin,
      timeMax: target.v11TimeMax == null || v11.time <= target.v11TimeMax,
      naked: target.minFirstFiveNaked == null || (bd.firstFiveNaked || 0) >= target.minFirstFiveNaked,
      domain: target.maxAvgDomain == null || (bd.avgDomain || 0) <= target.maxAvgDomain,
      hold: target.maxHoldingLoad == null || (bd.holdingLoad || 0) <= target.maxHoldingLoad,
      gap: target.maxMaxGap == null || (bd.maxGap || 0) <= target.maxMaxGap,
      equity: target.minRuleEquityQ == null || (bd.ruleEquityQ || 0) >= target.minRuleEquityQ,
      free: target.minPlacementFreedomQ == null || (bd.placementFreedomQ || 0) >= target.minPlacementFreedomQ,
      preReveal: target.preRevealRatioMax == null || __preRevealRatioCheck <= target.preRevealRatioMax,  // V12 NEW
      // V12.10: arch check 제거 — archetype 제한 없음
    };
    const passCount = Object.values(checks).filter(Boolean).length;

    cand.v6SotaScore = score;
    cand.v6SotaPassCount = passCount;

    // Selection: prefer higher passCount first (more constraints satisfied),
    // then higher score (centered/preferred)
    if (passCount > bestPassCount ||
        (passCount === bestPassCount && score > bestScore)) {
      bestPassCount = passCount;
      bestScore = score;
      best = cand;
    }
  }

  if (!best) best = pool[0];
  best.engine = 'v6-sota';
  best.poolSize = pool.length;
  best.generationTime = performance.now() - startTime;
  best.v6SotaScore = bestScore;
  best.v6SotaPassCount = bestPassCount;
  best.v6SotaTier = level;
  return best;
}

// Helper: gridAppropriate computation (used by v6-sota early exit + acceptance)
function isGridAppropriateV9(puzzle, v9Result) {
  if (!puzzle || !v9Result) return false;
  const n = puzzle.n;
  const diff = v9Result.difficulty;
  const bd = v9Result.breakdown || {};
  const onb = bd.onboardingQ || 0;
  // Grid-difficulty mismatch hard rules:
  if (n <= 4 && diff > 35) return false;     // 4x4+advanced paradox (시드7)
  if (n === 5 && diff > 60) return false;    // 5x5+advanced paradox
  if (n === 7 && onb < 0.5) return false;    // 7x7 onboarding (사용자 명시)
  return true;
}

// ─────────────────────────────────────────────────────────────────────────────
// variant (canonical v4 design). Kept for any code that may reference it.

// =============================================================================
// SECTION 3.8 — ENGINE DISPATCH (V2 entry point)
// =============================================================================
// Public API that selects between three generators (classic + two CDG v4 variants).
// Default behavior is unchanged from the classic generator.
// engine values:
//   'classic'        (default) — Stage A-D random generator
//   'cdg-v4-loose'   — Spec-Aligned CDG v4 with aggressive minimality (hint axiom may erode)
//   'cdg-v4-strict'  — Spec-Aligned CDG v4 with axiom-preserving minimality (all lines have Total + H1)
// Legacy values 'cdg' and 'cdg-v4' both map to 'cdg-v4-strict' (canonical v4).
// Legacy value 'cdg-v3' maps to 'cdg-v4-loose' for users who preferred the older variant.
// =============================================================================

async function generatePuzzleAsyncV2(level, options, onProgress) {
  options = options || {};

  // V12.22: 진입 즉시 첫 progress emit → React가 LoadingOverlay에 진행 phase 표시
  // 이 함수 내부의 어떤 sync setup이라도 5초 freeze 만들지 못함 (UI는 살아 있음)
  // _v9Retrying인 경우(재귀 호출)에는 이미 외부에서 emit했으므로 skip
  if (onProgress && !options._v9Retrying) {
    const eng = options.engine || 'classic';
    onProgress({
      phase: eng === 'v6-sota' ? 'v6-sota-pool' : (eng + '-attempt'),
      attempt: 1, attempts: 1,
      poolSize: 0, target: 0,
      elapsed: 0,
      budget: (DIFFICULTY_CONFIGS[level] && DIFFICULTY_CONFIGS[level].totalBudgetMs) || 25000,
      currentMaxSolutions: 1,
      level,
    });
    await new Promise(r => setTimeout(r, 0));  // yield → React commit
  }

  // ═══ V9 SOTA — Quality-targeted retry pipeline ════════════════════
  // 사용자가 V9 quality target을 지정하면 best-of-K 시도.
  // options.v9Target = { minQuality, minOnboarding, gridAppropriate, minClimax }
  // options.v9MaxAttempts = K (기본 5)
  if (options.v9Target && !options._v9Retrying) {
    const target = options.v9Target;
    const maxAttempts = options.v9MaxAttempts || 5;
    let bestResult = null, bestScore = -Infinity;

    for (let attempt = 0; attempt < maxAttempts; attempt++) {
      const subOptions = Object.assign({}, options, {
        _v9Retrying: true,
        validateWithSolver: true,
      });
      onProgress && onProgress({ phase: 'v9-retry-attempt', attempt: attempt + 1, max: maxAttempts });
      const candidate = await generatePuzzleAsyncV2(level, subOptions, onProgress);

      if (!candidate || !candidate.v9) {
        if (!bestResult) bestResult = candidate;
        continue;
      }

      const v9 = candidate.v9;
      const bd = v9.breakdown || {};
      // V9 acceptance scoring — weighted satisfaction proxy
      // 사용자 12 시드 ground truth 기반 가중치
      const qualScore = v9.quality;
      const onbScore = (bd.onboardingQ || 0) * 100;
      const climaxScore = (bd.climaxQ || 0) * 100;
      const equityScore = (bd.ruleEquityQ || 0) * 100;
      const freedomScore = (bd.placementFreedomQ || 0) * 100;
      const sizeAppScore = (bd.sizeAppropriatenessQ || 0) * 100;
      const gridAppropriateBonus = v9.gridAppropriate ? 10 : -50;

      // Composite acceptance score (시드3 sat=5 ≈ 92, 시드7 sat=1 ≈ 30)
      let score = qualScore * 0.30
                + onbScore * 0.20
                + climaxScore * 0.15
                + equityScore * 0.10
                + freedomScore * 0.10
                + sizeAppScore * 0.15
                + gridAppropriateBonus;

      // ═══ V6 score boost: archetype preference + difficulty band centering ═══
      // Acceptance constraints가 완화돼서 (uniqueness 보장과 양립 가능하도록),
      // score boost를 강화해 우수 puzzle을 우선 선택.
      const v6Score = target._v6Extended;
      if (v6Score) {
        // V12.10: archetype score boost 제거 (사용자 요청)
        // Bonus 2: difficulty centered in target band
        if (v6Score.v11DifficultyMin != null && v6Score.v11DifficultyMax != null) {
          const center = (v6Score.v11DifficultyMin + v6Score.v11DifficultyMax) / 2;
          const halfRange = (v6Score.v11DifficultyMax - v6Score.v11DifficultyMin) / 2;
          const distFromCenter = Math.abs(v9.difficulty - center);
          if (halfRange > 0) {
            score += Math.max(0, 12 * (1 - distFromCenter / halfRange));   // 10 → 12
          }
        }
        // Bonus 3: time centered in target band
        if (v6Score.v11TimeMin != null && v6Score.v11TimeMax != null) {
          const center = (v6Score.v11TimeMin + v6Score.v11TimeMax) / 2;
          const halfRange = (v6Score.v11TimeMax - v6Score.v11TimeMin) / 2;
          const distFromCenter = Math.abs(v9.time - center);
          if (halfRange > 0) {
            score += Math.max(0, 10 * (1 - distFromCenter / halfRange));    // 8 → 10
          }
        }
        // Bonus 4 NEW: high climaxQ super-bonus (마스터피스 식별)
        // 시드11 climaxQ 0.85 같은 마스터피스를 우선 선택. acceptance에서는 minClimax 완화했지만
        // score에서는 climax 우수 puzzle에 추가 보너스.
        if ((bd.climaxQ || 0) >= 0.80) score += 15;  // 마스터피스 super-bonus
        else if ((bd.climaxQ || 0) >= 0.70) score += 6;
        // Bonus 5 NEW: high quality super-bonus
        if (qualScore >= 90) score += 12;            // 시드11 q=92 super-bonus
        else if (qualScore >= 85) score += 6;
      }

      // Hard constraints check
      const passMinQual = !target.minQuality || qualScore >= target.minQuality;
      const passMinOnb  = !target.minOnboarding || (bd.onboardingQ || 0) >= target.minOnboarding;
      const passGridApp = !target.gridAppropriate || v9.gridAppropriate;
      const passClimax  = !target.minClimax || (bd.climaxQ || 0) >= target.minClimax;

      // ═══ V6 EXTENDED hard constraints ═══════════════════════════════
      // Per-tier 세밀 quality gate (시드별 ground truth 기반)
      const v6 = target._v6Extended;
      let passV6Difficulty = true, passV6Time = true, passV6FirstNaked = true;
      let passV6AvgDomain = true, passV6Holding = true, passV6MaxGap = true;
      let passV6RuleEquity = true, passV6Freedom = true, passV6SizeApp = true;
      let passV6Breadth = true, passV6Richness = true, passV6Flow = true;
      let passV6Archetype = true;
      let passV6PreReveal = true;  // V12 NEW
      // V12.9 satisfaction invariants
      let passV6Cascade = true, passV6Backtrack = true, passV6LineAxis = true;
      // V12.11 backbone 3
      let passV6NakedSingle = true, passV6TotalSat = true, passV6TotalForce = true, passV6LineCountShare = true;
      if (v6) {
        if (v6.v11DifficultyMin != null) passV6Difficulty = passV6Difficulty && v9.difficulty >= v6.v11DifficultyMin;
        if (v6.v11DifficultyMax != null) passV6Difficulty = passV6Difficulty && v9.difficulty <= v6.v11DifficultyMax;
        if (v6.v11TimeMin != null) passV6Time = passV6Time && v9.time >= v6.v11TimeMin;
        if (v6.v11TimeMax != null) passV6Time = passV6Time && v9.time <= v6.v11TimeMax;
        if (v6.minFirstFiveNaked != null) passV6FirstNaked = (bd.firstFiveNaked || 0) >= v6.minFirstFiveNaked;
        if (v6.maxAvgDomain != null) passV6AvgDomain = (bd.avgDomain || 0) <= v6.maxAvgDomain;
        if (v6.maxHoldingLoad != null) passV6Holding = (bd.holdingLoad || 0) <= v6.maxHoldingLoad;
        if (v6.maxMaxGap != null) passV6MaxGap = (bd.maxGap || 0) <= v6.maxMaxGap;
        if (v6.minRuleEquityQ != null) passV6RuleEquity = (bd.ruleEquityQ || 0) >= v6.minRuleEquityQ;
        if (v6.minPlacementFreedomQ != null) passV6Freedom = (bd.placementFreedomQ || 0) >= v6.minPlacementFreedomQ;
        if (v6.minSizeAppropriatenessQ != null) passV6SizeApp = (bd.sizeAppropriatenessQ || 0) >= v6.minSizeAppropriatenessQ;
        if (v6.minAxiomBreadth != null) passV6Breadth = (bd.axiomBreadth || 0) >= v6.minAxiomBreadth;
        if (v6.minRichnessQ != null) passV6Richness = (bd.richnessQ || 0) >= v6.minRichnessQ;
        if (v6.minFlow != null) passV6Flow = (bd.flow || 0) >= v6.minFlow;
        // V12.9: 만족 시드 invariants
        if (v6.maxTerminalCascade != null) passV6Cascade = (bd.lateDecisions || 0) <= v6.maxTerminalCascade;
        if (v6.maxBacktrackUsage != null) passV6Backtrack = (bd.cat_backtrack || 0) <= v6.maxBacktrackUsage;
        if (v6.maxLineAxisUsage != null) passV6LineAxis = (bd.cat_lineAxis || 0) <= v6.maxLineAxisUsage;
        // V12.11: Backbone 3 + lineCount share (만족 시드 9/9 100% 등장)
        if (v6.minNakedSingle != null) passV6NakedSingle = (bd.pat_nakedSingle || 0) >= v6.minNakedSingle;
        if (v6.minTotalSaturation != null) passV6TotalSat = (bd.pat_totalSaturation || 0) >= v6.minTotalSaturation;
        if (v6.minTotalForcing != null) passV6TotalForce = (bd.pat_totalForcing || 0) >= v6.minTotalForcing;
        if (v6.minLineCountShare != null) passV6LineCountShare = (bd.lineCountShare || 0) >= v6.minLineCountShare;
        // V12.10: forbiddenArchetype check 제거 (사용자 요청)
        // V12 NEW: pre-reveal ratio gate (시드15-style trivial puzzle 차단)
        if (v6.preRevealRatioMax != null) {
          const __cp = candidate.tokens ? Math.floor(candidate.tokens.length / 2) :
                       (candidate.config?.n === 4 ? 4 :
                        candidate.config?.n === 7 ? 11 : 9);
          const __cf = (candidate.fixedCells || []).length;
          const __cr = (__cp * 2) > 0 ? __cf / (__cp * 2) : 0;
          passV6PreReveal = __cr <= v6.preRevealRatioMax;
        }
      }

      const allPassed = passMinQual && passMinOnb && passGridApp && passClimax
                     && passV6Difficulty && passV6Time && passV6FirstNaked
                     && passV6AvgDomain && passV6Holding && passV6MaxGap
                     && passV6RuleEquity && passV6Freedom && passV6SizeApp
                     && passV6Breadth && passV6Richness && passV6Flow
                     && passV6Archetype && passV6PreReveal
                     // V12.9 + V12.11
                     && passV6Cascade && passV6Backtrack && passV6LineAxis
                     && passV6NakedSingle && passV6TotalSat && passV6TotalForce
                     && passV6LineCountShare;

      onProgress && onProgress({
        phase: 'v9-retry-evaluated',
        attempt: attempt + 1,
        score,
        passed: allPassed,
        difficulty: v9.difficulty,
        time: v9.time,
        quality: qualScore,
      });

      if (allPassed) {
        candidate.v9.acceptanceAttempts = attempt + 1;
        candidate.v9.acceptanceScore = score;
        return candidate;
      }
      if (score > bestScore) { bestScore = score; bestResult = candidate; }
    }

    if (bestResult && bestResult.v9) {
      bestResult.v9.acceptanceAttempts = maxAttempts;
      bestResult.v9.acceptanceScore = bestScore;
      bestResult.v9.acceptanceRelaxed = true; // best-effort
    }
    return bestResult;
  }
  // ════════════════════════════════════════════════════════════════════

  let engine = options.engine || (USE_DIFFICULTY_V6 ? 'v6-sota' : 'classic');
  // Backward compat mappings
  if (engine === 'cdg') engine = 'cdg-v4-strict';
  if (engine === 'cdg-v4') engine = 'cdg-v4-strict';
  if (engine === 'cdg-v3') engine = 'cdg-v4-loose';
  // V6 mode auto-upgrade: v5-strict is obsolete (V11 acceptance is its superset).
  // Map cdg-v5-strict → v6-sota when V6 mode is active to take advantage of
  // the multi-axis V11 metric and per-tier V6 targets.
  if (USE_DIFFICULTY_V6 && engine === 'cdg-v5-strict') engine = 'v6-sota';
  const fallback = options.fallbackOnFailure || 'classic';
  let result = null;

  // Custom difficulty support: temporarily override DIFFICULTY_CONFIGS.Custom
  // with the user's customConfig so all downstream generators read the
  // customized parameters via DIFFICULTY_CONFIGS[level] as usual.
  let savedCustom = null;
  if (level === 'Custom' && options.customConfig) {
    savedCustom = DIFFICULTY_CONFIGS.Custom;
    DIFFICULTY_CONFIGS.Custom = buildCustomConfig(options.customConfig);
  }

  try {
    if (engine === 'cdg-v4-loose') {
      try {
        result = await generatePuzzleCDG_v4_loose(level, onProgress);
      } catch (e) {
        console.error('CDG v4-loose generation error:', e);
        result = null;
      }
      if (!result && fallback === 'classic') {
        onProgress && onProgress({ phase: 'cdg-v4-loose-failed-fallback-classic' });
        result = await generatePuzzleAsync(level, onProgress);
      }
    } else if (engine === 'cdg-v4-strict') {
      try {
        result = await generatePuzzleCDG_v4_strict(level, onProgress);
      } catch (e) {
        console.error('CDG v4-strict generation error:', e);
        result = null;
      }
      if (!result && fallback === 'classic') {
        onProgress && onProgress({ phase: 'cdg-v4-strict-failed-fallback-classic' });
        result = await generatePuzzleAsync(level, onProgress);
      }
    } else if (engine === 'cdg-v5-strict') {
      try {
        result = await generatePuzzleCDG_v5_strict(level, onProgress);
      } catch (e) {
        console.error('CDG v5-strict generation error:', e);
        result = null;
      }
      if (!result && fallback === 'classic') {
        onProgress && onProgress({ phase: 'cdg-v5-strict-failed-fallback-classic' });
        result = await generatePuzzleAsync(level, onProgress);
      }
    } else if (engine === 'v6-sota') {
      // V6 SOTA — V11 acceptance + V6 7-tier targets + pool selection
      // 권장 default for V6 mode (replaces cdg-v5-strict role).
      try {
        result = await generatePuzzleCDG_v6_sota(level, onProgress);
      } catch (e) {
        console.error('V6-SOTA generation error:', e);
        result = null;
      }
      if (!result && fallback === 'classic') {
        onProgress && onProgress({ phase: 'v6-sota-failed-fallback-classic' });
        result = await generatePuzzleAsync(level, onProgress);
      }
    } else if (engine === 'classic-explore') {
      // Explore mode: solver-bypass + diversity-enhanced sampling for
      // latent-pattern discovery. Skips the validateWithSolver tagging
      // pass below because generatePuzzleClassicExplore handles its own
      // solver diagnostics (and never rejects on stuck status).
      try {
        result = await generatePuzzleClassicExplore(level, onProgress);
      } catch (e) {
        console.error('Classic-explore generation error:', e);
        result = null;
      }
      if (!result && fallback === 'classic') {
        onProgress && onProgress({ phase: 'classic-explore-failed-fallback-classic' });
        result = await generatePuzzleAsync(level, onProgress);
      }
    } else {
      result = await generatePuzzleAsync(level, onProgress);
    }
  } finally {
    // Always restore the Custom template
    if (savedCustom !== null) {
      DIFFICULTY_CONFIGS.Custom = savedCustom;
    }
  }
  // Optional trace validation tag (for any engine, uses traceSolve_v2).
  // Skip for explore-mode results — those already ran their own solver
  // diagnostic pass with deeper budget and attached latentPatternInfo.
  if (options.validateWithSolver && result && !result.traceDifficulty && !result.exploreMode) {
    // V12.23: phase를 'verify'로 emit해서 UI에 "최종 검증 중" 표시
    //   이전: generation 끝난 후 post-validation 동안 phase는 마지막 'classic-attempt'에 stuck
    //         → 사용자에게는 "기초 격자 직조 중"이 1.5초+ 추가 freeze로 보임
    if (onProgress) {
      onProgress({
        phase: 'classic-verify',
        attempts: result.attemptCount || 1,
        elapsed: 0,
        budget: 2000,
        currentMaxSolutions: 1,
        level,
      });
      await new Promise(r => setTimeout(r, 0));  // React render
    }
    try {
      // V12.23: timeLimitMs 1500 → 1000으로 단축 + 1.0초 단일 freeze cap
      const trace = traceSolve_v2(result, { timeLimitMs: 1000, maxLookaheadDepth: 1 });
      if (trace.status === 'solved') {
        result.traceDifficulty = computeTraceDifficulty(trace.diagnostics);
        result.traceShape = computeTraceShape(trace.trace);
        result.traceLength = trace.trace.length;
        // Also compute v5 metric for any engine
        try { result.traceDifficulty_v5 = computeTraceDifficulty_v5(trace.diagnostics, trace.trace); } catch (e) {}
        // V9 SOTA — Triple-axis attached to result
        try {
          if (typeof computeTraceTripleAxis_v9 !== 'undefined') {
            const v9 = computeTraceTripleAxis_v9(trace.diagnostics, trace.trace, result);
            result.v9 = {
              difficulty: v9.difficulty,
              time: v9.time,
              quality: v9.quality,
              difficultyTier: difficultyTier_v9(v9.difficulty).name,
              timeTier: timeTier_v9(v9.time).name,
              qualityTier: qualityTier_v9(v9.quality).name,
              structuralArchetype: v9.structuralArchetype,
              affectiveArchetype: v9.affectiveArchetype,
              breakdown: v9.breakdown,
            };
            // Grid-adaptive validation flag (NEW)
            // 사용자: "5x5는 쉬운 난이도 전용", "7x7 초반 막힘 = 하기 싫음"
            const n = result.n || 6;
            const d = v9.difficulty;
            const onb = v9.breakdown.onboardingQ || 0;
            let appropriate = true;
            let warning = null;
            if (n <= 4 && d > 32) { appropriate = false; warning = 'oversized-difficulty-for-tiny-grid'; }
            else if (n === 5 && d > 65) { appropriate = false; warning = 'advanced-on-5x5-discouraged'; }
            else if (n === 7 && onb < 0.5) { appropriate = false; warning = 'rough-onboarding-on-7x7'; }
            result.v9.gridAppropriate = appropriate;
            if (warning) result.v9.warning = warning;
          }
        } catch (e) { /* swallow */ }
      }
      result.traceStatus = trace.status;
    } catch (e) { /* swallow */ }
  }
  // Tag every successfully generated puzzle with a structural identifier.
  // Two puzzles with identical structure share the same ID. Useful for
  // user reference, sharing, and debugging.
  if (result && !result.puzzleId) {
    try {
      result.puzzleId = computePuzzleIdentifier(result);
    } catch (e) { /* swallow */ }
  }
  // Also attach a reproducible seed: the complete puzzle structure encoded
  // into a base64 string. Loading this seed reconstructs the exact same
  // puzzle without re-running the generator.
  if (result && !result.seed) {
    try {
      // For Custom puzzles, embed the customConfig so it round-trips
      if (level === 'Custom' && options.customConfig) {
        result.customConfigUsed = options.customConfig;
      }
      result.seed = encodePuzzleSeed(result);
    } catch (e) { /* swallow */ }
  }
  if (!result) result = loadFallback(level);
  return result;
}

// =============================================================================
// SECTION 4 — RUNTIME VALIDATION (Constraint-Based Win)
// =============================================================================

function evaluateLineRuleRuntime(rule, placements, tokens, marks) {
  const inLine = (cell) => rule.isRow ? cell.row === rule.idx : cell.col === rule.idx;
  const placedTokenEntries = Object.entries(placements).filter(([_, cell]) => inLine(cell));
  if (placedTokenEntries.length === 0) return true; // empty line auto-satisfied

  return placedTokenEntries.every(([tid, _]) => {
    const t = tokens.find(t => t.id === tid);
    if (!t) return false;
    if (rule.dim === 'gender') {
      return marks[tid] === rule.val;
    }
    const animal = animalById(t.animalId);
    return animal[rule.dim] === rule.val;
  });
}

// Returns 'empty' | 'partial' | 'bad' (some token violates rule) | 'satisfied-rule-only'
// 'satisfied-rule-only' means: line is non-empty AND every placed token in this
// line matches the rule. This is NOT enough to highlight green — green requires
// ALL line count hints in the same line to also be ok (handled at caller).
function evaluateLineRuleStatus(rule, placements, tokens, marks) {
  const inLine = (cell) => rule.isRow ? cell.row === rule.idx : cell.col === rule.idx;
  const placedTokenEntries = Object.entries(placements).filter(([_, cell]) => inLine(cell));
  if (placedTokenEntries.length === 0) return 'empty';

  const checkToken = (tid) => {
    const t = tokens.find(t => t.id === tid);
    if (!t) return false;
    if (rule.dim === 'gender') {
      return marks[tid] === rule.val;
    }
    const animal = animalById(t.animalId);
    return animal[rule.dim] === rule.val;
  };

  // Gender rule: a token's gender is "?", treat as not-yet-conflicting (partial),
  // but if any placed token has gender set and it doesn't match → bad.
  if (rule.dim === 'gender') {
    let hasViolation = false;
    let allMarked = true;
    for (const [tid, _] of placedTokenEntries) {
      const m = marks[tid];
      if (!m) { allMarked = false; continue; }
      if (m !== rule.val) { hasViolation = true; break; }
    }
    if (hasViolation) return 'bad';
    if (!allMarked) return 'partial';
    return 'satisfied-rule-only';
  }

  // habitat / diet rule: animal species is fixed at placement, so every placed
  // token's attribute is immediately known. Any mismatch = bad.
  for (const [tid, _] of placedTokenEntries) {
    if (!checkToken(tid)) return 'bad';
  }
  return 'satisfied-rule-only';
}

function evaluateCountHintRuntime(hint, placements, tokens, marks) {
  const lineTokens = Object.entries(placements).filter(([_, cell]) =>
    hint.row !== null ? cell.row === hint.row : cell.col === hint.col
  );
  if (hint.type === 'total') return lineTokens.length === hint.value;
  if (hint.type === 'H1') return lineTokens.filter(([tid]) => marks[tid] === 'male').length === hint.value;
  if (hint.type === 'H2') return lineTokens.filter(([tid]) => marks[tid] === 'female').length === hint.value;
  return true;
}

function checkAllPairsAdjacent(pairs, placements) {
  for (const [t1, t2] of pairs) {
    const p1 = placements[t1], p2 = placements[t2];
    if (!p1 || !p2) return false;
    if (!isAdjacent(p1, p2)) return false;
  }
  return true;
}

function checkWinV2(puzzle, placements, marks) {
  if (!puzzle) return false;
  const tokens = puzzle.tokens;

  if (Object.keys(placements).length !== tokens.length) return false;
  if (Object.keys(marks).length !== tokens.length) return false;

  // Pair gender constraint
  for (const [t1, t2] of puzzle.pairs) {
    if (!marks[t1] || !marks[t2]) return false;
    if (marks[t1] === marks[t2]) return false;
  }

  // Adjacency
  if (!checkAllPairsAdjacent(puzzle.pairs, placements)) return false;

  // Forbidden cells
  const fset = new Set(puzzle.forbiddenCells.map(([r, c]) => `${r},${c}`));
  for (const cell of Object.values(placements)) {
    if (fset.has(`${cell.row},${cell.col}`)) return false;
  }

  // Line rules (evaluated at current placement, not canonical)
  for (const rule of (puzzle.lineRules || [])) {
    if (!evaluateLineRuleRuntime(rule, placements, tokens, marks)) return false;
  }

  // Count hints
  for (const hint of (puzzle.countHints || [])) {
    if (!evaluateCountHintRuntime(hint, placements, tokens, marks)) return false;
  }

  // Fixed tiles must retain position + species + gender
  for (const ft of (puzzle.fixedCells || [])) {
    const tokenAtCell = Object.entries(placements).find(([_, p]) =>
      p.row === ft.row && p.col === ft.col
    );
    if (!tokenAtCell) return false;
    const [tid] = tokenAtCell;
    const t = tokens.find(t => t.id === tid);
    if (!t || t.animalId !== ft.animalId) return false;
    if (marks[tid] !== ft.gender) return false;
  }

  return true;
}

// CustomPanel — modal overlay for configuring all difficulty parameters.
// Renders one control per CUSTOM_PARAM_SPEC entry. Passes the resulting
// config back via onApply, which then triggers a Custom-level generation.
// ─────────────────────────────────────────────────────────────────────────────
// V12.10 SOTA: 모바일 친화적 Custom Param Control
// - 큰 터치 타겟 (최소 44px height)
// - 숫자 입력 대신 stepper (- / +) 버튼
// - pair는 dual range slider (min/max thumb)
// - Section 그룹화로 시각적 정리
// - 실시간 동기화된 value badge
function CustomParamControl({ spec, value, onChange }) {
  const t = useT();
  const labelKey = `custom.param.${spec.key}`;
  const label = t(labelKey) || spec.label || spec.key;
  const help = spec.help || '';

  // Common label + help block
  const LabelBlock = () => (
    <div style={{ display: 'flex', alignItems: 'baseline', gap: 6, flexWrap: 'wrap', marginBottom: 6 }}>
      <span className="font-body" style={{
        fontSize: 13, fontWeight: 500, color: 'var(--ink-primary)',
      }}>{label}</span>
      {help && (
        <span className="font-body" style={{
          fontSize: 11, color: 'var(--ink-tertiary)', fontWeight: 400,
        }}>· {help}</span>
      )}
    </div>
  );

  // --- INT TYPE: stepper buttons (-/+) with center value ---
  if (spec.type === 'int') {
    const v = (typeof value === 'number') ? value : spec.default;
    const dec = () => onChange(Math.max(spec.min, v - spec.step));
    const inc = () => onChange(Math.min(spec.max, v + spec.step));
    const atMin = v <= spec.min;
    const atMax = v >= spec.max;

    return (
      <div style={{ padding: '10px 0', borderBottom: '1px solid var(--border-soft)' }}>
        <LabelBlock />
        <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
          {/* Minus button */}
          <button
            onClick={dec}
            disabled={atMin}
            aria-label={`${label} 감소`}
            style={{
              flex: '0 0 44px', height: 44,
              border: '1px solid var(--border-medium)',
              borderRadius: 6,
              background: atMin ? 'var(--bg-soft)' : 'var(--bg-card)',
              color: atMin ? 'var(--ink-tertiary)' : 'var(--ink-primary)',
              fontSize: 20, fontWeight: 500, lineHeight: 1,
              cursor: atMin ? 'not-allowed' : 'pointer',
              touchAction: 'manipulation',
              userSelect: 'none',
              transition: 'background 120ms',
            }}>−</button>
          {/* Slider for fine adjustment */}
          <input type="range" min={spec.min} max={spec.max} step={spec.step} value={v}
            onChange={(e) => onChange(parseInt(e.target.value, 10))}
            style={{ flex: 1, minWidth: 60, height: 44, accentColor: 'var(--ink-primary)' }} />
          {/* Plus button */}
          <button
            onClick={inc}
            disabled={atMax}
            aria-label={`${label} 증가`}
            style={{
              flex: '0 0 44px', height: 44,
              border: '1px solid var(--border-medium)',
              borderRadius: 6,
              background: atMax ? 'var(--bg-soft)' : 'var(--bg-card)',
              color: atMax ? 'var(--ink-tertiary)' : 'var(--ink-primary)',
              fontSize: 20, fontWeight: 500, lineHeight: 1,
              cursor: atMax ? 'not-allowed' : 'pointer',
              touchAction: 'manipulation',
              userSelect: 'none',
              transition: 'background 120ms',
            }}>+</button>
          {/* Value badge */}
          <div className="font-mono" style={{
            flex: '0 0 60px', textAlign: 'center',
            padding: '8px 10px',
            background: 'var(--ink-primary)',
            color: 'var(--bg-paper)',
            borderRadius: 6,
            fontSize: 14, fontWeight: 600,
            minHeight: 44,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
          }}>{v}</div>
        </div>
      </div>
    );
  }

  // --- PAIR TYPE: stepper for both min and max ---
  if (spec.type === 'pair') {
    const v = (Array.isArray(value) && value.length === 2) ? value : spec.default;
    const [lo, hi] = v;
    const decLo = () => onChange([Math.max(spec.min, lo - spec.step), hi]);
    const incLo = () => onChange([Math.min(hi, lo + spec.step), hi]);
    const decHi = () => onChange([lo, Math.max(lo, hi - spec.step)]);
    const incHi = () => onChange([lo, Math.min(spec.max, hi + spec.step)]);

    const StepperRow = ({ label, val, onDec, onInc, atMin, atMax }) => (
      <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
        <span className="font-body" style={{
          flex: '0 0 38px', fontSize: 11, color: 'var(--ink-tertiary)',
          textAlign: 'right', fontWeight: 500,
        }}>{label}</span>
        <button onClick={onDec} disabled={atMin} aria-label={`${label} 감소`}
          style={{
            flex: '0 0 40px', height: 40,
            border: '1px solid var(--border-medium)', borderRadius: 5,
            background: atMin ? 'var(--bg-soft)' : 'var(--bg-card)',
            color: atMin ? 'var(--ink-tertiary)' : 'var(--ink-primary)',
            fontSize: 18, fontWeight: 500, cursor: atMin ? 'not-allowed' : 'pointer',
            touchAction: 'manipulation', userSelect: 'none',
          }}>−</button>
        <div className="font-mono" style={{
          flex: 1, minWidth: 0, height: 40,
          padding: '0 8px',
          background: 'var(--bg-soft)',
          color: 'var(--ink-primary)',
          borderRadius: 5,
          fontSize: 14, fontWeight: 600,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
        }}>{val}</div>
        <button onClick={onInc} disabled={atMax} aria-label={`${label} 증가`}
          style={{
            flex: '0 0 40px', height: 40,
            border: '1px solid var(--border-medium)', borderRadius: 5,
            background: atMax ? 'var(--bg-soft)' : 'var(--bg-card)',
            color: atMax ? 'var(--ink-tertiary)' : 'var(--ink-primary)',
            fontSize: 18, fontWeight: 500, cursor: atMax ? 'not-allowed' : 'pointer',
            touchAction: 'manipulation', userSelect: 'none',
          }}>+</button>
      </div>
    );

    return (
      <div style={{ padding: '10px 0', borderBottom: '1px solid var(--border-soft)' }}>
        <LabelBlock />
        <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
          <StepperRow label="최소" val={lo} onDec={decLo} onInc={incLo}
            atMin={lo <= spec.min} atMax={lo >= hi} />
          <StepperRow label="최대" val={hi} onDec={decHi} onInc={incHi}
            atMin={hi <= lo} atMax={hi >= spec.max} />
        </div>
      </div>
    );
  }

  // --- ENUM TYPE: chip-style toggle buttons ---
  if (spec.type === 'enum') {
    const v = (typeof value === 'string') ? value : spec.default;
    return (
      <div style={{ padding: '10px 0', borderBottom: '1px solid var(--border-soft)' }}>
        <LabelBlock />
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
          {spec.options.map(([val, optLabel]) => {
            const active = v === val;
            return (
              <button key={val} onClick={() => onChange(val)}
                aria-pressed={active}
                style={{
                  flex: '0 1 auto',
                  minHeight: 40,
                  padding: '8px 14px',
                  border: '1px solid',
                  borderColor: active ? 'var(--ink-primary)' : 'var(--border-medium)',
                  borderRadius: 6,
                  background: active ? 'var(--ink-primary)' : 'var(--bg-card)',
                  color: active ? 'var(--bg-paper)' : 'var(--ink-secondary)',
                  fontSize: 12, fontWeight: active ? 600 : 500,
                  cursor: 'pointer',
                  touchAction: 'manipulation',
                  userSelect: 'none',
                  transition: 'background 120ms, border-color 120ms',
                  whiteSpace: 'nowrap',
                }}
                className="font-body">{optLabel}</button>
            );
          })}
        </div>
      </div>
    );
  }
  return null;
}

function CustomPanel({ open, customConfig, onApply, onClose }) {
  const t = useT();
  const [draft, setDraft] = React.useState(customConfig || buildDefaultCustomConfig());
  // V12.10 SOTA: section collapse state — 기본/차단고정/라인규약은 펼침, 나머지는 접음
  const [collapsedSections, setCollapsedSections] = React.useState({
    '기본': false,
    '차단/고정': false,
    '라인 규약': false,
    '힌트': true,
    '동물 풀': true,
    '생성': true,
    '고급': true,
  });

  // V12.10: open 트랜지션(false→true) 시에만 customConfig를 draft로 동기화
  // 모달이 열려있는 동안 customConfig prop이 변해도 사용자의 draft 편집을 덮어쓰지 않음
  // 또한 open될 때 customConfig가 있으면 그것 그대로, 없으면 default로 시작
  const prevOpenRef = React.useRef(false);
  React.useEffect(() => {
    if (open && !prevOpenRef.current) {
      // false → true 트랜지션: draft 초기화
      setDraft(customConfig || buildDefaultCustomConfig());
    }
    prevOpenRef.current = open;
  }, [open, customConfig]);

  if (!open) return null;

  const update = (key, val) => setDraft(prev => ({ ...prev, [key]: val }));
  const toggleSection = (sec) => setCollapsedSections(prev => ({ ...prev, [sec]: !prev[sec] }));

  // V12.10 SOTA: Preset chips (기본 puzzle 모양 빠르게 시작)
  const PRESETS = [
    { name: '🌱 빠른 (4×4)', config: { n: 4, k: 3, forbiddenCount: [0, 0],
      ruleCount: [2, 2], ruleDimensions: 'habitat',
      countCoverage: [6, 7], fixedTileCount: [2, 3], maxSolutions: 1 } },
    { name: '🌳 중급 (6×6)', config: { n: 6, k: 7, forbiddenCount: [2, 4],
      ruleCount: [3, 4], ruleDimensions: 'habitat,diet',
      countCoverage: [12, 12], fixedTileCount: [3, 4], maxSolutions: 1 } },
    { name: '🌲 중상급 (6×6)', config: { n: 6, k: 9, forbiddenCount: [2, 4],
      ruleCount: [5, 5], ruleDimensions: 'habitat,diet',
      countCoverage: [12, 12], fixedTileCount: [5, 5], maxSolutions: 1 } },
    { name: '🏔 상급 (7×7)', config: { n: 7, k: 11, forbiddenCount: [3, 5],
      ruleCount: [8, 8], ruleDimensions: 'habitat,diet',
      countCoverage: [14, 14], fixedTileCount: [9, 9], maxSolutions: 1 } },
    { name: '⛰ 마스터 (8×8)', config: { n: 8, k: 13, forbiddenCount: [3, 6],
      ruleCount: [10, 12], ruleDimensions: 'habitat,diet',
      countCoverage: [16, 16], fixedTileCount: [10, 12], maxSolutions: 1 } },
    { name: '👑 그랜드마스터 (9×9)', config: { n: 9, k: 16, forbiddenCount: [4, 8],
      ruleCount: [14, 16], ruleDimensions: 'habitat,diet',
      countCoverage: [18, 18], fixedTileCount: [12, 14], maxSolutions: 1 } },
  ];

  const applyPreset = (preset) => {
    setDraft(prev => ({ ...prev, ...preset.config }));
  };

  // Compute warnings: tokens (k*2) + forbidden must fit in n*n cells, etc.
  const warnings = [];
  const totalCells = draft.n * draft.n;
  const tokenCount = draft.k * 2;
  const forbHi = Array.isArray(draft.forbiddenCount) ? draft.forbiddenCount[1] : 0;
  if (tokenCount + forbHi > totalCells) {
    warnings.push(`토큰 ${tokenCount}개 + 차단 ${forbHi}개가 ${draft.n}×${draft.n}=${totalCells}셀을 초과`);
  }
  if (draft.k > ANIMALS.length) {
    warnings.push(`페어 수가 ${ANIMALS.length}를 초과 (동물 종 ${ANIMALS.length}개 한도)`);
  }
  const fixedHi = Array.isArray(draft.fixedTileCount) ? draft.fixedTileCount[1] : 0;
  const fixedLo = Array.isArray(draft.fixedTileCount) ? draft.fixedTileCount[0] : 0;
  if (fixedHi > tokenCount) {
    warnings.push(`고정 타일 ${fixedHi}개가 총 토큰 수 ${tokenCount}개를 초과`);
  }
  if (Array.isArray(draft.countCoverage) && draft.countCoverage[1] > 2 * draft.n) {
    warnings.push(`힌트 라인 수가 총 라인 수 ${2*draft.n}을 초과`);
  }
  // Solvability warning: low information density makes unique solutions hard to find
  const totalLineCount = 2 * draft.n;
  const countHintHi = Array.isArray(draft.countCoverage) ? draft.countCoverage[1] : totalLineCount;
  const ruleHi = Array.isArray(draft.ruleCount) ? draft.ruleCount[1] : 0;
  const infoScore = (countHintHi / totalLineCount) * 0.5 + (fixedHi / Math.max(1, tokenCount)) * 0.3 + (ruleHi / Math.max(1, totalLineCount)) * 0.2;
  if ((draft.maxSolutions || 1) === 1 && infoScore < 0.4) {
    warnings.push(`정보가 적어 유일해(maxSolutions=1)로 생성이 어려울 수 있습니다. maxSolutions를 2-5로 늘리거나 고정 타일/힌트를 추가하세요.`);
  }
  if (fixedLo === 0 && countHintHi < totalLineCount * 0.5 && (draft.maxSolutions || 1) === 1) {
    warnings.push(`고정 타일 0개 + 힌트 적음 → 유일해 생성 매우 어려움. 시간 한도 내 실패 가능.`);
  }

  // Group params by section (preserving spec order)
  const sections = {};
  const sectionOrder = [];
  for (const spec of CUSTOM_PARAM_SPEC) {
    const sec = spec.section || '기타';
    if (!sections[sec]) {
      sections[sec] = [];
      sectionOrder.push(sec);
    }
    sections[sec].push(spec);
  }

  // Section icon map
  const SECTION_ICONS = {
    '기본': '⊞',
    '차단/고정': '✕',
    '라인 규약': '═',
    '힌트': '◇',
    '동물 풀': '🦁',
    '생성': '⚙',
    '고급': '★',
  };

  return (
    <div style={{
      position: 'fixed', inset: 0, zIndex: 1000,
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      background: 'rgba(20, 18, 14, 0.55)',
      padding: 'clamp(8px, 2vw, 16px)',
    }} onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()} style={{
        background: 'var(--bg-paper)',
        border: '1px solid var(--border-medium)',
        borderRadius: 10,
        padding: 'clamp(14px, 3vw, 22px)',
        maxWidth: 600, width: '100%',
        maxHeight: '92vh', overflowY: 'auto',
        boxShadow: '0 12px 40px rgba(0,0,0,0.22)',
      }}>
        {/* Header */}
        <div style={{
          display: 'flex', alignItems: 'baseline', justifyContent: 'space-between',
          marginBottom: 10, paddingBottom: 10,
          borderBottom: '1px solid var(--border-soft)',
        }}>
          <h2 className="font-display" style={{
            fontSize: 19, fontWeight: 500, letterSpacing: '-0.01em',
            color: 'var(--ink-primary)', margin: 0,
          }}>⚙ {t('custom.title')}</h2>
          <button onClick={onClose} aria-label="close" style={{
            border: 'none', background: 'transparent', cursor: 'pointer',
            color: 'var(--ink-tertiary)', fontSize: 22, padding: '0 8px',
            minHeight: 32, minWidth: 32,
          }}>✕</button>
        </div>

        {/* V12.10 SOTA: Preset chips (빠른 시작) */}
        <div style={{ marginBottom: 14 }}>
          <div className="font-body" style={{
            fontSize: 11, fontWeight: 600, color: 'var(--ink-tertiary)',
            textTransform: 'uppercase', letterSpacing: '0.05em',
            marginBottom: 6,
          }}>빠른 시작 (프리셋)</div>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
            {PRESETS.map((preset, i) => (
              <button key={i} onClick={() => applyPreset(preset)}
                style={{
                  padding: '8px 12px',
                  border: '1px solid var(--border-medium)',
                  borderRadius: 6,
                  background: 'var(--bg-card)',
                  color: 'var(--ink-secondary)',
                  fontSize: 12, fontWeight: 500,
                  cursor: 'pointer',
                  touchAction: 'manipulation',
                  minHeight: 36,
                }}
                className="font-body">{preset.name}</button>
            ))}
          </div>
        </div>

        {/* Subtitle */}
        <p className="font-body" style={{
          fontSize: 12, color: 'var(--ink-tertiary)',
          marginTop: 0, marginBottom: 14, lineHeight: 1.5,
        }}>{t('custom.subtitle')}</p>

        {/* Sections */}
        {sectionOrder.map(section => {
          const isCollapsed = collapsedSections[section];
          const icon = SECTION_ICONS[section] || '◆';
          const specs = sections[section];
          return (
            <div key={section} style={{ marginBottom: 12 }}>
              {/* Section header — clickable to toggle */}
              <button onClick={() => toggleSection(section)}
                aria-expanded={!isCollapsed}
                style={{
                  display: 'flex', alignItems: 'center', justifyContent: 'space-between',
                  width: '100%',
                  padding: '10px 12px',
                  border: '1px solid var(--border-medium)',
                  borderRadius: 6,
                  background: isCollapsed ? 'var(--bg-card)' : 'var(--bg-soft)',
                  color: 'var(--ink-primary)',
                  cursor: 'pointer',
                  textAlign: 'left',
                  minHeight: 44,
                  touchAction: 'manipulation',
                }}
                className="font-body">
                <span style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                  <span style={{ fontSize: 16 }}>{icon}</span>
                  <span style={{ fontSize: 14, fontWeight: 600 }}>{section}</span>
                  <span style={{ fontSize: 11, color: 'var(--ink-tertiary)' }}>
                    ({specs.length})
                  </span>
                </span>
                <span style={{
                  fontSize: 14, color: 'var(--ink-tertiary)',
                  transform: isCollapsed ? 'rotate(0deg)' : 'rotate(180deg)',
                  transition: 'transform 160ms',
                }}>▼</span>
              </button>
              {/* Section body */}
              {!isCollapsed && (
                <div style={{
                  padding: '4px 4px',
                  borderLeft: '2px solid var(--border-soft)',
                  marginLeft: 8,
                  marginTop: 4,
                }}>
                  {specs.map(spec => (
                    <CustomParamControl
                      key={spec.key}
                      spec={spec}
                      value={draft[spec.key]}
                      onChange={(v) => update(spec.key, v)}
                    />
                  ))}
                </div>
              )}
            </div>
          );
        })}

        {/* Warnings */}
        {warnings.length > 0 && (
          <div style={{
            background: 'rgba(180,83,9,0.08)',
            border: '1px solid var(--accent-gold)',
            borderRadius: 6,
            padding: '10px 12px',
            marginBottom: 14,
            fontSize: 12,
            color: 'var(--accent-gold)',
            lineHeight: 1.6,
          }} className="font-body">
            {warnings.map((w, i) => <div key={i}>⚠ {w}</div>)}
          </div>
        )}

        {/* Action buttons */}
        <div style={{
          display: 'flex', gap: 8, justifyContent: 'flex-end',
          paddingTop: 12, borderTop: '1px solid var(--border-soft)',
        }}>
          <button onClick={() => setDraft(buildDefaultCustomConfig())} className="font-body" style={{
            padding: '10px 16px',
            minHeight: 44,
            border: '1px solid var(--border-medium)',
            borderRadius: 6,
            background: 'var(--bg-card)',
            color: 'var(--ink-secondary)',
            fontSize: 13, fontWeight: 500,
            cursor: 'pointer',
            touchAction: 'manipulation',
          }}>{t('custom.reset')}</button>
          <button onClick={() => { onApply(draft); onClose(); }} className="font-body" style={{
            padding: '10px 20px',
            minHeight: 44,
            border: '1px solid var(--ink-primary)',
            borderRadius: 6,
            background: 'var(--ink-primary)',
            color: 'var(--bg-paper)',
            fontSize: 13, fontWeight: 600,
            cursor: 'pointer',
            touchAction: 'manipulation',
          }}>{t('custom.apply')}</button>
        </div>
      </div>
    </div>
  );
}

function Header({ onHelp, level, onChangeLevel, disabled, engine, onChangeEngine, onOpenCustom, useDifficultyV6, onToggleDifficultyV6 }) {
  // V12.13: 3-row grid layout (사용자 요청)
  //   Row 1 (5 cols): 새싹4×4  기초5×5  중급6×6  상급6×6  커스텀
  //   Row 2 (cols 3-4): 중급7×7  상급7×7
  //   Row 3 (col 1): Classic/V6 토글  +  (cols 3-4): 중급8×8  상급8×8
  // Legacy mode: simple wrap (5 tiers)
  const t = useT();
  const { lang } = useLang();

  // Helper to render a single difficulty button with consistent styling
  const renderDiffBtn = (lv, opts = {}) => {
    if (lv === '__custom__') {
      const lvLabel = t('diff.Custom.label') || t('custom.title') || '커스텀';
      return (
        <button
          key="Custom"
          disabled={disabled}
          onClick={() => onOpenCustom && onOpenCustom()}
          className="font-body"
          title={lvLabel}
          style={{
            display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 4,
            padding: '7px 6px',
            border: '1px solid',
            borderColor: level === 'Custom' ? 'var(--ink-primary)' : 'var(--border-medium)',
            borderRadius: 4,
            background: level === 'Custom' ? 'var(--ink-primary)' : 'var(--bg-card)',
            color: level === 'Custom' ? 'var(--bg-paper)' : 'var(--ink-secondary)',
            cursor: disabled ? 'wait' : 'pointer',
            fontSize: 12, fontWeight: level === 'Custom' ? 600 : 500,
            lineHeight: 1, whiteSpace: 'nowrap',
            minWidth: 0, overflow: 'hidden',                  // V12.14: 좁은 화면 축소
            ...(opts.style || {}),
          }}
        >
          <span style={{ fontSize: 13, flexShrink: 0 }} aria-hidden>⚙</span>
          <span style={{ overflow: 'hidden', textOverflow: 'ellipsis' }}>커스텀</span>
        </button>
      );
    }
    if (!lv) {
      // Empty placeholder cell (preserves grid alignment)
      return <div key={opts.key || Math.random()} aria-hidden style={{ ...(opts.style || {}) }} />;
    }
    const c = DIFFICULTY_CONFIGS[lv];
    if (!c) return null;
    const active = level === lv;
    const lvLabel = t(`diff.${lv}.label`) || c.label || lv;
    return (
      <button
        key={lv}
        role="radio"
        aria-checked={active}
        disabled={disabled}
        onClick={() => onChangeLevel(lv)}
        className="font-body"
        title={`${lvLabel} · ${c.n}×${c.n}`}
        style={{
          display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 4,
          padding: '7px 6px',
          border: '1px solid',
          borderColor: active ? 'var(--ink-primary)' : 'var(--border-medium)',
          borderRadius: 4,
          background: active ? 'var(--ink-primary)' : 'var(--bg-card)',
          color: active ? 'var(--bg-paper)' : 'var(--ink-secondary)',
          cursor: disabled ? 'wait' : 'pointer',
          fontSize: 12, fontWeight: active ? 600 : 500,
          lineHeight: 1, whiteSpace: 'nowrap',
          minWidth: 0,                                  // V12.14: 좁은 화면 축소 허용
          overflow: 'hidden',
          transition: 'background 140ms, color 140ms, border-color 140ms',
          ...(opts.style || {}),
        }}
      >
        <span style={{ fontSize: 13, flexShrink: 0 }} aria-hidden>{c.glyph}</span>
        <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', minWidth: 0 }}>{lvLabel}</span>
        <span className="font-mono diff-btn-size" style={{
          fontSize: 10,
          color: active ? 'rgba(254,252,248,0.65)' : 'var(--ink-tertiary)',
          marginLeft: 1,
          flexShrink: 0,
        }}>{c.n}×{c.n}</span>
      </button>
    );
  };

  // V6 mode: V12.17 — 4-column 2-row grid, 8×8 + Custom 제거
  //   Row 1: [🌱새싹4×4] [🌿기초5×5] [🌳중급6×6] [🏔상급6×6]
  //   Row 2: [기본|고급] [        ] [🗻중급7×7] [⛰상급7×7]
  let difficultyBlock;
  if (useDifficultyV6) {
    difficultyBlock = (
      <div role="radiogroup" aria-label={t('header.difficulty')} style={{
        display: 'grid',
        gridTemplateColumns: 'repeat(4, minmax(0, 1fr))',  // V12.17: 4 columns
        gridTemplateRows: 'auto auto',
        gap: 4,
        opacity: disabled ? 0.5 : 1,
        alignItems: 'stretch',
        width: '100%',
        maxWidth: 560,
      }}>
        {/* Row 1: 새싹4×4  기초5×5  중급6×6  상급6×6 */}
        {renderDiffBtn('Sprout4', { style: { gridColumn: 1, gridRow: 1 } })}
        {renderDiffBtn('Easy5',   { style: { gridColumn: 2, gridRow: 1 } })}
        {renderDiffBtn('Medium6', { style: { gridColumn: 3, gridRow: 1 } })}
        {renderDiffBtn('Hard6',   { style: { gridColumn: 4, gridRow: 1 } })}
        {/* Row 2: EngineSelector(col 1) + (col 2 empty) + 중급7×7(col 3) + 상급7×7(col 4) */}
        {onChangeEngine && (
          <div style={{
            gridColumn: 1,
            gridRow: 2,
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'flex-start',
            minWidth: 0,
            overflow: 'visible',
          }}>
            <EngineSelector engine={engine} onChange={onChangeEngine} disabled={disabled} />
          </div>
        )}
        {renderDiffBtn('Medium7', { style: { gridColumn: 3, gridRow: 2 } })}
        {renderDiffBtn('Hard7',   { style: { gridColumn: 4, gridRow: 2 } })}
      </div>
    );
  } else {
    // Legacy mode: simple wrap (Sprout / Easy / Medium / MediumPlus / Hard / Custom)
    const legacyLevels = getDifficultyLevelsList();
    difficultyBlock = (
      <div role="radiogroup" aria-label={t('header.difficulty')} style={{
        display: 'flex', flexWrap: 'wrap', alignItems: 'stretch', gap: 4,
        opacity: disabled ? 0.5 : 1,
      }}>
        {legacyLevels.map(lv => lv === 'Custom'
          ? renderDiffBtn('__custom__', { key: lv })
          : renderDiffBtn(lv, { key: lv }))}
      </div>
    );
  }

  return (
    <div style={{
      display: 'flex', flexDirection: 'column', gap: 10,
      padding: 'clamp(14px, 3vw, 20px) clamp(12px, 4vw, 40px) 10px',
      borderBottom: '1px solid var(--border-soft)',
    }}>
      {/* Row 1: Title + utilities (DifficultyModeSelector + lang + help) on the right
          DifficultyModeSelector(Classic/V6) — 우측 상단, 항상 표시 */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap' }}>
        {/* Brand */}
        <div className="font-display" style={{
          fontSize: 'clamp(22px, 4vw, 28px)', fontWeight: 500, letterSpacing: '-0.02em',
          color: 'var(--ink-primary)', lineHeight: 1, flexShrink: 0,
        }}>
          Zoograms<span style={{ color: 'var(--accent-gold)', fontStyle: 'italic', fontWeight: 400 }}>.</span>
        </div>

        <div style={{ flex: 1, minWidth: 4 }} />

        {/* V12.28: 사용자 요청 — DifficultyModeSelector 숨김
            <DifficultyModeSelector
              useDifficultyV6={useDifficultyV6}
              onToggle={onToggleDifficultyV6}
              disabled={disabled}
            /> */}

        {/* Language switcher */}
        <LangSwitcher compact />

        {/* Help */}
        <button onClick={onHelp} aria-label={t('header.help')} style={{
          width: 32, height: 32, borderRadius: 999, border: '1px solid var(--border-medium)',
          background: 'var(--bg-card)', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center',
          color: 'var(--ink-secondary)', fontSize: 15, flexShrink: 0,
        }} className="font-display">?</button>
      </div>

      {/* V12.30: 사용자 요청 — 메인 타이틀과 난이도 버튼 그룹 사이에
          하단 광고와 동일한 인라인 가로 배너 광고 + 가로 구분선 */}
      <div style={{
        margin: '4px 0 0',
        padding: '12px 0 4px',
        display: 'flex',
        flexDirection: 'column',
        gap: 12,
      }}>
        {/* 가로 구분선 — 광고 위 */}
        <div style={{ height: 1, background: 'var(--border-soft)' }} />
        {/* 인라인 가로 배너 광고 — 하단 광고와 동일 규격 (footer-desktop + footer-mobile) */}
        <div style={{ display: 'flex', justifyContent: 'center' }}>
          <ResponsiveAdSlot slot="footer-desktop" />
          <ResponsiveAdSlot slot="footer-mobile" />
        </div>
        {/* 가로 구분선 — 광고 아래 (시각적 분리 강화) */}
        <div style={{ height: 1, background: 'var(--border-soft)' }} />
      </div>

      {/* Row 2: Difficulty grid — replaces 'header.difficulty' radiogroup,
          positioned directly below the main title. EngineSelector embedded
          in grid row 3 col 1-2 (사용자 요청: 중급 8×8과 같은 행) */}
      {difficultyBlock}
    </div>
  );
}

// =============================================================================
// SECTION 6.0 — ADSENSE FRAMEWORK
// =============================================================================
//
// Single-source-of-truth ad component. All ads in the app go through this.
// Switching publisher ID, ad units, or layout strategy = edit ONE place.
//
// Design principles:
//   1. POLICY-SAFE PLACEHOLDER MODE
//      When the publisher ID is unset (default state during development),
//      AdSlot renders a labeled "Ad area" placeholder instead of pushing
//      to adsbygoogle. This avoids loading test ads on a non-approved
//      page (which violates AdSense policy) and gives a visual preview
//      of where ads will appear once approved.
//
//   2. RESPONSIVE FORMATS
//      Each slot type maps to a Google-recommended responsive ad unit
//      with sensible min-height to prevent layout shift (CLS). The
//      ad markup uses data-ad-format="auto" + data-full-width-responsive,
//      which is Google's official recommendation for content ads.
//
//   3. VIEWPORT-SCOPED RENDERING
//      'desktop-sidebar' slots are not rendered at all on mobile, and
//      mobile-only slots (none currently) wouldn't render on desktop.
//      This avoids loading impressions that would never be viewable.
//
//   4. EVENT-BASED ADS (e.g., WinDialog)
//      Some ads only appear at specific game state transitions. Those
//      use the same AdSlot but mount/unmount with the host component,
//      so a fresh ad request fires on each event (within Google's
//      reload limits).
//
//   5. INSTRUMENTATION HOOKS
//      Each adsbygoogle.push call is wrapped in try/catch and a one-shot
//      ref to prevent double-pushing on React re-renders (a common cause
//      of "TagError: All ins elements already have ads").

// Set this to your real publisher ID (ca-pub-XXXXXXXXXXXXXXXX) to enable
// live ads. Leave as the placeholder string to render dev-mode previews.
const ADSENSE_CLIENT = 'ca-pub-XXXXXXXXXXXXXXXX';

// Per-slot configuration. Update the data-ad-slot values with your real
// ad unit IDs from AdSense > Ads > Ad units. The 'format' here is just
// for the placeholder's display label; live ads use auto + responsive.
const AD_SLOTS = {
  // Desktop: below SeedFooter — in-content responsive banner
  'footer-desktop': {
    slotId: '0000000001',           // ← replace with real ad unit ID
    format: '728×90 / responsive',
    minHeight: 90,
    maxWidth: 970,
    contexts: ['desktop'],
  },
  // Mobile: below SeedFooter — in-content responsive banner
  'footer-mobile': {
    slotId: '0000000002',           // ← replace with real ad unit ID
    format: '320×100 / responsive',
    minHeight: 100,
    maxWidth: 480,
    contexts: ['mobile'],
  },
  // Desktop: sticky sidebar to the right of the main column
  'sidebar-desktop': {
    slotId: '0000000003',           // ← replace with real ad unit ID
    format: '300×600 / responsive',
    minHeight: 250,
    maxWidth: 300,
    contexts: ['desktop'],
  },
  // Event-based: inside WinDialog modal (both mobile and desktop)
  'win-dialog': {
    slotId: '0000000004',           // ← replace with real ad unit ID
    format: 'responsive',
    minHeight: 100,
    maxWidth: 400,
    contexts: ['desktop', 'mobile'],
  },
};

// Global flag — true once the publisher ID looks plausible. We default
// false and require an explicit non-placeholder client ID before pushing
// to adsbygoogle. This keeps the page AdSense-policy-compliant during
// pre-approval review.
const AD_ENABLED = ADSENSE_CLIENT && /^ca-pub-\d{16}$/.test(ADSENSE_CLIENT);

// Reusable hook: track viewport width with a single resize listener.
// Mobile boundary is 640px to align with SolverLogModal's existing
// mobile break (consistency across modals).
function useViewportWidth() {
  const [vw, setVw] = React.useState(
    typeof window !== 'undefined' ? window.innerWidth : 1024
  );
  React.useEffect(() => {
    if (typeof window === 'undefined') return;
    const onResize = () => setVw(window.innerWidth);
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);
  return vw;
}

// V12.17: Portrait/landscape detection (used to apply 90% scale on mobile portrait + Sprout)
function useIsPortrait() {
  const [isPortrait, setIsPortrait] = React.useState(
    typeof window !== 'undefined' ? window.innerHeight >= window.innerWidth : true
  );
  React.useEffect(() => {
    if (typeof window === 'undefined') return;
    const onResize = () => setIsPortrait(window.innerHeight >= window.innerWidth);
    window.addEventListener('resize', onResize);
    window.addEventListener('orientationchange', onResize);
    return () => {
      window.removeEventListener('resize', onResize);
      window.removeEventListener('orientationchange', onResize);
    };
  }, []);
  return isPortrait;
}

// Core ad slot. Renders either a real AdSense unit (when AD_ENABLED) or
// a labeled placeholder (during dev). Both paths reserve the same min-
// height to prevent CLS jumps when ads start loading after approval.
function AdSlot({ slot, style }) {
  const t = useT();
  const cfg = AD_SLOTS[slot];
  const insRef = React.useRef(null);
  const pushedRef = React.useRef(false);

  // Push to adsbygoogle exactly once per mount. Re-mounts (e.g., when
  // WinDialog opens again) get a fresh ins element + fresh push.
  React.useEffect(() => {
    if (!AD_ENABLED || !cfg) return;
    if (pushedRef.current) return;
    if (!insRef.current) return;
    try {
      (window.adsbygoogle = window.adsbygoogle || []).push({});
      pushedRef.current = true;
    } catch (e) {
      // Common: TagError when adsbygoogle script not yet ready, or
      // duplicate push. Either is non-fatal — placeholder will remain.
      console.warn('[AdSense] push failed for slot', slot, e.message || e);
    }
  }, [slot, cfg]);

  if (!cfg) {
    console.warn('[AdSense] unknown slot:', slot);
    return null;
  }

  // Style merging: caller-provided wrapper styles + slot defaults
  const wrapperStyle = {
    display: 'flex',
    flexDirection: 'column',
    alignItems: 'center',
    width: '100%',
    maxWidth: cfg.maxWidth,
    minHeight: cfg.minHeight,
    margin: '0 auto',
    boxSizing: 'border-box',
    ...style,
  };

  // ── PLACEHOLDER MODE ────────────────────────────────────────────────
  // Shown when AD_ENABLED=false. Visually clear that this is reserved
  // ad space without resembling content (per AdSense policy).
  if (!AD_ENABLED) {
    return (
      <div style={wrapperStyle} aria-label={t('ad.placeholder')} role="complementary">
        <div style={{
          width: '100%',
          minHeight: cfg.minHeight,
          border: '1px dashed var(--border-medium)',
          borderRadius: 4,
          background: 'var(--bg-card)',
          display: 'flex',
          flexDirection: 'column',
          alignItems: 'center',
          justifyContent: 'center',
          padding: 12,
          color: 'var(--ink-tertiary)',
          fontSize: 11,
          letterSpacing: '0.08em',
          textTransform: 'uppercase',
          gap: 4,
        }} className="font-body">
          <span style={{ fontSize: 10, opacity: 0.6 }}>{t('ad.label')}</span>
          <span style={{ fontSize: 10, opacity: 0.5, textTransform: 'none', letterSpacing: 0 }}>
            {cfg.format}
          </span>
        </div>
      </div>
    );
  }

  // ── LIVE MODE ──────────────────────────────────────────────────────
  // Standard Google-recommended responsive ad markup. The ins element
  // is the actual ad container; AdSense fills it asynchronously after
  // adsbygoogle.push.
  return (
    <div style={wrapperStyle}>
      {/* Ad label per Google's policy (clear identification of ads) */}
      <div style={{
        fontSize: 9, color: 'var(--ink-tertiary)',
        letterSpacing: '0.12em', textTransform: 'uppercase',
        marginBottom: 4, opacity: 0.7,
      }} className="font-body">{t('ad.label')}</div>
      <ins ref={insRef}
        className="adsbygoogle"
        style={{ display: 'block', width: '100%', minHeight: cfg.minHeight }}
        data-ad-client={ADSENSE_CLIENT}
        data-ad-slot={cfg.slotId}
        data-ad-format="auto"
        data-full-width-responsive="true"
      />
    </div>
  );
}

// Wrapper that gates an ad slot by viewport context. Used to ensure
// 'desktop-only' slots don't render on mobile (saves an impression
// request that would never be viewable) and vice versa.
function ResponsiveAdSlot({ slot, style }) {
  const vw = useViewportWidth();
  const cfg = AD_SLOTS[slot];
  if (!cfg) return null;
  const isMobile = vw <= 640;
  const ctx = isMobile ? 'mobile' : 'desktop';
  if (!cfg.contexts.includes(ctx)) return null;
  return <AdSlot slot={slot} style={style} />;
}

// Progress strip — sits just above the grid, integrates subtitle + counters
// Desktop-only sticky sidebar ad. Renders to the right of the centered
// 960px-wide main column. Hidden when the viewport is narrow enough that
// it would overlap or push the column out of center.
//
// Sizing math:
//   - Main column max-width: 960px (centered)
//   - Sidebar ad max-width: 300px
//   - Buffer between column and ad: 32px
//   - Total min viewport: 960 + 32 + 300 + 32 (right margin) = 1324px
// Below this we hide entirely to avoid overlap with main content.

// Format milliseconds as M:SS or H:MM:SS for the timer display.
function formatTimerMs(ms) {
  if (ms == null || ms < 0) return '0:00';
  const totalSec = Math.floor(ms / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  if (h > 0) return `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
  return `${m}:${s.toString().padStart(2, '0')}`;
}

// Live-updating timer display. Recomputes elapsed every 250ms while
// running. When paused or frozen (post-win), displays the captured
// total without consuming any setInterval.
function usePlayTimerDisplay(timerStartTime, timerAccumulatedMs, timerPaused, timerFinalElapsedMs) {
  const [, setTick] = React.useState(0);
  React.useEffect(() => {
    // No interval needed when paused or finalized — display value is static.
    if (timerPaused || timerFinalElapsedMs !== null || timerStartTime == null) return;
    const id = setInterval(() => setTick(t => t + 1), 250);
    return () => clearInterval(id);
  }, [timerStartTime, timerPaused, timerFinalElapsedMs]);
  if (timerFinalElapsedMs !== null) return timerFinalElapsedMs;
  if (timerPaused) return timerAccumulatedMs;
  if (timerStartTime == null) return timerAccumulatedMs;
  return timerAccumulatedMs + (Date.now() - timerStartTime);
}

// Difficulty label + live play timer + pause button. Renders nothing if
// no level is set (defensive — App always supplies it after PUZZLE_READY).
function DifficultyTimerChip({ level, timerStartTime, timerAccumulatedMs,
                               timerPaused, timerFinalElapsedMs, onPauseTimer }) {
  const t = useT();
  const elapsedMs = usePlayTimerDisplay(timerStartTime, timerAccumulatedMs, timerPaused, timerFinalElapsedMs);
  const isFrozen = timerFinalElapsedMs !== null; // post-win
  if (!level) return null;
  // Map level key to display label (re-uses existing 'level.*' i18n keys)
  const levelLabel = t('level.' + level) || level;
  return (
    <div style={{
      display: 'inline-flex', alignItems: 'center', gap: 8,
      padding: '3px 6px 3px 10px', borderRadius: 999,
      border: '1px solid var(--border-soft)',
      background: 'var(--bg-card)',
      lineHeight: 1,                      // V12.25: 컨테이너 line-height 통일
    }}>
      {/* Difficulty label */}
      <span className="font-display" style={{
        fontSize: 12, fontWeight: 500,
        color: 'var(--ink-primary)', letterSpacing: '-0.01em',
        lineHeight: 1, display: 'inline-block',
      }}>{levelLabel}</span>
      {/* Live timer — V12.25: 사용자 요청 — 다른 텍스트와 같은 폰트 사용
          + tabular-nums로 등폭 숫자 효과 유지 (digit width 일정 → 0.0 → 99.9 흔들리지 않음)
          + lineHeight 1 + display inline-block + alignItems center로 수직 정렬 보정 */}
      <span className="font-display" style={{
        fontSize: 12, fontWeight: 500,
        fontVariantNumeric: 'tabular-nums',
        color: isFrozen ? 'var(--accent-gold)' : 'var(--ink-secondary)',

        lineHeight: 1, display: 'inline-block',
        letterSpacing: '-0.01em',
      }}>{formatTimerMs(elapsedMs)}</span>
      {/* Pause button — disabled after win (timer frozen) */}
      {!isFrozen && (
        <button
          onClick={onPauseTimer}
          disabled={timerPaused || !onPauseTimer}
          title={t('timer.pause')}
          aria-label={t('timer.pause')}
          style={{
            display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
            width: 28, height: 28, padding: 0,
            border: 'none', background: 'transparent',
            color: timerPaused ? 'var(--border-medium)' : 'var(--ink-secondary)',
            cursor: timerPaused ? 'default' : 'pointer',
            borderRadius: '50%',
            fontSize: 14, lineHeight: 1,
          }}
        >❚❚</button>
      )}
    </div>
  );
}

function ProgressChip({ icon, label, current, total, done, bad }) {
