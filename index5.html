    for (const c of cats) usedAxioms.add(c);
  }
  const axiomBreadth = usedAxioms.size; // 0..7

  // (c) Monotony penalty: longest run of same-cost steps as fraction of L
  let maxStreak = 1, currentStreak = 1;
  for (let i = 1; i < traceArr.length; i++) {
    if (traceArr[i].cost === traceArr[i - 1].cost) {
      currentStreak++;
      if (currentStreak > maxStreak) maxStreak = currentStreak;
    } else {
      currentStreak = 1;
    }
  }
  const monotony = maxStreak / Math.max(1, L);

  // Weights — tuned for backward calibration (Easy ~ 60-110, Medium ~ 90-150)
  const alpha = 0.3;     // length
  const beta  = 0.5;     // total cost
  const gamma = 4.0;     // peak (D²)
  const zeta  = 8.0;     // advancedRatio · L
  const eta   = 1.5;     // axiomBreadth²
  const theta = 2.0;     // monotony penalty (subtracted)

  return alpha * L
       + beta * C
       + gamma * D * D
       + zeta * advancedRatio * L
       + eta * axiomBreadth * axiomBreadth
       - theta * monotony * L;
}

// V5 tiers — calibrated empirically from 12-sample measurements per tier.
// Easy/Medium/MediumPlus reflect actual v4-strict generation distributions
// after Goal 1 (dead pattern removal). Hard tier kept generous because v4
// itself has wider variance there.
const TRACE_DIFFICULTY_TIERS_V5 = {
  Sprout:     { min: 8,   max: 25,   ideal: 16,   min_diversity: 0.30, min_advanced: 0.0 },
  Easy:       { min: 16,  max: 40,   ideal: 26,   min_diversity: 0.45, min_advanced: 0.0 },
  Medium:     { min: 22,  max: 55,   ideal: 35,   min_diversity: 0.55, min_advanced: 0.0 },
  MediumPlus: { min: 35,  max: 75,   ideal: 50,   min_diversity: 0.60, min_advanced: 0.05 },
  Hard:       { min: 70,  max: 200,  ideal: 130,  min_diversity: 0.65, min_advanced: 0.10 },
  Custom:     { min: 0,   max: 999,  ideal: 40,   min_diversity: 0.0,  min_advanced: 0.0 }, // permissive
};

function isInDifficultyRange_v5(diagnostics, traceArr, level) {
  const tier = TRACE_DIFFICULTY_TIERS_V5[level];
  if (!tier) return true;
  const diff = computeTraceDifficulty_v5(diagnostics, traceArr);
  return diff >= tier.min && diff <= tier.max;
}

function distanceToIdeal_v5(diagnostics, traceArr, level) {
  const tier = TRACE_DIFFICULTY_TIERS_V5[level];
  if (!tier) return 0;
  return Math.abs(computeTraceDifficulty_v5(diagnostics, traceArr) - tier.ideal);
}

function computeTraceShape(trace) {
  if (!trace || trace.length < 3) return { quality: 0.5, smoothness: 0.5, crescendo: 0.5, richness: 0.5 };
  const costs = trace.map(s => s.cost);
  const diffs = costs.slice(1).map((c, i) => Math.abs(c - costs[i]));
  const meanDiff = diffs.reduce((a, b) => a + b, 0) / diffs.length;
  const smoothness = 1 / (1 + meanDiff);
  // Linear regression slope
  const n = costs.length;
  const sumX = (n * (n - 1)) / 2;
  const sumY = costs.reduce((a, b) => a + b, 0);
  const sumXY = costs.reduce((s, y, x) => s + x * y, 0);
  const sumX2 = costs.reduce((s, _, x) => s + x * x, 0);
  const slope = (n * sumXY - sumX * sumY) / Math.max(1, n * sumX2 - sumX * sumX);
  const crescendo = 1 / (1 + Math.exp(-slope * 2));
  // Variance richness
  const meanC = sumY / n;
  const variance = costs.reduce((s, c) => s + (c - meanC) ** 2, 0) / n;
  const stddev = Math.sqrt(variance);
  const richness = 1 / (1 + Math.exp(-(stddev - 1)));
  return {
    quality: 0.4 * smoothness + 0.3 * crescendo + 0.3 * richness,
    smoothness, crescendo, richness,
  };
}

function isInDifficultyRange(diagnostics, level) {
  const tier = TRACE_DIFFICULTY_TIERS[level];
  if (!tier) return true;
  const diff = computeTraceDifficulty(diagnostics);
  return diff >= tier.min && diff <= tier.max;
}

function distanceToIdeal(diagnostics, level) {
  const tier = TRACE_DIFFICULTY_TIERS[level];
  if (!tier) return 0;
  return Math.abs(computeTraceDifficulty(diagnostics) - tier.ideal);
}

// Step 4 — Shannon-entropy normalized pattern diversity ∈ [0, 1].
// Returns 0 for empty/single-pattern trace, 1 for uniform pattern distribution.
function cdg_computePatternDiversity(diagnostics) {
  if (!diagnostics || !diagnostics.length || diagnostics.length === 0) return 0;
  const counts = diagnostics.patternCounts || {};
  const types = Object.keys(counts);
  if (types.length <= 1) return 0;

  const total = diagnostics.length;
  let entropy = 0;
  for (const type of types) {
    const p = counts[type] / total;
    if (p > 0) entropy -= p * Math.log2(p);
  }
  const maxEntropy = Math.log2(types.length);
  return maxEntropy > 0 ? entropy / maxEntropy : 0;
}

// =============================================================================
// SECTION 3.7 — CONSTRAINT-DRIVEN GENERATOR (CDG)
// =============================================================================
// Builds puzzles by starting from a fixed canonical solution and incrementally
// adding constraints (rules / hints / fixed cells) selected by information
// gain, evaluated by the trace solver, until the solution becomes unique.
// =============================================================================

// ─────────────────────────────────────────────────────────────────────────────
// Constraint priority — used by CDG scoring
// ─────────────────────────────────────────────────────────────────────────────
const CDG_CONSTRAINT_PRIORITY = {
  lineRule: 2.0,    // strongly preferred — global pattern
  totalHint: 1.2,   // good — line-level info
  genderHint: 1.0,
  forbiddenCell: 0.8,
  fixedCell: 0.4,   // de-prioritized — least elegant (just reveals answer)
};

// ─────────────────────────────────────────────────────────────────────────────
// Canonicalize a solution sample for dedup
// ─────────────────────────────────────────────────────────────────────────────
function cdg_canonicalize(sample) {
  // Sort by cell-tuple representation: (row, col, animalId, gender)
  const cells = [];
  for (const t of sample.tokens) {
    const g = sample.solution[t.id];
    cells.push(`${t.row},${t.col},${t.animalId},${g}`);
  }
  cells.sort();
  return cells.join('|');
}

// ─────────────────────────────────────────────────────────────────────────────
// Solution sampler — reuses constrainedAdjacentPlacement from classic engine
// ─────────────────────────────────────────────────────────────────────────────
function cdg_sampleSolutions(config, ruleTemplate, forbiddenCells, sampleSize, timeLimitMs, canonical) {
  // If canonical is provided, sample alternative solutions in the SAME solution space
  // as enumerateSolutions defines (same pair species multi-set, different placements).
  // This is the correct model: enumerate keeps animal multiset fixed, varies placement.
  if (canonical) {
    // Build a "puzzle" with only the rule/forbidden constraints, using canonical's
    // tokens (animal multiset) and pairs. Enumerate up to sampleSize solutions.
    const lineRules = ruleTemplate.map((r, i) => ({
      id: `rt${i}`, isRow: r.isRow, idx: r.idx, dim: r.dim, val: r.val,
    }));
    const pseudoPuzzle = {
      n: config.n,
      tokens: canonical.tokens,
      pairs: canonical.pairs,
      lineRules,
      countHints: [],
      fixedCells: [],
      forbiddenCells: forbiddenCells.map(([r, c]) => [r, c]),
      preMarks: {},
    };
    const result = enumerateSolutions(pseudoPuzzle, ANIMALS, sampleSize, timeLimitMs);
    // Convert each enumerate solution back to our sample format
    const samples = [];
    for (const sol of result.solutions) {
      const tokens = canonical.tokens.map(t => ({ ...t }));
      const newSolution = {};
      for (const pairIdxStr in sol) {
        const pairIdx = parseInt(pairIdxStr);
        const cand = sol[pairIdx];
        const [t1Id, t2Id] = canonical.pairs[pairIdx];
        const t1 = tokens.find(t => t.id === t1Id);
        const t2 = tokens.find(t => t.id === t2Id);
        if (!t1 || !t2) continue;
        t1.row = cand.c1row; t1.col = cand.c1col;
        t2.row = cand.c2row; t2.col = cand.c2col;
        newSolution[t1.id] = cand.g1;
        newSolution[t2.id] = cand.g2;
      }
      samples.push({ tokens, pairs: canonical.pairs, solution: newSolution });
    }
    return samples;
  }

  // Legacy path: bootstrap sampling without canonical (used for the very first
  // canonical-generation step inside CDG)
  const samples = [];
  const seen = new Set();
  const startTime = performance.now();
  let tries = 0;
  const maxTries = sampleSize * 30;
  while (samples.length < sampleSize && tries < maxTries) {
    if (performance.now() - startTime > timeLimitMs) break;
    tries++;
    const placement = constrainedAdjacentPlacement(config, ruleTemplate, forbiddenCells, ANIMALS);
    if (!placement) continue;
    const solution = assignGendersWithRules(placement.pairs, placement.tokens, ruleTemplate);
    if (!solution) continue;
    const sample = { tokens: placement.tokens, pairs: placement.pairs, solution };
    const key = cdg_canonicalize(sample);
    if (seen.has(key)) continue;
    seen.add(key);
    samples.push(sample);
  }
  return samples;
}

// ─────────────────────────────────────────────────────────────────────────────
// Constraint enumeration — generate candidate constraints satisfying canonical
// ─────────────────────────────────────────────────────────────────────────────
function cdg_enumerateConstraints(canonical, currentConstraints, config) {
  const candidates = [];
  const n = config.n;
  const tokens = canonical.tokens;
  const solution = canonical.solution;
  const existingKeys = new Set(currentConstraints.map(cdg_constraintKey));

  // Helper — token matches predicate (animal attr or gender)
  function tokenMatch(t, dim, val) {
    if (dim === 'gender') return solution[t.id] === val;
    return animalById(t.animalId)[dim] === val;
  }

  // LineRule candidates
  for (let idx = 0; idx < n; idx++) {
    for (const isRow of [true, false]) {
      const lineTokens = isRow ? getTokensInRow(idx, tokens) : getTokensInCol(idx, tokens);
      if (lineTokens.length === 0) continue;
      // habitat rule
      const habitats = new Set(lineTokens.map(t => animalById(t.animalId).habitat));
      if (habitats.size === 1 && config.ruleDimensions.includes('habitat')) {
        const c = { type: 'lineRule', isRow, idx, dim: 'habitat', val: [...habitats][0] };
        if (!existingKeys.has(cdg_constraintKey(c))) candidates.push(c);
      }
      const diets = new Set(lineTokens.map(t => animalById(t.animalId).diet));
      if (diets.size === 1 && config.ruleDimensions.includes('diet')) {
        const c = { type: 'lineRule', isRow, idx, dim: 'diet', val: [...diets][0] };
        if (!existingKeys.has(cdg_constraintKey(c))) candidates.push(c);
      }
      const genders = new Set(lineTokens.map(t => solution[t.id]));
      if (genders.size === 1 && config.ruleDimensions.includes('gender')) {
        const c = { type: 'lineRule', isRow, idx, dim: 'gender', val: [...genders][0] };
        if (!existingKeys.has(cdg_constraintKey(c))) candidates.push(c);
      }
    }
  }

  // Total Hint candidates
  for (let idx = 0; idx < n; idx++) {
    for (const isRow of [true, false]) {
      const lineTokens = isRow ? getTokensInRow(idx, tokens) : getTokensInCol(idx, tokens);
      const c = { type: 'totalHint', isRow, idx, value: lineTokens.length };
      if (!existingKeys.has(cdg_constraintKey(c))) candidates.push(c);
    }
  }

  // Gender Hint candidates (H1=male, H2=female)
  for (let idx = 0; idx < n; idx++) {
    for (const isRow of [true, false]) {
      const lineTokens = isRow ? getTokensInRow(idx, tokens) : getTokensInCol(idx, tokens);
      if (lineTokens.length === 0) continue;
      const males = lineTokens.filter(t => solution[t.id] === 'male').length;
      const females = lineTokens.length - males;
      const c1 = { type: 'genderHint', subtype: 'H1', isRow, idx, value: males };
      if (!existingKeys.has(cdg_constraintKey(c1))) candidates.push(c1);
      const c2 = { type: 'genderHint', subtype: 'H2', isRow, idx, value: females };
      if (!existingKeys.has(cdg_constraintKey(c2))) candidates.push(c2);
    }
  }

  // Fixed Cell candidates (one per token)
  for (const t of tokens) {
    const c = { type: 'fixedCell', row: t.row, col: t.col, animalId: t.animalId, gender: solution[t.id] };
    if (!existingKeys.has(cdg_constraintKey(c))) candidates.push(c);
  }

  return candidates;
}

function cdg_constraintKey(c) {
  if (c.type === 'lineRule') return `lr:${c.isRow ? 'r' : 'c'}${c.idx}-${c.dim}-${c.val}`;
  if (c.type === 'totalHint') return `th:${c.isRow ? 'r' : 'c'}${c.idx}`;
  if (c.type === 'genderHint') return `gh:${c.isRow ? 'r' : 'c'}${c.idx}-${c.subtype}`;
  if (c.type === 'fixedCell') return `fx:${c.row},${c.col}`;
  if (c.type === 'forbiddenCell') return `fb:${c.row},${c.col}`;
  return JSON.stringify(c);
}

// ─────────────────────────────────────────────────────────────────────────────
// Check if a sample solution satisfies a constraint
// ─────────────────────────────────────────────────────────────────────────────
function cdg_satisfies(sample, constraint) {
  const tokens = sample.tokens;
  const solution = sample.solution;
  if (constraint.type === 'lineRule') {
    const lineTokens = constraint.isRow
      ? getTokensInRow(constraint.idx, tokens)
      : getTokensInCol(constraint.idx, tokens);
    return lineTokens.every(t => {
      if (constraint.dim === 'gender') return solution[t.id] === constraint.val;
      return animalById(t.animalId)[constraint.dim] === constraint.val;
    });
  }
  if (constraint.type === 'totalHint') {
    const lineTokens = constraint.isRow
      ? getTokensInRow(constraint.idx, tokens)
      : getTokensInCol(constraint.idx, tokens);
    return lineTokens.length === constraint.value;
  }
  if (constraint.type === 'genderHint') {
    const lineTokens = constraint.isRow
      ? getTokensInRow(constraint.idx, tokens)
      : getTokensInCol(constraint.idx, tokens);
    const target = constraint.subtype === 'H1' ? 'male' : 'female';
    const count = lineTokens.filter(t => solution[t.id] === target).length;
    return count === constraint.value;
  }
  if (constraint.type === 'fixedCell') {
    const t = tokens.find(t => t.row === constraint.row && t.col === constraint.col);
    if (!t) return false;
    return t.animalId === constraint.animalId && solution[t.id] === constraint.gender;
  }
  if (constraint.type === 'forbiddenCell') {
    return !tokens.some(t => t.row === constraint.row && t.col === constraint.col);
  }
  return true;
}

// ─────────────────────────────────────────────────────────────────────────────
// Information gain
// ─────────────────────────────────────────────────────────────────────────────
function cdg_informationGain(constraint, sample) {
  if (sample.length === 0) return 0;
  let kept = 0;
  for (const s of sample) if (cdg_satisfies(s, constraint)) kept++;
  if (kept === 0 || kept === sample.length) return 0;
  return Math.log2(sample.length / kept);
}

// ─────────────────────────────────────────────────────────────────────────────
// Assemble a partial puzzle from canonical + current constraints
// ─────────────────────────────────────────────────────────────────────────────
function cdg_assemblePuzzle(canonical, constraints, levelKey) {
  const config = DIFFICULTY_CONFIGS[levelKey];
  const n = config ? config.n : (canonical.tokens.length > 0 ? Math.max(...canonical.tokens.map(t => Math.max(t.row, t.col))) + 1 : 4);
  const lineRules = constraints.filter(c => c.type === 'lineRule').map((c, i) => ({
    id: `r${i}`, isRow: c.isRow, idx: c.idx, dim: c.dim, val: c.val,
  }));
  const countHints = [];
  let cnt = 0;
  for (const c of constraints) {
    if (c.type === 'totalHint') {
      countHints.push({
        id: `h${cnt++}`, type: 'total',
        row: c.isRow ? c.idx : null, col: c.isRow ? null : c.idx,
        value: c.value,
      });
    } else if (c.type === 'genderHint') {
      countHints.push({
        id: `h${cnt++}`, type: c.subtype,
        row: c.isRow ? c.idx : null, col: c.isRow ? null : c.idx,
        value: c.value,
      });
    }
  }
  const fixedCells = [];
  const preMarks = {};
  for (const c of constraints) {
    if (c.type === 'fixedCell') {
      fixedCells.push({ row: c.row, col: c.col, animalId: c.animalId, gender: c.gender });
      const t = canonical.tokens.find(t => t.row === c.row && t.col === c.col);
      if (t) preMarks[t.id] = c.gender;
    }
  }
  const forbiddenCells = constraints
    .filter(c => c.type === 'forbiddenCell')
    .map(c => [c.row, c.col]);
  return {
    n,
    tokens: canonical.tokens,
    pairs: canonical.pairs,
    lineRules, countHints, fixedCells, forbiddenCells, preMarks,
    solution: canonical.solution,
    level: levelKey,
  };
}

// ─────────────────────────────────────────────────────────────────────────────
// Score candidate (info gain × priority − distance to ideal trace difficulty)
// ─────────────────────────────────────────────────────────────────────────────
function cdg_scoreCandidate(candidate, sample, partialPuzzle, level) {
  const gain = cdg_informationGain(candidate, sample);
  if (gain === 0) return -Infinity;
  const priority = CDG_CONSTRAINT_PRIORITY[candidate.type] || 1.0;
  let score = gain * priority;
  // Trace-aware refinement (best-effort, may timeout)
  try {
    const tentative = cdg_assemblePuzzle(partialPuzzle.canonical, [...partialPuzzle.constraints, candidate], level);
    const traceResult = traceSolve(tentative, { timeLimitMs: 200, maxLookaheadDepth: 1 });
    if (traceResult.status === 'solved') {
      const diff = computeTraceDifficulty(traceResult.diagnostics);
      const tier = TRACE_DIFFICULTY_TIERS[level];
      if (tier) {
        const dist = Math.abs(diff - tier.ideal);
        score -= 0.03 * dist;
      }
    } else if (traceResult.status === 'requires-search') {
      score -= 30; // discourage humanly-unsolvable puzzles
    }
  } catch (e) { /* best-effort */ }
  return score;
}

// ─────────────────────────────────────────────────────────────────────────────
// Minimality verification — prune redundant constraints
// ─────────────────────────────────────────────────────────────────────────────
function cdg_pruneRedundant(canonical, constraints, levelKey, verifyTimeMs) {
  // Order pruning attempts by least-elegance-first: fixedCell first, then
  // forbiddenCell, then totalHint/genderHint, finally lineRule.
  // This way redundant fixedCells (which are visually most cluttering and
  // least deductively interesting) are removed in favor of LineRules and
  // Hints (which give the puzzle its character).
  const TYPE_ORDER = { fixedCell: 0, forbiddenCell: 1, genderHint: 2, totalHint: 3, lineRule: 4 };
  const pruned = [...constraints];
  // Build index pairs sorted by type priority (lowest first = least elegant)
  const indexed = pruned.map((c, i) => ({ c, originalIdx: i }));
  indexed.sort((a, b) => (TYPE_ORDER[a.c.type] ?? 9) - (TYPE_ORDER[b.c.type] ?? 9));

  // Iterate in priority-sorted order, but track removal in the live array
  for (const item of indexed) {
    // Find current index of this constraint (may have shifted)
    const curIdx = pruned.indexOf(item.c);
    if (curIdx === -1) continue;
    const without = pruned.filter((_, j) => j !== curIdx);
    const reducedPuzzle = cdg_assemblePuzzle(canonical, without, levelKey);
    const verifyResult = enumerateSolutions(reducedPuzzle, ANIMALS, 2, verifyTimeMs);
    if (verifyResult.solutions.length === 1 && !verifyResult.timedOut) {
      pruned.splice(curIdx, 1);
    }
  }
  return pruned;
}

// ─────────────────────────────────────────────────────────────────────────────
// CDG main loop
// ─────────────────────────────────────────────────────────────────────────────
async function generatePuzzleCDG(level, onProgress) {
  const config = DIFFICULTY_CONFIGS[level];
  if (!config) return null;
  const startTime = performance.now();
  const TOTAL_BUDGET = config.totalBudgetMs || 20000;
  const sampleSizeBase = config.cdgSampleSize || 100;
  const constraintBudget = config.cdgConstraintBudget || (config.n * config.n);

  for (let outerAttempt = 0; outerAttempt < 5; outerAttempt++) {
    if (performance.now() - startTime > TOTAL_BUDGET) break;

    onProgress && onProgress({
      phase: 'cdg-init',
      level,
      outerAttempt,
      elapsed: performance.now() - startTime,
      budget: TOTAL_BUDGET,
    });
    await new Promise(r => setTimeout(r, 0));

    // Generate canonical solution (use existing pipeline as bootstrapping)
    const ruleTemplateBootstrap = []; // start with no rules
    const placement = constrainedAdjacentPlacement(config, ruleTemplateBootstrap, [], ANIMALS);
    if (!placement) continue;
    const solution = assignGendersWithRules(placement.pairs, placement.tokens, []);
    if (!solution) continue;
    const canonical = { tokens: placement.tokens, pairs: placement.pairs, solution };

    // Sample alternative solutions (in same animal-multiset space as canonical,
    // matching enumerateSolutions semantics). Use larger sample for initial step
    // to better cover the universe of solutions.
    const sampleBudget = Math.max(1500, TOTAL_BUDGET * 0.25);
    const initialSampleSize = Math.max(sampleSizeBase * 3, 200);
    let sample = cdg_sampleSolutions(config, [], [], initialSampleSize, sampleBudget, canonical);
    if (sample.length < 2) continue;

    // Make sure canonical is present
    const canonKey = cdg_canonicalize(canonical);
    const alreadyHas = sample.some(s => cdg_canonicalize(s) === canonKey);
    if (!alreadyHas) sample.unshift(canonical);

    // ─────────────────────────────────────────────────────────────────────
    // HINT-FIRST CDG (v3.5): 4-phase elegant algorithm.
    //
    //  Phase 0: LineRule injection (1.5x previous budget for elegance)
    //  Phase 1: TotalHint Saturation — every line that has tokens gets a
    //           Total hint up to a configurable density limit
    //  Phase 2: GenderHint Selective — pick lines whose gender count
    //           uniquely identifies male/female placement
    //  Phase 3: Iterative refinement — verify uniqueness; if not yet unique,
    //           add MORE hints first; only if hint capacity exhausted, fall
    //           back to fixedCells as last resort
    //
    // Mathematical justification: hint capacity (Total + Gender per line)
    // exceeds H₀ universe entropy at all difficulty levels, so unique
    // puzzles can be made with very few or zero fixedCells.
    // ─────────────────────────────────────────────────────────────────────
    const constraints = [];
    let stuck = false;
    let verifiedUnique = false;

    // ============== PHASE 0: LineRule injection ============================
    // LineRules give the puzzle its character (global patterns). We inject
    // them upfront. Final minimality phase will keep only those that are
    // actually deductively necessary or aesthetically reinforcing.
    const linRuleBudget = config.ruleCount ? config.ruleCount[1] : 4;
    const allLineRules = cdg_enumerateConstraints(canonical, [], config)
      .filter(c => c.type === 'lineRule');
    const shuffledLR = [...allLineRules];
    for (let i = shuffledLR.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffledLR[i], shuffledLR[j]] = [shuffledLR[j], shuffledLR[i]];
    }
    const usedLines = new Set();
    for (const lr of shuffledLR) {
      if (constraints.length >= linRuleBudget) break;
      const lineKey = `${lr.isRow ? 'r' : 'c'}${lr.idx}`;
      if (usedLines.has(lineKey)) continue;
      usedLines.add(lineKey);
      constraints.push(lr);
      sample = sample.filter(s => cdg_satisfies(s, lr));
    }

    // ============== PHASE 1: TotalHint saturation ==========================
    // Add Total hints to every non-empty line. Mathematical effect: a 4x4
    // board with all 8 lines hinted carries ~10-15 bits of correlated
    // information, often enough alone for unique solutions on small boards.
    const totalHintBudget = config.cdgTotalHintBudget ?? (config.n * 2); // up to all lines
    const allTotalHints = cdg_enumerateConstraints(canonical, constraints, config)
      .filter(c => c.type === 'totalHint');
    // Order: lines with rules first (synergy), then highest-info lines
    const lineHasRule = (h) => usedLines.has(`${h.isRow ? 'r' : 'c'}${h.idx}`);
    const orderedTotals = [
      ...allTotalHints.filter(lineHasRule),
      ...allTotalHints.filter(h => !lineHasRule(h)),
    ];
    let totalHintsAdded = 0;
    for (const h of orderedTotals) {
      if (totalHintsAdded >= totalHintBudget) break;
      // Skip empty-line hints (value=0) — these add no deduction value
      if (h.value === 0) continue;
      constraints.push(h);
      sample = sample.filter(s => cdg_satisfies(s, h));
      totalHintsAdded++;
    }

    // ============== PHASE 2: GenderHint selective ==========================
    // GenderHint H1 (male count) is added selectively based on real
    // information gain. Each line can take at most 1 GenderHint (H1 alone
    // determines H2 since H2 = Total - H1).
    const genderHintBudget = config.cdgGenderHintBudget ?? Math.ceil(config.n * 1.0);
    const allGenderHints = cdg_enumerateConstraints(canonical, constraints, config)
      .filter(c => c.type === 'genderHint' && c.subtype === 'H1');
    // Score each by sample-based information gain
    const scoredGH = allGenderHints
      .map(h => ({ h, gain: cdg_informationGain(h, sample) }))
      .filter(x => x.gain > 0)
      .sort((a, b) => b.gain - a.gain);
    let genderHintsAdded = 0;
    const usedGenderLines = new Set();
    for (const { h } of scoredGH) {
      if (genderHintsAdded >= genderHintBudget) break;
      const lineKey = `${h.isRow ? 'r' : 'c'}${h.idx}`;
      if (usedGenderLines.has(lineKey)) continue;
      usedGenderLines.add(lineKey);
      constraints.push(h);
      sample = sample.filter(s => cdg_satisfies(s, h));
      genderHintsAdded++;
    }

    // ============== PHASE 3: Iterative tightening ==========================
    // Verify uniqueness; if not yet unique, add MORE hints first (less-used
    // gender hints, or canonical-satisfying additional rules), and only as
    // a last resort fall back to fixedCells.
    const overallTimeLimit = TOTAL_BUDGET * 0.85;
    while (constraints.length < constraintBudget && !stuck) {
      if (performance.now() - startTime > overallTimeLimit) {
        stuck = true; break;
      }
      onProgress && onProgress({
        phase: 'cdg-tightening',
        constraintCount: constraints.length,
        sampleSize: sample.length,
        elapsed: performance.now() - startTime,
        budget: TOTAL_BUDGET,
      });
      await new Promise(r => setTimeout(r, 0));

      // Ground-truth uniqueness check
      const partialP = cdg_assemblePuzzle(canonical, constraints, level);
      const verify = enumerateSolutions(partialP, ANIMALS, 2, 1500);
      if (!verify.timedOut && verify.solutions.length === 1) {
        verifiedUnique = true;
        break;
      }
      if (verify.timedOut && sample.length <= 1) {
        verifiedUnique = true;
        break;
      }

      // Try: more GenderHints from remaining lines
      const remainingGH = cdg_enumerateConstraints(canonical, constraints, config)
        .filter(c => c.type === 'genderHint' && c.subtype === 'H1')
        .filter(c => !usedGenderLines.has(`${c.isRow ? 'r' : 'c'}${c.idx}`));
      if (remainingGH.length > 0) {
        const scored = remainingGH
          .map(c => ({ c, gain: cdg_informationGain(c, sample) }))
          .sort((a, b) => b.gain - a.gain);
        const best = scored[0].c;
        constraints.push(best);
        usedGenderLines.add(`${best.isRow ? 'r' : 'c'}${best.idx}`);
        sample = sample.filter(s => cdg_satisfies(s, best));
        continue;
      }

      // Try: H2 (female count) hints — usually redundant with H1 but on lines
      // without H1, H2 can carry information
      const allH2 = cdg_enumerateConstraints(canonical, constraints, config)
        .filter(c => c.type === 'genderHint' && c.subtype === 'H2');
      const fresh = allH2.filter(c => cdg_informationGain(c, sample) > 0);
      if (fresh.length > 0) {
        const best = fresh[0];
        constraints.push(best);
        sample = sample.filter(s => cdg_satisfies(s, best));
        continue;
      }

      // Try: more LineRules on as-yet unruled lines (re-enumerate in case
      // canonical newly satisfies fresh rules through gender)
      const moreLR = cdg_enumerateConstraints(canonical, constraints, config)
        .filter(c => c.type === 'lineRule')
        .filter(c => !usedLines.has(`${c.isRow ? 'r' : 'c'}${c.idx}`));
      if (moreLR.length > 0 && moreLR.some(c => cdg_informationGain(c, sample) > 0)) {
        const scoredLR = moreLR
          .map(c => ({ c, gain: cdg_informationGain(c, sample) }))
          .filter(x => x.gain > 0)
          .sort((a, b) => b.gain - a.gain);
        const best = scoredLR[0].c;
        constraints.push(best);
        usedLines.add(`${best.isRow ? 'r' : 'c'}${best.idx}`);
        sample = sample.filter(s => cdg_satisfies(s, best));
        continue;
      }

      // Last resort: fixedCell. Pick the token whose addition gives the
      // highest enumerate-measured gain.
      const fixedCandidates = canonical.tokens
        .filter(t => !constraints.some(c => c.type === 'fixedCell' && c.row === t.row && c.col === t.col));
      if (fixedCandidates.length === 0) { stuck = true; break; }
      // Pick a random token to avoid bias
      const t = fixedCandidates[Math.floor(Math.random() * fixedCandidates.length)];
      constraints.push({
        type: 'fixedCell', row: t.row, col: t.col,
        animalId: t.animalId, gender: solution[t.id],
      });
      sample = sample.filter(s => cdg_satisfies(s, constraints[constraints.length - 1]));
    }

    // ============== PHASE 4: Forced fixedCell completion =================
    // If main loop exhausted budget without uniqueness, add fixedCells one
    // at a time (no budget cap) until verify confirms unique. This is the
    // safety net that guarantees CDG always succeeds.
    if (!verifiedUnique && !stuck) {
      const maxForcedFixed = canonical.tokens.length;
      let forcedAdded = 0;
      while (!verifiedUnique && forcedAdded < maxForcedFixed) {
        if (performance.now() - startTime > overallTimeLimit) break;
        const partialP = cdg_assemblePuzzle(canonical, constraints, level);
        const verify = enumerateSolutions(partialP, ANIMALS, 2, 1500);
        if (!verify.timedOut && verify.solutions.length === 1) {
          verifiedUnique = true;
          break;
        }
        const fixedCandidates = canonical.tokens
          .filter(t => !constraints.some(c => c.type === 'fixedCell' && c.row === t.row && c.col === t.col));
        if (fixedCandidates.length === 0) break;
        const t = fixedCandidates[Math.floor(Math.random() * fixedCandidates.length)];
        constraints.push({
          type: 'fixedCell', row: t.row, col: t.col,
          animalId: t.animalId, gender: solution[t.id],
        });
        forcedAdded++;
      }
      if (!verifiedUnique) {
        // Final verify after all fixedCells
        const partialP = cdg_assemblePuzzle(canonical, constraints, level);
        const verify = enumerateSolutions(partialP, ANIMALS, 2, 1500);
        if (!verify.timedOut && verify.solutions.length === 1) verifiedUnique = true;
      }
    }


    if (stuck || !verifiedUnique) continue;

    // Verify uniqueness with full enumeration
    const finalPuzzle = cdg_assemblePuzzle(canonical, constraints, level);
    const verifyResult = enumerateSolutions(finalPuzzle, ANIMALS, 2, config.verifyTimeLimitMs || 3000);
    if (verifyResult.solutions.length !== 1 || verifyResult.timedOut) continue;

    // Prune redundancy for minimality (use shorter per-step verify time
    // to keep total minimality phase bounded; Medium's 2500ms × 17 = 42s)
    const perVerifyTime = Math.max(200, Math.min(500, (config.verifyTimeLimitMs || 500) / 5));
    const minimalConstraints = cdg_pruneRedundant(canonical, constraints, level, perVerifyTime);
    const minimalPuzzle = cdg_assemblePuzzle(canonical, minimalConstraints, level);

    // Final trace evaluation
    const finalTrace = traceSolve(minimalPuzzle, { timeLimitMs: 2000, maxLookaheadDepth: 1 });
    minimalPuzzle.uniqueness = 'strict';
    minimalPuzzle.solutionCount = 1;
    minimalPuzzle.engine = 'cdg';
    minimalPuzzle.generationTime = performance.now() - startTime;
    minimalPuzzle.attemptCount = outerAttempt + 1;
    if (finalTrace.status === 'solved') {
      minimalPuzzle.traceDifficulty = computeTraceDifficulty(finalTrace.diagnostics);
      minimalPuzzle.traceShape = computeTraceShape(finalTrace.trace);
      minimalPuzzle.traceLength = finalTrace.trace.length;
    }
    return minimalPuzzle;
  }
  return null;
}

// =============================================================================
// SECTION 3.7v4 — SPEC-ALIGNED CDG (v4)
// =============================================================================
// 5-Step upgrade providing 5 simultaneous formal guarantees:
//   1. Soundness          — exactly one solution
//   2. Axiom Preservation — countCoverage 100%, all lines have Total + H1
//   3. Difficulty Bound   — traceDifficulty ∈ [tier.min, tier.max]
//   4. Minimality         — every constraint is essential
//   5. Pattern Diversity  — Shannon entropy ≥ tier.min_diversity
//
// Implementation strategy: reuse classic Stage A-C for axiom layer (Step 1),
// then trace-target adjust (Step 2), type-priority prune (Step 3), pattern
// diversity check (Step 4), all powered by traceSolve_v2 (Step 5).
// =============================================================================

// ──── Step 1: Axiom Instance Builder ────────────────────────────────────────
// Reuses classic Stage A-C unchanged. Tries up to MAX_BUILD_ATTEMPTS times
// internally (matching classic's per-attempt retry pattern) since each
// individual call has 30-70% success rate due to coverage constraints.
function cdg_buildAxiomInstance(level, config) {
  const MAX_BUILD_ATTEMPTS = 50;
  for (let attempt = 0; attempt < MAX_BUILD_ATTEMPTS; attempt++) {
    const inst = cdg_buildAxiomInstanceOnce(level, config);
    if (inst) return inst;
  }
  return null;
}

function cdg_buildAxiomInstanceOnce(level, config) {
  // Stage A: rule template
  const ruleTemplate = designRuleTemplate(config, ANIMALS);
  if (!ruleTemplate) return null;

  // Forbidden cells
  const forbiddenCount = Array.isArray(config.forbiddenCount)
    ? randInt(config.forbiddenCount[0], config.forbiddenCount[1])
    : (config.forbiddenCount || 0);
  const allCells = [];
  for (let r = 0; r < config.n; r++) {
    for (let c = 0; c < config.n; c++) allCells.push([r, c]);
  }
  const forbiddenCells = shuffle(allCells).slice(0, forbiddenCount);

  // Stage B: placement
  const placement = constrainedAdjacentPlacement(config, ruleTemplate, forbiddenCells, ANIMALS);
  if (!placement) return null;

  // Coverage validation: every rule line has at least one token
  for (const rule of ruleTemplate) {
    const lineTokens = rule.isRow
      ? placement.tokens.filter(t => t.row === rule.idx)
      : placement.tokens.filter(t => t.col === rule.idx);
    if (lineTokens.length === 0) return null;
  }

  // Gender assignment with rule-aware logic
  const solution = assignGendersWithRules(placement.pairs, placement.tokens, ruleTemplate);
  if (!solution) return null;

  // Stage C: AXIOM-PRESERVING auxiliary hints
  const instance = addAuxiliaryHints(placement, config, solution, ruleTemplate, forbiddenCells);

  // Coverage validation: every rule line has at least one non-fixed token
  const fixedTokenIds = new Set(Object.keys(instance.preMarks || {}));
  for (const rule of ruleTemplate) {
    const lineTokens = rule.isRow
      ? placement.tokens.filter(t => t.row === rule.idx)
      : placement.tokens.filter(t => t.col === rule.idx);
    const nonFixed = lineTokens.filter(t => !fixedTokenIds.has(t.id));
    if (nonFixed.length === 0) return null;
  }

  return Object.assign({}, instance, { solution, ruleTemplate });
}

// Convert axiom instance (classic puzzle format) to CDG's internal constraint list.
function cdg_axiomToConstraints(instance) {
  const constraints = [];

  for (const r of instance.lineRules) {
    constraints.push({
      type: 'lineRule', isRow: r.isRow, idx: r.idx, dim: r.dim, val: r.val,
    });
  }

  for (const h of instance.countHints) {
    if (h.type === 'total') {
      constraints.push({
        type: 'totalHint',
        isRow: h.row !== null && h.row !== undefined,
        idx: (h.row !== null && h.row !== undefined) ? h.row : h.col,
        value: h.value,
      });
    } else if (h.type === 'H1' || h.type === 'H2') {
      constraints.push({
        type: 'genderHint', subtype: h.type,
        isRow: h.row !== null && h.row !== undefined,
        idx: (h.row !== null && h.row !== undefined) ? h.row : h.col,
        value: h.value,
      });
    }
  }

  for (const fc of (instance.fixedCells || [])) {
    constraints.push({
      type: 'fixedCell', row: fc.row, col: fc.col,
      animalId: fc.animalId, gender: fc.gender,
    });
  }

  for (const fc of (instance.forbiddenCells || [])) {
    const [row, col] = fc;
    constraints.push({ type: 'forbiddenCell', row, col });
  }

  return constraints;
}

// ──── Step 2: Trace-Targeted FixedCell Adjustment ───────────────────────────
// Adjusts the fixedCell layer so that traceSolve_v2 yields difficulty within
// the tier's [min, max] range. 4-case decision tree:
//   in-range  → done
//   too easy  → remove fixedCell
//   too hard  → add fixedCell to ease
//   stuck     → add fixedCell to break unsolvability
function cdg_adjustFixedCellsForDifficulty(constraints, canonical, level, options) {
  const tier = TRACE_DIFFICULTY_TIERS[level];
  const opts = Object.assign({
    maxIterations: 18,
    perStepTimeMs: 200,
    totalTimeBudget: 6000,
    candidateSampleSize: 8,
  }, options || {});
  const startTime = performance.now();
  let current = [...constraints];

  let puzzle = cdg_assemblePuzzle(canonical, current, level);
  let trace = traceSolve_v2(puzzle, {
    timeLimitMs: opts.perStepTimeMs * 4,
    maxLookaheadDepth: 1,
  });

  for (let iter = 0; iter < opts.maxIterations; iter++) {
    if (performance.now() - startTime > opts.totalTimeBudget) {
      return { constraints: current, trace, action: 'iteration-exhausted', iterations: iter };
    }

    if (trace.status === 'solved') {
      const diff = computeTraceDifficulty(trace.diagnostics);

      if (diff >= tier.min && diff <= tier.max) {
        return { constraints: current, trace, action: 'in-range', iterations: iter };
      }

      if (diff < tier.min) {
        const removed = pickFixedCellToRemove(current, canonical, level, tier, opts);
        if (!removed) {
          return { constraints: current, trace, action: 'too-easy-stuck', iterations: iter };
        }
        current = current.filter(c => c !== removed);
      } else { // diff > tier.max
        const added = pickFixedCellToAdd(current, canonical, level, tier, opts);
        if (!added) {
          return { constraints: current, trace, action: 'too-hard-stuck', iterations: iter };
        }
        current = [...current, added];
      }
    } else if (trace.status === 'requires-search' || trace.status === 'too-many-steps') {
      const added = pickFixedCellToBreakStuck(current, canonical, level, opts);
      if (!added) {
        return { constraints: current, trace, action: 'unsolvable', iterations: iter };
      }
      current = [...current, added];
    } else {
      return { constraints: current, trace, action: 'failed', iterations: iter };
    }

    puzzle = cdg_assemblePuzzle(canonical, current, level);
    trace = traceSolve_v2(puzzle, {
      timeLimitMs: opts.perStepTimeMs * 4,
      maxLookaheadDepth: 1,
    });
  }

  return { constraints: current, trace, action: 'iteration-exhausted', iterations: opts.maxIterations };
}

// REMOVE: keep uniqueness AND difficulty ≤ tier.max, score by ideal proximity
function pickFixedCellToRemove(constraints, canonical, level, tier, opts) {
  const fixedCells = constraints.filter(c => c.type === 'fixedCell');
  if (fixedCells.length === 0) return null;

  let best = null, bestScore = -Infinity;
  for (const fc of fixedCells) {
    const reduced = constraints.filter(c => c !== fc);
    const puzzle = cdg_assemblePuzzle(canonical, reduced, level);

    const verify = enumerateSolutions(puzzle, ANIMALS, 2, opts.perStepTimeMs);
    if (verify.solutions.length !== 1 || verify.timedOut) continue;

    const trace = traceSolve_v2(puzzle, { timeLimitMs: opts.perStepTimeMs * 2, maxLookaheadDepth: 1 });
    if (trace.status !== 'solved') continue;

    const diff = computeTraceDifficulty(trace.diagnostics);
    if (diff > tier.max) continue;

    const score = -Math.abs(diff - tier.ideal);
    if (score > bestScore) { bestScore = score; best = fc; }
  }
  return best;
}

// ADD: keep difficulty ≥ tier.min and bring closer to ideal
function pickFixedCellToAdd(constraints, canonical, level, tier, opts) {
  const fixedSet = new Set(constraints
    .filter(c => c.type === 'fixedCell')
    .map(c => `${c.row},${c.col}`));
  const candidates = canonical.tokens.filter(t => !fixedSet.has(`${t.row},${t.col}`));
  if (candidates.length === 0) return null;

  const K = Math.min(opts.candidateSampleSize, candidates.length);
  const sampled = shuffle([...candidates]).slice(0, K);

  let best = null, bestScore = -Infinity;
  for (const t of sampled) {
    const newFixed = {
      type: 'fixedCell', row: t.row, col: t.col,
      animalId: t.animalId, gender: canonical.solution[t.id],
    };
    const augmented = [...constraints, newFixed];
    const puzzle = cdg_assemblePuzzle(canonical, augmented, level);

    const trace = traceSolve_v2(puzzle, { timeLimitMs: opts.perStepTimeMs * 2, maxLookaheadDepth: 1 });
    if (trace.status !== 'solved') continue;

    const diff = computeTraceDifficulty(trace.diagnostics);
    if (diff < tier.min) continue;

    const score = -Math.abs(diff - tier.ideal);
    if (score > bestScore) { bestScore = score; best = newFixed; }
  }
  return best;
}

// BREAK STUCK: maximize traceSolve progress (decided pair count)
function pickFixedCellToBreakStuck(constraints, canonical, level, opts) {
  const fixedSet = new Set(constraints
    .filter(c => c.type === 'fixedCell')
    .map(c => `${c.row},${c.col}`));
  const candidates = canonical.tokens.filter(t => !fixedSet.has(`${t.row},${t.col}`));
  if (candidates.length === 0) return null;

  const K = Math.min(opts.candidateSampleSize, candidates.length);
  const sampled = shuffle([...candidates]).slice(0, K);

  let best = null, bestProgress = -1;
  for (const t of sampled) {
    const newFixed = {
      type: 'fixedCell', row: t.row, col: t.col,
      animalId: t.animalId, gender: canonical.solution[t.id],
    };
    const augmented = [...constraints, newFixed];
    const puzzle = cdg_assemblePuzzle(canonical, augmented, level);

    const trace = traceSolve_v2(puzzle, { timeLimitMs: opts.perStepTimeMs, maxLookaheadDepth: 1 });
    let progress;
    if (trace.status === 'solved') {
      progress = canonical.pairs.length;
    } else if (trace.finalState && trace.finalState.activePairs) {
      progress = canonical.pairs.length - trace.finalState.activePairs.length;
    } else {
      progress = 0;
    }
    if (progress > bestProgress) {
      bestProgress = progress; best = newFixed;
    }
  }
  return best;
}

// ──── Step 3: Type-Priority Minimality with Trace Bound ─────────────────────
// Two prune-order variants:
//
// LOOSE: minimality maximally aggressive. All constraint types prunable.
//        Hints can be removed if puzzle stays unique + in difficulty range.
//        Result: leanest possible puzzle, but may break "all lines have
//        Total + H1" noogram-paradigm axiom.
//
// STRICT: hint axiom inviolable. Only fixedCell, forbiddenCell, lineRule
//         are prunable. Total/Gender hints always preserved across all
//         lines that addAuxiliaryHints populated. This guarantees the
//         classic-aligned axiom structure visible to the player.
//
// LineRule survives last in both orders (most aesthetic value).
const CDG_PRUNE_ORDER_LOOSE  = ['fixedCell', 'forbiddenCell', 'genderHint', 'totalHint', 'lineRule'];
const CDG_PRUNE_ORDER_STRICT = ['fixedCell', 'forbiddenCell', 'lineRule'];
// Legacy alias — defaults to STRICT (axiom-preserving) behavior
const CDG_PRUNE_ORDER = CDG_PRUNE_ORDER_STRICT;

function cdg_pruneRedundantWithTrace(canonical, constraints, levelKey, options) {
  const opts = Object.assign({
    perVerifyTimeMs: 400,
    perTraceTimeMs: 300,
    enforceDiffBound: true,
    totalTimeBudget: 6000,
    pruneOrder: CDG_PRUNE_ORDER_STRICT, // default: axiom-preserving
  }, options || {});
  const tier = TRACE_DIFFICULTY_TIERS[levelKey];
  const startTime = performance.now();
  let result = [...constraints];

  for (const type of opts.pruneOrder) {
    if (performance.now() - startTime > opts.totalTimeBudget) break;
    const ofType = result.filter(c => c.type === type);
    const shuffled = shuffle([...ofType]);

    for (const c of shuffled) {
      if (performance.now() - startTime > opts.totalTimeBudget) break;
      const reduced = result.filter(x => x !== c);
      const puzzle = cdg_assemblePuzzle(canonical, reduced, levelKey);

      // Test 1: uniqueness preserved
      const verify = enumerateSolutions(puzzle, ANIMALS, 2, opts.perVerifyTimeMs);
      if (verify.solutions.length !== 1 || verify.timedOut) continue;

      // Test 2: difficulty bound preserved (if tier defined and enforced)
      if (opts.enforceDiffBound && tier) {
        const trace = traceSolve_v2(puzzle, {
          timeLimitMs: opts.perTraceTimeMs,
          maxLookaheadDepth: 1,
        });
        if (trace.status !== 'solved') continue;
        const diff = computeTraceDifficulty(trace.diagnostics);
        if (diff < tier.min || diff > tier.max) continue;
      }

      // Both tests pass — c is redundant
      result = reduced;
    }
  }

  return result;
}

// ──── Step 4 + Integration: Two CDG v4 variants ────────────────────────────
// Both variants share the same Step 1-2-4-5 pipeline and differ only in
// Step 3 (minimality prune order):
//
//   v4-loose:  prunes [fixedCell, forbiddenCell, genderHint, totalHint, lineRule]
//              → leanest puzzle; hint axiom may be violated
//
//   v4-strict: prunes [fixedCell, forbiddenCell, lineRule] only
//              → preserves "every line has Total + H1" axiom
//
// Both still satisfy Soundness, Difficulty Bound, Pattern Diversity. The
// difference is whether minimality may erode the noogram-paradigm axiom.
// ────────────────────────────────────────────────────────────────────────────
async function generatePuzzleCDG_v4_core(level, onProgress, pruneOrder, engineTag) {
  const config = DIFFICULTY_CONFIGS[level];
  if (!config) return null;
  const tier = TRACE_DIFFICULTY_TIERS[level];
  const startTime = performance.now();
  const TOTAL_BUDGET = config.totalBudgetMs || 20000;
  const MAX_RETRIES = 5;

  // Custom-level: preserve the user's exact fixedTileCount and forbiddenCount.
  // The Step 2 (difficulty adjustment) and Step 3 (minimality pruning) both
  // alter these counts to satisfy difficulty/uniqueness goals — for preset
  // tiers that's the right behavior, but for Custom the user explicitly
  // specified the counts and expects them honored.
  const isCustom = !!config.isCustom;
  let bestFallback = null;

  for (let retry = 0; retry < MAX_RETRIES; retry++) {
    if (performance.now() - startTime > TOTAL_BUDGET) break;

    onProgress && onProgress({
      phase: engineTag + '-attempt',
      retry,
      elapsed: performance.now() - startTime,
      budget: TOTAL_BUDGET,
    });
    await new Promise(r => setTimeout(r, 0));

    // Step 1: Classic-aligned axiom layer
    const instance = cdg_buildAxiomInstance(level, config);
    if (!instance) continue;

    const canonical = {
      tokens: instance.tokens,
      pairs: instance.pairs,
      solution: instance.solution,
    };
    let constraints = cdg_axiomToConstraints(instance);

    // Step 2: Trace-targeted fixedCell adjustment (skipped for Custom)
    if (!isCustom) {
      onProgress && onProgress({
        phase: engineTag + '-adjust',
        retry,
        elapsed: performance.now() - startTime,
      });
      await new Promise(r => setTimeout(r, 0));

      const adjustResult = cdg_adjustFixedCellsForDifficulty(constraints, canonical, level, {
        maxIterations: 18,
        perStepTimeMs: 200,
        totalTimeBudget: Math.min(8000, TOTAL_BUDGET * 0.4),
      });
      constraints = adjustResult.constraints;
      if (adjustResult.action === 'failed' || adjustResult.action === 'unsolvable') continue;
    }

    // Step 3: Type-priority minimality (skipped for Custom — counts must be preserved)
    if (!isCustom) {
      onProgress && onProgress({
        phase: engineTag + '-minimize',
        retry,
        elapsed: performance.now() - startTime,
      });
      await new Promise(r => setTimeout(r, 0));

      constraints = cdg_pruneRedundantWithTrace(canonical, constraints, level, {
        perVerifyTimeMs: 400,
        perTraceTimeMs: 300,
        enforceDiffBound: true,
        totalTimeBudget: Math.min(6000, TOTAL_BUDGET * 0.3),
        pruneOrder: pruneOrder,
      });
    }

    // Step 4: Final verification + Pattern Diversity
    const finalPuzzle = cdg_assemblePuzzle(canonical, constraints, level);
    // For Custom, allow more solutions if user specified maxSolutions > 1
    const maxSolForVerify = isCustom ? Math.min(50, Math.max(2, (config.maxSolutions || 1) + 1)) : 2;
    const finalVerify = enumerateSolutions(finalPuzzle, ANIMALS, maxSolForVerify, 1500);
    const acceptableSolCount = isCustom
      ? (finalVerify.solutions.length >= 1 && finalVerify.solutions.length <= (config.maxSolutions || 1))
      : (finalVerify.solutions.length === 1);
    if (!acceptableSolCount || finalVerify.timedOut) continue;

    const finalTrace = traceSolve_v2(finalPuzzle, {
      timeLimitMs: 2500,
      maxLookaheadDepth: 2,
      enableLevel4: true,
    });
    // For Custom, accept puzzle even if traceSolve can't fully resolve (user may want hard puzzles)
    if (!isCustom && finalTrace.status !== 'solved') continue;

    const diff = finalTrace.status === 'solved' ? computeTraceDifficulty(finalTrace.diagnostics) : 0;
    const diversity = finalTrace.status === 'solved' ? cdg_computePatternDiversity(finalTrace.diagnostics) : 0;

    // Tag puzzle with all metrics
    finalPuzzle.uniqueness = finalVerify.solutions.length === 1 ? 'strict' : 'loose';
    finalPuzzle.solutionCount = finalVerify.solutions.length;
    finalPuzzle.engine = engineTag;
    finalPuzzle.generationTime = performance.now() - startTime;
    finalPuzzle.attemptCount = retry + 1;
    finalPuzzle.traceDifficulty = diff;
    finalPuzzle.traceLength = finalTrace.trace.length;
    finalPuzzle.traceShape = computeTraceShape(finalTrace.trace);
    finalPuzzle.patternDiversity = diversity;

    // For Custom: accept the first valid result (no tier matching)
    if (isCustom) return finalPuzzle;

    const inRange = diff >= tier.min && diff <= tier.max;
    const effectiveMinDiv = retry < MAX_RETRIES - 1
      ? tier.min_diversity
      : tier.min_diversity * 0.7;
    const diversityOk = diversity >= effectiveMinDiv;

    if (inRange && diversityOk) return finalPuzzle;

    // Save best fallback (closest to ideal)
    if (!bestFallback) {
      bestFallback = finalPuzzle;
    } else {
      const currentDist = Math.abs(finalPuzzle.traceDifficulty - tier.ideal);
      const bestDist = Math.abs(bestFallback.traceDifficulty - tier.ideal);
      if (currentDist < bestDist) bestFallback = finalPuzzle;
    }
  }

  if (bestFallback) {
    bestFallback.outOfIdealRange = true;
    return bestFallback;
  }
  return null;
}

// Loose variant: aggressive minimality (hints prunable)
async function generatePuzzleCDG_v4_loose(level, onProgress) {
  return generatePuzzleCDG_v4_core(level, onProgress, CDG_PRUNE_ORDER_LOOSE, 'cdg-v4-loose');
}

// Strict variant: axiom-preserving minimality (hints inviolable)
async function generatePuzzleCDG_v4_strict(level, onProgress) {
  return generatePuzzleCDG_v4_core(level, onProgress, CDG_PRUNE_ORDER_STRICT, 'cdg-v4-strict');
}

// ─────────────────────────────────────────────────────────────────────────────
// V5 — Strict generator with pool selection and v5 difficulty metric
// ─────────────────────────────────────────────────────────────────────────────
// Builds on v4-strict (axiom-preserving minimality) but:
//   (1) generates a small POOL of candidates (default 4)
//   (2) measures each with the v5 multi-axis metric
//   (3) selects the candidate closest to the v5 tier ideal
//
// The v5 metric is more variable than v4's (~4× std/mean ratio in measurement),
// so picking the best of N candidates yields tighter alignment to ideal.
// Time budget per candidate is a fraction of the total budget.
async function generatePuzzleCDG_v5_strict(level, onProgress) {
  const config = DIFFICULTY_CONFIGS[level];
  if (!config) return null;
  const tierV5 = TRACE_DIFFICULTY_TIERS_V5[level];
  if (!tierV5) return null;

  const startTime = performance.now();
  const TOTAL_BUDGET = (config.totalBudgetMs || 20000) * 1.6;
  const POOL_SIZE = level === 'Sprout' ? 3 : (level === 'Hard' ? 4 : 4);
  const PER_CANDIDATE_BUDGET = TOTAL_BUDGET / POOL_SIZE;

  const pool = [];

  for (let attempt = 0; attempt < POOL_SIZE * 2; attempt++) {
    if (performance.now() - startTime > TOTAL_BUDGET) break;
    if (pool.length >= POOL_SIZE) break;

    onProgress && onProgress({
      phase: 'cdg-v5-strict-pool',
      attempt, poolSize: pool.length, target: POOL_SIZE,
      elapsed: performance.now() - startTime, budget: TOTAL_BUDGET,
    });
    await new Promise(r => setTimeout(r, 0));

    // Each pool slot gets one v4-strict generation (which itself does up to 5 retries).
    const subStart = performance.now();
    const candidate = await generatePuzzleCDG_v4_strict(level, () => {});
    const subElapsed = performance.now() - subStart;

    if (!candidate) continue;
    if (subElapsed > PER_CANDIDATE_BUDGET * 1.5) {
      // Burned too much time; record but stop trying for more
      pool.push(candidate);
      break;
    }
    pool.push(candidate);
  }

  if (pool.length === 0) return null;

  // Re-trace each pool member with v5 metric and pick closest to ideal
  let best = null, bestDist = Infinity;
  for (const cand of pool) {
    const trace = traceSolve_v2(cand, {
      timeLimitMs: 2500,
      maxLookaheadDepth: 2,
      enableLevel4: true,
    });
    if (trace.status !== 'solved') continue;
    const v5diff = computeTraceDifficulty_v5(trace.diagnostics, trace.trace);
    cand.traceDifficulty_v5 = v5diff;
    cand.engine = 'cdg-v5-strict';
    const dist = Math.abs(v5diff - tierV5.ideal);
    if (dist < bestDist) { bestDist = dist; best = cand; }
  }

  if (!best) best = pool[0];
  // Always tag the final v5 result with v5 engine, even if trace didn't fully solve
  best.engine = 'cdg-v5-strict';
  best.poolSize = pool.length;
  best.generationTime = performance.now() - startTime;
  return best;
}

// Backward-compat alias: legacy generatePuzzleCDG_v4 maps to the strict
// variant (canonical v4 design). Kept for any code that may reference it.
async function generatePuzzleCDG_v4(level, onProgress) {
  return generatePuzzleCDG_v4_strict(level, onProgress);
}

// =============================================================================
// SECTION 3.8 — ENGINE DISPATCH (V2 entry point)
// =============================================================================
// Public API that selects between three generators (classic + two CDG v4 variants).
// Default behavior is unchanged from the classic generator.
// engine values:
//   'classic'        (default) — Stage A-D random generator
//   'cdg-v4-loose'   — Spec-Aligned CDG v4 with aggressive minimality (hint axiom may erode)
//   'cdg-v4-strict'  — Spec-Aligned CDG v4 with axiom-preserving minimality (all lines have Total + H1)
// Legacy values 'cdg' and 'cdg-v4' both map to 'cdg-v4-strict' (canonical v4).
// Legacy value 'cdg-v3' maps to 'cdg-v4-loose' for users who preferred the older variant.
// =============================================================================

async function generatePuzzleAsyncV2(level, options, onProgress) {
  options = options || {};
  let engine = options.engine || 'classic';
  // Backward compat mappings
  if (engine === 'cdg') engine = 'cdg-v4-strict';
  if (engine === 'cdg-v4') engine = 'cdg-v4-strict';
  if (engine === 'cdg-v3') engine = 'cdg-v4-loose';
  const fallback = options.fallbackOnFailure || 'classic';
  let result = null;

  // Custom difficulty support: temporarily override DIFFICULTY_CONFIGS.Custom
  // with the user's customConfig so all downstream generators read the
  // customized parameters via DIFFICULTY_CONFIGS[level] as usual.
  let savedCustom = null;
  if (level === 'Custom' && options.customConfig) {
    savedCustom = DIFFICULTY_CONFIGS.Custom;
    DIFFICULTY_CONFIGS.Custom = buildCustomConfig(options.customConfig);
  }

  try {
    if (engine === 'cdg-v4-loose') {
      try {
        result = await generatePuzzleCDG_v4_loose(level, onProgress);
      } catch (e) {
        console.error('CDG v4-loose generation error:', e);
        result = null;
      }
      if (!result && fallback === 'classic') {
        onProgress && onProgress({ phase: 'cdg-v4-loose-failed-fallback-classic' });
        result = await generatePuzzleAsync(level, onProgress);
      }
    } else if (engine === 'cdg-v4-strict') {
      try {
        result = await generatePuzzleCDG_v4_strict(level, onProgress);
      } catch (e) {
        console.error('CDG v4-strict generation error:', e);
        result = null;
      }
      if (!result && fallback === 'classic') {
        onProgress && onProgress({ phase: 'cdg-v4-strict-failed-fallback-classic' });
        result = await generatePuzzleAsync(level, onProgress);
      }
    } else if (engine === 'cdg-v5-strict') {
      try {
        result = await generatePuzzleCDG_v5_strict(level, onProgress);
      } catch (e) {
        console.error('CDG v5-strict generation error:', e);
        result = null;
      }
      if (!result && fallback === 'classic') {
        onProgress && onProgress({ phase: 'cdg-v5-strict-failed-fallback-classic' });
        result = await generatePuzzleAsync(level, onProgress);
      }
    } else {
      result = await generatePuzzleAsync(level, onProgress);
    }
  } finally {
    // Always restore the Custom template
    if (savedCustom !== null) {
      DIFFICULTY_CONFIGS.Custom = savedCustom;
    }
  }
  // Optional trace validation tag (for any engine, uses traceSolve_v2)
  if (options.validateWithSolver && result && !result.traceDifficulty) {
    try {
      const trace = traceSolve_v2(result, { timeLimitMs: 1500, maxLookaheadDepth: 1 });
      if (trace.status === 'solved') {
        result.traceDifficulty = computeTraceDifficulty(trace.diagnostics);
        result.traceShape = computeTraceShape(trace.trace);
        result.traceLength = trace.trace.length;
        // Also compute v5 metric for any engine
        try { result.traceDifficulty_v5 = computeTraceDifficulty_v5(trace.diagnostics, trace.trace); } catch (e) {}
      }
      result.traceStatus = trace.status;
    } catch (e) { /* swallow */ }
  }
  // Tag every successfully generated puzzle with a structural identifier.
  // Two puzzles with identical structure share the same ID. Useful for
  // user reference, sharing, and debugging.
  if (result && !result.puzzleId) {
    try {
      result.puzzleId = computePuzzleIdentifier(result);
    } catch (e) { /* swallow */ }
  }
  // Also attach a reproducible seed: the complete puzzle structure encoded
  // into a base64 string. Loading this seed reconstructs the exact same
  // puzzle without re-running the generator.
  if (result && !result.seed) {
    try {
      // For Custom puzzles, embed the customConfig so it round-trips
      if (level === 'Custom' && options.customConfig) {
        result.customConfigUsed = options.customConfig;
      }
      result.seed = encodePuzzleSeed(result);
    } catch (e) { /* swallow */ }
  }
  if (!result) result = loadFallback(level);
  return result;
}

// =============================================================================
// SECTION 4 — RUNTIME VALIDATION (Constraint-Based Win)
// =============================================================================

function evaluateLineRuleRuntime(rule, placements, tokens, marks) {
  const inLine = (cell) => rule.isRow ? cell.row === rule.idx : cell.col === rule.idx;
  const placedTokenEntries = Object.entries(placements).filter(([_, cell]) => inLine(cell));
  if (placedTokenEntries.length === 0) return true; // empty line auto-satisfied

  return placedTokenEntries.every(([tid, _]) => {
    const t = tokens.find(t => t.id === tid);
    if (!t) return false;
    if (rule.dim === 'gender') {
      return marks[tid] === rule.val;
    }
    const animal = animalById(t.animalId);
    return animal[rule.dim] === rule.val;
  });
}

// Returns 'empty' | 'partial' | 'bad' (some token violates rule) | 'satisfied-rule-only'
// 'satisfied-rule-only' means: line is non-empty AND every placed token in this
// line matches the rule. This is NOT enough to highlight green — green requires
// ALL line count hints in the same line to also be ok (handled at caller).
function evaluateLineRuleStatus(rule, placements, tokens, marks) {
  const inLine = (cell) => rule.isRow ? cell.row === rule.idx : cell.col === rule.idx;
  const placedTokenEntries = Object.entries(placements).filter(([_, cell]) => inLine(cell));
  if (placedTokenEntries.length === 0) return 'empty';

  const checkToken = (tid) => {
    const t = tokens.find(t => t.id === tid);
    if (!t) return false;
    if (rule.dim === 'gender') {
      return marks[tid] === rule.val;
    }
    const animal = animalById(t.animalId);
    return animal[rule.dim] === rule.val;
  };

  // Gender rule: a token's gender is "?", treat as not-yet-conflicting (partial),
  // but if any placed token has gender set and it doesn't match → bad.
  if (rule.dim === 'gender') {
    let hasViolation = false;
    let allMarked = true;
    for (const [tid, _] of placedTokenEntries) {
      const m = marks[tid];
      if (!m) { allMarked = false; continue; }
      if (m !== rule.val) { hasViolation = true; break; }
    }
    if (hasViolation) return 'bad';
    if (!allMarked) return 'partial';
    return 'satisfied-rule-only';
  }

  // habitat / diet rule: animal species is fixed at placement, so every placed
  // token's attribute is immediately known. Any mismatch = bad.
  for (const [tid, _] of placedTokenEntries) {
    if (!checkToken(tid)) return 'bad';
  }
  return 'satisfied-rule-only';
}

function evaluateCountHintRuntime(hint, placements, tokens, marks) {
  const lineTokens = Object.entries(placements).filter(([_, cell]) =>
    hint.row !== null ? cell.row === hint.row : cell.col === hint.col
  );
  if (hint.type === 'total') return lineTokens.length === hint.value;
  if (hint.type === 'H1') return lineTokens.filter(([tid]) => marks[tid] === 'male').length === hint.value;
  if (hint.type === 'H2') return lineTokens.filter(([tid]) => marks[tid] === 'female').length === hint.value;
  return true;
}

function checkAllPairsAdjacent(pairs, placements) {
  for (const [t1, t2] of pairs) {
    const p1 = placements[t1], p2 = placements[t2];
    if (!p1 || !p2) return false;
    if (!isAdjacent(p1, p2)) return false;
  }
  return true;
}

function checkWinV2(puzzle, placements, marks) {
  if (!puzzle) return false;
  const tokens = puzzle.tokens;

  if (Object.keys(placements).length !== tokens.length) return false;
  if (Object.keys(marks).length !== tokens.length) return false;

  // Pair gender constraint
  for (const [t1, t2] of puzzle.pairs) {
    if (!marks[t1] || !marks[t2]) return false;
    if (marks[t1] === marks[t2]) return false;
  }

  // Adjacency
  if (!checkAllPairsAdjacent(puzzle.pairs, placements)) return false;

  // Forbidden cells
  const fset = new Set(puzzle.forbiddenCells.map(([r, c]) => `${r},${c}`));
  for (const cell of Object.values(placements)) {
    if (fset.has(`${cell.row},${cell.col}`)) return false;
  }

  // Line rules (evaluated at current placement, not canonical)
  for (const rule of (puzzle.lineRules || [])) {
    if (!evaluateLineRuleRuntime(rule, placements, tokens, marks)) return false;
  }

  // Count hints
  for (const hint of (puzzle.countHints || [])) {
    if (!evaluateCountHintRuntime(hint, placements, tokens, marks)) return false;
  }

  // Fixed tiles must retain position + species + gender
  for (const ft of (puzzle.fixedCells || [])) {
    const tokenAtCell = Object.entries(placements).find(([_, p]) =>
      p.row === ft.row && p.col === ft.col
    );
    if (!tokenAtCell) return false;
    const [tid] = tokenAtCell;
    const t = tokens.find(t => t.id === tid);
    if (!t || t.animalId !== ft.animalId) return false;
    if (marks[tid] !== ft.gender) return false;
  }

  return true;
}

// ─────────────────────────────────────────────────────────────────────────────
// EngineSelector — V4 toggle between three generators (classic, CDG v3, CDG v4)
// Renders as a 3-state pill in the header. Persists to localStorage.
// ─────────────────────────────────────────────────────────────────────────────
function EngineSelector({ engine, onChange, disabled }) {
  const t = useT();
  const opts = [
    { key: 'classic',        label: t('engine.classic'),     tip: t('engine.classic.desc') },
    { key: 'cdg-v4-loose',   label: t('engine.cdgloose'),    tip: t('engine.cdgloose.desc'),  beta: true },
    { key: 'cdg-v4-strict',  label: t('engine.cdgstrict'),   tip: t('engine.cdgstrict.desc'), beta: true },
    { key: 'cdg-v5-strict',  label: t('engine.cdgv5strict'), tip: t('engine.cdgv5strict.desc'), beta: true },
  ];
  return (
    <div role="radiogroup" aria-label={t('engine.label')} style={{
      display: 'inline-flex', alignItems: 'stretch',
      border: '1px solid var(--border-medium)', borderRadius: 4,
      overflow: 'hidden', flexShrink: 0,
      opacity: disabled ? 0.5 : 1,
    }}>

            className="font-body"
            style={{
              padding: '6px 9px',
              border: 'none',
              borderLeft: i > 0 ? '1px solid var(--border-medium)' : 'none',
              background: active ? 'var(--ink-primary)' : 'var(--bg-card)',
              color: active ? 'var(--bg-paper)' : 'var(--ink-secondary)',
              cursor: disabled ? 'wait' : 'pointer',

              <span style={{
                fontSize: 8, fontWeight: 500, letterSpacing: '0.05em',

            )}
          </button>
        );
      })}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// CustomPanel — modal overlay for configuring all difficulty parameters.
// Renders one control per CUSTOM_PARAM_SPEC entry. Passes the resulting
// config back via onApply, which then triggers a Custom-level generation.
// ─────────────────────────────────────────────────────────────────────────────
function CustomParamControl({ spec, value, onChange }) {
  const t = useT();
  const labelKey = `custom.param.${spec.key}`;
  const label = t(labelKey) || spec.label || spec.key;

  if (spec.type === 'int') {
    const v = (typeof value === 'number') ? value : spec.default;
    return (
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '6px 0', borderBottom: '1px solid var(--border-soft)' }}>
        <label style={{ flex: '0 0 130px', fontSize: 12, color: 'var(--ink-secondary)' }} className="font-body">{label}</label>
        <input type="range" min={spec.min} max={spec.max} step={spec.step} value={v}
          onChange={(e) => onChange(parseInt(e.target.value, 10))}
          style={{ flex: 1, minWidth: 80 }} />
        <span className="font-mono" style={{ flex: '0 0 50px', textAlign: 'right', fontSize: 12, color: 'var(--ink-primary)', fontWeight: 600 }}>{v}</span>
      </div>
    );
  }
  if (spec.type === 'pair') {
    const v = (Array.isArray(value) && value.length === 2) ? value : spec.default;
    const [lo, hi] = v;
    return (
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '6px 0', borderBottom: '1px solid var(--border-soft)' }}>
        <label style={{ flex: '0 0 130px', fontSize: 12, color: 'var(--ink-secondary)' }} className="font-body">{label}</label>
        <span className="font-mono" style={{ fontSize: 11, color: 'var(--ink-tertiary)' }}>{t('custom.range')}</span>
        <input type="number" min={spec.min} max={spec.max} step={spec.step} value={lo}
          onChange={(e) => {
            const newLo = Math.max(spec.min, Math.min(parseInt(e.target.value, 10) || spec.min, hi));
            onChange([newLo, hi]);
          }}
          style={{ flex: '0 0 56px', padding: '3px 6px', border: '1px solid var(--border-medium)', borderRadius: 3, fontSize: 12 }} />
        <span style={{ fontSize: 11, color: 'var(--ink-tertiary)' }}>—</span>
        <input type="number" min={spec.min} max={spec.max} step={spec.step} value={hi}
          onChange={(e) => {
            const newHi = Math.max(lo, Math.min(parseInt(e.target.value, 10) || lo, spec.max));
            onChange([lo, newHi]);
          }}
          style={{ flex: '0 0 56px', padding: '3px 6px', border: '1px solid var(--border-medium)', borderRadius: 3, fontSize: 12 }} />
      </div>
    );
  }
  if (spec.type === 'enum') {
    const v = (typeof value === 'string') ? value : spec.default;
    return (
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '6px 0', borderBottom: '1px solid var(--border-soft)' }}>
        <label style={{ flex: '0 0 130px', fontSize: 12, color: 'var(--ink-secondary)' }} className="font-body">{label}</label>
        <select value={v} onChange={(e) => onChange(e.target.value)}
          style={{ flex: 1, padding: '4px 6px', border: '1px solid var(--border-medium)', borderRadius: 3, fontSize: 12, background: 'var(--bg-card)', color: 'var(--ink-primary)' }}>
          {spec.options.map(([val, optLabel]) => (
            <option key={val} value={val}>{optLabel}</option>
          ))}
        </select>
      </div>
    );
  }
  return null;
}

function CustomPanel({ open, customConfig, onApply, onClose }) {
  const t = useT();
  const [draft, setDraft] = React.useState(customConfig || buildDefaultCustomConfig());

  React.useEffect(() => {
    // sync when customConfig prop changes (e.g., reopened)
    if (open) setDraft(customConfig || buildDefaultCustomConfig());
  }, [open, customConfig]);

  if (!open) return null;

  const update = (key, val) => setDraft(prev => ({ ...prev, [key]: val }));

  // Compute warnings: tokens (k*2) + forbidden must fit in n*n cells, etc.
  const warnings = [];
  const totalCells = draft.n * draft.n;
  const tokenCount = draft.k * 2;
  const forbHi = Array.isArray(draft.forbiddenCount) ? draft.forbiddenCount[1] : 0;
  if (tokenCount + forbHi > totalCells) {
    warnings.push(`경고: 토큰 ${tokenCount}개 + 차단 ${forbHi}개가 ${draft.n}×${draft.n}=${totalCells}셀을 초과`);
  }
  if (draft.k > ANIMALS.length) {
    warnings.push(`경고: 페어 수가 ${ANIMALS.length}를 초과 (동물 종 ${ANIMALS.length}개 한도)`);
  }
  const fixedHi = Array.isArray(draft.fixedTileCount) ? draft.fixedTileCount[1] : 0;
  const fixedLo = Array.isArray(draft.fixedTileCount) ? draft.fixedTileCount[0] : 0;
  if (fixedHi > tokenCount) {
    warnings.push(`경고: 고정 타일 ${fixedHi}개가 총 토큰 수 ${tokenCount}개를 초과`);
  }
  if (Array.isArray(draft.countCoverage) && draft.countCoverage[1] > 2 * draft.n) {
    warnings.push(`경고: 힌트 라인 수가 총 라인 수 ${2*draft.n}을 초과`);
  }
  // Solvability warning: low information density makes unique solutions hard to find
  const totalLineCount = 2 * draft.n;
  const countHintHi = Array.isArray(draft.countCoverage) ? draft.countCoverage[1] : totalLineCount;
  const ruleHi = Array.isArray(draft.ruleCount) ? draft.ruleCount[1] : 0;
  const infoScore = (countHintHi / totalLineCount) * 0.5 + (fixedHi / Math.max(1, tokenCount)) * 0.3 + (ruleHi / Math.max(1, totalLineCount)) * 0.2;
  if ((draft.maxSolutions || 1) === 1 && infoScore < 0.4) {
    warnings.push(`정보가 적어 유일해(maxSolutions=1)로 생성이 어려울 수 있습니다. maxSolutions를 2-5로 늘리거나 고정 타일/힌트를 추가하세요.`);
  }
  if (fixedLo === 0 && countHintHi < totalLineCount * 0.5 && (draft.maxSolutions || 1) === 1) {
    warnings.push(`고정 타일 0개 + 힌트 적음 → 유일해 생성 매우 어려움. 시간 한도 내 실패 가능.`);
  }

  return (
    <div style={{
      position: 'fixed', inset: 0, zIndex: 1000,
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      background: 'rgba(20, 18, 14, 0.55)',
      padding: 16,
    }} onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()} style={{
        background: 'var(--bg-paper)',
        border: '1px solid var(--border-medium)',
        borderRadius: 8,
        padding: 'clamp(16px, 3vw, 24px)',
        maxWidth: 520, width: '100%',
        maxHeight: '90vh', overflowY: 'auto',
        boxShadow: '0 8px 32px rgba(0,0,0,0.18)',
      }}>
        <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', marginBottom: 12 }}>
          <h2 className="font-display" style={{
            fontSize: 18, fontWeight: 500, letterSpacing: '-0.01em',
            color: 'var(--ink-primary)', margin: 0,
          }}>⚙ {t('custom.title')}</h2>
          <button onClick={onClose} aria-label="close" style={{
            border: 'none', background: 'transparent', cursor: 'pointer',
            color: 'var(--ink-tertiary)', fontSize: 18, padding: '0 4px',
          }}>✕</button>
        </div>
        <p className="font-body" style={{ fontSize: 12, color: 'var(--ink-tertiary)', marginTop: 0, marginBottom: 14 }}>
          {t('custom.subtitle')}
        </p>

        <div style={{ marginBottom: 14 }}>
          {CUSTOM_PARAM_SPEC.map(spec => (
            <CustomParamControl
              key={spec.key}
              spec={spec}
              value={draft[spec.key]}
              onChange={(v) => update(spec.key, v)}
            />
          ))}
        </div>

        {warnings.length > 0 && (
          <div style={{
            background: 'rgba(180,83,9,0.08)',
            border: '1px solid var(--accent-gold)',
            borderRadius: 4,
            padding: '8px 10px',
            marginBottom: 12,
            fontSize: 11,
            color: 'var(--accent-gold)',
          }} className="font-body">
            {warnings.map((w, i) => <div key={i}>⚠ {w}</div>)}
          </div>
        )}

        <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end' }}>
          <button onClick={() => setDraft(buildDefaultCustomConfig())} className="font-body" style={{
            padding: '8px 14px', border: '1px solid var(--border-medium)',
            borderRadius: 4, background: 'var(--bg-card)', color: 'var(--ink-secondary)',
            fontSize: 12, cursor: 'pointer',
          }}>{t('custom.reset')}</button>
          <button onClick={() => { onApply(draft); onClose(); }} className="font-body" style={{
            padding: '8px 16px', border: '1px solid var(--ink-primary)',
            borderRadius: 4, background: 'var(--ink-primary)', color: 'var(--bg-paper)',
            fontSize: 12, fontWeight: 600, cursor: 'pointer',
          }}>{t('custom.apply')}</button>
        </div>
      </div>
    </div>
  );
}

// Progress strip — sits just above the grid, integrates subtitle + counters
function PuzzleMeta({ puzzle, placedCount, totalTokens, genderedCount, adjacencyOk }) {
  if (!puzzle) return null;
  const t = useT();
  const allPlaced = placedCount === totalTokens;
  const allGendered = genderedCount === totalTokens;
  const traceDiff = puzzle.traceDifficulty;
  // Engine detection: any 'cdg*' value is a CDG variant
  const engineId = puzzle.engine || 'classic';
  const isCDG = engineId === 'cdg' || engineId === 'cdg-v3' || engineId === 'cdg-v4'
             || engineId === 'cdg-v4-loose' || engineId === 'cdg-v4-strict'
             || engineId === 'cdg-v5-strict';
  const cdgVariant = (engineId === 'cdg-v5-strict') ? 'v5'
                   : (engineId === 'cdg-v4-strict') ? 'strict'
                   : (engineId === 'cdg-v4-loose') ? 'loose'
                   : (engineId === 'cdg-v4' || engineId === 'cdg') ? 'strict' // legacy
                   : (engineId === 'cdg-v3') ? 'loose' // legacy
                   : null;
  const patternDiv = puzzle.patternDiversity;
  return (
    <div style={{
      padding: '8px clamp(12px, 4vw, 40px) 6px',
      display: 'flex', justifyContent: 'space-between', alignItems: 'center',
      gap: 10, flexWrap: 'wrap',
