<style>
  :root {
    --bg-paper: #FAF7F0;
    --bg-card: #FFFFFF;
    --bg-subtle: #F5F2EA;
    --bg-fixed: #EEE9DC;       /* pre-mark tile background — neutral, not gold */
    --ink-primary: #1C1917;
    --ink-secondary: #44403C;
    --ink-tertiary: #78716C;
    --border-soft: #E7E5E4;
    --border-medium: #D6D3D1;
    --accent-gold: #B45309;    /* reserved: constraints (badges, Q, selection) */
    --accent-gold-soft: #D97706;
    --success-soft: #FEF3C7;
    --forbidden: #E7E5E4;
    --danger: #B91C1C;
    --gender-male: #1E3A8A;    /* reserved: ♂ only */
    --gender-female: #9D174D;  /* reserved: ♀ only */
    --ok-strict: #B45309;
    --ok-loose: #92400E;
    --ok-flexible: #78716C;
    --lang-font: 'Pretendard', 'Pretendard Variable', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body, #root { margin: 0; padding: 0; background: var(--bg-paper); color: var(--ink-primary); }
  body {
    font-family: var(--lang-font);
    -webkit-font-smoothing: antialiased;
    /* Suppress mobile system gestures that interfere with the puzzle UX:
       - iOS long-press callout (image save / share menu)
       - iOS magnifier on long-press
       - blue tap highlight rectangle
       - long-press text selection bubble
       The game has its own long-press semantics for tile attribute popovers,
       and accidental triggering of system menus over tile images breaks flow. */
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* Re-enable text selection inside elements where reading/copying matters
     (tooltips, help modal body, dialogs). Add `data-selectable="1"` to opt-in. */
  [data-selectable="1"], [data-selectable="1"] * {
    -webkit-user-select: text;
    -moz-user-select: text;
    user-select: text;
    -webkit-touch-callout: default;
  }
  /* Images everywhere: disable native HTML5 drag and iOS preview/save menu.
     The puzzle moves tiles via its own pointer-drag system; native drag would
     fight it. */
  img {
    -webkit-user-drag: none;
    -webkit-touch-callout: none;
    user-select: none;
    pointer-events: none;  /* let parent tile own pointer events */
  }
  .font-display { font-family: 'Fraunces', Georgia, serif; }
  .font-body { font-family: var(--lang-font); }
  .font-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  button { font-family: inherit; }
  button:focus-visible { outline: 2px solid var(--accent-gold); outline-offset: 2px; }

  @keyframes cellResolve {
    0% { transform: scale(0.88); opacity: 0.6; }
    60% { transform: scale(1.06); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes partnerPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(180, 83, 9, 0); }
    50% { box-shadow: 0 0 0 6px rgba(180, 83, 9, 0.2); }
  }
  @keyframes celebrationWave {
    0% { transform: scale(1); filter: brightness(1); }
    50% { transform: scale(1.08); filter: brightness(1.15) saturate(1.1); }
    100% { transform: scale(1); filter: brightness(1); }
  }
  @keyframes fadeInUp {
    0% { transform: translateY(8px); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
  }
  @keyframes progressShimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  @keyframes softPulseRing {
    0%, 100% { box-shadow: 0 0 0 0 rgba(180,83,9,0); }
    50%      { box-shadow: 0 0 0 4px rgba(180,83,9,0.18); }
  }
  @keyframes tooltipIn {
    0%   { opacity: 0; transform: translateY(-4px) scale(0.96); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes badgeTipFade {
    0%   { opacity: 0; }
    100% { opacity: 1; }
  }

  /* Accessibility: respect reduced-motion preference */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }

  /* Stronger keyboard focus indication */
  [role="button"]:focus-visible,
  button:focus-visible {
    outline: 2px solid var(--accent-gold);
    outline-offset: 2px;
    border-radius: 4px;
  }
</style>

// Context + hooks
// ─────────────────────────────────────────────────────────────────
const LangContext = createContext({ lang: 'ko', setLang: () => {}, t: (k) => k });

function LangProvider({ children, initialLang = 'ko', onChange }) {
  const [lang, setLangState] = useState(initialLang);

  const setLang = useCallback((next) => {
    if (!LANGS.find(l => l.code === next)) return;
    setLangState(next);
    try { localStorage.setItem('zoologic.lang', next); } catch (e) {}
    if (onChange) onChange(next);
  }, [onChange]);

  // Sync <html lang>, font stack + --lang-font CSS variable on change.
  useEffect(() => {
    const meta = LANGS.find(l => l.code === lang) || LANGS[0];
    document.documentElement.setAttribute('lang', meta.htmlLang);
    document.documentElement.style.setProperty('--lang-font', FONT_STACK[lang]);
    document.body.style.fontFamily = FONT_STACK[lang];

function buildCustomConfigFromLevel(level) {
  const lvCfg = DIFFICULTY_CONFIGS[level];
  if (!lvCfg) return buildDefaultCustomConfig();
  const cfg = {};
  for (const p of CUSTOM_PARAM_SPEC) {

      cfg[p.key] = p.default;

      if (Array.isArray(v)) {

        const csvSorted = [...v].sort().join(',');
        const matched = (p.options || []).find(([key]) => {
          const keySorted = key.split(',').sort().join(',');
          return keySorted === csvSorted;

        cfg[p.key] = matched ? matched[0] : v.join(',');

    const v = customConfig[p.key];
    if (v === undefined || v === null) continue;
    if (p.type === 'int') {
      const clamped = Math.max(p.min, Math.min(p.max, Math.round(v)));
      base[p.key] = clamped;
    } else if (p.type === 'pair') {
      if (Array.isArray(v) && v.length === 2) {
        const lo = Math.max(p.min, Math.min(p.max, Math.round(v[0])));
        const hi = Math.max(lo, Math.min(p.max, Math.round(v[1])));
        base[p.key] = [lo, hi];

    } else if (p.type === 'enum') {
      if (typeof v === 'string') {
        // ruleDimensions special: stored as comma-separated string, expand to array
        if (p.key === 'ruleDimensions') {
          base[p.key] = v.split(',').map(s => s.trim()).filter(Boolean);

          base[p.key] = v;

// Compute a short identifier (8 hex chars) for a puzzle based on its essential
// structure. Two puzzles with identical structure produce the same ID; even
// minor differences (one fixedCell moved, one hint changed) produce different
// IDs. Uses FNV-1a 32-bit hash over a deterministic serialization.
function computePuzzleIdentifier(puzzle) {
  if (!puzzle) return null;
  const parts = [];

  // Tokens: sorted by id for stability
  const tokens = [...(puzzle.tokens || [])].sort((a, b) => a.id.localeCompare(b.id));
  for (const t of tokens) {
    parts.push(`T|${t.id}|${t.row}|${t.col}|${t.animalId}`);
  }

  // Solution genders: sorted by token id
  const solKeys = Object.keys(puzzle.solution || {}).sort();
  for (const k of solKeys) {
    parts.push(`G|${k}|${puzzle.solution[k]}`);
  }

  // LineRules: sorted by isRow + idx + dim + val
  const rules = [...(puzzle.lineRules || [])].sort((a, b) => {
    return (a.isRow ? 0 : 1) - (b.isRow ? 0 : 1) || a.idx - b.idx ||
           a.dim.localeCompare(b.dim) || String(a.val).localeCompare(String(b.val));
  });
  for (const r of rules) {
    parts.push(`R|${r.isRow?1:0}|${r.idx}|${r.dim}|${r.val}`);
  }

  // CountHints: sorted by type + row + col + value
  const hints = [...(puzzle.countHints || [])].sort((a, b) => {
    return a.type.localeCompare(b.type) ||
           ((a.row ?? -1) - (b.row ?? -1)) || ((a.col ?? -1) - (b.col ?? -1)) ||
           (a.value - b.value);
  });
  for (const h of hints) {
    parts.push(`H|${h.type}|${h.row ?? '-'}|${h.col ?? '-'}|${h.value}`);
  }

  // FixedCells: sorted by row + col
  const fixed = [...(puzzle.fixedCells || [])].sort((a, b) => a.row - b.row || a.col - b.col);
  for (const f of fixed) {
    parts.push(`F|${f.row}|${f.col}|${f.animalId}|${f.gender}`);
  }

  // ForbiddenCells: sorted
  const forb = [...(puzzle.forbiddenCells || [])].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  for (const fc of forb) {
    parts.push(`X|${fc[0]}|${fc[1]}`);
  }

  // FNV-1a 32-bit hash
  const str = parts.join(';');
  let hash = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    hash ^= str.charCodeAt(i);
    hash = (hash * 0x01000193) >>> 0;
  }
  return hash.toString(16).padStart(8, '0');
}

// ─────────────────────────────────────────────────────────────────────────────
// REPRODUCIBLE SEED SYSTEM (v1)
// ─────────────────────────────────────────────────────────────────────────────
// Unlike `computePuzzleIdentifier` (which is a one-way hash), the reproducible
// seed encodes the COMPLETE puzzle structure into a base64 string. Decoding
// reverses this back to a fully-formed puzzle — no generator re-run required.
//
// This guarantees 100% reproduction across:
//   - different sessions / browsers / users
//   - different generator code versions (the seed is self-contained)
//   - different engines (a v5 seed loaded by classic still produces v5 puzzle)
//
// Format: "ZL1<base64-encoded JSON>"
//   ZL = Zoologic, 1 = format version (for forward compatibility)
//
// Length: ~80 chars (Sprout) to ~400 chars (Hard with many constraints)

// Use UTF-8 safe base64 (handles Korean characters in animal habitats/diets).
function _b64encode(str) {
  // Encode str → UTF-8 bytes → base64
  const bytes = new TextEncoder().encode(str);
  let binary = '';
  for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
  return btoa(binary).replace(/=+$/, ''); // strip trailing '='
}

function _b64decode(str) {
  // Pad to multiple of 4
  const padded = str + '='.repeat((4 - str.length % 4) % 4);
  const binary = atob(padded);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

// Encode a puzzle into a portable seed string. Result starts with "ZL1".
function encodePuzzleSeed(puzzle) {
  if (!puzzle) return null;
  // Build minimal canonical structure. Key choices:
  //   - tokens are listed in token-id order (t0, t1, ...) so pairs are implied
  //     (t0+t1 pair, t2+t3 pair, ...). This avoids storing pairs separately.
  //   - solution genders are stored in the same order.
  //   - level + engine are preserved so re-loading shows correct labels.
  const tokenList = [...(puzzle.tokens || [])].sort((a, b) => {
    // sort by token id numeric: t0, t1, t10... → 0, 1, 10
    const na = parseInt(a.id.replace(/^t/, ''), 10);
    const nb = parseInt(b.id.replace(/^t/, ''), 10);
    return na - nb;
  });
  // Tokens encoded as compact array: [animalId, row, col]
  const tokenArr = tokenList.map(t => [t.animalId, t.row, t.col]);
  // Solution: array of genders in same order (1=male, 0=female)
  const sol = puzzle.solution || {};
  const genderArr = tokenList.map(t => sol[t.id] === 'male' ? 1 : 0);

  // Rules: [isRow(0/1), idx, dim_short, val]
  // dim_short: 'h'=habitat, 'd'=diet, 'g'=gender
  const dimMap = { habitat: 'h', diet: 'd', gender: 'g' };
  const rules = (puzzle.lineRules || []).map(r => [r.isRow ? 1 : 0, r.idx, dimMap[r.dim] || r.dim, r.val]);

  // CountHints: [type_short, row_or_null, col_or_null, value]
  // type_short: 't'=total, 'm'=H1, 'f'=H2
  const hintTypeMap = { total: 't', H1: 'm', H2: 'f' };
  const hints = (puzzle.countHints || []).map(h => [hintTypeMap[h.type] || h.type, h.row, h.col, h.value]);

  // FixedCells: [row, col, animalId, gender(0/1)]
  const fixed = (puzzle.fixedCells || []).map(f => [f.row, f.col, f.animalId, f.gender === 'male' ? 1 : 0]);

  // ForbiddenCells: [[row, col], ...]
  const forbidden = (puzzle.forbiddenCells || []).map(fc => [fc[0], fc[1]]);

  // PreMarks: tokens visible at start (subset of token indices)
  const preMarkSet = puzzle.preMarks || {};
  const preMarkIndices = tokenList
    .map((t, i) => preMarkSet[t.id] ? i : -1)
    .filter(i => i >= 0);

  const data = {
    v: 1, // format version
    n: puzzle.n,
    lv: puzzle.level || null,
    en: puzzle.engine || null,
    t: tokenArr,
    g: genderArr,
    r: rules,
    h: hints,
    f: fixed,
    x: forbidden,
    p: preMarkIndices,
  };
  // For Custom level, also embed customConfig so Custom puzzles reproduce exactly
  if (puzzle.level === 'Custom' && puzzle.customConfigUsed) {
    data.cc = puzzle.customConfigUsed;
  }
  const json = JSON.stringify(data);
  return 'ZL1' + _b64encode(json);
}

// Decode a seed string back into a puzzle object that can be loaded directly.
// Returns null if the seed is malformed.
function decodePuzzleSeed(seed) {
  if (typeof seed !== 'string') return null;
  if (!seed.startsWith('ZL1')) return null;
  let data;
  try {
    const json = _b64decode(seed.slice(3));
    data = JSON.parse(json);
  } catch (e) {
    return null;
  }
  if (!data || data.v !== 1 || typeof data.n !== 'number') return null;

  const dimMapInv = { h: 'habitat', d: 'diet', g: 'gender' };
  const hintTypeInv = { t: 'total', m: 'H1', f: 'H2' };

  // Reconstruct tokens with synthetic IDs
  const tokens = (data.t || []).map((tArr, i) => ({
    id: 't' + i,
    animalId: tArr[0],
    row: tArr[1],
    col: tArr[2],
  }));
  // Pairs: tokens come in order, pair by adjacency (t0+t1, t2+t3, ...)
  const pairs = [];
  for (let i = 0; i + 1 < tokens.length; i += 2) {
    pairs.push([tokens[i].id, tokens[i + 1].id]);
  }
  // Solution from gender array
  const solution = {};
  (data.g || []).forEach((g, i) => {
    if (i < tokens.length) solution[tokens[i].id] = g === 1 ? 'male' : 'female';
  });
  // Line rules
  const lineRules = (data.r || []).map((rArr, i) => ({
    id: 'r' + i,
    isRow: rArr[0] === 1,
    idx: rArr[1],
    dim: dimMapInv[rArr[2]] || rArr[2],
    val: rArr[3],
  }));
  // Count hints
  const countHints = (data.h || []).map((hArr, i) => ({
    id: 'h' + i,
    type: hintTypeInv[hArr[0]] || hArr[0],
    row: hArr[1],
    col: hArr[2],
    value: hArr[3],
  }));
  // Fixed cells
  const fixedCells = (data.f || []).map(fArr => ({
    row: fArr[0], col: fArr[1], animalId: fArr[2],
    gender: fArr[3] === 1 ? 'male' : 'female',
  }));
  // Forbidden cells
  const forbiddenCells = (data.x || []).map(xArr => [xArr[0], xArr[1]]);
  // PreMarks: build from indices + solution
  const preMarks = {};
  (data.p || []).forEach(idx => {
    if (idx < tokens.length) {
      preMarks[tokens[idx].id] = solution[tokens[idx].id];
    }
  });

  // Reassemble puzzle
  const puzzle = {
    n: data.n,
    tokens,
    pairs,
    solution,
    lineRules,
    countHints,
    fixedCells,
    forbiddenCells,
    preMarks,
    level: data.lv || 'Custom',
    engine: data.en || 'classic',
    uniqueness: 'strict', // assumed; will be revalidated if loaded into a checker
    solutionCount: 1,
    // Re-stamp identifier (hash will match the original since structure is identical)
    puzzleId: null, // recomputed below
    fromSeed: true,
    seed,
  };
  if (data.cc) puzzle.customConfigUsed = data.cc;

  // Compute identifier hash so SeedFooter can show consistent #ID
  puzzle.puzzleId = computePuzzleIdentifier(puzzle);

  return puzzle;
}

function isAdjacent(c1, c2) {
  return Math.max(Math.abs(c1.row - c2.row), Math.abs(c1.col - c2.col)) === 1;
}

function getPartnerToken(tokenId, pairs) {
  for (const [t1, t2] of pairs) {
    if (t1 === tokenId) return t2;
    if (t2 === tokenId) return t1;
  }
  return null;
}

function getTokensInRow(r, tokens) { return tokens.filter(t => t.row === r); }
function getTokensInCol(c, tokens) { return tokens.filter(t => t.col === c); }

function animalById(id) { return ANIMALS.find(a => a.id === id); }

// =============================================================================
// SECTION 3 — 4-STAGE GENERATION PIPELINE
// =============================================================================

// ─────────────────────────────────────────────────────────────────────────────
// STAGE A: Design Rule Template — Constraint-First Generation
// ─────────────────────────────────────────────────────────────────────────────
function designRuleTemplate(config, animals) {
  const targetCount = randInt(config.ruleCount[0], config.ruleCount[1]);
  const dims = config.ruleDimensions;
  const n = config.n;

  // Enumerate all possible rules
  const allRules = [];
  for (let i = 0; i < n; i++) {
    for (const isRow of [true, false]) {
      for (const dim of dims) {
        if (dim === 'habitat') {
          for (const val of ['사바나', '극지', '해양', '숲']) {
            allRules.push({ isRow, idx: i, dim, val });
          }
        } else if (dim === 'diet') {
          for (const val of ['육식', '초식']) {
            allRules.push({ isRow, idx: i, dim, val });
          }
        } else if (dim === 'gender') {
          for (const val of ['male', 'female']) {
            allRules.push({ isRow, idx: i, dim, val });
          }
        }
      }
    }
  }

  // Try random combinations
  for (let attempt = 0; attempt < 60; attempt++) {
    const candidate = shuffle(allRules).slice(0, targetCount);

    // Check line uniqueness (no two rules on same line)
    const lines = new Set();
    let valid = true;
    for (const r of candidate) {
      const key = `${r.isRow ? 'r' : 'c'}${r.idx}`;
      if (lines.has(key)) { valid = false; break; }
      lines.add(key);
    }
    if (!valid) continue;

    // Check cross-cell feasibility
    if (!crossCellsFeasible(candidate, animals)) continue;

    return candidate.map((r, i) => ({ ...r, id: `rule-${i}` }));
  }
  return null;
}

function crossCellsFeasible(rules, animals) {
  // For row rule vs col rule pairs, check if their cross cell can hold any animal
  for (let i = 0; i < rules.length; i++) {
    for (let j = i + 1; j < rules.length; j++) {
      const r1 = rules[i], r2 = rules[j];
      if (r1.isRow === r2.isRow) continue;

      // They cross at one cell; compute compatible animals
      const compatible = animals.filter(a => {
        if (r1.dim !== 'gender' && a[r1.dim] !== r1.val) return false;
        if (r2.dim !== 'gender' && a[r2.dim] !== r2.val) return false;
        return true;
      });
      // Gender rules don't restrict species; always feasible for species
      // But if both are species dim (habitat/diet), need at least one compatible animal
      if (r1.dim !== 'gender' && r2.dim !== 'gender' && compatible.length === 0) {
        return false;
      }
    }
  }
  return true;
}

// ─────────────────────────────────────────────────────────────────────────────
// STAGE B: Constrained Adjacent Placement
// ─────────────────────────────────────────────────────────────────────────────
function constrainedAdjacentPlacement(config, ruleTemplate, forbiddenCells, animals) {
  const n = config.n;
  const k = config.k;
  const forbidden = new Set(forbiddenCells.map(([r, c]) => `${r},${c}`));

  // Build cell domains (which animals can be placed at each cell, given habitat/diet rules)
  const cellDomains = {};
  for (let r = 0; r < n; r++) {
    for (let c = 0; c < n; c++) {
      const key = `${r},${c}`;
      if (forbidden.has(key)) continue;

      let allowed = new Set(animals.map(a => a.id));
      for (const rule of ruleTemplate) {
        if (rule.dim === 'gender') continue; // gender rules applied post-placement
        const inLine = rule.isRow ? (rule.idx === r) : (rule.idx === c);
        if (inLine) {
          allowed = new Set([...allowed].filter(id => animalById(id)[rule.dim] === rule.val));
        }
      }
      if (allowed.size > 0) cellDomains[key] = allowed;
    }
  }

  // For animal pool restriction
  let animalPool = animals;
  if (config.animalPoolRestriction === 'same_habitat') {
    const habitats = ['사바나', '극지', '해양', '숲'];
    const viableHabitats = habitats.filter(h => animals.filter(a => a.habitat === h).length >= k);
    if (viableHabitats.length === 0) return null;
    const h = viableHabitats[randInt(0, viableHabitats.length - 1)];
    animalPool = animals.filter(a => a.habitat === h);
  }

  // Compute per-animal options (list of adjacent cell pairs this animal can occupy)
  const animalOptions = {};
  for (const animal of animalPool) {
    const options = [];
    const cellsForAnimal = Object.entries(cellDomains)
      .filter(([_, dom]) => dom.has(animal.id))
      .map(([key]) => {
        const [r, c] = key.split(',').map(Number);
        return { row: r, col: c, key };
      });

    for (const c1 of cellsForAnimal) {
      for (const c2 of cellsForAnimal) {
        if (c1.key >= c2.key) continue; // dedupe
        if (!isAdjacent(c1, c2)) continue;
        options.push([c1, c2]);
      }
    }
    animalOptions[animal.id] = options;
  }

  // Viable animals: those with at least one option
  const viable = animalPool.filter(a => animalOptions[a.id].length > 0);
  if (viable.length < k) return null;

  // Try selecting k animals and placing them
  for (let selAttempt = 0; selAttempt < 20; selAttempt++) {
    const selected = shuffle(viable).slice(0, k);
    // Sort by fewest options (MRV)
    selected.sort((a, b) => animalOptions[a.id].length - animalOptions[b.id].length);

    const used = new Set();
    const result = [];

    function place(idx) {
      if (idx === k) return true;
      const animal = selected[idx];
      const opts = shuffle(animalOptions[animal.id]);
      for (const [c1, c2] of opts) {
        if (used.has(c1.key) || used.has(c2.key)) continue;
        used.add(c1.key); used.add(c2.key);
        result.push([animal, c1, c2]);
        if (place(idx + 1)) return true;
        result.pop();
        used.delete(c1.key); used.delete(c2.key);
      }
      return false;
    }

    if (place(0)) {
      // Convert to tokens/pairs
      const tokens = [], pairs = [];
      for (let i = 0; i < result.length; i++) {
        const [animal, c1, c2] = result[i];
        const t1 = `t${i * 2}`, t2 = `t${i * 2 + 1}`;
        tokens.push({ id: t1, animalId: animal.id, row: c1.row, col: c1.col });
        tokens.push({ id: t2, animalId: animal.id, row: c2.row, col: c2.col });
        pairs.push([t1, t2]);
      }
      return { tokens, pairs };
    }
  }
  return null;
}

// ─────────────────────────────────────────────────────────────────────────────
// Gender Assignment Respecting Gender Rules
// ─────────────────────────────────────────────────────────────────────────────
function assignGendersWithRules(pairs, tokens, lineRules) {
  const genderRules = lineRules.filter(r => r.dim === 'gender');

  // Compute forced genders for tokens in gender-rule lines
  const forcedGender = {};
  for (const rule of genderRules) {
    const lineTokens = rule.isRow
      ? tokens.filter(t => t.row === rule.idx)
      : tokens.filter(t => t.col === rule.idx);
    for (const t of lineTokens) {
      if (forcedGender[t.id] && forcedGender[t.id] !== rule.val) {
        return null; // conflict
      }
      forcedGender[t.id] = rule.val;
    }
  }

  // Assign genders respecting forced and pair-constraint
  const marks = {};
  for (const [t1, t2] of pairs) {
    const f1 = forcedGender[t1];
    const f2 = forcedGender[t2];

    if (f1 && f2) {
      if (f1 === f2) return null; // pair can't have same gender
      marks[t1] = f1; marks[t2] = f2;
    } else if (f1) {
      marks[t1] = f1; marks[t2] = f1 === 'male' ? 'female' : 'male';
    } else if (f2) {
      marks[t2] = f2; marks[t1] = f2 === 'male' ? 'female' : 'male';
    } else {
      if (Math.random() < 0.5) { marks[t1] = 'male'; marks[t2] = 'female'; }
      else { marks[t1] = 'female'; marks[t2] = 'male'; }
    }
  }
  return marks;
}

// ─────────────────────────────────────────────────────────────────────────────
// STAGE C: Auxiliary Hints — Count hints + Fixed tiles
// ─────────────────────────────────────────────────────────────────────────────
function addAuxiliaryHints(placement, config, solution, lineRules, forbiddenCells) {
  const n = config.n;
  const tokens = placement.tokens;

  // Identify rule lines (these must have # hints for synergy)
  const ruleLineKeys = new Set(
    lineRules.map(r => `${r.isRow ? 'r' : 'c'}${r.idx}`)
  );

  // All lines
  const allLines = [];
  for (let i = 0; i < n; i++) {
    allLines.push({ isRow: true, idx: i });
    allLines.push({ isRow: false, idx: i });
  }

  // Priority: rule lines first, then others
  const priorityLines = allLines.filter(l =>
    ruleLineKeys.has(`${l.isRow ? 'r' : 'c'}${l.idx}`)
  );
  const otherLines = allLines.filter(l =>
    !ruleLineKeys.has(`${l.isRow ? 'r' : 'c'}${l.idx}`)
  );

  // Target count coverage
  const targetCount = randInt(config.countCoverage[0], config.countCoverage[1]);
  // Ensure priority lines all included
  const neededFromOthers = Math.max(0, targetCount - priorityLines.length);
  const selectedOthers = shuffle(otherLines).slice(0, neededFromOthers);
  const selectedLines = [...priorityLines, ...selectedOthers];

  // Build # hints (total + optional H1 gender count)
  const countHints = [];
  for (let i = 0; i < selectedLines.length; i++) {
    const line = selectedLines[i];
    const lineTokens = line.isRow
      ? getTokensInRow(line.idx, tokens)
      : getTokensInCol(line.idx, tokens);
    countHints.push({
      id: `cnt-${line.isRow ? 'r' : 'c'}${line.idx}`,
      type: 'total',
      row: line.isRow ? line.idx : null,
      col: line.isRow ? null : line.idx,
      value: lineTokens.length,
    });
    // H1 (male count) — adds critical information for pair permutation disambiguation
    // Skip when line already has gender-only rule (redundant) or empty
    const hasGenderRule = lineRules.some(r =>
      r.dim === 'gender' && r.isRow === line.isRow && r.idx === line.idx
    );
    if (lineTokens.length > 0 && !hasGenderRule) {
      const males = lineTokens.filter(t => solution[t.id] === 'male').length;
      countHints.push({
        id: `h1-${line.isRow ? 'r' : 'c'}${line.idx}`,
        type: 'H1',
        row: line.isRow ? line.idx : null,
        col: line.isRow ? null : line.idx,
        value: males,
      });
    }
  }

  // Fixed tiles — simple random selection.
  // (We deliberately do NOT prioritize rule lines; rule lines that get fully filled
  // with fixed tiles become "dead" lines with no player deductive work. The Stage D
  // validation in tryOneGeneration rejects such puzzles, retrying with different
  // fixed tiles until a valid layout is found.)
  const fixedCount = randInt(config.fixedTileCount[0], config.fixedTileCount[1]);
  const fixedTokens = shuffle(tokens).slice(0, fixedCount);
  const fixedCells = fixedTokens.map(t => ({
    row: t.row, col: t.col, animalId: t.animalId, gender: solution[t.id],
  }));
  const preMarks = Object.fromEntries(fixedTokens.map(t => [t.id, solution[t.id]]));

  return {
    n: config.n,
    forbiddenCells,
    tokens,
    pairs: placement.pairs,
    lineRules,
    countHints,
    fixedCells,
    preMarks,
  };
}

// ─────────────────────────────────────────────────────────────────────────────
// STAGE D: Timeboxed Solution Enumeration
// ─────────────────────────────────────────────────────────────────────────────
function enumerateSolutions(instance, animals, maxSolutions, timeLimitMs) {
  const startTime = performance.now();
  const n = instance.n;
  const pairs = instance.pairs;
  const tokens = instance.tokens;
  const k = pairs.length;

  const forbidden = new Set(instance.forbiddenCells.map(([r, c]) => `${r},${c}`));
  const rowRules = {}, colRules = {};
  for (const r of instance.lineRules) {
    if (r.isRow) (rowRules[r.idx] = rowRules[r.idx] || []).push(r);
    else (colRules[r.idx] = colRules[r.idx] || []).push(r);
  }
  const fixedByKey = {};
  for (const ft of instance.fixedCells) fixedByKey[`${ft.row},${ft.col}`] = ft;
  const rowHints = {}, colHints = {};
  for (const h of instance.countHints) {
    if (h.row !== null) (rowHints[h.row] = rowHints[h.row] || []).push(h);
    else (colHints[h.col] = colHints[h.col] || []).push(h);
  }

  function cellOk(row, col, animalId, gender) {
    const key = `${row},${col}`;
    if (forbidden.has(key)) return false;
    const ft = fixedByKey[key];
    if (ft) {
      if (ft.animalId !== animalId) return false;
      if (ft.gender !== gender) return false;
    }
    const animal = animalById(animalId);
    const rules = [...(rowRules[row] || []), ...(colRules[col] || [])];
    for (const rule of rules) {
      if (rule.dim === 'gender') {
        if (gender !== rule.val) return false;
      } else {
        if (animal[rule.dim] !== rule.val) return false;
      }
    }
    return true;
  }

  // Per-pair candidates (fixed in advance to speed up)
  const pairSpecies = pairs.map(([t1]) => tokens.find(t => t.id === t1).animalId);

  const pairCandidates = pairs.map((pair, pairIdx) => {
    const animalId = pairSpecies[pairIdx];
    const candidates = [];

    const fixedForSpecies = instance.fixedCells.filter(ft => ft.animalId === animalId);

    if (fixedForSpecies.length === 2) {
      const [a, b] = fixedForSpecies;
      if (isAdjacent(a, b) && a.gender !== b.gender) {
        candidates.push({
          c1key: `${a.row},${a.col}`, c2key: `${b.row},${b.col}`,
          c1row: a.row, c1col: a.col, c2row: b.row, c2col: b.col,
          g1: a.gender, g2: b.gender,
        });
      }
    } else if (fixedForSpecies.length === 1) {
      const ft = fixedForSpecies[0];
      const otherG = ft.gender === 'male' ? 'female' : 'male';
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (dr === 0 && dc === 0) continue;
          const r2 = ft.row + dr, c2 = ft.col + dc;
          if (r2 < 0 || r2 >= n || c2 < 0 || c2 >= n) continue;
          if (!cellOk(r2, c2, animalId, otherG)) continue;
          candidates.push({
            c1key: `${ft.row},${ft.col}`, c2key: `${r2},${c2}`,
            c1row: ft.row, c1col: ft.col, c2row: r2, c2col: c2,
            g1: ft.gender, g2: otherG,
          });
        }
      }
    } else {
      for (let r1 = 0; r1 < n; r1++) {
        for (let c1 = 0; c1 < n; c1++) {
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              if (dr === 0 && dc === 0) continue;
              const r2 = r1 + dr, c2 = c1 + dc;
              if (r2 < 0 || r2 >= n || c2 < 0 || c2 >= n) continue;
              const k1 = `${r1},${c1}`, k2 = `${r2},${c2}`;
              if (k1 >= k2) continue;
              for (const [g1, g2] of [['male', 'female'], ['female', 'male']]) {
                if (!cellOk(r1, c1, animalId, g1)) continue;
                if (!cellOk(r2, c2, animalId, g2)) continue;
                candidates.push({
                  c1key: k1, c2key: k2,
                  c1row: r1, c1col: c1, c2row: r2, c2col: c2,
                  g1, g2,
                });
              }
            }
          }
        }
      }
    }
    return candidates;
  });

  // Early termination if any pair has no candidates
  for (const cc of pairCandidates) {
    if (cc.length === 0) return { solutions: [], timedOut: false };
  }

  // MRV: order pairs by ascending candidate count
  const pairOrder = pairs.map((_, i) => i).sort((a, b) =>
    pairCandidates[a].length - pairCandidates[b].length
  );

  const used = new Set();
  const assignment = {};  // pairIdx -> candidate
  const solutions = [];
  let timedOut = false;

  function computeCounts(asgn) {
    const rowOcc = {}, rowMale = {}, rowFemale = {};
    const colOcc = {}, colMale = {}, colFemale = {};
    for (const pairIdx in asgn) {
      const a = asgn[pairIdx];
      rowOcc[a.c1row] = (rowOcc[a.c1row] || 0) + 1;
      rowOcc[a.c2row] = (rowOcc[a.c2row] || 0) + 1;
      colOcc[a.c1col] = (colOcc[a.c1col] || 0) + 1;
      colOcc[a.c2col] = (colOcc[a.c2col] || 0) + 1;
      const mk1 = a.g1 === 'male' ? rowMale : rowFemale;
      mk1[a.c1row] = (mk1[a.c1row] || 0) + 1;
      const mk2 = a.g2 === 'male' ? rowMale : rowFemale;
      mk2[a.c2row] = (mk2[a.c2row] || 0) + 1;
      const ck1 = a.g1 === 'male' ? colMale : colFemale;
      ck1[a.c1col] = (ck1[a.c1col] || 0) + 1;
      const ck2 = a.g2 === 'male' ? colMale : colFemale;
      ck2[a.c2col] = (ck2[a.c2col] || 0) + 1;
    }
    return { rowOcc, rowMale, rowFemale, colOcc, colMale, colFemale };
  }

  function checkHintsInProgress(asgn) {
    const c = computeCounts(asgn);
    for (const h of instance.countHints) {
      const isRow = h.row !== null;
      const idx = isRow ? h.row : h.col;
      let count;
      if (h.type === 'total') count = isRow ? (c.rowOcc[idx] || 0) : (c.colOcc[idx] || 0);
      else if (h.type === 'H1') count = isRow ? (c.rowMale[idx] || 0) : (c.colMale[idx] || 0);
      else if (h.type === 'H2') count = isRow ? (c.rowFemale[idx] || 0) : (c.colFemale[idx] || 0);
      else count = 0;
      if (count > h.value) return false;
    }
    return true;
  }

  function checkHintsFinal(asgn) {
    const c = computeCounts(asgn);
    for (const h of instance.countHints) {
      const isRow = h.row !== null;
      const idx = isRow ? h.row : h.col;
      let count;
      if (h.type === 'total') count = isRow ? (c.rowOcc[idx] || 0) : (c.colOcc[idx] || 0);
      else if (h.type === 'H1') count = isRow ? (c.rowMale[idx] || 0) : (c.colMale[idx] || 0);
      else if (h.type === 'H2') count = isRow ? (c.rowFemale[idx] || 0) : (c.colFemale[idx] || 0);
      else count = 0;
      if (count !== h.value) return false;
    }
    return true;
  }

  function backtrack(depth) {
    if (timedOut) return;
    if (performance.now() - startTime > timeLimitMs) { timedOut = true; return; }
    if (solutions.length >= maxSolutions + 1) return; // found one more than needed

    if (depth === k) {
      if (checkHintsFinal(assignment)) {
        solutions.push({ ...assignment });
      }
      return;
    }

    const pairIdx = pairOrder[depth];
    const candidates = pairCandidates[pairIdx];

    for (const cand of candidates) {
      if (used.has(cand.c1key) || used.has(cand.c2key)) continue;
      used.add(cand.c1key); used.add(cand.c2key);
      assignment[pairIdx] = cand;

      if (checkHintsInProgress(assignment)) {
        backtrack(depth + 1);
      }

      delete assignment[pairIdx];
      used.delete(cand.c1key); used.delete(cand.c2key);

      if (timedOut || solutions.length > maxSolutions) return;
    }
  }

  backtrack(0);
  return { solutions, timedOut };
}

// ─────────────────────────────────────────────────────────────────────────────
// Try one generation attempt — returns puzzle object or null
// ─────────────────────────────────────────────────────────────────────────────
function tryOneGeneration(levelKey, config, currentMaxSolutions, verifyTimeLimit) {
  // Stage A
  const ruleTemplate = designRuleTemplate(config, ANIMALS);
  if (!ruleTemplate) return null;

  // Forbidden cells
  const forbiddenCount = Array.isArray(config.forbiddenCount)
    ? randInt(config.forbiddenCount[0], config.forbiddenCount[1])
    : config.forbiddenCount;
  const allCells = [];
  for (let r = 0; r < config.n; r++)
    for (let c = 0; c < config.n; c++) allCells.push([r, c]);
  const forbiddenCells = shuffle(allCells).slice(0, forbiddenCount);

  // Stage B
  const placement = constrainedAdjacentPlacement(config, ruleTemplate, forbiddenCells, ANIMALS);
  if (!placement) return null;

  // Validate rule line coverage: every rule line must have ≥1 token
  // This prevents the confusing "#0 + line rule" combination
  for (const rule of ruleTemplate) {
    const tokensInLine = rule.isRow
      ? placement.tokens.filter(t => t.row === rule.idx)
      : placement.tokens.filter(t => t.col === rule.idx);
    if (tokensInLine.length === 0) return null; // retry
  }

  // Gender assignment respecting rules
  const solution = assignGendersWithRules(placement.pairs, placement.tokens, ruleTemplate);
  if (!solution) return null;

  // Stage C
  const instance = addAuxiliaryHints(placement, config, solution, ruleTemplate, forbiddenCells);

  // Validate rule lines have ≥1 NON-FIXED token.
  // A rule line is meaningful for the player only if they have to place at least one
  // tile there to satisfy it. If all tokens on a rule line are fixed tiles, the rule
  // is already satisfied before play begins — the line is effectively "#0" from the
  // player's perspective and the rule has no deductive function.
  const fixedTokenIds = new Set(Object.keys(instance.preMarks || {}));
  for (const rule of ruleTemplate) {
    const tokensInLine = rule.isRow
      ? placement.tokens.filter(t => t.row === rule.idx)
      : placement.tokens.filter(t => t.col === rule.idx);
    const nonFixedInLine = tokensInLine.filter(t => !fixedTokenIds.has(t.id));
    if (nonFixedInLine.length === 0) return null; // retry — no player action required on this line
  }

  // Stage D
  const { solutions, timedOut } = enumerateSolutions(
    instance, ANIMALS, currentMaxSolutions, verifyTimeLimit
  );

  const solutionCount = solutions.length;

  // Timeout with 0 solutions found: canonical is structurally valid but couldn't be
  // verified in time. Accept as flexible — at least canonical solution exists.
  if (solutionCount === 0) {
    if (!timedOut) return null; // genuine infeasibility (should be rare)
    return {
      ...instance,
      solution,
      level: levelKey,
      uniqueness: 'flexible',
      solutionCount: 0, // unknown; canonical is at least one
      timedOut: true,
    };
  }

  // Too many solutions — reject
  if (solutionCount > currentMaxSolutions) return null;

  // Classify uniqueness
  let uniqueness;
  if (timedOut) {
    // Found some solutions but didn't fully enumerate — classify as flexible
    uniqueness = 'flexible';
  } else if (solutionCount === 1) {
    uniqueness = 'strict';
  } else if (solutionCount <= 3) {
    uniqueness = 'loose';
  } else {
    uniqueness = 'flexible';
  }

  return {
    ...instance,
    solution,
    level: levelKey,
    uniqueness,
    solutionCount,
    timedOut,
  };
}

// ─────────────────────────────────────────────────────────────────────────────
// Main Generator — Async with Progressive Relaxation
// ─────────────────────────────────────────────────────────────────────────────
async function generatePuzzleAsync(level, onProgress) {
  const config = DIFFICULTY_CONFIGS[level];
  const startTime = performance.now();
  const BUDGET = config.totalBudgetMs;
  const MAX = config.maxSolutions;

  let attempt = 0;
  let bestResult = null;

  while (attempt < config.maxAttempts) {
    const elapsed = performance.now() - startTime;
    if (elapsed > BUDGET) break;

    // Progressive relaxation: start strict, escalate to full maxSolutions over time
    // Strict (1) attempts get priority in early budget; we relax as time runs out
    const pct = elapsed / BUDGET;
    let currentMaxSol;
    if (pct < 0.15) currentMaxSol = Math.min(1, MAX);
    else if (pct < 0.40) currentMaxSol = Math.min(3, MAX);
    else if (pct < 0.65) currentMaxSol = Math.min(10, MAX);
    else if (pct < 0.85) currentMaxSol = Math.min(20, MAX);
    else currentMaxSol = MAX;

    attempt++;

    if (attempt % 3 === 0) {
      onProgress && onProgress({
        attempts: attempt,
        elapsed,
        budget: BUDGET,
        currentMaxSolutions: currentMaxSol,
        level,
      });
      await new Promise(r => setTimeout(r, 0));
    }

    let result;
    try {
      result = tryOneGeneration(level, config, currentMaxSol, config.verifyTimeLimitMs);
    } catch (e) {
      console.error('Generation error:', e);
      continue;
    }

    if (!result) continue;

    // Strict (exactly 1 solution) — exit immediately, best possible
    if (result.solutionCount === 1 && !result.timedOut) {
      result.generationTime = performance.now() - startTime;
      result.attemptCount = attempt;
      return result;
    }

    // Compare results for bestResult (prefer lower solutionCount, but >0 beats 0)
    const betterThanBest = (() => {
      if (!bestResult) return true;
      // A non-zero count is better than 0 (which is "unknown/canonical only")
      if (result.solutionCount > 0 && bestResult.solutionCount === 0) return true;
      if (result.solutionCount === 0 && bestResult.solutionCount > 0) return false;
      // Both non-zero or both zero: prefer lower count
      return result.solutionCount < bestResult.solutionCount;
    })();
    if (betterThanBest) bestResult = result;

    // Early exit: if we have a Loose result (≤3) after 25% budget, accept
    if (bestResult && bestResult.solutionCount > 0 && bestResult.solutionCount <= 3 && elapsed > BUDGET * 0.25) {
      break;
    }
    // Early exit: if we have a Flexible result (≤10) after 50% budget, accept
    if (bestResult && bestResult.solutionCount > 0 && bestResult.solutionCount <= 10 && elapsed > BUDGET * 0.5) {
      break;
    }
    // Early exit: canonical-only (timedOut, solutionCount=0) is valid — accept after 50% budget
    if (bestResult && bestResult.solutionCount === 0 && elapsed > BUDGET * 0.5) {
      break;
    }
    // Early exit: if we have any valid result after 75% budget, accept
    if (bestResult && elapsed > BUDGET * 0.75) {
      break;
    }
  }

  if (bestResult) {
    bestResult.generationTime = performance.now() - startTime;
    bestResult.attemptCount = attempt;
    return bestResult;
  }

  // Last resort: fallback
  return loadFallback(level);
}

// =============================================================================
// SECTION 3.5 — TRACE SOLVER (Human-style Inference Simulator)
// =============================================================================
// Simulates how a human solver would deduce the puzzle step-by-step.
// Each step records what pattern was applied, its cognitive cost, and how
// it changed the domain. The full trace becomes input to the difficulty
// metric (3.6) and to the constraint-driven generator (3.7) for evaluation.
//
// Domain representation — two-tier:
//   PairDomain { positions: Set, genderMode: 'unknown'|'g1g2'|'g2g1' }
//   This separates "where" the pair sits from "which gender is c1/c2"
//   so partial decisions (position fixed, gender open) are first-class.
// =============================================================================

// ─────────────────────────────────────────────────────────────────────────────
// State initialization — build the search state from a puzzle instance
// ─────────────────────────────────────────────────────────────────────────────
function ts_initializeState(puzzle) {
  const n = puzzle.n;
  const tokens = puzzle.tokens;
  const pairs = puzzle.pairs;
  const forbidden = new Set(puzzle.forbiddenCells.map(([r, c]) => `${r},${c}`));
  const fixedByCell = {};
  for (const ft of (puzzle.fixedCells || [])) fixedByCell[`${ft.row},${ft.col}`] = ft;
  const rowRules = {}, colRules = {};
  for (const r of (puzzle.lineRules || [])) {
    if (r.isRow) (rowRules[r.idx] = rowRules[r.idx] || []).push(r);
    else (colRules[r.idx] = colRules[r.idx] || []).push(r);
  }
  const rowHints = {}, colHints = {};
  for (const h of (puzzle.countHints || [])) {
    if (h.row !== null) (rowHints[h.row] = rowHints[h.row] || []).push(h);
    else (colHints[h.col] = colHints[h.col] || []).push(h);
  }

  // Per-pair species
  const pairSpecies = pairs.map(([t1]) => tokens.find(t => t.id === t1).animalId);

  // Build initial domains for each pair
  function cellOk(row, col, animalId, gender) {
    const key = `${row},${col}`;
    if (forbidden.has(key)) return false;
    const ft = fixedByCell[key];
    if (ft) {
      if (ft.animalId !== animalId) return false;
      if (ft.gender !== gender) return false;
    }
    const animal = animalById(animalId);
    const rules = [...(rowRules[row] || []), ...(colRules[col] || [])];
    for (const rule of rules) {
      if (rule.dim === 'gender') {
        if (gender !== rule.val) return false;
      } else {
        if (animal[rule.dim] !== rule.val) return false;
      }
    }
    return true;
  }

  const domains = pairs.map((pair, pairIdx) => {
    const animalId = pairSpecies[pairIdx];
    const positions = []; // [{c1, c2, allowedGenders: 'g1g2'|'g2g1'|'both'}]
    const fixedForSpecies = (puzzle.fixedCells || []).filter(ft => ft.animalId === animalId);

    if (fixedForSpecies.length === 2) {
      const [a, b] = fixedForSpecies;
      if (isAdjacent(a, b) && a.gender !== b.gender) {
        // Fully pinned
        const g1g2 = (a.gender === 'male') ? 'g1g2' : 'g2g1';
        positions.push({ c1: { row: a.row, col: a.col }, c2: { row: b.row, col: b.col }, gender: g1g2 });
      }
    } else if (fixedForSpecies.length === 1) {
      const ft = fixedForSpecies[0];
      const otherG = ft.gender === 'male' ? 'female' : 'male';
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (dr === 0 && dc === 0) continue;
          const r2 = ft.row + dr, c2 = ft.col + dc;
          if (r2 < 0 || r2 >= n || c2 < 0 || c2 >= n) continue;
          if (!cellOk(r2, c2, animalId, otherG)) continue;
          const gender = (ft.gender === 'male') ? 'g1g2' : 'g2g1';
          positions.push({
            c1: { row: ft.row, col: ft.col }, c2: { row: r2, col: c2 }, gender,
          });
        }
      }
    } else {
      for (let r1 = 0; r1 < n; r1++) {
        for (let c1 = 0; c1 < n; c1++) {
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              if (dr === 0 && dc === 0) continue;
              const r2 = r1 + dr, c2 = c1 + dc;
              if (r2 < 0 || r2 >= n || c2 < 0 || c2 >= n) continue;
              const k1 = `${r1},${c1}`, k2 = `${r2},${c2}`;
              if (k1 >= k2) continue;
              const okMF = cellOk(r1, c1, animalId, 'male') && cellOk(r2, c2, animalId, 'female');
              const okFM = cellOk(r1, c1, animalId, 'female') && cellOk(r2, c2, animalId, 'male');
              if (okMF && okFM) {
                positions.push({ c1: { row: r1, col: c1 }, c2: { row: r2, col: c2 }, gender: 'both' });
              } else if (okMF) {
                positions.push({ c1: { row: r1, col: c1 }, c2: { row: r2, col: c2 }, gender: 'g1g2' });
              } else if (okFM) {
                positions.push({ c1: { row: r1, col: c1 }, c2: { row: r2, col: c2 }, gender: 'g2g1' });
              }
            }
          }
        }
      }
    }

    return { positions, decided: false };
  });

  // Pre-decide pairs that have fully fixed cells
  const decisions = {};
  const usedCells = new Set();
  for (let i = 0; i < pairs.length; i++) {
    if (domains[i].positions.length === 1 && domains[i].positions[0].gender !== 'both') {
      const p = domains[i].positions[0];
      const g1 = p.gender === 'g1g2' ? 'male' : 'female';
      const g2 = p.gender === 'g1g2' ? 'female' : 'male';
      decisions[i] = { c1: p.c1, c2: p.c2, g1, g2, animalId: pairSpecies[i] };
      domains[i].decided = true;
      usedCells.add(`${p.c1.row},${p.c1.col}`);
      usedCells.add(`${p.c2.row},${p.c2.col}`);
    }
  }

  return {
    n, pairs, tokens, pairSpecies,
    forbidden, fixedByCell, rowRules, colRules, rowHints, colHints,
    domains, decisions, usedCells,
    activePairs: pairs.map((_, i) => i).filter(i => !domains[i].decided),
  };
}

// ─────────────────────────────────────────────────────────────────────────────
// State helpers
// ─────────────────────────────────────────────────────────────────────────────
function ts_isSolved(state) {
  return state.activePairs.length === 0;
}

function ts_cloneState(state) {
  return {
    ...state,
    domains: state.domains.map(d => ({
      decided: d.decided,
      positions: d.positions.map(p => ({ c1: p.c1, c2: p.c2, gender: p.gender })),
    })),
    decisions: { ...state.decisions },
    usedCells: new Set(state.usedCells),
    activePairs: [...state.activePairs],
  };
}

function ts_pruneByUsedCells(state) {
  // Remove positions whose cells are already taken
  let changed = false;
  for (const pairIdx of state.activePairs) {
    const dom = state.domains[pairIdx];
    const before = dom.positions.length;
    dom.positions = dom.positions.filter(p =>
      !state.usedCells.has(`${p.c1.row},${p.c1.col}`) &&
      !state.usedCells.has(`${p.c2.row},${p.c2.col}`)
    );
    if (dom.positions.length !== before) changed = true;
  }
  return changed;
}

function ts_decidePair(state, pairIdx, position, genderChoice) {
  // genderChoice: 'g1g2' or 'g2g1' (must be compatible with position.gender)
  const g1 = genderChoice === 'g1g2' ? 'male' : 'female';
  const g2 = genderChoice === 'g1g2' ? 'female' : 'male';
  state.decisions[pairIdx] = {
    c1: position.c1, c2: position.c2, g1, g2,
    animalId: state.pairSpecies[pairIdx],
  };
  state.domains[pairIdx].decided = true;
  state.domains[pairIdx].positions = [{ c1: position.c1, c2: position.c2, gender: genderChoice }];
  state.usedCells.add(`${position.c1.row},${position.c1.col}`);
  state.usedCells.add(`${position.c2.row},${position.c2.col}`);
  state.activePairs = state.activePairs.filter(i => i !== pairIdx);
}

function ts_lineCounts(state) {
  // Count tokens by line based on current decisions
  const rowOcc = {}, colOcc = {}, rowMale = {}, rowFemale = {}, colMale = {}, colFemale = {};
  for (const pairIdx in state.decisions) {
    const d = state.decisions[pairIdx];
    rowOcc[d.c1.row] = (rowOcc[d.c1.row] || 0) + 1;
    rowOcc[d.c2.row] = (rowOcc[d.c2.row] || 0) + 1;
    colOcc[d.c1.col] = (colOcc[d.c1.col] || 0) + 1;
    colOcc[d.c2.col] = (colOcc[d.c2.col] || 0) + 1;
    (d.g1 === 'male' ? rowMale : rowFemale)[d.c1.row] = ((d.g1 === 'male' ? rowMale : rowFemale)[d.c1.row] || 0) + 1;
    (d.g2 === 'male' ? rowMale : rowFemale)[d.c2.row] = ((d.g2 === 'male' ? rowMale : rowFemale)[d.c2.row] || 0) + 1;
    (d.g1 === 'male' ? colMale : colFemale)[d.c1.col] = ((d.g1 === 'male' ? colMale : colFemale)[d.c1.col] || 0) + 1;
    (d.g2 === 'male' ? colMale : colFemale)[d.c2.col] = ((d.g2 === 'male' ? colMale : colFemale)[d.c2.col] || 0) + 1;
  }
  return { rowOcc, colOcc, rowMale, rowFemale, colMale, colFemale };
}

function ts_lineMaxOccupancy(state, isRow, idx) {
  // Maximum tokens that COULD still be in this line (current + sum of pair contributions)
  let max = 0;
  for (const pairIdx in state.decisions) {
    const d = state.decisions[pairIdx];
    if (isRow) {
      if (d.c1.row === idx) max++;
      if (d.c2.row === idx) max++;
    } else {
      if (d.c1.col === idx) max++;
      if (d.c2.col === idx) max++;
    }
  }
  for (const pairIdx of state.activePairs) {
    // contribution of pair's BEST candidate that touches this line
    let best = 0;
    for (const p of state.domains[pairIdx].positions) {
      let cnt = 0;
      if (isRow) {
        if (p.c1.row === idx) cnt++;
        if (p.c2.row === idx) cnt++;
      } else {
        if (p.c1.col === idx) cnt++;
        if (p.c2.col === idx) cnt++;
      }
      if (cnt > best) best = cnt;
    }
    max += best;
  }
  return max;
}

// ─────────────────────────────────────────────────────────────────────────────
// V5 — GAME-SPECIFIC AXIOM HELPERS
// ─────────────────────────────────────────────────────────────────────────────
// These helpers expose the 4-fold axiom structure of Zoologic to the v5
// inference patterns. They are deterministic functions of the puzzle state
// and the global ANIMALS catalog, so the patterns themselves can stay
// declarative.

// Map: habitat → diet → number of species
// Derived once from ANIMALS at load time.
const HABITAT_DIET_MAP = (() => {
  const map = {};
  for (const a of ANIMALS) {
    if (!map[a.habitat]) map[a.habitat] = { '육식': 0, '초식': 0, total: 0, species: [] };
    map[a.habitat][a.diet]++;
    map[a.habitat].total++;
    map[a.habitat].species.push(a.id);
  }
  return map;
})();

// Returns species IDs eligible for a line given the line's rules.
// Eligible = species whose attributes match every rule on this line.
function ts_eligibleSpeciesForLine(state, isRow, idx) {
  const rules = isRow ? (state.rowRules[idx] || []) : (state.colRules[idx] || []);
  const eligible = [];
  for (const a of ANIMALS) {
    let ok = true;
    for (const rule of rules) {
      if (rule.dim === 'gender') continue; // gender is per-token, not per-species
      if (a[rule.dim] !== rule.val) { ok = false; break; }
    }
    if (ok) eligible.push(a.id);
  }
  return eligible;
}

// Compute how many cells of a position fall on a given line.
// Returns 0, 1, or 2.
function ts_positionLineCount(pos, isRow, idx) {
  let cnt = 0;
  if (isRow) {
    if (pos.c1.row === idx) cnt++;
    if (pos.c2.row === idx) cnt++;
  } else {
    if (pos.c1.col === idx) cnt++;
    if (pos.c2.col === idx) cnt++;
  }
  return cnt;
}

// Returns the Total hint value for a line, or null if no Total hint exists.
function ts_lineTotalHint(state, isRow, idx) {
  const hints = isRow ? (state.rowHints[idx] || []) : (state.colHints[idx] || []);
  for (const h of hints) {
    if (h.type === 'total') return h.value;
  }
  return null;
}

// Returns true if any rule on this line constrains habitat or diet.
function ts_lineHasAttributeRule(state, isRow, idx) {
  const rules = isRow ? (state.rowRules[idx] || []) : (state.colRules[idx] || []);
  return rules.some(r => r.dim === 'habitat' || r.dim === 'diet');
}

// Iterate every line (row + col), call fn(isRow, idx).
function ts_forEachLine(state, fn) {
  for (let r = 0; r < state.n; r++) fn(true, r);
  for (let c = 0; c < state.n; c++) fn(false, c);
}

// ─────────────────────────────────────────────────────────────────────────────
// LEVEL 0 PATTERNS — direct forcing (cost 1)
// ─────────────────────────────────────────────────────────────────────────────

// Pattern 0a: Naked Single — domain reduced to 1 position with determined gender
function ts_tryNakedSingle(state) {
  for (const pairIdx of state.activePairs) {
    const dom = state.domains[pairIdx];
    if (dom.positions.length !== 1) continue;
    const pos = dom.positions[0];
    if (pos.gender === 'both') continue; // gender still ambiguous
    return {
      type: 'naked-single', cost: 1, pairIdx,
      premises: [`pair-${pairIdx}-domain-singleton`],
      conclusion: { kind: 'pair-decided', position: pos, gender: pos.gender },
      domainBefore: 1, domainAfter: 1,
      branchingFactor: 1,
      apply(s) { ts_decidePair(s, pairIdx, pos, pos.gender); ts_pruneByUsedCells(s); }
    };
  }
  return null;
}

// Pattern 0c: Position-Locked Gender — single position, both genders open,
// but a gender rule on involved line forces one.
function ts_tryPositionLockedGender(state) {
  for (const pairIdx of state.activePairs) {
    const dom = state.domains[pairIdx];
    if (dom.positions.length !== 1) continue;
    const pos = dom.positions[0];
    if (pos.gender !== 'both') continue;

    // Check gender rules on c1/c2 lines
    const rulesC1 = [...(state.rowRules[pos.c1.row] || []), ...(state.colRules[pos.c1.col] || [])];
    const rulesC2 = [...(state.rowRules[pos.c2.row] || []), ...(state.colRules[pos.c2.col] || [])];
    let g1Forced = null, g2Forced = null;
    for (const r of rulesC1) if (r.dim === 'gender') g1Forced = r.val;
    for (const r of rulesC2) if (r.dim === 'gender') g2Forced = r.val;
    if (g1Forced && g2Forced && g1Forced === g2Forced) return null; // inconsistent
    let chosen = null;
    if (g1Forced === 'male' || g2Forced === 'female') chosen = 'g1g2';
    else if (g1Forced === 'female' || g2Forced === 'male') chosen = 'g2g1';
    if (!chosen) continue;
    return {
      type: 'position-locked-gender', cost: 2, pairIdx,
      premises: ['line-gender-rule'],
      conclusion: { kind: 'gender-decided', position: pos, gender: chosen },
      domainBefore: 1, domainAfter: 1,
      branchingFactor: 1,
      apply(s) { ts_decidePair(s, pairIdx, pos, chosen); ts_pruneByUsedCells(s); }
    };
  }
  return null;
}

// ─────────────────────────────────────────────────────────────────────────────
// LEVEL 1 PATTERNS — counting forcing (cost 2)
// ─────────────────────────────────────────────────────────────────────────────

// Pattern 1a: Total Count Saturation
// If a line's total hint = current decided tokens, no more pairs can use this line.
function ts_tryTotalSaturation(state) {
  const counts = ts_lineCounts(state);
  for (const idx in state.rowHints) {
    for (const h of state.rowHints[idx]) {
      if (h.type !== 'total') continue;
      const cur = counts.rowOcc[idx] || 0;
      if (cur < h.value) continue;
      // Saturated — prune all candidates that would add to this row
      const r = parseInt(idx);
      for (const pairIdx of state.activePairs) {
        const dom = state.domains[pairIdx];
        const before = dom.positions.length;
        const survivors = dom.positions.filter(p => p.c1.row !== r && p.c2.row !== r);
        if (survivors.length !== before) {
          if (survivors.length === 0) continue; // contradiction handled later
          return {
            type: 'total-saturation', cost: 2, pairIdx,
            premises: [`row-${r}-total-saturated`],
            conclusion: { kind: 'domain-pruned', from: before, to: survivors.length },
            domainBefore: before, domainAfter: survivors.length,
            branchingFactor: 1,
            apply(s) { s.domains[pairIdx].positions = survivors; }
          };
        }
      }
    }
  }
  for (const idx in state.colHints) {
    for (const h of state.colHints[idx]) {
      if (h.type !== 'total') continue;
      const cur = counts.colOcc[idx] || 0;
      if (cur < h.value) continue;
      const c = parseInt(idx);
      for (const pairIdx of state.activePairs) {
        const dom = state.domains[pairIdx];
        const before = dom.positions.length;
        const survivors = dom.positions.filter(p => p.c1.col !== c && p.c2.col !== c);
        if (survivors.length !== before) {
          if (survivors.length === 0) continue;
          return {
            type: 'total-saturation', cost: 2, pairIdx,
            premises: [`col-${c}-total-saturated`],
            conclusion: { kind: 'domain-pruned', from: before, to: survivors.length },
            domainBefore: before, domainAfter: survivors.length,
            branchingFactor: 1,
            apply(s) { s.domains[pairIdx].positions = survivors; }
          };
        }
      }
    }
  }
  return null;
}

// Pattern 1b: Total Count Forcing
// If line's #hint - current = number of pair-options that touch this line,
// every option that doesn't touch must be eliminated.
function ts_tryTotalForcing(state) {
  const counts = ts_lineCounts(state);
  // For each total hint, find pairs where ALL surviving options touch this line.
  // If the count mandate forces exactly remaining-per-pair contributions, we lock.
  // Simpler version: if a pair has ALL options going through line X, count that
  // pair as a forced contributor.
  for (const idx in state.rowHints) {
    for (const h of state.rowHints[idx]) {
      if (h.type !== 'total') continue;
      const r = parseInt(idx);
      const cur = counts.rowOcc[r] || 0;
      const need = h.value - cur;
      if (need <= 0) continue;
      // For each active pair, count its contributions options
      const contribs = []; // [{pairIdx, mandatoryContrib, maxContrib}]
      for (const pairIdx of state.activePairs) {
        const dom = state.domains[pairIdx];
        const contribsForPair = dom.positions.map(p =>
          (p.c1.row === r ? 1 : 0) + (p.c2.row === r ? 1 : 0)
        );
        const minC = Math.min(...contribsForPair);
        const maxC = Math.max(...contribsForPair);
        contribs.push({ pairIdx, minC, maxC, posCount: dom.positions.length });
      }
      const sumMin = contribs.reduce((s, x) => s + x.minC, 0);
      const sumMax = contribs.reduce((s, x) => s + x.maxC, 0);
      // If max == need, pairs with options of differing contributions get pruned
      // to only options that match max contribution.
      if (sumMax === need) {
        for (const c of contribs) {
          if (c.minC === c.maxC) continue;
          const dom = state.domains[c.pairIdx];
          const before = dom.positions.length;
          const survivors = dom.positions.filter(p =>
            ((p.c1.row === r ? 1 : 0) + (p.c2.row === r ? 1 : 0)) === c.maxC
          );
          if (survivors.length !== before && survivors.length > 0) {
            return {
              type: 'total-forcing', cost: 2, pairIdx: c.pairIdx,
              premises: [`row-${r}-total-forcing`],
              conclusion: { kind: 'domain-pruned', from: before, to: survivors.length },
              domainBefore: before, domainAfter: survivors.length,
              branchingFactor: 1,
              apply(s) { s.domains[c.pairIdx].positions = survivors; }
            };
          }
        }
      }
      // Conversely, if sumMin > need, contradiction (handled by impossibility).
      // If sumMax < need, also contradiction.
    }
  }
  // Same for cols
  for (const idx in state.colHints) {
    for (const h of state.colHints[idx]) {
      if (h.type !== 'total') continue;
      const c = parseInt(idx);
      const cur = counts.colOcc[c] || 0;
      const need = h.value - cur;
      if (need <= 0) continue;
      const contribs = [];
      for (const pairIdx of state.activePairs) {
        const dom = state.domains[pairIdx];
        const contribsForPair = dom.positions.map(p =>
          (p.c1.col === c ? 1 : 0) + (p.c2.col === c ? 1 : 0)
        );
        contribs.push({ pairIdx, minC: Math.min(...contribsForPair), maxC: Math.max(...contribsForPair) });
      }
      const sumMax = contribs.reduce((s, x) => s + x.maxC, 0);
      if (sumMax === need) {
        for (const co of contribs) {
          if (co.minC === co.maxC) continue;
          const dom = state.domains[co.pairIdx];
          const before = dom.positions.length;
          const survivors = dom.positions.filter(p =>
            ((p.c1.col === c ? 1 : 0) + (p.c2.col === c ? 1 : 0)) === co.maxC
          );
          if (survivors.length !== before && survivors.length > 0) {
            return {
              type: 'total-forcing', cost: 2, pairIdx: co.pairIdx,
              premises: [`col-${c}-total-forcing`],
              conclusion: { kind: 'domain-pruned', from: before, to: survivors.length },
              domainBefore: before, domainAfter: survivors.length,
              branchingFactor: 1,
              apply(s) { s.domains[co.pairIdx].positions = survivors; }
            };
          }
        }
      }
    }
  }
  return null;
}

// Pattern 1c: Gender Count Forcing
// H1 hint says line should have N males. If current males = N, all 'both' options
// in that line get forced to female. Symmetric for females.
function ts_tryGenderCountForcing(state) {
  const counts = ts_lineCounts(state);
  function applyHintLine(hints, isRow) {
    for (const idx in hints) {
      for (const h of hints[idx]) {
        if (h.type !== 'H1' && h.type !== 'H2') continue;
        const lineIdx = parseInt(idx);
        const isMaleHint = h.type === 'H1';
        const cur = isRow
          ? (isMaleHint ? counts.rowMale : counts.rowFemale)[lineIdx] || 0
          : (isMaleHint ? counts.colMale : counts.colFemale)[lineIdx] || 0;
        const need = h.value - cur;
        if (need < 0) return null; // already exceeded — let impossibility detect

        // For active pairs: how many of their position options can still place
        // a token of (isMaleHint ? male : female) in this line?
        for (const pairIdx of state.activePairs) {
          const dom = state.domains[pairIdx];
          if (dom.positions.length !== 1) continue;
          const pos = dom.positions[0];
          if (pos.gender !== 'both') continue;
          // Position fixed but gender open. Check which gender lands in this line.
          const c1InLine = isRow ? pos.c1.row === lineIdx : pos.c1.col === lineIdx;
          const c2InLine = isRow ? pos.c2.row === lineIdx : pos.c2.col === lineIdx;
          if (!c1InLine && !c2InLine) continue;
          // If only c1 is in this line, gender of c1 dictates contribution
          if (c1InLine && !c2InLine) {
            // c1 must be (isMaleHint ? male : female) to contribute, or NOT to skip
            // Saturated case: cur == h.value → c1 can't be male (if H1)
            if (cur >= h.value) {
              const chosen = isMaleHint ? 'g2g1' : 'g1g2';
              return {
                type: 'gender-count-forcing', cost: 2, pairIdx,
                premises: [`${isRow?'row':'col'}-${lineIdx}-${h.type}-saturated`],
                conclusion: { kind: 'gender-decided', position: pos, gender: chosen },
                domainBefore: 1, domainAfter: 1,
                branchingFactor: 1,
                apply(s) { ts_decidePair(s, pairIdx, pos, chosen); ts_pruneByUsedCells(s); }
              };
            }
          }
          if (c2InLine && !c1InLine) {
            if (cur >= h.value) {
              const chosen = isMaleHint ? 'g1g2' : 'g2g1';
              return {
                type: 'gender-count-forcing', cost: 2, pairIdx,
                premises: [`${isRow?'row':'col'}-${lineIdx}-${h.type}-saturated`],
                conclusion: { kind: 'gender-decided', position: pos, gender: chosen },
                domainBefore: 1, domainAfter: 1,
                branchingFactor: 1,
                apply(s) { ts_decidePair(s, pairIdx, pos, chosen); ts_pruneByUsedCells(s); }
              };
            }
          }
        }
      }
    }
    return null;
  }
  return applyHintLine(state.rowHints, true) || applyHintLine(state.colHints, false);
}

// Pattern 1d: Structural Impossibility — detect impossibility and prune
// A pair's option that would force a count beyond the hint is invalid.
function ts_tryImpossibilityDetection(state) {
  const counts = ts_lineCounts(state);
  for (const pairIdx of state.activePairs) {
    const dom = state.domains[pairIdx];
    if (dom.positions.length <= 1) continue;
    const before = dom.positions.length;
    const survivors = dom.positions.filter(p => {
      // Check if adding this position would violate any total/H1/H2 hint
      // CRITICAL: H1 checks must use male count (curMale), H2 checks must use
      // female count (curFemale), NOT the total occupancy. Earlier versions
      // incorrectly used curOcc for all hint types — this falsely pruned
      // candidates whose male contribution was actually 0 or 1 but whose
      // total cell count was high.
      function checkLine(hints, lineIdx, isRow, curOcc, curMale, curFemale) {
        for (const h of (hints[lineIdx] || [])) {
          let delta = 0;
          if (isRow) {
            if (p.c1.row === lineIdx) delta++;
            if (p.c2.row === lineIdx) delta++;
          } else {
            if (p.c1.col === lineIdx) delta++;
            if (p.c2.col === lineIdx) delta++;
          }
          if (h.type === 'total') {
            if ((curOcc || 0) + delta > h.value) return false;
          }
          if (h.type === 'H1') {
            // pair = exactly 1♂ + 1♀
            // delta === 2: both cells on line → exactly +1 male regardless of gender mode
            // delta === 1: 'both' gender → male contribution 0 or 1; conservative skip
            //              g1g2/g2g1: known contribution
            if (delta === 2) {
              if ((curMale || 0) + 1 > h.value) return false;
            } else if (delta === 1) {
              if (p.gender === 'g1g2') {
                const c1OnLine = isRow ? p.c1.row === lineIdx : p.c1.col === lineIdx;
                const m = c1OnLine ? 1 : 0;
                if ((curMale || 0) + m > h.value) return false;
              } else if (p.gender === 'g2g1') {
                const c2OnLine = isRow ? p.c2.row === lineIdx : p.c2.col === lineIdx;
                const m = c2OnLine ? 1 : 0;
                if ((curMale || 0) + m > h.value) return false;
              }
              // gender 'both' delta=1: skip conservatively (could be 0 or 1)
            }
          }
          if (h.type === 'H2') {
            if (delta === 2) {
              if ((curFemale || 0) + 1 > h.value) return false;
            } else if (delta === 1) {
              if (p.gender === 'g1g2') {
                const c2OnLine = isRow ? p.c2.row === lineIdx : p.c2.col === lineIdx;
                const f = c2OnLine ? 1 : 0;
                if ((curFemale || 0) + f > h.value) return false;
              } else if (p.gender === 'g2g1') {
                const c1OnLine = isRow ? p.c1.row === lineIdx : p.c1.col === lineIdx;
                const f = c1OnLine ? 1 : 0;
                if ((curFemale || 0) + f > h.value) return false;
              }
            }
          }
        }
        return true;
      }
      if (!checkLine(state.rowHints, p.c1.row, true,
                     counts.rowOcc[p.c1.row], counts.rowMale[p.c1.row], counts.rowFemale[p.c1.row])) return false;
      if (p.c2.row !== p.c1.row && !checkLine(state.rowHints, p.c2.row, true,
                     counts.rowOcc[p.c2.row], counts.rowMale[p.c2.row], counts.rowFemale[p.c2.row])) return false;
      if (!checkLine(state.colHints, p.c1.col, false,
                     counts.colOcc[p.c1.col], counts.colMale[p.c1.col], counts.colFemale[p.c1.col])) return false;
      if (p.c2.col !== p.c1.col && !checkLine(state.colHints, p.c2.col, false,
                     counts.colOcc[p.c2.col], counts.colMale[p.c2.col], counts.colFemale[p.c2.col])) return false;
      return true;
    });
    if (survivors.length !== before && survivors.length > 0) {
      return {
        type: 'impossibility-detection', cost: 2, pairIdx,
        premises: ['count-hint-bound'],
        conclusion: { kind: 'domain-pruned', from: before, to: survivors.length },
        domainBefore: before, domainAfter: survivors.length,
        branchingFactor: 1,
        apply(s) { s.domains[pairIdx].positions = survivors; }
      };
    }
  }
  return null;
}

// ─────────────────────────────────────────────────────────────────────────────
// LEVEL 2 PATTERNS — cross-constraint inference (cost 3)
// ─────────────────────────────────────────────────────────────────────────────

// Pattern 2a: Naked Pair — two pairs share exactly the same 2 position options
function ts_tryNakedPair(state) {
  const ap = state.activePairs;
  for (let i = 0; i < ap.length; i++) {
    for (let j = i + 1; j < ap.length; j++) {
      const a = ap[i], b = ap[j];
      const da = state.domains[a], db = state.domains[b];
      if (da.positions.length !== 2 || db.positions.length !== 2) continue;
      const cellsA = new Set(da.positions.flatMap(p => [`${p.c1.row},${p.c1.col}`, `${p.c2.row},${p.c2.col}`]));
      const cellsB = new Set(db.positions.flatMap(p => [`${p.c1.row},${p.c1.col}`, `${p.c2.row},${p.c2.col}`]));
      // Must share exactly the same cell set
      if (cellsA.size !== cellsB.size) continue;
      let same = true;
      for (const c of cellsA) if (!cellsB.has(c)) { same = false; break; }
      if (!same) continue;
      // Other pairs cannot use these cells
      const sharedCells = [...cellsA];
      for (const k of ap) {
        if (k === a || k === b) continue;
        const dom = state.domains[k];
        const before = dom.positions.length;
        const survivors = dom.positions.filter(p =>
          !sharedCells.includes(`${p.c1.row},${p.c1.col}`) &&
          !sharedCells.includes(`${p.c2.row},${p.c2.col}`)
        );
        if (survivors.length !== before && survivors.length > 0) {
          return {
            type: 'naked-pair', cost: 3, pairIdx: k,
            premises: [`naked-pair-${a}-${b}`],
            conclusion: { kind: 'domain-pruned', from: before, to: survivors.length },
            domainBefore: before, domainAfter: survivors.length,
            branchingFactor: 2,
            apply(s) { s.domains[k].positions = survivors; }
          };
        }
      }
    }
  }
  return null;
}

// Pattern 2b: Hidden Single — a species has only ONE way to land on a line
// where it's required (usually by counting).
function ts_tryHiddenSingle(state) {
  // Skip — in this game pair species are pre-assigned, so this pattern collapses
  // into Naked Single in practice. Reserved for future expansion.
  return null;
}


// ─────────────────────────────────────────────────────────────────────────────
// V5 PATTERN α — Habitat Combinatorial Forcing (cost 3)
// ─────────────────────────────────────────────────────────────────────────────
// Uses A3 (Habitat) + A4 (Diet) + A5 (LineRule) to detect when a line's
// attribute rule combined with the asymmetric species distribution
// excludes specific pairs from that line. For example: a line with
// habitat='극지' rule must contain only 극지 species (북극곰/펭귄/바다표범).
// Pairs of other species cannot place tokens on this line.
//
// A second mode also fires when the eligible species count for a line is
// LESS than required by the Total hint — e.g. line has habitat='사바나' rule
// + Total=4, but 사바나 has only 3 species → the puzzle must include all 3
// 사바나 pairs AND at least one of them must extend across line boundary.
// In that case we eliminate non-eligible pairs from this line.
function ts_tryHabitatCombinatorial(state) {
  for (let isRow = 0; isRow <= 1; isRow++) {
    for (let idx = 0; idx < state.n; idx++) {
      if (!ts_lineHasAttributeRule(state, !!isRow, idx)) continue;

      const eligibleSpeciesIds = ts_eligibleSpeciesForLine(state, !!isRow, idx);
      // Find pairs whose species is NOT eligible for this line
      for (const pairIdx of state.activePairs) {
        const species = state.pairSpecies[pairIdx];
        if (eligibleSpeciesIds.includes(species)) continue;

        const dom = state.domains[pairIdx];
        const before = dom.positions.length;
        // Eliminate positions that touch this line
        const survivors = dom.positions.filter(p =>
          ts_positionLineCount(p, !!isRow, idx) === 0
        );
        if (survivors.length < before && survivors.length > 0) {
          const ruleDesc = (state[isRow ? 'rowRules' : 'colRules'][idx] || [])
            .filter(r => r.dim !== 'gender')
            .map(r => `${r.dim}=${r.val}`)
            .join(',');
          return {
            type: 'habitat-combinatorial', cost: 3, pairIdx,
            premises: [`${isRow ? 'row' : 'col'}-${idx}-${ruleDesc}-excludes-species-${species}`],
            conclusion: { kind: 'domain-pruned', from: before, to: survivors.length },
            domainBefore: before, domainAfter: survivors.length,
            branchingFactor: 2,
            apply(s) { s.domains[pairIdx].positions = survivors; }
          };
        }
      }
    }
  }
  return null;
}

// ─────────────────────────────────────────────────────────────────────────────
// V5 PATTERN β — Pair Adjacency Propagation (cost 3.5)
// ─────────────────────────────────────────────────────────────────────────────
// Uses A1+A2 (Pair Adjacency) directly. When ALL of a pair's surviving
// candidate positions share the SAME cell (either as c1 or c2), that cell
// is guaranteed to be used by this pair. Other pairs cannot have any
// candidate using that cell.
//
// This is the deepest exploitation of the pair-adjacency axiom — game-specific.
function ts_tryPairAdjacencyPropagation(state) {
  for (const pairIdx of state.activePairs) {
    const dom = state.domains[pairIdx];
    if (dom.positions.length < 2) continue; // Naked Single handles size 1
    if (dom.positions.length > 8) continue; // bound search

    // Count: for each cell, how many of this pair's positions use it (as c1 or c2)
    const cellUsage = {};
    for (const pos of dom.positions) {
      const k1 = `${pos.c1.row},${pos.c1.col}`, k2 = `${pos.c2.row},${pos.c2.col}`;
      cellUsage[k1] = (cellUsage[k1] || 0) + 1;
      cellUsage[k2] = (cellUsage[k2] || 0) + 1;
    }

    const guaranteedCells = [];
    for (const [cellKey, count] of Object.entries(cellUsage)) {
      if (count === dom.positions.length) {
        guaranteedCells.push(cellKey);
      }
    }
    if (guaranteedCells.length === 0) continue;

    // For each other active pair, prune candidates touching guaranteed cells
    for (const otherIdx of state.activePairs) {
      if (otherIdx === pairIdx) continue;
      const otherDom = state.domains[otherIdx];
      const before = otherDom.positions.length;
      const survivors = otherDom.positions.filter(p => {
        const k1 = `${p.c1.row},${p.c1.col}`, k2 = `${p.c2.row},${p.c2.col}`;
        return !guaranteedCells.includes(k1) && !guaranteedCells.includes(k2);
      });
      if (survivors.length < before && survivors.length > 0) {
        return {
          type: 'pair-adjacency-prop', cost: 3.5, pairIdx: otherIdx,
          premises: [`pair-${pairIdx}-must-use-cells-${guaranteedCells.join('|')}`],
          conclusion: { kind: 'domain-pruned', from: before, to: survivors.length },
          domainBefore: before, domainAfter: survivors.length,
          branchingFactor: 2,
          apply(s) { s.domains[otherIdx].positions = survivors; }
        };
      }
    }
  }
  return null;
}

// ─────────────────────────────────────────────────────────────────────────────
// V5 PATTERN γ — Species Uniqueness Forcing (cost 4)
// ─────────────────────────────────────────────────────────────────────────────
// Combines line attribute rules (A5) + Total hint (A6) + species uniqueness
// to derive strong constraints. Example:
//   Line has habitat='극지' rule (eligible: 북극곰/펭귄/바다표범) + Total=4
//   → max contribution from each eligible pair to this line = 2 (both tokens)
//   → 4 tokens needed, 3 eligible species → at least 2 pairs must contribute 2
//   → those pairs must have horizontal/vertical orientation matching this line
//   → other configurations eliminated
//
// This pattern detects two scenarios:
//   (1) maxContrib == totalHint → all eligible pairs must contribute their max
//   (2) minContrib == totalHint → no other pair can enter this line
function ts_trySpeciesUniqueness(state) {
  for (let isRow = 0; isRow <= 1; isRow++) {
    for (let idx = 0; idx < state.n; idx++) {
      if (!ts_lineHasAttributeRule(state, !!isRow, idx)) continue;
      const totalHint = ts_lineTotalHint(state, !!isRow, idx);
      if (totalHint === null) continue;

      const eligibleSpeciesIds = ts_eligibleSpeciesForLine(state, !!isRow, idx);
      const eligiblePairs = state.activePairs.filter(pi =>
        eligibleSpeciesIds.includes(state.pairSpecies[pi])
      );

      // Add tokens already decided in this line for eligible species
      let alreadyContrib = 0;
      for (const pi in state.decisions) {
        const d = state.decisions[pi];
        if (!eligibleSpeciesIds.includes(d.animalId)) continue;
        if (isRow) {
          if (d.c1.row === idx) alreadyContrib++;
          if (d.c2.row === idx) alreadyContrib++;
        } else {
          if (d.c1.col === idx) alreadyContrib++;
          if (d.c2.col === idx) alreadyContrib++;
        }
      }

      // Compute potential contribution range from eligible-active pairs
      let minContrib = alreadyContrib, maxContrib = alreadyContrib;
      for (const pi of eligiblePairs) {
        const dom = state.domains[pi];
        if (dom.positions.length === 0) continue;
        let pmin = 2, pmax = 0;
        for (const p of dom.positions) {
          const c = ts_positionLineCount(p, !!isRow, idx);
          if (c < pmin) pmin = c;
          if (c > pmax) pmax = c;
        }
        minContrib += pmin;
        maxContrib += pmax;
      }

      const remaining = totalHint - alreadyContrib;
