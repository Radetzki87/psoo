      if (remaining < 0) continue; // contradiction handled elsewhere

      // Mode 1: maxContrib == totalHint → eligible pairs forced to max contribution
      if (maxContrib === totalHint && totalHint > alreadyContrib) {
        for (const pi of eligiblePairs) {
          const dom = state.domains[pi];
          if (dom.positions.length === 0) continue;
          const before = dom.positions.length;
          let pmax = 0;
          for (const p of dom.positions) {
            const c = ts_positionLineCount(p, !!isRow, idx);
            if (c > pmax) pmax = c;
          }
          const survivors = dom.positions.filter(p =>
            ts_positionLineCount(p, !!isRow, idx) === pmax
          );
          if (survivors.length < before && survivors.length > 0) {
            return {
              type: 'species-uniqueness', cost: 4, pairIdx: pi,
              premises: [`${isRow ? 'row' : 'col'}-${idx}-eligible-max-contribution-forced`],
              conclusion: { kind: 'domain-pruned', from: before, to: survivors.length },
              domainBefore: before, domainAfter: survivors.length,
              branchingFactor: 3,
              apply(s) { s.domains[pi].positions = survivors; }
            };
          }
        }
      }

      // Mode 2: minContrib == totalHint → ineligible pairs cannot enter this line
      if (minContrib === totalHint) {
        for (const pi of state.activePairs) {
          if (eligiblePairs.includes(pi)) continue;
          const dom = state.domains[pi];
          if (dom.positions.length === 0) continue;
          const before = dom.positions.length;
          const survivors = dom.positions.filter(p =>
            ts_positionLineCount(p, !!isRow, idx) === 0
          );
          if (survivors.length < before && survivors.length > 0) {
            return {
              type: 'species-uniqueness', cost: 4, pairIdx: pi,
              premises: [`${isRow ? 'row' : 'col'}-${idx}-saturated-by-eligible-species`],
              conclusion: { kind: 'domain-pruned', from: before, to: survivors.length },
              domainBefore: before, domainAfter: survivors.length,
              branchingFactor: 3,
              apply(s) { s.domains[pi].positions = survivors; }
            };
          }
        }
      }
    }
  }
  return null;
}



// ─────────────────────────────────────────────────────────────────────────────
// V5+ MULTI-PAIR JOINT REASONING — patterns M1-M5 (SOTA)
// ─────────────────────────────────────────────────────────────────────────────
// These patterns reason about MULTIPLE pairs simultaneously, deducing
// constraints from the joint contribution of several pairs to lines.
// They handle inference impossible at single-pair level — the inference
// family unique to Zoologic, arising from interaction of:
//   - Pair adjacency (A1+A2)
//   - Species attribute matching with line rules (A3+A4+A5)
//   - Total/H1 hints (A6+A7)
//   - Handpool composition
//
// Pattern catalogue:
//   M1 Bin Packing Force      — single-line subset forcing (cost 4)
//   M2 Multi-Line Distribution — joint constraint over 2 lines (cost 5)
//   M3 Adjacency Cascade      — shared cell-set propagation (cost 4.5)
//   M4 Hidden Species Force   — eligibility-saturation forcing (cost 5)
//   M5 Cross-Line Synergy     — saturated-line cell exclusion (cost 5.5)

// ════════════════════════════════════════════════════════════════════════════
// SHARED HELPERS
// ════════════════════════════════════════════════════════════════════════════

// Compute (minContrib, maxContrib, perPosition) of pair to a given line.
// perPos[i] = contribution if position i is selected (0, 1, or 2).
function ts_pairContribRange(state, pairIdx, isRow, lineIdx) {
  const dom = state.domains[pairIdx];
  if (dom.positions.length === 0) return { min: 0, max: 0, perPos: [] };
  let min = 999, max = -1;
  const perPos = [];
  for (const p of dom.positions) {
    let c = 0;
    if (isRow) {
      if (p.c1.row === lineIdx) c++;
      if (p.c2.row === lineIdx) c++;
    } else {
      if (p.c1.col === lineIdx) c++;
      if (p.c2.col === lineIdx) c++;
    }
    if (c < min) min = c;
    if (c > max) max = c;
    perPos.push(c);
  }
  return { min, max, perPos };
}

// Compute joint contribution to BOTH lines simultaneously.
// Returns array of {pos, c1Line, c2Line} where c1Line/c2Line are
// contributions to (row1, col1) or (row1, row2) etc.
function ts_pairContribJoint(state, pairIdx, isRow1, line1, isRow2, line2) {
  const dom = state.domains[pairIdx];
  if (dom.positions.length === 0) return { perPos: [] };
  const perPos = [];
  for (const p of dom.positions) {
    let c1 = 0, c2 = 0;
    if (isRow1) {
      if (p.c1.row === line1) c1++;
      if (p.c2.row === line1) c1++;
    } else {
      if (p.c1.col === line1) c1++;
      if (p.c2.col === line1) c1++;
    }
    if (isRow2) {
      if (p.c1.row === line2) c2++;
      if (p.c2.row === line2) c2++;
    } else {
      if (p.c1.col === line2) c2++;
      if (p.c2.col === line2) c2++;
    }
    perPos.push({ c1, c2 });
  }
  return { perPos };
}

// How many tokens of THIS line are already decided?
function ts_currentLineOccupancy(state, isRow, lineIdx) {
  let cur = 0;
  for (const pi in state.decisions) {
    const d = state.decisions[pi];
    if (isRow) {
      if (d.c1.row === lineIdx) cur++;
      if (d.c2.row === lineIdx) cur++;
    } else {
      if (d.c1.col === lineIdx) cur++;
      if (d.c2.col === lineIdx) cur++;
    }
  }
  return cur;
}

// How many ♂ tokens of THIS line are already decided?
function ts_currentLineMaleCount(state, isRow, lineIdx) {
  let m = 0;
  for (const pi in state.decisions) {
    const d = state.decisions[pi];
    if (isRow) {
      if (d.c1.row === lineIdx && d.g1 === 'male') m++;
      if (d.c2.row === lineIdx && d.g2 === 'male') m++;
    } else {
      if (d.c1.col === lineIdx && d.g1 === 'male') m++;
      if (d.c2.col === lineIdx && d.g2 === 'male') m++;
    }
  }
  return m;
}

// Compute current decided cells (used for adjacency cascade exclusion).
function ts_decidedCellSet(state) {
  const set = new Set();
  for (const pi in state.decisions) {
    const d = state.decisions[pi];
    set.add(`${d.c1.row},${d.c1.col}`);
    set.add(`${d.c2.row},${d.c2.col}`);
  }
  return set;
}

// ════════════════════════════════════════════════════════════════════════════
// M1 — BIN PACKING FORCE (cost 4)
// ════════════════════════════════════════════════════════════════════════════
// For a line L with Total hint T:
//   need = T - currentDecidedTokensOnL
//   for each active pair P, contribution range [P.min, P.max]
//   sumMin = Σ P.min, sumMax = Σ P.max
//
//   Per-pair forcing (single-pair, basic):
//     If sumMax - P.max + P.min < need → P must contribute > P.min
//     If sumMin - P.min + P.max > need → P must contribute < P.max
//
//   Subset forcing (SOTA enhancement):
//     For each contribution level v ∈ {0, 1, 2}:
//       count "must-be-v" pairs (their full range = {v})
//       count "can-be-v" pairs (v ∈ their range)
//     If among pairs that CAN contribute v, removing pair P
//     leaves the line unfillable (cumulative max < need or min > need),
//     then P MUST contribute v.
//
//   Tight-bound forcing:
//     If sumMin === need: every pair P with P.max > P.min must lock to P.min
//     If sumMax === need: every pair P with P.max > P.min must lock to P.max
//     (these were the ts_tryTotalForcing original cases — preserved here
//      for completeness; will not double-fire because we check P.min === P.max)
//
// Time complexity: O(lines × pairs × candidates). Practical < 50ms.
function ts_tryBinPackingForce(state) {
  for (let isRow = 0; isRow <= 1; isRow++) {
    const hintsObj = isRow ? state.rowHints : state.colHints;
    for (const idxStr in hintsObj) {
      const idx = parseInt(idxStr);
      const totalHint = (hintsObj[idx] || []).find(h => h.type === 'total');
      if (!totalHint) continue;

      const cur = ts_currentLineOccupancy(state, !!isRow, idx);
      const need = totalHint.value - cur;
      if (need < 0) continue;

      // Collect contribution ranges
      const contribs = [];
      for (const pairIdx of state.activePairs) {
        const r = ts_pairContribRange(state, pairIdx, !!isRow, idx);
        if (r.max < 0) continue;
        contribs.push({ pairIdx, min: r.min, max: r.max, perPos: r.perPos });
      }
      if (contribs.length === 0) continue;

      const sumMin = contribs.reduce((s, c) => s + c.min, 0);
      const sumMax = contribs.reduce((s, c) => s + c.max, 0);

      // Per-pair bin-packing forcing
      for (const c of contribs) {
        if (c.min === c.max) continue;
        const dom = state.domains[c.pairIdx];

        // P must contribute MORE than minC (others can't make up the rest)
        if (sumMax - c.max + c.min < need) {
          const before = dom.positions.length;
          const survivors = dom.positions.filter((_, i) => c.perPos[i] > c.min);
          if (survivors.length < before && survivors.length > 0) {
            return {
              type: 'bin-packing-force', cost: 4, pairIdx: c.pairIdx,
              premises: [`${isRow ? 'row' : 'col'}-${idx}-bin-packing-min-forced`],
              conclusion: { kind: 'domain-pruned', from: before, to: survivors.length },
              domainBefore: before, domainAfter: survivors.length,
              branchingFactor: 2,
              apply(s) { s.domains[c.pairIdx].positions = survivors; }
            };
          }
        }
        // P must contribute LESS than maxC
        if (sumMin - c.min + c.max > need) {
          const before = dom.positions.length;
          const survivors = dom.positions.filter((_, i) => c.perPos[i] < c.max);
          if (survivors.length < before && survivors.length > 0) {
            return {
              type: 'bin-packing-force', cost: 4, pairIdx: c.pairIdx,
              premises: [`${isRow ? 'row' : 'col'}-${idx}-bin-packing-max-forced`],
              conclusion: { kind: 'domain-pruned', from: before, to: survivors.length },
              domainBefore: before, domainAfter: survivors.length,
              branchingFactor: 2,
              apply(s) { s.domains[c.pairIdx].positions = survivors; }
            };
          }
        }
      }

      // Tight-bound forcing: sumMin === need OR sumMax === need
      // → every variable pair locks to a single contribution value
      if (sumMin === need || sumMax === need) {
        const targetIsMin = sumMin === need;
        for (const c of contribs) {
          if (c.min === c.max) continue;
          const dom = state.domains[c.pairIdx];
          const before = dom.positions.length;
          const target = targetIsMin ? c.min : c.max;
          const survivors = dom.positions.filter((_, i) => c.perPos[i] === target);
          if (survivors.length < before && survivors.length > 0) {
            return {
              type: 'bin-packing-force', cost: 4, pairIdx: c.pairIdx,
              premises: [`${isRow ? 'row' : 'col'}-${idx}-bin-packing-tight-${targetIsMin?'min':'max'}`],
              conclusion: { kind: 'domain-pruned', from: before, to: survivors.length },
              domainBefore: before, domainAfter: survivors.length,
              branchingFactor: 1,
              apply(s) { s.domains[c.pairIdx].positions = survivors; }
            };
          }
        }
      }

      // ─── H1 (♂ count) bin-packing forcing ────────────────────────────────
      // Apply same envelope logic to ♂ count constraint.
      const h1Hint = (hintsObj[idx] || []).find(h => h.type === 'H1');
      if (h1Hint) {
        const curMale = ts_currentLineMaleCount(state, !!isRow, idx);
        const needMale = h1Hint.value - curMale;
        if (needMale >= 0) {
          // Build per-pair male contribution: per candidate position,
          // compute exact male count (0, 1, or 2). For 'both' mode, the
          // contribution is range [0, lineContrib].
          const malePerPos = []; // parallel to dom.positions
          const pairMaleContribs = [];
          for (const pi of state.activePairs) {
            const dom = state.domains[pi];
            if (dom.positions.length === 0) continue;
            // For each position, compute (maleMin, maleMax) precisely.
            const posMaleRanges = dom.positions.map(p => {
              const c1OnLine = isRow ? p.c1.row === idx : p.c1.col === idx;
              const c2OnLine = isRow ? p.c2.row === idx : p.c2.col === idx;
              if (p.gender === 'g1g2') {
                // c1 male, c2 female
                const m = (c1OnLine ? 1 : 0);
                return { min: m, max: m };
              } else if (p.gender === 'g2g1') {
                const m = (c2OnLine ? 1 : 0);
                return { min: m, max: m };
              } else {
                // 'both' — gender undecided. CRITICAL: a pair has EXACTLY
                // one male and one female. So if BOTH cells are on the line
                // (lineContrib === 2), male contribution is EXACTLY 1
                // (not [0, 2]). If exactly one cell is on the line
                // (lineContrib === 1), male contribution is 0 or 1 depending
                // on which cell turns out to be male.
                const lineContrib = (c1OnLine ? 1 : 0) + (c2OnLine ? 1 : 0);
                if (lineContrib === 2) {
                  return { min: 1, max: 1 };
                } else {
                  // lineContrib is 0 or 1
                  return { min: 0, max: lineContrib };
                }
              }
            });
            let mMin = 999, mMax = -1;
            for (const r of posMaleRanges) {
              if (r.min < mMin) mMin = r.min;
              if (r.max > mMax) mMax = r.max;
            }
            pairMaleContribs.push({ pairIdx: pi, min: mMin, max: mMax, posRanges: posMaleRanges });
          }
          const mSumMin = pairMaleContribs.reduce((s, c) => s + c.min, 0);
          const mSumMax = pairMaleContribs.reduce((s, c) => s + c.max, 0);

          // Per-pair envelope forcing on ♂ count
          //
          // CRITICAL axiom-aware filter:
          // When forcing P to contribute MORE than c.min male, a candidate
          // position survives if it CAN contribute > c.min male (i.e., its
          // ♂ MAX > c.min). The position's max represents the upper bound
          // achievable by some gender mode choice.
          //
          // When forcing P to contribute LESS than c.max male, a candidate
          // position survives if it CAN contribute < c.max male (i.e., its
          // ♂ MIN < c.max). The position's min represents the lower bound
          // achievable by some gender mode choice.
          //
          // Using the WRONG attribute (filtering by min for "more" or by
          // max for "less") incorrectly prunes positions that could satisfy
          // the constraint via gender choice — see seed4 axiom-violation bug.
          //
          // GENDER-MODE RESTRICTION (new): When position-level filter does
          // not change the domain, the forcing requirement may still
          // restrict gender modes. For each 'both' gender candidate, check
          // whether g1g2 mode and/or g2g1 mode satisfy the new contribution
          // bound. If only one mode satisfies, narrow the candidate's
          // gender. This keeps candidate space accurate per the pair axiom
          // (1♂+1♀), which manifests as different ♂ contributions in g1g2
          // vs g2g1 mode for the same position.
          for (const c of pairMaleContribs) {
            if (c.min === c.max) continue;
            const dom = state.domains[c.pairIdx];

            // Determine forcing direction (if any)
            const minForced = mSumMax - c.max + c.min < needMale;
            const maxForced = mSumMin - c.min + c.max > needMale;

            if (minForced) {
              // P must contribute MORE male than its min
              // → keep positions whose MAX achievable male contribution > c.min
              const before = dom.positions.length;
              const survivors = dom.positions.filter((_, i) => c.posRanges[i].max > c.min);
              if (survivors.length < before && survivors.length > 0) {
                return {
                  type: 'bin-packing-force', cost: 4, pairIdx: c.pairIdx,
                  premises: [`${isRow ? 'row' : 'col'}-${idx}-H1-bin-packing-min-forced`],
                  conclusion: { kind: 'domain-pruned', from: before, to: survivors.length },
                  domainBefore: before, domainAfter: survivors.length,
                  branchingFactor: 2,
                  apply(s) { s.domains[c.pairIdx].positions = survivors; }
                };
              }
              // Position-level filter did not change domain; try gender-mode restriction.
              // For each 'both' candidate, check if g1g2 vs g2g1 satisfies "male > c.min"
              const newPositions = dom.positions.map(p => {
                if (p.gender !== 'both') return p;
                const c1OnLine = isRow ? p.c1.row === idx : p.c1.col === idx;
                const c2OnLine = isRow ? p.c2.row === idx : p.c2.col === idx;
                const m_g1g2 = (c1OnLine ? 1 : 0); // g1g2: c1 male
                const m_g2g1 = (c2OnLine ? 1 : 0); // g2g1: c2 male
                // Need male > c.min, so m must be > c.min for the mode to survive
                const g1g2OK = m_g1g2 > c.min;
                const g2g1OK = m_g2g1 > c.min;
                if (g1g2OK && g2g1OK) return p;
                if (!g1g2OK && !g2g1OK) return null; // candidate must be removed
                if (g1g2OK) return { ...p, gender: 'g1g2' };
                return { ...p, gender: 'g2g1' };
              }).filter(p => p !== null);
              if (newPositions.length < before ||
                  newPositions.some((p, i) => p.gender !== dom.positions[i].gender)) {
                if (newPositions.length > 0) {
                  return {
                    type: 'bin-packing-force', cost: 4, pairIdx: c.pairIdx,
                    premises: [`${isRow ? 'row' : 'col'}-${idx}-H1-gender-mode-restricted-min`],
                    conclusion: { kind: 'gender-restricted', from: before, to: newPositions.length },
                    domainBefore: before, domainAfter: newPositions.length,
                    branchingFactor: 2,
                    apply(s) { s.domains[c.pairIdx].positions = newPositions; }
                  };
                }
              }
            }
            if (maxForced) {
              // P must contribute LESS male than its max
              // → keep positions whose MIN achievable male contribution < c.max
              const before = dom.positions.length;
              const survivors = dom.positions.filter((_, i) => c.posRanges[i].min < c.max);
              if (survivors.length < before && survivors.length > 0) {
                return {
                  type: 'bin-packing-force', cost: 4, pairIdx: c.pairIdx,
                  premises: [`${isRow ? 'row' : 'col'}-${idx}-H1-bin-packing-max-forced`],
                  conclusion: { kind: 'domain-pruned', from: before, to: survivors.length },
                  domainBefore: before, domainAfter: survivors.length,
                  branchingFactor: 2,
                  apply(s) { s.domains[c.pairIdx].positions = survivors; }
                };
              }
              // Position-level filter did not change; try gender-mode restriction.
              // Need male < c.max, so m must be < c.max for the mode to survive
              const newPositions = dom.positions.map(p => {
                if (p.gender !== 'both') return p;
                const c1OnLine = isRow ? p.c1.row === idx : p.c1.col === idx;
                const c2OnLine = isRow ? p.c2.row === idx : p.c2.col === idx;
                const m_g1g2 = (c1OnLine ? 1 : 0);
                const m_g2g1 = (c2OnLine ? 1 : 0);
                const g1g2OK = m_g1g2 < c.max;
                const g2g1OK = m_g2g1 < c.max;
                if (g1g2OK && g2g1OK) return p;
                if (!g1g2OK && !g2g1OK) return null;
                if (g1g2OK) return { ...p, gender: 'g1g2' };
                return { ...p, gender: 'g2g1' };
              }).filter(p => p !== null);
              if (newPositions.length < before ||
                  newPositions.some((p, i) => i < newPositions.length && p.gender !== dom.positions[i].gender)) {
                if (newPositions.length > 0) {
                  // Check that something actually changed
                  let changed = newPositions.length < before;
                  if (!changed) {
                    for (let k = 0; k < newPositions.length; k++) {
                      if (newPositions[k].gender !== dom.positions[k].gender) { changed = true; break; }
                    }
                  }
                  if (changed) {
                    return {
                      type: 'bin-packing-force', cost: 4, pairIdx: c.pairIdx,
                      premises: [`${isRow ? 'row' : 'col'}-${idx}-H1-gender-mode-restricted-max`],
                      conclusion: { kind: 'gender-restricted', from: before, to: newPositions.length },
                      domainBefore: before, domainAfter: newPositions.length,
                      branchingFactor: 2,
                      apply(s) { s.domains[c.pairIdx].positions = newPositions; }
                    };
                  }
                }
              }
            }
          }
        }
      }
    }
  }
  return null;
}

// ════════════════════════════════════════════════════════════════════════════
// N — CELL-HIDDEN-SINGLE (cost 4)
// ════════════════════════════════════════════════════════════════════════════
// SOTA cell-centric inference — the missing piece that complements the
// envelope-based bin-packing-force.
//
// CORE INSIGHT: When a line L is "saturated" (Total = available cells),
// every available cell in L MUST be used by some pair. For each such cell c,
// compute the set of active pairs that have a candidate position using c.
// If that set has size 1, the unique pair is FORCED to use cell c.
//
// This catches scenarios where envelope-based forcing fails:
//   - row 3 has Total=6, all 6 cells must be used
//   - cell (3,0) has line rule "habitat=사바나"; only 코끼리 pair has a
//     candidate using (3,0) → 코끼리 must use (3,0)
//
// SOTA enhancements beyond simple cell-hidden-single:
//   1. Saturated-line detection: Total = (available cells in line)
//      where available = not-forbidden, not-fully-decided
//   2. Multi-cell forcing: a pair using cell c shrinks to candidates
//      that include c (not just decides the pair)
//   3. Cross-saturation: cells in INTERSECTION of two saturated lines
//      get double-strength constraints
//
// Time complexity: O(lines × cellsPerLine × pairs × candidates).
// Practical: <30ms for 6×6 puzzles.

function ts_tryCellHiddenSingle(state) {
  // ─── Phase 1: Identify saturated lines ───────────────────────────────────
  // A line is saturated when its Total equals the count of "must-fill" cells:
  //   must-fill = (cells not forbidden, not already used by a decided pair)
  // For a saturated line, EVERY must-fill cell must be used by some pair.
  const saturatedCells = new Set(); // cells that MUST be filled by some pair

  for (let isRow = 0; isRow <= 1; isRow++) {
    const hintsObj = isRow ? state.rowHints : state.colHints;
    for (const idxStr in hintsObj) {
      const idx = parseInt(idxStr);
      const totalHint = (hintsObj[idx] || []).find(h => h.type === 'total');
      if (!totalHint) continue;

      // Count current occupancy and gather available cells
      let curOcc = 0;
      const availCells = [];
      for (let k = 0; k < state.n; k++) {
        const cellKey = isRow ? `${idx},${k}` : `${k},${idx}`;
        if (state.forbidden.has(cellKey)) continue;
        if (state.usedCells.has(cellKey)) {
          curOcc++;
          continue;
        }
        availCells.push(cellKey);
      }
      const need = totalHint.value - curOcc;

      // Saturated: need equals available cell count → every avail cell must fill
      if (need === availCells.length && need > 0) {
        for (const c of availCells) saturatedCells.add(c);
      }
    }
  }

  if (saturatedCells.size === 0) return null;

  // ─── Phase 2: For each saturated cell, compute pair-candidate set ────────
  // For a saturated cell c, find all active pairs that have ≥1 candidate
  // position using c.
  for (const cellKey of saturatedCells) {
    const [rStr, cStr] = cellKey.split(',');
    const r = parseInt(rStr), c = parseInt(cStr);

    const candidatePairs = []; // array of { pairIdx, hasCellPositions: [pos indices] }
    for (const pi of state.activePairs) {
      const dom = state.domains[pi];
      const matchingIndices = [];
      for (let posI = 0; posI < dom.positions.length; posI++) {
        const p = dom.positions[posI];
        if ((p.c1.row === r && p.c1.col === c) ||
            (p.c2.row === r && p.c2.col === c)) {
          matchingIndices.push(posI);
        }
      }
      if (matchingIndices.length > 0) {
        candidatePairs.push({ pairIdx: pi, matchingIndices, totalPositions: dom.positions.length });
      }
    }

    // Hidden Single: exactly one pair can use this cell → that pair forced
    if (candidatePairs.length === 1) {
      const cp = candidatePairs[0];
      // Already locked to all-matching positions? Skip
      if (cp.matchingIndices.length === cp.totalPositions) continue;

      const dom = state.domains[cp.pairIdx];
      const before = dom.positions.length;
      const survivors = cp.matchingIndices.map(i => dom.positions[i]);

      if (survivors.length < before && survivors.length > 0) {
        return {
          type: 'cell-hidden-single', cost: 4, pairIdx: cp.pairIdx,
          premises: [`cell-${cellKey}-saturated-only-pair-${cp.pairIdx}`],
          conclusion: { kind: 'domain-pruned', from: before, to: survivors.length },
          domainBefore: before, domainAfter: survivors.length,
          branchingFactor: 1,
          apply(s) { s.domains[cp.pairIdx].positions = survivors; }
        };
      }
    }
  }

  // ─── Phase 3: Cross-Saturation — Cells at intersection of 2 saturated lines
  // Both row r and col c saturated → cell (r,c) is doubly constrained
  // (handled implicitly above; the cell appears in saturatedCells exactly once
  // since Set dedups, but its constraint strength is still valid)

  return null;
}


// For a pair of lines (L1, L2), a position can contribute to:
//   - L1 only
//   - L2 only
//   - Both (cell at intersection — at most one cell of pair can do this)
//   - Neither
//
// Joint constraint: tokensOnL1 = needL1 AND tokensOnL2 = needL2.
//
// Forcing logic: for each pair P, if forcing P to a particular contribution
// pattern (cL1, cL2) makes the rest of the puzzle unsolvable (i.e., the
// remaining pairs cannot fill the joint deficit), then P must NOT contribute
// that pattern.
//
// Specifically, for each candidate position with contribution (a, b):
//   restNeedL1 = needL1 - a
//   restNeedL2 = needL2 - b
//   If sumOver(other pairs).maxL1 < restNeedL1 → infeasible
//   If sumOver(other pairs).maxL2 < restNeedL2 → infeasible
//   If sumOver(other pairs).minL1 > restNeedL1 → infeasible
//   If sumOver(other pairs).minL2 > restNeedL2 → infeasible
//
// This handles cases like "row 3 Total=6 + col 4 Total=6" where each line
// individually has slack but their joint constraint is tight.
//
// We restrict to "interesting" line pairs to control time:
//   - Both lines have Total hints
//   - At least one line is highly constrained (need >= 4 OR need fills line)
function ts_tryMultiLineForce(state) {
  // Gather candidate lines: those with Total hints and need > 0
  const lines = [];
  for (let isRow = 0; isRow <= 1; isRow++) {
    const hintsObj = isRow ? state.rowHints : state.colHints;
    for (const idxStr in hintsObj) {
      const idx = parseInt(idxStr);
      const t = (hintsObj[idx] || []).find(h => h.type === 'total');
      if (!t) continue;
      const cur = ts_currentLineOccupancy(state, !!isRow, idx);
      const need = t.value - cur;
      if (need <= 0) continue;
      lines.push({ isRow: !!isRow, idx, need, total: t.value });
    }
  }
  // Sort by need (largest first) — high-need lines are more constraining
  lines.sort((a, b) => b.need - a.need);

  // Try line pairs (up to first 8 lines × first 8 lines = 64 combos)
  const MAX_LINES = 8;
  const considerable = lines.slice(0, MAX_LINES);

  for (let i = 0; i < considerable.length; i++) {
    for (let j = i + 1; j < considerable.length; j++) {
      const L1 = considerable[i], L2 = considerable[j];

      // Compute joint contribution range per pair
      const jointContribs = [];
      for (const pairIdx of state.activePairs) {
        const j2 = ts_pairContribJoint(state, pairIdx, L1.isRow, L1.idx, L2.isRow, L2.idx);
        if (j2.perPos.length === 0) continue;
        // Reduce: per pair, what (min/max) contribution to L1 and L2 separately
        let l1Min=999, l1Max=-1, l2Min=999, l2Max=-1;
        for (const pp of j2.perPos) {
          if (pp.c1 < l1Min) l1Min = pp.c1;
          if (pp.c1 > l1Max) l1Max = pp.c1;
          if (pp.c2 < l2Min) l2Min = pp.c2;
          if (pp.c2 > l2Max) l2Max = pp.c2;
        }
        jointContribs.push({
          pairIdx, perPos: j2.perPos,
          l1Min, l1Max, l2Min, l2Max,
        });
      }
      if (jointContribs.length < 2) continue;

      const sumL1Max = jointContribs.reduce((s,c)=>s+c.l1Max, 0);
      const sumL1Min = jointContribs.reduce((s,c)=>s+c.l1Min, 0);
      const sumL2Max = jointContribs.reduce((s,c)=>s+c.l2Max, 0);
      const sumL2Min = jointContribs.reduce((s,c)=>s+c.l2Min, 0);

      // Quick feasibility filter
      if (sumL1Max < L1.need || sumL2Max < L2.need) continue;
      if (sumL1Min > L1.need || sumL2Min > L2.need) continue;

      // For each pair P and each candidate position, check if forcing P
      // to that (c1, c2) leaves the others able to satisfy joint demand.
      for (const pc of jointContribs) {
        const dom = state.domains[pc.pairIdx];
        if (dom.positions.length < 2) continue;

        // Per-position infeasibility check
        const survivors = [];
        const indicesKept = [];
        for (let pi = 0; pi < pc.perPos.length; pi++) {
          const pp = pc.perPos[pi];
          // Remaining demand if P contributes (pp.c1, pp.c2)
          const restL1 = L1.need - pp.c1;
          const restL2 = L2.need - pp.c2;
          if (restL1 < 0 || restL2 < 0) continue; // exceeds demand
          // Sum of others' max/min
          const restL1Max = sumL1Max - pc.l1Max + pc.l1Min - (pc.l1Min - 0); // recompute properly
          // Simpler: we computed sums INCLUDING this pair; remove this pair's max
          // and add back... — clearer: precompute restMaxL1 etc. per pair
          const otherL1Max = sumL1Max - pc.l1Max;
          const otherL1Min = sumL1Min - pc.l1Min;
          const otherL2Max = sumL2Max - pc.l2Max;
          const otherL2Min = sumL2Min - pc.l2Min;

          // Feasibility: others must satisfy restL1 and restL2
          if (restL1 > otherL1Max) continue;
          if (restL1 < otherL1Min) continue;
          if (restL2 > otherL2Max) continue;
          if (restL2 < otherL2Min) continue;

          survivors.push(dom.positions[pi]);
          indicesKept.push(pi);
        }

        if (survivors.length < dom.positions.length && survivors.length > 0) {
          return {
            type: 'multi-line-force', cost: 5, pairIdx: pc.pairIdx,
            premises: [`joint-${L1.isRow?'r':'c'}${L1.idx}-${L2.isRow?'r':'c'}${L2.idx}-need-${L1.need}-${L2.need}`],
            conclusion: { kind: 'domain-pruned', from: dom.positions.length, to: survivors.length },
            domainBefore: dom.positions.length, domainAfter: survivors.length,
            branchingFactor: 3,
            apply(s) { s.domains[pc.pairIdx].positions = survivors; }
          };
        }
      }
    }
  }
  return null;
}

// ════════════════════════════════════════════════════════════════════════════
// M3 — ADJACENCY CASCADE (cost 4.5)
// ════════════════════════════════════════════════════════════════════════════
// When two pairs P1 and P2 share an identical or near-identical candidate
// cell-set (the union of cells used across all candidate positions), they
// "claim" those cells. Other pairs cannot use those cells.
//
// Specifically, if pair P1 has candidates that all include cell (r,c) or
// none touching cell (r,c), and the same is true for P2, AND together they
// must occupy a constrained set of cells — we propagate exclusion to others.
//
// SOTA refinement: detect "claim sets" — minimal cell groups that must be
// fully covered by a known set of pairs. Other pairs cannot enter.
//
// Simplest case (implemented): if two pairs' candidate sets share cells
// such that some cell C is used in EVERY candidate of either pair, and
// that cell is also used in candidates of a third pair P3, prune P3's
// candidates touching C.
function ts_tryAdjacencyCascade(state) {
  // For each active pair, compute "always-used cells" (cells used in every
  // surviving candidate) — these cells are guaranteed used by this pair.
  const guaranteedCells = []; // {pairIdx, cellKey}
  for (const pairIdx of state.activePairs) {
    const dom = state.domains[pairIdx];
    if (dom.positions.length < 2) continue;
    const cellCount = {};
    for (const p of dom.positions) {
      const k1 = `${p.c1.row},${p.c1.col}`;
      const k2 = `${p.c2.row},${p.c2.col}`;
      cellCount[k1] = (cellCount[k1] || 0) + 1;
      cellCount[k2] = (cellCount[k2] || 0) + 1;
    }
    for (const [cellKey, count] of Object.entries(cellCount)) {
      if (count === dom.positions.length) {
        guaranteedCells.push({ pairIdx, cellKey });
      }
    }
  }

  if (guaranteedCells.length === 0) return null;

  // For each guaranteed cell, prune other pairs' candidates touching it
  const guaranteedSet = new Set(guaranteedCells.map(g => g.cellKey));
  const cellToOwner = {};
  for (const g of guaranteedCells) {
    if (!cellToOwner[g.cellKey]) cellToOwner[g.cellKey] = g.pairIdx;
  }

  for (const pairIdx of state.activePairs) {
    const dom = state.domains[pairIdx];
    if (dom.positions.length < 2) continue;
    const before = dom.positions.length;
    const survivors = dom.positions.filter(p => {
      const k1 = `${p.c1.row},${p.c1.col}`;
      const k2 = `${p.c2.row},${p.c2.col}`;
      const usedByOther1 = guaranteedSet.has(k1) && cellToOwner[k1] !== pairIdx;
      const usedByOther2 = guaranteedSet.has(k2) && cellToOwner[k2] !== pairIdx;
      return !usedByOther1 && !usedByOther2;
    });

    if (survivors.length < before && survivors.length > 0) {
      const conflictCells = [];
      for (const p of dom.positions) {
        const k1 = `${p.c1.row},${p.c1.col}`;
        const k2 = `${p.c2.row},${p.c2.col}`;
        if (guaranteedSet.has(k1) && cellToOwner[k1] !== pairIdx) conflictCells.push(k1);
        if (guaranteedSet.has(k2) && cellToOwner[k2] !== pairIdx) conflictCells.push(k2);
      }
      const conflictPair = cellToOwner[conflictCells[0]];
      return {
        type: 'adjacency-cascade', cost: 4.5, pairIdx,
        premises: [`pair-${conflictPair}-claims-cells-${conflictCells.slice(0,2).join('|')}`],
        conclusion: { kind: 'domain-pruned', from: before, to: survivors.length },
        domainBefore: before, domainAfter: survivors.length,
        branchingFactor: 2,
        apply(s) { s.domains[pairIdx].positions = survivors; }
      };
    }
  }
  return null;
}

// ════════════════════════════════════════════════════════════════════════════
// M4 — HIDDEN SPECIES FORCE (cost 5)
// ════════════════════════════════════════════════════════════════════════════
// For a line L with attribute rule R and Total hint T:
//   eligibleSpecies = species matching R
//   eligiblePairs   = pairs of eligibleSpecies still active
//
//   Mode A — Saturating Eligibility:
//     If sum of eligible-pair MAX contributions == T,
//     every eligible pair must contribute its MAX
//
//   Mode B — Filling Eligibility:
//     If sum of eligible-pair MIN contributions == T,
//     non-eligible pairs cannot enter L
//
//   Mode C (SOTA) — Subset Saturation:
//     For each eligible pair P, if sumOf(others.eligible.max) < T - P.max,
//     P must contribute MORE than its current min — prune accordingly.
function ts_tryHiddenSpeciesForce(state) {
  for (let isRow = 0; isRow <= 1; isRow++) {
    const hintsObj = isRow ? state.rowHints : state.colHints;
    for (const idxStr in hintsObj) {
      const idx = parseInt(idxStr);
      if (!ts_lineHasAttributeRule(state, !!isRow, idx)) continue;
      const totalHint = (hintsObj[idx] || []).find(h => h.type === 'total');
      if (!totalHint) continue;

      const eligibleSpeciesIds = ts_eligibleSpeciesForLine(state, !!isRow, idx);
      const eligiblePairs = state.activePairs.filter(pi =>
        eligibleSpeciesIds.includes(state.pairSpecies[pi])
      );
      if (eligiblePairs.length === 0) continue;

      const cur = ts_currentLineOccupancy(state, !!isRow, idx);
      const need = totalHint.value - cur;
      if (need <= 0) continue;

      const eligContribs = [];
      for (const pi of eligiblePairs) {
        const r = ts_pairContribRange(state, pi, !!isRow, idx);
        eligContribs.push({ pairIdx: pi, ...r });
      }
      const sumEligibleMax = eligContribs.reduce((s,c)=>s+c.max, 0);
      const sumEligibleMin = eligContribs.reduce((s,c)=>s+c.min, 0);

      // Mode A: max == need
      if (sumEligibleMax === need && sumEligibleMin < need) {
        for (const c of eligContribs) {
          if (c.min === c.max) continue;
          const dom = state.domains[c.pairIdx];
          const before = dom.positions.length;
          const survivors = dom.positions.filter((_, i) => c.perPos[i] === c.max);
          if (survivors.length < before && survivors.length > 0) {
            return {
              type: 'hidden-species-force', cost: 5, pairIdx: c.pairIdx,
              premises: [`${isRow ? 'row' : 'col'}-${idx}-eligible-max-saturated`],
              conclusion: { kind: 'domain-pruned', from: before, to: survivors.length },
              domainBefore: before, domainAfter: survivors.length,
              branchingFactor: 3,
              apply(s) { s.domains[c.pairIdx].positions = survivors; }
            };
          }
        }
      }

      // Mode B: min == need → non-eligible pairs cannot enter
      if (sumEligibleMin === need) {
        for (const pi of state.activePairs) {
          if (eligiblePairs.includes(pi)) continue;
          const dom = state.domains[pi];
          if (dom.positions.length === 0) continue;
          const before = dom.positions.length;
          const survivors = dom.positions.filter(p =>
            ts_positionLineCount(p, !!isRow, idx) === 0
          );
          if (survivors.length < before && survivors.length > 0) {
            return {
              type: 'hidden-species-force', cost: 5, pairIdx: pi,
              premises: [`${isRow ? 'row' : 'col'}-${idx}-non-eligible-blocked`],
              conclusion: { kind: 'domain-pruned', from: before, to: survivors.length },
              domainBefore: before, domainAfter: survivors.length,
              branchingFactor: 3,
              apply(s) { s.domains[pi].positions = survivors; }
            };
          }
        }
      }

      // Mode C: subset saturation — for each eligible pair P,
      // if others' max < need - P.max, P must contribute > P.min
      for (const c of eligContribs) {
        if (c.min === c.max) continue;
        const otherMax = sumEligibleMax - c.max;
        if (otherMax < need - c.max) {
          // P must be at MAX
          const dom = state.domains[c.pairIdx];
          const before = dom.positions.length;
          const survivors = dom.positions.filter((_, i) => c.perPos[i] === c.max);
          if (survivors.length < before && survivors.length > 0) {
            return {
              type: 'hidden-species-force', cost: 5, pairIdx: c.pairIdx,
              premises: [`${isRow ? 'row' : 'col'}-${idx}-subset-saturation-max`],
              conclusion: { kind: 'domain-pruned', from: before, to: survivors.length },
              domainBefore: before, domainAfter: survivors.length,
              branchingFactor: 3,
              apply(s) { s.domains[c.pairIdx].positions = survivors; }
            };
          }
        }
      }
    }
  }
  return null;
}

// ════════════════════════════════════════════════════════════════════════════
// M5 — CROSS-LINE SYNERGY (cost 5.5)
// ════════════════════════════════════════════════════════════════════════════
// When two intersecting lines are BOTH near-saturated, the intersection cell
// becomes specially constrained. Specifically, if cell (r, c) is on row r
// and col c, both with strong totalHints, the joint contribution affects
// whether the cell can be used.
//
// SOTA implementation: for each cell that is the intersection of two lines
// with active total constraints, check if using/not-using that cell is
// determined by the joint demand.
//
// Direct case: row r needs N_r more tokens, col c needs N_c more tokens.
// If sumMax of pairs that can contribute to row r is exactly N_r,
// AND sumMax of pairs that can contribute to col c is exactly N_c,
// then we have tight constraints at the intersection.
//
// Looser case: if a candidate position uses cell (r,c) and that contribution
// (1 to row r, 1 to col c) is incompatible with other constraints' joint
// solution, prune the position.
//
// We implement a focused version: for each pair P with a candidate position
// using cell (r,c), check if (r,c)-using vs (r,c)-not-using leads to
// different feasibility of the rest.
function ts_tryCrossLineSynergy(state) {
  // Step 1: find all "tight" lines (need > 0, but tight = need close to sumMax)
  const tightLines = [];
  for (let isRow = 0; isRow <= 1; isRow++) {
    const hintsObj = isRow ? state.rowHints : state.colHints;
    for (const idxStr in hintsObj) {
      const idx = parseInt(idxStr);
      const t = (hintsObj[idx] || []).find(h => h.type === 'total');
      if (!t) continue;
      const cur = ts_currentLineOccupancy(state, !!isRow, idx);
      const need = t.value - cur;
      if (need <= 0) continue;
      // Compute sumMax for this line
      let sumMax = 0;
      for (const pi of state.activePairs) {
        const r = ts_pairContribRange(state, pi, !!isRow, idx);
        sumMax += r.max;
      }
      // "Tight" = sumMax - need <= slack threshold
      const slack = sumMax - need;
      if (slack <= 2) {
        tightLines.push({ isRow: !!isRow, idx, need, sumMax, slack });
      }
    }
  }

  if (tightLines.length < 2) return null;

  // Step 2: for each pair of perpendicular tight lines (one row, one col),
  // find their intersection cell and analyze.
  for (let i = 0; i < tightLines.length; i++) {
    for (let j = 0; j < tightLines.length; j++) {
      if (i === j) continue;
      const L1 = tightLines[i], L2 = tightLines[j];
      if (L1.isRow === L2.isRow) continue; // same orientation, no intersection
      const row = L1.isRow ? L1.idx : L2.idx;
      const col = L1.isRow ? L2.idx : L1.idx;
      const cellKey = `${row},${col}`;

      // For each active pair, classify candidate positions by whether they
      // use cell (row, col), and analyze joint feasibility.
      for (const pairIdx of state.activePairs) {
        const dom = state.domains[pairIdx];
        if (dom.positions.length < 2) continue;

        // For positions using cell (r,c): they contribute +1 to row L1.idx
        // AND +1 to col L2.idx. For positions not using (r,c): they may
        // contribute different amounts.
        const usingCell = [];
        const notUsingCell = [];
        for (let pi = 0; pi < dom.positions.length; pi++) {
          const p = dom.positions[pi];
          const k1 = `${p.c1.row},${p.c1.col}`;
          const k2 = `${p.c2.row},${p.c2.col}`;
          if (k1 === cellKey || k2 === cellKey) usingCell.push(pi);
          else notUsingCell.push(pi);
        }

        if (usingCell.length === 0 || notUsingCell.length === 0) continue;

        // Compute per-pair contribution to L1 and L2 from "others" (excluding P)
        let othersL1Max = 0, othersL1Min = 0;
        let othersL2Max = 0, othersL2Min = 0;
        for (const oi of state.activePairs) {
          if (oi === pairIdx) continue;
          const r1 = ts_pairContribRange(state, oi, L1.isRow, L1.idx);
          const r2 = ts_pairContribRange(state, oi, L2.isRow, L2.idx);
          othersL1Max += r1.max; othersL1Min += r1.min;
          othersL2Max += r2.max; othersL2Min += r2.min;
        }

        // Hypothesis A: P uses cell (r,c). Then P contributes +1 to L1 and +1 to L2.
        // For best-case: P's max contribution to L1 (excluding (r,c)) — but
        // (r,c) gives +1 to L1, P could contribute 1 or 2 total to L1.
        // We use the position-specific contribution.
        const pUsingMaxL1 = Math.max(...usingCell.map(pi => {
          const p = dom.positions[pi];
          return (p.c1.row === L1.idx ? 1 : 0) + (p.c2.row === L1.idx ? 1 : 0)
              + (p.c1.col === L1.idx ? (L1.isRow ? 0 : 1) : 0)  // never both: row XOR col
              + (p.c2.col === L1.idx ? (L1.isRow ? 0 : 1) : 0);
        }));
        // Above is overly complex; simplify by recomputing per position:
        function lineContrib(p, isRow, idx) {
          let c = 0;
          if (isRow) {
            if (p.c1.row === idx) c++;
            if (p.c2.row === idx) c++;
          } else {
            if (p.c1.col === idx) c++;
            if (p.c2.col === idx) c++;
          }
          return c;
        }

        const usingL1 = usingCell.map(pi => lineContrib(dom.positions[pi], L1.isRow, L1.idx));
        const usingL2 = usingCell.map(pi => lineContrib(dom.positions[pi], L2.isRow, L2.idx));
        const notUsingL1 = notUsingCell.map(pi => lineContrib(dom.positions[pi], L1.isRow, L1.idx));
        const notUsingL2 = notUsingCell.map(pi => lineContrib(dom.positions[pi], L2.isRow, L2.idx));

        // Check: if P uses cell, can the rest fill demand?
        // P uses cell → P contributes [min(usingL1), max(usingL1)] to L1
        const aMinP1 = Math.min(...usingL1), aMaxP1 = Math.max(...usingL1);
        const aMinP2 = Math.min(...usingL2), aMaxP2 = Math.max(...usingL2);
        const restNeedL1A = [L1.need - aMaxP1, L1.need - aMinP1]; // [min, max] needed from others
        const restNeedL2A = [L2.need - aMaxP2, L2.need - aMinP2];
        const aFeasible =
          othersL1Max >= restNeedL1A[0] && othersL1Min <= restNeedL1A[1] &&
          othersL2Max >= restNeedL2A[0] && othersL2Min <= restNeedL2A[1];

        // Check: if P doesn't use cell, can the rest fill demand?
        const bMinP1 = Math.min(...notUsingL1), bMaxP1 = Math.max(...notUsingL1);
        const bMinP2 = Math.min(...notUsingL2), bMaxP2 = Math.max(...notUsingL2);
        const restNeedL1B = [L1.need - bMaxP1, L1.need - bMinP1];
        const restNeedL2B = [L2.need - bMaxP2, L2.need - bMinP2];
        const bFeasible =
          othersL1Max >= restNeedL1B[0] && othersL1Min <= restNeedL1B[1] &&
          othersL2Max >= restNeedL2B[0] && othersL2Min <= restNeedL2B[1];

        if (!aFeasible && bFeasible) {
          // Force P to NOT use cell
          const before = dom.positions.length;
          const survivors = notUsingCell.map(pi => dom.positions[pi]);
          if (survivors.length < before && survivors.length > 0) {
            return {
              type: 'cross-line-synergy', cost: 5.5, pairIdx,
              premises: [`cell-${cellKey}-incompatible-with-${L1.isRow?'r':'c'}${L1.idx}-${L2.isRow?'r':'c'}${L2.idx}-joint`],
              conclusion: { kind: 'domain-pruned', from: before, to: survivors.length },
              domainBefore: before, domainAfter: survivors.length,
              branchingFactor: 3,
              apply(s) { s.domains[pairIdx].positions = survivors; }
            };
          }
        }
        if (aFeasible && !bFeasible) {
          // Force P to USE cell
          const before = dom.positions.length;
          const survivors = usingCell.map(pi => dom.positions[pi]);
          if (survivors.length < before && survivors.length > 0) {
            return {
              type: 'cross-line-synergy', cost: 5.5, pairIdx,
              premises: [`cell-${cellKey}-required-by-${L1.isRow?'r':'c'}${L1.idx}-${L2.isRow?'r':'c'}${L2.idx}-joint`],
              conclusion: { kind: 'domain-pruned', from: before, to: survivors.length },
              domainBefore: before, domainAfter: survivors.length,
              branchingFactor: 3,
              apply(s) { s.domains[pairIdx].positions = survivors; }
            };
          }
        }
      }
    }
  }
  return null;
}


// ─────────────────────────────────────────────────────────────────────────────
// LEVEL 3 — single-step lookahead (cost 5)
// ─────────────────────────────────────────────────────────────────────────────

// Pattern 3a: Single-step lookahead — for a pair with 2-3 positions, try each,
// propagate level 0-2, see if all branches share new decisions.
// ─────────────────────────────────────────────────────────────────────────────
// LEVEL 2.5 — LOOKAHEAD BRANCH ELIMINATION (cost 4)
// ─────────────────────────────────────────────────────────────────────────────
// SOTA contradiction-driven prune. The "negative" counterpart to single-lookahead.
//
// CORE INSIGHT: For an active pair P with small domain (2-4 candidates), test
// each candidate by hypothesizing it. If hypothesizing candidate c leads to
// CONTRADICTION (some other pair's domain becomes empty after propagation),
// then c is INVALID and must be pruned from P's domain.
//
// This catches scenarios like:
//   - col 0 has Total=5, habitat=해양 → must be filled by 해양 pairs
//   - 바다거북♀ is fixed at (2,0); 바다거북♂ candidates are (1,0) and (3,0)
//   - HYPOTHESIS: 바다거북♂ at (1,0)
//     → propagate → 상어 pair candidates {(0,0)+(1,0), ...} all conflict
//     → 상어 domain becomes 0 → CONTRADICTION
//   - Therefore 바다거북♂ at (1,0) is INVALID → prune
//   - 바다거북♂ at (3,0) is the only survivor → next naked-single decides
//
// Distinguished from single-lookahead:
//   - branch-elimination: "this candidate causes contradiction" → prune (cost 4)
//   - single-lookahead: "all branches share decision X" → apply X (cost 5)
//
// They are MECE: branch-elim is contradiction-driven (negative inference),
// single-lookahead is agreement-driven (positive inference). Both use the
// hypothesis+propagate mechanism but extract different information.
//
// Why this is essential: branch-elim handles the "1 valid branch" case that
// single-lookahead skips (because <2 branches means no agreement possible).
// Without branch-elim, the solver loses critical inference.
//
// Time complexity: O(activePairs × candidates × propagateBasic). Practical
// budget ~150ms per call. Returns at first prunable pair found.

// ─────────────────────────────────────────────────────────────────────────────
// LEVEL 2.4 — GENDER RESOLUTION (cost 4)
// ─────────────────────────────────────────────────────────────────────────────
// SOTA axiom-aware gender disambiguator. Handles the boundary case where
// a pair has dom 1 but gender is 'both' (undetermined) — naked-single can
// not handle this because it requires gender !== 'both'.
//
// CORE INSIGHT: For an active pair P with dom 1 and gender 'both', test
// each gender mode (g1g2, g2g1) by hypothesizing it. There are three
// outcomes:
//   1. Only g1g2 valid → decide P with g1g2
//   2. Only g2g1 valid → decide P with g2g1
//   3. Both valid → multi-solution at this gender axis. Decide arbitrarily
//      (g1g2 by canonical default). Solver still produces a valid solution.
//   4. Both invalid → puzzle infeasible from this state. Don't return step;
//      let lookahead/contradiction patterns surface this.
//
// Why this is necessary:
//   Some puzzles (especially low-difficulty ones) are gender-multi-solution
//   when their hints have no H1/H2 component and line rules constrain only
//   habitat/diet. The pair axiom (1♂+1♀) determines that ONE token is male
//   and the other female, but which is which is sometimes free. Without
//   this pattern, solver stalls on dom 1 + gender 'both' configurations.
//
// MECE rationale: This is a sibling of lookahead-branch-elim. Both use
// hypothesis+propagate+contradiction-check mechanism, but apply it at
// different decision axes:
//   - lookahead-branch-elim: prune position candidates
//   - gender-resolution: resolve gender mode of single-position pair
//
// Cost 4: requires lookahead (cloneState + propagate per gender mode).

function ts_tryGenderResolution(state, timeLimit) {
  const startTime = performance.now();
  const budget = timeLimit || 100;

  for (const pairIdx of state.activePairs) {
    const dom = state.domains[pairIdx];
    if (dom.positions.length !== 1) continue;
    const pos = dom.positions[0];
    if (pos.gender !== 'both') continue;

    if (performance.now() - startTime > budget) return null;

    let g1g2Valid = false, g2g1Valid = false;
    for (const mode of ['g1g2', 'g2g1']) {
      const sub = ts_cloneState(state);
      ts_decidePair(sub, pairIdx, pos, mode);
      ts_pruneByUsedCells(sub);
      ts_propagateBasic(sub, 50);
      const broken =
        sub.activePairs.some(i => sub.domains[i].positions.length === 0) ||
        ts_hintViolated(sub);
      if (!broken) {
        if (mode === 'g1g2') g1g2Valid = true;
        else g2g1Valid = true;
      }
    }

    let chosen = null;
    let premiseTag = null;
    if (g1g2Valid && !g2g1Valid) { chosen = 'g1g2'; premiseTag = 'g1g2-only-valid'; }
    else if (g2g1Valid && !g1g2Valid) { chosen = 'g2g1'; premiseTag = 'g2g1-only-valid'; }
    else if (g1g2Valid && g2g1Valid) { chosen = 'g1g2'; premiseTag = 'multi-solution-arbitrary-g1g2'; }
    else continue; // both invalid — let other patterns handle

    return {
      type: 'gender-resolution', cost: 4, pairIdx,
      premises: [`pair-${pairIdx}-dom1-both-${premiseTag}`],
      conclusion: { kind: 'pair-decided', position: pos, gender: chosen },
      domainBefore: 1, domainAfter: 1,
      branchingFactor: 2,
      apply(s) { ts_decidePair(s, pairIdx, pos, chosen); ts_pruneByUsedCells(s); }
    };
  }
  return null;
}

function ts_tryLookaheadBranchElimination(state, timeLimit) {
  const startTime = performance.now();
  const budget = timeLimit || 150;

  for (const pairIdx of state.activePairs) {
    const dom = state.domains[pairIdx];
    // Only try pairs with small but >1 domain — single-pair forcing requires
    // multiple candidates, and we cap at 4 to control time.
    if (dom.positions.length < 2 || dom.positions.length > 4) continue;

    const validPositionIndices = [];
    let invalidCount = 0;

    for (let posI = 0; posI < dom.positions.length; posI++) {
      // Check time budget
      if (performance.now() - startTime > budget) {
        // Time exhausted — abort without making changes (don't return partial result)
        return null;
      }
      const pos = dom.positions[posI];
      // For each gender mode, test if at least ONE leads to no contradiction
      const genders = pos.gender === 'both' ? ['g1g2', 'g2g1'] : [pos.gender];
      let posValid = false;
      for (const g of genders) {
        const sub = ts_cloneState(state);
        ts_decidePair(sub, pairIdx, pos, g);
        ts_pruneByUsedCells(sub);
        // Extended propagation — chains all non-hypothesis patterns (cost 1-4)
        // including bin-packing-force, cell-hidden-single, gender-resolution.
        // This is required for cascading inferences where the hypothesis only
        // surfaces a contradiction after a chain of cost-4 deductions
        // (e.g., decided pair triggers cell-hidden-single in another pair,
        // which then violates a line hint). Using only Basic propagation
        // would miss these, leaving puzzles like seed8 stuck despite having
        // a valid axiom-aware path forward.
        ts_propagateExtended(sub, 100);
        // CONTRADICTION CHECK (axiom-aware): a branch is invalid if either
        //   (a) some active pair has empty domain, OR
        //   (b) the decided pairs alone already violate a line hint
        // Case (b) catches scenarios where propagation forces decisions that
        // collectively exceed total/H1/H2 bounds — see seed6 row 0 H1 violation.
        const hasContradiction =
          sub.activePairs.some(i => sub.domains[i].positions.length === 0) ||
          ts_hintViolated(sub);
        if (!hasContradiction) {
          posValid = true;
          break; // at least one gender mode is valid for this position
        }
      }
      if (posValid) validPositionIndices.push(posI);
      else invalidCount++;
    }

    // If some candidates are invalid AND at least one is valid → prune
    // (If 0 valid, that's a global contradiction — let other patterns/lookahead detect it)
    if (invalidCount > 0 && validPositionIndices.length > 0 &&
        validPositionIndices.length < dom.positions.length) {
      const before = dom.positions.length;
      const survivors = validPositionIndices.map(i => dom.positions[i]);
      return {
        type: 'lookahead-branch-elim', cost: 4, pairIdx,
        premises: [`branch-contradiction-pruned-${invalidCount}-of-${before}`],
        conclusion: { kind: 'domain-pruned', from: before, to: survivors.length },
        domainBefore: before, domainAfter: survivors.length,
        branchingFactor: 2,
        apply(s) { s.domains[pairIdx].positions = survivors; }
      };
    }
  }
  return null;
}

function ts_trySingleLookahead(state, timeLimit) {
  for (const pairIdx of state.activePairs) {
    const dom = state.domains[pairIdx];
    if (dom.positions.length < 2 || dom.positions.length > 3) continue;
    const startTime = performance.now();
    const branches = [];
    let allFeasible = true;
    for (const pos of dom.positions) {
      const genders = pos.gender === 'both' ? ['g1g2', 'g2g1'] : [pos.gender];
      for (const g of genders) {
        const sub = ts_cloneState(state);
        ts_decidePair(sub, pairIdx, pos, g);
        ts_pruneByUsedCells(sub);
        // Extended propagation (cost 1-4 non-hypothesis chain). Single-
        // lookahead's value comes from finding decisions common across all
        // hypothesis branches — the more decisions each branch produces,
        // the more likely common decisions surface. Basic propagation
        // produces few decisions per branch and misses agreement. Extended
        // is recursion-safe because it only calls non-hypothesis patterns.
        ts_propagateExtended(sub, timeLimit ? timeLimit - (performance.now() - startTime) : 200);
        if (sub.activePairs.some(i => sub.domains[i].positions.length === 0) ||
            ts_hintViolated(sub)) {
          // contradiction — this branch invalid
          continue;
        }
        branches.push(sub);
        if (performance.now() - startTime > (timeLimit || 200)) { allFeasible = false; break; }
      }
      if (!allFeasible) break;
    }
    if (branches.length < 2) continue; // not enough branches to compare

    // Find common new decisions
    const commonDecisions = {};
    let firstBranch = branches[0];
    for (const k in firstBranch.decisions) {
      if (k in state.decisions) continue;
      const dec = firstBranch.decisions[k];
      let allAgree = branches.every(b => {
        const bd = b.decisions[k];
        if (!bd) return false;
        return bd.c1.row === dec.c1.row && bd.c1.col === dec.c1.col &&
               bd.c2.row === dec.c2.row && bd.c2.col === dec.c2.col &&
               bd.g1 === dec.g1 && bd.g2 === dec.g2;
      });
      if (allAgree) commonDecisions[k] = dec;
    }
    const commonKeys = Object.keys(commonDecisions);
    if (commonKeys.length === 0) continue;
    // Apply the first common decision as a step
    const k0 = commonKeys[0];
    const dec = commonDecisions[k0];
    const pos = { c1: dec.c1, c2: dec.c2, gender: 'g1g2' /* will be reset */ };
    const gender = (dec.g1 === 'male') ? 'g1g2' : 'g2g1';
    return {
      type: 'single-lookahead', cost: 5, pairIdx: parseInt(k0),
      premises: [`lookahead-from-pair-${pairIdx}`],
      conclusion: { kind: 'pair-decided', position: pos, gender },
      domainBefore: state.domains[k0].positions.length, domainAfter: 1,
      branchingFactor: dom.positions.length,
      apply(s) { ts_decidePair(s, parseInt(k0), pos, gender); ts_pruneByUsedCells(s); }
    };
  }
  return null;
}

// ─────────────────────────────────────────────────────────────────────────────
// PROPAGATION — apply level 0-1 patterns until fixed-point
// ─────────────────────────────────────────────────────────────────────────────
// Detect whether the current decisions ALONE already violate any hint.
// This is essential for lookahead-style contradiction detection: a hypothesis
// may propagate to additional decisions whose combined contribution exceeds
// the line's total/H1/H2 constraint, even though all active pairs still
// have non-empty domains.
//
// Why active-pair-empty-domain alone is insufficient:
//   - Hypothesis P=cand_x triggers cell-prune in pair Q
//   - Q's domain shrinks to 1; naked-single decides Q
//   - The combination of (P decided, Q decided, prior decisions) produces
//     row R total or H1 count > hint, but all OTHER active pairs are still
//     non-conflicting → no domain becomes 0
//   - The hypothesis is invalid but the simple check misses it
//
// This function compares the decided contribution to each hint bound. If
// already exceeded, the state is a contradiction.
function ts_hintViolated(state) {
  const counts = ts_lineCounts(state);
  for (const idxStr in state.rowHints) {
    const idx = parseInt(idxStr);
    for (const h of (state.rowHints[idx] || [])) {
      const cur = h.type === 'total' ? (counts.rowOcc[idx] || 0) :
                  h.type === 'H1'    ? (counts.rowMale[idx] || 0) :
                                       (counts.rowFemale[idx] || 0);
      if (cur > h.value) return true;
    }
  }
  for (const idxStr in state.colHints) {
    const idx = parseInt(idxStr);
    for (const h of (state.colHints[idx] || [])) {
      const cur = h.type === 'total' ? (counts.colOcc[idx] || 0) :
                  h.type === 'H1'    ? (counts.colMale[idx] || 0) :
                                       (counts.colFemale[idx] || 0);
      if (cur > h.value) return true;
    }
  }
  return false;
}

function ts_propagateBasic(state, timeLimitMs) {
  const startTime = performance.now();
  let changed = true;
  while (changed) {
    if (timeLimitMs && performance.now() - startTime > timeLimitMs) return;
    changed = false;
    if (ts_pruneByUsedCells(state)) changed = true;
    const step =
      ts_tryNakedSingle(state) ||
      ts_tryPositionLockedGender(state) ||
      ts_tryTotalSaturation(state) ||
      ts_tryTotalForcing(state) ||
      ts_tryGenderCountForcing(state) ||
      ts_tryImpossibilityDetection(state);
    if (step) {
      step.apply(state);
      changed = true;
    }
  }
}

// Extended propagation: Level 0-2 patterns (used by lookahead-family routines)
//
// MECE-aligned with the 11-pattern catalog: chains all non-hypothesis
// patterns (cost 1-4) so any decision/prune that does NOT itself require
// new hypothesis testing can fire freely inside this loop. Hypothesis-
// based patterns (lookahead-branch-elim, single-lookahead, multi-step-
// lookahead) are intentionally excluded — those are caller responsibility.
//
// Recursion safety: gender-resolution internally clones state and calls
// ts_propagateBasic. Because Basic and Extended are separate functions,
// no recursion arises (gender-resolution's inner call uses Basic only).
function ts_propagateExtended(state, timeLimitMs) {
  const startTime = performance.now();
  let changed = true;
  while (changed) {
    if (timeLimitMs && performance.now() - startTime > timeLimitMs) return;
    changed = false;
    if (ts_pruneByUsedCells(state)) changed = true;
    const step =
      // ─── MECE 11-pattern circuit (non-hypothesis subset, cost 1-4) ──
      // Cost 1: domain singletons
      ts_tryNakedSingle(state) ||
      ts_tryPositionLockedGender(state) ||
      // Cost 2: single-pair line constraints
      ts_tryTotalSaturation(state) ||
      ts_tryTotalForcing(state) ||
      ts_tryGenderCountForcing(state) ||
      ts_tryImpossibilityDetection(state) ||
      // Cost 4: multi-pair joint inference (envelope + cell-centric)
      ts_tryBinPackingForce(state) ||
      ts_tryCellHiddenSingle(state) ||
      // Cost 4: gender-mode disambiguation (formerly missing — restored
      // for catalog completeness; safe because internal call is Basic-only)
      ts_tryGenderResolution(state, 50);
    if (step) {
      step.apply(state);
      changed = true;
    }
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// LEVEL 3 EXTENSION — Multi-step Lookahead (cost 5)
// ─────────────────────────────────────────────────────────────────────────────
// Depth-2 hypothesis testing with Level 0-2 propagation in each branch.
// Find decisions common to all branches.
function ts_tryMultiStepLookahead(state, depth, timeLimit) {
  if (depth > 2) return null;
  const startTime = performance.now();

  for (const pairIdx of state.activePairs) {
    if (performance.now() - startTime > timeLimit) break;
    const dom = state.domains[pairIdx];
    if (dom.positions.length !== 2) continue;

    const branches = [];
    for (const pos of dom.positions) {
      const sub = ts_cloneState(state);
      const genderChoice = pos.gender === 'unknown' ? 'g1g2'
                         : pos.gender === 'g1g2' ? 'g1g2'
                         : pos.gender === 'g2g1' ? 'g2g1'
                         : 'g1g2';
      ts_decidePair(sub, pairIdx, pos, genderChoice);
      ts_pruneByUsedCells(sub);
      const remaining = timeLimit - (performance.now() - startTime);
      ts_propagateExtended(sub, Math.max(50, remaining / 4));
      const broken = sub.activePairs.some(i => sub.domains[i].positions.length === 0) ||
                     ts_hintViolated(sub);
      if (broken) continue;
      branches.push(sub);
    }
    if (branches.length < 2) continue;

    const common = ts_intersectBranchDecisions(state, branches);
    if (common.length > 0) {
      const dec = common[0];
      return {
        type: 'multi-step-lookahead', cost: 5, pairIdx: dec.pairIdx,
        premises: [`lookahead-depth-${depth}-from-pair-${pairIdx}`],
        conclusion: { kind: 'pair-decided', position: dec.position, gender: dec.gender },
        domainBefore: state.domains[dec.pairIdx].positions.length,
        domainAfter: 1,
        branchingFactor: dom.positions.length,
        apply(s) {
          ts_decidePair(s, dec.pairIdx, dec.position, dec.gender);
          ts_pruneByUsedCells(s);
        }
      };
    }
  }
  return null;
}

function ts_intersectBranchDecisions(originalState, branches) {
  const common = [];
  for (const pairIdx of originalState.activePairs) {
    let agreedPos = null, agreedGender = null;
    let allAgree = true;
    for (const branch of branches) {
      const bdom = branch.domains[pairIdx];
      if (bdom.positions.length !== 1) { allAgree = false; break; }
      const pos = bdom.positions[0];
      const gender = pos.gender === 'g1g2' ? 'g1g2' : 'g2g1';
      const posKey = `${pos.c1.row},${pos.c1.col}|${pos.c2.row},${pos.c2.col}|${gender}`;
      if (agreedPos === null) {
        agreedPos = posKey; agreedGender = gender;
      } else if (agreedPos !== posKey) { allAgree = false; break; }
    }
    if (allAgree && agreedPos !== null) {
      const branchDom = branches[0].domains[pairIdx];
      common.push({ pairIdx, position: branchDom.positions[0], gender: agreedGender });
    }
  }
  return common;
}

// ─────────────────────────────────────────────────────────────────────────────
// MAIN SOLVE LOOP
// ─────────────────────────────────────────────────────────────────────────────
function traceSolve(puzzle, options) {
  options = options || {};
  const timeLimit = options.timeLimitMs || 5000;
  const maxLookahead = options.maxLookaheadDepth ?? 1;
  const startTime = performance.now();

  const state = ts_initializeState(puzzle);
  const trace = [];

  // Initial used-cell prune
  ts_pruneByUsedCells(state);

  let stepCount = 0;
  while (!ts_isSolved(state)) {
    if (performance.now() - startTime > timeLimit) {
      return { status: 'timeout', trace, finalState: state, diagnostics: ts_computeDiagnostics(trace) };
    }
    if (stepCount++ > 1000) {
      return { status: 'too-many-steps', trace, finalState: state, diagnostics: ts_computeDiagnostics(trace) };
    }

    // Check for contradictions (any pair with empty domain)
    const contradicted = state.activePairs.some(i => state.domains[i].positions.length === 0);
    if (contradicted) {
      return { status: 'contradiction', trace, finalState: state, diagnostics: ts_computeDiagnostics(trace) };
    }

    const step =
      // ─── MECE 9-pattern circuit (실측 검증된 활성 회로) ───────────────
      // Cost 1: domain singletons
      ts_tryNakedSingle(state) ||
      // Cost 2: single-pair line constraints
      ts_tryTotalSaturation(state) ||
      ts_tryTotalForcing(state) ||
      ts_tryGenderCountForcing(state) ||
      ts_tryImpossibilityDetection(state) ||
      // Cost 4: multi-pair joint inference (envelope + cell-centric)
      ts_tryBinPackingForce(state) ||
      ts_tryCellHiddenSingle(state);

    if (step) {
      step.apply(state);
      trace.push(step);
      continue;
    }

    // Level 3 — lookahead
    if (maxLookahead >= 1) {
      const remaining = timeLimit - (performance.now() - startTime);
      // Gender resolution (cost 4 — disambiguate dom 1 + gender 'both')
      const genderStep = ts_tryGenderResolution(state, Math.min(100, remaining / 8));
      if (genderStep) {
        genderStep.apply(state);
        trace.push(genderStep);
        continue;
      }
      // Branch elimination (cost 4 — contradiction-driven prune)
      const elimStep = ts_tryLookaheadBranchElimination(state, Math.min(150, remaining / 6));
      if (elimStep) {
        elimStep.apply(state);
        trace.push(elimStep);
        continue;
      }
      // Then full lookahead (cost 5 — agreement-driven decision)
      const lookaheadStep = ts_trySingleLookahead(state, Math.min(300, remaining / 4));
      if (lookaheadStep) {
        lookaheadStep.apply(state);
        trace.push(lookaheadStep);
        continue;
      }
    }

    // Stuck — requires search
    return {
      status: 'requires-search', trace, finalState: state,
      diagnostics: ts_computeDiagnostics(trace),
    };
  }

  return {
    status: 'solved', trace, finalState: state,
    diagnostics: ts_computeDiagnostics(trace),
  };
}

// ─────────────────────────────────────────────────────────────────────────────
// Step 5 — traceSolve_v2: extended solver with Level 2-4 patterns
// ─────────────────────────────────────────────────────────────────────────────
// Adds Naked Triple, Box-Line Reduction, Adjacency Cut, and Multi-step
// Lookahead to the existing solver. Target cover rate 80%+.
// ─────────────────────────────────────────────────────────────────────────────
function traceSolve_v2(puzzle, options) {
  const o = Object.assign({
    timeLimitMs: 5000,
    maxLookaheadDepth: 1,
    enableLevel4: true,
    enableMultiStepLookahead: true,
  }, options || {});

  const state = ts_initializeState(puzzle);
  const trace = [];
  ts_pruneByUsedCells(state);

  const startTime = performance.now();
  let stepCount = 0;
  const MAX_STEPS = 1500;

  while (!ts_isSolved(state)) {
    if (performance.now() - startTime > o.timeLimitMs) {
      return { status: 'timeout', trace, finalState: state, diagnostics: ts_computeDiagnostics(trace) };
    }
    if (++stepCount > MAX_STEPS) {
      return { status: 'too-many-steps', trace, finalState: state, diagnostics: ts_computeDiagnostics(trace) };
    }
    if (state.activePairs.some(i => state.domains[i].positions.length === 0)) {
      return { status: 'contradiction', trace, finalState: state, diagnostics: ts_computeDiagnostics(trace) };
    }

    const step =
      // ─── MECE 9-pattern circuit (실측 검증된 활성 회로) ───────────────
      // Cost 1: domain singletons
      ts_tryNakedSingle(state) ||
      // Cost 2: single-pair line constraints
      ts_tryTotalSaturation(state) ||
      ts_tryTotalForcing(state) ||
      ts_tryGenderCountForcing(state) ||
      ts_tryImpossibilityDetection(state) ||
      // Cost 4: multi-pair joint inference (envelope + cell-centric)
      ts_tryBinPackingForce(state) ||
      ts_tryCellHiddenSingle(state);

    if (step) { step.apply(state); trace.push(step); continue; }

    if (o.maxLookaheadDepth >= 1) {
      const remaining = o.timeLimitMs - (performance.now() - startTime);
      // Gender resolution (cost 4 — disambiguate dom 1 + gender 'both')
      const genderStep = ts_tryGenderResolution(state, Math.min(100, Math.max(30, remaining / 8)));
      if (genderStep) { genderStep.apply(state); trace.push(genderStep); continue; }

      // Branch elimination (cost 4 — invalidate contradiction-causing candidates)
      const elim = ts_tryLookaheadBranchElimination(state, Math.min(150, Math.max(40, remaining / 6)));
      if (elim) { elim.apply(state); trace.push(elim); continue; }

      // Then full lookahead (cost 5 — find common decisions across branches)
      const single = ts_trySingleLookahead(state, Math.min(300, Math.max(50, remaining / 4)));
      if (single) { single.apply(state); trace.push(single); continue; }

      if (o.enableMultiStepLookahead && o.maxLookaheadDepth >= 2) {
        const multi = ts_tryMultiStepLookahead(state, 1, Math.min(500, Math.max(80, remaining / 3)));
        if (multi) { multi.apply(state); trace.push(multi); continue; }
      }
    }

    return { status: 'requires-search', trace, finalState: state, diagnostics: ts_computeDiagnostics(trace) };
  }

  return { status: 'solved', trace, finalState: state, diagnostics: ts_computeDiagnostics(trace) };
}

function ts_computeDiagnostics(trace) {
  if (trace.length === 0) {
    return { length: 0, totalCost: 0, maxCost: 0, patternCounts: {}, branchingPerStep: [], averageBranching: 1, uniquePatternTypes: 0 };
  }
  const patternCounts = {};
  for (const s of trace) {
    patternCounts[s.type] = (patternCounts[s.type] || 0) + 1;
  }
  const branching = trace.map(s => s.branchingFactor || 1);
  return {
    length: trace.length,
    totalCost: trace.reduce((s, st) => s + st.cost, 0),
    maxCost: Math.max(...trace.map(s => s.cost)),
    patternCounts,
    branchingPerStep: branching,
    averageBranching: branching.reduce((a, b) => a + b, 0) / branching.length,
    uniquePatternTypes: Object.keys(patternCounts).length,
  };
}

// =============================================================================
// SECTION 3.6 — TRACE DIFFICULTY METRIC
// =============================================================================
// Converts a trace's diagnostics into a single difficulty number, with optional
// shape analysis. Used by CDG (3.7) for puzzle scoring.
// =============================================================================

const TRACE_DIFFICULTY_TIERS = {
  Sprout:     { min: 5,   max: 20,  ideal: 12,  min_diversity: 0.30 },
  Easy:       { min: 18,  max: 40,  ideal: 28,  min_diversity: 0.45 },
  Medium:     { min: 35,  max: 65,  ideal: 50,  min_diversity: 0.55 },
  MediumPlus: { min: 60,  max: 95,  ideal: 75,  min_diversity: 0.60 },
  Hard:       { min: 90,  max: 160, ideal: 120, min_diversity: 0.65 },
  Custom:     { min: 0,   max: 999, ideal: 50,  min_diversity: 0.0  }, // permissive
};

function computeTraceDifficulty(diagnostics) {
  if (!diagnostics || diagnostics.length === 0) return 0;
  const L = diagnostics.length;
  const C = diagnostics.totalCost;
  const D = diagnostics.maxCost;
  const W = diagnostics.averageBranching;
  const rho = diagnostics.uniquePatternTypes / Math.max(1, L);
  const alpha = 0.5, beta = 1.0, gamma = 3.0, delta = 1.5, epsilon = 5.0;
  return alpha * L + beta * C + gamma * D * D + delta * W + epsilon * (1 / Math.max(0.1, rho));
}

// ─────────────────────────────────────────────────────────────────────────────
// V5 — Multi-axis difficulty metric
// ─────────────────────────────────────────────────────────────────────────────
// v4's metric reduces empirically to ~2.5·L (length-only) because cost
// distribution is narrow (1-2) and the diversity penalty (1/ρ) drives
// proportionally with L when patterns trigger uniformly.
//
// v5's metric adds three new axes that scale independently of L:
//   (a) advancedRatio — fraction of trace steps with cost ≥ 3
//   (b) axiomBreadth  — number of distinct axiom categories used
//   (c) monotonyPenalty — long streaks of the same cost reduce difficulty
//
// Each step of the trace has a `type` and `cost`. The AXIOM_CATEGORY_MAP
// classifies which Zoologic axioms each pattern type touches:
//   count    — A6 (Total) / A7 (H1) hint usage
//   gender   — A7 / gender-related rule
//   adjacency — A1+A2 (pair adjacency) reasoning
//   habitat  — A3 (habitat) constraint
//   diet     — A4 (diet) constraint
//   lineRule — A5 (line attribute rule) reasoning
//   inference — meta-level (lookahead, contradiction)
//
// Patterns with multiple categories signal use of multiple axioms — diverse
// reasoning. Trace breadth = size of the union over all step categories.
const AXIOM_CATEGORY_MAP = {
  'naked-single':            ['count'],
  'used-cell-elimination':   ['count'],   // (preserved for backward compat in any old saved trace)
  'position-locked-gender':  ['gender', 'lineRule'],
  'total-saturation':        ['count'],
  'total-forcing':           ['count'],
  'gender-count-forcing':    ['count', 'gender'],
  'impossibility-detection': ['count'],   // actually count-hint pruning
  'naked-pair':              ['adjacency'],
  'hidden-single':           ['count'],
  'habitat-combinatorial':   ['habitat', 'diet', 'lineRule'],   // V5
  'pair-adjacency-prop':     ['adjacency'],                       // V5
  'species-uniqueness':      ['habitat', 'diet', 'count'],        // V5
  'bin-packing-force':       ['count', 'multi-pair'],              // V5+ M1
  'cell-hidden-single':      ['count', 'multi-pair', 'cell-centric'], // V5+ N
  'lookahead-branch-elim':   ['inference', 'multi-pair', 'contradiction'], // NEW: branch elimination
  'gender-resolution':       ['inference', 'single-pair', 'gender-axis'], // NEW: gender disambiguation
  'multi-line-force':        ['count', 'multi-pair', 'multi-line'], // V5+ M2 (dead)
  'adjacency-cascade':       ['adjacency', 'multi-pair'],            // V5+ M3 (dead)
  'hidden-species-force':    ['habitat', 'diet', 'lineRule', 'count', 'multi-pair'], // V5+ M4 (dead)
  'cross-line-synergy':      ['count', 'multi-pair', 'multi-line'], // V5+ M5 (dead)
  'single-lookahead':        ['inference'],
  'multi-step-lookahead':    ['inference'],
};

function computeTraceDifficulty_v5(diagnostics, traceArr) {
  if (!diagnostics || diagnostics.length === 0) return 0;
  const L = diagnostics.length;
  const C = diagnostics.totalCost;
  const D = diagnostics.maxCost;

  // (a) Advanced ratio: fraction of steps with cost ≥ 3
  const advancedSteps = traceArr.filter(s => s.cost >= 3).length;
  const advancedRatio = advancedSteps / Math.max(1, L);

  // (b) Axiom breadth: number of distinct axiom categories invoked
  const usedAxioms = new Set();
  for (const step of traceArr) {
    const cats = AXIOM_CATEGORY_MAP[step.type] || [];
