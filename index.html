// =============================================================================

const ANIMALS = [

// ─────────────────────────────────────────────────────────────────────────────
// Difficulty Configs V2 — Q1-Q4 design reflected
// ─────────────────────────────────────────────────────────────────────────────
const DIFFICULTY_CONFIGS = {

    fixedTileCount: [3, 4],          // increased for symmetry breaking
    maxSolutions: 10,                 // Loose (≤10) — realistic for k=5

  },

    countCoverage: [12, 12],         // 12 lines, 100% — eliminates info-shortage bottleneck
    fixedTileCount: [3, 4],           // ≥ ruleCount max to anchor all rules
    maxSolutions: 20,                 // Loose (≤20)
    totalBudgetMs: 25000,
    verifyTimeLimitMs: 2500,
    maxAttempts: 2000,
    label: '중급', glyph: '🌳',
    subtitle: '규약 3-4개가 교차합니다',
  },
  Hard: {
    n: 7, k: 9, forbiddenCount: [3, 5],
    animalPoolRestriction: 'any',
    ruleCount: [3, 4],
    ruleDimensions: ['habitat', 'diet', 'gender'],
    countCoverage: [14, 14],         // 14 lines, 100% — eliminates info-shortage bottleneck
    fixedTileCount: [3, 4],           // ≥ ruleCount max to anchor all rules
    maxSolutions: 30,                 // Loose (≤30)
    totalBudgetMs: 45000,
    verifyTimeLimitMs: 4000,
    maxAttempts: 3000,
    label: '상급', glyph: '🏔',
    subtitle: '성별 규약까지 더해집니다',
  },
};

// =============================================================================
// SECTION 2 — ENGINE UTILS
// =============================================================================

function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function isAdjacent(c1, c2) {
  return Math.max(Math.abs(c1.row - c2.row), Math.abs(c1.col - c2.col)) === 1;
}

function getPartnerToken(tokenId, pairs) {
  for (const [t1, t2] of pairs) {
    if (t1 === tokenId) return t2;
    if (t2 === tokenId) return t1;
  }
  return null;
}

function getTokensInRow(r, tokens) { return tokens.filter(t => t.row === r); }
function getTokensInCol(c, tokens) { return tokens.filter(t => t.col === c); }

function animalById(id) { return ANIMALS.find(a => a.id === id); }

// =============================================================================
// SECTION 3 — 4-STAGE GENERATION PIPELINE
// =============================================================================

// ─────────────────────────────────────────────────────────────────────────────
// STAGE A: Design Rule Template — Constraint-First Generation
// ─────────────────────────────────────────────────────────────────────────────
function designRuleTemplate(config, animals) {
  const targetCount = randInt(config.ruleCount[0], config.ruleCount[1]);
  const dims = config.ruleDimensions;
  const n = config.n;

  // Enumerate all possible rules
  const allRules = [];
  for (let i = 0; i < n; i++) {
    for (const isRow of [true, false]) {
      for (const dim of dims) {
        if (dim === 'habitat') {
          for (const val of ['사바나', '극지', '해양', '숲']) {
            allRules.push({ isRow, idx: i, dim, val });
          }
        } else if (dim === 'diet') {
          for (const val of ['육식', '초식']) {
            allRules.push({ isRow, idx: i, dim, val });
          }
        } else if (dim === 'gender') {
          for (const val of ['male', 'female']) {
            allRules.push({ isRow, idx: i, dim, val });
          }
        }
      }
    }
  }

  // Try random combinations
  for (let attempt = 0; attempt < 60; attempt++) {
    const candidate = shuffle(allRules).slice(0, targetCount);

    // Check line uniqueness (no two rules on same line)
    const lines = new Set();
    let valid = true;
    for (const r of candidate) {
      const key = `${r.isRow ? 'r' : 'c'}${r.idx}`;
      if (lines.has(key)) { valid = false; break; }
      lines.add(key);
    }
    if (!valid) continue;

    // Check cross-cell feasibility
    if (!crossCellsFeasible(candidate, animals)) continue;

    return candidate.map((r, i) => ({ ...r, id: `rule-${i}` }));
  }
  return null;
}

function crossCellsFeasible(rules, animals) {
  // For row rule vs col rule pairs, check if their cross cell can hold any animal
  for (let i = 0; i < rules.length; i++) {
    for (let j = i + 1; j < rules.length; j++) {
      const r1 = rules[i], r2 = rules[j];
      if (r1.isRow === r2.isRow) continue;

      // They cross at one cell; compute compatible animals
      const compatible = animals.filter(a => {
        if (r1.dim !== 'gender' && a[r1.dim] !== r1.val) return false;
        if (r2.dim !== 'gender' && a[r2.dim] !== r2.val) return false;
        return true;
      });
      // Gender rules don't restrict species; always feasible for species
      // But if both are species dim (habitat/diet), need at least one compatible animal
      if (r1.dim !== 'gender' && r2.dim !== 'gender' && compatible.length === 0) {
        return false;
      }
    }
  }
  return true;
}

// ─────────────────────────────────────────────────────────────────────────────
// STAGE B: Constrained Adjacent Placement
// ─────────────────────────────────────────────────────────────────────────────
function constrainedAdjacentPlacement(config, ruleTemplate, forbiddenCells, animals) {
  const n = config.n;
  const k = config.k;
  const forbidden = new Set(forbiddenCells.map(([r, c]) => `${r},${c}`));

  // Build cell domains (which animals can be placed at each cell, given habitat/diet rules)
  const cellDomains = {};
  for (let r = 0; r < n; r++) {
    for (let c = 0; c < n; c++) {
      const key = `${r},${c}`;
      if (forbidden.has(key)) continue;

      let allowed = new Set(animals.map(a => a.id));
      for (const rule of ruleTemplate) {
        if (rule.dim === 'gender') continue; // gender rules applied post-placement
        const inLine = rule.isRow ? (rule.idx === r) : (rule.idx === c);
        if (inLine) {
          allowed = new Set([...allowed].filter(id => animalById(id)[rule.dim] === rule.val));
        }
      }
      if (allowed.size > 0) cellDomains[key] = allowed;
    }
  }

  // For animal pool restriction
  let animalPool = animals;
  if (config.animalPoolRestriction === 'same_habitat') {
    const habitats = ['사바나', '극지', '해양', '숲'];
    const viableHabitats = habitats.filter(h => animals.filter(a => a.habitat === h).length >= k);
    if (viableHabitats.length === 0) return null;
    const h = viableHabitats[randInt(0, viableHabitats.length - 1)];
    animalPool = animals.filter(a => a.habitat === h);
  }

  // Compute per-animal options (list of adjacent cell pairs this animal can occupy)
  const animalOptions = {};
  for (const animal of animalPool) {
    const options = [];
    const cellsForAnimal = Object.entries(cellDomains)
      .filter(([_, dom]) => dom.has(animal.id))
      .map(([key]) => {
        const [r, c] = key.split(',').map(Number);
        return { row: r, col: c, key };
      });

    for (const c1 of cellsForAnimal) {
      for (const c2 of cellsForAnimal) {
        if (c1.key >= c2.key) continue; // dedupe
        if (!isAdjacent(c1, c2)) continue;
        options.push([c1, c2]);
      }
    }
    animalOptions[animal.id] = options;
  }

  // Viable animals: those with at least one option
  const viable = animalPool.filter(a => animalOptions[a.id].length > 0);
  if (viable.length < k) return null;

  // Try selecting k animals and placing them
  for (let selAttempt = 0; selAttempt < 20; selAttempt++) {
    const selected = shuffle(viable).slice(0, k);
    // Sort by fewest options (MRV)
    selected.sort((a, b) => animalOptions[a.id].length - animalOptions[b.id].length);

    const used = new Set();
    const result = [];

    function place(idx) {
      if (idx === k) return true;
      const animal = selected[idx];
      const opts = shuffle(animalOptions[animal.id]);
      for (const [c1, c2] of opts) {
        if (used.has(c1.key) || used.has(c2.key)) continue;
        used.add(c1.key); used.add(c2.key);
        result.push([animal, c1, c2]);
        if (place(idx + 1)) return true;
        result.pop();
        used.delete(c1.key); used.delete(c2.key);
      }
      return false;
    }

    if (place(0)) {
      // Convert to tokens/pairs
      const tokens = [], pairs = [];
      for (let i = 0; i < result.length; i++) {
        const [animal, c1, c2] = result[i];
        const t1 = `t${i * 2}`, t2 = `t${i * 2 + 1}`;
        tokens.push({ id: t1, animalId: animal.id, row: c1.row, col: c1.col });
        tokens.push({ id: t2, animalId: animal.id, row: c2.row, col: c2.col });
        pairs.push([t1, t2]);
      }
      return { tokens, pairs };
    }
  }
  return null;
}

// ─────────────────────────────────────────────────────────────────────────────
// Gender Assignment Respecting Gender Rules
// ─────────────────────────────────────────────────────────────────────────────
function assignGendersWithRules(pairs, tokens, lineRules) {
  const genderRules = lineRules.filter(r => r.dim === 'gender');

  // Compute forced genders for tokens in gender-rule lines
  const forcedGender = {};
  for (const rule of genderRules) {
    const lineTokens = rule.isRow
      ? tokens.filter(t => t.row === rule.idx)
      : tokens.filter(t => t.col === rule.idx);
    for (const t of lineTokens) {
      if (forcedGender[t.id] && forcedGender[t.id] !== rule.val) {
        return null; // conflict
      }
      forcedGender[t.id] = rule.val;
    }
  }

  // Assign genders respecting forced and pair-constraint
  const marks = {};
  for (const [t1, t2] of pairs) {
    const f1 = forcedGender[t1];
    const f2 = forcedGender[t2];

    if (f1 && f2) {
      if (f1 === f2) return null; // pair can't have same gender
      marks[t1] = f1; marks[t2] = f2;
    } else if (f1) {
      marks[t1] = f1; marks[t2] = f1 === 'male' ? 'female' : 'male';
    } else if (f2) {
      marks[t2] = f2; marks[t1] = f2 === 'male' ? 'female' : 'male';
    } else {
      if (Math.random() < 0.5) { marks[t1] = 'male'; marks[t2] = 'female'; }
      else { marks[t1] = 'female'; marks[t2] = 'male'; }
    }
  }
  return marks;
}

// ─────────────────────────────────────────────────────────────────────────────
// STAGE C: Auxiliary Hints — Count hints + Fixed tiles
// ─────────────────────────────────────────────────────────────────────────────
function addAuxiliaryHints(placement, config, solution, lineRules, forbiddenCells) {
  const n = config.n;
  const tokens = placement.tokens;

  // Identify rule lines (these must have # hints for synergy)
  const ruleLineKeys = new Set(
    lineRules.map(r => `${r.isRow ? 'r' : 'c'}${r.idx}`)
  );

  // All lines
  const allLines = [];
  for (let i = 0; i < n; i++) {
    allLines.push({ isRow: true, idx: i });
    allLines.push({ isRow: false, idx: i });
  }

  // Priority: rule lines first, then others
  const priorityLines = allLines.filter(l =>
    ruleLineKeys.has(`${l.isRow ? 'r' : 'c'}${l.idx}`)
  );
  const otherLines = allLines.filter(l =>
    !ruleLineKeys.has(`${l.isRow ? 'r' : 'c'}${l.idx}`)
  );

  // Target count coverage
  const targetCount = randInt(config.countCoverage[0], config.countCoverage[1]);
  // Ensure priority lines all included
  const neededFromOthers = Math.max(0, targetCount - priorityLines.length);
  const selectedOthers = shuffle(otherLines).slice(0, neededFromOthers);
  const selectedLines = [...priorityLines, ...selectedOthers];

  // Build # hints (total + optional H1 gender count)
  const countHints = [];
  for (let i = 0; i < selectedLines.length; i++) {
    const line = selectedLines[i];
    const lineTokens = line.isRow
      ? getTokensInRow(line.idx, tokens)
      : getTokensInCol(line.idx, tokens);
    countHints.push({
      id: `cnt-${line.isRow ? 'r' : 'c'}${line.idx}`,
      type: 'total',
      row: line.isRow ? line.idx : null,
      col: line.isRow ? null : line.idx,
      value: lineTokens.length,
    });
    // H1 (male count) — adds critical information for pair permutation disambiguation
    // Skip when line already has gender-only rule (redundant) or empty
    const hasGenderRule = lineRules.some(r =>
      r.dim === 'gender' && r.isRow === line.isRow && r.idx === line.idx
    );
    if (lineTokens.length > 0 && !hasGenderRule) {
      const males = lineTokens.filter(t => solution[t.id] === 'male').length;
      countHints.push({
        id: `h1-${line.isRow ? 'r' : 'c'}${line.idx}`,
        type: 'H1',
        row: line.isRow ? line.idx : null,
        col: line.isRow ? null : line.idx,
        value: males,
      });
    }
  }

  // Fixed tiles — simple random selection.
  // (We deliberately do NOT prioritize rule lines; rule lines that get fully filled
  // with fixed tiles become "dead" lines with no player deductive work. The Stage D
  // validation in tryOneGeneration rejects such puzzles, retrying with different
  // fixed tiles until a valid layout is found.)
  const fixedCount = randInt(config.fixedTileCount[0], config.fixedTileCount[1]);
  const fixedTokens = shuffle(tokens).slice(0, fixedCount);
  const fixedCells = fixedTokens.map(t => ({
    row: t.row, col: t.col, animalId: t.animalId, gender: solution[t.id],
  }));
  const preMarks = Object.fromEntries(fixedTokens.map(t => [t.id, solution[t.id]]));

  return {
    n: config.n,
    forbiddenCells,
    tokens,
    pairs: placement.pairs,
    lineRules,
    countHints,
    fixedCells,
    preMarks,
  };
}

// ─────────────────────────────────────────────────────────────────────────────
// STAGE D: Timeboxed Solution Enumeration
// ─────────────────────────────────────────────────────────────────────────────
function enumerateSolutions(instance, animals, maxSolutions, timeLimitMs) {
  const startTime = performance.now();
  const n = instance.n;
  const pairs = instance.pairs;
  const tokens = instance.tokens;
  const k = pairs.length;

  const forbidden = new Set(instance.forbiddenCells.map(([r, c]) => `${r},${c}`));
  const rowRules = {}, colRules = {};
  for (const r of instance.lineRules) {
    if (r.isRow) (rowRules[r.idx] = rowRules[r.idx] || []).push(r);
    else (colRules[r.idx] = colRules[r.idx] || []).push(r);
  }
  const fixedByKey = {};
  for (const ft of instance.fixedCells) fixedByKey[`${ft.row},${ft.col}`] = ft;
  const rowHints = {}, colHints = {};
  for (const h of instance.countHints) {
    if (h.row !== null) (rowHints[h.row] = rowHints[h.row] || []).push(h);
    else (colHints[h.col] = colHints[h.col] || []).push(h);
  }

  function cellOk(row, col, animalId, gender) {
    const key = `${row},${col}`;
    if (forbidden.has(key)) return false;
    const ft = fixedByKey[key];
    if (ft) {
      if (ft.animalId !== animalId) return false;
      if (ft.gender !== gender) return false;
    }
    const animal = animalById(animalId);
    const rules = [...(rowRules[row] || []), ...(colRules[col] || [])];
    for (const rule of rules) {
      if (rule.dim === 'gender') {
        if (gender !== rule.val) return false;
      } else {
        if (animal[rule.dim] !== rule.val) return false;
      }
    }
    return true;
  }

  // Per-pair candidates (fixed in advance to speed up)
  const pairSpecies = pairs.map(([t1]) => tokens.find(t => t.id === t1).animalId);

  const pairCandidates = pairs.map((pair, pairIdx) => {
    const animalId = pairSpecies[pairIdx];
    const candidates = [];

    const fixedForSpecies = instance.fixedCells.filter(ft => ft.animalId === animalId);

    if (fixedForSpecies.length === 2) {
      const [a, b] = fixedForSpecies;
      if (isAdjacent(a, b) && a.gender !== b.gender) {
        candidates.push({
          c1key: `${a.row},${a.col}`, c2key: `${b.row},${b.col}`,
          c1row: a.row, c1col: a.col, c2row: b.row, c2col: b.col,
          g1: a.gender, g2: b.gender,
        });
      }
    } else if (fixedForSpecies.length === 1) {
      const ft = fixedForSpecies[0];
      const otherG = ft.gender === 'male' ? 'female' : 'male';
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (dr === 0 && dc === 0) continue;
          const r2 = ft.row + dr, c2 = ft.col + dc;
          if (r2 < 0 || r2 >= n || c2 < 0 || c2 >= n) continue;
          if (!cellOk(r2, c2, animalId, otherG)) continue;
          candidates.push({
            c1key: `${ft.row},${ft.col}`, c2key: `${r2},${c2}`,
            c1row: ft.row, c1col: ft.col, c2row: r2, c2col: c2,
            g1: ft.gender, g2: otherG,
          });
        }
      }
    } else {
      for (let r1 = 0; r1 < n; r1++) {
        for (let c1 = 0; c1 < n; c1++) {
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              if (dr === 0 && dc === 0) continue;
              const r2 = r1 + dr, c2 = c1 + dc;
              if (r2 < 0 || r2 >= n || c2 < 0 || c2 >= n) continue;
              const k1 = `${r1},${c1}`, k2 = `${r2},${c2}`;
              if (k1 >= k2) continue;
              for (const [g1, g2] of [['male', 'female'], ['female', 'male']]) {
                if (!cellOk(r1, c1, animalId, g1)) continue;
                if (!cellOk(r2, c2, animalId, g2)) continue;
                candidates.push({
                  c1key: k1, c2key: k2,
                  c1row: r1, c1col: c1, c2row: r2, c2col: c2,
                  g1, g2,
                });
              }
            }
          }
        }
      }
    }
    return candidates;
  });

  // Early termination if any pair has no candidates
  for (const cc of pairCandidates) {
    if (cc.length === 0) return { solutions: [], timedOut: false };
  }

  // MRV: order pairs by ascending candidate count
  const pairOrder = pairs.map((_, i) => i).sort((a, b) =>
    pairCandidates[a].length - pairCandidates[b].length
  );

  const used = new Set();
  const assignment = {};  // pairIdx -> candidate
  const solutions = [];
  let timedOut = false;

  function computeCounts(asgn) {
    const rowOcc = {}, rowMale = {}, rowFemale = {};
    const colOcc = {}, colMale = {}, colFemale = {};
    for (const pairIdx in asgn) {
      const a = asgn[pairIdx];
      rowOcc[a.c1row] = (rowOcc[a.c1row] || 0) + 1;
      rowOcc[a.c2row] = (rowOcc[a.c2row] || 0) + 1;
      colOcc[a.c1col] = (colOcc[a.c1col] || 0) + 1;
      colOcc[a.c2col] = (colOcc[a.c2col] || 0) + 1;
      const mk1 = a.g1 === 'male' ? rowMale : rowFemale;
      mk1[a.c1row] = (mk1[a.c1row] || 0) + 1;
      const mk2 = a.g2 === 'male' ? rowMale : rowFemale;
      mk2[a.c2row] = (mk2[a.c2row] || 0) + 1;
      const ck1 = a.g1 === 'male' ? colMale : colFemale;
      ck1[a.c1col] = (ck1[a.c1col] || 0) + 1;
      const ck2 = a.g2 === 'male' ? colMale : colFemale;
      ck2[a.c2col] = (ck2[a.c2col] || 0) + 1;
    }
    return { rowOcc, rowMale, rowFemale, colOcc, colMale, colFemale };
  }

  function checkHintsInProgress(asgn) {
    const c = computeCounts(asgn);
    for (const h of instance.countHints) {
      const isRow = h.row !== null;
      const idx = isRow ? h.row : h.col;
      let count;
      if (h.type === 'total') count = isRow ? (c.rowOcc[idx] || 0) : (c.colOcc[idx] || 0);
      else if (h.type === 'H1') count = isRow ? (c.rowMale[idx] || 0) : (c.colMale[idx] || 0);
      else if (h.type === 'H2') count = isRow ? (c.rowFemale[idx] || 0) : (c.colFemale[idx] || 0);
      else count = 0;
      if (count > h.value) return false;
    }
    return true;
  }

  function checkHintsFinal(asgn) {
    const c = computeCounts(asgn);
    for (const h of instance.countHints) {
      const isRow = h.row !== null;
      const idx = isRow ? h.row : h.col;
      let count;
      if (h.type === 'total') count = isRow ? (c.rowOcc[idx] || 0) : (c.colOcc[idx] || 0);
      else if (h.type === 'H1') count = isRow ? (c.rowMale[idx] || 0) : (c.colMale[idx] || 0);
      else if (h.type === 'H2') count = isRow ? (c.rowFemale[idx] || 0) : (c.colFemale[idx] || 0);
      else count = 0;
      if (count !== h.value) return false;
    }
    return true;
  }

  function backtrack(depth) {
    if (timedOut) return;
    if (performance.now() - startTime > timeLimitMs) { timedOut = true; return; }
    if (solutions.length >= maxSolutions + 1) return; // found one more than needed

    if (depth === k) {
      if (checkHintsFinal(assignment)) {
        solutions.push({ ...assignment });
      }
      return;
    }

    const pairIdx = pairOrder[depth];
    const candidates = pairCandidates[pairIdx];

    for (const cand of candidates) {
      if (used.has(cand.c1key) || used.has(cand.c2key)) continue;
      used.add(cand.c1key); used.add(cand.c2key);
      assignment[pairIdx] = cand;

      if (checkHintsInProgress(assignment)) {
        backtrack(depth + 1);
      }

      delete assignment[pairIdx];
      used.delete(cand.c1key); used.delete(cand.c2key);

      if (timedOut || solutions.length > maxSolutions) return;
    }
  }

  backtrack(0);
  return { solutions, timedOut };
}

// ─────────────────────────────────────────────────────────────────────────────
// Try one generation attempt — returns puzzle object or null
// ─────────────────────────────────────────────────────────────────────────────
function tryOneGeneration(levelKey, config, currentMaxSolutions, verifyTimeLimit) {
  // Stage A
  const ruleTemplate = designRuleTemplate(config, ANIMALS);
  if (!ruleTemplate) return null;

  // Forbidden cells
  const forbiddenCount = Array.isArray(config.forbiddenCount)
    ? randInt(config.forbiddenCount[0], config.forbiddenCount[1])
    : config.forbiddenCount;
  const allCells = [];
  for (let r = 0; r < config.n; r++)
    for (let c = 0; c < config.n; c++) allCells.push([r, c]);
  const forbiddenCells = shuffle(allCells).slice(0, forbiddenCount);

  // Stage B
  const placement = constrainedAdjacentPlacement(config, ruleTemplate, forbiddenCells, ANIMALS);
  if (!placement) return null;

  // Validate rule line coverage: every rule line must have ≥1 token
  // This prevents the confusing "#0 + line rule" combination
  for (const rule of ruleTemplate) {
    const tokensInLine = rule.isRow
      ? placement.tokens.filter(t => t.row === rule.idx)
      : placement.tokens.filter(t => t.col === rule.idx);
    if (tokensInLine.length === 0) return null; // retry
  }

  // Gender assignment respecting rules
  const solution = assignGendersWithRules(placement.pairs, placement.tokens, ruleTemplate);
  if (!solution) return null;

  // Stage C
  const instance = addAuxiliaryHints(placement, config, solution, ruleTemplate, forbiddenCells);

  // Validate rule lines have ≥1 NON-FIXED token.
  // A rule line is meaningful for the player only if they have to place at least one
  // tile there to satisfy it. If all tokens on a rule line are fixed tiles, the rule
  // is already satisfied before play begins — the line is effectively "#0" from the
  // player's perspective and the rule has no deductive function.
  const fixedTokenIds = new Set(Object.keys(instance.preMarks || {}));
  for (const rule of ruleTemplate) {
    const tokensInLine = rule.isRow
      ? placement.tokens.filter(t => t.row === rule.idx)
      : placement.tokens.filter(t => t.col === rule.idx);
    const nonFixedInLine = tokensInLine.filter(t => !fixedTokenIds.has(t.id));
    if (nonFixedInLine.length === 0) return null; // retry — no player action required on this line
  }

  // Stage D
  const { solutions, timedOut } = enumerateSolutions(
    instance, ANIMALS, currentMaxSolutions, verifyTimeLimit
  );

  const solutionCount = solutions.length;

  // Timeout with 0 solutions found: canonical is structurally valid but couldn't be
  // verified in time. Accept as flexible — at least canonical solution exists.
  if (solutionCount === 0) {
    if (!timedOut) return null; // genuine infeasibility (should be rare)
    return {
      ...instance,
      solution,
      level: levelKey,
      uniqueness: 'flexible',
      solutionCount: 0, // unknown; canonical is at least one
      timedOut: true,
    };
  }

  // Too many solutions — reject
  if (solutionCount > currentMaxSolutions) return null;

  // Classify uniqueness
  let uniqueness;
  if (timedOut) {
    // Found some solutions but didn't fully enumerate — classify as flexible
    uniqueness = 'flexible';
  } else if (solutionCount === 1) {
    uniqueness = 'strict';
  } else if (solutionCount <= 3) {
    uniqueness = 'loose';
  } else {
    uniqueness = 'flexible';
  }

  return {
    ...instance,
    solution,
    level: levelKey,
    uniqueness,
    solutionCount,
    timedOut,
  };
}

// ─────────────────────────────────────────────────────────────────────────────
// Main Generator — Async with Progressive Relaxation
// ─────────────────────────────────────────────────────────────────────────────
async function generatePuzzleAsync(level, onProgress) {
  const config = DIFFICULTY_CONFIGS[level];
  const startTime = performance.now();
  const BUDGET = config.totalBudgetMs;
  const MAX = config.maxSolutions;

  let attempt = 0;
  let bestResult = null;

  while (attempt < config.maxAttempts) {
    const elapsed = performance.now() - startTime;
    if (elapsed > BUDGET) break;

    // Progressive relaxation: start strict, escalate to full maxSolutions over time
    // Strict (1) attempts get priority in early budget; we relax as time runs out
    const pct = elapsed / BUDGET;
    let currentMaxSol;
    if (pct < 0.15) currentMaxSol = Math.min(1, MAX);
    else if (pct < 0.40) currentMaxSol = Math.min(3, MAX);
    else if (pct < 0.65) currentMaxSol = Math.min(10, MAX);
    else if (pct < 0.85) currentMaxSol = Math.min(20, MAX);
    else currentMaxSol = MAX;

    attempt++;

    if (attempt % 3 === 0) {
      onProgress && onProgress({
        attempts: attempt,
        elapsed,
        budget: BUDGET,
        currentMaxSolutions: currentMaxSol,
        level,
      });
      await new Promise(r => setTimeout(r, 0));
    }

    let result;
    try {
      result = tryOneGeneration(level, config, currentMaxSol, config.verifyTimeLimitMs);
    } catch (e) {
      console.error('Generation error:', e);
      continue;
    }

    if (!result) continue;

    // Strict (exactly 1 solution) — exit immediately, best possible
    if (result.solutionCount === 1 && !result.timedOut) {
      result.generationTime = performance.now() - startTime;
      result.attemptCount = attempt;
      return result;
    }

    // Compare results for bestResult (prefer lower solutionCount, but >0 beats 0)
    const betterThanBest = (() => {
      if (!bestResult) return true;
      // A non-zero count is better than 0 (which is "unknown/canonical only")
      if (result.solutionCount > 0 && bestResult.solutionCount === 0) return true;
      if (result.solutionCount === 0 && bestResult.solutionCount > 0) return false;
      // Both non-zero or both zero: prefer lower count
      return result.solutionCount < bestResult.solutionCount;
    })();
    if (betterThanBest) bestResult = result;

    // Early exit: if we have a Loose result (≤3) after 25% budget, accept
    if (bestResult && bestResult.solutionCount > 0 && bestResult.solutionCount <= 3 && elapsed > BUDGET * 0.25) {
      break;
    }
    // Early exit: if we have a Flexible result (≤10) after 50% budget, accept
    if (bestResult && bestResult.solutionCount > 0 && bestResult.solutionCount <= 10 && elapsed > BUDGET * 0.5) {
      break;
    }
    // Early exit: canonical-only (timedOut, solutionCount=0) is valid — accept after 50% budget
    if (bestResult && bestResult.solutionCount === 0 && elapsed > BUDGET * 0.5) {
      break;
    }
    // Early exit: if we have any valid result after 75% budget, accept
    if (bestResult && elapsed > BUDGET * 0.75) {
      break;
    }
  }

  if (bestResult) {
    bestResult.generationTime = performance.now() - startTime;
    bestResult.attemptCount = attempt;
    return bestResult;
  }

  // Last resort: fallback
  return loadFallback(level);
}

// =============================================================================
// SECTION 4 — RUNTIME VALIDATION (Constraint-Based Win)
// =============================================================================

function evaluateLineRuleRuntime(rule, placements, tokens, marks) {
  const inLine = (cell) => rule.isRow ? cell.row === rule.idx : cell.col === rule.idx;
  const placedTokenEntries = Object.entries(placements).filter(([_, cell]) => inLine(cell));
  if (placedTokenEntries.length === 0) return true; // empty line auto-satisfied

  return placedTokenEntries.every(([tid, _]) => {
    const t = tokens.find(t => t.id === tid);
    if (!t) return false;
    if (rule.dim === 'gender') {
      return marks[tid] === rule.val;
    }
    const animal = animalById(t.animalId);
    return animal[rule.dim] === rule.val;
  });
}

function evaluateCountHintRuntime(hint, placements, tokens, marks) {
  const lineTokens = Object.entries(placements).filter(([_, cell]) =>
    hint.row !== null ? cell.row === hint.row : cell.col === hint.col
  );
  if (hint.type === 'total') return lineTokens.length === hint.value;
  if (hint.type === 'H1') return lineTokens.filter(([tid]) => marks[tid] === 'male').length === hint.value;
  if (hint.type === 'H2') return lineTokens.filter(([tid]) => marks[tid] === 'female').length === hint.value;
  return true;
}

function checkAllPairsAdjacent(pairs, placements) {
  for (const [t1, t2] of pairs) {
    const p1 = placements[t1], p2 = placements[t2];
    if (!p1 || !p2) return false;
    if (!isAdjacent(p1, p2)) return false;
  }
  return true;
}

function checkWinV2(puzzle, placements, marks) {
  if (!puzzle) return false;
  const tokens = puzzle.tokens;

  if (Object.keys(placements).length !== tokens.length) return false;
  if (Object.keys(marks).length !== tokens.length) return false;

  // Pair gender constraint
  for (const [t1, t2] of puzzle.pairs) {
    if (!marks[t1] || !marks[t2]) return false;
    if (marks[t1] === marks[t2]) return false;
  }

  // Adjacency
  if (!checkAllPairsAdjacent(puzzle.pairs, placements)) return false;

  // Forbidden cells
  const fset = new Set(puzzle.forbiddenCells.map(([r, c]) => `${r},${c}`));
  for (const cell of Object.values(placements)) {
    if (fset.has(`${cell.row},${cell.col}`)) return false;
  }

  // Line rules (evaluated at current placement, not canonical)
  for (const rule of (puzzle.lineRules || [])) {
    if (!evaluateLineRuleRuntime(rule, placements, tokens, marks)) return false;
  }

  // Count hints
  for (const hint of (puzzle.countHints || [])) {
    if (!evaluateCountHintRuntime(hint, placements, tokens, marks)) return false;
  }

  // Fixed tiles must retain position + species + gender
  for (const ft of (puzzle.fixedCells || [])) {
    const tokenAtCell = Object.entries(placements).find(([_, p]) =>
      p.row === ft.row && p.col === ft.col
    );
    if (!tokenAtCell) return false;
    const [tid] = tokenAtCell;
    const t = tokens.find(t => t.id === tid);
    if (!t || t.animalId !== ft.animalId) return false;
    if (marks[tid] !== ft.gender) return false;
  }

  return true;
}

  const color = ok ? 'var(--accent-gold)' : 'var(--ink-secondary)';

  const border = ok ? '1px solid var(--accent-gold)' : '1px solid var(--border-soft)';
  return (
    <div title={`이 라인의 모든 동물은 ${label}`} style={{
      minWidth: 44, minHeight: 44, display: 'flex', alignItems: 'center', justifyContent: 'center',
      gap: 4, background: bg, border, borderRadius: 2, color,

    </div>
  );
}

  );
}

function PlacedTile({ token, animal, gender, onClick, onDragStart, isRecent, isPartnerPulse, isFixed, cellSize, isAdjacentToPartner, onImgError }) {
  const sym = gender === 'male' ? '♂' : gender === 'female' ? '♀' : '?';
  const symColor = gender === 'male' ? '#1E3A8A' : gender === 'female' ? '#9D174D' : 'var(--ink-tertiary)';
  const undecided = !gender;
  const tint = HABITAT_TINT[animal.habitat];
  const adjacencyBorder = isAdjacentToPartner === false ? '1.5px solid var(--danger)' : undefined;

  // Hover + long-press state for attribute overlay
  const [hoverActive, setHoverActive] = useState(false);   // only true after delay
  const [longPressed, setLongPressed] = useState(false);
  const hoverTimerRef = useRef(null);
  const pressTimerRef = useRef(null);
  const pressStartRef = useRef(null);
  const LONG_PRESS_MS = 350;
  const HOVER_DELAY_MS = 500;

  const startHover = useCallback(() => {
    if (hoverTimerRef.current) clearTimeout(hoverTimerRef.current);
    hoverTimerRef.current = setTimeout(() => {
      setHoverActive(true);
    }, HOVER_DELAY_MS);
  }, []);

  const cancelHover = useCallback(() => {
    if (hoverTimerRef.current) {
      clearTimeout(hoverTimerRef.current);
      hoverTimerRef.current = null;
    }
    setHoverActive(false);
  }, []);

  const startPress = useCallback(() => {
    pressStartRef.current = Date.now();
    pressTimerRef.current = setTimeout(() => {
      setLongPressed(true);
    }, LONG_PRESS_MS);
  }, []);

  const cancelPress = useCallback(() => {
    if (pressTimerRef.current) {
      clearTimeout(pressTimerRef.current);
      pressTimerRef.current = null;
    }
  }, []);

  const endPress = useCallback((e) => {
    cancelPress();
    const duration = pressStartRef.current ? Date.now() - pressStartRef.current : 0;
    pressStartRef.current = null;
    // Only trigger click if press was short (normal click, not long-press)
    if (duration < LONG_PRESS_MS && !longPressed) {
      if (onClick) onClick(e);
    }
    setLongPressed(false);
  }, [onClick, longPressed, cancelPress]);

  useEffect(() => {
    return () => {
      if (pressTimerRef.current) clearTimeout(pressTimerRef.current);
      if (hoverTimerRef.current) clearTimeout(hoverTimerRef.current);
    };
  }, []);

  const showOverlay = hoverActive || longPressed;

  return (
    <div
      draggable={!isFixed}
      onDragStart={(e) => {
        cancelPress();
        cancelHover();
        setLongPressed(false);
        if (onDragStart) onDragStart(e);
      }}
      onMouseEnter={startHover}
      onMouseLeave={() => { cancelHover(); cancelPress(); setLongPressed(false); }}
      onMouseDown={() => { cancelHover(); startPress(); }}
      onMouseUp={endPress}
      onTouchStart={startPress}
      onTouchEnd={endPress}
      onTouchCancel={() => { cancelPress(); setLongPressed(false); }}
      role="button"
      style={{
        width: cellSize, height: cellSize, borderRadius: 4,
        background: 'var(--bg-card)',
        border: adjacencyBorder || (isRecent ? '1.5px solid var(--ink-primary)' : '1px solid var(--border-soft)'),
        boxShadow: isPartnerPulse ? '0 0 0 4px rgba(180,83,9,0.22)' : '0 1px 2px rgba(0,0,0,0.04)',
        cursor: isFixed ? 'pointer' : 'grab',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        position: 'relative', overflow: 'hidden', userSelect: 'none',
        transition: 'box-shadow 300ms, border 180ms',
        animation: isRecent ? 'cellResolve 320ms cubic-bezier(0.4,0,0.2,1)' : 'none',
      }}
    >
      <div style={{ position: 'absolute', inset: 0, background: tint, opacity: 0.22, pointerEvents: 'none' }} />
      <div style={{ position: 'relative', width: '82%', height: '82%', opacity: undecided ? 0.5 : 1, filter: undecided ? 'grayscale(0.7)' : 'none', transition: 'opacity 220ms, filter 220ms', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        <img
          src={animalImgSrc(animal.id, gender)}
          alt={animal.name}
          draggable={false}
          onError={(e) => { e.target.style.display = 'none'; e.target.nextElementSibling.style.display = 'flex'; }}
          style={{ width: '100%', height: '100%', objectFit: 'contain', pointerEvents: 'none' }}
        />
        <div style={{ display: 'none', width: '100%', height: '100%', alignItems: 'center', justifyContent: 'center', fontSize: cellSize * 0.48 }}>
          {animal.emoji}
        </div>
      </div>
      {undecided && !showOverlay && (
        <div className="font-display" style={{ position: 'absolute', fontSize: cellSize * 0.38, color: 'var(--accent-gold)', fontWeight: 500, fontStyle: 'italic', textShadow: '0 1px 2px rgba(255,255,255,0.8)' }}>?</div>
      )}
      {gender && !showOverlay && (
        <div className="font-display" style={{
          position: 'absolute', bottom: 3, right: 4, fontSize: cellSize * 0.22, color: symColor,
          background: 'var(--bg-card)', borderRadius: 2,
          width: cellSize * 0.26, height: cellSize * 0.26, display: 'flex', alignItems: 'center', justifyContent: 'center',
          border: '1px solid var(--border-soft)', lineHeight: 1, fontWeight: 500,
        }}>{sym}</div>
      )}
      {isFixed && !showOverlay && (
        <div title="고정 타일" style={{ position: 'absolute', top: 3, left: 4, width: 7, height: 7, borderRadius: 999, background: 'var(--accent-gold)' }} />
      )}
      {showOverlay && <AttributeOverlay animal={animal} cellSize={cellSize} />}
    </div>
  );
}

            <line x1="0" y1="0" x2="0" y2="8" stroke="#D6D3D1" strokeWidth="2" />
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#hatchpat)" />

function QCandidateGrid({ candidates, capacity, cellSize, opacity }) {
  // Determine grid dimensions from capacity (4 = 2x2, 9 = 3x3)
  const dim = Math.ceil(Math.sqrt(capacity));
  // Mini-cell size: fit within parent cell with padding
  const padding = Math.max(6, cellSize * 0.10);
  const gap = 2;
  const innerSize = cellSize - padding * 2;
  const miniCellSize = (innerSize - gap * (dim - 1)) / dim;
  // Build cells array of length `capacity`, filled with {animalId, gender} or null
  const slots = new Array(capacity).fill(null);
  for (let i = 0; i < candidates.length && i < capacity; i++) slots[i] = candidates[i];
  return (
    <div style={{
      position: 'absolute', inset: padding, zIndex: 4,
      display: 'grid',
      gridTemplateColumns: `repeat(${dim}, 1fr)`,
      gridTemplateRows: `repeat(${dim}, 1fr)`,
      gap: `${gap}px`,
      pointerEvents: 'none',
      opacity: opacity !== undefined ? opacity : 0.6,
    }}>
      {slots.map((slot, i) => {
        if (!slot) {
          return (
            <div key={i} style={{
              background: 'rgba(255,255,255,0.4)',
              border: '1px dashed rgba(120,113,108,0.45)',
              borderRadius: 2,
            }} />
          );
        }
        const animal = animalById(slot.animalId);
        const gender = slot.gender || 'male';
        const genderSym = gender === 'male' ? '♂' : '♀';
        const genderColor = gender === 'male' ? '#1E3A8A' : '#9D174D';
        return (
          <div key={i} style={{
            background: 'rgba(255,255,255,0.75)',
            border: '1px solid rgba(120,113,108,0.5)',
            borderRadius: 2,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            overflow: 'hidden', position: 'relative',
          }}>
            <img
              src={animalImgSrc(animal.id, gender)}
              alt={animal.name}
              draggable={false}
              onError={(e) => { e.target.style.display = 'none'; e.target.nextElementSibling.style.display = 'flex'; }}
              style={{ width: '86%', height: '86%', objectFit: 'contain', pointerEvents: 'none' }}
            />
            <div style={{
              display: 'none', width: '100%', height: '100%',
              alignItems: 'center', justifyContent: 'center',
              fontSize: miniCellSize * 0.55,
            }}>{animal.emoji}</div>
            <div className="font-display" style={{
              position: 'absolute', bottom: 0, right: 1,
              fontSize: Math.max(8, miniCellSize * 0.24),
              color: genderColor, fontWeight: 600, lineHeight: 1,
              textShadow: '0 0 2px rgba(255,255,255,0.9)',
            }}>{genderSym}</div>
          </div>
        );
      })}
    </div>
  );
}

function QMarkOverlay({ candidates, capacity, cellSize, hasPlacedTile }) {
  // Unified overlay: renders over either empty Q-cell or Q-cell with placed tile.
  // Opacity values (higher = more opaque/visible):
  //   - empty Q-cell: candidates 0.8 (prominent, full note-card feel), "?" 0.3 (visible but secondary)
  //   - tile-occupied Q-cell: candidates 0.3 (faint, so real tile remains primary),
  //                           "?" 0.2 (subtle watermark), actual tile image stays at full opacity.
  // Layer order (low → high):
  //   1. (parent background or placed tile, outside this component)
  //   2. candidate mini-grid (zIndex 4)
  //   3. big "?" symbol (zIndex 5, topmost)
  const candidatesOpacity = hasPlacedTile ? 0.3 : 0.8;
  const questionOpacity = hasPlacedTile ? 0.2 : 0.3;
  return (
    <>
      <QCandidateGrid candidates={candidates || []} capacity={capacity || 4} cellSize={cellSize} opacity={candidatesOpacity} />
      <div className="font-display" style={{
        position: 'absolute', inset: 0, zIndex: 5,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        fontSize: cellSize * 0.72, fontStyle: 'italic', fontWeight: 600,
        color: 'var(--accent-gold)', opacity: questionOpacity,
        pointerEvents: 'none', userSelect: 'none', lineHeight: 1,
        textShadow: '0 0 8px rgba(255, 253, 247, 0.8)',
      }}>?</div>
    </>
  );
}

function DropCell({ size, row, col, isDropTarget, markState, qCandidates, qCapacity, onDragOver, onDragLeave, onDrop, onClick }) {

    bg = isDropTarget ? 'rgba(180,83,9,0.08)' : 'var(--bg-subtle)';

          <line x1="19" y1="5" x2="5" y2="19" stroke="#78716C" strokeWidth="2.2" strokeLinecap="round" />
        </svg>

        <div style={{ width: 4, height: 4, borderRadius: 999, background: 'var(--border-medium)' }} />

function PairAdjacencyLine({ from, to, cellSize, gap, valid }) {
  const cx = (c) => c * (cellSize + gap) + cellSize / 2;
  const cy = (r) => r * (cellSize + gap) + cellSize / 2;
  const x1 = cx(from.col), y1 = cy(from.row);
  const x2 = cx(to.col), y2 = cy(to.row);
  return (
    <line x1={x1} y1={y1} x2={x2} y2={y2}
      stroke={valid ? '#16A34A' : 'var(--danger)'}
      strokeWidth="2" strokeDasharray="3 3" opacity="0.7" strokeLinecap="round" />
  );
}

function Grid({ puzzle, placements, marks, cellMarks, qCandidates, qMarkCapacity, onCellClick, onEmptyCellClick, onCellDrop, onTokenDragStart, recentTokenId, partnerTokenId, winAnimating, dragState }) {
  const n = puzzle.n;
  const maxBoard = 560;
  const cellSize = Math.floor(Math.min(maxBoard / n, 86));
  const gap = 6;
  const boardPad = 20;
  const rowHintWidth = 140;
  const colHintHeight = 108;

  const forbiddenSet = new Set(puzzle.forbiddenCells.map(([r, c]) => `${r},${c}`));
  const placedMap = {};
  for (const [tokenId, cell] of Object.entries(placements)) {
    if (cell) placedMap[`${cell.row},${cell.col}`] = tokenId;
  }

  const rowRules = {}, colRules = {};
  for (const r of (puzzle.lineRules || [])) {
    if (r.isRow) (rowRules[r.idx] = rowRules[r.idx] || []).push(r);
    else (colRules[r.idx] = colRules[r.idx] || []).push(r);
  }
  const rowCountHints = {}, colCountHints = {};
  for (const h of (puzzle.countHints || [])) {
    if (h.row !== null) (rowCountHints[h.row] = rowCountHints[h.row] || []).push(h);
    else (colCountHints[h.col] = colCountHints[h.col] || []).push(h);
  }

  // Evaluate rules & counts runtime
  const ruleOk = {};
  for (const r of (puzzle.lineRules || [])) {
    ruleOk[r.id] = evaluateLineRuleRuntime(r, placements, puzzle.tokens, marks);
  }
  const countOk = {}, countOver = {};
  for (const h of (puzzle.countHints || [])) {
    const lineEntries = Object.entries(placements).filter(([_, cell]) =>
      h.row !== null ? cell.row === h.row : cell.col === h.col
    );
    let current;
    if (h.type === 'total') current = lineEntries.length;
    else if (h.type === 'H1') current = lineEntries.filter(([tid]) => marks[tid] === 'male').length;
    else if (h.type === 'H2') current = lineEntries.filter(([tid]) => marks[tid] === 'female').length;
    countOk[h.id] = current === h.value;
    countOver[h.id] = current > h.value;
  }

  const pairAdj = {};
  for (const [t1, t2] of puzzle.pairs) {
    const p1 = placements[t1], p2 = placements[t2];
    if (p1 && p2) pairAdj[t1] = pairAdj[t2] = isAdjacent(p1, p2);
  }

  const cellContent = (r, c, idx) => {
    const key = `${r},${c}`;
    if (forbiddenSet.has(key)) return <ForbiddenCell size={cellSize} />;
    const tid = placedMap[key];
    if (tid) {
      const tok = puzzle.tokens.find(t => t.id === tid);
      const animal = animalById(tok.animalId);
      const isRecent = recentTokenId === tok.id;
      const isPartnerPulse = partnerTokenId === tok.id;
      const isFixed = !!(puzzle.preMarks && puzzle.preMarks[tok.id]);
      const adj = pairAdj[tok.id];
      const isDropTarget = dragState.over === key;
      // Q-mark overlay applies even on tiles that have been placed on Q-marked cells
      const cellIsQ = cellMarks && cellMarks[key] === 'Q';
      const cellQCands = cellIsQ && qCandidates ? qCandidates[key] : undefined;
      return (
        <div
          onDragOver={(e) => { e.preventDefault(); onCellDrop('over', r, c); }}
          onDragLeave={() => onCellDrop('leave', r, c)}
          onDrop={(e) => { e.preventDefault(); onCellDrop('drop', r, c); }}
          style={{
            animation: winAnimating ? `celebrationWave 700ms cubic-bezier(0.4,0,0.2,1) ${idx * 55}ms both` : 'none',
            position: 'relative',
            boxShadow: isDropTarget ? '0 0 0 2px var(--accent-gold)' : 'none',
            borderRadius: 4,
            transition: 'box-shadow 140ms',
          }}
        >
          <PlacedTile
            token={tok} animal={animal} gender={marks[tok.id] || null}
            onClick={() => onCellClick(tok.id)}
            onDragStart={(e) => onTokenDragStart(e, tok.id)}
            isRecent={isRecent} isPartnerPulse={isPartnerPulse}
            isFixed={isFixed} cellSize={cellSize}
            isAdjacentToPartner={adj}
          />
          {cellIsQ && (
            <QMarkOverlay candidates={cellQCands} capacity={qMarkCapacity} cellSize={cellSize} hasPlacedTile={true} />
          )}
        </div>
      );
    }
    const isDropTarget = dragState.over === key;
    const markState = cellMarks ? cellMarks[key] : undefined;
    const qCands = qCandidates ? qCandidates[key] : undefined;
    return (
      <DropCell
        size={cellSize} row={r} col={c}
        isDropTarget={isDropTarget}
        markState={markState}
        qCandidates={qCands}
        qCapacity={qMarkCapacity}
        onDragOver={(e) => { e.preventDefault(); onCellDrop('over', r, c); }}
        onDragLeave={() => onCellDrop('leave', r, c)}
        onDrop={(e) => { e.preventDefault(); onCellDrop('drop', r, c); }}
        onClick={() => onEmptyCellClick && onEmptyCellClick(r, c)}
      />
    );
  };

  const rowsArr = Array.from({ length: n }, (_, i) => i);
  const colsArr = Array.from({ length: n }, (_, i) => i);

  return (
    <div style={{ padding: '4px 40px 20px', display: 'flex', justifyContent: 'center' }}>
      <div style={{
        position: 'relative', display: 'inline-block', padding: boardPad, background: 'var(--bg-card)',
        border: '1px solid var(--border-soft)', borderRadius: 3,
        boxShadow: '0 1px 0 rgba(0,0,0,0.02), 0 12px 32px -16px rgba(60, 50, 30, 0.15)',
      }}>
        {/* Column headers */}
        <div style={{ display: 'flex', gap, marginBottom: gap, paddingLeft: rowHintWidth + gap, minHeight: colHintHeight }}>
          {colsArr.map(c => (
            <div key={c} style={{ width: cellSize, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'flex-end', gap: 3 }}>
              {(colRules[c] || []).map(r => (
                <LineRuleBadge key={r.id} rule={r} ok={ruleOk[r.id]} />
              ))}
              {(colCountHints[c] || []).map(h => (
                <CountHintBadge key={h.id} hint={h} ok={countOk[h.id]} over={countOver[h.id]} />
              ))}
            </div>
          ))}
        </div>
        {rowsArr.map(r => (
          <div key={r} style={{ display: 'flex', gap, marginBottom: gap }}>
            <div style={{ width: rowHintWidth, minHeight: cellSize, display: 'flex', flexDirection: 'row', alignItems: 'center', justifyContent: 'flex-end', gap: 3, paddingRight: 4, flexWrap: 'wrap' }}>
              {(rowRules[r] || []).map(rr => (
                <LineRuleBadge key={rr.id} rule={rr} ok={ruleOk[rr.id]} />
              ))}
              {(rowCountHints[r] || []).map(h => (
                <CountHintBadge key={h.id} hint={h} ok={countOk[h.id]} over={countOver[h.id]} />
              ))}
            </div>
            {colsArr.map(c => (<div key={c}>{cellContent(r, c, r * n + c)}</div>))}
          </div>
        ))}
        {/* Adjacency SVG overlay */}
        <svg style={{
          position: 'absolute',
          left: boardPad + rowHintWidth + gap,
          top: boardPad + colHintHeight + gap,
          width: n * cellSize + (n - 1) * gap,
          height: n * cellSize + (n - 1) * gap,
          pointerEvents: 'none',
          overflow: 'visible',
        }}>
          {puzzle.pairs.map(([t1, t2]) => {
            const p1 = placements[t1], p2 = placements[t2];
            if (!p1 || !p2) return null;
            const valid = isAdjacent(p1, p2);
            return (
              <PairAdjacencyLine key={t1} from={p1} to={p2} cellSize={cellSize} gap={gap} valid={valid} />
            );
          })}
        </svg>
      </div>
    </div>
  );
}

function HandPool({ puzzle, placements, marks, onTokenDragStart, onDropToHand, dragState }) {
  if (!puzzle) return null;
  const unplaced = puzzle.tokens.filter(t => !placements[t.id]);
  const groups = {};
  for (const t of unplaced) { (groups[t.animalId] = groups[t.animalId] || []).push(t); }
  const entries = Object.entries(groups);

  return (
    <div
      onDragOver={(e) => { e.preventDefault(); onDropToHand('over'); }}
      onDragLeave={() => onDropToHand('leave')}
      onDrop={(e) => { e.preventDefault(); onDropToHand('drop'); }}
      style={{
        margin: '0 40px 20px', padding: '18px 20px', minHeight: 100,
        background: dragState.overHand ? 'rgba(180,83,9,0.05)' : 'var(--bg-subtle)',
        border: dragState.overHand ? '1px dashed var(--accent-gold)' : '1px solid var(--border-soft)',
        borderRadius: 3, transition: 'all 160ms',
      }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 12 }}>
        <div className="font-body" style={{ fontSize: 11, letterSpacing: '0.14em', textTransform: 'uppercase', color: 'var(--ink-tertiary)', fontWeight: 500 }}>
          Hand · 손패
        </div>
        <div className="font-mono" style={{ fontSize: 11, color: 'var(--ink-tertiary)' }}>
          {unplaced.length > 0 ? `${unplaced.length}마리 대기` : '모든 토큰이 배치됨'}
        </div>
      </div>
      {unplaced.length === 0 ? (
        <div style={{ padding: '20px 0', textAlign: 'center', color: 'var(--ink-tertiary)', fontSize: 13, fontStyle: 'italic' }} className="font-display">
          타일 클릭으로 성별 순환 · 짝은 상하좌우대각선 이웃이어야 합니다
        </div>
      ) : (
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 14 }}>
          {entries.map(([aid, toks]) => {
            const animal = animalById(parseInt(aid));
            return (
              <div key={aid} style={{
                display: 'flex', alignItems: 'center', gap: 8, background: 'var(--bg-card)',
                padding: '8px 10px', border: '1px solid var(--border-soft)', borderRadius: 3,
              }}>
                <div style={{ display: 'flex', gap: 4 }}>
                  {toks.map((t, i) => {
                    // Determine display gender (priority order):
                    //   1. If this token has an explicit mark, use it
                    //   2. If partner has a mark, show OPPOSITE
                    //   3. Both tokens in hand, no marks: fall back to index (0→♂, 1→♀)
                    //   4. Otherwise default male
                    let gender;
                    if (marks[t.id]) {
                      gender = marks[t.id];
                    } else {
                      const partnerId = getPartnerToken(t.id, puzzle.pairs);
                      const partnerMark = partnerId && marks[partnerId];
                      if (partnerMark) {
                        gender = partnerMark === 'male' ? 'female' : 'male';
                      } else if (toks.length === 2) {
                        gender = i === 0 ? 'male' : 'female';
                      } else {
                        gender = 'male';
                      }
                    }
                    const sym = gender === 'male' ? '♂' : '♀';
                    const symColor = gender === 'male' ? '#1E3A8A' : '#9D174D';
                    return (
                      <div key={t.id} draggable
                        onDragStart={(e) => onTokenDragStart(e, t.id, gender)}
                        style={{
                          width: 58, height: 58, background: 'var(--bg-card)',
                          border: '1px solid var(--border-medium)', borderRadius: 4,
                          cursor: 'grab', position: 'relative',
                          display: 'flex', alignItems: 'center', justifyContent: 'center',
                          transition: 'transform 180ms, box-shadow 180ms',
                          opacity: dragState.tokenId === t.id ? 0.4 : 1,
                        }}>
                        <div style={{ position: 'absolute', inset: 0, background: HABITAT_TINT[animal.habitat], opacity: 0.22, borderRadius: 4 }} />
                        <img src={animalImgSrc(animal.id, gender)} alt={animal.name} draggable={false}
                          onError={(e) => { e.target.style.display = 'none'; e.target.nextElementSibling.style.display = 'flex'; }}
                          style={{ width: '80%', height: '80%', objectFit: 'contain', position: 'relative' }} />
                        <div style={{ display: 'none', fontSize: 26, position: 'relative' }}>
                          {animal.emoji}
                        </div>
                        <div className="font-display" style={{
                          position: 'absolute', bottom: 1, right: 2, fontSize: 10, color: symColor,
                          background: 'var(--bg-card)', borderRadius: 2,
                          width: 14, height: 14, display: 'flex', alignItems: 'center', justifyContent: 'center',
                          border: '1px solid var(--border-soft)', lineHeight: 1, fontWeight: 500,
                        }}>{sym}</div>
                      </div>
                    );
                  })}
                </div>
                <div style={{ display: 'flex', flexDirection: 'column' }}>
                  <div className="font-display" style={{ fontSize: 13, fontWeight: 500, color: 'var(--ink-primary)', lineHeight: 1.2 }}>{animal.name}</div>
                  <div className="font-mono" style={{ fontSize: 10, color: 'var(--ink-tertiary)', letterSpacing: '0.04em' }}>
                    {animal.habitat} · {animal.diet}
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );

// =============================================================================
// SECTION 7 — APP STATE (Reducer)
// =============================================================================

function reducer(state, action) {
  switch (action.type) {
    case 'PUZZLE_READY': {
      const placements = {};
      const preMarks = action.puzzle.preMarks || {};
      for (const t of action.puzzle.tokens) {
        if (preMarks[t.id]) placements[t.id] = { row: t.row, col: t.col };
      }
      return {
        ...state, puzzle: action.puzzle, placements, marks: { ...preMarks },
        cellMarks: {}, qCandidates: {},
        isGenerating: false, isSolved: false,
        recentTokenId: null, partnerTokenId: null, showWin: false,
        level: action.level ?? state.level,
        generationProgress: null,
        dragState: { tokenId: null, over: null, overHand: false },
      };
    }
    case 'START_GENERATING':
      return { ...state, isGenerating: true, level: action.level ?? state.level, generationProgress: null };
    case 'GENERATION_PROGRESS':
      return { ...state, generationProgress: action.progress };
    case 'CYCLE_CELL_MARK': {
      // 3-state cycle: empty → X → Q → empty
      const key = `${action.row},${action.col}`;
      const cur = state.cellMarks[key]; // undefined | 'X' | 'Q'
      const next = cur === undefined ? 'X' : cur === 'X' ? 'Q' : undefined;
      const newMarks = { ...state.cellMarks };
      if (next === undefined) delete newMarks[key];
      else newMarks[key] = next;
      // Reset Q candidates when entering Q state or leaving Q state
      const newQCandidates = { ...state.qCandidates };
      if (cur === 'Q' || next === 'Q') delete newQCandidates[key];
      return { ...state, cellMarks: newMarks, qCandidates: newQCandidates };
    }
    case 'ENQUEUE_Q_CANDIDATE': {
      // Add a {animalId, gender} pair to Q-mark cell's FIFO candidate list.
      // Male and female of same species are tracked as independent entries
      // (24 distinct candidates: 12 species × 2 genders).
      const key = `${action.row},${action.col}`;
      if (state.cellMarks[key] !== 'Q') return state;
      const cur = state.qCandidates[key] || [];
      const gender = action.gender || 'male';
      // Dedup on (animalId, gender) pair
      if (cur.some(c => c.animalId === action.animalId && c.gender === gender)) return state;
      const QCAP = state.qMarkCapacity || 4;
      const next = [...cur, { animalId: action.animalId, gender }];
      // FIFO: if exceeds cap, drop oldest
      while (next.length > QCAP) next.shift();
      return { ...state, qCandidates: { ...state.qCandidates, [key]: next } };
    }
    case 'TOGGLE_MARK': {
      if (state.isSolved) return state;
      if (!state.placements[action.tokenId]) return state;
      if (state.puzzle.preMarks && state.puzzle.preMarks[action.tokenId]) return state;
      // If partner is a fixed tile with a forced gender, this token's gender is also locked
      const partnerId = getPartnerToken(action.tokenId, state.puzzle.pairs);
      const partnerIsFixed = partnerId && state.puzzle.preMarks && state.puzzle.preMarks[partnerId];
      if (partnerIsFixed) return state; // cannot toggle — gender is determined by fixed partner
      const cur = state.marks[action.tokenId] || null;
      const next = cur === null ? 'male' : cur === 'male' ? 'female' : null;
      const newMarks = { ...state.marks };
      // Update partner gender in sync regardless of whether partner is on board or in hand.
      // This ensures the hand-pool visual gender instantly mirrors the grid tile's toggle.
      const partnerEditable = partnerId && !partnerIsFixed;
      if (next === null) {
        delete newMarks[action.tokenId];
        if (partnerEditable) delete newMarks[partnerId];
      } else {
        newMarks[action.tokenId] = next;
        if (partnerEditable) {
          newMarks[partnerId] = next === 'male' ? 'female' : 'male';
        }
      }
      return {
        ...state, marks: newMarks, recentTokenId: action.tokenId,
        partnerTokenId: (partnerId && state.placements[partnerId]) ? partnerId : null,
      };
    }
    case 'DRAG_START': {
      const newState = { ...state, dragState: { ...state.dragState, tokenId: action.tokenId } };
      // If the drag originated from hand with an explicit gender hint, confirm it on the token
      // AND on the partner (as opposite gender). Do not overwrite existing marks.
      if (action.assignGender && !state.marks[action.tokenId]) {
        const newMarks = { ...state.marks };
        newMarks[action.tokenId] = action.assignGender;
        // Auto-assign opposite gender to partner if partner is placed and has no mark yet
        const partnerId = getPartnerToken(action.tokenId, state.puzzle.pairs);
        const partnerIsFixed = partnerId && state.puzzle.preMarks && state.puzzle.preMarks[partnerId];
        if (partnerId && state.placements[partnerId] && !newMarks[partnerId] && !partnerIsFixed) {
          newMarks[partnerId] = action.assignGender === 'male' ? 'female' : 'male';
        }
        newState.marks = newMarks;
      }
      return newState;
    }
    case 'DRAG_OVER_CELL':
      return { ...state, dragState: { ...state.dragState, over: `${action.row},${action.col}` } };
    case 'DRAG_LEAVE_CELL':
      if (state.dragState.over === `${action.row},${action.col}`) {
        return { ...state, dragState: { ...state.dragState, over: null } };
      }
      return state;
    case 'DRAG_OVER_HAND':
      return { ...state, dragState: { ...state.dragState, overHand: true } };
    case 'DRAG_LEAVE_HAND':
      return { ...state, dragState: { ...state.dragState, overHand: false } };
    case 'DRAG_END':
      return { ...state, dragState: { tokenId: null, over: null, overHand: false } };
    case 'PLACE_TOKEN': {
      const { tokenId, row, col } = action;
      if (!tokenId) return { ...state, dragState: { tokenId: null, over: null, overHand: false } };
      const forbidden = new Set(state.puzzle.forbiddenCells.map(([r, c]) => `${r},${c}`));
      if (forbidden.has(`${row},${col}`)) return { ...state, dragState: { tokenId: null, over: null, overHand: false } };
      // Block drop on X-marked cells
      const destKey = `${row},${col}`;
      if (state.cellMarks[destKey] === 'X') {
        return { ...state, dragState: { tokenId: null, over: null, overHand: false } };
      }
      const occupant = Object.entries(state.placements).find(([, p]) => p && p.row === row && p.col === col);
      if (occupant && state.puzzle.preMarks && state.puzzle.preMarks[occupant[0]]) {
        return { ...state, dragState: { tokenId: null, over: null, overHand: false } };
      }
      const newPlacements = { ...state.placements };
      let displaced = null;
      for (const [tid, cell] of Object.entries(newPlacements)) {
        if (cell && cell.row === row && cell.col === col) { displaced = tid; break; }
      }
      const prev = newPlacements[tokenId];
      newPlacements[tokenId] = { row, col };
      if (displaced) {
        if (prev) newPlacements[displaced] = prev;
        else delete newPlacements[displaced];
      }
      // If partner is a fixed tile, auto-assign opposite gender to this token
      const newMarks = { ...state.marks };
      const partnerId = getPartnerToken(tokenId, state.puzzle.pairs);
      const partnerFixedGender = partnerId && state.puzzle.preMarks && state.puzzle.preMarks[partnerId];
      if (partnerFixedGender && !newMarks[tokenId]) {
        newMarks[tokenId] = partnerFixedGender === 'male' ? 'female' : 'male';
      }

      // Q-mark candidate tracking:
      //  - If destination is Q-marked, enqueue this token's {animalId, gender}
      //  - If displaced to source (swap), enqueue the displaced token's {animalId, gender} at source if source is Q-marked
      //  - Male and female of same species are tracked as independent entries
      //  - Tokens without a confirmed gender ("?" state) are NOT registered
      const newQCandidates = { ...state.qCandidates };
      const QCAP = state.qMarkCapacity || 4;
      const droppedAnimal = state.puzzle.tokens.find(t => t.id === tokenId);
      const droppedGender = newMarks[tokenId]; // only register if gender is confirmed
      if (state.cellMarks[destKey] === 'Q' && droppedAnimal && droppedGender) {
        const curList = newQCandidates[destKey] || [];
        const alreadyExists = curList.some(c => c.animalId === droppedAnimal.animalId && c.gender === droppedGender);
        if (!alreadyExists) {
          const nextList = [...curList, { animalId: droppedAnimal.animalId, gender: droppedGender }];
          while (nextList.length > QCAP) nextList.shift();
          newQCandidates[destKey] = nextList;
        }
      }
      // Swap case: if displaced tile was moved to `prev` cell, and that cell is Q-marked,
      // register displaced animal (with its gender) there — only if gender confirmed
      if (displaced && prev) {
        const prevKey = `${prev.row},${prev.col}`;
        if (state.cellMarks[prevKey] === 'Q') {
          const dispAnimal = state.puzzle.tokens.find(t => t.id === displaced);
          const dispGender = state.marks[displaced]; // only register if confirmed
          if (dispAnimal && dispGender) {
            const curList = newQCandidates[prevKey] || [];
            const alreadyExists = curList.some(c => c.animalId === dispAnimal.animalId && c.gender === dispGender);
            if (!alreadyExists) {
              const nextList = [...curList, { animalId: dispAnimal.animalId, gender: dispGender }];
              while (nextList.length > QCAP) nextList.shift();
              newQCandidates[prevKey] = nextList;
            }
          }
        }
      }

      return {
        ...state, placements: newPlacements, marks: newMarks,
        qCandidates: newQCandidates,
        dragState: { tokenId: null, over: null, overHand: false },
        recentTokenId: tokenId,
      };
    }
    case 'RETURN_TO_HAND': {
      const { tokenId } = action;
      if (!tokenId) return { ...state, dragState: { tokenId: null, over: null, overHand: false } };
      if (state.puzzle.preMarks && state.puzzle.preMarks[tokenId]) {
        return { ...state, dragState: { tokenId: null, over: null, overHand: false } };
      }
      const newPlacements = { ...state.placements };
      const newMarks = { ...state.marks };
      delete newPlacements[tokenId];
      delete newMarks[tokenId];
      return {
        ...state, placements: newPlacements, marks: newMarks,
        dragState: { tokenId: null, over: null, overHand: false },
      };
    }
    case 'RESET': {
      const placements = {};
      const preMarks = state.puzzle.preMarks || {};
      for (const t of state.puzzle.tokens) {
        if (preMarks[t.id]) placements[t.id] = { row: t.row, col: t.col };
      }
      return {
        ...state, placements, marks: { ...preMarks },
        cellMarks: {}, qCandidates: {},
        recentTokenId: null, partnerTokenId: null, isSolved: false, showWin: false,
        dragState: { tokenId: null, over: null, overHand: false },
      };
    }
    case 'SHOW_SOLUTION': {
      const placements = {};
      for (const t of state.puzzle.tokens) placements[t.id] = { row: t.row, col: t.col };
      return { ...state, placements, marks: { ...state.puzzle.solution } };
    }
    case 'SOLVED': return { ...state, isSolved: true };
    case 'SHOW_WIN': return { ...state, showWin: true };
    case 'CLOSE_WIN': return { ...state, showWin: false };
    case 'SHOW_RULES': return { ...state, showRules: true };
    case 'CLOSE_RULES': return { ...state, showRules: false };
    case 'TOGGLE_LEGEND': return { ...state, legendCollapsed: !state.legendCollapsed };
    case 'CLEAR_PULSE': return { ...state, partnerTokenId: null, recentTokenId: null };
    default: return state;
  }
}

const initialState = {
  level: 'Sprout', puzzle: null, placements: {}, marks: {},
  recentTokenId: null, partnerTokenId: null,
  isGenerating: true, isSolved: false,
  showRules: false, showWin: false, legendCollapsed: true,
  cellMarks: {},       // {"r,c": 'X' | 'Q'}
  qCandidates: {},     // {"r,c": [animalId1, ...]} FIFO list of animal IDs
  qMarkCapacity: 4,    // 2x2 grid (can be 9 for 3x3)
  generationProgress: null,
  dragState: { tokenId: null, over: null, overHand: false },
};

// =============================================================================
// SECTION 8 — MAIN APP
// =============================================================================

function ZoologicApp() {
  const [state, dispatch] = useReducer(reducer, initialState);

  const generate = useCallback(async (level) => {
    dispatch({ type: 'START_GENERATING', level });
    await new Promise(r => setTimeout(r, 60));
    try {
      const p = await generatePuzzleAsync(level, (progress) => {
        dispatch({ type: 'GENERATION_PROGRESS', progress });
      });
      if (p) dispatch({ type: 'PUZZLE_READY', puzzle: p, level });
      else dispatch({ type: 'PUZZLE_READY', puzzle: loadFallback(level), level });
    } catch (e) {
      console.error('generate failed', e);
      dispatch({ type: 'PUZZLE_READY', puzzle: loadFallback(level), level });
    }
  }, []);

  useEffect(() => {
    generate('Sprout');
  }, []);

  const handleNewPuzzle = useCallback(() => { generate(state.level); }, [state.level, generate]);
  const handleLevelChange = useCallback((lv) => {
    if (lv === state.level || state.isGenerating) return;
    generate(lv);
  }, [state.level, state.isGenerating, generate]);

  const handleCellClick = useCallback((tokenId) => {
    dispatch({ type: 'TOGGLE_MARK', tokenId });
  }, []);

  const handleTokenDragStart = useCallback((e, tokenId, assignGender) => {
    try { e.dataTransfer.setData('text/plain', tokenId); e.dataTransfer.effectAllowed = 'move'; } catch (_) { }
    dispatch({ type: 'DRAG_START', tokenId, assignGender });
  }, []);

  const handleCellDrop = useCallback((phase, row, col) => {
    if (phase === 'over') {
      dispatch({ type: 'DRAG_OVER_CELL', row, col });
      // If dragging a tile over a Q-marked cell, register its {animalId, gender} as candidate.
      // BUT only if the tile has a confirmed gender — tiles in "?" state (gender undecided)
      // must NOT be registered, because male vs female are treated as independent candidates.
      const tid = state.dragState.tokenId;
      if (tid && state.puzzle) {
        const key = `${row},${col}`;
        if (state.cellMarks && state.cellMarks[key] === 'Q') {
          const tok = state.puzzle.tokens.find(t => t.id === tid);
          const gender = state.marks[tid]; // must be explicitly 'male' or 'female'
          if (tok && gender) {
            dispatch({ type: 'ENQUEUE_Q_CANDIDATE', row, col, animalId: tok.animalId, gender });
          }
        }
      }
    }
    else if (phase === 'leave') dispatch({ type: 'DRAG_LEAVE_CELL', row, col });
    else if (phase === 'drop') dispatch({ type: 'PLACE_TOKEN', tokenId: state.dragState.tokenId, row, col });
  }, [state.dragState.tokenId, state.cellMarks, state.puzzle, state.marks]);

  const handleDropToHand = useCallback((phase) => {
    if (phase === 'over') dispatch({ type: 'DRAG_OVER_HAND' });
    else if (phase === 'leave') dispatch({ type: 'DRAG_LEAVE_HAND' });
    else if (phase === 'drop') {
      const tid = state.dragState.tokenId;
      if (tid && state.placements[tid]) dispatch({ type: 'RETURN_TO_HAND', tokenId: tid });
      else dispatch({ type: 'DRAG_END' });
    }
  }, [state.dragState.tokenId, state.placements]);

  useEffect(() => {
    if (state.partnerTokenId || state.recentTokenId) {
      const t = setTimeout(() => dispatch({ type: 'CLEAR_PULSE' }), 500);
      return () => clearTimeout(t);
    }
  }, [state.partnerTokenId, state.recentTokenId]);

  // V2 Win check — constraint-based, not canonical-position-based
  useEffect(() => {
    if (!state.puzzle || state.isSolved) return;
    if (checkWinV2(state.puzzle, state.placements, state.marks)) {
      dispatch({ type: 'SOLVED' });
      setTimeout(() => dispatch({ type: 'SHOW_WIN' }), 1400);
    }
  }, [state.marks, state.placements, state.puzzle, state.isSolved]);

  const placedCount = Object.keys(state.placements).length;
  const totalTokens = state.puzzle ? state.puzzle.tokens.length : 0;
  const genderedCount = Object.keys(state.marks).length;
  const adjacencyOk = state.puzzle ? state.puzzle.pairs.every(([t1, t2]) => {
    const p1 = state.placements[t1], p2 = state.placements[t2];
    if (!p1 || !p2) return true;
    return isAdjacent(p1, p2);
  }) : false;

  return (
    <div style={{ minHeight: '100vh', background: 'var(--bg-paper)', position: 'relative' }}>
      <div aria-hidden style={{
        position: 'fixed', inset: 0, pointerEvents: 'none', opacity: 0.5,
        backgroundImage: `radial-gradient(circle at 25% 15%, rgba(180,83,9,0.03) 0%, transparent 40%), radial-gradient(circle at 85% 80%, rgba(28,25,23,0.025) 0%, transparent 40%)`,
      }} />
      <div style={{ position: 'relative', maxWidth: 960, margin: '0 auto' }}
        onDragEnd={() => dispatch({ type: 'DRAG_END' })}>
        <Header onHelp={() => dispatch({ type: 'SHOW_RULES' })} />
        <DifficultySelector current={state.level} onChange={handleLevelChange} disabled={state.isGenerating} />
        {state.puzzle && (
          <>
            <StatusBar puzzle={state.puzzle} placedCount={placedCount} totalTokens={totalTokens}
              genderedCount={genderedCount} adjacencyOk={adjacencyOk} />
            <Grid puzzle={state.puzzle} placements={state.placements} marks={state.marks}
              cellMarks={state.cellMarks} qCandidates={state.qCandidates} qMarkCapacity={state.qMarkCapacity}
              onCellClick={handleCellClick}
              onEmptyCellClick={(r, c) => dispatch({ type: 'CYCLE_CELL_MARK', row: r, col: c })}
              onCellDrop={handleCellDrop} onTokenDragStart={handleTokenDragStart}
              recentTokenId={state.recentTokenId} partnerTokenId={state.partnerTokenId}
              winAnimating={state.isSolved} dragState={state.dragState} />
            <HandPool puzzle={state.puzzle} placements={state.placements} marks={state.marks}
              onTokenDragStart={handleTokenDragStart} onDropToHand={handleDropToHand}
              dragState={state.dragState} />
            <Controls onNew={handleNewPuzzle} onReset={() => dispatch({ type: 'RESET' })}
              onHint={() => dispatch({ type: 'SHOW_SOLUTION' })} disabled={state.isGenerating} />
            <Legend collapsed={state.legendCollapsed} onToggle={() => dispatch({ type: 'TOGGLE_LEGEND' })} />
            <div style={{ textAlign: 'center', padding: '16px 40px 40px', fontSize: 11, color: 'var(--ink-tertiary)', letterSpacing: '0.12em', textTransform: 'uppercase' }} className="font-body">
              adjacency · line rules · count hints · graceful N2
            </div>
          </>
        )}
      </div>
      <LoadingOverlay show={state.isGenerating} level={state.level} progress={state.generationProgress} />
      <RulesModal show={state.showRules} onClose={() => dispatch({ type: 'CLOSE_RULES' })} />
      <WinDialog
        show={state.showWin}
        level={state.level}
        uniqueness={state.puzzle ? state.puzzle.uniqueness : null}
        solutionCount={state.puzzle ? state.puzzle.solutionCount : null}
        onNext={() => { dispatch({ type: 'CLOSE_WIN' }); handleNewPuzzle(); }}
        onClose={() => dispatch({ type: 'CLOSE_WIN' })}
      />
    </div>
  );
}

// =============================================================================
// BOOT
// =============================================================================

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<ZoologicApp />);
</script>
</body>
</html>
