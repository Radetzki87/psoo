function QCandidateGrid({ candidates, capacity, cellSize, opacity }) {
  const { lang } = useLang();
  // Determine grid dimensions from capacity (4 = 2x2, 9 = 3x3)
  const dim = Math.ceil(Math.sqrt(capacity));
  // Mini-cell size: fit within parent cell with padding
  const padding = Math.max(6, cellSize * 0.10);
  const gap = 2;
  const innerSize = cellSize - padding * 2;
  const miniCellSize = (innerSize - gap * (dim - 1)) / dim;
  // Build cells array of length `capacity`, filled with {animalId, gender} or null
  const slots = new Array(capacity).fill(null);
  for (let i = 0; i < candidates.length && i < capacity; i++) slots[i] = candidates[i];
  return (
    <div style={{
      position: 'absolute', inset: padding, zIndex: 4,
      display: 'grid',
      gridTemplateColumns: `repeat(${dim}, 1fr)`,
      gridTemplateRows: `repeat(${dim}, 1fr)`,
      gap: `${gap}px`,
      pointerEvents: 'none',
      opacity: opacity !== undefined ? opacity : 0.6,
    }}>
      {slots.map((slot, i) => {
        if (!slot) {
          return (
            <div key={i} style={{
              background: 'rgba(255,255,255,0.4)',
              border: '1px dashed rgba(120,113,108,0.45)',
              borderRadius: 2,
            }} />
          );
        }
        const animal = animalById(slot.animalId);
        const gender = slot.gender || 'male';
        const genderSym = gender === 'male' ? '♂' : '♀';
        const genderColor = gender === 'male' ? '#1E3A8A' : '#9D174D';
        return (
          <div key={i} style={{
            background: 'rgba(255,255,255,0.75)',
            border: '1px solid rgba(120,113,108,0.5)',
            borderRadius: 2,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            overflow: 'hidden', position: 'relative',
          }}>
            <img
              src={animalImgSrc(animal.id, gender)}
              alt={getAnimalName(animal.id, lang) || animal.name}
              draggable={false}
              onError={(e) => { e.target.style.display = 'none'; e.target.nextElementSibling.style.display = 'flex'; }}
              style={{ width: '86%', height: '86%', objectFit: 'contain', pointerEvents: 'none' }}
            />
            <div style={{
              display: 'none', width: '100%', height: '100%',
              alignItems: 'center', justifyContent: 'center',
              fontSize: miniCellSize * 0.55,
            }}>{animal.emoji}</div>
            <div className="font-display" style={{
              position: 'absolute', bottom: 0, right: 1,
              fontSize: Math.max(8, miniCellSize * 0.24),
              color: genderColor, fontWeight: 600, lineHeight: 1,
              textShadow: '0 0 2px rgba(255,255,255,0.9)',
            }}>{genderSym}</div>
          </div>
        );
      })}
    </div>
  );
}

function QMarkOverlay({ candidates, capacity, cellSize, hasPlacedTile }) {
  // Unified overlay: renders over either empty Q-cell or Q-cell with placed tile.
  // Opacity values (higher = more opaque/visible):
  //   - empty Q-cell: candidates 0.8 (prominent, full note-card feel), "?" 0.3 (visible but secondary)
  //   - tile-occupied Q-cell: candidates 0.3 (faint, so real tile remains primary),
  //                           "?" 0.2 (subtle watermark), actual tile image stays at full opacity.
  // Layer order (low → high):
  //   1. (parent background or placed tile, outside this component)
  //   2. candidate mini-grid (zIndex 4)
  //   3. big "?" symbol (zIndex 5, topmost)
  const candidatesOpacity = hasPlacedTile ? 0.3 : 0.8;
  const questionOpacity = hasPlacedTile ? 0.2 : 0.3;
  return (
    <>
      <QCandidateGrid candidates={candidates || []} capacity={capacity || 4} cellSize={cellSize} opacity={candidatesOpacity} />
      <div className="font-display" style={{
        position: 'absolute', inset: 0, zIndex: 5,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        fontSize: cellSize * 0.72, fontStyle: 'italic', fontWeight: 600,
        color: 'var(--accent-gold)', opacity: questionOpacity,
        pointerEvents: 'none', userSelect: 'none', lineHeight: 1,
        textShadow: '0 0 8px rgba(255, 253, 247, 0.8)',
      }}>?</div>
    </>
  );
}

function DropCell({ size, row, col, isDropTarget, markState, qCandidates, qCapacity, onClick }) {
  const isX = markState === 'X';
  const isQ = markState === 'Q';

  let bg, border;
  if (isX) {
    bg = isDropTarget ? 'rgba(185,28,28,0.1)' : 'rgba(120,113,108,0.12)';
    border = isDropTarget ? '1.5px dashed var(--danger)' : '1px solid var(--border-medium)';
  } else if (isQ) {
    bg = isDropTarget ? 'rgba(180,83,9,0.08)' : 'rgba(180,83,9,0.04)';
    border = isDropTarget ? '1.5px dashed var(--accent-gold)' : '1px solid rgba(180,83,9,0.35)';
  } else {
    bg = isDropTarget ? 'rgba(180,83,9,0.08)' : 'var(--bg-subtle)';
    border = isDropTarget ? '1.5px dashed var(--accent-gold)' : '1px dashed var(--border-medium)';
  }

  return (
    <div
      data-drop-cell={`${row},${col}`}
      onClick={onClick}
      role="button"
      style={{
        width: size, height: size, background: bg, borderRadius: 4, border,
        transition: 'all 140ms', display: 'flex', alignItems: 'center', justifyContent: 'center',
        cursor: 'pointer', position: 'relative', overflow: 'hidden',
      }}
    >
      {isX && (
        <svg width={size * 0.44} height={size * 0.44} viewBox="0 0 24 24" style={{ opacity: 0.55 }}>
          <line x1="5" y1="5" x2="19" y2="19" stroke="#78716C" strokeWidth="2.2" strokeLinecap="round" />
          <line x1="19" y1="5" x2="5" y2="19" stroke="#78716C" strokeWidth="2.2" strokeLinecap="round" />
        </svg>
      )}
      {isQ && (
        <QMarkOverlay candidates={qCandidates} capacity={qCapacity} cellSize={size} hasPlacedTile={false} />
      )}
      {!isX && !isQ && (
        <div style={{ width: 4, height: 4, borderRadius: 999, background: 'var(--border-medium)' }} />
      )}
    </div>
  );
}

function PairAdjacencyLine({ from, to, cellSize, gap, valid }) {
  const cx = (c) => c * (cellSize + gap) + cellSize / 2;
  const cy = (r) => r * (cellSize + gap) + cellSize / 2;
  const x1 = cx(from.col), y1 = cy(from.row);
  const x2 = cx(to.col), y2 = cy(to.row);
  return (
    <line x1={x1} y1={y1} x2={x2} y2={y2}
      stroke={valid ? '#16A34A' : 'var(--danger)'}
      strokeWidth="2" strokeDasharray="3 3" opacity="0.7" strokeLinecap="round" />
  );
}

function useViewportWidth() {
  const [w, setW] = React.useState(typeof window !== 'undefined' ? window.innerWidth : 1024);
  React.useEffect(() => {
    const onR = () => setW(window.innerWidth);
    window.addEventListener('resize', onR);
    return () => window.removeEventListener('resize', onR);
  }, []);
  return w;
}

// ============================================================================
// UNIFIED POINTER DRAG SYSTEM (mouse + touch + pen)
// Replaces HTML5 Drag & Drop API, which does not work on mobile touch.
//
// Model:
//   - Any tile (hand or placed) becomes a drag source via onPointerDown on it.
//   - A drag doesn't "commit" until pointer moves more than DRAG_THRESHOLD px.
//     Before threshold, releasing counts as a TAP (selects the tile).
//   - Drop targets are identified by data-drop-cell="r,c" or data-drop-hand="1".
//     On pointermove we use elementFromPoint to find them.
//   - Selected tile (via tap) can be placed by tapping a valid target.
//
// Exposes: DragProvider (wraps app), useDrag() -> { startPointerDrag,
//   selectedTokenId, selectTile, clearSelection, draggingTokenId,
//   ghostStyle, overTarget }
// ============================================================================

const DragContext = React.createContext(null);

function DragProvider({ children, onPlace, onReturnToHand, onTapTile, onSelectionChange }) {
  const [draggingTokenId, setDraggingTokenId] = useState(null);
  const [selectedTokenId, setSelectedTokenIdRaw] = useState(null);
  const selectedRef = useRef(null);
  const setSelectedTokenId = useCallback((id) => {
    selectedRef.current = id;
    setSelectedTokenIdRaw(id);
    if (onSelectionChange) onSelectionChange(id);
  }, [onSelectionChange]);
  const [overTarget, setOverTarget] = useState(null);
  const [ghostPos, setGhostPos] = useState({ x: 0, y: 0 });
  const [ghostVisible, setGhostVisible] = useState(false);
  const [ghostToken, setGhostToken] = useState(null); // { animalId, gender }

  // refs carry live state inside move/up handlers
  const stateRef = useRef({
    pointerId: null,
    tokenId: null,
    gender: null,
    startX: 0, startY: 0,
    moved: false,
    source: null, // 'hand' | 'board'
  });
  const DRAG_THRESHOLD = 6; // px

  const clearGhost = useCallback(() => {
    setGhostVisible(false);
    setGhostToken(null);
    setDraggingTokenId(null);
    setOverTarget(null);
  }, []);

  // Begin a pointer interaction on a tile. Does NOT start a drag yet — waits for threshold.
  const beginPointerPress = useCallback((e, { tokenId, gender, source, animalId }) => {
    // Ignore non-primary pointer buttons for mouse
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const s = stateRef.current;
    s.pointerId = e.pointerId;
    s.tokenId = tokenId;
    s.gender = gender;
    s.animalId = animalId;
    s.startX = e.clientX;
    s.startY = e.clientY;
    s.moved = false;
    s.source = source;
    // Capture pointer so moves keep coming even if finger leaves element
    try { e.currentTarget.setPointerCapture && e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
    // Don't preventDefault yet — preserve taps / scrolls until threshold
  }, []);

  // Global pointermove + pointerup listeners
  useEffect(() => {
    function findDropTarget(x, y) {
      const el = document.elementFromPoint(x, y);
      if (!el) return null;
      const cell = el.closest && el.closest('[data-drop-cell]');
      if (cell) {
        const [r, c] = cell.getAttribute('data-drop-cell').split(',').map(Number);
        return { kind: 'cell', row: r, col: c, key: `cell:${r},${c}` };
      }
      const hand = el.closest && el.closest('[data-drop-hand]');
      if (hand) return { kind: 'hand', key: 'hand' };
      return null;
    }

    function onMove(e) {
      const s = stateRef.current;
      if (s.pointerId == null || e.pointerId !== s.pointerId) return;
      const dx = e.clientX - s.startX;
      const dy = e.clientY - s.startY;
      if (!s.moved) {
        if (Math.hypot(dx, dy) < DRAG_THRESHOLD) return;
        // Threshold crossed — start drag
        s.moved = true;
        setDraggingTokenId(s.tokenId);
        setSelectedTokenId(null); // dragging supersedes tap-selection
        setGhostToken({ animalId: s.animalId, gender: s.gender });
        setGhostVisible(true);
      }
      setGhostPos({ x: e.clientX, y: e.clientY });
      const tgt = findDropTarget(e.clientX, e.clientY);
      setOverTarget(tgt);
      // Prevent page scroll while dragging on touch
      if (e.cancelable) e.preventDefault();
    }

    function onUp(e) {
      const s = stateRef.current;
      if (s.pointerId == null || e.pointerId !== s.pointerId) return;
      const { tokenId, moved, source } = s;
      s.pointerId = null;

      if (!moved) {
        // TAP — decide: select, deselect, toggle, or place/return-to-hand.
        // If another tile was already selected AND this tap is on a different
        // tile, treat it as "switch selection" (don't trigger place).
        const prevSelected = selectedRef.current;
        if (source === 'hand') {
          // Hand tap → select / deselect
          if (prevSelected === tokenId) setSelectedTokenId(null);
          else setSelectedTokenId(tokenId);
        } else {
          // Board tap
          if (prevSelected && prevSelected !== tokenId) {
            // Switch selection to this tile
            setSelectedTokenId(tokenId);
          } else if (prevSelected === tokenId) {
            // Tap same tile → deselect + toggle mark
            setSelectedTokenId(null);
            if (onTapTile) onTapTile({ tokenId, source });
          } else {
            // Nothing selected → toggle gender mark
            if (onTapTile) onTapTile({ tokenId, source });
          }
        }
        return;
      }

      // Drag ended — resolve drop. Clear any tap-selection.
      setSelectedTokenId(null);
      const tgt = findDropTarget(e.clientX, e.clientY);
      clearGhost();
      if (!tgt) return; // dropped on nothing — cancel
      if (tgt.kind === 'cell') {
        if (onPlace) onPlace({ tokenId, row: tgt.row, col: tgt.col });
      } else if (tgt.kind === 'hand') {
        if (source === 'board' && onReturnToHand) onReturnToHand({ tokenId });
      }
    }

    function onCancel(e) {
      const s = stateRef.current;
      if (s.pointerId == null || e.pointerId !== s.pointerId) return;
      s.pointerId = null;
      clearGhost();
    }

    window.addEventListener('pointermove', onMove, { passive: false });
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onCancel);
    return () => {
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      window.removeEventListener('pointercancel', onCancel);
    };
  }, [onPlace, onReturnToHand, onTapTile, clearGhost]);

  const ctx = useMemo(() => ({
    beginPointerPress,
    selectedTokenId, setSelectedTokenId,
    draggingTokenId, overTarget,
    ghostVisible, ghostPos, ghostToken,
  }), [beginPointerPress, selectedTokenId, draggingTokenId, overTarget, ghostVisible, ghostPos, ghostToken]);

  return (
    <DragContext.Provider value={ctx}>
      {children}
      {ghostVisible && ghostToken && (
        <div style={{
          position: 'fixed', left: 0, top: 0,
          transform: `translate(${ghostPos.x - 30}px, ${ghostPos.y - 30}px) scale(1.05)`,
          width: 60, height: 60, pointerEvents: 'none', zIndex: 9999,
          background: 'var(--bg-card)', border: '1.5px solid var(--accent-gold)', borderRadius: 4,
          boxShadow: '0 8px 24px -6px rgba(0,0,0,0.25)',
          display: 'flex', alignItems: 'center', justifyContent: 'center', overflow: 'hidden',
          transition: 'transform 60ms linear',
        }}>
          <img src={animalImgSrc(ghostToken.animalId, ghostToken.gender)}
               alt="" draggable={false}
               style={{ width: '82%', height: '82%', objectFit: 'contain' }} />
        </div>
      )}
    </DragContext.Provider>
  );
}

function useDrag() {
  const ctx = React.useContext(DragContext);
  if (!ctx) throw new Error('useDrag must be used within DragProvider');
  return ctx;
}

function Grid({ puzzle, placements, marks, cellMarks, qCandidates, qMarkCapacity, onCellClick, onEmptyCellClick, onCellDrop, onTokenDragStart, recentTokenId, partnerTokenId, winAnimating, dragState }) {
  const drag = useDrag();
  const n = puzzle.n;
  const vw = useViewportWidth();
  const isMobile = vw < 640;
  const isTiny = vw < 400;
  // Aggressive padding reduction on mobile so the board grabs every available pixel.
  const pagePad = isMobile ? (isTiny ? 4 : 8) : 40;
  const boardPad = isMobile ? (isTiny ? 4 : 8) : 20;
  const gap = isMobile ? 3 : 6;

  const forbiddenSet = new Set(puzzle.forbiddenCells.map(([r, c]) => `${r},${c}`));
  const placedMap = {};
  for (const [tokenId, cell] of Object.entries(placements)) {
    if (cell) placedMap[`${cell.row},${cell.col}`] = tokenId;
  }

  const rowRules = {}, colRules = {};
  for (const r of (puzzle.lineRules || [])) {
    if (r.isRow) (rowRules[r.idx] = rowRules[r.idx] || []).push(r);
    else (colRules[r.idx] = colRules[r.idx] || []).push(r);
  }
  const rowCountHints = {}, colCountHints = {};
  for (const h of (puzzle.countHints || [])) {
    if (h.row !== null) (rowCountHints[h.row] = rowCountHints[h.row] || []).push(h);
    else (colCountHints[h.col] = colCountHints[h.col] || []).push(h);
  }

  // Compute max badge slot rows/columns. Each line rule + the count-hint group
  // (paired side-by-side) each occupy ONE slot row (in column header) or
  // ONE slot row stacked vertically (in row header).
  let maxRowSlots = 0, maxColSlots = 0;
  for (let i = 0; i < n; i++) {
    const rRules = (rowRules[i] || []).length;
    const rCounts = (rowCountHints[i] || []).length > 0 ? 1 : 0;
    const cRules = (colRules[i] || []).length;
    const cCounts = (colCountHints[i] || []).length > 0 ? 1 : 0;
    if (rRules + rCounts > maxRowSlots) maxRowSlots = rRules + rCounts;
    if (cRules + cCounts > maxColSlots) maxColSlots = cRules + cCounts;
  }
  if (maxRowSlots === 0) maxRowSlots = 1;
  if (maxColSlots === 0) maxColSlots = 1;

  // Responsive badge sizing
  const compact = isMobile;
  const iconOnly = isTiny;
  const hintGap = isMobile ? 2 : 4;

  // ────────────────────────────────────────────────────────────────────
  // Cell-first sizing: on mobile, the grid cells claim the most space.
  // The badge slot width/height are then DERIVED from the cell size so
  // every column header slot is as wide as the cell beneath it, and every
  // row header is exactly one cell-tall (stacked vertically inside).
  // ────────────────────────────────────────────────────────────────────
  // Step 1: pick a target row-header gutter width.
  //   - On mobile: compact gutter — just enough for one count-pair badge,
  //     since multiple badges can stack vertically inside.
  //   - On desktop: vertical stacking too (one slot wide), so gutter is compact.
  //     Multiple rules + count hints stack vertically inside the cell-tall row.
  let rowHintWidth;
  if (isMobile) {
    // Smallest reasonable gutter: width of one paired-count group (two small badges).
    rowHintWidth = isTiny ? 56 : 64;
  } else {
    // Desktop: same vertical-stack philosophy. One paired-count slot wide
    // (~80px) is enough for two count badges side-by-side or for a single
    // habitat label badge. Multiple rules stack vertically inside.
    rowHintWidth = 84;
  }

  // Step 2: derive cellSize from available width.
  const availableW = vw - pagePad * 2 - boardPad * 2 - rowHintWidth - gap;
  const maxCell = isMobile ? 72 : 86;
  const cellSize = Math.max(32, Math.floor(Math.min((availableW - (n - 1) * gap) / n, maxCell)));

  // Step 3: now derive badge slot dimensions from cellSize.
  // Column header slot width = cellSize (matches cell beneath, edge-to-edge).
  // Row header slot height = cellSize (matches cell beside).
  // Slot height for column header rule: a fraction of cellSize, capped.
  const slotH = Math.max(22, Math.min(36, Math.round(cellSize * 0.46)));
  // Column header total height = N slot rows + gaps between them
  const colHintHeight = slotH * maxColSlots + hintGap * Math.max(0, maxColSlots - 1) + 8;
  // Slot width for column header: full cell width
  const slotW = cellSize;
  // Paired count badge size (used inside a single slot — two side by side)
  const pairedCountH = slotH;
  const pairedCountW = Math.max(20, Math.floor((cellSize - 2) / 2)); // half of cell, minus 2px gap

  // Evaluate rules & counts runtime
  const ruleOk = {};
  for (const r of (puzzle.lineRules || [])) {
    ruleOk[r.id] = evaluateLineRuleRuntime(r, placements, puzzle.tokens, marks);
  }
  const countOk = {}, countOver = {};
  for (const h of (puzzle.countHints || [])) {
    const lineEntries = Object.entries(placements).filter(([_, cell]) =>
      h.row !== null ? cell.row === h.row : cell.col === h.col
    );
    let current;
    if (h.type === 'total') current = lineEntries.length;
    else if (h.type === 'H1') current = lineEntries.filter(([tid]) => marks[tid] === 'male').length;
    else if (h.type === 'H2') current = lineEntries.filter(([tid]) => marks[tid] === 'female').length;
    countOk[h.id] = current === h.value;
    countOver[h.id] = current > h.value;
  }

  // Compute final ruleStatus: 'empty' | 'partial' | 'bad' | 'satisfied'
  // 'satisfied' (green) requires BOTH (a) every placed token in line matches the rule
  // AND (b) every count hint on that same line is also ok.
  const ruleStatus = {};
  for (const r of (puzzle.lineRules || [])) {
    const baseStatus = evaluateLineRuleStatus(r, placements, puzzle.tokens, marks);
    if (baseStatus !== 'satisfied-rule-only') {
      ruleStatus[r.id] = baseStatus; // empty / partial / bad
      continue;
    }
    // Rule itself is satisfied — now check count hints on same line
    const lineCountHints = (puzzle.countHints || []).filter(h =>
      r.isRow ? h.row === r.idx : h.col === r.idx
    );
    const allCountOk = lineCountHints.length === 0
      ? true   // no count hints on this line — rule alone counts as satisfied
      : lineCountHints.every(h => countOk[h.id]);
    ruleStatus[r.id] = allCountOk ? 'satisfied' : 'partial';
  }

  const pairAdj = {};
  for (const [t1, t2] of puzzle.pairs) {
    const p1 = placements[t1], p2 = placements[t2];
    if (p1 && p2) pairAdj[t1] = pairAdj[t2] = isAdjacent(p1, p2);
  }

  const cellContent = (r, c, idx) => {
    const key = `${r},${c}`;
    if (forbiddenSet.has(key)) return <ForbiddenCell size={cellSize} />;
    const tid = placedMap[key];
    const isDropTarget = drag.overTarget && drag.overTarget.kind === 'cell' && drag.overTarget.row === r && drag.overTarget.col === c;
    if (tid) {
      const tok = puzzle.tokens.find(t => t.id === tid);
      const animal = animalById(tok.animalId);
      const isRecent = recentTokenId === tok.id;
      const isPartnerPulse = partnerTokenId === tok.id;
      const isFixed = !!(puzzle.preMarks && puzzle.preMarks[tok.id]);
      const adj = pairAdj[tok.id];
      const cellIsQ = cellMarks && cellMarks[key] === 'Q';
      const cellQCands = cellIsQ && qCandidates ? qCandidates[key] : undefined;
      const isSelected = drag.selectedTokenId === tok.id;
      const isDraggingThis = drag.draggingTokenId === tok.id;
      return (
        <div
          data-drop-cell={`${r},${c}`}
          style={{
            animation: winAnimating ? `celebrationWave 700ms cubic-bezier(0.4,0,0.2,1) ${idx * 55}ms both` : 'none',
            position: 'relative',
            boxShadow: isDropTarget ? '0 0 0 2px var(--accent-gold)' : 'none',
            borderRadius: 4,
            transition: 'box-shadow 140ms',
          }}
        >
          <PlacedTile
            token={tok} animal={animal} gender={marks[tok.id] || null}
            onClick={() => onCellClick(tok.id)}
            onDragStart={(e) => {
              if (isFixed) return;
              drag.beginPointerPress(e, {
                tokenId: tok.id,
                gender: marks[tok.id] || 'male',
                animalId: tok.animalId,
                source: 'board',
              });
            }}
            isRecent={isRecent} isPartnerPulse={isPartnerPulse}
            isFixed={isFixed} cellSize={cellSize}
            isAdjacentToPartner={adj}
            isSelected={isSelected}
            isDraggingThis={isDraggingThis}
          />
          {cellIsQ && (
            <QMarkOverlay candidates={cellQCands} capacity={qMarkCapacity} cellSize={cellSize} hasPlacedTile={true} />
          )}
        </div>
      );
    }
    const markState = cellMarks ? cellMarks[key] : undefined;
    const qCands = qCandidates ? qCandidates[key] : undefined;
    return (
      <DropCell
        size={cellSize} row={r} col={c}
        isDropTarget={isDropTarget}
        markState={markState}
        qCandidates={qCands}
        qCapacity={qMarkCapacity}
        onClick={() => onEmptyCellClick && onEmptyCellClick(r, c)}
      />
    );
  };

  const rowsArr = Array.from({ length: n }, (_, i) => i);
  const colsArr = Array.from({ length: n }, (_, i) => i);

  return (
    <div style={{ padding: '4px clamp(2px, 1vw, 40px) 20px', display: 'flex', justifyContent: 'center', overflowX: 'auto' }}>
      <div style={{
        position: 'relative', display: 'inline-block', padding: boardPad, background: 'var(--bg-card)',
        border: '1px solid var(--border-soft)', borderRadius: 3,
        boxShadow: '0 1px 0 rgba(0,0,0,0.02), 0 12px 32px -16px rgba(60, 50, 30, 0.15)',
      }}>
        {/* Column headers */}
        <div style={{ display: 'flex', gap, marginBottom: gap, paddingLeft: rowHintWidth + gap, minHeight: colHintHeight }}>
          {colsArr.map(c => {
            const ch = colCountHints[c] || [];
            return (
              <div key={c} style={{ width: cellSize, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'flex-end', gap: hintGap, flexWrap: 'nowrap' }}>
                {(colRules[c] || []).map(r => (
                  <LineRuleBadge key={r.id} rule={r} ok={ruleOk[r.id]} status={ruleStatus[r.id]} compact={compact} iconOnly={iconOnly} slotW={slotW} slotH={slotH} />
                ))}
                {ch.length > 0 && (
                  <div style={{ display: 'flex', flexDirection: 'row', gap: 2, justifyContent: 'center', alignItems: 'center', maxWidth: '100%' }}>
                    {ch.map(h => (
                      <CountHintBadge key={h.id} hint={h} ok={countOk[h.id]} over={countOver[h.id]} compact={compact} iconOnly={iconOnly} paired={true} pairedSize={pairedCountW} />
                    ))}
                  </div>
                )}
              </div>
            );
          })}
        </div>
        {rowsArr.map(r => {
          const rh = rowCountHints[r] || [];
          const rRules = rowRules[r] || [];
          // Row header inner stacks vertically: each rule on its own line,
          // count hints on their own line. This lets the row gutter stay
          // narrow (one slot wide) while still showing every badge.
          // Total stacked items = rule count + (1 if count hints exist)
          const stackedItems = rRules.length + (rh.length > 0 ? 1 : 0);
          // Each stacked item gets ~equal share of cellSize, capped at slotH
          const rowSlotH = Math.max(20, Math.min(slotH, Math.floor((cellSize - hintGap * Math.max(0, stackedItems - 1)) / Math.max(1, stackedItems))));
          // Width matching: a paired count-hint group is (2 × rowSlotH + 2) wide.
          // Make line-rule badges the SAME width so both badge types
          // align flush at their left edge under right-justify.
          const rowRuleBadgeW = rh.length >= 2
            ? rowSlotH * 2 + 2
            : Math.min(rowHintWidth - 8, rowSlotH * 2 + 2);
          return (
          <div key={r} style={{ display: 'flex', gap, marginBottom: gap }}>
            <div style={{ width: rowHintWidth, height: cellSize, display: 'flex', flexDirection: 'column', alignItems: 'flex-end', justifyContent: 'center', gap: hintGap, paddingRight: 4, overflow: 'visible' }}>
              {rRules.length > 0 && (
                <div style={{ display: 'flex', flexDirection: 'column', gap: hintGap, alignItems: 'flex-end', justifyContent: 'flex-end' }}>
                  {rRules.map(rr => (
                    <LineRuleBadge key={rr.id} rule={rr} ok={ruleOk[rr.id]} status={ruleStatus[rr.id]} compact={compact} iconOnly={iconOnly} slotW={rowRuleBadgeW} slotH={rowSlotH} />
                  ))}
                </div>
              )}
              {rh.length > 0 && (
                <div style={{ display: 'flex', flexDirection: 'row', gap: 2, alignItems: 'center', justifyContent: 'flex-end' }}>
                  {rh.map(h => (
                    <CountHintBadge key={h.id} hint={h} ok={countOk[h.id]} over={countOver[h.id]} compact={compact} iconOnly={iconOnly} paired={true} pairedSize={rowSlotH} />
                  ))}
                </div>
              )}
            </div>
            {colsArr.map(c => (<div key={c}>{cellContent(r, c, r * n + c)}</div>))}
          </div>
          );
        })}
        {/* Adjacency SVG overlay */}
        <svg style={{
          position: 'absolute',
          left: boardPad + rowHintWidth + gap,
          top: boardPad + colHintHeight + gap,
          width: n * cellSize + (n - 1) * gap,
          height: n * cellSize + (n - 1) * gap,
          pointerEvents: 'none',
          overflow: 'visible',
        }}>
          {puzzle.pairs.map(([t1, t2]) => {
            const p1 = placements[t1], p2 = placements[t2];
            if (!p1 || !p2) return null;
            const valid = isAdjacent(p1, p2);
            return (
              <PairAdjacencyLine key={t1} from={p1} to={p2} cellSize={cellSize} gap={gap} valid={valid} />
            );
          })}
        </svg>
      </div>
    </div>
  );
}

function HandPool({ puzzle, placements, marks, onTokenDragStart, onDropToHand, dragState, onHandTapReturn }) {
  const drag = useDrag();
  const tStr = useT();
  const { lang } = useLang();
  if (!puzzle) return null;
  const unplaced = puzzle.tokens.filter(t => !placements[t.id]);
  const groups = {};
  for (const t of unplaced) { (groups[t.animalId] = groups[t.animalId] || []).push(t); }
  const entries = Object.entries(groups);

  const overHand = drag.overTarget && drag.overTarget.kind === 'hand';

  return (
    <div
      data-drop-hand="1"
      onClick={(e) => {
        // Only handle bare-hand taps (not clicks on child tiles which fire their own)
        if (e.target === e.currentTarget && onHandTapReturn) onHandTapReturn();
      }}
      style={{
        margin: '0 clamp(12px, 4vw, 40px) 20px', padding: 'clamp(12px, 3vw, 18px) clamp(12px, 3vw, 20px)', minHeight: 100,
        background: overHand ? 'rgba(180,83,9,0.05)' : 'var(--bg-subtle)',
        border: overHand ? '1px dashed var(--accent-gold)' : '1px solid var(--border-soft)',
        borderRadius: 3, transition: 'all 160ms',
      }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 12 }}>
        <div className="font-body" style={{ fontSize: 11, letterSpacing: '0.14em', textTransform: 'uppercase', color: 'var(--ink-tertiary)', fontWeight: 500 }}>
          {tStr('hand.title')}
        </div>
        <div className="font-mono" style={{ fontSize: 11, color: 'var(--ink-tertiary)' }}>
          {unplaced.length > 0 ? tStr('hand.waiting', { n: unplaced.length }) : tStr('hand.allPlaced')}
        </div>
      </div>
      {unplaced.length === 0 ? (
        <div style={{ padding: '20px 0', textAlign: 'center', color: 'var(--ink-tertiary)', fontSize: 13, fontStyle: 'italic' }} className="font-display">
          {tStr('hand.hint')}
        </div>
      ) : (
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 14 }}>
          {entries.map(([aid, toks]) => {
            const animal = animalById(parseInt(aid));
            return (
              <div key={aid} style={{
                display: 'flex', alignItems: 'center', gap: 8, background: 'var(--bg-card)',
                padding: '8px 10px', border: '1px solid var(--border-soft)', borderRadius: 3,
              }}>
                <div style={{ display: 'flex', gap: 4 }}>
                  {toks.map((t, i) => {
                    // Determine display gender (priority order):
                    //   1. If this token has an explicit mark, use it
                    //   2. If partner has a mark, show OPPOSITE
                    //   3. Both tokens in hand, no marks: fall back to index (0→♂, 1→♀)
                    //   4. Otherwise default male
                    let gender;
                    if (marks[t.id]) {
                      gender = marks[t.id];
                    } else {
                      const partnerId = getPartnerToken(t.id, puzzle.pairs);
                      const partnerMark = partnerId && marks[partnerId];
                      if (partnerMark) {
                        gender = partnerMark === 'male' ? 'female' : 'male';
                      } else if (toks.length === 2) {
                        gender = i === 0 ? 'male' : 'female';
                      } else {
                        gender = 'male';
                      }
                    }
                    const sym = gender === 'male' ? '♂' : '♀';
                    const symColor = gender === 'male' ? '#1E3A8A' : '#9D174D';
                    const isSelected = drag.selectedTokenId === t.id;
                    const isDraggingThis = drag.draggingTokenId === t.id;
                    return (
                      <div key={t.id}
                        onPointerDown={(e) => {
                          drag.beginPointerPress(e, {
                            tokenId: t.id,
                            gender,
                            animalId: animal.id,
                            source: 'hand',
                          });
                        }}
                        style={{
                          width: 58, height: 58, background: 'var(--bg-card)',
                          border: isSelected ? '2px solid var(--accent-gold)' : '1px solid var(--border-medium)',
                          boxShadow: isSelected ? '0 0 0 3px rgba(180,83,9,0.25)' : 'none',
                          borderRadius: 4,
                          cursor: 'grab', position: 'relative',
                          display: 'flex', alignItems: 'center', justifyContent: 'center',
                          transition: 'transform 180ms, box-shadow 180ms, border 180ms',
                          opacity: isDraggingThis ? 0.35 : 1,
                          touchAction: 'none',
                          userSelect: 'none',
                        }}>
                        <div style={{ position: 'absolute', inset: 0, background: HABITAT_TINT[animal.habitat], opacity: 0.22, borderRadius: 4 }} />
                        <img src={animalImgSrc(animal.id, gender)} alt={getAnimalName(animal.id, lang) || animal.name} draggable={false}
                          onError={(e) => { e.target.style.display = 'none'; e.target.nextElementSibling.style.display = 'flex'; }}
                          style={{ width: '80%', height: '80%', objectFit: 'contain', position: 'relative' }} />
                        <div style={{ display: 'none', fontSize: 26, position: 'relative' }}>
                          {animal.emoji}
                        </div>
                        <div className="font-display" style={{
                          position: 'absolute', bottom: 1, right: 2, fontSize: 10, color: symColor,
                          background: 'var(--bg-card)', borderRadius: 2,
                          width: 14, height: 14, display: 'flex', alignItems: 'center', justifyContent: 'center',
                          border: '1px solid var(--border-soft)', lineHeight: 1, fontWeight: 500,
                        }}>{sym}</div>
                      </div>
                    );
                  })}
                </div>
                <div style={{ display: 'flex', flexDirection: 'column', minWidth: 0 }}>
                  <div className="font-display" style={{ fontSize: 13, fontWeight: 500, color: 'var(--ink-primary)', lineHeight: 1.2, whiteSpace: 'nowrap' }}>{getAnimalName(animal.id, lang) || animal.name}</div>
                  <div style={{ display: 'flex', gap: 4, marginTop: 4, flexWrap: 'wrap' }}>
                    <span title={translateValue(animal.habitat, tStr)} className="font-body" style={{
                      display: 'inline-flex', alignItems: 'center', gap: 3,
                      padding: '2px 6px', borderRadius: 2,
                      background: HABITAT_TINT[animal.habitat],
                      border: '1px solid var(--border-soft)',
                      fontSize: 10, color: 'var(--ink-primary)', fontWeight: 500, lineHeight: 1,
                    }}>
                      <span aria-hidden style={{ fontSize: 11 }}>{ATTR_ICON[animal.habitat]}</span>
                      <span>{translateValue(animal.habitat, tStr)}</span>
                    </span>
                    <span title={translateValue(animal.diet, tStr)} className="font-body" style={{
                      display: 'inline-flex', alignItems: 'center', gap: 3,
                      padding: '2px 6px', borderRadius: 2,
                      background: 'var(--bg-subtle)',
                      border: '1px solid var(--border-soft)',
                      fontSize: 10, color: 'var(--ink-primary)', fontWeight: 500, lineHeight: 1,
                    }}>
                      <span aria-hidden style={{ fontSize: 11 }}>{ATTR_ICON[animal.diet]}</span>
                      <span>{translateValue(animal.diet, tStr)}</span>
                    </span>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function reducer(state, action) {
  switch (action.type) {
    case 'PUZZLE_READY': {
      const placements = {};
      const preMarks = action.puzzle.preMarks || {};
      for (const t of action.puzzle.tokens) {
        if (preMarks[t.id]) placements[t.id] = { row: t.row, col: t.col };
      }
      return {
        ...state, puzzle: action.puzzle, placements, marks: { ...preMarks },
        cellMarks: {}, qCandidates: {},
        isGenerating: false, isSolved: false,
        recentTokenId: null, partnerTokenId: null, showWin: false,
        level: action.level ?? state.level,
        generationProgress: null,
        dragState: { tokenId: null, over: null, overHand: false },
      };
    }
    case 'START_GENERATING':
      return { ...state, isGenerating: true, level: action.level ?? state.level, generationProgress: null };
    case 'GENERATION_PROGRESS':
      return { ...state, generationProgress: action.progress };
    case 'CYCLE_CELL_MARK': {
      // 3-state cycle: empty → X → Q → empty
      const key = `${action.row},${action.col}`;
      const cur = state.cellMarks[key]; // undefined | 'X' | 'Q'
      const next = cur === undefined ? 'X' : cur === 'X' ? 'Q' : undefined;
      const newMarks = { ...state.cellMarks };
      if (next === undefined) delete newMarks[key];
      else newMarks[key] = next;
      // Reset Q candidates when entering Q state or leaving Q state
      const newQCandidates = { ...state.qCandidates };
      if (cur === 'Q' || next === 'Q') delete newQCandidates[key];
      return { ...state, cellMarks: newMarks, qCandidates: newQCandidates };
    }
    case 'ENQUEUE_Q_CANDIDATE': {
      // Add a {animalId, gender} pair to Q-mark cell's FIFO candidate list.
      // Male and female of same species are tracked as independent entries
      // (24 distinct candidates: 12 species × 2 genders).
      const key = `${action.row},${action.col}`;
      if (state.cellMarks[key] !== 'Q') return state;
      const cur = state.qCandidates[key] || [];
      const gender = action.gender || 'male';
      // Dedup on (animalId, gender) pair
      if (cur.some(c => c.animalId === action.animalId && c.gender === gender)) return state;
      const QCAP = state.qMarkCapacity || 4;
      const next = [...cur, { animalId: action.animalId, gender }];
      // FIFO: if exceeds cap, drop oldest
      while (next.length > QCAP) next.shift();
      return { ...state, qCandidates: { ...state.qCandidates, [key]: next } };
    }
    case 'TOGGLE_MARK': {
      if (state.isSolved) return state;
      if (!state.placements[action.tokenId]) return state;
      if (state.puzzle.preMarks && state.puzzle.preMarks[action.tokenId]) return state;
      // If partner is a fixed tile with a forced gender, this token's gender is also locked
      const partnerId = getPartnerToken(action.tokenId, state.puzzle.pairs);
      const partnerIsFixed = partnerId && state.puzzle.preMarks && state.puzzle.preMarks[partnerId];
      if (partnerIsFixed) return state; // cannot toggle — gender is determined by fixed partner
      const cur = state.marks[action.tokenId] || null;
      const next = cur === null ? 'male' : cur === 'male' ? 'female' : null;
      const newMarks = { ...state.marks };
      // Update partner gender in sync regardless of whether partner is on board or in hand.
      // This ensures the hand-pool visual gender instantly mirrors the grid tile's toggle.
      const partnerEditable = partnerId && !partnerIsFixed;
      if (next === null) {
        delete newMarks[action.tokenId];
        if (partnerEditable) delete newMarks[partnerId];
      } else {
        newMarks[action.tokenId] = next;
        if (partnerEditable) {
          newMarks[partnerId] = next === 'male' ? 'female' : 'male';
        }
      }
      return {
        ...state, marks: newMarks, recentTokenId: action.tokenId,
        partnerTokenId: (partnerId && state.placements[partnerId]) ? partnerId : null,
      };
    }
    case 'DRAG_START': {
      const newState = { ...state, dragState: { ...state.dragState, tokenId: action.tokenId } };
      // If the drag originated from hand with an explicit gender hint, confirm it on the token
      // AND on the partner (as opposite gender). Do not overwrite existing marks.
      if (action.assignGender && !state.marks[action.tokenId]) {
        const newMarks = { ...state.marks };
        newMarks[action.tokenId] = action.assignGender;
        // Auto-assign opposite gender to partner if partner is placed and has no mark yet
        const partnerId = getPartnerToken(action.tokenId, state.puzzle.pairs);
        const partnerIsFixed = partnerId && state.puzzle.preMarks && state.puzzle.preMarks[partnerId];
        if (partnerId && state.placements[partnerId] && !newMarks[partnerId] && !partnerIsFixed) {
          newMarks[partnerId] = action.assignGender === 'male' ? 'female' : 'male';
        }
        newState.marks = newMarks;
      }
      return newState;
    }
    case 'DRAG_OVER_CELL':
      return { ...state, dragState: { ...state.dragState, over: `${action.row},${action.col}` } };
    case 'DRAG_LEAVE_CELL':
      if (state.dragState.over === `${action.row},${action.col}`) {
        return { ...state, dragState: { ...state.dragState, over: null } };
      }
      return state;
    case 'DRAG_OVER_HAND':
      return { ...state, dragState: { ...state.dragState, overHand: true } };
    case 'DRAG_LEAVE_HAND':
      return { ...state, dragState: { ...state.dragState, overHand: false } };
    case 'DRAG_END':
      return { ...state, dragState: { tokenId: null, over: null, overHand: false } };
    case 'PLACE_TOKEN': {
      const { tokenId, row, col } = action;
      if (!tokenId) return { ...state, dragState: { tokenId: null, over: null, overHand: false } };
      const forbidden = new Set(state.puzzle.forbiddenCells.map(([r, c]) => `${r},${c}`));
      if (forbidden.has(`${row},${col}`)) return { ...state, dragState: { tokenId: null, over: null, overHand: false } };
      // Block drop on X-marked cells
      const destKey = `${row},${col}`;
      if (state.cellMarks[destKey] === 'X') {
        return { ...state, dragState: { tokenId: null, over: null, overHand: false } };
      }
      const occupant = Object.entries(state.placements).find(([, p]) => p && p.row === row && p.col === col);
      if (occupant && state.puzzle.preMarks && state.puzzle.preMarks[occupant[0]]) {
        return { ...state, dragState: { tokenId: null, over: null, overHand: false } };
      }
      const newPlacements = { ...state.placements };
      let displaced = null;
      for (const [tid, cell] of Object.entries(newPlacements)) {
        if (cell && cell.row === row && cell.col === col) { displaced = tid; break; }
      }
      const prev = newPlacements[tokenId];
      newPlacements[tokenId] = { row, col };
      if (displaced) {
        if (prev) newPlacements[displaced] = prev;
        else delete newPlacements[displaced];
      }
      // If partner is a fixed tile, auto-assign opposite gender to this token
      const newMarks = { ...state.marks };
      const partnerId = getPartnerToken(tokenId, state.puzzle.pairs);
      const partnerFixedGender = partnerId && state.puzzle.preMarks && state.puzzle.preMarks[partnerId];
      if (partnerFixedGender && !newMarks[tokenId]) {
        newMarks[tokenId] = partnerFixedGender === 'male' ? 'female' : 'male';
      }

      // Q-mark candidate tracking:
      //  - If destination is Q-marked, enqueue this token's {animalId, gender}
      //  - If displaced to source (swap), enqueue the displaced token's {animalId, gender} at source if source is Q-marked
      //  - Male and female of same species are tracked as independent entries
      //  - Tokens without a confirmed gender ("?" state) are NOT registered
      const newQCandidates = { ...state.qCandidates };
      const QCAP = state.qMarkCapacity || 4;
      const droppedAnimal = state.puzzle.tokens.find(t => t.id === tokenId);
      const droppedGender = newMarks[tokenId]; // only register if gender is confirmed
      if (state.cellMarks[destKey] === 'Q' && droppedAnimal && droppedGender) {
        const curList = newQCandidates[destKey] || [];
        const alreadyExists = curList.some(c => c.animalId === droppedAnimal.animalId && c.gender === droppedGender);
        if (!alreadyExists) {
          const nextList = [...curList, { animalId: droppedAnimal.animalId, gender: droppedGender }];
          while (nextList.length > QCAP) nextList.shift();
          newQCandidates[destKey] = nextList;
        }
      }
      // Swap case: if displaced tile was moved to `prev` cell, and that cell is Q-marked,
      // register displaced animal (with its gender) there — only if gender confirmed
      if (displaced && prev) {
        const prevKey = `${prev.row},${prev.col}`;
        if (state.cellMarks[prevKey] === 'Q') {
          const dispAnimal = state.puzzle.tokens.find(t => t.id === displaced);
          const dispGender = state.marks[displaced]; // only register if confirmed
          if (dispAnimal && dispGender) {
            const curList = newQCandidates[prevKey] || [];
            const alreadyExists = curList.some(c => c.animalId === dispAnimal.animalId && c.gender === dispGender);
            if (!alreadyExists) {
              const nextList = [...curList, { animalId: dispAnimal.animalId, gender: dispGender }];
              while (nextList.length > QCAP) nextList.shift();
              newQCandidates[prevKey] = nextList;
            }
          }
        }
      }

      return {
        ...state, placements: newPlacements, marks: newMarks,
        qCandidates: newQCandidates,
        dragState: { tokenId: null, over: null, overHand: false },
        recentTokenId: tokenId,
      };
    }
    case 'RETURN_TO_HAND': {
      const { tokenId } = action;
      if (!tokenId) return { ...state, dragState: { tokenId: null, over: null, overHand: false } };
      if (state.puzzle.preMarks && state.puzzle.preMarks[tokenId]) {
        return { ...state, dragState: { tokenId: null, over: null, overHand: false } };
      }
      const newPlacements = { ...state.placements };
      const newMarks = { ...state.marks };
      delete newPlacements[tokenId];
      delete newMarks[tokenId];
      return {
        ...state, placements: newPlacements, marks: newMarks,
        dragState: { tokenId: null, over: null, overHand: false },
      };
    }
    case 'RESET': {
      const placements = {};
      const preMarks = state.puzzle.preMarks || {};
      for (const t of state.puzzle.tokens) {
        if (preMarks[t.id]) placements[t.id] = { row: t.row, col: t.col };
      }
      return {
        ...state, placements, marks: { ...preMarks },
        cellMarks: {}, qCandidates: {},
        recentTokenId: null, partnerTokenId: null, isSolved: false, showWin: false,
        dragState: { tokenId: null, over: null, overHand: false },
      };
    }
    case 'SHOW_SOLUTION': {
      const placements = {};
      for (const t of state.puzzle.tokens) placements[t.id] = { row: t.row, col: t.col };
      return { ...state, placements, marks: { ...state.puzzle.solution } };
    }
    case 'SOLVED': return { ...state, isSolved: true };
    case 'SHOW_WIN': return { ...state, showWin: true };
    case 'CLOSE_WIN': return { ...state, showWin: false };
    case 'SHOW_RULES': return { ...state, showRules: true };
    case 'CLOSE_RULES': return { ...state, showRules: false };
    case 'TOGGLE_LEGEND': return { ...state, legendCollapsed: !state.legendCollapsed };
    case 'CLEAR_PULSE': return { ...state, partnerTokenId: null, recentTokenId: null };
    default: return state;
  }
}

const initialState = {
  level: 'Sprout', puzzle: null, placements: {}, marks: {},
  recentTokenId: null, partnerTokenId: null,
  isGenerating: true, isSolved: false,
  showRules: false, showWin: false, legendCollapsed: true,
  cellMarks: {},       // {"r,c": 'X' | 'Q'}
  qCandidates: {},     // {"r,c": [animalId1, ...]} FIFO list of animal IDs
  qMarkCapacity: 4,    // 2x2 grid (can be 9 for 3x3)
  generationProgress: null,
  dragState: { tokenId: null, over: null, overHand: false },
};

// =============================================================================
// SECTION 8 — MAIN APP
// =============================================================================

function ZoologicApp() {
  const [state, dispatch] = useReducer(reducer, initialState);

  const generate = useCallback(async (level) => {
    dispatch({ type: 'START_GENERATING', level });
    await new Promise(r => setTimeout(r, 60));
    try {
      const p = await generatePuzzleAsync(level, (progress) => {
        dispatch({ type: 'GENERATION_PROGRESS', progress });
      });
      if (p) dispatch({ type: 'PUZZLE_READY', puzzle: p, level });
      else dispatch({ type: 'PUZZLE_READY', puzzle: loadFallback(level), level });
    } catch (e) {
      console.error('generate failed', e);
      dispatch({ type: 'PUZZLE_READY', puzzle: loadFallback(level), level });
    }
  }, []);

  useEffect(() => {
    generate('Sprout');
  }, []);

  const handleNewPuzzle = useCallback(() => { generate(state.level); }, [state.level, generate]);
  const handleLevelChange = useCallback((lv) => {
    if (lv === state.level || state.isGenerating) return;
    generate(lv);
  }, [state.level, state.isGenerating, generate]);

  const handleCellClick = useCallback((tokenId) => {
    dispatch({ type: 'TOGGLE_MARK', tokenId });
  }, []);

  const handleTokenDragStart = useCallback((e, tokenId, assignGender) => {
    try { e.dataTransfer.setData('text/plain', tokenId); e.dataTransfer.effectAllowed = 'move'; } catch (_) { }
    dispatch({ type: 'DRAG_START', tokenId, assignGender });
  }, []);

  const handleCellDrop = useCallback((phase, row, col) => {
    if (phase === 'over') {
      dispatch({ type: 'DRAG_OVER_CELL', row, col });
      // If dragging a tile over a Q-marked cell, register its {animalId, gender} as candidate.
      // BUT only if the tile has a confirmed gender — tiles in "?" state (gender undecided)
      // must NOT be registered, because male vs female are treated as independent candidates.
      const tid = state.dragState.tokenId;
      if (tid && state.puzzle) {
        const key = `${row},${col}`;
        if (state.cellMarks && state.cellMarks[key] === 'Q') {
          const tok = state.puzzle.tokens.find(t => t.id === tid);
          const gender = state.marks[tid]; // must be explicitly 'male' or 'female'
          if (tok && gender) {
            dispatch({ type: 'ENQUEUE_Q_CANDIDATE', row, col, animalId: tok.animalId, gender });
          }
        }
      }
    }
    else if (phase === 'leave') dispatch({ type: 'DRAG_LEAVE_CELL', row, col });
    else if (phase === 'drop') dispatch({ type: 'PLACE_TOKEN', tokenId: state.dragState.tokenId, row, col });
  }, [state.dragState.tokenId, state.cellMarks, state.puzzle, state.marks]);

  const handleDropToHand = useCallback((phase) => {
    if (phase === 'over') dispatch({ type: 'DRAG_OVER_HAND' });
    else if (phase === 'leave') dispatch({ type: 'DRAG_LEAVE_HAND' });
    else if (phase === 'drop') {
      const tid = state.dragState.tokenId;
      if (tid && state.placements[tid]) dispatch({ type: 'RETURN_TO_HAND', tokenId: tid });
      else dispatch({ type: 'DRAG_END' });
    }
  }, [state.dragState.tokenId, state.placements]);

  useEffect(() => {
    if (state.partnerTokenId || state.recentTokenId) {
      const t = setTimeout(() => dispatch({ type: 'CLEAR_PULSE' }), 500);
      return () => clearTimeout(t);
    }
  }, [state.partnerTokenId, state.recentTokenId]);

  // V2 Win check — constraint-based, not canonical-position-based
  useEffect(() => {
    if (!state.puzzle || state.isSolved) return;
    if (checkWinV2(state.puzzle, state.placements, state.marks)) {
      dispatch({ type: 'SOLVED' });
      setTimeout(() => dispatch({ type: 'SHOW_WIN' }), 1400);
    }
  }, [state.marks, state.placements, state.puzzle, state.isSolved]);

  const placedCount = Object.keys(state.placements).length;
  const totalTokens = state.puzzle ? state.puzzle.tokens.length : 0;
  const genderedCount = Object.keys(state.marks).length;
  const adjacencyOk = state.puzzle ? state.puzzle.pairs.every(([t1, t2]) => {
    const p1 = state.placements[t1], p2 = state.placements[t2];
    if (!p1 || !p2) return true;
    return isAdjacent(p1, p2);
  }) : false;

  // ──────────────────────────────────────────────────────────
  // Unified drag callbacks — drive reducer from pointer events.
  // Selection state lives inside DragProvider; app exposes a ref
  // via onSelectionChange so cell-click handlers can see it.
  // ──────────────────────────────────────────────────────────
  const selectionRef = useRef(null);
  const handleSelectionChange = useCallback((id) => { selectionRef.current = id; }, []);

  const handleDragPlace = useCallback(({ tokenId, row, col }) => {
    const tok = state.puzzle && state.puzzle.tokens.find(t => t.id === tokenId);
    if (!tok) return;
    let gender = state.marks[tokenId];
    if (!gender) {
      // Priority 1: if partner already has a confirmed gender (board or hand),
      // the gender of this token is fully determined as the opposite.
      const partnerId = getPartnerToken(tokenId, state.puzzle.pairs);
      const partnerMark = partnerId && state.marks[partnerId];
      if (partnerMark) {
        gender = partnerMark === 'male' ? 'female' : 'male';
      } else {
        // Priority 2: both tokens of pair are unmarked — assign by index in the
        // unplaced group of this animal so each pair shows ♂/♀ pre-pickup.
        const group = state.puzzle.tokens.filter(t => t.animalId === tok.animalId && !state.placements[t.id]);
        if (group.length === 2) {
          const i = group.findIndex(t => t.id === tokenId);
          gender = i === 0 ? 'male' : 'female';
        }
      }
    }
    dispatch({ type: 'DRAG_START', tokenId, assignGender: gender });
    dispatch({ type: 'PLACE_TOKEN', tokenId, row, col });
  }, [state.puzzle, state.placements, state.marks]);

  const handleDragReturnToHand = useCallback(({ tokenId }) => {
    if (!tokenId) return;
    if (state.placements[tokenId]) {
      dispatch({ type: 'DRAG_START', tokenId });
      dispatch({ type: 'RETURN_TO_HAND', tokenId });
    }
  }, [state.placements]);

  // Tap on a tile — toggle gender mark if board tile, else handled by provider (select)
  const handleTapTile = useCallback(({ tokenId, source }) => {
    if (!tokenId || !state.puzzle) return;
    if (source !== 'board') return; // hand taps handled by provider (select)
    const isFixed = !!(state.puzzle.preMarks && state.puzzle.preMarks[tokenId]);
    if (!isFixed) dispatch({ type: 'TOGGLE_MARK', tokenId });
  }, [state.puzzle]);

  // Tap on empty cell — if a tile is selected, place it; else cycle cell mark
  const handleEmptyCellClickWrapped = useCallback((r, c) => {
    const tid = selectionRef.current;
    if (tid) {
      handleDragPlace({ tokenId: tid, row: r, col: c });
      return;
    }
    dispatch({ type: 'CYCLE_CELL_MARK', row: r, col: c });
  }, [handleDragPlace]);

  // Tap on hand area — if a board tile is selected, return to hand
  const handleHandTapReturn = useCallback(() => {
    const tid = selectionRef.current;
    if (tid && state.placements[tid]) {
      handleDragReturnToHand({ tokenId: tid });
    }
  }, [state.placements, handleDragReturnToHand]);

  return (
    <DragProvider
      onPlace={handleDragPlace}
      onReturnToHand={handleDragReturnToHand}
      onTapTile={handleTapTile}
      onSelectionChange={handleSelectionChange}
    >
    <div style={{ minHeight: '100vh', background: 'var(--bg-paper)', position: 'relative' }}>
      <div aria-hidden style={{
        position: 'fixed', inset: 0, pointerEvents: 'none', opacity: 0.5,
        backgroundImage: `radial-gradient(circle at 25% 15%, rgba(180,83,9,0.03) 0%, transparent 40%), radial-gradient(circle at 85% 80%, rgba(28,25,23,0.025) 0%, transparent 40%)`,
      }} />
      <div style={{ position: 'relative', maxWidth: 960, margin: '0 auto', overflowX: 'hidden' }}>
        <Header
          onHelp={() => dispatch({ type: 'SHOW_RULES' })}
          level={state.level}
          onChangeLevel={handleLevelChange}
          disabled={state.isGenerating}
        />
        {state.puzzle && (
          <>
            <PuzzleMeta puzzle={state.puzzle} placedCount={placedCount} totalTokens={totalTokens}
              genderedCount={genderedCount} adjacencyOk={adjacencyOk} />
            <Grid puzzle={state.puzzle} placements={state.placements} marks={state.marks}
              cellMarks={state.cellMarks} qCandidates={state.qCandidates} qMarkCapacity={state.qMarkCapacity}
              onCellClick={handleCellClick}
              onEmptyCellClick={handleEmptyCellClickWrapped}
              onCellDrop={handleCellDrop} onTokenDragStart={handleTokenDragStart}
              recentTokenId={state.recentTokenId} partnerTokenId={state.partnerTokenId}
              winAnimating={state.isSolved} dragState={state.dragState} />
            <HandPool puzzle={state.puzzle} placements={state.placements} marks={state.marks}
              onTokenDragStart={handleTokenDragStart} onDropToHand={handleDropToHand}
              dragState={state.dragState} onHandTapReturn={handleHandTapReturn} />
            <Controls onNew={handleNewPuzzle} onReset={() => dispatch({ type: 'RESET' })}
              onHint={() => dispatch({ type: 'SHOW_SOLUTION' })} disabled={state.isGenerating} />
            <Legend collapsed={state.legendCollapsed} onToggle={() => dispatch({ type: 'TOGGLE_LEGEND' })} />
            <div style={{ textAlign: 'center', padding: '16px 40px 40px', fontSize: 11, color: 'var(--ink-tertiary)', letterSpacing: '0.12em', textTransform: 'uppercase' }} className="font-body">
              adjacency · line rules · count hints · graceful N2
            </div>
          </>
        )}
      </div>
      <LoadingOverlay show={state.isGenerating} level={state.level} progress={state.generationProgress} />
      <RulesModal show={state.showRules} onClose={() => dispatch({ type: 'CLOSE_RULES' })} />
      <WinDialog
        show={state.showWin}
        level={state.level}
        uniqueness={state.puzzle ? state.puzzle.uniqueness : null}
        solutionCount={state.puzzle ? state.puzzle.solutionCount : null}
        onNext={() => { dispatch({ type: 'CLOSE_WIN' }); handleNewPuzzle(); }}
        onClose={() => dispatch({ type: 'CLOSE_WIN' })}
      />
    </div>
    </DragProvider>
  );
}

// =============================================================================
// BOOT
// =============================================================================

// Read persisted language — falls back to KO (main language per design spec).
// EDITMODE block exposes the key for Tweak panel + host-side persistence.
const __TWEAKS_DEFAULTS = /*EDITMODE-BEGIN*/{
  "lang": "ko"
}/*EDITMODE-END*/;

function getInitialLang() {
  try {
    const stored = localStorage.getItem('zoologic.lang');
    if (stored && ['ko','en','zh','ja'].includes(stored)) return stored;
  } catch (e) {}
  return __TWEAKS_DEFAULTS.lang || 'ko';
}

function Root() {
  return (
    <LangProvider initialLang={getInitialLang()}>
      <ZoologicApp />
    </LangProvider>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<Root />);
</script>
</body>
</html>
