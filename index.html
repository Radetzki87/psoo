<style>
  :root {
    --bg-paper: #FAF7F0;
    --bg-card: #FFFFFF;
    --bg-subtle: #F5F2EA;
    --bg-fixed: #EEE9DC;       /* pre-mark tile background — neutral, not gold */
    --ink-primary: #1C1917;
    --ink-secondary: #44403C;
    --ink-tertiary: #78716C;
    --border-soft: #E7E5E4;
    --border-medium: #D6D3D1;
    --accent-gold: #B45309;    /* reserved: constraints (badges, Q, selection) */
    --accent-gold-soft: #D97706;
    --success-soft: #FEF3C7;
    --forbidden: #E7E5E4;
    --danger: #B91C1C;
    --gender-male: #1E3A8A;    /* reserved: ♂ only */
    --gender-female: #9D174D;  /* reserved: ♀ only */
    --ok-strict: #B45309;
    --ok-loose: #92400E;
    --ok-flexible: #78716C;
    --lang-font: 'Pretendard', 'Pretendard Variable', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body, #root { margin: 0; padding: 0; background: var(--bg-paper); color: var(--ink-primary); }
  body { font-family: var(--lang-font); -webkit-font-smoothing: antialiased; }
  .font-display { font-family: 'Fraunces', Georgia, serif; }
  .font-body { font-family: var(--lang-font); }
  .font-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  button { font-family: inherit; }
  button:focus-visible { outline: 2px solid var(--accent-gold); outline-offset: 2px; }

  @keyframes cellResolve {
    0% { transform: scale(0.88); opacity: 0.6; }
    60% { transform: scale(1.06); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes partnerPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(180, 83, 9, 0); }
    50% { box-shadow: 0 0 0 6px rgba(180, 83, 9, 0.2); }
  }
  @keyframes celebrationWave {
    0% { transform: scale(1); filter: brightness(1); }
    50% { transform: scale(1.08); filter: brightness(1.15) saturate(1.1); }
    100% { transform: scale(1); filter: brightness(1); }
  }
  @keyframes fadeInUp {
    0% { transform: translateY(8px); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
  }
  @keyframes progressShimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  @keyframes softPulseRing {
    0%, 100% { box-shadow: 0 0 0 0 rgba(180,83,9,0); }
    50%      { box-shadow: 0 0 0 4px rgba(180,83,9,0.18); }
  }
  @keyframes tooltipIn {
    0%   { opacity: 0; transform: translateY(-4px) scale(0.96); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes badgeTipFade {
    0%   { opacity: 0; }
    100% { opacity: 1; }
  }

  /* Accessibility: respect reduced-motion preference */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }

  /* Stronger keyboard focus indication */
  [role="button"]:focus-visible,
  button:focus-visible {
    outline: 2px solid var(--accent-gold);
    outline-offset: 2px;
    border-radius: 4px;
  }
</style>
</head>

const LangContext = createContext({ lang: 'ko', setLang: () => {}, t: (k) => k });

function LangProvider({ children, initialLang = 'ko', onChange }) {
  const [lang, setLangState] = useState(initialLang);

  const setLang = useCallback((next) => {
    if (!LANGS.find(l => l.code === next)) return;
    setLangState(next);
    try { localStorage.setItem('zoologic.lang', next); } catch (e) {}
    if (onChange) onChange(next);
  }, [onChange]);

  // Sync <html lang>, font stack + --lang-font CSS variable on change.
  useEffect(() => {
    const meta = LANGS.find(l => l.code === lang) || LANGS[0];
    document.documentElement.setAttribute('lang', meta.htmlLang);
    document.documentElement.style.setProperty('--lang-font', FONT_STACK[lang]);
    document.body.style.fontFamily = FONT_STACK[lang];
  }, [lang]);

  const t = useCallback((key, args) => {
    const entry = STRINGS[key];
    if (!entry) return key;
    const val = entry[lang] || entry.ko || key;
    if (typeof val === 'function') return val(args || {});
    return val;
  }, [lang]);

  const ctxValue = useMemo(() => ({ lang, setLang, t }), [lang, setLang, t]);
  return <LangContext.Provider value={ctxValue}>{children}</LangContext.Provider>;
}

function useLang() { return useContext(LangContext); }
function useT() { return useContext(LangContext).t; }

}

function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function isAdjacent(c1, c2) {
  return Math.max(Math.abs(c1.row - c2.row), Math.abs(c1.col - c2.col)) === 1;
}

function getPartnerToken(tokenId, pairs) {
  for (const [t1, t2] of pairs) {
    if (t1 === tokenId) return t2;
    if (t2 === tokenId) return t1;
  }
  return null;
}

function getTokensInRow(r, tokens) { return tokens.filter(t => t.row === r); }
function getTokensInCol(c, tokens) { return tokens.filter(t => t.col === c); }

function animalById(id) { return ANIMALS.find(a => a.id === id); }

// ─────────────────────────────────────────────────────────────────────────────
// STAGE A: Design Rule Template — Constraint-First Generation
// ─────────────────────────────────────────────────────────────────────────────
function designRuleTemplate(config, animals) {
  const targetCount = randInt(config.ruleCount[0], config.ruleCount[1]);
  const dims = config.ruleDimensions;
  const n = config.n;

  // Enumerate all possible rules
  const allRules = [];
  for (let i = 0; i < n; i++) {
    for (const isRow of [true, false]) {
      for (const dim of dims) {
        if (dim === 'habitat') {
          for (const val of ['사바나', '극지', '해양', '숲']) {
            allRules.push({ isRow, idx: i, dim, val });
          }
        } else if (dim === 'diet') {
          for (const val of ['육식', '초식']) {
            allRules.push({ isRow, idx: i, dim, val });
          }
        } else if (dim === 'gender') {
          for (const val of ['male', 'female']) {
            allRules.push({ isRow, idx: i, dim, val });
          }
        }
      }
    }
  }

  // Try random combinations
  for (let attempt = 0; attempt < 60; attempt++) {
    const candidate = shuffle(allRules).slice(0, targetCount);

    // Check line uniqueness (no two rules on same line)
    const lines = new Set();
    let valid = true;
    for (const r of candidate) {
      const key = `${r.isRow ? 'r' : 'c'}${r.idx}`;
      if (lines.has(key)) { valid = false; break; }
      lines.add(key);
    }
    if (!valid) continue;

    // Check cross-cell feasibility
    if (!crossCellsFeasible(candidate, animals)) continue;

    return candidate.map((r, i) => ({ ...r, id: `rule-${i}` }));
  }
  return null;
}

function crossCellsFeasible(rules, animals) {
  // For row rule vs col rule pairs, check if their cross cell can hold any animal
  for (let i = 0; i < rules.length; i++) {
    for (let j = i + 1; j < rules.length; j++) {
      const r1 = rules[i], r2 = rules[j];
      if (r1.isRow === r2.isRow) continue;

      // They cross at one cell; compute compatible animals
      const compatible = animals.filter(a => {
        if (r1.dim !== 'gender' && a[r1.dim] !== r1.val) return false;
        if (r2.dim !== 'gender' && a[r2.dim] !== r2.val) return false;
        return true;
      });
      // Gender rules don't restrict species; always feasible for species
      // But if both are species dim (habitat/diet), need at least one compatible animal
      if (r1.dim !== 'gender' && r2.dim !== 'gender' && compatible.length === 0) {
        return false;
      }
    }
  }
  return true;
}

// ─────────────────────────────────────────────────────────────────────────────
// STAGE B: Constrained Adjacent Placement
// ─────────────────────────────────────────────────────────────────────────────
function constrainedAdjacentPlacement(config, ruleTemplate, forbiddenCells, animals) {
  const n = config.n;
  const k = config.k;
  const forbidden = new Set(forbiddenCells.map(([r, c]) => `${r},${c}`));

  // Build cell domains (which animals can be placed at each cell, given habitat/diet rules)
  const cellDomains = {};
  for (let r = 0; r < n; r++) {
    for (let c = 0; c < n; c++) {
      const key = `${r},${c}`;
      if (forbidden.has(key)) continue;

      let allowed = new Set(animals.map(a => a.id));
      for (const rule of ruleTemplate) {
        if (rule.dim === 'gender') continue; // gender rules applied post-placement
        const inLine = rule.isRow ? (rule.idx === r) : (rule.idx === c);
        if (inLine) {
          allowed = new Set([...allowed].filter(id => animalById(id)[rule.dim] === rule.val));
        }
      }
      if (allowed.size > 0) cellDomains[key] = allowed;
    }
  }

  // For animal pool restriction
  let animalPool = animals;
  if (config.animalPoolRestriction === 'same_habitat') {
    const habitats = ['사바나', '극지', '해양', '숲'];
    const viableHabitats = habitats.filter(h => animals.filter(a => a.habitat === h).length >= k);
    if (viableHabitats.length === 0) return null;
    const h = viableHabitats[randInt(0, viableHabitats.length - 1)];
    animalPool = animals.filter(a => a.habitat === h);
  }

  // Compute per-animal options (list of adjacent cell pairs this animal can occupy)
  const animalOptions = {};
  for (const animal of animalPool) {
    const options = [];
    const cellsForAnimal = Object.entries(cellDomains)
      .filter(([_, dom]) => dom.has(animal.id))
      .map(([key]) => {
        const [r, c] = key.split(',').map(Number);
        return { row: r, col: c, key };
      });

    for (const c1 of cellsForAnimal) {
      for (const c2 of cellsForAnimal) {
        if (c1.key >= c2.key) continue; // dedupe
        if (!isAdjacent(c1, c2)) continue;
        options.push([c1, c2]);
      }
    }
    animalOptions[animal.id] = options;
  }

  // Viable animals: those with at least one option
  const viable = animalPool.filter(a => animalOptions[a.id].length > 0);
  if (viable.length < k) return null;

  // Try selecting k animals and placing them
  for (let selAttempt = 0; selAttempt < 20; selAttempt++) {
    const selected = shuffle(viable).slice(0, k);
    // Sort by fewest options (MRV)
    selected.sort((a, b) => animalOptions[a.id].length - animalOptions[b.id].length);

    const used = new Set();
    const result = [];

    function place(idx) {
      if (idx === k) return true;
      const animal = selected[idx];
      const opts = shuffle(animalOptions[animal.id]);
      for (const [c1, c2] of opts) {
        if (used.has(c1.key) || used.has(c2.key)) continue;
        used.add(c1.key); used.add(c2.key);
        result.push([animal, c1, c2]);
        if (place(idx + 1)) return true;
        result.pop();
        used.delete(c1.key); used.delete(c2.key);
      }
      return false;
    }

    if (place(0)) {
      // Convert to tokens/pairs
      const tokens = [], pairs = [];
      for (let i = 0; i < result.length; i++) {
        const [animal, c1, c2] = result[i];
        const t1 = `t${i * 2}`, t2 = `t${i * 2 + 1}`;
        tokens.push({ id: t1, animalId: animal.id, row: c1.row, col: c1.col });
        tokens.push({ id: t2, animalId: animal.id, row: c2.row, col: c2.col });
        pairs.push([t1, t2]);
      }
      return { tokens, pairs };
    }
  }
  return null;
}

// ─────────────────────────────────────────────────────────────────────────────
// Gender Assignment Respecting Gender Rules
// ─────────────────────────────────────────────────────────────────────────────
function assignGendersWithRules(pairs, tokens, lineRules) {
  const genderRules = lineRules.filter(r => r.dim === 'gender');

  // Compute forced genders for tokens in gender-rule lines
  const forcedGender = {};
  for (const rule of genderRules) {
    const lineTokens = rule.isRow
      ? tokens.filter(t => t.row === rule.idx)
      : tokens.filter(t => t.col === rule.idx);
    for (const t of lineTokens) {
      if (forcedGender[t.id] && forcedGender[t.id] !== rule.val) {
        return null; // conflict
      }
      forcedGender[t.id] = rule.val;
    }
  }

  // Assign genders respecting forced and pair-constraint
  const marks = {};
  for (const [t1, t2] of pairs) {
    const f1 = forcedGender[t1];
    const f2 = forcedGender[t2];

    if (f1 && f2) {
      if (f1 === f2) return null; // pair can't have same gender
      marks[t1] = f1; marks[t2] = f2;
    } else if (f1) {
      marks[t1] = f1; marks[t2] = f1 === 'male' ? 'female' : 'male';
    } else if (f2) {
      marks[t2] = f2; marks[t1] = f2 === 'male' ? 'female' : 'male';
    } else {
      if (Math.random() < 0.5) { marks[t1] = 'male'; marks[t2] = 'female'; }
      else { marks[t1] = 'female'; marks[t2] = 'male'; }
    }
  }
  return marks;
}

// ─────────────────────────────────────────────────────────────────────────────
// STAGE C: Auxiliary Hints — Count hints + Fixed tiles
// ─────────────────────────────────────────────────────────────────────────────
function addAuxiliaryHints(placement, config, solution, lineRules, forbiddenCells) {
  const n = config.n;
  const tokens = placement.tokens;

  // Identify rule lines (these must have # hints for synergy)
  const ruleLineKeys = new Set(
    lineRules.map(r => `${r.isRow ? 'r' : 'c'}${r.idx}`)
  );

  // All lines
  const allLines = [];
  for (let i = 0; i < n; i++) {
    allLines.push({ isRow: true, idx: i });
    allLines.push({ isRow: false, idx: i });
  }

  // Priority: rule lines first, then others
  const priorityLines = allLines.filter(l =>
    ruleLineKeys.has(`${l.isRow ? 'r' : 'c'}${l.idx}`)
  );
  const otherLines = allLines.filter(l =>
    !ruleLineKeys.has(`${l.isRow ? 'r' : 'c'}${l.idx}`)
  );

  // Target count coverage
  const targetCount = randInt(config.countCoverage[0], config.countCoverage[1]);
  // Ensure priority lines all included
  const neededFromOthers = Math.max(0, targetCount - priorityLines.length);
  const selectedOthers = shuffle(otherLines).slice(0, neededFromOthers);
  const selectedLines = [...priorityLines, ...selectedOthers];

  // Build # hints (total + optional H1 gender count)
  const countHints = [];
  for (let i = 0; i < selectedLines.length; i++) {
    const line = selectedLines[i];
    const lineTokens = line.isRow
      ? getTokensInRow(line.idx, tokens)
      : getTokensInCol(line.idx, tokens);
    countHints.push({
      id: `cnt-${line.isRow ? 'r' : 'c'}${line.idx}`,
      type: 'total',
      row: line.isRow ? line.idx : null,
      col: line.isRow ? null : line.idx,
      value: lineTokens.length,
    });
    // H1 (male count) — adds critical information for pair permutation disambiguation
    // Skip when line already has gender-only rule (redundant) or empty
    const hasGenderRule = lineRules.some(r =>
      r.dim === 'gender' && r.isRow === line.isRow && r.idx === line.idx
    );
    if (lineTokens.length > 0 && !hasGenderRule) {
      const males = lineTokens.filter(t => solution[t.id] === 'male').length;
      countHints.push({
        id: `h1-${line.isRow ? 'r' : 'c'}${line.idx}`,
        type: 'H1',
        row: line.isRow ? line.idx : null,
        col: line.isRow ? null : line.idx,
        value: males,
      });
    }
  }

  // Fixed tiles — simple random selection.
  // (We deliberately do NOT prioritize rule lines; rule lines that get fully filled
  // with fixed tiles become "dead" lines with no player deductive work. The Stage D
  // validation in tryOneGeneration rejects such puzzles, retrying with different
  // fixed tiles until a valid layout is found.)
  const fixedCount = randInt(config.fixedTileCount[0], config.fixedTileCount[1]);
  const fixedTokens = shuffle(tokens).slice(0, fixedCount);
  const fixedCells = fixedTokens.map(t => ({
    row: t.row, col: t.col, animalId: t.animalId, gender: solution[t.id],
  }));
  const preMarks = Object.fromEntries(fixedTokens.map(t => [t.id, solution[t.id]]));

  return {
    n: config.n,
    forbiddenCells,
    tokens,
    pairs: placement.pairs,
    lineRules,
    countHints,
    fixedCells,
    preMarks,
  };
}

// ─────────────────────────────────────────────────────────────────────────────
// STAGE D: Timeboxed Solution Enumeration
// ─────────────────────────────────────────────────────────────────────────────
function enumerateSolutions(instance, animals, maxSolutions, timeLimitMs) {
  const startTime = performance.now();
  const n = instance.n;
  const pairs = instance.pairs;
  const tokens = instance.tokens;
  const k = pairs.length;

  const forbidden = new Set(instance.forbiddenCells.map(([r, c]) => `${r},${c}`));
  const rowRules = {}, colRules = {};
  for (const r of instance.lineRules) {
    if (r.isRow) (rowRules[r.idx] = rowRules[r.idx] || []).push(r);
    else (colRules[r.idx] = colRules[r.idx] || []).push(r);
  }
  const fixedByKey = {};
  for (const ft of instance.fixedCells) fixedByKey[`${ft.row},${ft.col}`] = ft;
  const rowHints = {}, colHints = {};
  for (const h of instance.countHints) {
    if (h.row !== null) (rowHints[h.row] = rowHints[h.row] || []).push(h);
    else (colHints[h.col] = colHints[h.col] || []).push(h);
  }

  function cellOk(row, col, animalId, gender) {
    const key = `${row},${col}`;
    if (forbidden.has(key)) return false;
    const ft = fixedByKey[key];
    if (ft) {
      if (ft.animalId !== animalId) return false;
      if (ft.gender !== gender) return false;
    }
    const animal = animalById(animalId);
    const rules = [...(rowRules[row] || []), ...(colRules[col] || [])];
    for (const rule of rules) {
      if (rule.dim === 'gender') {
        if (gender !== rule.val) return false;
      } else {
        if (animal[rule.dim] !== rule.val) return false;
      }
    }
    return true;
  }

  // Per-pair candidates (fixed in advance to speed up)
  const pairSpecies = pairs.map(([t1]) => tokens.find(t => t.id === t1).animalId);

  const pairCandidates = pairs.map((pair, pairIdx) => {
    const animalId = pairSpecies[pairIdx];
    const candidates = [];

    const fixedForSpecies = instance.fixedCells.filter(ft => ft.animalId === animalId);

    if (fixedForSpecies.length === 2) {
      const [a, b] = fixedForSpecies;
      if (isAdjacent(a, b) && a.gender !== b.gender) {
        candidates.push({
          c1key: `${a.row},${a.col}`, c2key: `${b.row},${b.col}`,
          c1row: a.row, c1col: a.col, c2row: b.row, c2col: b.col,
          g1: a.gender, g2: b.gender,
        });
      }
    } else if (fixedForSpecies.length === 1) {
      const ft = fixedForSpecies[0];
      const otherG = ft.gender === 'male' ? 'female' : 'male';
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (dr === 0 && dc === 0) continue;
          const r2 = ft.row + dr, c2 = ft.col + dc;
          if (r2 < 0 || r2 >= n || c2 < 0 || c2 >= n) continue;
          if (!cellOk(r2, c2, animalId, otherG)) continue;
          candidates.push({
            c1key: `${ft.row},${ft.col}`, c2key: `${r2},${c2}`,
            c1row: ft.row, c1col: ft.col, c2row: r2, c2col: c2,
            g1: ft.gender, g2: otherG,
          });
        }
      }
    } else {
      for (let r1 = 0; r1 < n; r1++) {
        for (let c1 = 0; c1 < n; c1++) {
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              if (dr === 0 && dc === 0) continue;
              const r2 = r1 + dr, c2 = c1 + dc;
              if (r2 < 0 || r2 >= n || c2 < 0 || c2 >= n) continue;
              const k1 = `${r1},${c1}`, k2 = `${r2},${c2}`;
              if (k1 >= k2) continue;
              for (const [g1, g2] of [['male', 'female'], ['female', 'male']]) {
                if (!cellOk(r1, c1, animalId, g1)) continue;
                if (!cellOk(r2, c2, animalId, g2)) continue;
                candidates.push({
                  c1key: k1, c2key: k2,
                  c1row: r1, c1col: c1, c2row: r2, c2col: c2,
                  g1, g2,
                });
              }
            }
          }
        }
      }
    }
    return candidates;
  });

  // Early termination if any pair has no candidates
  for (const cc of pairCandidates) {
    if (cc.length === 0) return { solutions: [], timedOut: false };
  }

  // MRV: order pairs by ascending candidate count
  const pairOrder = pairs.map((_, i) => i).sort((a, b) =>
    pairCandidates[a].length - pairCandidates[b].length
  );

  const used = new Set();
  const assignment = {};  // pairIdx -> candidate
  const solutions = [];
  let timedOut = false;

  function computeCounts(asgn) {
    const rowOcc = {}, rowMale = {}, rowFemale = {};
    const colOcc = {}, colMale = {}, colFemale = {};
    for (const pairIdx in asgn) {
      const a = asgn[pairIdx];
      rowOcc[a.c1row] = (rowOcc[a.c1row] || 0) + 1;
      rowOcc[a.c2row] = (rowOcc[a.c2row] || 0) + 1;
      colOcc[a.c1col] = (colOcc[a.c1col] || 0) + 1;
      colOcc[a.c2col] = (colOcc[a.c2col] || 0) + 1;
      const mk1 = a.g1 === 'male' ? rowMale : rowFemale;
      mk1[a.c1row] = (mk1[a.c1row] || 0) + 1;
      const mk2 = a.g2 === 'male' ? rowMale : rowFemale;
      mk2[a.c2row] = (mk2[a.c2row] || 0) + 1;
      const ck1 = a.g1 === 'male' ? colMale : colFemale;
      ck1[a.c1col] = (ck1[a.c1col] || 0) + 1;
      const ck2 = a.g2 === 'male' ? colMale : colFemale;
      ck2[a.c2col] = (ck2[a.c2col] || 0) + 1;
    }
    return { rowOcc, rowMale, rowFemale, colOcc, colMale, colFemale };
  }

  function checkHintsInProgress(asgn) {
    const c = computeCounts(asgn);
    for (const h of instance.countHints) {
      const isRow = h.row !== null;
      const idx = isRow ? h.row : h.col;
      let count;
      if (h.type === 'total') count = isRow ? (c.rowOcc[idx] || 0) : (c.colOcc[idx] || 0);
      else if (h.type === 'H1') count = isRow ? (c.rowMale[idx] || 0) : (c.colMale[idx] || 0);
      else if (h.type === 'H2') count = isRow ? (c.rowFemale[idx] || 0) : (c.colFemale[idx] || 0);
      else count = 0;
      if (count > h.value) return false;
    }
    return true;
  }

  function checkHintsFinal(asgn) {
    const c = computeCounts(asgn);
    for (const h of instance.countHints) {
      const isRow = h.row !== null;
      const idx = isRow ? h.row : h.col;
      let count;
      if (h.type === 'total') count = isRow ? (c.rowOcc[idx] || 0) : (c.colOcc[idx] || 0);
      else if (h.type === 'H1') count = isRow ? (c.rowMale[idx] || 0) : (c.colMale[idx] || 0);
      else if (h.type === 'H2') count = isRow ? (c.rowFemale[idx] || 0) : (c.colFemale[idx] || 0);
      else count = 0;
      if (count !== h.value) return false;
    }
    return true;
  }

  function backtrack(depth) {
    if (timedOut) return;
    if (performance.now() - startTime > timeLimitMs) { timedOut = true; return; }
    if (solutions.length >= maxSolutions + 1) return; // found one more than needed

    if (depth === k) {
      if (checkHintsFinal(assignment)) {
        solutions.push({ ...assignment });
      }
      return;
    }

    const pairIdx = pairOrder[depth];
    const candidates = pairCandidates[pairIdx];

    for (const cand of candidates) {
      if (used.has(cand.c1key) || used.has(cand.c2key)) continue;
      used.add(cand.c1key); used.add(cand.c2key);
      assignment[pairIdx] = cand;

      if (checkHintsInProgress(assignment)) {
        backtrack(depth + 1);
      }

      delete assignment[pairIdx];
      used.delete(cand.c1key); used.delete(cand.c2key);

      if (timedOut || solutions.length > maxSolutions) return;
    }
  }

  backtrack(0);
  return { solutions, timedOut };
}

// ─────────────────────────────────────────────────────────────────────────────
// Try one generation attempt — returns puzzle object or null
// ─────────────────────────────────────────────────────────────────────────────
function tryOneGeneration(levelKey, config, currentMaxSolutions, verifyTimeLimit) {
  // Stage A
  const ruleTemplate = designRuleTemplate(config, ANIMALS);
  if (!ruleTemplate) return null;

  // Forbidden cells
  const forbiddenCount = Array.isArray(config.forbiddenCount)
    ? randInt(config.forbiddenCount[0], config.forbiddenCount[1])
    : config.forbiddenCount;
  const allCells = [];
  for (let r = 0; r < config.n; r++)
    for (let c = 0; c < config.n; c++) allCells.push([r, c]);
  const forbiddenCells = shuffle(allCells).slice(0, forbiddenCount);

  // Stage B
  const placement = constrainedAdjacentPlacement(config, ruleTemplate, forbiddenCells, ANIMALS);
  if (!placement) return null;

  // Validate rule line coverage: every rule line must have ≥1 token
  // This prevents the confusing "#0 + line rule" combination
  for (const rule of ruleTemplate) {
    const tokensInLine = rule.isRow
      ? placement.tokens.filter(t => t.row === rule.idx)
      : placement.tokens.filter(t => t.col === rule.idx);
    if (tokensInLine.length === 0) return null; // retry
  }

  // Gender assignment respecting rules
  const solution = assignGendersWithRules(placement.pairs, placement.tokens, ruleTemplate);
  if (!solution) return null;

  // Stage C
  const instance = addAuxiliaryHints(placement, config, solution, ruleTemplate, forbiddenCells);

  // Validate rule lines have ≥1 NON-FIXED token.
  // A rule line is meaningful for the player only if they have to place at least one
  // tile there to satisfy it. If all tokens on a rule line are fixed tiles, the rule
  // is already satisfied before play begins — the line is effectively "#0" from the
  // player's perspective and the rule has no deductive function.
  const fixedTokenIds = new Set(Object.keys(instance.preMarks || {}));
  for (const rule of ruleTemplate) {
    const tokensInLine = rule.isRow
      ? placement.tokens.filter(t => t.row === rule.idx)
      : placement.tokens.filter(t => t.col === rule.idx);
    const nonFixedInLine = tokensInLine.filter(t => !fixedTokenIds.has(t.id));
    if (nonFixedInLine.length === 0) return null; // retry — no player action required on this line
  }

  // Stage D
  const { solutions, timedOut } = enumerateSolutions(
    instance, ANIMALS, currentMaxSolutions, verifyTimeLimit
  );

  const solutionCount = solutions.length;

  // Timeout with 0 solutions found: canonical is structurally valid but couldn't be
  // verified in time. Accept as flexible — at least canonical solution exists.
  if (solutionCount === 0) {
    if (!timedOut) return null; // genuine infeasibility (should be rare)
    return {
      ...instance,
      solution,
      level: levelKey,
      uniqueness: 'flexible',
      solutionCount: 0, // unknown; canonical is at least one
      timedOut: true,
    };
  }

  // Too many solutions — reject
  if (solutionCount > currentMaxSolutions) return null;

  // Classify uniqueness
  let uniqueness;
  if (timedOut) {
    // Found some solutions but didn't fully enumerate — classify as flexible
    uniqueness = 'flexible';
  } else if (solutionCount === 1) {
    uniqueness = 'strict';
  } else if (solutionCount <= 3) {
    uniqueness = 'loose';
  } else {
    uniqueness = 'flexible';
  }

  return {
    ...instance,
    solution,
    level: levelKey,
    uniqueness,
    solutionCount,
    timedOut,
  };
}

// ─────────────────────────────────────────────────────────────────────────────
// Main Generator — Async with Progressive Relaxation
// ─────────────────────────────────────────────────────────────────────────────
async function generatePuzzleAsync(level, onProgress) {
  const config = DIFFICULTY_CONFIGS[level];
  const startTime = performance.now();
  const BUDGET = config.totalBudgetMs;
  const MAX = config.maxSolutions;

  let attempt = 0;
  let bestResult = null;

  while (attempt < config.maxAttempts) {
    const elapsed = performance.now() - startTime;
    if (elapsed > BUDGET) break;

    // Progressive relaxation: start strict, escalate to full maxSolutions over time
    // Strict (1) attempts get priority in early budget; we relax as time runs out
    const pct = elapsed / BUDGET;
    let currentMaxSol;
    if (pct < 0.15) currentMaxSol = Math.min(1, MAX);
    else if (pct < 0.40) currentMaxSol = Math.min(3, MAX);
    else if (pct < 0.65) currentMaxSol = Math.min(10, MAX);
    else if (pct < 0.85) currentMaxSol = Math.min(20, MAX);
    else currentMaxSol = MAX;

    attempt++;

    if (attempt % 3 === 0) {
      onProgress && onProgress({
        attempts: attempt,
        elapsed,
        budget: BUDGET,
        currentMaxSolutions: currentMaxSol,
        level,
      });
      await new Promise(r => setTimeout(r, 0));
    }

    let result;
    try {
      result = tryOneGeneration(level, config, currentMaxSol, config.verifyTimeLimitMs);
    } catch (e) {
      console.error('Generation error:', e);
      continue;
    }

    if (!result) continue;

    // Strict (exactly 1 solution) — exit immediately, best possible
    if (result.solutionCount === 1 && !result.timedOut) {
      result.generationTime = performance.now() - startTime;
      result.attemptCount = attempt;
      return result;
    }

    // Compare results for bestResult (prefer lower solutionCount, but >0 beats 0)
    const betterThanBest = (() => {
      if (!bestResult) return true;
      // A non-zero count is better than 0 (which is "unknown/canonical only")
      if (result.solutionCount > 0 && bestResult.solutionCount === 0) return true;
      if (result.solutionCount === 0 && bestResult.solutionCount > 0) return false;
      // Both non-zero or both zero: prefer lower count
      return result.solutionCount < bestResult.solutionCount;
    })();
    if (betterThanBest) bestResult = result;

    // Early exit: if we have a Loose result (≤3) after 25% budget, accept
    if (bestResult && bestResult.solutionCount > 0 && bestResult.solutionCount <= 3 && elapsed > BUDGET * 0.25) {
      break;
    }
    // Early exit: if we have a Flexible result (≤10) after 50% budget, accept
    if (bestResult && bestResult.solutionCount > 0 && bestResult.solutionCount <= 10 && elapsed > BUDGET * 0.5) {
      break;
    }
    // Early exit: canonical-only (timedOut, solutionCount=0) is valid — accept after 50% budget
    if (bestResult && bestResult.solutionCount === 0 && elapsed > BUDGET * 0.5) {
      break;
    }
    // Early exit: if we have any valid result after 75% budget, accept
    if (bestResult && elapsed > BUDGET * 0.75) {
      break;
    }
  }

  if (bestResult) {
    bestResult.generationTime = performance.now() - startTime;
    bestResult.attemptCount = attempt;
    return bestResult;
  }

  // Last resort: fallback
  return loadFallback(level);
}

// =============================================================================
// SECTION 4 — RUNTIME VALIDATION (Constraint-Based Win)
// =============================================================================

function evaluateLineRuleRuntime(rule, placements, tokens, marks) {
  const inLine = (cell) => rule.isRow ? cell.row === rule.idx : cell.col === rule.idx;
  const placedTokenEntries = Object.entries(placements).filter(([_, cell]) => inLine(cell));
  if (placedTokenEntries.length === 0) return true; // empty line auto-satisfied

  return placedTokenEntries.every(([tid, _]) => {
    const t = tokens.find(t => t.id === tid);
    if (!t) return false;
    if (rule.dim === 'gender') {
      return marks[tid] === rule.val;
    }
    const animal = animalById(t.animalId);
    return animal[rule.dim] === rule.val;
  });
}

// Returns 'empty' | 'partial' | 'bad' (some token violates rule) | 'satisfied-rule-only'
// 'satisfied-rule-only' means: line is non-empty AND every placed token in this
// line matches the rule. This is NOT enough to highlight green — green requires
// ALL line count hints in the same line to also be ok (handled at caller).
function evaluateLineRuleStatus(rule, placements, tokens, marks) {
  const inLine = (cell) => rule.isRow ? cell.row === rule.idx : cell.col === rule.idx;
  const placedTokenEntries = Object.entries(placements).filter(([_, cell]) => inLine(cell));
  if (placedTokenEntries.length === 0) return 'empty';

  const checkToken = (tid) => {
    const t = tokens.find(t => t.id === tid);
    if (!t) return false;
    if (rule.dim === 'gender') {
      return marks[tid] === rule.val;
    }
    const animal = animalById(t.animalId);
    return animal[rule.dim] === rule.val;
  };

  // Gender rule: a token's gender is "?", treat as not-yet-conflicting (partial),
  // but if any placed token has gender set and it doesn't match → bad.
  if (rule.dim === 'gender') {
    let hasViolation = false;
    let allMarked = true;
    for (const [tid, _] of placedTokenEntries) {
      const m = marks[tid];
      if (!m) { allMarked = false; continue; }
      if (m !== rule.val) { hasViolation = true; break; }
    }
    if (hasViolation) return 'bad';
    if (!allMarked) return 'partial';
    return 'satisfied-rule-only';
  }

  // habitat / diet rule: animal species is fixed at placement, so every placed
  // token's attribute is immediately known. Any mismatch = bad.
  for (const [tid, _] of placedTokenEntries) {
    if (!checkToken(tid)) return 'bad';
  }
  return 'satisfied-rule-only';
}

function evaluateCountHintRuntime(hint, placements, tokens, marks) {
  const lineTokens = Object.entries(placements).filter(([_, cell]) =>
    hint.row !== null ? cell.row === hint.row : cell.col === hint.col
  );
  if (hint.type === 'total') return lineTokens.length === hint.value;
  if (hint.type === 'H1') return lineTokens.filter(([tid]) => marks[tid] === 'male').length === hint.value;
  if (hint.type === 'H2') return lineTokens.filter(([tid]) => marks[tid] === 'female').length === hint.value;
  return true;
}

function checkAllPairsAdjacent(pairs, placements) {
  for (const [t1, t2] of pairs) {
    const p1 = placements[t1], p2 = placements[t2];
    if (!p1 || !p2) return false;
    if (!isAdjacent(p1, p2)) return false;
  }
  return true;
}

function checkWinV2(puzzle, placements, marks) {
  if (!puzzle) return false;
  const tokens = puzzle.tokens;

  if (Object.keys(placements).length !== tokens.length) return false;
  if (Object.keys(marks).length !== tokens.length) return false;

  // Pair gender constraint
  for (const [t1, t2] of puzzle.pairs) {
    if (!marks[t1] || !marks[t2]) return false;
    if (marks[t1] === marks[t2]) return false;
  }

  // Adjacency
  if (!checkAllPairsAdjacent(puzzle.pairs, placements)) return false;

  // Forbidden cells
  const fset = new Set(puzzle.forbiddenCells.map(([r, c]) => `${r},${c}`));
  for (const cell of Object.values(placements)) {
    if (fset.has(`${cell.row},${cell.col}`)) return false;
  }

  // Line rules (evaluated at current placement, not canonical)
  for (const rule of (puzzle.lineRules || [])) {
    if (!evaluateLineRuleRuntime(rule, placements, tokens, marks)) return false;
  }

  // Count hints
  for (const hint of (puzzle.countHints || [])) {
    if (!evaluateCountHintRuntime(hint, placements, tokens, marks)) return false;
  }

  // Fixed tiles must retain position + species + gender
  for (const ft of (puzzle.fixedCells || [])) {
    const tokenAtCell = Object.entries(placements).find(([_, p]) =>
      p.row === ft.row && p.col === ft.col
    );
    if (!tokenAtCell) return false;
    const [tid] = tokenAtCell;
    const t = tokens.find(t => t.id === tid);
    if (!t || t.animalId !== ft.animalId) return false;
    if (marks[tid] !== ft.gender) return false;
  }

  return true;
}

function BadgeTooltip({ show, text, anchorRef }) {
  // Portal-rendered tooltip anchored via getBoundingClientRect — escapes any
  // overflow clipping from parent containers and auto-flips when too close
  // to the viewport top.
  const [pos, setPos] = useState(null);
  useEffect(() => {
    if (!show || !anchorRef || !anchorRef.current) { setPos(null); return; }
    const update = () => {
      const el = anchorRef.current;
      if (!el) return;
      const r = el.getBoundingClientRect();
      const vw = window.innerWidth;
      const cx = r.left + r.width / 2;
      const preferredTop = r.top - 8;
      const flipBelow = preferredTop < 40; // flip to below if too close to top
      setPos({ cx, top: flipBelow ? r.bottom + 8 : r.top - 8, flip: flipBelow, vw });
    };
    update();
    window.addEventListener('resize', update);
    window.addEventListener('scroll', update, true);
    return () => {
      window.removeEventListener('resize', update);
      window.removeEventListener('scroll', update, true);
    };
  }, [show, anchorRef]);

  if (!show || !pos) return null;
  // Clamp horizontal position so tooltip stays inside viewport with 8px margin
  const EDGE = 8;
  const MAX_TIP_W = Math.min(260, pos.vw - EDGE * 2);
  // We render as translate(-50%,0); clamp the center coordinate so translated
  // box fits within [EDGE, vw - EDGE]
  const halfW = MAX_TIP_W / 2;
  const clampedCx = Math.max(EDGE + halfW, Math.min(pos.vw - EDGE - halfW, pos.cx));
  const arrowOffset = pos.cx - clampedCx; // how far the arrow sits from tip center

  return ReactDOM.createPortal(
    <div role="tooltip" style={{
      position: 'fixed',
      left: clampedCx,
      top: pos.top,
      zIndex: 1000,
      background: 'var(--ink-primary)', color: 'var(--bg-paper)',
      padding: '6px 10px', borderRadius: 4,
      fontSize: 12, fontWeight: 500, lineHeight: 1.35,
      letterSpacing: '0.01em',
      maxWidth: MAX_TIP_W,
      whiteSpace: 'normal', textAlign: 'center',
      boxShadow: '0 4px 14px -4px rgba(0,0,0,0.25)',
      animation: 'badgeTipFade 120ms cubic-bezier(0.4,0,0.2,1)',
      transform: pos.flip ? 'translate(-50%, 0)' : 'translate(-50%, -100%)',
      pointerEvents: 'none',
    }} className="font-body">
      {text}
      <span aria-hidden style={{
        position: 'absolute',
        [pos.flip ? 'bottom' : 'top']: '100%',
        left: `calc(50% + ${arrowOffset}px)`,
        transform: 'translateX(-50%)',
        width: 0, height: 0,
        borderLeft: '5px solid transparent', borderRight: '5px solid transparent',
        ...(pos.flip
          ? { borderBottom: '5px solid var(--ink-primary)' }
          : { borderTop: '5px solid var(--ink-primary)' }),
      }} />
    </div>,
    document.body
  );
}

// ─────────────────────────────────────────────────────────────────
// Global Tooltip Singleton — only ONE badge tooltip is open at a time.
// Prevents stale/stacked tooltips when user rapidly taps multiple badges.
// ─────────────────────────────────────────────────────────────────
const __tooltipBus = (() => {
  const listeners = new Set();
  let activeId = null;
  let nextId = 1;
  return {
    register(fn) { listeners.add(fn); return () => listeners.delete(fn); },
    claim() { return nextId++; },
    open(id) {
      activeId = id;
      listeners.forEach(fn => fn(activeId));
    },
    close(id) {
      if (activeId === id || id == null) {
        activeId = null;
        listeners.forEach(fn => fn(activeId));
      }
    },
    getActive() { return activeId; },
  };
})();

// Global outside-tap listener — closes any open tooltip when user taps
// something that isn't a badge. Installed once.
if (typeof window !== 'undefined' && !window.__badgeTooltipGlobalInstalled) {
  window.__badgeTooltipGlobalInstalled = true;
  window.addEventListener('pointerdown', (ev) => {
    // If the pointer lands on a badge element, that badge's own handler
    // will claim the tip. Otherwise close whatever is open.
    if (!(ev.target && ev.target.closest && ev.target.closest('[data-badge-tip="1"]'))) {
      __tooltipBus.close(null);
    }
  }, { capture: true, passive: true });
}

function useBadgeTooltip() {
  const [open, setOpen] = useState(false);
  const idRef = useRef(null);
  const timerRef = useRef(null);
  const activePointerRef = useRef(null);
  const anchorRef = useRef(null);
  const touchFlowRef = useRef(false);

  if (idRef.current == null) idRef.current = __tooltipBus.claim();

  // Subscribe to bus — close this tip whenever another badge claims the bus
  useEffect(() => {
    return __tooltipBus.register((activeId) => {
      if (activeId !== idRef.current) {
        if (timerRef.current) { clearTimeout(timerRef.current); timerRef.current = null; }
        setOpen(false);
        activePointerRef.current = null;
      }
    });
  }, []);

  const clearTimer = () => {
    if (timerRef.current) { clearTimeout(timerRef.current); timerRef.current = null; }
  };

  const hide = useCallback(() => {
    clearTimer();
    setOpen(false);
    activePointerRef.current = null;
    __tooltipBus.close(idRef.current);
    setTimeout(() => { touchFlowRef.current = false; }, 400);
  }, []);

  // Mouse hover path
  const show = useCallback(() => {
    clearTimer();
    __tooltipBus.open(idRef.current);
    setOpen(true);
  }, []);

  // Click / keyboard path — auto-dismiss. Bail if a touch flow is active.
  const showTimed = useCallback(() => {
    if (touchFlowRef.current) return;
    clearTimer();
    __tooltipBus.open(idRef.current);
    setOpen(true);
    timerRef.current = setTimeout(() => {
      setOpen(false);
      __tooltipBus.close(idRef.current);
    }, 2500);
  }, []);

  // Touch path — opens on pointerdown, closes on up/cancel OR when finger
  // moves outside the anchor's bounding rect.
  const beginTouch = useCallback((e, el) => {
    anchorRef.current = el;
    activePointerRef.current = e.pointerId;
    touchFlowRef.current = true;
    try { el.releasePointerCapture(e.pointerId); } catch (err) {}
    clearTimer();
    __tooltipBus.open(idRef.current);
    setOpen(true);
  }, []);

  useEffect(() => {
    if (!open || activePointerRef.current == null) return;

    const onMove = (ev) => {
      if (ev.pointerId !== activePointerRef.current) return;
      const el = anchorRef.current;
      if (!el) return;
      const r = el.getBoundingClientRect();
      const inside = ev.clientX >= r.left && ev.clientX <= r.right
                   && ev.clientY >= r.top  && ev.clientY <= r.bottom;
      if (!inside) hide();
    };
    const onEnd = (ev) => {
      if (ev.pointerId !== activePointerRef.current) return;
      hide();
    };

    window.addEventListener('pointermove', onMove, { passive: true });
    window.addEventListener('pointerup', onEnd, { passive: true });
    window.addEventListener('pointercancel', onEnd, { passive: true });
    return () => {
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onEnd);
      window.removeEventListener('pointercancel', onEnd);
    };
  }, [open, hide]);

  useEffect(() => () => clearTimer(), []);
  return { open, show, hide, showTimed, beginTouch };
}

function LineRuleBadge({ rule, ok, status, compact, iconOnly, slotW, slotH }) {
  const t = useT();
  let icon, label;
  if (rule.dim === 'gender') {
    icon = rule.val === 'male' ? '♂' : '♀';
    label = t(rule.val === 'male' ? 'gender.male' : 'gender.female');
  } else {
    icon = ATTR_ICON[rule.val] || '•';
    label = translateValue(rule.val, t);
  }
  const tip = useBadgeTooltip();
  const anchorRef = useRef(null);
  const tipText = t('linerule.tip', { label });
  // Label visibility:
  //   - Tiny phone (iconOnly): NEVER show label (emoji-only).
  //   - Otherwise: show label for habitat AND diet (gender stays as ♂/♀ glyph).
  // Adaptive sizing below will auto-fall-back to icon-only if text doesn't fit.
  const showLabel = !iconOnly && (rule.dim === 'habitat' || rule.dim === 'diet');
  // Slot footprint
  const fallback = iconOnly ? 26 : (compact ? 28 : 32);
  const W = slotW || fallback;
  const H = slotH || fallback;
  // Resolve effective state: prefer `status` (4-state) over legacy `ok` boolean
  const effState = status || (ok ? 'satisfied' : 'empty');
  // Style by effective state — green for satisfied, red for bad, neutral otherwise
  const styleMap = (() => {
    if (effState === 'satisfied') {
      return { bg: 'rgba(22, 163, 74, 0.14)', border: '1px solid rgba(22, 163, 74, 0.65)', color: '#15803D', iconColor: '#15803D', weight: 600, shadow: '0 0 0 2px rgba(22, 163, 74, 0.08)' };
    }
    if (effState === 'bad') {
      return { bg: 'rgba(220, 38, 38, 0.14)', border: '1px solid rgba(220, 38, 38, 0.65)', color: 'var(--danger)', iconColor: 'var(--danger)', weight: 600, shadow: '0 0 0 2px rgba(220, 38, 38, 0.08)' };
    }
    // empty / partial → idle neutral
    return { bg: 'var(--bg-card)', border: '1px solid var(--border-medium)', color: 'var(--ink-secondary)', iconColor: 'var(--ink-primary)', weight: 500, shadow: 'none' };
  })();
  // Adaptive text sizing: shrink label font when slot width is tight.
  const textBudget = Math.max(0, W - 14 - 4 - 8);
  const labelFontSize = showLabel
    ? Math.max(9, Math.min(12, Math.floor(textBudget / Math.max(2, label.length) * 1.6)))
    : 0;
  const labelFits = !showLabel || (labelFontSize * label.length * 0.62 <= textBudget);
  const showLabelFinal = showLabel && labelFits;
  return (
    <div
      ref={anchorRef}
      data-badge-tip="1"
      role="button" tabIndex={0}
      aria-label={t('linerule.aria', { tip: tipText, ok: effState === 'satisfied' })}
      onPointerEnter={(e) => { if (e.pointerType === 'mouse') tip.show(); }}
      onPointerLeave={(e) => { if (e.pointerType === 'mouse') tip.hide(); }}
      onPointerDown={(e) => { if (e.pointerType !== 'mouse') tip.beginTouch(e, e.currentTarget); }}
      onClick={(e) => { if (!e.pointerType || e.pointerType === 'mouse') tip.showTimed(); }}
      onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tip.showTimed(); } }}
      style={{
        width: W,
        height: H,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        gap: showLabelFinal ? 3 : 0,
        padding: showLabelFinal ? '0 4px' : 0,
        background: styleMap.bg, border: styleMap.border, borderRadius: 4,
        color: styleMap.color,
        transition: 'all 220ms cubic-bezier(0.4,0,0.2,1)',
        position: 'relative', flexShrink: 0,
        boxShadow: styleMap.shadow,
        cursor: 'help',
        whiteSpace: 'nowrap',
        overflow: 'hidden',
      }}>
      <span style={{
        fontSize: showLabelFinal
          ? Math.max(12, Math.round(H * 0.5))
          : Math.max(15, Math.round(H * 0.62)),
        fontFamily: rule.dim === 'gender' ? "'Fraunces', serif" : 'inherit',
        fontWeight: styleMap.weight,
        color: styleMap.iconColor,
        lineHeight: 1,
        display: 'block',
        flexShrink: 0,
      }} aria-hidden>{icon}</span>
      {showLabelFinal && (
        <span className="font-display" style={{
          fontSize: labelFontSize,
          fontWeight: styleMap.weight,
          color: styleMap.color,
          lineHeight: 1,
          letterSpacing: '-0.02em',
          minWidth: 0,
          overflow: 'hidden',
          textOverflow: 'ellipsis',
          whiteSpace: 'nowrap',
        }}>{label}</span>
      )}
      <BadgeTooltip show={tip.open} text={tipText} anchorRef={anchorRef} />
    </div>
  );
}

// Generic "one specimen" glyph used as the universal animal-count unit.
// Replaces the localized "마리 / 只 / 匹 / ct" word AND the species-biased
// pawprint. Drawn as an abstract head-on-body silhouette — neutral across
// mammal / bird / reptile / fish / insect — to read as "one organism" without
// implying any particular taxonomic class. `currentColor` so it inherits the
// badge's state color (idle ink, gold for met, red for over).
function CreatureIcon({ size = 12, style }) {
  // viewBox tightened horizontally (4 → 20 instead of 0 → 24) so the glyph
  // sits flush within its box, letting it align on the same optical rhythm
  // as the ♂/♀ characters next to the count number.
  return (
    <svg
      viewBox="4 0 16 24"
      width={(size * 16) / 24}
      height={size}
      aria-hidden="true"
      focusable="false"
      style={{ display: 'block', flexShrink: 0, ...style }}
    >
      {/* head — small circle, sits above-left for a hint of profile */}
      <circle cx="12" cy="6.5" r="3.2" fill="currentColor" />
      {/* body — rounded trapezoid / dome, anchors as a single being.
          Wider at the bottom, narrows where it meets the head. */}
      <path
        d="M5.2 20.5
           C 5.2 16.8, 7.8 11.5, 12 11.5
           C 16.2 11.5, 18.8 16.8, 18.8 20.5
           C 18.8 21.0, 18.4 21.3, 17.9 21.3
           L 6.1 21.3
           C 5.6 21.3, 5.2 21.0, 5.2 20.5 Z"
        fill="currentColor"
      />
    </svg>
  );
}

function CountHintBadge({ hint, currentValue, ok, over, compact, iconOnly, paired, pairedSize }) {
  const t = useT();
  const isTotal = hint.type === 'total';
  const kind = isTotal ? null : (hint.type === 'H1' ? '♂' : '♀');
  // Size strategy — RIGID across solo and paired states:
  //   Whether one count badge is shown alone or two are paired side-by-side,
  //   each individual badge uses the SAME compact dimensions and font sizes.
  //   This keeps both rows (rule row + count row) aligned cell-for-cell.
  //   `paired` arg is kept for backwards compat but no longer changes geometry.
  const size = pairedSize
    ? pairedSize
    : (iconOnly ? 26 : (compact ? 28 : 32));
  const widthPx = size;
  const kindLabel = t(hint.type === 'total' ? 'count.kind.total' : hint.type === 'H1' ? 'count.kind.male' : 'count.kind.female');
  const tip = useBadgeTooltip();
  const anchorRef = useRef(null);
  const tipText = t('count.tip', { kind: kindLabel, n: hint.value, over, ok });
  const state = over ? 'over' : (ok ? 'ok' : 'idle');
  const styleMap = {
    over: { bg: 'rgba(220, 38, 38, 0.14)', border: '1px solid rgba(220, 38, 38, 0.65)', color: 'var(--danger)', weight: 700, shadow: '0 0 0 2px rgba(220, 38, 38, 0.08)' },
    ok:   { bg: 'rgba(22, 163, 74, 0.14)', border: '1px solid rgba(22, 163, 74, 0.65)', color: '#15803D', weight: 700, shadow: '0 0 0 2px rgba(22, 163, 74, 0.08)' },
    idle: { bg: 'var(--bg-card)', border: '1px solid var(--border-medium)', color: 'var(--ink-primary)', weight: 600, shadow: 'none' },
  }[state];
  return (
    <div
      ref={anchorRef}
      data-badge-tip="1"
      role="button" tabIndex={0}
      aria-label={t('count.aria', { kind: kindLabel, n: hint.value, ok, over })}
      onPointerEnter={(e) => { if (e.pointerType === 'mouse') tip.show(); }}
      onPointerLeave={(e) => { if (e.pointerType === 'mouse') tip.hide(); }}
      onPointerDown={(e) => { if (e.pointerType !== 'mouse') tip.beginTouch(e, e.currentTarget); }}
      onClick={(e) => { if (!e.pointerType || e.pointerType === 'mouse') tip.showTimed(); }}
      onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tip.showTimed(); } }}
      style={{
        minWidth: size, width: widthPx, height: size,
        display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 1,
        background: styleMap.bg, border: styleMap.border, borderRadius: 4,
        color: styleMap.color,
        padding: '0 2px',
        transition: 'all 220ms', position: 'relative', flexShrink: 0,
        boxShadow: styleMap.shadow,
        lineHeight: 1,
        cursor: 'help',
      }}>
        <span className="font-mono" style={{
          fontSize: iconOnly ? 13 : (compact ? 14 : 15),
          fontWeight: styleMap.weight, lineHeight: 1,
          fontVariantNumeric: 'tabular-nums',
          display: 'block',
        }}>{hint.value}</span>
        {isTotal ? (
          <CreatureIcon
            size={iconOnly ? 14 : (compact ? 15 : 17)}
            style={{ opacity: 0.82 }}
          />
        ) : kind && (
          <span style={{
            fontFamily: "'Fraunces', serif",
            fontSize: iconOnly ? 11 : (compact ? 12 : 13),
            fontWeight: styleMap.weight,
            lineHeight: 1,
            opacity: 0.9,
            display: 'block',
            position: 'relative',
            top: -1,
          }} aria-hidden>{kind}</span>
        )}
      <BadgeTooltip show={tip.open} text={tipText} anchorRef={anchorRef} />
    </div>
  );
}

function animalImgSrc(animalId, gender) {

function AttributeOverlay({ animal, cellSize, anchorRef }) {
  // On very narrow mobile viewports (< 420px), render as a portal-based
  // floating popover above/below the tile — the cell is too small to fit
  // the full name without clipping. On wider viewports, fall back to the
  // original inset overlay which sits inside the cell.
  const [isNarrow, setIsNarrow] = useState(() =>
    typeof window !== 'undefined' && window.innerWidth < 420
  );
  useEffect(() => {
    const onResize = () => setIsNarrow(window.innerWidth < 420);
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);

  if (isNarrow) return <AttributeOverlayFloating animal={animal} anchorRef={anchorRef} />;
  return <AttributeOverlayInset animal={animal} cellSize={cellSize} />;
}

function AttributeOverlayFloating({ animal, anchorRef }) {
  // Portal-rendered floating popover — positioned above the tile with
  // automatic flip to below when near the top edge. Escapes cell overflow
  // clipping so the animal name never gets cut off on narrow mobile.
  const t = useT();
  const { lang } = useLang();
  const animalName = getAnimalName(animal.id, lang) || animal.name;
  const [pos, setPos] = useState(null);
  useEffect(() => {
    if (!anchorRef || !anchorRef.current) { setPos(null); return; }
    const update = () => {
      const el = anchorRef.current;
      if (!el) return;
      const r = el.getBoundingClientRect();
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const cx = r.left + r.width / 2;
      const spaceAbove = r.top;
      const spaceBelow = vh - r.bottom;
      const flipBelow = spaceAbove < 90 && spaceBelow > spaceAbove;
      setPos({ cx, top: flipBelow ? r.bottom + 6 : r.top - 6, flip: flipBelow, vw });
    };
    update();
    window.addEventListener('resize', update);
    window.addEventListener('scroll', update, true);
    return () => {
      window.removeEventListener('resize', update);
      window.removeEventListener('scroll', update, true);
    };
  }, [anchorRef]);

  if (!pos) return null;
  const EDGE = 8;
  const MAX_W = Math.min(200, pos.vw - EDGE * 2);
  const halfW = MAX_W / 2;
  const clampedCx = Math.max(EDGE + halfW, Math.min(pos.vw - EDGE - halfW, pos.cx));
  const arrowOffset = pos.cx - clampedCx;

  return ReactDOM.createPortal(
    <div style={{
      position: 'fixed',
      left: clampedCx, top: pos.top,
      transform: pos.flip ? 'translate(-50%, 0)' : 'translate(-50%, -100%)',
      zIndex: 1000, pointerEvents: 'none',
      minWidth: 120, maxWidth: MAX_W,
      display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
      background: 'var(--bg-paper)',
      border: '1px solid var(--border-medium)',
      borderRadius: 6, padding: '8px 10px',
      boxShadow: '0 8px 24px -6px rgba(0,0,0,0.25)',
      animation: 'badgeTipFade 160ms cubic-bezier(0.4,0,0.2,1)',
    }} className="font-body">
      <div className="font-display" style={{
        fontSize: 14, fontWeight: 600, color: 'var(--ink-primary)',
        marginBottom: 6, letterSpacing: '-0.01em',
        textAlign: 'center', lineHeight: 1.2,
        maxWidth: '100%',
      }}>{animalName}</div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 4, alignItems: 'stretch', width: '100%' }}>
        <div style={{
          display: 'flex', alignItems: 'center', gap: 5,
          padding: '3px 6px', borderRadius: 3,
          background: HABITAT_TINT[animal.habitat],
          border: '1px solid var(--border-soft)',
          fontSize: 11, color: 'var(--ink-primary)', fontWeight: 500, lineHeight: 1.2,
          justifyContent: 'center',
        }}>
          <span style={{ fontSize: 13 }}>{ATTR_ICON[animal.habitat]}</span>
          <span>{translateValue(animal.habitat, t)}</span>
        </div>
        <div style={{
          display: 'flex', alignItems: 'center', gap: 5,
          padding: '3px 6px', borderRadius: 3,
          background: 'var(--bg-subtle)',
          border: '1px solid var(--border-soft)',
          fontSize: 11, color: 'var(--ink-primary)', fontWeight: 500, lineHeight: 1.2,
          justifyContent: 'center',
        }}>
          <span style={{ fontSize: 13 }}>{ATTR_ICON[animal.diet]}</span>
          <span>{translateValue(animal.diet, t)}</span>
        </div>
      </div>
      <span aria-hidden style={{
        position: 'absolute',
        [pos.flip ? 'bottom' : 'top']: '100%',
        left: `calc(50% + ${arrowOffset}px)`,
        transform: 'translateX(-50%)',
        width: 0, height: 0,
        borderLeft: '6px solid transparent', borderRight: '6px solid transparent',
        ...(pos.flip
          ? { borderBottom: '6px solid var(--border-medium)' }
          : { borderTop: '6px solid var(--border-medium)' }),
      }} />
    </div>,
    document.body
  );
}

function PlacedTile({ token, animal, gender, onClick, onDragStart, isRecent, isPartnerPulse, isFixed, cellSize, isAdjacentToPartner, onImgError, isSelected, isDraggingThis }) {
  const t = useT();
  const { lang } = useLang();
  const animalName = getAnimalName(animal.id, lang) || animal.name;
  const sym = gender === 'male' ? '♂' : gender === 'female' ? '♀' : '?';
  const symColor = gender === 'male' ? '#1E3A8A' : gender === 'female' ? '#9D174D' : 'var(--ink-tertiary)';
  const undecided = !gender;
  const tint = HABITAT_TINT[animal.habitat];
  const adjacencyBorder = isAdjacentToPartner === false ? '1.5px solid var(--danger)' : undefined;

  // Hover + long-press state for attribute overlay
  const [hoverActive, setHoverActive] = useState(false);   // only true after delay
  const [longPressed, setLongPressed] = useState(false);
  const hoverTimerRef = useRef(null);
  const pressTimerRef = useRef(null);
  const pressStartRef = useRef(null);
  const overlayMaxTimerRef = useRef(null);
  const LONG_PRESS_MS = 350;
  const HOVER_DELAY_MS = 500;
  const OVERLAY_MAX_MS = 4000; // hard ceiling — overlay can never persist longer than this

  const startHover = useCallback(() => {
    if (hoverTimerRef.current) clearTimeout(hoverTimerRef.current);
    hoverTimerRef.current = setTimeout(() => {
      setHoverActive(true);
    }, HOVER_DELAY_MS);
  }, []);

  const cancelHover = useCallback(() => {
    if (hoverTimerRef.current) {
      clearTimeout(hoverTimerRef.current);
      hoverTimerRef.current = null;
    }
    setHoverActive(false);
  }, []);

  const startPress = useCallback(() => {
    pressStartRef.current = Date.now();
    pressTimerRef.current = setTimeout(() => {
      setLongPressed(true);
    }, LONG_PRESS_MS);
  }, []);

  const cancelPress = useCallback(() => {
    if (pressTimerRef.current) {
      clearTimeout(pressTimerRef.current);
      pressTimerRef.current = null;
    }
  }, []);

  const endPress = useCallback((e) => {
    cancelPress();
    const duration = pressStartRef.current ? Date.now() - pressStartRef.current : 0;
    pressStartRef.current = null;
    // Only trigger click if press was short (normal click, not long-press) AND no drag occurred
    if (duration < LONG_PRESS_MS && !longPressed && !draggedRef.current) {
      if (onClick) onClick(e);
    }
    draggedRef.current = false;
    setLongPressed(false);
  }, [onClick, longPressed, cancelPress]);

  // Track whether pointer movement since pointerdown exceeded drag threshold
  const draggedRef = useRef(false);
  const pressStartXY = useRef({ x: 0, y: 0 });
  const DRAG_SUPPRESS_PX = 6;

  useEffect(() => {
    return () => {
      if (pressTimerRef.current) clearTimeout(pressTimerRef.current);
      if (hoverTimerRef.current) clearTimeout(hoverTimerRef.current);
      if (overlayMaxTimerRef.current) clearTimeout(overlayMaxTimerRef.current);
    };
  }, []);

  const showOverlay = hoverActive || longPressed;
  const tileRef = useRef(null);

  // SAFETY NET — global pointerup/cancel always clears the popup, even when
  // the element's own handlers were missed (iOS mouse-emulation, drag commit,
  // pointer capture transfer, etc).
  useEffect(() => {
    if (!showOverlay) return;
    // Hard ceiling — auto-dismiss after OVERLAY_MAX_MS no matter what
    if (overlayMaxTimerRef.current) clearTimeout(overlayMaxTimerRef.current);
    overlayMaxTimerRef.current = setTimeout(() => {
      setHoverActive(false);
      setLongPressed(false);
    }, OVERLAY_MAX_MS);
    const cleanup = () => {
      setHoverActive(false);
      setLongPressed(false);
      if (hoverTimerRef.current) { clearTimeout(hoverTimerRef.current); hoverTimerRef.current = null; }
      if (pressTimerRef.current) { clearTimeout(pressTimerRef.current); pressTimerRef.current = null; }
    };
    const onWinUp = () => cleanup();
    const onWinCancel = () => cleanup();
    // If user taps anywhere else, dismiss
    const onWinDown = (ev) => {
      const el = tileRef.current;
      if (!el) { cleanup(); return; }
      if (ev.target && el.contains(ev.target)) return; // tap on this tile — keep
      cleanup();
    };
    window.addEventListener('pointerup', onWinUp, true);
    window.addEventListener('pointercancel', onWinCancel, true);
    window.addEventListener('pointerdown', onWinDown, true);
    return () => {
      window.removeEventListener('pointerup', onWinUp, true);
      window.removeEventListener('pointercancel', onWinCancel, true);
      window.removeEventListener('pointerdown', onWinDown, true);
      if (overlayMaxTimerRef.current) { clearTimeout(overlayMaxTimerRef.current); overlayMaxTimerRef.current = null; }
    };
  }, [showOverlay]);

  return (
    <div
      ref={tileRef}
      onPointerDown={(e) => {
        draggedRef.current = false;
        pressStartXY.current = { x: e.clientX, y: e.clientY };
        if (onDragStart) onDragStart(e); // parent begins pointer drag
        startPress();
        cancelHover();
      }}
      onPointerMove={(e) => {
        if (draggedRef.current) return;
        const dx = e.clientX - pressStartXY.current.x;
        const dy = e.clientY - pressStartXY.current.y;
        if (Math.hypot(dx, dy) > DRAG_SUPPRESS_PX) {
          draggedRef.current = true;
          cancelPress();
          setLongPressed(false);
        }
      }}
      onMouseEnter={startHover}
      onMouseLeave={() => { cancelHover(); cancelPress(); setLongPressed(false); }}
      onPointerUp={endPress}
      onPointerCancel={() => { cancelPress(); setLongPressed(false); draggedRef.current = false; }}
      onKeyDown={(e) => {
        if ((e.key === 'Enter' || e.key === ' ') && onClick) {
          e.preventDefault();
          onClick(e);
        }
      }}
      role="button"
      tabIndex={0}
      aria-label={t('tile.aria', {
        name: animalName,
        gender: gender ? t(gender === 'male' ? 'gender.male' : 'gender.female') : '',
        fixed: isFixed,
        bad: isAdjacentToPartner === false,
      })}
      style={{
        width: cellSize, height: cellSize, borderRadius: 4,
        background: isFixed ? 'var(--bg-fixed)' : 'var(--bg-card)',
        border: isSelected
          ? '2px solid var(--accent-gold)'
          : (isAdjacentToPartner === false ? '1.5px dashed var(--danger)' : (isRecent ? '1.5px solid var(--ink-primary)' : '1px solid var(--border-soft)')),
        boxShadow: isSelected ? '0 0 0 3px rgba(180,83,9,0.25)' : (isPartnerPulse ? '0 0 0 4px rgba(180,83,9,0.22)' : '0 1px 2px rgba(0,0,0,0.04)'),
        cursor: isFixed ? 'default' : 'grab',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        position: 'relative', overflow: 'hidden', userSelect: 'none',
        transition: 'box-shadow 300ms, border 180ms',
        animation: isRecent ? 'cellResolve 320ms cubic-bezier(0.4,0,0.2,1)' : 'none',
        opacity: isDraggingThis ? 0.35 : 1,
        touchAction: 'none',
      }}
    >
      <div style={{ position: 'absolute', inset: 0, background: tint, opacity: 0.22, pointerEvents: 'none' }} />
      <div style={{ position: 'relative', width: '82%', height: '82%', opacity: undecided ? 0.5 : 1, filter: undecided ? 'grayscale(0.7)' : 'none', transition: 'opacity 220ms, filter 220ms', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        <img
          src={animalImgSrc(animal.id, gender)}
          alt={animalName}
          draggable={false}
          onError={(e) => { e.target.style.display = 'none'; e.target.nextElementSibling.style.display = 'flex'; }}
          style={{ width: '100%', height: '100%', objectFit: 'contain', pointerEvents: 'none' }}
        />
        <div style={{ display: 'none', width: '100%', height: '100%', alignItems: 'center', justifyContent: 'center', fontSize: cellSize * 0.48 }}>
          {animal.emoji}
        </div>
      </div>
      {undecided && !showOverlay && (
        <div className="font-display" style={{ position: 'absolute', fontSize: cellSize * 0.38, color: 'var(--accent-gold)', fontWeight: 500, fontStyle: 'italic', textShadow: '0 1px 2px rgba(255,255,255,0.8)' }}>?</div>
      )}
      {gender && !showOverlay && (
        <div className="font-display" style={{
          position: 'absolute', bottom: 3, right: 4, fontSize: cellSize * 0.22, color: symColor,
          background: 'var(--bg-card)', borderRadius: 2,
          width: cellSize * 0.26, height: cellSize * 0.26, display: 'flex', alignItems: 'center', justifyContent: 'center',
          border: '1px solid var(--border-soft)', lineHeight: 1, fontWeight: 500,
        }}>{sym}</div>
      )}
      {isFixed && !showOverlay && (
        <>
          {/* Subtle hatch — even fainter so the fixed tile reads as "natural", not striped */}
          <svg aria-hidden width="100%" height="100%" style={{ position: 'absolute', inset: 0, pointerEvents: 'none', opacity: 0.035 }}>
            <defs>
              <pattern id={`fixedHatch-${token.id}`} width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
                <line x1="0" y1="0" x2="0" y2="6" stroke="#78716C" strokeWidth="1.2" />
              </pattern>
            </defs>
            <rect width="100%" height="100%" fill={`url(#fixedHatch-${token.id})`} />
          </svg>
          {/* Top-left red dot — subtle "locked" indicator */}
          <div title={t('tile.fixed')} aria-hidden style={{
            position: 'absolute', top: 4, left: 4,
            width: 6, height: 6, borderRadius: 999,
            background: '#DC2626',
            boxShadow: '0 0 0 1.5px rgba(255,255,255,0.85)',
          }} />
        </>
      )}
      {showOverlay && <AttributeOverlay animal={animal} cellSize={cellSize} anchorRef={tileRef} />}
    </div>
  );
}
